name: Inspect original sidecar worker file metadata
"on":
  push:
    branches: [qualification/sidecar-runtime-original-files]
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify original-only reader and fixture
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/sidecar-worker-files"
          mkdir -p "$root"
          cp .github/qualification/sidecar-review/original-files.py "$root/"
          cd "$root"
          sha256sum --check <<'SUMS'
          e62ab1950467d8ef3e3379d755604cf00ece729bdc2f4158f2bf756d6891e535  original-files.py
          SUMS
      - name: Read only the authenticated original archive
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          cd "$RUNNER_TEMP/sidecar-worker-files"
          python3 original-files.py
      - name: Publish only the bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidecar-worker-files-verdict
          path: ${{ runner.temp }}/sidecar-worker-files/verdict.json
          if-no-files-found: error
          retention-days: 14
