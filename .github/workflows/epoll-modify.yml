name: Epoll MOD comparison

"on":
  push:
    branches: [qualification/epoll-modify-actions]

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the frozen request and original collector
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/epoll-modify"
          mkdir -p "$root/task"
          cp .github/qualification/epoll-modify/{request.json,plan.json,submit.py} "$root/task/"
          cp .github/qualification/epoll-modify/receipt.py "$root/"
          cd "$root"
          src=https://raw.githubusercontent.com/tamird/gvisor/c90f4b72db82f87d279d9aa02c9009f96981d9f3/test/rbe
          for module in qualification_report.py unit_matrix.py; do
            curl --fail --silent --show-error --proto '=https' --max-time 45 "$src/$module" -o "$module"
          done
          sha256sum --check <<'SUMS'
          0afa620e3bf96f21b6bf806edd7cebc18fa53cb9b039ea141a63c9f4f82bee31  qualification_report.py
          209f47696a8c28e0072a6199d40f85edb855e656195189741ba4cb6215246a37  unit_matrix.py
          1c9a596c50fc5a2e8e63cb525e9e87e5f4ef1ef2d45c994d9ecbd150a51e5887  receipt.py
          fbd653480396cc04fbac1b6ea52222516818364b2d3166cdc85d75f69bf4dfb0  task/request.json
          09c0f67b2f36e05d1252913363120ec503c62b89e098bcd46bc0f8fea20ca446  task/plan.json
          b51673da24bab0e6d9bd817d7578fb76669b91f543d228d447cd5fbb2fd39ca3  task/submit.py
          SUMS
      - name: Submit once and collect the original result
        shell: python
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          import os, runpy
          from pathlib import Path
          key = os.environ.pop("BUILDBUDDY_API_KEY")
          runpy.run_path(str(Path(os.environ["RUNNER_TEMP"]) / "epoll-modify" / "receipt.py"))["collect"](key)
      - name: Publish only the bounded verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: epoll-modify-receipt
          path: ${{ runner.temp }}/epoll-modify/verdict.json
          if-no-files-found: error
          retention-days: 14
