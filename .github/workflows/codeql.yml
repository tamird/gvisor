name: CodeQL

"on":
  schedule:
    # Daily at 1:00 UTC.
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go', 'javascript', 'python', 'ruby' ]

    steps:
    - name: Check the Remote Bazel credential
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: ': "${BUILDBUDDY_API_KEY:?Configure the BUILDBUDDY_API_KEY repository secret}"'

    - name: Checkout the analyzed commit
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Download the pinned BuildBuddy CLI
      shell: bash
      run: |
        curl --fail --silent --show-error --location --max-time 120 \
          https://github.com/buildbuddy-io/bazel/releases/download/5.0.488/bazel-5.0.488-linux-x86_64 \
          --output "$RUNNER_TEMP/bb"
        printf '%s  %s\n' \
          f0d85b1514f784dc25705dd3bbeeaa1e603b5449f721c26add0245198f03e7cb \
          "$RUNNER_TEMP/bb" | sha256sum --check --strict
        chmod +x "$RUNNER_TEMP/bb"

    - name: Analyze sources on Remote Bazel
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        GIT_REPO_DEFAULT_BRANCH: master
      run: |
        # A direct remote build downloads the declared SARIF file into bb-out.
        exec "$RUNNER_TEMP/bb" remote \
          --run_from_commit="$GITHUB_SHA" \
          --os=linux --arch=amd64 \
          --runner_exec_properties=EstimatedCPU=4 \
          --runner_exec_properties=EstimatedMemory=16GB \
          --runner_exec_properties=EstimatedFreeDiskBytes=60GB \
          --timeout=30m --disable_retry \
          build --config=rbe-matrix //tools/codeql:${{ matrix.language }}

    - name: Upload CodeQL results
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      with:
        # Upload separately so one failed language does not hide the others.
        # Combining CodeQL reports would run its merge command on this runner.
        # https://github.com/github/codeql-action/blob/2892aa5e1/src/upload-lib.ts#L98-L101
        sarif_file: bb-out
