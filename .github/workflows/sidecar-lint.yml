name: Read original sidecar prerequisite diagnostics
"on":
  push:
    branches: [qualification/sidecar-lint-91556820]
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify original-only reader and fixture
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/sidecar-lint"
          mkdir -p "$root"
          cp .github/qualification/sidecar-review/lint.py "$root/"
          cd "$root"
          sha256sum --check <<'SUMS'
          33df66bf0b093f86c2e6795c1886f1b41d3ff6fb2573dbd704687d17a5c52eb8  lint.py
          SUMS
      - name: Read only the authenticated original archive
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          cd "$RUNNER_TEMP/sidecar-lint"
          python3 lint.py
      - name: Publish only the bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidecar-lint-verdict
          path: ${{ runner.temp }}/sidecar-lint/verdict.json
          if-no-files-found: error
          retention-days: 14
