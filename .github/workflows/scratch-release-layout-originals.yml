name: Read the original sparse-write Linux packets
on:
  push:
    branches: [qualification/tcp-linux-original-format-43474d02]
permissions:
  contents: read
  actions: read
jobs:
  read:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Verify the existing reader and original socket result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = eac329b2406a7d71093b306fe6ab7f683a1e49de
          test "$(git rev-parse HEAD^^)" = d66cc79f194a3341766fc69c2822f18c09a3f737
          printf '%s  %s\n' e802e3f9b6355cec88671b4559bd94e5ec8fc9e8e2ec7b3306a4b05e5fc79d88 test/rbe/tcp_linux_original.py | sha256sum --check --strict
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/tamird/gvisor/06a76f6dfeaba805da47e6bbdde6b6346eb5574b/test/rbe/release_layout_check/original.py -o "$RUNNER_TEMP/original_reader.py"
          printf '%s  %s\n' e885b4d78cdc1b4b18f98dce2c7e21912ed9cdfc0ad457d0360fedffb623a3ce "$RUNNER_TEMP/original_reader.py" | sha256sum --check --strict
          gh run download 40817072728 -R tamird/gvisor -n linux-window-usage -D "$RUNNER_TEMP/socket"
      - name: Fetch only the original declared packet output
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: PYTHONPATH="$RUNNER_TEMP" python3 test/rbe/tcp_linux_original.py transfer
      - name: Join the normalized packet observations to the original four socket results
        run: python3 test/rbe/tcp_linux_original.py summarize
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-window-packets
          path: ${{ runner.temp }}/packet-summary.json
          if-no-files-found: error
