name: Read original supplier ZIP actions

"on":
  push:
    branches: [qualification/rules-pkg-zip-original-result]

permissions:
  contents: read

jobs:
  recover:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the one original archive reader
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/supplier-zip-original"
          sha256sum --check <<'SUMS'
          9d6657cc72a8d04fd6b72eb7aca2f9f46ecfe67629b944016e5c05d85c09d917  .github/qualification/supplier-zip-original/read.py
          7c211c8878c04269feb91a684480fef2e66f940f9e5785310055056f19428cb3  .github/qualification/supplier-zip-original/metadata.py
          41bedf79cfc7f6925d892a028ef8ce05d620412a9413d6c1e90844d348f055bb  .github/qualification/supplier-zip-original/plan.json
          SUMS
      - name: Read original records only
        shell: python
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          import os, runpy
          key = os.environ.pop("BUILDBUDDY_API_KEY")
          raise SystemExit(runpy.run_path(".github/qualification/supplier-zip-original/read.py")["main"](key))
      - name: Upload typed original result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supplier-zip-original
          path: ${{ runner.temp }}/supplier-zip-original/verdict.json
          if-no-files-found: error
          retention-days: 14
