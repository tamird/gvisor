name: Recheck updated TCP tail-probe reviews
on:
  push:
    branches: [qualification/tcp-tail-review-recheck]
permissions: {contents: read}
jobs:
  probe:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 2, persist-credentials: false}
    - name: Exercise TCP probe and SACK controls
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^)" = f739c6928e33658ff18e91117f97ccbc65851328
        mkdir -p "$RUNNER_TEMP/focused_platform" "$RUNNER_TEMP/focused"
        platform=$RUNNER_TEMP/focused_platform
        printf '%s\n' 'module(name="focused_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/focused.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
            'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
            'build --remote_accept_cached' \
            "build --inject_repository=focused_platform=$platform" \
            'build --host_platform=@focused_platform//:ubuntu' \
            'build --extra_execution_platforms=@focused_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        printf '%s\n' 'build:rbe --spawn_strategy=remote' >> "$rc"
        cp -r .github/qualification/tail-review "$RUNNER_TEMP/inputs"
        cd "$GITHUB_WORKSPACE"
        git fetch --no-tags --depth=1 https://github.com/google/gvisor.git 581d0bc94049f3e61feaea66f7f8375c8c4d5515
        git checkout --detach 581d0bc94049f3e61feaea66f7f8375c8c4d5515
        cat "$RUNNER_TEMP/inputs/extent.txt" >> pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test.go
        run_arm() {
          local arm=$1 filter=$2 code=0
          bazelisk --bazelrc="$rc" test --config=x86_64 --test_filter="$filter" --test_arg=-test.v \
            --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' \
            --nocache_test_results --build_event_json_file="$RUNNER_TEMP/$arm.jsonl" //pkg/tcpip/transport/tcp/test/e2e:tcp_rack_test || code=$?
          python3 -B "$RUNNER_TEMP/inputs/result.py" "$arm" "$code" "$(git rev-parse HEAD)"
        }
        run_arm sack '^(TestRACKSelectiveProbeExtent|TestRACKTLPRecoveryWithTimestamps)$'
        git restore pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test.go
        git checkout --detach f739c6928e33658ff18e91117f97ccbc65851328
        cp "$RUNNER_TEMP/inputs/probe.go.txt" pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test.go
        run_arm probe '^TestRACKTLPLostProbeRTO$'
        git apply "$RUNNER_TEMP/inputs/receive.diff"
        run_arm receive '^TestRACKTLPLostProbeRTO$'
        python3 -B "$RUNNER_TEMP/inputs/result.py" finish
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: tcp-tail-reviews
        path: ${{ runner.temp }}/review-results/
        if-no-files-found: error
