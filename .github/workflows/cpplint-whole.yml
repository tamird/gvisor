name: Check whole-repository cpplint
on:
  push:
    branches: [qualification/whole-repository-cpplint-checked]
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODE: whole
      SOURCE: f1bd58496f46f8ea9fb0c69d8eb1e4f502b6055e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: carrier, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: source, ref: '${{ env.SOURCE }}', fetch-depth: 2, persist-credentials: false}
      - name: Run the canonical lint driver
        working-directory: source
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          donor=05cf00d9d26a5beb8a9af8011375644b8b37a086
          git -C ../carrier fetch -q --depth=1 origin "$donor"
          for module in qualification_report unit_matrix; do
            git -C ../carrier show "$donor:test/rbe/$module.py" > "$RUNNER_TEMP/$module.py"
          done
          cp ../carrier/.github/qualification/cpplint-whole/check.py "$RUNNER_TEMP/check.py"
          p=$RUNNER_TEMP/lint_platform
          mkdir "$p" "$RUNNER_TEMP/bin" "$RUNNER_TEMP/cpplint-private"
          echo 'module(name="lint_platform")' > "$p/MODULE.bazel"
          cat > "$p/BUILD" <<'BUILD'
          platform(name="ubuntu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],
                   exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"oci","container-image":"docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02"}, visibility=["//visibility:public"])
          BUILD
          rc=$RUNNER_TEMP/lint.bazelrc
          umask 077
          trap 'rm -f "$rc"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=lint_platform=$p" 'build --host_platform=@lint_platform//:ubuntu' 'build --extra_execution_platforms=@lint_platform//:ubuntu' 'build --platforms=//tools/bazeldefs:linux_amd64' 'test --cache_test_results=yes' 'test --remote_download_regex=.*[/](test[.](log|xml))$' "test --build_event_json_file=$RUNNER_TEMP/cpplint/events.raw" 'test --build_event_json_file_path_conversion=false'
            echo 'run --remote_download_outputs=toplevel'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          bazel_binary=$(command -v bazel)
          cat > "$RUNNER_TEMP/bin/bazel" <<'SH'
          #!/bin/bash
          if [[ $1 == run && " $* " == *' @cpplint//:cpplint '* ]]; then
            printf '%s\0' "$@" >> "$CPPLINT_ARGS"
            printf '\n' >> "$CPPLINT_INVOCATIONS"
          fi
          exec "$CANONICAL_BAZEL" --bazelrc="$CPPLINT_RC" "$@"
          SH
          export CANONICAL_BAZEL="$bazel_binary" CPPLINT_RC="$rc"
          chmod +x "$RUNNER_TEMP/bin/bazel"
          export PATH="$RUNNER_TEMP/bin:$PATH" LINT_CACHE_DIR="$RUNNER_TEMP/cpplint-private" PYTHONDONTWRITEBYTECODE=1
          python3 "$RUNNER_TEMP/check.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cpplint-${{ env.MODE }}
          path: ${{ runner.temp }}/cpplint/result.json
          if-no-files-found: error
