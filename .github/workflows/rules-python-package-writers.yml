name: Read the original writer input roots
on:
  push:
    branches: [qualification/rules-pkg-launcher-original-inputs]
permissions:
  contents: read
jobs:
  original-launchers:
    if: github.repository == 'tamird/gvisor' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Read two original actions without running them
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B test/rbe/python_package_writers/original_launchers.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-launchers
          path: ${{ runner.temp }}/original-launchers.json
          if-no-files-found: error
