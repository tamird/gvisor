name: Qualify rules_python package writers
on:
  push:
    branches: [qualification/rules-python-catalog-original]
permissions:
  contents: read
jobs:
  original-catalog-diagnostic:
    if: github.repository == 'tamird/gvisor' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Read only the original catalog invocation
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 test/rbe/python_package_writers/read_catalog_log.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: initial-master-catalog-diagnostic
          path: ${{ runner.temp }}/original-catalog.json
