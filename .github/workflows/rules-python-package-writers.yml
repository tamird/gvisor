name: Verify the netip neighbor-cache rebase
on:
  push:
    branches: [qualification/netip-cache-lanes]
permissions: {contents: read}
jobs:
  netip:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      CURRENT: 6c48739a92438e54d1223a17f1806259d50cba17
      GRAPH: fa355a66f577b1d2e4bf24a761e956947fa727b5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {path: carrier, persist-credentials: false}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {ref: fa355a66f577b1d2e4bf24a761e956947fa727b5, path: source, fetch-depth: 3, persist-credentials: false}
    - name: Bind both inputs and the unchanged case collector
      run: |
        set -eu
        test "$(git -C source rev-parse HEAD)" = "$GRAPH"
        test "$(git -C source rev-parse HEAD^)" = "$CURRENT"
        test "$(git -C source rev-parse HEAD^^)" = "7317e2f45ed1410ff688ebaaf9c0e4ff1c7ce6e9"
        test "$(git -C source diff --name-only HEAD^ HEAD)" = pkg/state/tests/netip_test.go
        test "$(git -C carrier rev-parse HEAD:test/rbe/qualification_report.py)" = d2e3eedabc2ad911d958aa448fd916aa6835aa86
        test "$(git -C carrier rev-parse HEAD:test/rbe/unit_matrix.py)" = d01d9e319084e18ea2928671e417e1b4e86c4954
        git -C source checkout --detach "$CURRENT"
    - name: Run original package, analyzer and cache owners on both targets
      working-directory: source
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -eu -o pipefail
        for ARCH in amd64 arm64; do
          CPU=x86_64
          if test "$ARCH" = arm64; then CPU=aarch64; fi
        mkdir -p "$RUNNER_TEMP/catalog_platform_$ARCH"
        platform=$RUNNER_TEMP/catalog_platform_$ARCH
        printf '%s\n' 'module(name="catalog_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<BUILD
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:$CPU", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "$ARCH",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/catalog-$ARCH.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
            'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
            'build --remote_accept_cached' \
            "build --inject_repository=catalog_platform=$platform" \
            'build --host_platform=@catalog_platform//:ubuntu' \
            'build --extra_execution_platforms=@catalog_platform//:ubuntu' \
            "build --platforms=//tools/bazeldefs:linux_$ARCH"
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"


          python3 -B ../carrier/test/rbe/qualify_lisafs.py 15730 "$ARCH" "$CURRENT" "$rc" "$RUNNER_TEMP/netip-$ARCH" || :
        done
    - name: Replay the same netip checkpoint test through both engines
      if: ${{ !cancelled() }}
      working-directory: source
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -eu -o pipefail
        git checkout --detach "$GRAPH"
        ARCH=amd64; CPU=x86_64
        mkdir -p "$RUNNER_TEMP/catalog_platform_$ARCH"
        platform=$RUNNER_TEMP/catalog_platform_$ARCH
        printf '%s\n' 'module(name="catalog_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<BUILD
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:$CPU", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "$ARCH",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/catalog-$ARCH.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
            'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
            'build --remote_accept_cached' \
            "build --inject_repository=catalog_platform=$platform" \
            'build --host_platform=@catalog_platform//:ubuntu' \
            'build --extra_execution_platforms=@catalog_platform//:ubuntu' \
            "build --platforms=//tools/bazeldefs:linux_$ARCH"
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"


        python3 -B ../carrier/test/rbe/qualify_lisafs.py graph amd64 "$GRAPH" "$rc" "$RUNNER_TEMP/netip-graph"
    - name: Reconcile the three original verdicts
      if: always()
      run: |
        python3 - <<'CHECK'
        import json, os, pathlib, sys
        p = pathlib.Path(os.environ["RUNNER_TEMP"])
        verdict = {}
        for name in ("amd64", "arm64", "graph"):
            f = p / ("netip-" + name) / "result.json"
            verdict[name] = json.loads(f.read_text()).get("status") if f.exists() else "MISSING"
        (p/"netip-summary.json").write_text(json.dumps(verdict) + "\n")
        print(verdict)
        sys.exit(set(verdict.values()) != {"PASS"})
        CHECK
    - name: Redact the endpoint credential from all public evidence
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'REDACT'
        import os, pathlib
        key = os.environ["BB_KEY"].encode()
        assert key
        for path in pathlib.Path(os.environ["RUNNER_TEMP"]).glob("netip-*"):
            for f in ([path] if path.is_file() else [path/"result.json", *(path/"reports").rglob("*")]):
                if f.is_file() and key in (data := f.read_bytes()):
                    f.write_bytes(data.replace(key, b"[REDACTED]"))
        REDACT
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: netip-neighbor-cache
        path: |
          ${{ runner.temp }}/netip-summary.json
          ${{ runner.temp }}/netip-*/result.json
          ${{ runner.temp }}/netip-*/reports
        if-no-files-found: error
