name: Verify declared Gazelle inputs on Linux
on:
  push:
    branches: [qualification/gazelle-input-boundary-0eb8eca5b]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE: 6919ece57b8c1d10f8dca7c9fbbc2424ffec8eb6
      BASE: 3c2172c0591f599949d87858215228cb1998b965
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: carrier, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: source, ref: '${{ env.SOURCE }}', fetch-depth: 3, persist-credentials: false}
      - name: Check projected Gazelle inputs and file-inclusive wildcards
        working-directory: source
        run: python3 ../carrier/.github/qualification/lint-source/gazelle.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gazelle-qualification
          path: ${{ runner.temp }}/gazelle-qualification/
          if-no-files-found: error
