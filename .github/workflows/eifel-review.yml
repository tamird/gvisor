name: Eifel timestamp feedback comparison

"on":
  push:
    branches: [qualification/eifel-review-rbe]

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the frozen request and original collector
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/eifel-review"
          mkdir -p "$root/task"
          cp .github/qualification/eifel-review/{request.json,plan.json,entry.json,submit.py,receipt.py} "$root/task/"
          cd "$root"
          src=https://raw.githubusercontent.com/tamird/gvisor/c90f4b72db82f87d279d9aa02c9009f96981d9f3/test/rbe
          for module in qualification_report.py unit_matrix.py; do
            curl --fail --silent --show-error --proto '=https' --max-time 45 "$src/$module" -o "$module"
          done
          sha256sum --check <<'SUMS'
          0afa620e3bf96f21b6bf806edd7cebc18fa53cb9b039ea141a63c9f4f82bee31  qualification_report.py
          209f47696a8c28e0072a6199d40f85edb855e656195189741ba4cb6215246a37  unit_matrix.py
          a27a579af1dc1177c38f2a071a8cb25b32d34773b7c6a84a8dd010d05324d7f4  task/request.json
          0d5093bf5ace6df077d62f094ccef7e34d5ba045cdd5606c9008be61cbee5ae1  task/plan.json
          b668793f1ae72105f6b32bcc259c6a889e4ec5d33068c7375beeff76a1ebde54  task/entry.json
          0cfa984eb3a4cfc5ddc03f482303d8445b72b3e3741d3f430a35dc52c61cf2dd  task/submit.py
          721656c98c582099477070f3f1871156ed7609d80ae3f7da5b18a8739ac6c94b  task/receipt.py
          SUMS
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          job = Path("task")
          (job/"request.sh").write_text(json.loads((job/"request.json").read_bytes())["steps"][0]["run"])
          PYTHON
      - name: Submit once and collect the original result
        shell: python
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          import os, runpy
          from pathlib import Path
          key = os.environ.pop("BUILDBUDDY_API_KEY")
          entry = Path(os.environ["RUNNER_TEMP"]) / "eifel-review/task/receipt.py"
          runpy.run_path(str(entry))["collect"](key)
      - name: Publish only the bounded verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eifel-review-receipt
          path: ${{ runner.temp }}/eifel-review/verdict.json
          if-no-files-found: error
          retention-days: 14
