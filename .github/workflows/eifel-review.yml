name: Eifel timestamp feedback comparison

"on":
  push:
    branches: [qualification/eifel-reviewed-ack-fixture]

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the frozen request and original collector
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/eifel-review"
          mkdir -p "$root/task"
          cp .github/qualification/eifel-review/{request.json,plan.json,entry.json,submit.py,receipt.py} "$root/task/"
          cd "$root"
          src=https://raw.githubusercontent.com/tamird/gvisor/c90f4b72db82f87d279d9aa02c9009f96981d9f3/test/rbe
          for module in qualification_report.py unit_matrix.py; do
            curl --fail --silent --show-error --proto '=https' --max-time 45 "$src/$module" -o "$module"
          done
          sha256sum --check <<'SUMS'
          0afa620e3bf96f21b6bf806edd7cebc18fa53cb9b039ea141a63c9f4f82bee31  qualification_report.py
          209f47696a8c28e0072a6199d40f85edb855e656195189741ba4cb6215246a37  unit_matrix.py
          72006238b8c0040f01276f81af1c758019fcbaa841327c938ce070343130e406  task/request.json
          6c559920b26145c01f79503186989c0caf8dbfbcb79c9f1a30d0b489370c6612  task/plan.json
          49513b035df1725d3ed44397f14bae732a2885a4ea30f01a7f22482ce01db03b  task/entry.json
          b9c01b215cbb3c120ec53943e50ec20de5172d77fc0c19a5d9ad59c1372b611e  task/submit.py
          ad4fb7bb036c025020ed5a9b8fdc3ff285ad0f7cf86403c4914a2564ee578541  task/receipt.py
          SUMS
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          job = Path("task")
          (job/"request.sh").write_text(json.loads((job/"request.json").read_bytes())["steps"][0]["run"])
          PYTHON
      - name: Submit once and collect the original result
        shell: python
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          import os, runpy
          from pathlib import Path
          key = os.environ.pop("BUILDBUDDY_API_KEY")
          entry = Path(os.environ["RUNNER_TEMP"]) / "eifel-review/task/receipt.py"
          runpy.run_path(str(entry))["collect"](key)
      - name: Publish only the bounded verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eifel-review-receipt
          path: ${{ runner.temp }}/eifel-review/verdict.json
          if-no-files-found: error
          retention-days: 14
