name: Qualify legacy NaNs on ARM64 and analyze both architectures
on:
  push:
    branches: [qualification/state-signaling-nan-arm]
permissions: {contents: read}
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 4, persist-credentials: false}
      - name: Exercise ARM64 checkpointing and the owning split-architecture analyzers
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bash .github/qualification/float-fix/run-arm.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legacy-float-arm-and-analyzers
          path: ${{ runner.temp }}/results/arm.json
          if-no-files-found: warn
