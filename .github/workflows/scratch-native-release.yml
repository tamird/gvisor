name: Verify the fixed release wheel graph and canonical inventory
on:
  push:
    branches: [qualification/release-wheel-frontend]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      QUALIFICATION_COMMIT: ${{ github.sha }}
      QUALIFICATION_EXECUTION: remote-actions
      QUALIFICATION_LANES: build
      QUALIFICATION_LOCAL_TEST_REQUIREMENTS: namespace
      QUALIFICATION_CLOCK_SOURCE: calibrated
      QUALIFICATION_HEADER_BASE: ''
      QUALIFICATION_COS_SHA256: ''
      QUALIFICATION_COS_GZIP_BASE64: ''
      QUALIFICATION_TARGETS: //sandboxexec/sandbox/python:dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Prepare canonical scanner capture
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          cp -R .github/qualification/sdist "$RUNNER_TEMP/sdist-fixture"
          mkdir -p "$RUNNER_TEMP/publication"
          (umask 077; printf 'build --remote_header=x-buildbuddy-api-key=%s\nbuild --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" "$BUILDBUDDY_API_KEY" >"$RUNNER_TEMP/current-release.bazelrc")
      - name: Verify the release wheels with the canonical pip-hub scanner
        if: always()
        env:
          SCANNER_SOURCE: 83e100f6fb642971e52eae554d2cf193fb2f56fd
        run: bash "$RUNNER_TEMP/sdist-fixture/license.sh"
      - name: Exercise the wheel scanner's owning package
        if: always()
        env:
          SCANNER_SOURCE: 83e100f6fb642971e52eae554d2cf193fb2f56fd
        run: bash "$RUNNER_TEMP/sdist-fixture/scanner_test.sh"
      - name: Verify unchanged release bytes on the declared worker platforms
        if: always()
        env:
          CURRENT_PRODUCT: b5bd72431940ce903fe7521e2498811d8420f750
        run: bash "$RUNNER_TEMP/sdist-fixture/verify_selected.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-python-build
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
