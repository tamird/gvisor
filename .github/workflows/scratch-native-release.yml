name: Compare retained release tar metadata from GNU and scratch
on:
  push:
    branches: [qualification/release-wheel-frontend]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      QUALIFICATION_COMMIT: ${{ github.sha }}
      QUALIFICATION_EXECUTION: remote-actions
      QUALIFICATION_LANES: build
      QUALIFICATION_LOCAL_TEST_REQUIREMENTS: namespace
      QUALIFICATION_CLOCK_SOURCE: calibrated
      QUALIFICATION_HEADER_BASE: ''
      QUALIFICATION_COS_SHA256: ''
      QUALIFICATION_COS_GZIP_BASE64: ''
      QUALIFICATION_TARGETS: //sandboxexec/sandbox/python:dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Prepare the existing execution-log decoder and comparison
        run: |
          cp -R .github/qualification/sdist "$RUNNER_TEMP/sdist-fixture"
          git show 41fc8aeb66f31ed395f64ce2e99712704fba9122:test/rbe/qualification_report.py > "$RUNNER_TEMP/sdist-fixture/qualification_report.py"
          git show 41fc8aeb66f31ed395f64ce2e99712704fba9122:test/rbe/unit_matrix.py > "$RUNNER_TEMP/sdist-fixture/unit_matrix.py"
          curl -fsSL --retry 2 --max-time 120 https://github.com/buildbuddy-io/bazel/releases/download/5.0.488/bazel-5.0.488-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "f0d85b1514f784dc25705dd3bbeeaa1e603b5449f721c26add0245198f03e7cb  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bb"
      - name: Recover worker user, permissions and tar records
        env:
          CURRENT_PRODUCT: d095cd927271c4994799b8c71685a8664bb45891
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/publication"
          git checkout --quiet --detach "$CURRENT_PRODUCT"
          bash "$RUNNER_TEMP/sdist-fixture/current_product.sh"
      - name: Compare the original two outputs
        run: |
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/"publication"
          expected={"gnu":"78f876079b1a8e262701241241671f2a9b2c3cdbd4844b204fb504b8d6ef702b","scratch":"0cd80e496073c993a63288e4e6bb5900fb6bc77f0fbd334550d148ac68f9e079"}
          for lane,h in expected.items():
              r=json.loads((out/f"{lane}-metadata.json").read_text())
              assert r["compressed_sha256"]==h
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-wheel-metadata
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
