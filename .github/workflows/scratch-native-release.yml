name: Verify the setuptools release wheel override
on:
  push:
    branches: [qualification/release-sdist-repro]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      QUALIFICATION_COMMIT: ${{ github.sha }}
      QUALIFICATION_EXECUTION: remote-actions
      QUALIFICATION_LANES: build
      QUALIFICATION_LOCAL_TEST_REQUIREMENTS: namespace
      QUALIFICATION_CLOCK_SOURCE: calibrated
      QUALIFICATION_HEADER_BASE: ''
      QUALIFICATION_COS_SHA256: ''
      QUALIFICATION_COS_GZIP_BASE64: ''
      QUALIFICATION_TARGETS: //sandboxexec/sandbox/python:dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 4}
      - name: Recover the dependency lock from the successful release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP"/{old,row,publication}
          gh run download 40811831714 --repo tamird/gvisor --name qualification-row-amd64-remote-build-attempt-1 --dir "$RUNNER_TEMP/old"
          mapfile -t bundles < <(find "$RUNNER_TEMP/old" -name qualification.tar.gz -type f)
          (( ${#bundles[@]} == 1 ))
          printf '%s  %s\n' 7916d5664f320ca4881cff7f36a9df7c6f41d03b5923cf2a4fed3a6a02f67945 "${bundles[0]}" | sha256sum --check --strict
          tar -xzf "${bundles[0]}" -C "$RUNNER_TEMP/row"
          cp "$RUNNER_TEMP/row/MODULE.bazel.lock" MODULE.bazel.lock
      - name: Prepare the existing execution-log decoder and comparison
        run: |
          cp -R .github/qualification/sdist "$RUNNER_TEMP/sdist-fixture"
          curl -fsSL --retry 2 --max-time 120 https://github.com/buildbuddy-io/bazel/releases/download/5.0.488/bazel-5.0.488-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "f0d85b1514f784dc25705dd3bbeeaa1e603b5449f721c26add0245198f03e7cb  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bb"
      - name: Build the release artifacts through the normal wheel override
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          rc=0
          bash "$RUNNER_TEMP/sdist-fixture/run.sh" canonical 89716091b46369f5a86808954de5162b45ab18d3 || rc=$?
          mkdir -p "$RUNNER_TEMP/publication/canonical"
          echo "$rc" > "$RUNNER_TEMP/publication/canonical/stage.exit"
      - name: Resolve the clean product source with its declared rules_python
        run: |
          out="$RUNNER_TEMP/publication"
          git checkout --quiet --detach 997c27aa46247c11bd69c4d09f3589cc22010d17
          git rev-parse HEAD > "$out/product.source"
          git rev-parse HEAD^{tree} > "$out/product.tree"
          git rev-parse HEAD:tools/python_distribution/setuptools_reproducible_sdist.patch > "$out/product.patch"
          git rev-parse 89716091b46369f5a86808954de5162b45ab18d3:tools/python_distribution/setuptools_reproducible_sdist.patch | cmp - "$out/product.patch"
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          rc=0
          bazelisk query --lockfile_mode=update 'deps(//tools/python_distribution:frontend)' > "$RUNNER_TEMP/product-query.log" 2>"$RUNNER_TEMP/product-query.stderr" || rc=$?
          echo "$rc" > "$out/product.exit"
          if ((rc)); then
            sed -nE '/^(ERROR|FATAL|WARNING):/p' "$RUNNER_TEMP/product-query.stderr" | grep -viE 'header|token|secret|authorization|credential' | head -10 > "$out/product-preflight.txt" || :
          fi
      - name: Compare to the archives already installed on Python 3.7
        run: python3 "$RUNNER_TEMP/sdist-fixture/validate.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-sdist-repro
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
