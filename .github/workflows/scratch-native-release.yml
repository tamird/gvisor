name: Build c-ares without Bash on scratch workers
on:
  push:
    branches: [qualification/scratch-cares-headers]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Recover the dependency lock from the successful release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP"/{old,row,publication}
          gh run download 40811831714 --repo tamird/gvisor --name qualification-row-amd64-remote-build-attempt-1 --dir "$RUNNER_TEMP/old"
          mapfile -t bundles < <(find "$RUNNER_TEMP/old" -name qualification.tar.gz -type f)
          (( ${#bundles[@]} == 1 ))
          printf '%s  %s\n' 7916d5664f320ca4881cff7f36a9df7c6f41d03b5923cf2a4fed3a6a02f67945 "${bundles[0]}" | sha256sum --check --strict
          tar -xzf "${bundles[0]}" -C "$RUNNER_TEMP/row"
          cp "$RUNNER_TEMP/row/MODULE.bazel.lock" MODULE.bazel.lock
      - name: Recover build evidence and inspect the owning Bazel actions
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tamird/gvisor/actions/artifacts/13025534182/zip > "$RUNNER_TEMP/cares-original.zip"
          python3 test/rbe/cares_header_actions.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: c-ares-header-result
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
