name: Inventory the AMD64 scratch presubmit graph
on:
  push:
    branches: [qualification/scratch-presubmit-graph]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Recover the dependency lock from the successful release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP"/{old,row,publication}
          gh run download 40811831714 --repo tamird/gvisor --name qualification-row-amd64-remote-build-attempt-1 --dir "$RUNNER_TEMP/old"
          mapfile -t bundles < <(find "$RUNNER_TEMP/old" -name qualification.tar.gz -type f)
          (( ${#bundles[@]} == 1 ))
          printf '%s  %s\n' 7916d5664f320ca4881cff7f36a9df7c6f41d03b5923cf2a4fed3a6a02f67945 "${bundles[0]}" | sha256sum --check --strict
          tar -xzf "${bundles[0]}" -C "$RUNNER_TEMP/row"
          cp "$RUNNER_TEMP/row/MODULE.bazel.lock" MODULE.bazel.lock
      - name: Resolve additional platform inputs before freezing the build graph
        run: |
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          sha256sum --check test/rbe/stateify-source.sha256
          bazelisk mod graph --lockfile_mode=update --depth=1 --output=json > "$RUNNER_TEMP/module-graph.json"
          python3 - "$RUNNER_TEMP/row/MODULE.bazel.lock" MODULE.bazel.lock "$RUNNER_TEMP/publication/lock.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          original, prepared, receipt = map(Path, sys.argv[1:])
          before, after = (json.loads(p.read_bytes())["registryFileHashes"] for p in (original, prepared))
          changed = [key for key, value in before.items() if key in after and after[key] != value]
          assert not changed, changed
          receipt.write_text(json.dumps({"original": hashlib.sha256(original.read_bytes()).hexdigest(), "prepared": hashlib.sha256(prepared.read_bytes()).hexdigest(),
              "added_registry_hashes": len(after.keys() - before.keys()), "removed_registry_hashes": len(before.keys() - after.keys())}) + "\n")
          PY
      - name: Inventory the AMD64 first-pass build graph
        run: |
          set -euo pipefail
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          for selection in pkg runsc; do
            tags=()
            if [[ "$selection" == runsc ]]; then tags+=(--build_tag_filters=-network_plugins); fi
            bazelisk --bazelrc=test/rbe/qualification.bazelrc aquery \
              --config=rbe --config=x86_64 --remote_cache= --remote_executor= \
              --bes_backend= --experimental_remote_downloader= \
              --include_artifacts=false --include_commandline=true --output=jsonproto \
              "${tags[@]}" "deps(//$selection/...)" > "$RUNNER_TEMP/$selection.json"
          done
          python3 test/rbe/scratch_graph_inventory.py "$RUNNER_TEMP/publication" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scratch-presubmit-graph
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
