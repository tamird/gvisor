name: Build the Python release on scratch workers
on:
  push:
    branches: [qualification/release-wheel-scratch]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      QUALIFICATION_COMMIT: ${{ github.sha }}
      QUALIFICATION_EXECUTION: remote-actions
      QUALIFICATION_LANES: build
      QUALIFICATION_LOCAL_TEST_REQUIREMENTS: namespace
      QUALIFICATION_CLOCK_SOURCE: calibrated
      QUALIFICATION_HEADER_BASE: ''
      QUALIFICATION_COS_SHA256: ''
      QUALIFICATION_COS_GZIP_BASE64: ''
      QUALIFICATION_TARGETS: //sandboxexec/sandbox/python:dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Recover the dependency lock from the successful release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP"/{old,row,publication}
          gh run download 40811831714 --repo tamird/gvisor --name qualification-row-amd64-remote-build-attempt-1 --dir "$RUNNER_TEMP/old"
          mapfile -t bundles < <(find "$RUNNER_TEMP/old" -name qualification.tar.gz -type f)
          (( ${#bundles[@]} == 1 ))
          printf '%s  %s\n' 7916d5664f320ca4881cff7f36a9df7c6f41d03b5923cf2a4fed3a6a02f67945 "${bundles[0]}" | sha256sum --check --strict
          tar -xzf "${bundles[0]}" -C "$RUNNER_TEMP/row"
          cp "$RUNNER_TEMP/row/MODULE.bazel.lock" MODULE.bazel.lock
      - name: Resolve additional platform inputs before freezing the build graph
        run: |
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          sha256sum --check test/rbe/stateify-source.sha256
          bazelisk mod graph --lockfile_mode=update --depth=1 --output=json > "$RUNNER_TEMP/module-graph.json"
          python3 - "$RUNNER_TEMP/row/MODULE.bazel.lock" MODULE.bazel.lock "$RUNNER_TEMP/publication/lock.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          original, prepared, receipt = map(Path, sys.argv[1:])
          before, after = (json.loads(p.read_bytes())["registryFileHashes"] for p in (original, prepared))
          changed = [key for key, value in before.items() if key in after and after[key] != value]
          assert not changed, changed
          receipt.write_text(json.dumps({"original": hashlib.sha256(original.read_bytes()).hexdigest(), "prepared": hashlib.sha256(prepared.read_bytes()).hexdigest(),
              "added_registry_hashes": len(after.keys() - before.keys()), "removed_registry_hashes": len(before.keys() - after.keys())}) + "\n")
          PY
          curl -fsSL --retry 2 --max-time 120 https://github.com/buildbuddy-io/bazel/releases/download/5.0.488/bazel-5.0.488-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "f0d85b1514f784dc25705dd3bbeeaa1e603b5449f721c26add0245198f03e7cb  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bb"
      - name: Build the two Python distributions on each scratch architecture
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          BB_LOG_DECODER: ${{ runner.temp }}/bb
        run: |
          set -eu
          publication="$RUNNER_TEMP/publication"
          parent="$RUNNER_TEMP"
          export PUBLICATION="$publication"
          status=0
          for arch in amd64 arm64; do
            export QUALIFICATION_ARCH="$arch" RUNNER_TEMP="$parent/$arch"
            mkdir -p "$RUNNER_TEMP"
            rc=0
            bash test/rbe/actions.sh \
              --bazel-option=--host_platform=//tools/bazeldefs:rbe_linux_"$arch" \
              --bazel-option=--extra_execution_platforms=//tools/bazeldefs:rbe_linux_"$arch" \
              --bazel-option=--@rules_python//python/config_settings:bootstrap_impl=native \
              --bazel-option=--action_env=PATH=/usr/bin:/bin \
              --bazel-option=--remote_download_outputs=toplevel \
              --bazel-option=--//sandboxexec/sandbox/python:release_version=2026.10.29.2 \
              '--bazel-option=--modify_execution_info=^PythonDistribution$=+no-remote-cache' > "$RUNNER_TEMP/coordinator.log" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/coordinator.log"
            set +e
            python3 test/rbe/inspect_release_wheel.py
            inspected=$?
            set -e
            if ((rc!=0 && status==0)); then status=$rc; elif ((inspected!=0 && status==0)); then status=$inspected; fi
          done
          exit "$status"
      - name: Reconcile the two expected architecture verdicts
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          dst=Path(os.environ["RUNNER_TEMP"])/"publication"
          dst.mkdir(parents=True,exist_ok=True)
          results={a:json.loads((dst/f"{a}.json").read_text())["status"] if (dst/f"{a}.json").is_file() else "MISSING" for a in ("amd64","arm64")}
          bundle={"source":os.environ["GITHUB_SHA"],"architectures":results,"targets":["//sandboxexec/sandbox/python:dist"],"verified_at":datetime.now(timezone.utc).isoformat()}
          (dst/"summary.json").write_text(json.dumps(bundle)+"\n")
          if set(results.values())!={"PASS"}: raise SystemExit(1)
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-wheel-scratch
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
