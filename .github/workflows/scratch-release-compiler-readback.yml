name: Audit recorded release compiler executions
on:
  push:
    branches: [qualification/scratch-release-compiler-readback]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Recover the pinned original bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP"/{old,row,out}
          gh run download 40811831714 --repo tamird/gvisor --name qualification-row-amd64-remote-build-attempt-1 --dir "$RUNNER_TEMP/old"
          mapfile -t bundles < <(find "$RUNNER_TEMP/old" -type f -name qualification.tar.gz)
          (( ${#bundles[@]} == 1 ))
          printf '%s  %s\n' 7916d5664f320ca4881cff7f36a9df7c6f41d03b5923cf2a4fed3a6a02f67945 "${bundles[0]}" | sha256sum --check --strict
          tar -xzf "${bundles[0]}" -C "$RUNNER_TEMP/row"
      - name: Decode original Bazel execution log
        run: |
          curl -fsSL --retry 2 --max-time 120 https://github.com/buildbuddy-io/bazel/releases/download/5.0.488/bazel-5.0.488-linux-x86_64 -o "$RUNNER_TEMP/bb"
          printf '%s  %s\n' f0d85b1514f784dc25705dd3bbeeaa1e603b5449f721c26add0245198f03e7cb "$RUNNER_TEMP/bb" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bb"
          logs=("$RUNNER_TEMP"/row/invocation-*/execution.binpb)
          (( ${#logs[@]} == 1 ))
          "$RUNNER_TEMP/bb" print --compact_execution_log="${logs[0]}" --raw=true --sort=false > "$RUNNER_TEMP/spawns.json"
      - name: Trace the six archives to their recorded executions
        run: python3 test/rbe/release_compiler_audit.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-compiler-inventory
          path: ${{ runner.temp }}/out/inventory.json
          if-no-files-found: error
