name: Read original D-SACK comparison

"on":
  push:
    branches: [qualification/dsack-above-gap-worker-proof]

permissions:
  contents: read

jobs:
  read:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the original-only reader
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/dsack-original"
          mkdir -p "$root"
          cp .github/qualification/dsack-original/read_original.py "$root/"
          cd "$root"
          sha256sum --check <<'SUMS'
          9654c9dc6e48fa21b17a4c68682d91cc5327e5cd574f9c7abb56454e74151506  read_original.py
          SUMS
      - name: Read only the original comparison
        shell: python
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          import os, runpy
          from pathlib import Path
          runpy.run_path(str(Path(os.environ["RUNNER_TEMP"])/"dsack-original"/"read_original.py"), run_name="__main__")
      - name: Publish only the bounded report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsack-original-verdict
          path: ${{ runner.temp }}/dsack-original/verdict.json
          if-no-files-found: error
          retention-days: 14
