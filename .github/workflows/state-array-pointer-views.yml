name: Compare overlapping slice and array pointer views

"on":
  push:
    branches: [qualification/state-array-pointer-views-rbe]

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the frozen request and original collector
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/state-array-pointer-views"
          mkdir -p "$root/task"
          cp .github/qualification/state-array-pointer-views/{request.json,plan.json,entry.json,submit.py,receipt.py} "$root/task/"
          cd "$root"
          src=https://raw.githubusercontent.com/tamird/gvisor/c90f4b72db82f87d279d9aa02c9009f96981d9f3/test/rbe
          for module in qualification_report.py unit_matrix.py; do
            curl --fail --silent --show-error --proto '=https' --max-time 45 "$src/$module" -o "$module"
          done
          sha256sum --check <<'SUMS'
          0afa620e3bf96f21b6bf806edd7cebc18fa53cb9b039ea141a63c9f4f82bee31  qualification_report.py
          209f47696a8c28e0072a6199d40f85edb855e656195189741ba4cb6215246a37  unit_matrix.py
          d01a578ab4253cdfaed4b72137527973cd8b90cb6532d98134831e23d8538a63  task/request.json
          dd39118cf1def0129f7c944b48caafd9f00fa00deced023d9ea4368de3a5d779  task/plan.json
          9b5e7bb067286742ec1b2777111d0ecd91a32abe2a9bd42ad96d69debb1508d6  task/entry.json
          8f0514433a6ec54a1295ff3fb7cb23f70250703726615188091c426308d9ea2a  task/submit.py
          899a70e5a0f89f497fbbe93e521461fe587a0769bdef71f05463e5d3aea39349  task/receipt.py
          SUMS
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          job = Path("task")
          (job/"request.sh").write_text(json.loads((job/"request.json").read_bytes())["steps"][0]["run"])
          PYTHON
      - name: Submit once and collect the original result
        shell: python
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          import os, runpy
          from pathlib import Path
          key = os.environ.pop("BUILDBUDDY_API_KEY")
          entry = Path(os.environ["RUNNER_TEMP"]) / "state-array-pointer-views/task/receipt.py"
          runpy.run_path(str(entry))["collect"](key)
      - name: Publish only the bounded verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: state-array-pointer-views-receipt
          path: ${{ runner.temp }}/state-array-pointer-views/verdict.json
          if-no-files-found: error
          retention-days: 14
