name: Qualify the systrap generator relocation

on:
  push:
    branches: [qualification/systrap-offsets-tools-20261117]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4c529a8079409c05cd8a5c16133683a94fc991ba
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare the established GNU coordinator
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y g++-aarch64-linux-gnu
          mkdir -p "$RUNNER_TEMP/systrap-offsets/bin"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 \
            https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 \
            -o "$RUNNER_TEMP/systrap-offsets/bin/bazel"
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  '"$RUNNER_TEMP/systrap-offsets/bin/bazel" | sha256sum -c
          chmod +x "$RUNNER_TEMP/systrap-offsets/bin/bazel"
          echo "$RUNNER_TEMP/systrap-offsets/bin" >> "$GITHUB_PATH"
          git show HEAD^:pkg/sentry/platform/systrap/sysmsg/gen_offsets_go.sh > "$RUNNER_TEMP/systrap-offsets/original.sh"
      - name: Build both architectures and compare every exported offset
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            bazel build --config="$arch" //pkg/sentry/platform/systrap/sysmsg
            object=$(bazel cquery --config="$arch" --output=files //pkg/sentry/platform/systrap/sysmsg:sighandler_object)
            generated=$(bazel cquery --config="$arch" --output=files //pkg/sentry/platform/systrap/sysmsg:sighandler_go)
            nm=nm
            if [[ "$arch" == aarch64 ]]; then nm=aarch64-linux-gnu-nm; fi
            bash "$RUNNER_TEMP/systrap-offsets/original.sh" sighandler Sighandler "$object" "$nm" > "$RUNNER_TEMP/systrap-offsets/$arch-original.go"
            grep '^var ' "$RUNNER_TEMP/systrap-offsets/$arch-original.go" | sort > "$RUNNER_TEMP/systrap-offsets/$arch-before.txt"
            grep '^var ' "$generated" | sort > "$RUNNER_TEMP/systrap-offsets/$arch-after.txt"
            diff -u "$RUNNER_TEMP/systrap-offsets/$arch-before.txt" "$RUNNER_TEMP/systrap-offsets/$arch-after.txt"
          done
      - name: Run source lint
        id: lint
        continue-on-error: true
        run: make lint DOCKER_BUILD=false
      - name: Run C++ lint
        id: lint_cc
        continue-on-error: true
        run: make lint-cc DOCKER_BUILD=false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: systrap-offsets-comparison
          path: ${{ runner.temp }}/systrap-offsets/*.txt
          if-no-files-found: warn
      - name: Report combined result
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          LINT: ${{ steps.lint.outcome }}
          LINT_CC: ${{ steps.lint_cc.outcome }}
        run: test "$BUILD/$LINT/$LINT_CC" = success/success/success
