name: Recover original native Nogo compiler evidence
on:
  push:
    branches: [qualification/buildkite-nogo-llvm-recover]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT: f1e943169a0bfd6439a31585896f031c7314721e
      ORIGINAL: a71a698e9367395314448d19087e097087ee81ee
      CODEC: 0a9bdf9bc331d6a66f35aefcbbb5cf466eb6f7f5
      CAS_HELPER: 680739b629229eb1c8fa91aa1147d1bca71eb04f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Bind the original reader and read-only recovery
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$ORIGINAL"
          test "$(git rev-parse "$ORIGINAL^")" = "$PRODUCT"
          git diff --exit-code "$ORIGINAL" HEAD -- . ':!.github/qualification/native-nogo-placement.py' ':!.github/workflows/buildkite-native-nogo.yml'
          mkdir "$RUNNER_TEMP/nogo-receipts"
          cp .github/qualification/native-nogo-placement.py "$RUNNER_TEMP/recover.py"
          git show "$ORIGINAL:.github/qualification/native-nogo-placement.py" > "$RUNNER_TEMP/original_placement.py"
          git fetch --quiet --depth=1 origin "$CODEC" "$CAS_HELPER"
          git show "$CODEC:test/rbe/stdlib-provenance.py" > "$RUNNER_TEMP/stdlib_provenance.py"
          git show "$CAS_HELPER:test/rbe/cas_inputs.py" > "$RUNNER_TEMP/cas_inputs.py"
          command -v zstd
      - name: Recover original receipts, compact actions and ELF bytes
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 "$RUNNER_TEMP/recover.py" recover
      - name: Validate the compact public receipt independently
        id: privacy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'nogo-receipts'/'recovery.json'
          data=p.read_bytes()
          assert len(data)<4*1024*1024
          assert not any(os.environ[k].encode() in data for k in ('GH_TOKEN','BUILDBUDDY_API_KEY') if os.environ.get(k))
          assert not re.search(rb'(?:gh[pousr]_[a-zA-Z0-9]{20}|github_pat_|x-buildbuddy-api-key[=:]|Authorization:|Bearer )',data,re.I)
          value=json.loads(data)
          assert value['workload_repeated'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Original workload verified: '+str(value.get('workload_verified',False))+'\n\n')
              f.write('Original-only recovery verified: '+str(value.get('verified',False))+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: native-nogo-declared-llvm-recovery
          path: ${{ runner.temp }}/nogo-receipts/recovery.json
          if-no-files-found: error
