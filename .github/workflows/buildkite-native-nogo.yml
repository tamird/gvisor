name: Verify the local-tagged cgroup compilation
on:
  push:
    branches: [qualification/buildkite-native-nogo-inputs]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      PRODUCT: 8e13db5ad62802add68356df383e4a581e8eb303
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      NOGO_TIMEOUT: 21m
      NOGO_OWNER: //runsc/cgroup:cgroup_test_nogo
      DOCKER_BUILD: 'false'
      DOCKER_HOST: unix:///nonexistent-gvisor-builder.sock
      BUILDKITE_LABEL: ':golang: Nogo tests'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Set up the ordinary Linux Bazel client and declared GNU workers
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nogo-receipts" "$RUNNER_TEMP/gnu-platform"
          echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/nogo-receipts/verdict.json"
          test "$(git rev-parse HEAD^)" = b970b2ef96e0c6a570510d68f86eeaf488fe0a78
          git fetch -q --no-tags --depth=1 origin "$PRODUCT"
          cp .github/qualification/native-nogo.py "$RUNNER_TEMP"
          git checkout -q --detach "$PRODUCT"
          sed -n '/^install_.*bazel() {$/,$p' .buildkite/hooks/pre-command > "$RUNNER_TEMP/nogo-setup.bash"
          source "$RUNNER_TEMP/nogo-setup.bash"
          test "$(bazel --version)" = "bazel $(cat .bazelversion)"
          echo "$BUILDKITE_BAZEL_DIRECTORY" >> "$GITHUB_PATH"
          printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
          printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","EstimatedMemory":"4GB","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --strategy=GoCompilePkg=remote,local' 'test --nocache_test_results' 'build --noremote_local_fallback' 'build --remote_download_outputs=toplevel' 'build --jobs=64' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu' 'test --strategy=TestRunner=sandboxed' 'test --local_test_jobs=4'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/nogo-resources.bazelrc"
      - name: Execute the one missing cgroup analyzer and verify both target architectures
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          printf 'test --invocation_id=%s\n' "$(cat /proc/sys/kernel/random/uuid)" >> "$RUNNER_TEMP/nogo-resources.bazelrc"
          python3 "$RUNNER_TEMP/native-nogo.py"
          python3 - <<'PYQUAL'
          import json, os
          from pathlib import Path
          d = Path(os.environ["RUNNER_TEMP"])/"nogo-receipts"
          v = json.loads((d/"verdict.json").read_text())
          o = json.loads((d/"owners.json").read_text())
          label = os.environ["NOGO_OWNER"]
          assert v["verified"] and v["configured"] == v["testRunners"] == 1, v["outcome"]
          assert o["configured"] == [label] and o["completed"].get(label) is True
          assert o["summaries"] == {label: "PASSED"} and o["markers"] == {label: {"amd64": True, "arm64": True}}
          [result] = o["results"][label]
          assert result["status"] == "PASSED" and result["strategy"] == "processwrapper-sandbox" and not result["cachedLocally"], result
          PYQUAL
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cgroup-nogo-executed
          path: |
            ${{ runner.temp }}/nogo-receipts/
          if-no-files-found: error
