name: Check strict remote cgroup analysis
on:
  push:
    branches: [qualification/cgroup-nogo-strict-remote]
permissions: {contents: read}
jobs:
  cgroup:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == '1'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PRODUCT: 471d6dff5229b99208bf6fec985601067f1f9d69
      GNU: 680739b629229eb1c8fa91aa1147d1bca71eb04f
      READER: a71a698e9367395314448d19087e097087ee81ee
      PROTO: 0a9bdf9bc331d6a66f35aefcbbb5cf466eb6f7f5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Restore the original source, GNU worker and compact log reader
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git diff --name-only "$PRODUCT" HEAD)" = "$(printf '%s\n' .github/qualification/cgroup-nogo.py .github/workflows/buildkite-native-nogo.yml)"
          cp .github/qualification/cgroup-nogo.py "$RUNNER_TEMP/"
          git fetch --depth=1 origin "$GNU" "$READER" "$PROTO"
          mkdir "$RUNNER_TEMP/gnu"
          for f in BUILD.bazel MODULE.bazel; do git show "$GNU:test/rbe/gnu_platform/$f" > "$RUNNER_TEMP/gnu/$f"; done
          git show "$READER:.github/qualification/native-nogo-placement.py" > "$RUNNER_TEMP/placement.py"
          git show "$PROTO:test/rbe/stdlib-provenance.py" > "$RUNNER_TEMP/stdlib_provenance.py"
          git switch --detach "$PRODUCT"
          test -z "$(git status --porcelain)"
          test "$(cat .bazelversion)" = 8.8.1
          test "$(gcc -dumpversion)" = 11
          command -v zstd >/dev/null
      - name: Run only the two package Nogo owners
        env:
          BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$BB_KEY"
          rcfile="$RUNNER_TEMP/cgroup.bazelrc"
          trap 'rm -f "$rcfile"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\nbuild --bes_header=x-buildbuddy-api-key=%s\n' "$BB_KEY" "$BB_KEY"
          } > "$rcfile"
          unset BB_KEY
          bazel --bazelrc="$rcfile" test --config=x86_64 -c opt --jobs=24 --keep_going \
            --inject_repository=qualification_gnu="$RUNNER_TEMP/gnu" \
            --host_platform=@qualification_gnu//:gnu --extra_execution_platforms=@qualification_gnu//:gnu \
            --spawn_strategy=remote --strategy=GoCompilePkg=remote --strategy=GoStaticAnalysis=remote --strategy=TestRunner=remote \
            --noremote_local_fallback --noremote_upload_local_results --remote_download_outputs=toplevel --remote_timeout=10m \
            --build_tag_filters= --test_tag_filters= --nocache_test_results --flaky_test_attempts=1 \
            --build_event_json_file="$RUNNER_TEMP/cgroup.bep" --execution_log_compact_file="$RUNNER_TEMP/cgroup.compact" \
            //runsc/cgroup:cgroup_nogo //runsc/cgroup:cgroup_test_nogo > "$RUNNER_TEMP/cgroup.console" 2>&1 || rc=$?
          date --utc --iso-8601=ns > "$RUNNER_TEMP/cgroup.finished"
          echo "${rc:-0}" > "$RUNNER_TEMP/cgroup.exit"
          exit "${rc:-0}"
      - name: Verify each architecture and record remote execution separately from cache hits
        if: ${{ !cancelled() }}
        run: python3 "$RUNNER_TEMP/cgroup-nogo.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: strict-remote-cgroup-nogo
          path: ${{ runner.temp }}/cgroup.json
          if-no-files-found: error
