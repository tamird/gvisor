name: Native Buildkite Nogo compiler recovery
on:
  push:
    branches: [qualification/buildkite-nogo-license-test]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT: 8ce8546f1f39f653c3a4426c4c916986826e5d7f
      NOGO_OWNER: //tools/licensecheck:licensecheck_test_nogo
      NOGO_TIMEOUT: 29m
      DOCKER_BUILD: 'false'
      DOCKER_HOST: unix:///nonexistent-gvisor-builder.sock
      BUILDKITE_LABEL: ':golang: Nogo tests'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Reconcile the missing license-test analyzer on corrected source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nogo-receipts"
          echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/nogo-receipts/verdict.json"
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          cp .github/qualification/native-nogo.py "$RUNNER_TEMP"
          git checkout --quiet --detach "$PRODUCT"
          test "$(uname -m)" = x86_64
          # Exercise only the native install block, without the Buildkite
          # agent's Docker daemon and machine-wide sysctl housekeeping.
          sed -n '/^install_.*bazel() {$/,$p' .buildkite/hooks/pre-command > "$RUNNER_TEMP/nogo-setup.bash"
          source "$RUNNER_TEMP/nogo-setup.bash"
          test -n "$BUILDKITE_BAZEL_DIRECTORY"
          test "$(bazel --version)" = "bazel $(cat .bazelversion)"
          umask 077
          {
            echo 'build --jobs=4'
            echo 'test --nocache_test_results'
            echo 'build --remote_cache='
            echo 'build --remote_executor='
          } > "$RUNNER_TEMP/nogo-resources.bazelrc"
          df -h .
          python3 "$RUNNER_TEMP/native-nogo.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-buildkite-nogo-license-test
          path: ${{ runner.temp }}/nogo-receipts/
          if-no-files-found: error
