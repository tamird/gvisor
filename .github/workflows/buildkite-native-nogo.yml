name: Check bounded native Nogo metadata reports
on:
  push:
    branches: [qualification/buildkite-nogo-llvm-report-fixtures]
permissions:
  contents: read
  actions: read
jobs:
  reports:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT: f1e943169a0bfd6439a31585896f031c7314721e
      CODEC: 0a9bdf9bc331d6a66f35aefcbbb5cf466eb6f7f5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Bind the previously exercised checker
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 8153068e840fa297d46bfcd8ece447c058b8e874
          git diff --exit-code HEAD^ HEAD -- . ':!.github/qualification/native-nogo-placement.py' ':!.github/workflows/buildkite-native-nogo.yml'
          mkdir "$RUNNER_TEMP/nogo-receipts"
          git fetch --quiet --depth=1 origin "$CODEC"
          git show "$CODEC:test/rbe/stdlib-provenance.py" > "$RUNNER_TEMP/stdlib_provenance.py"
          cp .github/qualification/native-nogo-placement.py "$RUNNER_TEMP/native-nogo-placement.py"
      - name: Check positive, missing-proof and bounded-publication metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/native-nogo-placement.py" report-fixtures
      - name: Validate the fixture-only report
        id: privacy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'nogo-receipts'
          for p in root.glob('report-fixtures*.json'):
              assert p.name in {'report-fixtures.json','report-fixtures-error.json'}
              data=p.read_bytes()
              assert len(data)<65536 and os.environ['GH_TOKEN'].encode() not in data
              assert not re.search(rb'(?:gh[pousr]_|github_pat_|Authorization:|Bearer )',data,re.I)
          report=json.loads((root/'report-fixtures.json').read_text())
          assert report['kind']=='metadata_fixture_checks' and report['workload_executed'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Metadata fixtures verified: '+str(report['verified'])+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: native-nogo-report-fixtures
          path: ${{ runner.temp }}/nogo-receipts/report-fixtures*.json
          if-no-files-found: error
