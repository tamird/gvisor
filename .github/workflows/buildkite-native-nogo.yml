name: Resume the exact unreported Nogo owners
on:
  push:
    branches: [qualification/buildkite-native-nogo-inputs]
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRODUCT: 8e13db5ad62802add68356df383e4a581e8eb303
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      NOGO_FRESH_RESULTS: "1"
      NOGO_RESUME_ORIGINAL: "13107794911"
      DOCKER_BUILD: 'false'
      DOCKER_HOST: unix:///nonexistent-gvisor-builder.sock
      BUILDKITE_LABEL: ':golang: Nogo tests'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Reconcile the 597 original results and the verified local cgroup actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/tamird/gvisor/actions/artifacts/13107794911/zip > "$RUNNER_TEMP/original-wildcard.zip"
          gh api repos/tamird/gvisor/actions/artifacts/13109217470/zip > "$RUNNER_TEMP/original-cgroup.zip"
          python3 .github/qualification/native-nogo-placement.py replay "$RUNNER_TEMP/original-cgroup.zip" "$RUNNER_TEMP/nogo-cgroup"
      - name: Set up the ordinary Linux Bazel client and declared GNU workers
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nogo-receipts" "$RUNNER_TEMP/gnu-platform"
          echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/nogo-receipts/verdict.json"
          test "$(git rev-parse HEAD^)" = 165d6841e74a2792f1b33a0914361f58c28e16bf
          git fetch -q --no-tags --depth=1 origin "$PRODUCT"
          cp .github/qualification/native-nogo{,-placement}.py "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/nogo-cgroup"
          echo "$(( $(date +%s) + 53*60 ))" > "$RUNNER_TEMP/nogo-deadline"
          git checkout -q --detach "$PRODUCT"
          sed -n '/^install_.*bazel() {$/,$p' .buildkite/hooks/pre-command > "$RUNNER_TEMP/nogo-setup.bash"
          source "$RUNNER_TEMP/nogo-setup.bash"
          test "$(bazel --version)" = "bazel $(cat .bazelversion)"
          echo "$BUILDKITE_BAZEL_DIRECTORY" >> "$GITHUB_PATH"
          printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
          printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","EstimatedMemory":"4GB","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'test --strategy=GoCompilePkg=remote,local' 'test --strategy=GoStaticAnalysis=remote,local' 'test --nocache_test_results' 'build --noremote_local_fallback' 'build --remote_download_outputs=toplevel' 'build --jobs=64' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu' 'test --strategy=TestRunner=sandboxed' 'test --local_test_jobs=4'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/nogo-resources.bazelrc"
      - name: Execute the complementary 273 tests, checking both architecture logs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          printf 'test --invocation_id=%s\n' "$(cat /proc/sys/kernel/random/uuid)" >> "$RUNNER_TEMP/nogo-resources.bazelrc"
          budget=$(( $(cat "$RUNNER_TEMP/nogo-deadline") - $(date +%s) ))
          test "$budget" -gt 30
          export NOGO_TIMEOUT="${budget}s"
          python3 "$RUNNER_TEMP/native-nogo.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-nogo-complement
          path: |
            ${{ runner.temp }}/nogo-receipts/
            ${{ runner.temp }}/nogo-cgroup/
          if-no-files-found: error
