name: Recover the original native Nogo cgroup diagnostics
on:
  push:
    branches: [qualification/buildkite-native-nogo-inputs]
permissions: {contents: read}
jobs:
  receipt:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Retrieve only error evidence from the original invocation
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B .github/qualification/native-nogo-cgroup-original.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-nogo-cgroup-compiler
          path: ${{ runner.temp }}/nogo-cgroup-original.json
          if-no-files-found: error
