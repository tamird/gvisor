name: Native Buildkite Nogo owner and package recovery
on:
  push:
    branches: [qualification/buildkite-nogo-qemu-fixture]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      PRODUCT: d0028175b9c5f7305bc9aaf0567cefa67f98a2e7
      STANDALONE: 42da3f839364b742366d0d5d11f02935776c71e1
      NOGO_OWNER: //tools/licensecheck:licensecheck_test_nogo
      NOGO_TIMEOUT: 29m
      DOCKER_BUILD: 'false'
      DOCKER_HOST: unix:///nonexistent-gvisor-builder.sock
      BUILDKITE_LABEL: ':golang: Nogo tests'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Install the production native tools once
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nogo-receipts"
          echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/nogo-receipts/verdict.json"
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          cp .github/qualification/native-nogo.py "$RUNNER_TEMP"
          git checkout --quiet --detach "$PRODUCT"
          test "$(uname -m)" = x86_64
          # Exercise only the native install block, without the Buildkite
          # agent's Docker daemon and machine-wide sysctl housekeeping.
          sed -n '/^install_.*bazel() {$/,$p' .buildkite/hooks/pre-command > "$RUNNER_TEMP/nogo-setup.bash"
          source "$RUNNER_TEMP/nogo-setup.bash"
          test -n "$BUILDKITE_BAZEL_DIRECTORY"
          test "$(bazel --version)" = "bazel $(cat .bazelversion)"
          umask 077
          {
            echo 'build --jobs=4'
            echo 'test --nocache_test_results'
            echo 'build --remote_cache='
            echo 'build --remote_executor='
          } > "$RUNNER_TEMP/nogo-resources.bazelrc"
          df -h .
          echo "$BUILDKITE_BAZEL_DIRECTORY" >> "$GITHUB_PATH"
          reporter=599cb05aecfb107e07f81b8591a009cb12d6ffa7
          git fetch -q --no-tags --depth=1 origin "$STANDALONE" "$reporter"
          git show "$reporter:test/rbe/qualification_report.py" > "$RUNNER_TEMP/qualification_report.py"
          git show "$reporter:test/rbe/unit_matrix.py" > "$RUNNER_TEMP/unit_matrix.py"
      - name: Exercise the current-master license scanner and QEMU notice source
        run: |
          set -euo pipefail
          git checkout --quiet --detach "$STANDALONE"
          test "$(git rev-parse HEAD)" = "$STANDALONE"
          scope=//tools/licensecheck:licensecheck_test
          rc=0
          timeout -k 10s 15m bazel --bazelrc="$RUNNER_TEMP/nogo-resources.bazelrc" test --test_env=GO_TEST_WRAP_TESTV=1 --test_output=errors --build_event_json_file="$RUNNER_TEMP/package.bep" "$scope" > "$RUNNER_TEMP/package.console" 2>&1 || rc=$?
          RC=$rc SCOPE=$scope PYTHONPATH="$RUNNER_TEMP" python3 - <<'PY'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          from qualification_report import xml_cases
          from xml.etree import ElementTree
          from hashlib import sha256
          root = Path(os.environ["RUNNER_TEMP"])
          target = os.environ["SCOPE"]
          status = int(os.environ["RC"])
          record = {"source": os.environ["STANDALONE"], "target": target, "exit": status, "verified": False}
          required = {"TestClassify/title", "TestVerifyLicenseSource", "TestEnumerateAndFetchQemuLicenseSource"}
          try:
              events = [json.loads(s) for s in (root / "package.bep").read_text().splitlines()]
              record["runners"] = [{"status": e["testResult"]["status"], "strategy": e["testResult"].get("executionInfo", {}).get("strategy"), "cachedLocally": e["testResult"].get("cachedLocally", False)} for e in events if e["id"].get("testResult", {}).get("label") == target]
              record["summaries"] = [e["testSummary"]["overallStatus"] for e in events if e["id"].get("testSummary", {}).get("label") == target]
              record["finished"] = [e["finished"].get("finishTime", e["finished"].get("finishTimeMillis")) for e in events if "finished" in e]
              xml = Path("bazel-testlogs/tools/licensecheck/licensecheck_test/test.xml")
              record["xml_sha256"] = sha256(xml.read_bytes()).hexdigest()
              record["cases"] = xml_cases(xml)
              actual = set()
              for case in ElementTree.parse(xml).getroot().iter("testcase"):
                  if any(case.find(k) is not None for k in ("failure", "error", "skipped")) or case.get("status") == "notrun":
                      continue
                  name = "/".join(filter(None, (case.get("classname"), case.get("name"))))
                  actual.update(k for k in required if name == k or name.endswith("/" + k))
              record["cases"]["required_passed"] = sorted(actual)
              record["verified"] = status == 0 and record["runners"] == [{"status":"PASSED","strategy":"processwrapper-sandbox","cachedLocally":False}] and record["summaries"] == ["PASSED"] and required <= set(record["cases"]["required_passed"])
          except Exception as exc:
              record["collectionError"] = type(exc).__name__
          record["reportedAt"] = datetime.now(timezone.utc).isoformat()
          (root / "nogo-receipts/package.json").write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record))
          PY
      - name: Execute the missing analyzer on the final native integration
        if: always()
        run: |
          set -euo pipefail
          git checkout --quiet --detach "$PRODUCT"
          python3 "$RUNNER_TEMP/native-nogo.py"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "nogo-receipts"
          assert all(json.loads((root / name).read_text())["verified"] for name in ("package.json", "verdict.json"))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-nogo-qemu-source-fixture
          path: ${{ runner.temp }}/nogo-receipts/
          if-no-files-found: error
