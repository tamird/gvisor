name: Reconcile Buildkite Nogo's shared input
on:
  push:
    branches: [qualification/buildkite-native-nogo-inputs]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      PRODUCT: 8e13db5ad62802add68356df383e4a581e8eb303
      PREVIOUS: 37a2769ad5a2d358914f0794b783769f586fc534
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      NOGO_TIMEOUT: 53m
      DOCKER_BUILD: 'false'
      DOCKER_HOST: unix:///nonexistent-gvisor-builder.sock
      BUILDKITE_LABEL: ':golang: Nogo tests'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Set up the ordinary Linux Bazel client and declared GNU workers
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nogo-receipts" "$RUNNER_TEMP/gnu-platform"
          echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/nogo-receipts/verdict.json"
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          cp .github/qualification/native-nogo.py "$RUNNER_TEMP"
          git checkout -q --detach "$PRODUCT"
          git fetch -q --no-tags --depth=1 origin "$PREVIOUS"
          sed -n '/^install_.*bazel() {$/,$p' .buildkite/hooks/pre-command > "$RUNNER_TEMP/nogo-setup.bash"
          source "$RUNNER_TEMP/nogo-setup.bash"
          test "$(bazel --version)" = "bazel $(cat .bazelversion)"
          echo "$BUILDKITE_BAZEL_DIRECTORY" >> "$GITHUB_PATH"
          printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
          printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","EstimatedMemory":"4GB","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --remote_download_outputs=toplevel' 'build --jobs=64' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu' 'test --strategy=TestRunner=sandboxed' 'test --local_test_jobs=4'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/nogo-resources.bazelrc"
      - name: Compare the actual ELF called by both versions of an ordinary Nogo test
        run: |
          set -euo pipefail
          for arm in old final; do
            if [[ "$arm" == old ]]; then source_sha="$PREVIOUS"; else source_sha="$PRODUCT"; fi
            git checkout -q --detach "$source_sha"
            id="$(cat /proc/sys/kernel/random/uuid)"
            printf '%s\n' "$id" > "$RUNNER_TEMP/nogo-receipts/$arm.invocation"
            receipt="$RUNNER_TEMP/nogo-receipts/$arm.json"
            printf '{"source":"%s","invocation":"%s","verified":false}\n' "$source_sha" "$id" > "$receipt"
            status=0
            timeout --kill-after=30s 13m bazel --bazelrc="$RUNNER_TEMP/nogo-resources.bazelrc" test --config=buildkite --config=nogo "--invocation_id=$id" --build_runfile_links --nocache_test_results //pkg/bits:bits_nogo > "$RUNNER_TEMP/$arm.console" 2>&1 || status=$?
            python3 - "$receipt" "$status" "$RUNNER_TEMP/$arm.console" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path
          p, status, console = Path(sys.argv[1]), int(sys.argv[2]), Path(sys.argv[3])
          row = json.loads(p.read_text())
          row["exit"] = status
          events = [json.loads(l) for l in Path(".build_events.json").read_text().splitlines()]
          target = "//pkg/bits:bits_nogo"
          row["tests"] = [e["testResult"]["status"] for e in events if e["id"].get("testResult",{}).get("label")==target]
          row["status"] = [e["testSummary"]["overallStatus"] for e in events if e["id"].get("testSummary",{}).get("label")==target]
          row["processes"] = [e["buildMetrics"].get("actionSummary",{}).get("runnerCount",[]) for e in events if "buildMetrics" in e]
          row["errors"] = [l.strip()[:400] for l in console.read_text(errors="replace").splitlines() if ("ERROR:" in l or re.search(r"\.go:\d+:",l)) and all(x not in l.lower() for x in ("http","api-key","header","token","bearer","grpcs:"))][:8]
          if status == 0 and row["tests"] == row["status"] == ["PASSED"]:
              runner = Path("bazel-bin/pkg/bits/bits_nogo")
              commands = {line.split()[0] for line in runner.read_text().splitlines() if " filter -test -text " in line}
              assert len(commands) == 1, commands
              binary = commands.pop()
              matches = [f for f in runner.with_suffix(".runfiles").glob("*/" + binary) if f.is_file()]
              assert matches, binary
              data = matches[0].read_bytes()
              assert data.startswith(b"\x7fELF")
              row.update(verified=True,binary=binary,elfSize=len(data),elfSHA256=hashlib.sha256(data).hexdigest())
          p.write_text(json.dumps(row,indent=2)+"\n")
          print(json.dumps(row))
          assert row["verified"]
          PY
          done
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])/"nogo-receipts"
          old,new = [json.loads((root/(arm+".json")).read_text()) for arm in ("old","final")]
          assert old["verified"] and new["verified"] and old["binary"] == new["binary"]
          changed = old["elfSHA256"] != new["elfSHA256"]
          (root/"input.json").write_text(json.dumps({"sharedToolChanged":changed,"old":old["source"],"final":new["source"]})+"\n")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              print("SHARED_TOOL_CHANGED="+str(changed).lower(),file=f)
          PY
      - name: Reconcile the final wildcard only if the executable run by every owner changed
        if: env.SHARED_TOOL_CHANGED == 'true'
        run: |
          set -euo pipefail
          id="$(cat /proc/sys/kernel/random/uuid)"
          printf '%s\n' "$id" > "$RUNNER_TEMP/nogo-receipts/full.invocation"
          printf 'test --invocation_id=%s\n' "$id" >> "$RUNNER_TEMP/nogo-resources.bazelrc"
          python3 "$RUNNER_TEMP/native-nogo.py"
      - name: Retain equal shared input without repeating the wildcard
        if: env.SHARED_TOOL_CHANGED == 'false'
        run: |
          echo '{"verified":true,"outcome":"shared ELF identical; compare remaining changed inputs before reusing tests"}' > "$RUNNER_TEMP/nogo-receipts/verdict.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: final-native-nogo-actual-inputs
          path: ${{ runner.temp }}/nogo-receipts/
          if-no-files-found: error
