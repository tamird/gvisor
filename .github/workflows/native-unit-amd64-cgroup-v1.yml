name: Native container lookup fix in KVM cgroup modes
on:
  push:
    branches: [qualification/buildkite-container-native-lookup]
permissions:
  contents: read
  actions: read
jobs:
  container:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-22.04
    timeout-minutes: 115
    env:
      PRODUCT: 1998f17f51aea3db192d9f1eeda076a8bedfd7a7
      SOURCE: 45e2b205ea018f69e9f3bc80e162ba07d88fd768
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 9, persist-credentials: false}
    - name: Retain controller outside product checkout
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^)" = 098e3e093bf859d8aebf856c5840dbba18aefb86
        test "$(git rev-parse HEAD~8)" = 38745c527784376e0b5d915fe5ebd85e1d1385fd
        printf '{"status":"INCOMPLETE","carrier":"%s"}\n' "$GITHUB_SHA" > "$RUNNER_TEMP/container-native-result.json"
        test -c /dev/kvm
        mkdir "$RUNNER_TEMP/controller"
        cp .github/qualification/unit-cgroup-v1/check.py test/rbe/{credential_artifacts,qualification_report,unit_matrix}.py "$RUNNER_TEMP/controller/"
        git fetch --no-tags origin "$SOURCE" --depth=3
        git fetch --no-tags origin b2bd6284f19ec076f76aa0ce3d00494e69f75b0b --depth=1
        decoder=0a9bdf9bc331d6a66f35aefcbbb5cf466eb6f7f5
        git fetch --no-tags origin "$decoder" --depth=1
        git show "$decoder:test/rbe/stdlib-provenance.py" > "$RUNNER_TEMP/controller/stdlib_provenance.py"
        command -v zstd
        gh api repos/tamird/gvisor/actions/artifacts/13253001262/zip > "$RUNNER_TEMP/original.zip"
        printf '{"status":"INCOMPLETE","carrier":"%s"}\n' "$GITHUB_SHA" > "$RUNNER_TEMP/container-native-result.json"
    - name: Build the corrected capsules and run fresh isolated guests
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 -B "$RUNNER_TEMP/controller/check.py"
    - name: Validate sole public receipt
      id: scan
      if: always()
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PY'
        import json, os, re
        from pathlib import Path
        p = Path(os.environ['RUNNER_TEMP']) / 'container-native-result.json'
        data = p.read_bytes()
        assert len(data) < 2 * 1024 * 1024
        key = os.environ['BUILDBUDDY_API_KEY']
        assert key and key.encode() not in data and json.dumps(key)[1:-1].encode() not in data
        assert not re.search(rb'(?i)(github_pat_|gh[pousr]_[a-z0-9]{20}|(?:authorization|x-buildbuddy-api-key)\s*[:=]|Bearer\s+[a-z0-9])', data)
        assert json.loads(data)['carrier'] == os.environ['GITHUB_SHA']
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.scan.outcome == 'success'
      with:
        name: native-container-cgroup-result
        path: ${{ runner.temp }}/container-native-result.json
        if-no-files-found: error
