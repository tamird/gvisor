name: Verify the existing offline APT publisher as an ordinary VM user
on:
  push:
    branches: [qualification/apt-publisher-no-docker]
permissions: {contents: read}
jobs:
  publisher:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the previous Noble launcher, test inputs and package roots
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2d32add6ff722e1e4b84b6ca9685c3310377eeae
          git diff --exit-code HEAD^ -- MODULE.bazel tools/make_apt.sh tools/make_test_key.sh tools/bazeldefs/platforms.bzl test/release/publisher_namespace_test.py test/release/publisher_local_test.py
          d="$RUNNER_TEMP/native-apt-vm"
          mkdir -m 700 "$d" "$d/public"
          bazel --version
      - name: Check the VM namespace then sign and verify in an offline child
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          d="$RUNNER_TEMP/native-apt-vm"
          rc="$d/private.bazelrc"
          umask 077
          trap 'rm -f "$rc"' EXIT
          test -n "$BUILDBUDDY_API_KEY"
          {
            echo 'build:buildbuddy_remote_executor --remote_executor=grpcs://remote.buildbuddy.io'
            echo 'build:buildbuddy_remote_executor --remote_cache=grpcs://remote.buildbuddy.io'
            echo 'build:buildbuddy_remote_executor --bes_backend=grpcs://remote.buildbuddy.io'
            echo 'build:buildbuddy_remote_executor --bes_results_url=https://app.buildbuddy.io/invocation/'
            printf 'build:buildbuddy_remote_executor --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build:buildbuddy_remote_executor --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          for target in publisher_namespace_test publisher_local_test; do
            status=0
            env -i PATH="$PATH" HOME="$HOME" USER="$USER" bazel --nosystem_rc --nohome_rc --bazelrc="$rc" test \
              --config=rbe --jobs=32 --noremote_local_fallback --nocache_test_results --flaky_test_attempts=1 \
              --strategy=TestRunner=remote '--modify_execution_info=^TestRunner$=+no-remote-cache' \
              --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml|outputs[/].*)$' \
              --test_timeout=900 --build_event_json_file="$d/$target.bep" \
              "//test/release:$target" >"$d/$target.console" 2>&1 || status=$?
            env -i PATH=/usr/bin:/bin python3 -B test/release/publisher_receipt.py "$d" "$target" "$status"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-apt-firecracker-receipts
          path: ${{ runner.temp }}/native-apt-vm/public/*.json
          retention-days: 14
          if-no-files-found: warn
