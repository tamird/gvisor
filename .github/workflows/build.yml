name: Run original Go suites on native scratch workers
on:
  push:
    branches: [qualification/scratch-native-go-packages]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    env:
      BB_ARCH: x86_64
      BB_HASH: bdb65b4bddb8405a80b3e45a3ef4c740819b151d0709d360e8add8dac534c224
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 5}
      - name: Restore the qualified native Bazel executable and log reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api repos/tamird/gvisor/actions/artifacts/12982133352/zip > "$RUNNER_TEMP/native-bazel.zip"
          echo "c2889f822f8948b2982b903abb96b3498ce1136b1a5c9d60b3f61bb09f082701  $RUNNER_TEMP/native-bazel.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/native-bazel.zip" bazel-candidate > "$RUNNER_TEMP/bazel-candidate"
          echo "5b5bab2095065817d3416ca9a0678bd39c10c9ede432dbe8187bfe74de285160  $RUNNER_TEMP/bazel-candidate" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bazel-candidate"
          command -v objcopy nm jq
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-$BB_ARCH -o "$RUNNER_TEMP/bb"
          echo "$BB_HASH  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
      - name: Test both packages on both native architectures
        env:
          PRODUCT: 2072871b20eb3223163ffb4fdf9a5346e5297308
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          test -n "$BUILDBUDDY_API_KEY"
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --action_env=TMPDIR=.' 'build --host_action_env=TMPDIR=.'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/sidecar.bazelrc"
          unset BUILDBUDDY_API_KEY
          cp test/rbe/{qualification_report.py,unit_matrix.py} "$RUNNER_TEMP/"
          cp test/rbe/native_packages/{run.py,native-wrapper-control.json} "$RUNNER_TEMP/"
          python3 "$RUNNER_TEMP/run.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-scratch-go-packages
          path: ${{ runner.temp }}/native-package-evidence
          if-no-files-found: error
