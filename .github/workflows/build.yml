name: Recover the failed scratch generator from its original action
on:
  push:
    branches: [qualification/scratch-go-merge-original]
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Read the one failed remote command and its executable
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 83f2d8568e1799eab47b02dc92da2988bdb001d9
          test -n "$ACCESS"
          umask 077
          env -i PATH="$PATH" ACCESS="$ACCESS" python3 -B .github/qualification/original_go_merge.py "$RUNNER_TEMP/go-merge.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-go-merge-start
          path: ${{ runner.temp }}/go-merge.json
          if-no-files-found: error
          retention-days: 5
