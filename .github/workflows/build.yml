name: Check the original matched TCP test verdicts
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  originals:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the four immutable original TestResults
        env:
          ORIGINAL_READ_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: PYTHONPATH=test/rbe python3 -B .github/qualification/tail-originals/read.py "$RUNNER_TEMP/replay"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: matched-test-replay
          path: ${{runner.temp}}/replay/result.json
          if-no-files-found: error
