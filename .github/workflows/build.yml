name: Qualify Go 1.22 testdir selection
on:
  push:
    branches: [qualification/go122-disk-selections]
permissions: {}
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    env:
      GO_IMAGE: us-central1-docker.pkg.dev/gvisor-presubmit/gvisor-presubmit-images/runtimes/go1.22_x86_64@sha256:420458255f43ecad02efc8dbb3446c0dc09a34bfaeaec2dacdf7ee84b2bc8f47
    steps:
      - name: Bind original sources, production image and Bazel
        run: |
          set -euo pipefail
          git init .
          git fetch --no-tags --no-auto-maintenance --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 9f3e63e134254bd8cd2a2e0ad49790d6dfe784ce
          test "$(git rev-parse HEAD^^)" = 2552c678794e048487e1d18e9c81729b67fc119a
          git diff --quiet HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!test/runtimes/go_testdir_qa'
          test "$(git diff --name-only HEAD^^ HEAD^)" = test/runtimes/proctor/lib/go.go
          w="$RUNNER_TEMP/go-testdir-qa"
          mkdir -p "$w/receipt" "$w/bins" "$w/docker-client"
          echo "GO_QA=$w" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$w/docker-client" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix:///tmp/gvgo-selection.sock" >> "$GITHUB_ENV"
          git log -3 --format=%H > "$w/receipt/sources.txt"
          cp test/runtimes/exclude/go1.22.csv "$w/go1.22.csv"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $w/bazel" | sha256sum -c
          chmod +x "$w/bazel"
          sudo -n apt-get update -qq
          sudo -n apt-get install -qy build-essential crossbuild-essential-arm64 libnuma-dev
          df -h . > "$w/receipt/disk-at-start.txt"
          curl -fsSI -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' https://us-central1-docker.pkg.dev/v2/gvisor-presubmit/gvisor-presubmit-images/runtimes/go1.22_x86_64/manifests/554d28f5e3db7cfa > "$w/receipt/image-headers.txt"
          grep -Fi "sha256:420458255f43ecad02efc8dbb3446c0dc09a34bfaeaec2dacdf7ee84b2bc8f47" "$w/receipt/image-headers.txt"
          cat > "$w/bazel-args.sh" <<'SH'
          b() {
            local verb="$1"
            shift
            "$GO_QA/bazel" --nosystem_rc --nohome_rc --host_jvm_args=-Xmx4g "$verb" \
              --config=x86_64 -c opt --jobs=4 --lockfile_mode=off --remote_cache= --remote_executor= --bes_backend= \
              --module_mirrors=https://bcr.cloudflaremirrors.com --spawn_strategy=linux-sandbox \
              --strategy=GoStdlib=processwrapper-sandbox --strategy=GoStdlibList=processwrapper-sandbox \
              '--modify_execution_info=^(GoStandardLibraryAnalysis|GoStaticAnalysis)$=-no-sandbox' "$@"
          }
          q() {
            b test --nocache_test_results --flaky_test_attempts=1 --strategy=TestRunner=local \
              --test_env=GO_QA --test_env=GO_IMAGE --test_env=DOCKER_HOST --test_env=DOCKER_CONFIG \
              --test_output=errors --build_event_json_file="$GO_QA/receipt/$1.bep" --test_timeout="$2" "//test/runtimes/go_testdir_qa:$1"
          }
          SH
      - name: Build stock master runtime and both production proctors
        id: binaries
        run: |
          set -euo pipefail
          source "$GO_QA/bazel-args.sh"
          p=test/runtimes/proctor/lib/go.go
          for arm in stock candidate; do
            revision=HEAD^
            if [[ "$arm" == stock ]]; then revision=HEAD^^; fi
            git show "$revision:$p" > "$p"
            git diff --quiet "$revision" -- "$p"
            targets=(//test/runtimes/proctor:proctor_bin)
            if [[ "$arm" == stock ]]; then targets+=(//debian:gvisor-release-tar-bz2); fi
            b build --build_event_json_file="$GO_QA/receipt/build-$arm.bep" "${targets[@]}"
            resolved=$(b cquery --output=files //test/runtimes/proctor:proctor_bin | tail -1)
            install -m 0755 "$resolved" "$GO_QA/bins/$arm"
          done
          git diff --quiet HEAD^ -- "$p"
          sha256sum "$GO_QA/bins/"* bazel-bin/debian/gvisor.tar.bz2 > "$GO_QA/receipt/products.sha256"
          test "$(sha256sum "$GO_QA/bins/stock" | cut -d' ' -f1)" != "$(sha256sum "$GO_QA/bins/candidate" | cut -d' ' -f1)"
          d=/tmp/gvgo-selection
          sudo -n mkdir "$d"
          bindir="/usr/local/libexec/gvisor-gotest-$GITHUB_RUN_ID"
          sudo -n mkdir -p "$bindir"
          sudo -n tar -xjf bazel-bin/debian/gvisor.tar.bz2 -C "$bindir"
          sudo -n -u nobody test -x "$bindir/gvisor-bin/gvisor-sentry-prewarmer"
          jq -n --arg p "$bindir/runsc" '{runtimes:{"go-ci":{path:$p,runtimeArgs:["--platform=systrap","--directfs=false","--overlay2=root:self"]}}}' > "$GO_QA/daemon.json"
          sudo -n dockerd --config-file="$GO_QA/daemon.json" --host="$DOCKER_HOST" --group="$(id -gn)" \
            --pidfile="$d/pid" --data-root="$d/data" --exec-root="$d/exec" --bridge=none \
            --iptables=false --ip-forward=false --ip-masq=false --userland-proxy=false > "$GO_QA/daemon.log" 2>&1 &
          for i in {1..45}; do docker info >/dev/null 2>&1 && break; sleep 1; done
          test "$(docker info --format '{{.DockerRootDir}}')" = "$d/data"
          docker pull "$GO_IMAGE"
          docker image inspect "$GO_IMAGE" --format '{{.Id}} {{.Architecture}}' > "$GO_QA/receipt/image.txt"
      - name: Verify selected successes, deliberate failures and excluded siblings
        run: |
          set -euo pipefail
          source "$GO_QA/bazel-args.sh"
          q controls 3200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: go122-focused-controls
          path: |
            ${{ runner.temp }}/go-testdir-qa/receipt/controls
            ${{ runner.temp }}/go-testdir-qa/receipt/sources.txt
            ${{ runner.temp }}/go-testdir-qa/receipt/products.sha256
            ${{ runner.temp }}/go-testdir-qa/receipt/image*.txt
            bazel-testlogs/test/runtimes/go_testdir_qa/controls/test.*
          retention-days: 21
      - name: Exercise all on-disk files in fifty-file batches on systrap
        if: "!cancelled() && steps.binaries.outcome == 'success'"
        run: |
          set -euo pipefail
          source "$GO_QA/bazel-args.sh"
          q full 15200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: go122-complete-systrap
          path: |
            ${{ runner.temp }}/go-testdir-qa/receipt
            bazel-testlogs/test/runtimes/go_testdir_qa/full/test.*
          retention-days: 21
