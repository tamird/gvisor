name: Isolate page-file residency in background restore
on:
  push:
    branches: [qualification/state-restore-page-cache-control]
permissions: {}
jobs:
  measure:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
    - name: Bind master, guest, and native GNU tools
      run: |
        set -euo pipefail
        w="$RUNNER_TEMP/state-working-set"
        mkdir -p "$w/src" "$w/results"
        echo '{"build_verified":false,"stage":"setup"}' > "$w/results/build.json"
        cd "$w/src"
        git init -q
        git -c gc.auto=0 fetch -q --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
        s=9ee2906f518e1d0f9fd109e9e1feb2812096418b
        q=f948a2221d2329e8e0897eb8b562c859da77468a
        test "$(git rev-parse "$GITHUB_SHA^")" = "$q"
        test "$(git rev-parse "$q^")" = "$s"
        git diff --exit-code "$q" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!.github/qualification/state_working_set/measure.py'
        git diff --exit-code "$s" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!.github/qualification/state_working_set' ':!test/rbe/restore_advice'
        test "$(git rev-parse "$GITHUB_SHA:test/rbe/restore_advice/guest.go")" = fa8722188274a32ffecd31a55da785c613585fc8
        test "$(git rev-parse "$GITHUB_SHA:test/rbe/restore_advice/BUILD")" = 41436c5859495ec8d2c95d66289a3ba51d149c3a
        git checkout -q --detach "$s"
        for f in build.py measure.py benchstat.module; do
          git show "$GITHUB_SHA:.github/qualification/state_working_set/$f" > "$w/$f"
        done
        git restore --source="$GITHUB_SHA" --worktree -- test/rbe/restore_advice/guest.go test/rbe/restore_advice/BUILD
        test "$(cat .bazelversion)" = 9.3.1
        sudo -n apt-get -qq update
        sudo -n apt-get -qq install --no-install-recommends -y build-essential crossbuild-essential-arm64 libnuma-dev
        curl -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
        echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $w/bazel" | sha256sum -c -
        chmod 755 "$w/bazel"
    - name: Build the original release, guest and separate pinned benchstat
      run: |
        w="$RUNNER_TEMP/state-working-set"
        cd "$w/src"
        python3 -B "$w/build.py"
    - name: Measure fresh systrap restores and verify both guest digests
      run: |
        w="$RUNNER_TEMP/state-working-set"
        sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$w/measure.py"
    - name: Compare each separately warmed cohort against the all-cold baseline
      run: |
        set -euo pipefail
        w="$RUNNER_TEMP/state-working-set"
        cd "$w/results"
        for c in pages_warm state_warm; do
          "$w/benchstat" cold.txt "$c.txt" > "benchstat-$c.txt"
          for metric in restore ready_after_return ready verified verify_after_ready; do
            grep -q "Restore/$metric " "benchstat-$c.txt"
          done
          cat "benchstat-$c.txt"
        done
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && !cancelled()
      with:
        name: state-restore-page-cache-control
        path: ${{ runner.temp }}/state-working-set/results
        if-no-files-found: error
        retention-days: 14
