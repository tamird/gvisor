name: Check the netgofer final frame and measure per-record timestamping
on:
  push:
    branches: [qualification/netgofer-timestamp-native]
permissions: {contents: read}
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 4, persist-credentials: false}
      - name: Run native queue, poll, seccomp and live TCP controls
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 5077c89fd0be712d40890b77cc9fccd20711a3e1
          test "$(git rev-parse HEAD^^)" = 0fe41fb91a734c27c9cb70228b6d69aaa9ed6b80
          test "$(git rev-parse HEAD~3)" = 949d4871550821371649ae873beab69ead0b36c1
          d="$RUNNER_TEMP/netgofer-timestamp"
          mkdir -m 700 "$d"
          cp .github/qualification/netgofer_timestamp.py "$d/"
          curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod +x "$d/bazel"
          test "$("$d/bazel" --version)" = 'bazel 9.3.1'
          git switch --quiet --detach 5077c89fd0be712d40890b77cc9fccd20711a3e1
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$d/netgofer_timestamp.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: netgofer-timestamp
          path: |
            ${{ runner.temp }}/netgofer-timestamp/result.json
            ${{ runner.temp }}/netgofer-timestamp/*.bench
            ${{ runner.temp }}/netgofer-timestamp/benchstat.txt
          retention-days: 14
