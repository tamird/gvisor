name: RACK retransmission origin control
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  qualification:
    name: Compare original and retransmitted packet delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QUALIFICATION_COMMIT: ${{ github.sha }}
      QUALIFICATION_TARGETS: //test/rbe/probeorigin:study_test
      QUALIFICATION_TEST_FILTER: ^TestProbeOrigin$
      QUALIFICATION_LANES: test
      QUALIFICATION_ARCH: amd64
    steps:
    - name: Check the Remote Bazel credential
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: ': "${BUILDBUDDY_API_KEY:?Configure the BUILDBUDDY_API_KEY repository secret}"'
    - name: Checkout the triggering commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 10
    - name: Run the matched receiver histories
      timeout-minutes: 38
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        test "$QUALIFICATION_COMMIT" = "$(git rev-parse HEAD)"
        test "$QUALIFICATION_TARGETS" = "//test/rbe/probeorigin:study_test"
        test "$QUALIFICATION_TEST_FILTER" = '^TestProbeOrigin$'
        test "$QUALIFICATION_LANES" = "test"
        test "$QUALIFICATION_ARCH" = "amd64"
        mkdir -p "$RUNNER_TEMP/fifo_platform" "$RUNNER_TEMP/fifo"
        platform=$RUNNER_TEMP/fifo_platform
        printf '%s\n' 'module(name="fifo_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/fifo.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
            'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
            'build --remote_accept_cached' \
            "build --inject_repository=fifo_platform=$platform" \
            'build --host_platform=@fifo_platform//:ubuntu' \
            'build --extra_execution_platforms=@fifo_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        printf '%s\n' 'build:rbe --spawn_strategy=remote' >> "$rc"
        export FIFO_RC=$rc
        mkdir -p "$RUNNER_TEMP/fifo-bin"
        cat > "$RUNNER_TEMP/fifo-bin/bazel" <<'SH'
        #!/bin/sh
        exec bazelisk --bazelrc="$FIFO_RC" "$@"
        SH
        chmod +x "$RUNNER_TEMP/fifo-bin/bazel"
        export PATH="$RUNNER_TEMP/fifo-bin:$PATH"
        out="$RUNNER_TEMP/fifo"
        export QUALIFICATION_LANE_RESULTS="$out/lanes.jsonl"
        status=0
        bash test/rbe/qualify.sh --arch=amd64 "--test-target=$QUALIFICATION_TARGETS" \
          "--test-filter=$QUALIFICATION_TEST_FILTER" "--bazel-option=--build_event_json_file=$out/events.jsonl" \
          "--bazel-option=--test_sharding_strategy=disabled" "--bazel-option=--cache_test_results=no" \
          "--bazel-option=--test_timeout=1500" "--bazel-option=--test_env=GO_TEST_WRAP_TESTV=1" \
          "--bazel-option=--test_arg=-test.v" "--bazel-option=--test_arg=-test.timeout=23m" \
          "--bazel-option=--remote_download_outputs=toplevel" test || status=$?
        python3 -B test/rbe/probeorigin/result.py "$out" "$status"
    - name: Retain native wire reports, XML, and verdict
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: probe-origin-study
        path: ${{ runner.temp }}/fifo/original
        if-no-files-found: error
    if: ${{ github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1 }}
