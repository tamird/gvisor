name: Verify the cgroup package without DAC overrides
on:
  push:
    branches: [qualification/oci-ancestor-memory]
permissions:
  contents: read
  actions: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: c89f8f55abfe0d08c2bfc836192bd27d0aee7161
      STOCK: d624fba03a2b3f1f9a314e54198c95460005cc15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 8, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        cp test/rbe/{qualification_report.py,unit_matrix.py,state_result.py} "$RUNNER_TEMP/"
        [[ "$(git rev-parse HEAD^2)" == "$CURRENT" ]]
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /var/run/docker.sock:/var/run/docker.sock -v "$(command -v docker):/usr/local/bin/host-docker:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Verify that the test identity respects read-only directories
      run: |
        docker exec tcp-compiler python3 -c '
        import errno, os, subprocess, tempfile
        from pathlib import Path
        with tempfile.TemporaryDirectory() as root:
            parent = Path(root) / "readonly"
            parent.mkdir(mode=0o555)
            # The original privileged coordinator could create this directory.
            (parent / "privileged").mkdir()
            code = "import errno,os,sys\ntry: os.mkdir(sys.argv[1])\nexcept OSError as e: sys.exit(0 if e.errno==errno.EACCES else 1)\nraise SystemExit(1)"
            subprocess.run(["/usr/bin/setpriv", "--bounding-set=-dac_override,-dac_read_search", "--inh-caps=-all", "--ambient-caps=-all", "python3", "-c", code, str(parent / "test")], check=True)
        '
    - name: Run the complete cgroup package with its required permissions
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$CURRENT"
        rec="$RUNNER_TEMP/records"
        git cat-file commit HEAD > "$rec/commit"; git status --porcelain --untracked-files=no > "$rec/before"
        args=(test --config=x86_64 --jobs=2 --strategy=CppCompile=local --spawn_strategy=remote,local '--run_under=/usr/bin/setpriv --bounding-set=-dac_override,-dac_read_search --inh-caps=-all --ambient-caps=-all' --strategy=TestRunner=local --test_env=GO_TEST_WRAP_TESTV=1 --nocache_test_results --build_event_json_file="$RUNNER_TEMP/events.bep" --build_event_publish_all_actions --nobuild_event_json_file_path_conversion)
        labels=(//runsc/cgroup:cgroup_test)
        printf '%s\n' "${args[@]}" "${labels[@]}" > "$rec/arguments"; printf '%s\n' "${labels[@]}" > "$rec/targets"
        cli=(docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc")
        outbase=$("${cli[@]}" info output_base)
        code=0; "${cli[@]}" "${args[@]}" "${labels[@]}" > "$RUNNER_TEMP/package.log" 2>&1 || code=$?
        date -u +%FT%T.%3NZ > "$rec/finish"; echo "$code" > "$rec/exit"; git rev-parse HEAD > "$rec/head"; git status --porcelain --untracked-files=no > "$rec/after"
        tail -20 "$RUNNER_TEMP/package.log"
        cap=0; docker exec tcp-compiler python3 -B "$RUNNER_TEMP/qualification_report.py" capture --events "$RUNNER_TEMP/events.bep" --output "$rec/events.jsonl" --output-root "$outbase" --report-dir "$rec/original" || cap=$?
        echo "$cap" > "$rec/capture-exit"
        python3 -B "$RUNNER_TEMP/state_result.py" context "$rec" "$CURRENT"
        python3 -B "$RUNNER_TEMP/qualification_report.py" verdict --events "$rec/events.jsonl" --context "$rec/context.json" --expected-targets "$rec/targets" --output "$rec/verdict.json"
        python3 - "$rec" <<'PYTHON'
        from pathlib import Path
        import sys,json
        from xml.etree import ElementTree as ET
        p=Path(sys.argv[1]); v=json.loads((p/"verdict.json").read_text()); assert v["status"]=="PASS" and len(v["expected_labels"])==1 and not v["missing"] and not v["errors"],v
        records={c.get("name"):c for f in (p/"original").rglob("test.xml") for c in ET.parse(f).iter("testcase")}
        for case in ("TestCreateController","TestGetLimits","TestGetLimits/get_limit_from_parent_cgroup","TestGetLimits/get_limit_from_leaf_cgroup"):
            assert case in records and not list(records[case].iter("skipped")) and not list(records[case].iter("failure")),case
        PYTHON
    - name: Exclude credentials from the evidence bundle
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key=os.environ["BB_KEY"].encode()
        for f in (Path(os.environ["RUNNER_TEMP"])/"records").rglob("*"):
            if f.is_file() and key and key in (data:=f.read_bytes()):
                f.write_bytes(data.replace(key,b"[REDACTED]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: cgroup-package-results
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
