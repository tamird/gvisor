name: Recover original scratch producers, install both releases and boot native ARM
on:
  push:
    branches: [qualification/lean-scratch-install-recovery]
permissions:
  contents: read
  actions: read
jobs:
  producer:
    outputs:
      handoff: ${{ steps.privacy.outputs.handoff }}
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 82
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 7}
      - name: Stage the existing pinned coordinator tools and reviewed reader
        run: |
          set -eu
          umask 077
          task="$RUNNER_TEMP/release-rbe"
          mkdir -p "$task/bin" "$task/public" "$task/harness"
          cp test/rbe/release_prewarmer/{BUILD,full.py,qualify.py,image_inventory.py,failure_diagnostics.py,install_recovery.py,original_sidecars.py} "$task/harness/"
          cp test/rbe/{native_cross_inputs.py,runtime_cross.py,runtime_guest.py,runtime_sidecars.py,runtime_release.py} "$task/"
          cd "$task/harness"
          sha256sum --check <<'SUMS'
          ae1f23a11f3cb747fbec49a34c510c5ab9dcb75d06d94bfd4d9a49d50c629271  BUILD
          c8ab3e5fbbf2f239f0e009e92749991bd334964b4ecf6e401024312398138501  full.py
          ef04824d57b60bd918a1bb4094893c32d6668cae7189c1b4a4bf995c4a206116  qualify.py
          a61838c5c848386f2dd0b9abc82cd502ff6031040e94e91f5b2da204ed9e5bfe  image_inventory.py
          ce5554207537ae3fea33ac7bd96d9b6418484ea1d15d6c750a807d618333c1e5  failure_diagnostics.py
          5f3f2e3fb725ee8f71839a1312d7b1c32fa8883153d66918f1cae7e34c8215c6  install_recovery.py
          510b106ccd4f431a53cc6df8ef26a6834fc468c922323ba973c051dc4d6daee2  original_sidecars.py
          b0626fb5ecb5bb9c41d644ced5af036019cbefbeef7975c71878021f6e146653  ../native_cross_inputs.py
          32cc74e3f3e8189d9678b609a4058e60ea3a1e955566f229b34dc04b81f973c8  ../runtime_cross.py
          bce1d88d73ba07ca283697e2b9215eb06f1e2f2baacfb43130762ff914d27524  ../runtime_guest.py
          00add0c041b27f27a26f63d289d23f08f19665caaecf2a7d76e15a99327d2ac6  ../runtime_sidecars.py
          c57cf20a43c4de8e1e14f4663417b541ad2289d95b2e7f8a0cf8230540e4fb2b  ../runtime_release.py
          SUMS
          curl --retry 3 --retry-delay 2 --location --fail --silent --show-error --proto '=https' --proto-redir '=https' --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$task/bin/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $task/bin/bazel" | sha256sum -c -
          curl --retry 3 --retry-delay 2 --location --fail --silent --show-error --proto '=https' --proto-redir '=https' --max-time 90 https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 -o "$task/bb"
          echo "205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  $task/bb" | sha256sum -c -
          chmod 755 "$task/bin/bazel" "$task/bb"
          echo "$task/bin" >> "$GITHUB_PATH"
          echo 'USE_BAZEL_VERSION=9.3.1' >> "$GITHUB_ENV"
          echo 'PYTHONDONTWRITEBYTECODE=1' >> "$GITHUB_ENV"
      - name: Bind the product and retain only the reviewed platform declarations
        env: {PRODUCT: 87fd1b411e0f2d06557f04e1f33b154692cfd2eb}
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git rev-parse HEAD^^)" = a1333b363270e49bc6c8f17adb504c2e6d2095ce
          test "$(git rev-parse HEAD^^^)" = f4717ffbfc7a0f3f138224bcaf6404835a24477f
          test "$(git rev-parse HEAD~4)" = 3a98bb3fe7c8d0c7921aafed88b5262836a8a7f9
          test "$(git rev-parse HEAD~5)" = d6067d9eb79b81e87ca0e3778d574d8a4e6a3bbb
          test "$(git rev-parse HEAD~6)" = 9310f06f95b100725450a71fbb896fc8403ec0eb
          test "$(git rev-parse "$PRODUCT^{tree}")" = 557473937cedee3aceb3bd06c981f410f848e29f
          git checkout --detach "$PRODUCT"
          mkdir -p test/rbe/release_prewarmer
          cp "$RUNNER_TEMP/release-rbe/harness/BUILD" test/rbe/release_prewarmer/BUILD
          test "$(git hash-object test/rbe/release_prewarmer/BUILD)" = 0942c3a1b2856d6b31866ec8bb60e280ba38a011
          test -z "$(git diff --name-only HEAD)"
          test "$(git ls-files --others --exclude-standard)" = test/rbe/release_prewarmer/BUILD
          test "$(cat .bazelversion)" = 9.3.1
          bazel --version | grep -Fx 'bazel 9.3.1'
      - name: Read the exact original public receipt archive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tamird/gvisor/actions/artifacts/13457819044/zip > "$RUNNER_TEMP/release-rbe/original.zip"
          echo "9a9cd4bfbe978b0cd5db2c9993c16831b3f84e3c6800c30579ce61107046575b  $RUNNER_TEMP/release-rbe/original.zip" | sha256sum -c -
      - name: Recover the six original sidecar action outputs independently
        continue-on-error: true
        timeout-minutes: 5
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 "$RUNNER_TEMP/release-rbe/harness/original_sidecars.py"
      - name: Configure the trusted Bazel client for remote-only execution
        id: remote
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          test -n "$BUILDBUDDY_API_KEY"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/release-rbe/private.bazelrc"
          test "$(stat -c %a "$RUNNER_TEMP/release-rbe/private.bazelrc")" = 600
          unset BUILDBUDDY_API_KEY
      - name: Install the original AMD64 release using Make and remote cache
        if: steps.remote.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 33
        env:
          CARRIER_SHA: ${{ github.sha }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
        run: python3 "$RUNNER_TEMP/release-rbe/harness/install_recovery.py" amd64
      - name: Install the original ARM64 release using Make and remote cache
        if: always() && steps.remote.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 33
        env:
          CARRIER_SHA: ${{ github.sha }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
        run: python3 "$RUNNER_TEMP/release-rbe/harness/install_recovery.py" arm64
      - name: Stop the client and remove its private configuration
        if: always()
        run: |
          if test -x "$RUNNER_TEMP/release-rbe/bin/bazel"; then
            timeout --signal=INT --kill-after=10 30 "$RUNNER_TEMP/release-rbe/bin/bazel" --nosystem_rc --nohome_rc shutdown >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/release-rbe/private.bazelrc"
      - name: Package the actual installed ARM guest after removing credentials
        if: always() && steps.remote.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          test ! -e "$RUNNER_TEMP/release-rbe/private.bazelrc"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" CARRIER_SHA="$GITHUB_SHA" QUALIFICATION_RUN_ID="$GITHUB_RUN_ID" python3 -B "$RUNNER_TEMP/release-rbe/runtime_release.py" producer
      - name: Require independent original recovery and both Make installations
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "release-rbe" / "public"
          assert json.loads((root / "original-sidecars.json").read_text())["status"] == "PASS"
          for name in ("amd64", "arm64"):
              result = json.loads((root / (name + ".json")).read_text())
              assert result["source"] == "87fd1b411e0f2d06557f04e1f33b154692cfd2eb"
              assert result["status"] == "PASS" and result["native_exit"] == result["make_exit"] == 0
          PYTHON
      - name: Verify the bounded typed public receipts
        id: privacy
        if: always()
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, tarfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "release-rbe" / "public"
          allowed = {"amd64.json", "arm64.json", "original-sidecars.json", "producer.json", "payload.tar.gz"}
          files = list(root.iterdir())
          key = os.environ["ACCESS"].encode()
          assert key and files
          assert not (root.parent / "private.bazelrc").exists()
          for path in files:
              assert path.name in allowed and path.is_file() and not path.is_symlink()
              if path.name == "payload.tar.gz":
                  continue
              assert path.stat().st_size <= 524288
              raw = path.read_bytes()
              assert isinstance(json.loads(raw), dict)
              assert not any(value in raw for value in (key, b"remote_header", b"bes_header", b"Authorization:", b"X-Amz-Signature", b"Bearer "))
          producer = root / "producer.json"
          if producer.exists() and json.loads(producer.read_text())["status"] == "PASS":
              doc = json.loads(producer.read_text())
              assert doc["source"] == "87fd1b411e0f2d06557f04e1f33b154692cfd2eb"
              assert doc["carrier"] == os.environ["GITHUB_SHA"] and doc["run"] == int(os.environ["GITHUB_RUN_ID"])
              archive = root / "payload.tar.gz"
              assert archive.stat().st_size == doc["archive"]["bytes"] < 64000000
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == doc["archive"]["sha256"]
              with tarfile.open(archive, "r:gz") as tar:
                  members = tar.getmembers()
                  assert len(members) == 4 and {m.name for m in members} == {"runsc", "gvisor-bin/gvisor_sentry", "gvisor-bin/gvisor-sentry-prewarmer", "busybox"}
                  for member in members:
                      assert member.isfile() and member.mode == 0o755 and member.size == doc["payload"][member.name]["bytes"]
                      assert hashlib.sha256(tar.extractfile(member).read()).hexdigest() == doc["payload"][member.name]["sha256"]
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  print("handoff=ready", file=output)
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: lean-scratch-install-recovery
          path: ${{ runner.temp }}/release-rbe/public/*.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.privacy.outputs.handoff == 'ready'
        with:
          name: lean-scratch-arm-handoff
          path: |
            ${{ runner.temp }}/release-rbe/public/producer.json
            ${{ runner.temp }}/release-rbe/public/payload.tar.gz
          if-no-files-found: error
          retention-days: 1
  consumer:
    needs: producer
    if: always() && github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && needs.producer.outputs.handoff == 'ready'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: lean-scratch-arm-handoff
        path: ${{ runner.temp }}/release-rbe/handoff
    - name: Bind the native ARM-only consumer
      run: |
        set -eu
        umask 077
        d="$RUNNER_TEMP/release-rbe"
        mkdir "$d/public"
        cp test/rbe/native_cross_inputs.py test/rbe/runtime_cross.py test/rbe/runtime_guest.py test/rbe/runtime_sidecars.py test/rbe/runtime_release.py "$d/"
        echo "b0626fb5ecb5bb9c41d644ced5af036019cbefbeef7975c71878021f6e146653  $d/native_cross_inputs.py" | sha256sum -c -
        echo "32cc74e3f3e8189d9678b609a4058e60ea3a1e955566f229b34dc04b81f973c8  $d/runtime_cross.py" | sha256sum -c -
        echo "bce1d88d73ba07ca283697e2b9215eb06f1e2f2baacfb43130762ff914d27524  $d/runtime_guest.py" | sha256sum -c -
        echo "00add0c041b27f27a26f63d289d23f08f19665caaecf2a7d76e15a99327d2ac6  $d/runtime_sidecars.py" | sha256sum -c -
        echo "c57cf20a43c4de8e1e14f4663417b541ad2289d95b2e7f8a0cf8230540e4fb2b  $d/runtime_release.py" | sha256sum -c -
        printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$d/public/consumer.json"
        test "$(uname -m)" = aarch64
    - name: Boot the received ARM guest without rebuilding
      run: env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" USE_BAZEL_VERSION=9.3.1 CARRIER_SHA="$GITHUB_SHA" QUALIFICATION_RUN_ID="$GITHUB_RUN_ID"
        python3 -B "$RUNNER_TEMP/release-rbe/runtime_release.py" consumer
    - name: Validate the bounded native guest receipt
      id: boundary
      if: always()
      run: |
        python3 -B - <<'PYTHON'
        import json,os,re
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'release-rbe/public'
        assert {p.name for p in root.iterdir()}=={'consumer.json'}
        p=root/'consumer.json'
        assert p.is_file() and not p.is_symlink() and 0<p.stat().st_size<65536
        raw=p.read_bytes();assert json.loads(raw)['status'] in ('PASS','FAIL','INCOMPLETE')
        assert not re.search(rb'(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}',raw)
        PYTHON
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.boundary.outcome == 'success'
      with:
        name: lean-scratch-arm-native-guest
        path: ${{ runner.temp }}/release-rbe/public/consumer.json
        if-no-files-found: error
