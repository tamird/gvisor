name: Qualify host-layout adapter contracts
on:
  push:
    branches: [qualification/hostlayout-adapter-contracts]
permissions:
  contents: read
jobs:
  hostlayout:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: carrier
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6264dbadc8d73f914c64acee7e8067018adbffd6
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Compare generators and exercise existing ABI owners
        working-directory: source
        timeout-minutes: 80
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          WORKER_IMAGE: docker://gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
        shell: bash
        run: |
          set -eu -o pipefail
          test "$(git rev-parse HEAD)" = 6264dbadc8d73f914c64acee7e8067018adbffd6
          test "$(git rev-parse HEAD^)" = 509ad5337346f8cbdba515cefadd542de28d6156
          test "$(git -C ../carrier rev-parse HEAD^)" = 6264dbadc8d73f914c64acee7e8067018adbffd6
          test "$(git -C ../carrier rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C ../carrier rev-parse HEAD:test/rbe/qualification_report.py)" = d2e3eedabc2ad911d958aa448fd916aa6835aa86
          test "$(git -C ../carrier rev-parse HEAD:test/rbe/unit_matrix.py)" = d01d9e319084e18ea2928671e417e1b4e86c4954
          git fetch --no-tags origin 71a996f3993d949dae24cc82fa396eb571d26087
          test "$(git rev-parse FETCH_HEAD^)" = 509ad5337346f8cbdba515cefadd542de28d6156
          platform=$RUNNER_TEMP/catalog_platform
          mkdir -p "$platform"
          printf '%s\n' 'module(name="catalog_platform")' > "$platform/MODULE.bazel"
          cat > "$platform/BUILD" <<BUILD
          platform(
              name = "gnu",
              constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
              exec_properties = {
                  "Arch": "amd64",
                  "OSFamily": "linux",
                  "workload-isolation-type": "firecracker",
                  "container-image": "$WORKER_IMAGE",
                  "EstimatedMemory": "8GB",
              },
              visibility = ["//visibility:public"],
          )
          BUILD
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          rc=$RUNNER_TEMP/hostlayout.bazelrc
          umask 077
          trap 'rm -f "$rc"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
              'build --remote_cache=grpcs://remote.buildbuddy.io' \
              'build --bes_backend=grpcs://remote.buildbuddy.io' \
              'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
              'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
              'build --remote_accept_cached' 'build --remote_cache_compression' 'build --jobs=100' \
              "build --inject_repository=catalog_platform=$platform" \
              'build --host_platform=@catalog_platform//:gnu' \
              'build --extra_execution_platforms=@catalog_platform//:gnu' \
              'build --platforms=//tools/bazeldefs:linux_amd64'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          timeout -k 30 4500 python3 -B ../carrier/test/rbe/qualify_hostlayout.py \
            6264dbadc8d73f914c64acee7e8067018adbffd6 "$rc" "$RUNNER_TEMP/hostlayout"
      - name: Check bounded public receipt
        id: privacy
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          key = os.environ["BUILDBUDDY_API_KEY"]
          assert key
          p = Path(os.environ["RUNNER_TEMP"]) / "hostlayout/result.json"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size < 400000
          data = p.read_bytes()
          json.loads(data)
          assert key.encode() not in data and json.dumps(key)[1:-1].encode() not in data
          assert not re.search(rb"x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_", data, re.I)
          PY
      - if: always() && steps.privacy.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hostlayout-adapter-contracts
          path: ${{ runner.temp }}/hostlayout/result.json
          if-no-files-found: error
