name: Read the four original compiler prerequisite failures
on:
  push:
    branches: [qualification/clang-tidy-prerequisite-logs]
permissions: {contents: read}
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Get the failed original command diagnostics
        env:
          BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.request
          from pathlib import Path
          class FixedOrigin(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a): return None
          req=urllib.request.build_opener(FixedOrigin)
          rows={}
          for uid in ("69c29805-5e55-4d0a-9a67-ebca72abf157","10a68c32-47d4-489a-b5ea-6b59535aaeb4","27ecc6ec-3262-44d6-b542-c64bf0489d33","17fbb658-c93c-4528-9822-fbc6d84a2b8e"):
              text=""; token=""
              for _ in range(4):
                  selector=json.dumps({"selector":{"invocation_id":uid},"page_token":token}).encode()
                  request=urllib.request.Request("https://app.buildbuddy.io/api/v1/GetLog",data=selector,headers={"x-buildbuddy-api-key":os.environ["BB_KEY"],"Content-Type":"application/json"})
                  with req.open(request,timeout=25) as result: page=json.load(result)
                  text+=page.get("log",{}).get("contents","")
                  token=page.get("next_page_token",page.get("nextPageToken",""))
                  if not token: break
              log=re.sub(r"\x1b\[[0-9;?]*[a-zA-Z]","",text)
              lines=log.splitlines()
              projected=[]
              for i,line in enumerate(lines):
                  if not re.search(r"failed: \(Exit|permission denied|no such file|exec format|execve|denied|executable file|FailedPrecondition|rpc error|cannot execute|executable not found",line,re.I): continue
                  for val in lines[i:i+7]:
                      if len(val)>650 or re.search(r"token|authorization|api-key|remote_header|bes_header|gh[pous]_|github_pat_|://[^/ ]+@",val,re.I): continue
                      if val and val not in projected: projected.append(val)
              rows[uid]={"chars":len(text),"sha256":hashlib.sha256(text.encode()).hexdigest(),"partial":bool(token),"cause_excerpt":projected[:28]}
          out=json.dumps(rows,indent=2).encode()
          assert os.environ["BB_KEY"] and os.environ["BB_KEY"].encode() not in out
          Path(os.environ["RUNNER_TEMP"],"original-prerequisites.json").write_bytes(out)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-prerequisites
          path: ${{ runner.temp }}/original-prerequisites.json
          if-no-files-found: error
