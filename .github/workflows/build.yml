name: Compare shared and reusable overlay registrations
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/overlay-one-transition'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      STOCK: a25cac698d19a97c49fb5ee5bed654ba5365a330
      FIXED: a25cac698d19a97c49fb5ee5bed654ba5365a330
      POOL: 5d31acac10213da67ea19098125191d47db63051
      BENCHTOOL: 2b51abee8530385431b7225198fdd5cd65e78696
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=3 origin "$STOCK" "$FIXED" "$POOL" "$BENCHTOOL"
        [[ $(git rev-parse HEAD^) == "$FIXED" ]]
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Verify the registered source on one and two overlays
      shell: bash
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$FIXED"
        out="$RUNNER_TEMP/overlay-proof/binding"; mkdir -p "$out"; git rev-parse HEAD >"$out/source"; rc=0
        bazelisk --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=48 --strategy=TestRunner=local --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=all --test_sharding_strategy=disabled --test_arg=-test.v '--test_arg=-test.run=^(TestPollWaiterAfterOverlayCopyUp|TestOverlayLowerPollLifetime|TestStackedPollBinding)$' //pkg/sentry/syscalls/linux:linux_test >"$RUNNER_TEMP/functional.log" 2>&1 || rc=$?
        echo "$rc" >"$out/exit"
        file=bazel-testlogs/pkg/sentry/syscalls/linux/linux_test/test.log
        if [[ -f $file ]]; then grep -E -- '--- (PASS|FAIL): (TestStackedPollBinding|TestPollWaiterAfterOverlayCopyUp|TestOverlayLowerPollLifetime)|selected final proc file|128 registrations reused their entry under concurrent notifications|released waiter|lower refs=|original lower|missing live lower|copied-up references|removed waiter|final references|did not reach' "$file" >"$out/receipt" || true; fi
        grep -E '^ERROR:|INFO: Invocation ID:|Build (did NOT complete|completed)|[.]go:[0-9]+:[0-9]+:' "$RUNNER_TEMP/functional.log" | tail -12 >>"$out/receipt" || true
        cat "$out/receipt"; [[ $rc == 0 ]]
        [[ $(grep -c "128 registrations reused their entry under concurrent notifications" "$out/receipt") == 2 ]]
        for name in TestPollWaiterAfterOverlayCopyUp TestOverlayLowerPollLifetime TestStackedPollBinding 'TestStackedPollBinding/innerFirst=true' 'TestStackedPollBinding/innerFirst=false'; do grep -Fq -- "PASS: $name (" "$out/receipt"; done
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: overlay-transition-lifetimes
        path: ${{ runner.temp }}/overlay-proof/binding/
    - name: Measure direct and forwarded registrations in ABBA order
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/overlay-proof/cost"; mkdir -p "$root"; i=0
        for arm in stock fixed pool pool fixed stock; do
          i=$((i+1)); rev=$STOCK; [[ $arm == stock ]] || rev=$FIXED; [[ $arm != pool ]] || rev=$POOL
          git checkout --quiet --detach "$rev"; [[ $(git rev-parse HEAD) == "$rev" ]]; out="$root/$i-$arm"; mkdir -p "$out"; echo "$rev" >"$out/source"; rc=0
          bazelisk --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=48 --strategy=TestRunner=local --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=all --test_sharding_strategy=disabled --test_arg=-test.v '--test_arg=-test.run=^TestOverlayPollCost$' //pkg/sentry/syscalls/linux:linux_test >"$RUNNER_TEMP/cost.log" 2>&1 || rc=$?
          echo "$rc" >"$out/exit"; file=bazel-testlogs/pkg/sentry/syscalls/linux/linux_test/test.log
          if [[ -f $file ]]; then grep -E 'SIZES file=[0-9]+ pollState=[0-9]+ waiter=[0-9]+' "$file" > "$out/sizes"; grep -E '^BenchmarkOverlayPoll/(direct-)?(proc|tmpfs)/live(1|8) 100000 [0-9.]+ ns/op [0-9.]+ allocs/op$' "$file" >"$out/samples" || true; fi
          grep -E '^ERROR:|INFO: Invocation ID:|Build (did NOT complete|completed)|[.]go:[0-9]+:[0-9]+:' "$RUNNER_TEMP/cost.log" | tail -12 >"$out/receipt" || true
          cat "$out/receipt"; [[ $rc == 0 ]]; [[ $(wc -l <"$out/samples") == 80 ]]; for layer in tmpfs proc direct-tmpfs direct-proc; do for n in 1 8; do [[ $(grep -c "^BenchmarkOverlayPoll/$layer/live$n " "$out/samples") == 10 ]]; done; done
          cat "$out/samples" >>"$root/$arm.bench"
        done
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: overlay-transition-costs
        path: ${{ runner.temp }}/overlay-proof/cost/
    - name: Summarize the original samples with the pinned benchstat executable
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$BENCHTOOL"; out="$RUNNER_TEMP/overlay-proof/cost"; [[ $(wc -l <"$out/stock.bench") == 160 && $(wc -l <"$out/fixed.bench") == 160 && $(wc -l <"$out/pool.bench") == 160 ]]
        tgt=@org_golang_x_perf//cmd/benchstat; baz=(bazelisk --bazelrc="$RUNNER_TEMP/overlay.bazelrc")
        "${baz[@]}" build -c opt --config=x86_64 --jobs=48 --remote_download_outputs=toplevel "$tgt" >"$RUNNER_TEMP/build-benchstat.log" 2>&1
        "${baz[@]}" cquery -c opt --config=x86_64 --output=files "$tgt" > "$RUNNER_TEMP/paths" 2>"$RUNNER_TEMP/query.log"
        mapfile -t bins < <(while IFS= read -r f; do [[ ! -f $f || ! -x $f ]] || echo "$f"; done <"$RUNNER_TEMP/paths"); [[ ${#bins[@]} == 1 ]]; tool=$PWD/${bins[0]}; cd "$out"; "$tool" stock.bench fixed.bench pool.bench >benchstat.txt; cat benchstat.txt
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: overlay-transition-benchstat
        path: ${{ runner.temp }}/overlay-proof/cost/benchstat.txt
    - name: Start the matched GNU Bazel coordinator
      run: |
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name overlay-guest --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
    - name: Run restore-async-gnu
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$FIXED"; out="$RUNNER_TEMP/overlay-proof/restore-async-gnu"; mkdir -p "$out"; git rev-parse HEAD >"$out/source"; rc=0
        docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=32 --strategy=TestRunner=remote --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_timeout=300 --test_output=all --test_sharding_strategy=disabled  //test/syscalls:epoll_test_runsc_systrap_directfs_save >"$RUNNER_TEMP/restore-async-gnu.log" 2>&1 || rc=$?
        echo "$rc" >"$out/exit"; file=bazel-testlogs/test/syscalls/epoll_test_runsc_systrap_directfs_save/test.log
        docker exec overlay-guest cat "$file" >"$RUNNER_TEMP/overlay-guest-test.log" 2>/dev/null || true; file="$RUNNER_TEMP/overlay-guest-test.log"
        if [[ -s $file ]]; then grep -E -- '[A-Z_]+: (both signal FDs|released lower|checkpoint=)|--- (PASS|FAIL): TestStacked|128 registrations reused|removed waiter silent|DATA RACE|[.]cc:[0-9]+: Failure|\[ (  FAILED  |       OK)|error loading kernel during restore|Actual:|Expected:|Value of:|test failed|EpollTest[./]OverlayAsyncRegistration|[.]cc:[0-9]+:[0-9]+: error:' "$file" | tail -50 >"$out/receipt" || true; fi
        grep -E '^ERROR:|INFO: Invocation ID:|Build (did NOT complete|completed)|[.]go:[0-9]+:[0-9]+:|^(//|Target )|^Executed ' "$RUNNER_TEMP/restore-async-gnu.log" | tail -14 >>"$out/receipt" || true
        cat "$out/receipt"
        [[ $rc == 0 ]]; grep -Fq -- 'checkpoint=1;' "$out/receipt"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: overlay-local-restore-async-gnu
        path: ${{ runner.temp }}/overlay-proof/restore-async-gnu/
    - name: Verify the two previously unexecuted listener Nogo labels
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$STOCK"; out="$RUNNER_TEMP/overlay-proof/owners"; mkdir -p "$out"; git rev-parse HEAD >"$out/source"; rc=0
        bazelisk --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=4 --strategy=TestRunner=linux-sandbox --strategy=GoStdlib=linux-sandbox --strategy=GoStdlibList=linux-sandbox --strategy=GoStandardLibraryAnalysis=linux-sandbox --strategy=GoStaticAnalysis=linux-sandbox '--modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' --nocache_test_results --keep_going --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_sharding_strategy=disabled --test_output=errors //pkg/waiter:waiter_nogo //pkg/sentry/fsimpl/overlay:overlay_nogo >"$RUNNER_TEMP/owners.log" 2>&1 || rc=$?
        echo "$rc" >"$out/exit"; grep -E '^ERROR:|INFO: Invocation ID:|Build (did NOT complete|completed)|[.]go:[0-9]+:[0-9]+:|^//pkg/|^Executed ' "$RUNNER_TEMP/owners.log" | tail -18 >"$out/receipt" || true; cat "$out/receipt"; [[ $rc == 0 ]]; grep -Eq '^//pkg/sentry/fsimpl/overlay:overlay_nogo[[:space:]]+.*PASSED' "$out/receipt"; grep -Eq '^//pkg/waiter:waiter_nogo[[:space:]]+.*PASSED' "$out/receipt"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: overlay-listener-exact-owners
        path: ${{ runner.temp }}/overlay-proof/owners/
    - name: Clear temporary RBE settings
      if: always()
      run: docker rm -f overlay-guest || true; rm -f "$RUNNER_TEMP/overlay.bazelrc"
