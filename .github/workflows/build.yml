name: Static Go executable runfiles
on:
  push:
    branches: [qualification/compiler-static-runfiles-layout]
permissions: {contents: read}
jobs:
  runfiles:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      COMPILER: a385bd2b0155b82faf4fc6a0c195a153ad57550c
      FIXED: ba5685f0275d2aaa3e3878ca9c9155c2c79a4c90
      FIXED_TREE: 778ef816ec23a90d5a7b0c2ece16c607b139c41b
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 3, persist-credentials: false}
    - name: Bind both sources, the unchanged runtime consumers and the fork-only probe
      run: |
        set -euo pipefail
        mkdir -m 700 "$RUNNER_TEMP/runfiles"
        printf '{"status":"INCOMPLETE","stage":"source"}\n' > "$RUNNER_TEMP/runfiles/result.json"
        test "$(git rev-parse HEAD^)" = "$FIXED"
        test "$(git rev-parse HEAD^^)" = "$COMPILER"
        test "$(git rev-parse "$FIXED^{tree}")" = "$FIXED_TREE"
        test "$(git diff --name-only "$COMPILER" "$FIXED")" = tools/bazeldefs/static.bzl
        test "$(git diff --name-only "$FIXED" HEAD)" = "$(printf '%s\n' .github/workflows/build.yml test/rbe/static_go_runfiles.go test/rbe/static_go_runfiles.py)"
        cp test/rbe/static_go_runfiles.{go,py} "$RUNNER_TEMP/runfiles/"
        test "$(bazel --version)" = 'bazel 8.8.1'
    - name: Check the real Go and C++ consumers on each compiler tree
      run: python3 -B "$RUNNER_TEMP/runfiles/static_go_runfiles.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: static-go-runfiles
        path: ${{ runner.temp }}/runfiles/result.json
        if-no-files-found: error
