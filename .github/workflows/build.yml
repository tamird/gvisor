name: Measure TCP half-close readiness and check socket behavior
on:
  push:
    branches: [qualification/tcp-shutdown-readiness-scalar]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: 78178215248c7f8e5438581fb934586131a807d4
      TEST_ARCH: x86_64
      FIXTURE_SHA256: 112e9234135cd57b4c17a82a54a434778d213229e0e620683bee4f98c30d49a0
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/records/verdict.json"
        cp test/rbe/tcp-poll-result.py "$RUNNER_TEMP/verify-tcp.py"
        cp test/rbe/tcp-readiness-benchmark.py "$RUNNER_TEMP/benchmark.py"
        mkdir -p "$RUNNER_TEMP/tcp-evidence"
        git fetch -q --depth=2 https://github.com/tamird/gvisor.git "$PRODUCT"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        # Read only the original compile diagnostic; keep server logs off the artifact.
        python3 - <<'PYERROR'
        import json, os, pathlib, re, urllib.request
        from urllib.error import URLError
        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, *args):
                return None
        previous = "5dc1309c-4e3b-4428-ac9d-e36032a4d988"
        request = urllib.request.Request("https://app.buildbuddy.io/api/v1/GetLog",
            data=json.dumps({"selector": {"invocation_id": previous}}).encode(),
            headers={"Content-Type": "application/json", "x-buildbuddy-api-key": os.environ["BUILDBUDDY_API_KEY"]})
        result = {"invocation": previous, "diagnostics": []}
        try:
            with urllib.request.build_opener(NoRedirect).open(request, timeout=20) as response:
                log = json.load(response)
            import base64
            contents = log.get("log", {}).get("contents", "")
            for text in [contents, *( [base64.b64decode(contents).decode("utf-8","replace")] if re.fullmatch(r"[0-9A-Za-z+/=]+", contents) else [] )]:
                result["diagnostics"].extend(sorted(set(re.findall(r"[a-zA-Z0-9_-]+\.go:\d+:\d+: undefined: tcpip", text))))
        except (ValueError, URLError, OSError):
            result["collection"] = "original log unavailable"
        pathlib.Path(os.environ["RUNNER_TEMP"], "tcp-evidence", "prior-compile.json").write_text(json.dumps(result))
        PYERROR
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
        docker exec tcp-compiler python3 -c 'import socket; s=socket.socket(socket.AF_INET6); s.bind(("::1",0)); print(s.getsockname())' > "$RUNNER_TEMP/records/native-ipv6"
    - name: Run all six IPv4 and IPv6 cases on the revised netstack
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$PRODUCT"
        for name in poll-fixed; do
          src=$PRODUCT
          testname=tcp_socket_test
          path=test/syscalls/linux/tcp_socket.cc
          filter='AllInetTests/TcpSocketTest.HalfCloseReadiness*:AllInetTests/TcpSocketTest.PollAfterShutdown/*'
          executor=remote
          platform=runsc_ptrace
          git checkout --quiet --detach "$src"
          [[ "$(git rev-parse HEAD)" == "$src" ]]
          d=$RUNNER_TEMP/records/$name; mkdir -p "$d"
          sha256sum "$path" > "$d/fixture-sha256"
          target="//test/syscalls:${testname}_${platform}"
          printf '%s\n' "$src" > "$d/source"; printf '%s\n' "$target" > "$d/target"
          printf '%s\n' "$executor" > "$d/executor"; printf '%s\n' "$filter" > "$d/filter"
          date -u +%FT%TZ > "$d/start"
          rc=0
          docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=64 --verbose_failures --strategy=TestRunner="$executor" --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=all --test_timeout=450 --test_sharding_strategy=disabled --test_env=GTEST_FILTER="$filter" "$target" > "$d/bazel.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$d/exit"; date -u +%FT%TZ > "$d/end"
          for file in test.log test.xml; do
            docker exec tcp-compiler cat "bazel-testlogs/test/syscalls/${target#*:}/$file" > "$d/$file" || rm -f "$d/$file"
          done
        done
    - name: Verify each actual socket assertion
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/verify-tcp.py" "$RUNNER_TEMP/records"
    - name: Check a rejected shutdown request before connect and its saved scalar
      if: ${{ !cancelled() }}
      env:
        READINESS_CONTROL: '1'
      run: python3 "$RUNNER_TEMP/benchmark.py"
    - name: Measure established socket readiness on the same native runner
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/benchmark.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: tcp-shutdown-readiness-check
        path: |
          ${{ runner.temp }}/records/verdict.json
          ${{ runner.temp }}/tcp-evidence/*.json
          ${{ runner.temp }}/tcp-evidence/*.bench
        if-no-files-found: error
