name: Observe ordinary procfs watch cache pressure
on:
  push:
    branches: [qualification/kernfs-watched-pressure]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/kernfs-watched-pressure'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      SOURCE: 675b1730cdeaf8f59a930c0514ced5d520c890a3
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 3
        persist-credentials: false
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records"
        printf '{"verified":false,"reason":"incomplete"}\n' > "$RUNNER_TEMP/records/verdict.json"
        [[ $(git rev-parse HEAD^1) == "$SOURCE" ]]
        [[ $(git rev-parse "$SOURCE^") == 918aefd5f3771a161013fb72873d8aa19196e1bc ]]
        [[ $(git rev-parse "$SOURCE:test/syscalls/linux/inotify.cc") == 0e9bccf69457ab8534beb9a4f58f1227e64a45cf ]]
        cp .github/qualification/kernfs-pressure.py "$RUNNER_TEMP/"
        git fetch --quiet --no-tags --depth=1 origin fb60e127516defd6aab633f80be09a03022f0737
        for tool in qualification_report unit_matrix; do
          git show "fb60e127516defd6aab633f80be09a03022f0737:test/rbe/$tool.py" > "$RUNNER_TEMP/$tool.py"
        done
        git checkout --quiet --detach "$SOURCE"
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","EstimatedMemory":"2GB","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Start the existing GNU Bazel coordinator
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name overlay-guest --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'

    - name: Check native and guest test target names before compiling
      run: |
        for leaf in native runsc_ptrace; do
          label="//test/syscalls:inotify_test_${leaf}"
          docker exec overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" query "$label" | grep -Fx "$label"
        done
    - name: Exercise normal cache pressure on Linux
      run: python3 "$RUNNER_TEMP/kernfs-pressure.py" native
    - name: Exercise normal cache pressure on gVisor
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/kernfs-pressure.py" runsc_ptrace
    - name: Reconcile source-bound cases
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/kernfs-pressure.py" verdict
    - name: Check published records
      id: privacy
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYSCAN'
        import os
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"]) / "records"
        for p in root.iterdir():
            data = p.read_bytes()
            if p.suffix not in (".json", ".xml") or (os.environ["BB_KEY"] and os.environ["BB_KEY"].encode() in data) or b"x-buildbuddy-api-key" in data.lower():
                p.unlink()
                raise RuntimeError("withheld unexpected record")
        PYSCAN
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ !cancelled() && steps.privacy.outcome == 'success' }}
      with:
        name: kernfs-watched-pressure
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
