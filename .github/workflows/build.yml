name: Qualify the two optimized releases on the empty AMD64 worker
"on":
  push:
    branches: [qualification/registry-llvm-empty-worker-releases]
permissions: {}
jobs:
  release:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    steps:
      - name: Bind the corrected SDK, producer changes and qualified evidence readers
        run: |
          set -eu
          umask 077
          work="$RUNNER_TEMP/release-rbe"
          mkdir -p "$work/public"
          raw=https://raw.githubusercontent.com/tamird/gvisor
          stock=9e1db6e550d181ff2c691a5e8df8412b74316415
          trial=0aaba01e532bd9f11664ccde2e5aa81ea44fcbba
          donor=958860d724390d2028692a62a89f50656bcd1eab
          worker=e89646dda45516a7fe54427a0586a39dc20a7db3
          git init -q .
          GIT_TERMINAL_PROMPT=0 git -c gc.auto=0 fetch --no-auto-maintenance -q --depth=5 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD^)" = "$trial"
          test "$(git rev-parse "$trial~3")" = "$stock"
          git diff --exit-code "$trial" FETCH_HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/empty_release.py'
          git show 'FETCH_HEAD:.github/qualification/empty_release.py' > "$work/prove.py"
          git checkout -q --detach "$stock"
          test ! -e test/rbe/release_prewarmer
          test ! -e test/rbe/release_validation_roots
          mkdir test/rbe/release_prewarmer test/rbe/release_validation_roots
          printf '%s\n' 'filegroup(name="active", srcs=["//:release"], output_group="_validation")' > test/rbe/release_validation_roots/BUILD
          fetch() { curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 --max-time 120 "$1" -o "$2"; }
          fetch "$raw/$worker/test/rbe/release_prewarmer/BUILD" test/rbe/release_prewarmer/BUILD
          echo 'ae1f23a11f3cb747fbec49a34c510c5ab9dcb75d06d94bfd4d9a49d50c629271  test/rbe/release_prewarmer/BUILD' | sha256sum -c -
          cd "$work"
          for file in full.py qualify.py image_inventory.py; do fetch "$raw/$donor/test/rbe/release_prewarmer/$file" "$file"; done
          fetch https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 bazel
          fetch https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 bb
          sha256sum -c <<'SUMS'
          15c2938a5b98d80c99a5b63d8a0ab624e215affb167361a5601a0858d15e1ff3  full.py
          ef04824d57b60bd918a1bb4094893c32d6668cae7189c1b4a4bf995c4a206116  qualify.py
          a61838c5c848386f2dd0b9abc82cd502ff6031040e94e91f5b2da204ed9e5bfe  image_inventory.py
          7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel
          205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  bb
          SUMS
          chmod 700 bazel bb
          cat > submit <<'BASH'
          #!/bin/bash
          set -eu
          umask 077
          : "${BUILDBUDDY_API_KEY:?missing fork key}"
          w="$RUNNER_TEMP/release-rbe"
          trap 'rm -f "$w/remote.bazelrc"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$w/remote.bazelrc"
          unset BUILDBUDDY_API_KEY
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$w/prove.py" "$1"
          BASH
          chmod 700 submit
      - name: Verify the real stock and corrected release inputs without credentials
        run: |
          set -eu
          work="$RUNNER_TEMP/release-rbe"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$work/prove.py" stock-graph
          git checkout -q --detach 0aaba01e532bd9f11664ccde2e5aa81ea44fcbba
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$work/prove.py" trial-graph
          git checkout -q --detach 9e1db6e550d181ff2c691a5e8df8412b74316415
      - name: Observe the original unet formatter on the empty worker
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: '"$RUNNER_TEMP/release-rbe/submit" stock'
      - name: Select the corrected release source
        run: |
          test ! -e "$RUNNER_TEMP/release-rbe/remote.bazelrc"
          git checkout -q --detach 0aaba01e532bd9f11664ccde2e5aa81ea44fcbba
      - name: Qualify native generation and both real release roots
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: '"$RUNNER_TEMP/release-rbe/submit" releases'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: registry-llvm-empty-worker-releases
          path: ${{ runner.temp }}/release-rbe/public/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove private coordinator files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/release-rbe"
