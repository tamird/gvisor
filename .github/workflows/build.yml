name: Read original Make and compiler failures
on:
  push:
    branches: [qualification/plugin-scratch]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Read exact original invocations
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/package-evidence"
          printf '%s\n' '{"status":"INCOMPLETE","executed_targets":0,"phase":"reader bootstrap"}' > "$RUNNER_TEMP/package-evidence/recovery.json"
          test -n "$BUILDBUDDY_API_KEY"
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "bdb65b4bddb8405a80b3e45a3ef4c740819b151d0709d360e8add8dac534c224  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
          python3 test/rbe/empty_worker/recover_make.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: make-original-errors
          path: |
            ${{ runner.temp }}/package-evidence/recovery.json
            ${{ runner.temp }}/package-evidence/coordinator-lookup.json
          if-no-files-found: error
