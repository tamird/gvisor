name: Verify the QEMU source fixture and independently recover the wrk2 license records
on:
  push:
    branches: [qualification/official-go-images]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-22.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 6
      - name: Configure the pinned Linux execution platform
        id: setup
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          echo "Coordinator $(gcc -dumpfullversion), worker GCC 11"
          test "$(gcc -dumpversion | cut -d. -f1)" = 11
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
          mkdir -p "$RUNNER_TEMP/gnu"
          GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
          test -n "$BUILDBUDDY_API_KEY"
          rc=$RUNNER_TEMP/images.bazelrc
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          cat >> "$rc" <<'RC'
          build --jobs=8
          build --strategy=GoStdlib=linux-sandbox
          build --strategy=GoStdlibList=linux-sandbox
          build --strategy=GoStandardLibraryAnalysis=linux-sandbox
          build --strategy=GoStaticAnalysis=linux-sandbox
          build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache
          build --noremote_upload_local_results
          build --remote_download_outputs=toplevel
          build --noshow_progress
          RC
          for name in wrk2-final-catalog; do git show "$GITHUB_SHA:test/rbe/$name.sh" > "$RUNNER_TEMP/$name.sh"; done
      - name: Exercise the held classifier's complete owning Go test on current master
        id: held
        timeout-minutes: 11
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/held"; exec > >(tee "$RUNNER_TEMP/held/full-test.log") 2>&1
          git checkout -q --detach 0ea1ef52852648509db60dba0f9390052e0cfd2f
          git rev-parse HEAD > "$RUNNER_TEMP/held/source"
          bazel --bazelrc="$RUNNER_TEMP/images.bazelrc" test //tools/licensecheck:licensecheck_test --test_arg=-test.v --test_output=all --nocache_test_results
          grep -Eq -- '--- PASS: TestEnumerateAndFetchQemuLicenseSource' "$RUNNER_TEMP/held/full-test.log"
          xml=$(bazel --bazelrc="$RUNNER_TEMP/images.bazelrc" info bazel-testlogs)/tools/licensecheck/licensecheck_test/test.xml
          cp "$xml" "$RUNNER_TEMP/held/test.xml"
          date -u '+PASS %FT%TZ' > "$RUNNER_TEMP/held/verdict"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.held.outcome != 'skipped'
        with:
          name: held-classifier-results
          path: ${{ runner.temp }}/held
          if-no-files-found: error
      - name: Verify the additional COPYRIGHT lookup
        id: filename
        if: always() && steps.setup.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/filename"; exec > >(tee "$RUNNER_TEMP/filename/test.log") 2>&1
          git checkout -q --detach 09512475c9afd60b7a4a3935314909b015012cf8
          bazel --bazelrc="$RUNNER_TEMP/images.bazelrc" test //tools/licensecheck:licensecheck_test --test_filter=TestLicenseSourceIdentity/pinned.COPYRIGHT --test_arg=-test.v --test_output=all --nocache_test_results
          grep -Eq -- '--- PASS: TestLicenseSourceIdentity/pinned_COPYRIGHT' "$RUNNER_TEMP/filename/test.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.filename.outcome != 'skipped'
        with:
          name: filename-test
          path: ${{ runner.temp }}/filename
          if-no-files-found: error
      - name: Run canonical Verify and discover the four new notices from an empty per-record seed
        id: image
        if: always() && steps.setup.outcome == 'success'
        timeout-minutes: 23
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/wrk2-final-catalog.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.image.outcome != 'skipped'
        with:
          name: wrk2-canonical-records
          path: ${{ runner.temp }}/wrk2/licenses
          if-no-files-found: error
