name: Configure the public release on a minimal Bazel client
on:
  push:
    branches: [qualification/lean-release-client-probe]
permissions: {contents: read}
jobs:
  linux:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Query release dependencies without building actions
        run: python3 -I -B .github/qualification/lean_release_client.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lean-client-repository-actions
          path: ${{ runner.temp }}/lean-client.json
          if-no-files-found: error
          retention-days: 7
