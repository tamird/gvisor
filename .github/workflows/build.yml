name: Verify the TCP selective acknowledgment amendment
on:
  push:
    branches: [qualification/tcp-sack-review]
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 4
      - name: Recover the original exact case records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sacked"
          mkdir -p "$out"
          id=12952825480
          gh api "repos/tamird/gvisor/actions/artifacts/$id" > "$RUNNER_TEMP/original.json"
          test "$(jq -r .workflow_run.id "$RUNNER_TEMP/original.json")" = 40998623756
          gh api "repos/tamird/gvisor/actions/artifacts/$id/zip" > "$RUNNER_TEMP/original.zip"
          printf '%s  %s\n' "$(jq -er '.digest|ltrimstr("sha256:")' "$RUNNER_TEMP/original.json")" "$RUNNER_TEMP/original.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/original.zip" -d "$out"
          cp "$out/verdict.json" "$out/original-verdict.json"
          cp "$out/nogo.log" "$out/original-nogo.log"
          test "$(jq -r .arms.candidate.head "$out/original-verdict.json")" = 8a3d1a53448caae65a60f090f1d60fa3d9f548e9
          test "$(jq -r .arms.candidate.native_exit "$out/original-verdict.json")" = 0
          test "$(jq -r .arms.stock.native_exit "$out/original-verdict.json")" = 3
          git show "$GITHUB_SHA:test/rbe/sack_review_final.py" > "$RUNNER_TEMP/sack-review.py"
          git checkout --quiet --detach 7d7f552333cf0aa6fa9563577b97adbda779eff4
          test "$(git rev-parse HEAD)" = 7d7f552333cf0aa6fa9563577b97adbda779eff4
          git diff --quiet
      - name: Preflight actual Linux sandbox support
        run: |
          set -euo pipefail
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
      - name: Run exact packet suites and both Nogo tests
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sacked"
          mkdir -p "$RUNNER_TEMP/gnu"
          GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
          test -n "$BUILDBUDDY_API_KEY"
          rc=$RUNNER_TEMP/epoll.bazelrc
          umask 077
          trap 'rm -f "$rc"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          test "$(git rev-parse HEAD)" = 7d7f552333cf0aa6fa9563577b97adbda779eff4
          echo "7d7f552333cf0aa6fa9563577b97adbda779eff4" > "$out/candidate-source"
          date -u +%FT%T.%3NZ > "$out/candidate-start"
          code=0
          bazel --bazelrc="$rc" test --config=x86_64 --jobs=4 --test_sharding_strategy=disabled --nocache_test_results --test_arg=-test.v --test_output=errors //pkg/tcpip/transport/tcp/test/e2e:tcp_rack_test //pkg/tcpip/transport/tcp:tcp_test > "$out/candidate-bazel.log" 2>&1 || code=$?
          date -u +%FT%T.%3NZ > "$out/candidate-finish"
          echo "$code" > "$out/candidate-exit"
          for path in pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test pkg/tcpip/transport/tcp/tcp_test; do
            for ext in xml log; do
              dest="$out/candidate-$(basename "$path").$ext"
              rm -f "$dest"
              if [[ -f bazel-testlogs/$path/test.$ext ]]; then cp -L "bazel-testlogs/$path/test.$ext" "$dest"; fi
            done
          done
          code=0
          bazel --bazelrc="$rc" test --config=x86_64 --jobs=4 --build_tag_filters= --test_tag_filters= --test_sharding_strategy=disabled --nocache_test_results --strategy=GoStaticAnalysis=linux-sandbox --strategy=GoStandardLibraryAnalysis=linux-sandbox --strategy=GoStdlib=linux-sandbox --strategy=GoStdlibList=linux-sandbox '--modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' --test_output=errors //pkg/tcpip/transport/tcp:tcp_nogo //pkg/tcpip/transport/tcp:tcp_test_nogo > "$out/nogo.log" 2>&1 || code=$?
          date -u +%FT%T.%3NZ > "$out/analyzers-execution-finish"
          echo "$code" > "$out/nogo-exit"
          for label in tcp_nogo tcp_test_nogo; do
            for ext in xml log; do
              f="bazel-testlogs/pkg/tcpip/transport/tcp/$label/test.$ext"
              if [[ -f "$f" ]]; then cp -L "$f" "$out/$label.$ext"; fi
            done
          done
          git rev-parse HEAD > "$out/final-head"
          git status --porcelain --untracked-files=no > "$out/final-modifications"
          tail -18 "$out/nogo.log"
          python3 -B "$RUNNER_TEMP/sack-review.py" "$out" 574c0fe105112432c1a2785d978064685064b105 7d7f552333cf0aa6fa9563577b97adbda779eff4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tcp-sack-review
          path: ${{ runner.temp }}/sacked
