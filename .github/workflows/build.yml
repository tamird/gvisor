name: Compare the first TCP repair across GSO queue shapes
on:
  push:
    branches: [qualification/rack-credit-wire]
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 5
      - name: Prepare Linux sandbox
        run: |
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
      - name: Observe retransmissions on both source trees
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wire"
          mkdir -p "$RUNNER_TEMP/gnu"
          GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
          test -n "$BUILDBUDDY_API_KEY"
          rc=$RUNNER_TEMP/epoll.bazelrc
          umask 077
          trap 'rm -f "$rc"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          git show "$GITHUB_SHA:test/rbe/rack_credit_wire_report.py" > "$RUNNER_TEMP/report.py"
          for label in old new; do
            if [[ $label = old ]]; then h=5b2fd6d332d0f68d63abe10bd53e564147801740; else h=a0001deba4f6d219f8c2379d60f6aa88c5e9b4a1; fi
            git checkout --quiet --detach "$h"
            git diff --quiet
            dir="$out/$label"
            mkdir -p "$dir"
            git rev-parse HEAD > "$dir/head"
            test "$(cat "$dir/head")" = "$h"
            code=0
            bazel --bazelrc="$rc" test --config=x86_64 --jobs=4 --test_sharding_strategy=disabled --nocache_test_results --test_arg=-test.v '--test_arg=-test.run=^TestRACKWireCredit$' --test_output=errors //pkg/tcpip/transport/tcp/test/e2e:tcp_rack_test > "$RUNNER_TEMP/$label-bazel.log" 2>&1 || code=$?
            date -u +%FT%T.%3NZ > "$dir/finished"
            echo "$code" > "$dir/exit"
            for ext in log xml; do
              f="bazel-testlogs/pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test/test.$ext"
              if [[ -f "$f" ]]; then cp -L "$f" "$dir/test.$ext"; fi
            done
            tail -18 "$RUNNER_TEMP/$label-bazel.log"
          done
          python3 -B "$RUNNER_TEMP/report.py" "$out" 5b2fd6d332d0f68d63abe10bd53e564147801740 a0001deba4f6d219f8c2379d60f6aa88c5e9b4a1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rack-credit-wire
          path: ${{ runner.temp }}/wire
          if-no-files-found: error
