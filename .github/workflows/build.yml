name: Recover the host FD notifier analyzer reports
on:
  push:
    branches: [qualification/fdnotifier-startup-records]
permissions: {contents: read, actions: read}
jobs:
  recover:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE: aa767e4c43d011121271551fe24da501a56f729d
      PRODUCT: ff062297311a053e968fc6cdf2b7e98f09854232
      STOCK_TREE: 6a92ca6e6d0cc17456920c57505ee91334209f8d
      FIX_TREE: 000b6ff7d4e8c9635befbb6a241748a598e68bfe
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 4, persist-credentials: false}
    - name: Read the original qualification and its analyzer stream
      env:
        GH_TOKEN: ${{ github.token }}
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^)" = "$PRODUCT"
        gh run download 41215783485 --repo tamird/gvisor --name fdnotifier-startup --dir "$RUNNER_TEMP/original"
        cp test/rbe/fdnotifier_originals.py "$RUNNER_TEMP/"
        python3 "$RUNNER_TEMP/fdnotifier_originals.py" original || test "$?" = 1
    - name: Materialize only the two analyzer output groups if absent from the original stream
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        if test -f "$RUNNER_TEMP/final.json"; then exit 0; fi
        mkdir -p "$RUNNER_TEMP/focused_platform" "$RUNNER_TEMP/results"/{stock,fix}
        platform=$RUNNER_TEMP/focused_platform
        printf '%s\n' 'module(name="focused_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/focused.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
            'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
            'build --remote_accept_cached' \
            "build --inject_repository=focused_platform=$platform" \
            'build --host_platform=@focused_platform//:ubuntu' \
            'build --extra_execution_platforms=@focused_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        git checkout --quiet --detach "$PRODUCT"
        test "$(git write-tree)" = "$FIX_TREE"
        bazelisk --bazelrc="$rc" build --config=x86_64 --output_groups=nogo_findings --remote_download_outputs=toplevel '--remote_download_regex=.*[.](amd64|arm64)[.]findings$' --build_event_json_file="$RUNNER_TEMP/findings.bep" //pkg/fdnotifier:fdnotifier_nogo //pkg/fdnotifier:fdnotifier_test_nogo
        python3 "$RUNNER_TEMP/fdnotifier_originals.py" materialized
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: fdnotifier-startup-combined
        path: ${{ runner.temp }}/final.json
        if-no-files-found: error
