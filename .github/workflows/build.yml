name: Check the two pipe analyzer owners
on:
  push:
    branches: [qualification/pipe-nogo-memory]
permissions:
  contents: read
jobs:
  pipe:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0bae5ce4b8bfd5c89f8363666b53db2c866fc45c
          persist-credentials: false
      - name: Run the two remaining Nogo tests
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0bae5ce4b8bfd5c89f8363666b53db2c866fc45c
          platform="$RUNNER_TEMP/pipe-platform"
          mkdir "$platform"
          printf '%s\n' 'module(name="pipe_worker")' > "$platform/MODULE.bazel"
          cat > "$platform/BUILD" <<'BUILD'
          platform(
              name = "gnu",
              constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
              exec_properties = {
                  "Arch": "amd64",
                  "EstimatedMemory": "16GB",
                  "OSFamily": "linux",
                  "workload-isolation-type": "firecracker",
                  "container-image": "docker://gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a",
              },
              visibility = ["//visibility:public"],
          )
          BUILD
          rc="$RUNNER_TEMP/pipe.bazelrc"
          umask 077
          trap 'rm -f "$rc"' EXIT
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" > "$rc"
          unset BUILDBUDDY_API_KEY
          bazelisk --bazelrc="$rc" test --config=x86_64 --config=lockdep \
            --inject_repository="pipe_worker=$platform" \
            --extra_execution_platforms=@pipe_worker//:gnu --host_platform=@pipe_worker//:gnu \
            --remote_executor=grpcs://remote.buildbuddy.io --remote_cache=grpcs://remote.buildbuddy.io \
            --spawn_strategy=remote --noremote_local_fallback --jobs=24 \
            --build_tag_filters= --test_output=errors --nocache_test_results \
            //pkg/sentry/kernel/pipe:pipe_nogo //pkg/sentry/kernel/pipe:pipe_test_nogo
