name: Qualify restored overlay poll lifetimes and mutable lower cost
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/overlay-poll-waiter-cost'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      STOCK: 3b6a97d8f8c99704e4f9139abece33c0723f23c9
      MAP: 872ac9e3e30d0e27c5559ab866556fa377173a19
      FIXED: 84a21e699e533ce807970ffb29842095ce878a7f
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 3
        persist-credentials: false
    - name: Fetch stock test object
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        gh api repos/tamird/gvisor/git/commits/"$STOCK" --jq .sha
        git fetch --no-tags --depth=2 https://github.com/tamird/gvisor.git "$STOCK" "$MAP"
        [[ $(git rev-parse HEAD^) == "$FIXED" ]]
        mkdir -p "$RUNNER_TEMP/focused"
    - name: Run both actual poll cleanup paths
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        plat=$RUNNER_TEMP/poll-gnu-platform
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        cat >"$plat/BUILD" <<BUILD
        platform(
            name = "gnu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {"Arch":"amd64", "OSFamily":"linux", "workload-isolation-type":"firecracker", "container-image":"docker://$GNU"},
            visibility = ["//visibility:public"],
        )
        BUILD
        rc=$RUNNER_TEMP/poll-gnu.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=remote' "build --inject_repository=poll_gnu_platform=$plat" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$rc"
        unset BUILDBUDDY_API_KEY
        docker run --rm --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c '
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
          work=$1; stock=$2; fixed=$3; map=$4
          for lane in stock-cost map-cost fixed-cost fixed-guest stock-guest fixed-nogo; do
            out="$work/focused/$lane"; mkdir -p "$out"; rc=0
            case "$lane" in stock-*) rev="$stock";; map-*) rev="$map";; *) rev="$fixed";; esac
            git checkout --quiet --detach "$rev"; [[ $(git rev-parse HEAD) == "$rev" ]]
            opts=()
            case "$lane" in
              *-cost) target=//pkg/sentry/syscalls/linux:linux_test
                opts+=(--strategy=TestRunner=local --test_arg=-test.v --test_arg="-test.run=^(TestOverlayPollCost|TestOverlayLowerPollLifetime)$") ;;
              *-guest) target=//test/syscalls:epoll_test_runsc_systrap_directfs_save ;;
              *) target=//pkg/sentry/fsimpl/overlay:overlay_nogo ;;
            esac
            bazel --bazelrc="$work/poll-gnu.bazelrc" test --config=x86_64 -c opt --test_timeout=240 --test_output=all --jobs=80 --nocache_test_results --modify_execution_info="^TestRunner$=+no-remote-cache" --remote_download_outputs=toplevel --remote_download_regex=".*[/]test[.](log|xml)$" --test_sharding_strategy=disabled "${opts[@]}" "$target" > "$out/bazel.log" 2>&1 || rc=$?
            printf "%s\n" "$rc" > "$out/exit"
            file="bazel-testlogs/${target#//}"; file="${file/:/\/}"
            if [[ -f "$file/test.log" ]]; then
              grep -E "BenchmarkOverlayPoll/|--- (PASS|FAIL): TestOverlay|refs=|original lower|lower no longer alive|OVERLAY_POLL_|OverlayBlockedPollCheckpoint|checkpoint.*(failed|error)|waiter.ChannelNotifier|unexpected type|non-serializable|error saving|✖" "$file/test.log" > "$out/receipt" || true
            fi
            grep -E "Invocation ID:|Build completed|Build did NOT|^ERROR:|^FAIL:|^PASSED:" "$out/bazel.log" | tail -12 >> "$out/receipt" || true
            echo "LANE $lane exit=$rc"; grep -Ev "BenchmarkOverlayPoll/" "$out/receipt" | tail -18
          done
          grep -q "BenchmarkOverlayPoll/tmpfs/live1" "$work/focused/stock-cost/receipt"
          for lane in map-cost fixed-cost; do
            [[ $(cat "$work/focused/$lane/exit") == 0 ]]; grep -q "PASS: TestOverlayLowerPollLifetime" "$work/focused/$lane/receipt"
          done
          grep -q "OVERLAY_POLL_RESTORED" "$work/focused/fixed-guest/receipt"; [[ $(cat "$work/focused/fixed-guest/exit") == 0 ]]
          [[ $(cat "$work/focused/fixed-nogo/exit") == 0 ]]
        ' _ "$RUNNER_TEMP" "$STOCK" "$FIXED" "$MAP"
    - name: Preserve per-lane safe measurements and outcomes
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: overlay-poll-checkpoint-cost
        path: |
          ${{ runner.temp }}/focused/*/receipt
          ${{ runner.temp }}/focused/*/exit
