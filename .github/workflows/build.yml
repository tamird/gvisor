name: Recover the original goimports producer diagnostic
on:
  push:
    branches: [qualification/goimports-bazel9]
permissions:
  contents: read
  actions: read
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Read the original invocation without executing Bazel
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B .github/qualification/lint-pilot/original_log.py
      - name: Check the compact artifact boundary
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'goimports-original.json'
          assert not path.is_symlink()
          data = path.read_bytes()
          json.loads(data)
          for name in ('KEY', 'GH_TOKEN'):
              key = os.environ[name].encode()
              assert key and key not in data
          assert b'x-buildbuddy-api-key' not in data.lower()
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: goimports-original
          path: ${{ runner.temp }}/goimports-original.json
          if-no-files-found: error
