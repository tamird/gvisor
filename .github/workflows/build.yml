name: Verify release archive output links across coordinator mounts
"on":
  push:
    branches: [qualification/registry-llvm-archive-alias-readers]
permissions: {}
jobs:
  alias:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Prepare the exact empty coordinator and tiny file consumers
        id: setup
        run: |
          set -eu
          umask 077
          w="$RUNNER_TEMP/registry-shipping"
          old=a8ac3ce3e183cd236ad1e5fc3ba5187754ca59c0
          previous=232cb57ef70201850eba27b14c495e747b9779e6
          candidate=0a0fa1efbacbe9f18b377a954f3f249001c32e21
          trial=15a0b6098b03c050baeb404cac40c820d9a19a97
          base=dd2be7670c1baaacebfdcab31bb6145ebce39037
          mkdir -p "$w/public" "$w/data" "$w/trial"
          git init -q .
          GIT_TERMINAL_PROMPT=0 git -c gc.auto=0 fetch --no-auto-maintenance -q --depth=5 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$trial"
          test "$(git rev-parse "$GITHUB_SHA^")" = "$previous"
          test "$(git rev-parse "$previous^")" = "$old"
          test "$(git rev-parse "$old^")" = "$candidate"
          test "$(git rev-parse "$candidate^")" = "$base"
          test "$(git rev-parse "$trial^")" = "$base"
          test "$(git rev-parse "$candidate:debian/release.bzl")" = f4e7093484b9462eec66e086338ebb6f06ea4bd0
          git diff --exit-code "$previous" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!.github/qualification/alias_namespace.py'
          for f in registry_shipping.py cold_repository.py; do git show "$old:.github/qualification/$f" > "$w/$f"; done
          git show "$GITHUB_SHA:.github/qualification/alias_namespace.py" > "$w/alias_namespace.py"
          git show "$candidate:debian/release.bzl" > "$w/production.bzl"
          git archive "$trial" | tar -x -C "$w/trial"
          cd "$w"
          test ! -e trial/.git
          mkdir trial/test/rbe/release_prewarmer
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 --max-time 120 https://raw.githubusercontent.com/tamird/gvisor/e89646dda45516a7fe54427a0586a39dc20a7db3/test/rbe/release_prewarmer/BUILD -o trial/test/rbe/release_prewarmer/BUILD
          echo 'ae1f23a11f3cb747fbec49a34c510c5ab9dcb75d06d94bfd4d9a49d50c629271  trial/test/rbe/release_prewarmer/BUILD' | sha256sum -c -
          cat > observe <<'BASH'
          #!/bin/bash
          set -eu
          exec env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" python3 -BEs "$RUNNER_TEMP/registry-shipping/alias_namespace.py" "$1"
          BASH
          chmod 700 observe
          ./observe setup
      - name: Execute the exact historical writer bytes with no host interpreter
        run: '"$RUNNER_TEMP/registry-shipping/observe" negative'
      - name: Compare original and candidate alias providers and named output targets
        if: always() && !cancelled() && steps.setup.outcome == 'success'
        run: '"$RUNNER_TEMP/registry-shipping/observe" aliases'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: shipping-archive-alias-namespace
          path: ${{ runner.temp }}/registry-shipping/public/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove the private coordinator
        if: always()
        run: |
          docker image rm "empty-shipping:$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          rm -rf -- "$RUNNER_TEMP/registry-shipping"
