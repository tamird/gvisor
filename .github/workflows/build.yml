name: Confirm graph key cardinality and identify the legacy hook allocation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/state-map-completion-controls'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 12
        persist-credentials: false
    - name: Round-trip immediate and delayed map keys on both current sources
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        for source in b85788dac43cf1e00af9edb3bf0b5fd36356173b ca5ef187687dd348e1dd8d9e04e7a57271773023; do
          [[ "$(git diff --name-only "$source^" "$source" | paste -sd, -)" == "pkg/state/BUILD,pkg/state/map_key_identity_test.go" ]]
        done
        [[ "$(git rev-parse b85788dac43cf1e00af9edb3bf0b5fd36356173b^)" == "6fb2e9fe20ab30f5b9cf1c0df8037a92b0317e0f" ]]
        [[ "$(git rev-parse ca5ef187687dd348e1dd8d9e04e7a57271773023^)" == "6163ec9a6d6d1a343eba0d39bf379d2fced4ffb4" ]]
        mkdir -p "$RUNNER_TEMP/checker"
        for file in qualify.sh unit_matrix.py snapshot_report.py; do
          cp "test/rbe/$file" "$RUNNER_TEMP/checker/$file"
        done
        mkdir -p "$RUNNER_TEMP/focused_platform" "$RUNNER_TEMP/focused"
        platform=$RUNNER_TEMP/focused_platform
        printf '%s\n' 'module(name="focused_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/focused.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
            'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
            'build --remote_accept_cached' \
            "build --inject_repository=focused_platform=$platform" \
            'build --host_platform=@focused_platform//:ubuntu' \
            'build --extra_execution_platforms=@focused_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        printf '%s\n' 'build:rbe --spawn_strategy=remote' >> "$rc"
        export FIFO_RC=$rc
        mkdir -p "$RUNNER_TEMP/focused-bin"
        cat > "$RUNNER_TEMP/focused-bin/bazel" <<'SH'
        #!/bin/sh
        exec bazelisk --bazelrc="$FIFO_RC" "$@"
        SH
        chmod +x "$RUNNER_TEMP/focused-bin/bazel"
        export PATH="$RUNNER_TEMP/focused-bin:$PATH"
        overall=0
        source=0ead11cbb3bdfe545dd41e6d046af07efcd32b93
        git checkout --quiet --detach "$source"
        test "$(git rev-parse HEAD)" = "$source"
        test -z "$(git status --porcelain --untracked-files=no)"
        mkdir -p test/rbe "$RUNNER_TEMP/focused/graph"
        cp "$RUNNER_TEMP/checker/qualify.sh" "$RUNNER_TEMP/checker/unit_matrix.py" test/rbe/
        out="$RUNNER_TEMP/focused/graph"
        code=0
        bash test/rbe/qualify.sh --arch=amd64 --test-target=//pkg/state:state_test --test-filter=^TestMapKeyIdentity$ \
          "--bazel-option=--build_event_json_file=$out/events.jsonl" --bazel-option=--test_arg=-test.v \
          --bazel-option=--test_sharding_strategy=disabled --bazel-option=--cache_test_results=no \
          --bazel-option=--remote_download_outputs=toplevel '--bazel-option=--remote_download_regex=.*[/]test[.](log|xml)$' test || code=$?
        python3 -B "$RUNNER_TEMP/checker/snapshot_report.py" "$out" corrected "$source" //pkg/state:state_test "$code" || overall=1
        python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["test_status"]=="PASSED" and d["observations"]["after_load"]==[2,"left","right",""]' "$out/result.json" || overall=1

        mkdir -p "$RUNNER_TEMP/focused/allocs"
        for source in d7b1012300396fa2fc231060839ca6268b0adff1 7598e767044a7eea7dedd6c5ffaddbbc9ec8d439 7598e767044a7eea7dedd6c5ffaddbbc9ec8d439 d7b1012300396fa2fc231060839ca6268b0adff1; do
          git checkout --quiet --detach "$source"
          test "$(git rev-parse HEAD)" = "$source"
          test -z "$(git status --porcelain --untracked-files=no)"
          bazel run --config=rbe --config=x86_64 --remote_download_outputs=toplevel //pkg/state/tests:tests_test -- \
            -test.cpu=1 -test.count=1 -test.run=^$ '-test.bench=^BenchmarkDecoding$/^map$/^state$' \
            -test.benchtime=350ms -test.benchmem > "$RUNNER_TEMP/bench.out" || overall=1
          grep '^BenchmarkDecoding/map/state' "$RUNNER_TEMP/bench.out" >> "$RUNNER_TEMP/focused/allocs/$source.txt" || overall=1
        done
        python3 - "$RUNNER_TEMP/focused/allocs" d7b1012300396fa2fc231060839ca6268b0adff1 7598e767044a7eea7dedd6c5ffaddbbc9ec8d439 <<'PYTHON' || overall=1
        import json,re,sys
        from pathlib import Path
        out=Path(sys.argv[1])
        data={"sources":{},"verdict":"INCOMPLETE"}
        try:
            for source in sys.argv[2:]:
                rows=re.findall(r'([0-9.]+) ns/op\s+([0-9.]+) B/op\s+([0-9.]+) allocs/op',(out/(source+".txt")).read_text())
                assert len(rows)==2
                data["sources"][source]=[list(map(float,row)) for row in rows]
            data["verdict"]="PASS"
        finally:
            (out/"result.json").write_text(json.dumps(data,indent=2)+"\n")
        PYTHON
        exit "$overall"
    - name: Save only the typed results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: map-completion-controls
        path: ${{ runner.temp }}/focused/*/result.json
        if-no-files-found: error
