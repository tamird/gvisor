name: Recover original packet-ring TestRunner log
on:
  push:
    branches: [qualification/packet-mmap-original-guest-log]
permissions:
  contents: read
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Read the matching remote action
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          test "$(git rev-parse HEAD^)" = 078a2b7d8f11b1ac9fb98383886e3f0f13d07f09
          python3 -I -B .github/qualification/packet_pages/original.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovered-original-packet-ring-result
          path: ${{ runner.temp }}/packet-original.json
          if-no-files-found: error
          retention-days: 3
