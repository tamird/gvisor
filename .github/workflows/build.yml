name: Recover the original plugin analysis diagnostic
on:
  push:
    branches: [qualification/plugin-analysis-log]
permissions:
  contents: read
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Read original metadata only
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B test/rbe/plugin_programs/analysis_log.py
      - name: Check typed evidence
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "plugin-evidence"
          assert {p.name for p in folder.iterdir()} == {"analysis.json"}
          path = folder / "analysis.json"
          assert path.is_file() and not path.is_symlink() and path.stat().st_size < 20000
          raw = path.read_bytes()
          json.loads(raw)
          assert os.environ["KEY"] and os.environ["KEY"].encode() not in raw
          assert all(x not in raw.lower() for x in (b"authorization:", b"bearer ", b"x-buildbuddy-api-key"))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: original-plugin-analysis
          path: ${{ runner.temp }}/plugin-evidence/analysis.json
          if-no-files-found: error
