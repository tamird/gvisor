name: Recover original state check diagnostics
on:
  push:
    branches: [qualification/state-reservation-check-diagnostics]
permissions:
  contents: read
jobs:
  original:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 1, persist-credentials: false}
    - name: Read only the two completed invocations
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 test/rbe/state_checks_original.py
    - name: Check the public artifact boundary
      id: safe
      if: always()
      env:
        CHECK_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os, pathlib
        root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "state-original-checks"
        key = os.environ["CHECK_KEY"].encode()
        assert root.is_dir() and key
        assert {p.name for p in root.iterdir()} <= {"race.json", "arm-analyzers.json"}
        for p in root.iterdir():
            assert p.is_file() and not p.is_symlink()
            data = p.read_bytes()
            assert key not in data and b"x-buildbuddy-api-key" not in data.lower()
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.safe.outcome == 'success' }}
      with:
        name: state-original-checks
        path: |
          ${{ runner.temp }}/state-original-checks/race.json
          ${{ runner.temp }}/state-original-checks/arm-analyzers.json
        if-no-files-found: error
