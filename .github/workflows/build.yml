name: Check the Nogo sanity test entry point
on:
  push:
    branches: [qualification/nogo-sanity-entrypoint]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Install the Bazel version pinned by the PR
        run: |
          set -eu
          exe="$RUNNER_TEMP/bazel"
          curl -fsSL --retry 3 https://releases.bazel.build/8.8.1/release/bazel-8.8.1-linux-x86_64 -o "$exe"
          echo "5b5bab2095065817d3416ca9a0678bd39c10c9ede432dbe8187bfe74de285160  $exe" | sha256sum -c
          chmod +x "$exe"
      - name: Exercise the corrected test and its intentionally failing dependency
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = 25115956066576e83f5543c275d57b59d6578ed0
          git checkout --detach HEAD^
          test "$(cat .bazelversion)" = 8.8.1
          report="$RUNNER_TEMP/sanity"
          mkdir -p "$report"
          git rev-parse HEAD > "$report/source.txt"
          status=0
          "$RUNNER_TEMP/bazel" test --jobs=4 --keep_going --build_tests_only --nocache_test_results \
            --test_output=errors --build_event_json_file="$RUNNER_TEMP/sanity.bep" \
            //tools/nogo/sanity:sanity_nogo //tools/nogo/sanity:sanity_test || status=$?
          printf '%s\n' "$status" > "$report/bazel-exit.txt"
          jq -c 'select(.testSummary) | {label:.id.testSummary.label, status:.testSummary.overallStatus}' \
            "$RUNNER_TEMP/sanity.bep" > "$report/tests.jsonl"
          for target in sanity_nogo sanity_test; do
            for file in test.log test.xml; do
              cp "bazel-testlogs/tools/nogo/sanity/$target/$file" "$report/$target-$file"
            done
          done
          test "$status" = 3
          grep -Fq 'fmt.Fprintf format %d has arg "hello world!" of wrong type string' "$report/sanity_nogo-test.log"
          jq -es 'map({key:.label,value:.status}) | from_entries == {
            "//tools/nogo/sanity:sanity_nogo":"FAILED",
            "//tools/nogo/sanity:sanity_test":"PASSED"}' "$report/tests.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nogo-sanity
          path: ${{ runner.temp }}/sanity
          if-no-files-found: warn
          retention-days: 14
