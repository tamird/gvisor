name: Trace queued TCP writes across interrupted SACK recovery
on:
  push:
    branches: [qualification/tcp-rto-queued-window]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: df1a224cdd27388d0fcbe67d99ffd48cee06480f
      CONTROL: f5dd4ad5631f83330ed7632e0bea1dda02afdfbc
      DRAFT: b7d9ced514fd9ea5d4159b36b42ae16a22dbe634
      BASE: 99058130824e4d3166bf0e376f9b15b6ad50146c
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 7, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/records/verdict.json"
        cp test/rbe/queued-rto-verdict.py "$RUNNER_TEMP/"
        test "$(git rev-parse "$CONTROL^")" = "$PRODUCT"
        test "$(git rev-parse "$PRODUCT^^")" = "$DRAFT"
        test "$(git rev-parse "$DRAFT^")" = "$BASE"
        test "$(git diff --name-only "$DRAFT" "$PRODUCT")" = pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test.go
        git diff --quiet "$BASE" "$CONTROL" -- pkg/tcpip/transport/tcp ':(exclude)pkg/tcpip/transport/tcp/test/e2e'
        git diff --quiet "$CONTROL" "$PRODUCT" -- . ':(exclude)pkg/tcpip/transport/tcp/rack.go' ':(exclude)pkg/tcpip/transport/tcp/snd.go' ':(exclude)pkg/tcpip/transport/tcp/state.go'
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","EstimatedMemory":"2GB","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
    - name: Run the same socket and packet schedule on both sources
      run: |
        set -euo pipefail
        runarm() {
          arm=$1; source=$2; target=$3; filter=$4; limit=$5
          d="$RUNNER_TEMP/records/$arm"; mkdir -p "$d"
          git checkout --quiet --detach "$source"
          [[ "$(git rev-parse HEAD)" == "$source" ]]
          printf '%s\n' "$source" > "$d/head"
          opts=()
          uuid="$(cat /proc/sys/kernel/random/uuid)"
          printf '%s\n' "$uuid" > "$d/uuid"
          if [[ -n "$filter" ]]; then opts+=("--test_filter=$filter"); fi
          read -r -a labels <<< "$target"
          code=0
          timeout --kill-after=10s "$limit" docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --invocation_id="$uuid" --jobs=48 --strategy=TestRunner=remote --nocache_test_results --keep_going --test_sharding_strategy=disabled --test_output=errors --test_timeout=400 --test_env=GO_TEST_WRAP_TESTV=1 --build_event_json_file="$RUNNER_TEMP/$arm.bep" "${opts[@]}" "${labels[@]}" > "$d/log" 2>&1 || code=$?
          printf '%s\n' "$code" > "$d/exit"
          printf '%s\n' "${labels[@]}" > "$d/labels"
          for label in "${labels[@]}"; do
            path=${label#//}; key=${label##*:}; mkdir -p "$d/$key"
            for file in test.log test.xml; do
              docker exec tcp-compiler cat "bazel-testlogs/${path/:/\/}/$file" > "$d/$key/$file" || true
            done
          done
        }
        runarm stock "$CONTROL" //pkg/tcpip/transport/tcp/test/e2e:tcp_rack_test '^TestInterruptedRTOWithQueuedData$' 16m
        runarm draft "$PRODUCT" //pkg/tcpip/transport/tcp/test/e2e:tcp_rack_test '^TestInterruptedRTOWithQueuedData$' 16m
    - name: Verify the original packet and owner results
      if: always()
      run: python3 "$RUNNER_TEMP/queued-rto-verdict.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: interrupted-rto-queued-data
        path: |
          ${{ runner.temp }}/records/verdict.json
          ${{ runner.temp }}/records/*/uuid
          ${{ runner.temp }}/records/*/exit
          ${{ runner.temp }}/records/*/*/test.xml
        if-no-files-found: error
