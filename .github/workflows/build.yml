name: Exercise the packaged iperf3 client and server on two native Linux machines
on:
  push:
    branches: [qualification/official-go-images]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-22.04
    timeout-minutes: 105
    outputs:
      arm_archive: ${{ steps.publish.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 6
      - name: Configure the pinned Linux execution platform
        id: setup
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          echo "Coordinator $(gcc -dumpfullversion), worker GCC 11"
          test "$(gcc -dumpversion | cut -d. -f1)" = 11
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
          mkdir -p "$RUNNER_TEMP/gnu"
          GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
          test -n "$BUILDBUDDY_API_KEY"
          rc=$RUNNER_TEMP/images.bazelrc
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          cat >> "$rc" <<'RC'
          build --jobs=8
          build --strategy=GoStdlib=linux-sandbox
          build --strategy=GoStdlibList=linux-sandbox
          build --strategy=GoStandardLibraryAnalysis=linux-sandbox
          build --strategy=GoStaticAnalysis=linux-sandbox
          build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache
          build --noremote_upload_local_results
          build --remote_download_outputs=toplevel
          build --noshow_progress
          RC
          for name in iperf-ubuntu-image iperf-ubuntu-transfer iperf-ubuntu-go wrk2-new-catalog; do git show "$GITHUB_SHA:test/rbe/$name.sh" > "$RUNNER_TEMP/$name.sh"; done
      - name: Build and inspect the iperf3 image for arm64
        id: armimage
        if: always() && steps.setup.outcome == 'success'
        timeout-minutes: 35
        run: |
          bash "$RUNNER_TEMP/iperf-ubuntu-image.sh" aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.armimage.outcome != 'skipped'
        with:
          name: armimage
          path: ${{ runner.temp }}/iperf-jammy/arm64/build
          if-no-files-found: error
      - name: Preserve the exact ARM64 archive for the native machine
        id: publish
        if: always() && steps.armimage.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm64-image
          path: ${{ runner.temp }}/iperf-jammy/arm64/oci
          compression-level: 0
          if-no-files-found: error
      - name: Build and inspect the iperf3 image for amd64
        id: x86image
        if: always() && steps.setup.outcome == 'success'
        timeout-minutes: 35
        run: |
          bash "$RUNNER_TEMP/iperf-ubuntu-image.sh" x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.x86image.outcome != 'skipped'
        with:
          name: x86image
          path: ${{ runner.temp }}/iperf-jammy/amd64/build
          if-no-files-found: error
      - name: Run both benchmark endpoints as UID 65532 on AMD64
        id: x86transfer
        if: always() && steps.x86image.outcome == 'success'
        timeout-minutes: 3
        run: |
          bash "$RUNNER_TEMP/iperf-ubuntu-transfer.sh" amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.x86transfer.outcome != 'skipped'
        with:
          name: x86transfer
          path: ${{ runner.temp }}/iperf-jammy/amd64/transfer
          if-no-files-found: error
      - name: Check the held SPDX proposal and freshly fetch the four wrk2 notices
        id: notices
        if: always() && steps.setup.outcome == 'success'
        timeout-minutes: 29
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash "$RUNNER_TEMP/wrk2-new-catalog.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.notices.outcome != 'skipped'
        with:
          name: notices
          path: ${{ runner.temp }}/wrk2/licenses
          if-no-files-found: error
      - name: Execute eight parsed iperf3 Go benchmark cases on AMD64
        id: x86go
        if: always() && steps.x86transfer.outcome == 'success'
        timeout-minutes: 45
        run: |
          bash "$RUNNER_TEMP/iperf-ubuntu-go.sh" iperf x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.x86go.outcome != 'skipped'
        with:
          name: x86go
          path: ${{ runner.temp }}/iperf-results/iperf-go-x86_64
          if-no-files-found: error
  arm:
    needs: images
    if: always() && needs.images.outputs.arm_archive != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 6
      - id: fetch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arm64-image
          path: ${{ runner.temp }}/iperf-jammy/arm64/oci
      - name: Run both endpoints as UID 65532 on genuine native ARM64
        id: armtransfer
        if: always() && steps.fetch.outcome == 'success'
        timeout-minutes: 3
        run: |
          bash test/rbe/iperf-ubuntu-transfer.sh arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.armtransfer.outcome != 'skipped'
        with:
          name: armtransfer
          path: ${{ runner.temp }}/iperf-jammy/arm64/transfer
          if-no-files-found: error
      - name: Set up the native Bazel coordinator
        id: setup
        if: always() && steps.armtransfer.outcome == 'success'
        uses: bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77
      - name: Execute the eight parsed iperf3 Go benchmark cases on native ARM64
        id: armgo
        if: always() && steps.armtransfer.outcome == 'success' && steps.setup.outcome == 'success'
        timeout-minutes: 55
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:test/rbe/iperf-ubuntu-go.sh" >"$RUNNER_TEMP/iperf-ubuntu-go.sh"
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          umask 077
          printf 'build --remote_cache=grpcs://remote.buildbuddy.io\nbuild --bes_backend=grpcs://remote.buildbuddy.io\nbuild --bes_results_url=https://app.buildbuddy.io/invocation/\nbuild --remote_header=x-buildbuddy-api-key=%s\nbuild --bes_header=x-buildbuddy-api-key=%s\nbuild --noremote_upload_local_results\n' "$BUILDBUDDY_API_KEY" "$BUILDBUDDY_API_KEY" >"$RUNNER_TEMP/images.bazelrc"
          unset BUILDBUDDY_API_KEY
          command -v bazel
          bash "$RUNNER_TEMP/iperf-ubuntu-go.sh" iperf aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.armgo.outcome != 'skipped'
        with:
          name: armgo
          path: ${{ runner.temp }}/iperf-results/iperf-go-aarch64
          if-no-files-found: error
