name: Package AMD64 on shell-free ARM64 and boot the archive on AMD64
on:
  push:
    branches: [qualification/scratch-arm-exec-amd64-public-tar]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Select the verified compiler release and archive rule
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/release-rbe"
          mkdir -p "$d/harness"
          test "$(uname -m)" = x86_64
          cp .github/qualification/{public_tar.py,exec_cas.py,install_native_guest.py} "$d/harness/"
          cp test/rbe/{native_cross_inputs,runtime_cross,runtime_guest}.py "$d/harness/"
          (cd "$d/harness" && sha256sum --check <<'SUMS'
          b0626fb5ecb5bb9c41d644ced5af036019cbefbeef7975c71878021f6e146653  native_cross_inputs.py
          32cc74e3f3e8189d9678b609a4058e60ea3a1e955566f229b34dc04b81f973c8  runtime_cross.py
          bce1d88d73ba07ca283697e2b9215eb06f1e2f2baacfb43130762ff914d27524  runtime_guest.py
          SUMS
          )
          cp test/rbe/release_prewarmer/BUILD "$d/harness/"
          test "$(git rev-parse HEAD^)" = bbbed5b2b84fe21597c740789d841e618f912def
          test "$(git rev-parse HEAD^^)" = 102ffa219ed50275aabe8731f4e3a3aa35336b48
          git checkout -q --detach HEAD^
          mkdir -p test/rbe/release_prewarmer
          cp "$d/harness/BUILD" test/rbe/release_prewarmer/BUILD
          test "$(cat .bazelversion)" = 9.3.1
          curl --retry 3 -fsSL --proto '=https' --proto-redir '=https' --max-time 100 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          curl --retry 3 -fsSL --proto '=https' --proto-redir '=https' --max-time 100 https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 -o "$d/bb"
          (cd "$d" && sha256sum --check <<'SUMS'
          e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  bazel
          205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  bb
          SUMS
          )
          chmod 755 "$d/bazel" "$d/bb"
          test "$("$d/bazel" --version)" = 'bazel 9.3.1'
      - name: Build the AMD64 release archive on shell-free ARM64
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/release-rbe"
          rc="$d/private.bazelrc"
          trap 'rm -f "$rc"' EXIT
          test -n "$BUILDBUDDY_API_KEY"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_SHA="$GITHUB_SHA" python3 -B "$d/harness/public_tar.py" build
      - name: Identify the first failed action in this original invocation
        if: always()
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/release-rbe"
          test ! -e "$d/private.bazelrc"
          test -s "$d/public-tar.json"
          python3 -B "$d/harness/public_tar.py" diagnose
      - name: Install and boot the AMD64 tarball on the native AMD64 runner
        if: always()
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/release-rbe"
          test ! -e "$d/private.bazelrc"
          if python3 -c 'import json,sys; sys.exit(json.load(open(sys.argv[1]))["status"]!="PASS")' "$d/public-tar.json"; then
            "$d/bazel" --nosystem_rc --nohome_rc --noworkspace_rc shutdown
            env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$d/harness/install_native_guest.py"
          fi
      - name: Verify the typed result
        if: always()
        id: result
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"], "release-rbe", "public-tar.json")
          assert p.is_file() and not p.is_symlink() and 0 < p.stat().st_size < 65536
          raw = p.read_bytes()
          assert not re.search(rb"(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}", raw)
          r = json.loads(raw)
          assert r["run"] == os.environ["GITHUB_RUN_ID"] and r["invocation"] == "164843ea-c23e-4a9d-ac4e-1de51ec4f18f"
          assert r["source"] == "bbbed5b2b84fe21597c740789d841e618f912def"
          print("Public archive build:",r['status'],"Bazel exit:",r.get('bazel_exit'))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.result.outcome == 'success'
        with:
          name: arm-worker-amd64-release-tar-and-guest
          path: ${{ runner.temp }}/release-rbe/public-tar.json
          if-no-files-found: error
          retention-days: 7
      - name: Require a complete observation
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['RUNNER_TEMP'],'release-rbe','public-tar.json').read_bytes())
          assert r['status']=='PASS' and r['exit']==r['bazel_exit']==0 and len(r['files'])==len(r['input_files'])==9
          assert r['guest']['status']=='PASS' and len(r['guest']['installed'])==9 and r['guest']['marker']
          PYTHON
