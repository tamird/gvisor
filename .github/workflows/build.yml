name: Compare generated marshal cases
on:
  push:
    branches: [qualification/marshal-library-case-sets]
permissions: {}
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Bind both source trees, Bazel, QEMU and the result reader
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/marshal-cases"
          mkdir -m 700 "$work" "$work/receipt"
          echo '{"stage":"setup","verified":false}' > "$work/receipt/summary.json"
          git init -q
          donor=aa8c789dcd281b22920edeec5e1a6bb4d87e90f4
          git fetch --no-auto-maintenance --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$donor"
          git checkout -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = dbdd8a0946f8b0615b4cf58b51369efc58240fc5
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/marshal_cases.py'
          install -m 755 .github/qualification/marshal_cases.py "$work/probe"
          git show "$donor:test/rbe/qualification_report.py" > "$work/qualification_report.py"
          git show "$donor:test/rbe/unit_matrix.py" > "$work/unit_matrix.py"
          test "$(git hash-object "$work/qualification_report.py")" = d2e3eedabc2ad911d958aa448fd916aa6835aa86
          test "$(git hash-object "$work/unit_matrix.py")" = d01d9e319084e18ea2928671e417e1b4e86c4954
          cd "$work"
          curl -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel' | sha256sum -c -
          chmod 755 bazel
          curl -fsSL --retry 2 https://github.com/hermeticbuild/qemu-prebuilt/releases/download/11.0.0.1/qemu-user-linux-amd64-aarch64-11.0.0.1.tar.zst -o qemu.tar.zst
          echo 'cc3bf42da8f219cd314a7806053c73cca166bf14c288daf5b6105e66590a6dee  qemu.tar.zst' | sha256sum -c -
          tar --zstd -xf qemu.tar.zst ./qemu-user-linux-amd64-aarch64
          sudo -n apt-get -qq update
          sudo -n apt-get -qq install -y --no-install-recommends build-essential crossbuild-essential-arm64 libnuma-dev
      - name: Run the complete generated suites on native AMD64 and emulated ARM64
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 GITHUB_SHA="$GITHUB_SHA" "$RUNNER_TEMP/marshal-cases/probe" compare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: marshal-library-case-sets
          path: ${{ runner.temp }}/marshal-cases/receipt/
          if-no-files-found: error
          retention-days: 14
