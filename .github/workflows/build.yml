name: Install both architectures of the public release archives
on:
  push:
    branches: [qualification/llvm-current-release-archives-native]
permissions: {contents: read}
jobs:
  release:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 4}
      - name: Select the release source and previously qualified guest launcher
        run: |
          set -eu
          d="$RUNNER_TEMP/current-release"
          mkdir -m 700 "$d"
          test "$(git rev-parse HEAD^)" = 2c90e983df7d4baa575ad8c6ac5a7165a7803029
          test "$(git rev-parse HEAD^^)" = 1f9c6adcce6f1b04d8b2cb6434d2268d21568588
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/current_release_archives.py'
          cp .github/qualification/current_release_archives.py "$d/"
          git fetch --no-tags --depth=1 origin f88038e975dbed62577658551f96928c64f6657f
          git show f88038e975dbed62577658551f96928c64f6657f:test/rbe/musl_smoke/guest.py > "$d/release_guest.py"
          test "$(git hash-object "$d/release_guest.py")" = 40d1b75d09444fccbfd10b12dc3f7312c9d7c0ff
          git checkout --quiet --detach 2c90e983df7d4baa575ad8c6ac5a7165a7803029
          git tag "release-20261106.$GITHUB_RUN_ID"
          curl -fsSL --retry 3 --max-time 90 --proto '=https' --proto-redir '=https' https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          test "$("$d/bazel" --version)" = 'bazel 9.3.1'
      - name: Prepare the native guest and ARM64 userspace emulator
        id: fixtures
        continue-on-error: true
        run: |
          set -eu
          d="$RUNNER_TEMP/current-release"
          for suite in jammy jammy-updates; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ $suite main universe"
          done > "$d/jammy.list"
          opts=(-o "Dir::Etc::sourcelist=$d/jammy.list" -o Dir::Etc::sourceparts=-)
          sudo apt-get "${opts[@]}" update -qq
          sudo apt-get "${opts[@]}" install --no-install-recommends -qq -y qemu-user libc6-arm64-cross zstd
          cd "$d"
          apt-get "${opts[@]}" download busybox-static
          dpkg-deb -x busybox-static_*.deb fixture
          if test -f fixture/usr/bin/busybox; then cp fixture/usr/bin/busybox busybox; else cp fixture/bin/busybox busybox; fi
          chmod 755 busybox
          file busybox
          qemu-aarch64 --version
      - name: Build the six release files and exercise the installations
        run: |
          d="$RUNNER_TEMP/current-release"
          TEST_TMPDIR="$d" python3 -B "$d/current_release_archives.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: native-release-archives
          path: ${{ runner.temp }}/current-release/receipt.json
          if-no-files-found: warn
          retention-days: 14
