name: Compare native, stock and corrected VFIO PCI syscalls
on:
  push:
    branches: [qualification/vfio-private-comparison]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/vfio-private-comparison'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PROBE_SRC: 147343a4d586cb2f9f74c06cb1f2414d56cd4291
      OSTOCK: cabf43bcb2e224a84b7d2ddd44ecabdf7f9f15cd
      OFIXED: e7f2dbe3e685373a7d71190ecd0d4ba82c6a61bf
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records"
        uname -a | tee "$RUNNER_TEMP/records/host-kernel"
        test -c /dev/kvm && sudo test -r /dev/kvm && sudo test -w /dev/kvm
        git rev-parse HEAD > "$RUNNER_TEMP/records/source"
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Start the existing GNU Bazel coordinator
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        docker run --device=/dev/kvm -d --name overlay-guest --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
    - name: Package the syscall suite binary and its exact runtime libraries
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=2 origin "$PROBE_SRC" "$OSTOCK" "$OFIXED"
        carrier=$(git rev-parse HEAD)
        git checkout --quiet --detach "$PROBE_SRC"
        out="$RUNNER_TEMP/records"
        echo "$PROBE_SRC" >"$out/probe-source"
        docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" build --config=x86_64 -c opt --jobs=24 --remote_download_outputs=toplevel //test/syscalls/linux:vfio_pci_device_test >"$RUNNER_TEMP/probe-build.log" 2>&1 || { grep -A12 -E 'ERROR:|INFO: Invocation ID:' "$RUNNER_TEMP/probe-build.log" | tail -60 | tee "$out/probe-receipt"; exit 1; }
        docker exec overlay-guest cp -L bazel-bin/test/syscalls/linux/vfio_pci_device_test "$RUNNER_TEMP/vfio_pci_probe_bin"
        file "$RUNNER_TEMP/vfio_pci_probe_bin" | tee "$out/probe-type"
        readelf -l "$RUNNER_TEMP/vfio_pci_probe_bin" | sed -n 's/^.*Requesting program interpreter: \(.*\)\]/\1/p' > "$RUNNER_TEMP/interpreter"
        grep -q '^/lib' "$RUNNER_TEMP/interpreter"
        docker exec overlay-guest ldd "$RUNNER_TEMP/vfio_pci_probe_bin" > "$out/probe-ldd"
        if grep -q 'not found' "$out/probe-ldd"; then cat "$out/probe-ldd"; exit 1; fi
        awk '$2=="=>" && $3~/^\//{print substr($3,2)} $1~/^\//{print substr($1,2)}' "$out/probe-ldd" > "$RUNNER_TEMP/libs"
        sed 's,^/,,' "$RUNNER_TEMP/interpreter" >> "$RUNNER_TEMP/libs"
        sort -u "$RUNNER_TEMP/libs" -o "$RUNNER_TEMP/libs"
        if grep -vE '^(lib|usr/lib)' "$RUNNER_TEMP/libs"; then exit 1; fi
        docker exec overlay-guest tar -chf "$RUNNER_TEMP/vfio_pci_root.tar" -C / -T "$RUNNER_TEMP/libs"
        cp "$RUNNER_TEMP/vfio_pci_probe_bin" "$RUNNER_TEMP/probe"
        tar -rf "$RUNNER_TEMP/vfio_pci_root.tar" -C "$RUNNER_TEMP" probe interpreter
        sha256sum "$RUNNER_TEMP/"{vfio_pci_probe_bin,vfio_pci_root.tar} >"$out/probe-sha"
        git checkout --quiet --detach "$carrier"
        cp "$RUNNER_TEMP/vfio_pci_root.tar" test/rbe/tcg/
    - name: Open and poll a real Linux PCI descriptor before building either runsc
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/records"
        rc=0
        docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=28 --remote_download_outputs=toplevel --strategy=TestRunner=local --nozip_undeclared_test_outputs --nocache_test_results --test_output=all --test_timeout=480 //test/rbe/tcg:vfio_linux_test >"$RUNNER_TEMP/preflight.log" 2>&1 || rc=$?
        echo "$rc" >"$out/native-exit"
        { grep 'INFO: Invocation ID:' "$RUNNER_TEMP/preflight.log"; grep -A14 -E '^ERROR:|FAILED|qemu-system|vfio.*failed|cannot|Cannot' "$RUNNER_TEMP/preflight.log" | tail -65; } >"$out/native-receipt" || :
        for path in test.log test.outputs/console.log test.outputs/guest/vfio-device.txt; do
          name=${path##*/}
          docker exec overlay-guest cat "bazel-testlogs/test/rbe/tcg/vfio_linux_test/$path" | tail -160 >"$out/native-$name" || :
        done
        test "$rc" -eq 0
        grep -q 'Native VFIO driver=' "$out/native-vfio-device.txt"
        grep -Fq '[       OK ] VfioPCIDeviceTest.Readiness' "$out/native-console.log"
    - name: Build the stock and corrected runsc from their exact source
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=2 origin "$OSTOCK" "$OFIXED"
        carrier=$(git rev-parse HEAD)
        for arm in stock fixed; do
          src=$OSTOCK; [[ $arm == stock ]] || src=$OFIXED
          git checkout --quiet --detach "$src"
          echo "$src" > "$RUNNER_TEMP/records/$arm-source"
          docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" build --config=x86_64 -c opt --jobs=28 --remote_download_outputs=toplevel //:release > "$RUNNER_TEMP/$arm-build.log" 2>&1 || { grep -E 'ERROR:|INFO: Invocation ID:|FAILED' "$RUNNER_TEMP/$arm-build.log" | tail -40; exit 1; }
          mkdir -p "$RUNNER_TEMP/vfio_$arm"
          docker exec overlay-guest cp -RL --preserve=mode bazel-bin/release/. "$RUNNER_TEMP/vfio_$arm"
          for file in runsc gvisor-bin/gvisor_sentry gvisor-bin/checkpointgofer; do test -x "$RUNNER_TEMP/vfio_$arm/$file"; done
          sha256sum "$RUNNER_TEMP/vfio_$arm/"{runsc,gvisor-bin/*} > "$RUNNER_TEMP/records/$arm-binary"
        done
        git checkout --detach "$carrier"
        cp -R "$RUNNER_TEMP"/vfio_{stock,fixed} test/rbe/tcg/
    - name: Run the actual file descriptor test
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/records"
        target=//test/rbe/tcg:vfio_comparison_test
        rc=0
        docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=28 --remote_download_outputs=toplevel --strategy=TestRunner=local --nozip_undeclared_test_outputs --nocache_test_results --test_output=all --test_timeout=480 "$target" >"$RUNNER_TEMP/abi.log" 2>&1 || rc=$?
        echo "$rc" >"$out/bazel-exit"
        grep -E 'INFO: Invocation ID:|ERROR:|FAILED|::|fail|VFIO|vfio|Error|Cannot|curl|qemu|wget|tcg|Build (did NOT complete|completed)' "$RUNNER_TEMP/abi.log" | tail -80 >"$out/bazel-receipt" || :
        for path in test.log test.outputs/console.log test.outputs/guest/vfio-device.txt test.outputs/guest/outputs/native-gtest.txt test.outputs/guest/outputs/native-irq.txt test.outputs/guest/outputs/native-irq-qualified test.outputs/guest/outputs/stock-exit test.outputs/guest/outputs/fixed-exit test.outputs/guest/outputs/stock-gtest.txt test.outputs/guest/outputs/fixed-gtest.txt test.outputs/guest/outputs/stock-diagnostics.txt test.outputs/guest/outputs/fixed-diagnostics.txt; do
          name=${path##*/}
          docker exec overlay-guest cat "bazel-testlogs/test/rbe/tcg/vfio_comparison_test/$path" | tail -150 >"$out/$name" || :
        done
        test "$rc" = 0
        grep -q 'Native VFIO driver=' "$out/vfio-device.txt"
        grep -q 'VfioPCIDeviceTest.Readiness' "$out/console.log"
        for mode in native fixed; do grep -Fq '[       OK ] VfioPCIDeviceTest.Readiness' "$out/$mode-gtest.txt"; done
        grep -Fq '[  FAILED  ] VfioPCIDeviceTest.Readiness' "$out/stock-gtest.txt"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: private-vfio-pci
        path: ${{ runner.temp }}/records
        if-no-files-found: error
