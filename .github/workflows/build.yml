name: Measure TCP sender SACK accounting
on:
  push:
    branches: [qualification/sack-accounting-paired-run]
permissions:
  contents: read
jobs:
  benchmark:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FIXTURE: 704c06062b041f2e363597d7156f206823cebedc
      PRODUCT: ffd2dc90a4c530625b6facd79da80ed8cf39fdc2
      BASE: df000e6d7a2ca32aea30416c12cf257c79806c50
      VERIFIER: 6b3fe9ab6c03facafe6340c85f8d60ca3591566b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Benchmark both sender ACK implementations on the same Linux CPU
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          printf '{"status":"INCOMPLETE","phase":"bootstrap"}\n' > "$RUNNER_TEMP/results/verdict.json"
          test "$(git rev-parse HEAD^)" = "$FIXTURE"
          test "$(git rev-parse HEAD^^)" = "$PRODUCT"
          test "$(git rev-parse HEAD^^^)" = "$BASE"
          test "$(git diff --name-only "$PRODUCT" "$FIXTURE")" = pkg/tcpip/transport/tcp/sack_scoreboard_test.go
          cp .github/qualification/window_benchmark.py "$RUNNER_TEMP"
          git fetch --quiet --depth=1 origin "$VERIFIER"
          for helper in unit_matrix qualification_report; do
            git show "$VERIFIER:test/rbe/$helper.py" > "$RUNNER_TEMP/$helper.py"
          done
          if ! command -v bazelisk; then
            GOBIN="$RUNNER_TEMP" go install github.com/bazelbuild/bazelisk@v1.30.0
            export PATH="$RUNNER_TEMP:$PATH"
          fi
          test "$(bazelisk --version)" = "bazel $(cat .bazelversion)"
          python3 "$RUNNER_TEMP/window_benchmark.py"
      - name: Calculate benchstat for the 16 observed TestRunner attempts
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/results"
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e stock fixed | tee benchstat.txt
          python3 - <<'PYFINAL'
          import datetime, json, pathlib
          root = pathlib.Path(".")
          verdict = root / "verdict.json"
          d = json.loads(verdict.read_bytes())
          assert d["status"] == "MEASUREMENTS_PASS"
          stats = (root / "benchstat.txt").read_text()
          assert all(metric in stats for metric in ("sec/op", "B/op", "allocs/op"))
          for size in (8, 128):
              for pos in ("near", "far"):
                  assert stats.count(f"SACKAccountingQualification/queue={size}/sack={pos} ") == 3
          d.update(status="PASS", benchstat_verified_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
          verdict.write_text(json.dumps(d, indent=2) + "\n")
          PYFINAL
      - name: Check the bounded original benchmark evidence
        id: scan
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "results"
          for path in root.iterdir():
              assert path.is_file() and not path.is_symlink()
              assert re.fullmatch(r"verdict\.json|benchstat\.txt|stock|fixed|pair-[1-8]-(stock|fixed)\.(log|xml)", path.name), path
              data = path.read_bytes()
              assert len(data) < 1024**2
              assert not re.search(rb"gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY|(?i:authorization|x-buildbuddy-api-key)\s*[:=]", data)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.scan.outcome == 'success'
        with:
          name: sack-accounting-benchstat
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
