name: Verify TCP user timeout across original and retransmitted flights
on:
  push:
    branches: [qualification/tcp-user-timeout-bounded-flights]
permissions: {contents: read}
jobs:
  packets:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 4}
      - name: Prepare the native Linux packet test
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/extra-rto"
          mkdir -p "$d"
          test "$(git rev-parse HEAD^)" = f442ce7ee5e367d7c66f7929741f44a78a61a9a2
          test "$(git rev-parse HEAD^^)" = deaa0ddc5da6bd22a1d4837eb0bd412e205ccb12
          test "$(git rev-parse HEAD^^^)" = f51a205a8f4afbc5ab41aded070df74951b081ea
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/extra_rto.py'
          cp .github/qualification/extra_rto.py "$d/"
          test "$(cat .bazelversion)" = 9.3.1
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo
          if ! command -v aarch64-linux-gnu-g++ >/dev/null; then
            for suite in jammy jammy-updates; do
              echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ $suite main universe"
            done > "$d/ubuntu.list"
            opts=(-o "Dir::Etc::sourcelist=$d/ubuntu.list" -o Dir::Etc::sourceparts=-)
            sudo apt-get "${opts[@]}" update -qq
            sudo apt-get "${opts[@]}" install -qq -y --no-install-recommends g++-aarch64-linux-gnu
          fi
          curl -fsSL --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/bazel" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bazel"
      - name: Run the shared packet test and the existing closed-window tests on Linux and gVisor
        run: python3 "$RUNNER_TEMP/extra-rto/extra_rto.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: tcp-user-timeout-bounded-flights
          path: ${{ runner.temp }}/extra-rto/result.json
          if-no-files-found: warn
          retention-days: 14
