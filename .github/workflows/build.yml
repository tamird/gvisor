name: Recover original standard library analyzer diagnostics
on:
  push:
    branches: [qualification/nogo-stdlib-original-diagnostics]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Read the original build log and failed action status
      env:
        READ_EXISTING_INVOCATION: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 test/qualify_stateify/nogo_evidence.py
    - name: Preserve only the relevant diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: nogo-stdlib-diagnostic
        path: ${{ runner.temp }}/nogo-evidence.json
        if-no-files-found: error
