name: Verify the signed tcpdump dependency catalog
on:
  push:
    branches: [qualification/tcpdump-distro-capture]
permissions:
  contents: read
env:
  PRODUCT: 77fbd4df0b319727914eec2f6112d724f06fed29
  AUDITOR: 9041e61701db27bd85b9658385cf5d7803681ab1
jobs:
  catalog:
    runs-on: ubuntu-22.04
    timeout-minutes: 78
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 5
          persist-credentials: false
      - name: Bootstrap the exact licensechecker with native Linux Bazel
        timeout-minutes: 18
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$AUDITOR"
          git switch --detach "$AUDITOR"
          command -v bazel
          bazel build --strategy=GoStdlib=sandboxed --strategy=GoStdlibList=sandboxed //tools/licensecheck/main:licensecheck
          path=$(bazel cquery --output=files //tools/licensecheck/main:licensecheck)
          cp "$(bazel info execution_root)/$path" "$RUNNER_TEMP/licensecheck"
          sha256sum "$RUNNER_TEMP/licensecheck"
          git switch --detach "$PRODUCT"
          test "$(git rev-parse HEAD)" = "$PRODUCT"
      - name: Fetch notices from the locked sources
        timeout-minutes: 47
        run: |
          export MAKEFLAGS="DOCKER_BUILD=false"
          "$RUNNER_TEMP/licensecheck" --mode=fetch
      - name: Preserve fetched entries and verify the unchanged policy
        if: "${{ !cancelled() }}"
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/licensecheck"
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          git diff -- tools/licensecheck/dependencies.yaml > "$RUNNER_TEMP/catalog.diff"
          MAKEFLAGS="DOCKER_BUILD=false" "$RUNNER_TEMP/licensecheck" --mode=verify
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tcpdump-catalog
          path: ${{ runner.temp }}/catalog.diff
          if-no-files-found: ignore
          retention-days: 3
