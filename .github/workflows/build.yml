name: Qualify graph StateLoad hook boundaries
on:
  push:
    branches: [qualification/graph-load-hook-boundary]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRODUCT: 370a1dee6dd662c1ec637d943730389ed02e078d
      BASE: aa767e4c43d011121271551fe24da501a56f729d
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 4, persist-credentials: false}
    - name: Prepare the existing GNU profile and exact product
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        profile=0ee70efe6d52576b8f173b40ad6b7ac117da3b72
        reporter=599cb05aecfb107e07f81b8591a009cb12d6ffa7
        git fetch -q --no-tags --depth=1 origin "$profile" "$reporter"
        test "$(git rev-parse HEAD^)" = "$PRODUCT"
        test "$(git rev-parse HEAD~3)" = "$BASE"
        test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/workflows/build.yml test/rbe/graph_hook_report.py)"
        mkdir -p "$RUNNER_TEMP/hook-boundary/proof" "$RUNNER_TEMP/gnu-platform"
        echo '{"status":"INCOMPLETE"}' > "$RUNNER_TEMP/hook-boundary/proof/verdict.json"
        cp test/rbe/graph_hook_report.py "$RUNNER_TEMP/"
        for file in BUILD.bazel MODULE.bazel; do
          git show "$profile:test/rbe/gnu_platform/$file" > "$RUNNER_TEMP/gnu-platform/$file"
        done
        for mod in qualification_report unit_matrix; do
          git show "$reporter:test/rbe/$mod.py" > "$RUNNER_TEMP/$mod.py"
        done
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --init --name tcp-compiler --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        git checkout -q --detach "$PRODUCT"
    - name: Run both complete state suites
      id: normal
      run: docker exec -e RUNNER_TEMP -e PRODUCT -e BASE tcp-compiler python3 -B "$RUNNER_TEMP/graph_hook_report.py" normal
    - name: Run both race suites with four shards for the larger owner
      if: ${{ !cancelled() }}
      id: race
      run: docker exec -e RUNNER_TEMP -e PRODUCT -e BASE tcp-compiler python3 -B "$RUNNER_TEMP/graph_hook_report.py" race
    - name: Compare the two existing warm restore benchmarks
      if: ${{ !cancelled() && steps.normal.outcome == 'success' }}
      id: benchmark
      run: docker exec -e RUNNER_TEMP -e PRODUCT -e BASE tcp-compiler python3 -B "$RUNNER_TEMP/graph_hook_report.py" benchmark
    - name: Record the combined verdict
      if: always()
      run: docker exec -e RUNNER_TEMP -e PRODUCT -e BASE tcp-compiler python3 -B "$RUNNER_TEMP/graph_hook_report.py" final
    - name: Check the bounded public artifact
      id: privacy
      if: always()
      env:
        CHECK_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"]) / "hook-boundary/proof"
        key = os.environ["CHECK_KEY"].encode()
        allowed = {"verdict.json", "normal.json", "race-core.json", "race-generated.json", "race-census.json", "benchmark.json"}
        allowed |= {f"bench-{i}-{arm}.json" for i in range(6) for arm in ("stock", "fixed")}
        attempts = ["normal-core-1", "normal-generated-1", "race-core-core-1", *(f"race-generated-generated-{i}" for i in range(1, 5))]
        allowed |= {name + "." + suffix for name in attempts for suffix in ("xml", "log")}
        files = list(root.iterdir())
        assert key and files and {f.name for f in files} <= allowed
        for f in files:
            assert f.is_file() and not f.is_symlink() and f.stat().st_size <= 16 * 1024 * 1024
            body = f.read_bytes()
            assert key not in body and b"x-buildbuddy-api-key" not in body.lower()
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.privacy.outcome == 'success'
      with:
        name: graph-load-hook-boundary
        path: ${{ runner.temp }}/hook-boundary/proof/
        if-no-files-found: error
