name: Reconcile four original TCP qualification action errors
on:
  push:
    branches: [qualification/tcp-poll-consumed-error]
permissions:
  contents: read
jobs:
  arm:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 95
    env:
      SOURCE: 7fb0cf64f8d7c099e9388cb61d6f3f87156286a1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retrieve the four existing failures without another build
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tcp-evidence"
          python3 test/rbe/tcp-poll-recovery.py prior-errors
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-action-errors
          path: ${{ runner.temp }}/tcp-evidence/*.json
          if-no-files-found: error
