name: Measure inferred semaphore guard identity on two Nogo architectures
on:
  push:
    branches: [qualification/inferred-semaphore-element-owner-20261110]
permissions: {contents: read}
jobs:
  verify:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Prepare the original Linux Go and Nogo owners
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/semaphore-slice-guard"
          mkdir -p "$d"
          test "$(git rev-parse HEAD^)" = 3cef93ed944d840198deb620a2305f6ba74f32f4
          test "$(git rev-parse HEAD^^)" = 3cfe94a2fa36d31bd35d7f09fe2598227a5e4bca
          git diff --exit-code HEAD^^ HEAD^ -- pkg/sentry/kernel/semaphore
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/sem_element_results.py'
          test "$(cat .bazelversion)" = 8.8.1
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo
          if ! command -v aarch64-linux-gnu-g++ >/dev/null; then
            for suite in jammy jammy-updates; do
              echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ $suite main universe"
            done > "$d/ubuntu.list"
            opts=(-o "Dir::Etc::sourcelist=$d/ubuntu.list" -o Dir::Etc::sourceparts=-)
            sudo apt-get "${opts[@]}" update -qq
            sudo apt-get "${opts[@]}" install -qq -y --no-install-recommends g++-aarch64-linux-gnu
          fi
          curl -fsSL --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
      - name: Compare the identical semaphore source with the two analyzer versions
        timeout-minutes: 112
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/semaphore-slice-guard"
          cp .github/qualification/sem_element_results.py "$d/"
          mkdir -p "$d/receipt"
          python3 -B "$d/sem_element_results.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: semaphore-element-ownership
          path: ${{ runner.temp }}/semaphore-slice-guard/receipt
          if-no-files-found: error
          retention-days: 14
