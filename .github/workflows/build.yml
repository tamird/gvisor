name: Cross-build both installed gVisor releases without Coral
on:
  push:
    branches: [qualification/llvm-clean-release-cross]
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Select the product and pinned Bazel client
        id: setup
        run: |
          set -eu
          umask 077
          d="$RUNNER_TEMP/release-rbe"
          mkdir -p "$d/public"
          cp test/rbe/release_prewarmer/*.py "$d/"
          test "$(git rev-parse HEAD^)" = 4145ade50acb0813d372bc5a8315c516ac5d98b6
          git checkout --detach HEAD^
          test "$(uname -m)" = x86_64
          test "$(cat .bazelversion)" = 9.3.1
          curl --retry 3 --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
      - name: Check the resolved main repository mapping
        run: |
          set -eu
          d="$RUNNER_TEMP/release-rbe"
          "$d/bazel" mod dump_repo_mapping '' >"$d/mapping.json"
          python3 - "$d/mapping.json" "$d/public/mapping.json" <<'PY'
          import json, pathlib, sys
          mapping = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert mapping["llvm"].startswith("llvm+"), mapping.get("llvm")
          coral = {k: v for k, v in mapping.items() if "crosstool" in k or "crosstool" in v}
          assert not coral, coral
          pathlib.Path(sys.argv[2]).write_text(json.dumps({"llvm": mapping["llvm"], "crosstool": coral}))
          PY
      - name: Build and inspect all nine AMD64 release files on AMD64
        if: always() && !cancelled() && steps.setup.outcome == 'success'
        run: env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -B "$RUNNER_TEMP/release-rbe/cross.py" x86_64
      - name: Cross-build and inspect all nine ARM64 release files on AMD64
        if: always() && !cancelled() && steps.setup.outcome == 'success'
        run: env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -B "$RUNNER_TEMP/release-rbe/cross.py" aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: llvm-release-without-coral
          path: ${{ runner.temp }}/release-rbe/public/*.json
          if-no-files-found: error
