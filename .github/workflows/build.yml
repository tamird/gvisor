name: Observe the native Go SDK builder on two minimal OCI workers
"on":
  push:
    branches: [qualification/registry-llvm-sdk-bootstrap-native]
permissions: {}
jobs:
  bootstrap:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Bind the immutable source, Bazel and attested worker definitions
        run: |
          set -eu
          umask 077
          work="$RUNNER_TEMP/sdk-native"
          mkdir -p "$work/results"
          public=https://github.com/tamird/gvisor.git
          stock=af5fe68ff1948589e6dbed1caeac40ad8daddbcf
          prior=e89646dda45516a7fe54427a0586a39dc20a7db3
          git init -q .
          GIT_TERMINAL_PROMPT=0 git fetch -q --depth=2 "$public" "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD^)" = "$stock"
          git diff --exit-code "$stock" FETCH_HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/sdk_native.py'
          git show 'FETCH_HEAD:.github/qualification/sdk_native.py' > "$work/qualify.py"
          git checkout -q --detach "$stock"
          test "$(cat .bazelversion)" = 9.3.1
          test ! -e test/rbe/release_prewarmer
          mkdir -p test/rbe/release_prewarmer
          GIT_TERMINAL_PROMPT=0 git fetch -q --depth=1 "$public" "$prior"
          git show "$prior:test/rbe/release_prewarmer/BUILD" > test/rbe/release_prewarmer/BUILD
          echo 'ae1f23a11f3cb747fbec49a34c510c5ab9dcb75d06d94bfd4d9a49d50c629271  test/rbe/release_prewarmer/BUILD' | sha256sum -c -
          curl --proto '=https' --proto-redir '=https' -fsSL --max-time 120 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$work/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $work/bazel" | sha256sum -c -
          chmod 700 "$work/bazel"
      - name: Verify each native SDK action, executable and requested image
        id: graph
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$RUNNER_TEMP/sdk-native/qualify.py" graph
      - name: Execute only independently qualified native builder actions
        if: success() && steps.graph.outcome == 'success'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          work="$RUNNER_TEMP/sdk-native"
          rc="$work/remote.bazelrc"
          trap 'rm -f "$rc"' EXIT
          : "${BUILDBUDDY_API_KEY:?missing fork key}"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$work/qualify.py" build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: registry-llvm-sdk-native-bootstrap
          path: ${{ runner.temp }}/sdk-native/results/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove the temporary coordinator files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/sdk-native"
