name: Recover original prewarmer compiler evidence
on:
  push:
    branches: [qualification/recover-release-compiler]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Recover three original prewarmer actions
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 test/rbe/nativehandoff/recover-compiler.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: llvm-compiler-original-actions
          path: ${{ runner.temp }}/compiler-recovery
