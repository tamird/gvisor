name: Measure a native graph Save buffer
on:
  push:
    branches: [qualification/state-size-exact-values]
permissions: {}
jobs:
  linux:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Bind the stock and candidate sources and native tools
        run: |
          set -euo pipefail
          git init -q
          git fetch --quiet --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = ccb9983cc6c9ddf727b4c9c71d5bbec98fad408b
          test "$(git rev-parse HEAD~2)" = 7d1b049f5d541992b47cc38cf564025908a9ed7b
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/graph_size/run.py'
          test "$(git diff --name-only HEAD~2 HEAD^)" = pkg/state/graph_encode_stream_unsafe.go
          test "$(uname -m)" = x86_64
          test "$(cat .bazelversion)" = 9.3.1
          w="$RUNNER_TEMP/graph-size"
          mkdir -m 700 "$w" "$w/results"
          cp .github/qualification/graph_size/run.py "$w/"
          curl -fsSL --retry 2 https://raw.githubusercontent.com/tamird/gvisor/f948a2221d2329e8e0897eb8b562c859da77468a/.github/qualification/state_working_set/benchstat.module -o "$w/benchstat.module"
          curl -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          cd "$w"
          sha256sum -c <<'SUMS'
          7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel
          373bba0a70f04c2a39a30a45b4acd23f3bfa884e05a5e27cce1ce7010c406cd5  benchstat.module
          SUMS
          chmod 700 bazel
          for suite in jammy jammy-updates; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu $suite main universe"
          done > jammy.list
          opts=(-o "Dir::Etc::sourcelist=$w/jammy.list" -o Dir::Etc::sourceparts=-)
          sudo -n apt-get "${opts[@]}" update -qq
          sudo -n apt-get "${opts[@]}" install -qq -y --no-install-recommends build-essential crossbuild-essential-arm64 libnuma-dev
      - name: Build the original release and stock, candidate and census benchmark owners
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$RUNNER_TEMP/graph-size/run.py" build
      - name: Capture and genuinely restore one 50000-file tmpfs tree
        run: |
          sudo -n env -i HOME=/root PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$RUNNER_TEMP/graph-size/run.py" guest
      - name: Re-encode the identical saved kernel using twelve alternating pairs
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$RUNNER_TEMP/graph-size/run.py" measure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: graph-value-lengths
          path: ${{ runner.temp }}/graph-size/results/
          if-no-files-found: error
          retention-days: 14
