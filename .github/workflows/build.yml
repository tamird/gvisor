name: Check the TCP receive heap lock
on:
  push:
    branches: [qualification/tcp-pending-receive-heap-lock]
permissions: {contents: read}
jobs:
  analyzer:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Use the exact product source and ordinary native compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7f169af00dc2393add6e49671970a1459801c42b
          test "$(git rev-parse HEAD^^)" = 471d6dff5229b99208bf6fec985601067f1f9d69
          cp .github/qualification/tcp-pending-heap.py "$RUNNER_TEMP/"
          git switch --detach HEAD^
          test -z "$(git status --porcelain)"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu
      - name: Check the purge accessor on both analyzed architectures
        run: python3 "$RUNNER_TEMP/tcp-pending-heap.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: tcp-pending-heap-lock
          path: ${{ runner.temp }}/tcp-heap-lock.json
          if-no-files-found: error
