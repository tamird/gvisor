name: Diagnose the original TCP poll timeouts
on:
  push:
    branches: [qualification/tcp-terminal-original-logs]
permissions: {contents: read}
jobs:
  original:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Retrieve the original two service logs and execution dispositions
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 .github/qualification/refusal-original-logs.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: refusal-original-logs
          path: ${{ runner.temp }}/refusal-service-evidence.json
          if-no-files-found: error
