name: Qualify the integration C image context
on:
  push:
    branches: [qualification/integration-c-context]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    env:
      PRODUCT: 712966d0b4e6fc3f518507c8100a809ff0d0563c
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 3
      - name: Configure the pinned Linux execution platform
        id: setup
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
          test "$(gcc -dumpversion | cut -d. -f1)" = 11
          mkdir -p "$RUNNER_TEMP/gnu"
          GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
          test -n "$BUILDBUDDY_API_KEY"
          rc=$RUNNER_TEMP/images.bazelrc
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          cat >> "$rc" <<'RC'
          build --jobs=8
          build --strategy=GoStdlib=linux-sandbox
          build --strategy=GoStdlibList=linux-sandbox
          build --strategy=GoStandardLibraryAnalysis=linux-sandbox
          build --strategy=GoStaticAnalysis=linux-sandbox
          build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache
          build --noremote_upload_local_results
          build --remote_download_outputs=toplevel
          build --nobuild_event_json_file_path_conversion
          build --noshow_progress
          RC

          git show "$GITHUB_SHA:test/rbe/qualify-integration-c.sh" > "$RUNNER_TEMP/check.sh"
          git checkout --quiet --detach "$PRODUCT"
          cat > "$RUNNER_TEMP/privileged-fixture" <<'WRAPPER'
          #!/usr/bin/env bash
          set -u
          uid=$(id -u)
          gid=$(id -g)
          rc=0
          sudo -nE "$@" || rc=$?
          if [[ -f "${XML_OUTPUT_FILE:-}" ]]; then sudo -n chown "$uid:$gid" "$XML_OUTPUT_FILE"; fi
          exit "$rc"
          WRAPPER
          chmod 0755 "$RUNNER_TEMP/privileged-fixture"
      - name: Build the x86-64 Make image and run its programs
        id: amd
        run: bash "$RUNNER_TEMP/check.sh" x86_64
      - name: Run the actual nested gVisor configurations in the image
        if: always() && steps.amd.outcome == 'success'
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/results/nested"
          mkdir -p "$r"
          rc=0
          bazel --bazelrc="$RUNNER_TEMP/images.bazelrc" test --config=x86_64 --strategy=TestRunner=local --nocache_test_results --test_output=errors --test_arg=-test.v --run_under="$RUNNER_TEMP/privileged-fixture" --test_timeout=420 --build_event_json_file="$RUNNER_TEMP/nested.bep" //test/e2e:runtime_in_docker_test >"$r/build.log" 2>&1 || rc=$?
          log=bazel-testlogs/test/e2e/runtime_in_docker_test/test.log
          for file in "$log" "${log%/*}/test.xml"; do if [[ -f "$file" ]]; then cp "$file" "$r/"; fi; done
          echo "$rc" > "$r/bazel-exit"
          python3 - "$r" <<'PYTEST'
          import json,pathlib,re,sys
          r=pathlib.Path(sys.argv[1])
          log=(r/"test.log").read_text() if (r/"test.log").is_file() else ""
          states={result: re.findall(r"--- "+result+r": (TestGVisorInDocker[^ (]*) ",log) for result in ("PASS","FAIL","SKIP")}
          (r/"cases.json").write_text(json.dumps(states,indent=2))
          required=["Rootful","Rootful_without_networking","Rootful_with_host_networking","Rootful_without_networking_and_cgroupfs","Rootless","Rootless_without_networking"]
          assert all("TestGVisorInDocker/"+case in states["PASS"] for case in required), states
          assert not states["FAIL"] and not states["SKIP"]
          assert int((r/"bazel-exit").read_text())==0
          PYTEST
      - name: Install the Linux ARM64 binfmt interpreter
        id: qemu
        if: always() && steps.setup.outcome == 'success'
        run: |
          if [[ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
            sudo update-binfmts --enable qemu-aarch64
          fi
          grep -Fx enabled /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -E '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Cross-compile the ARM64 Make image and exercise its binaries under QEMU
        if: always() && steps.qemu.outcome == 'success'
        run: bash "$RUNNER_TEMP/check.sh" aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-c-contexts
          path: ${{ runner.temp }}/results
          if-no-files-found: error
      - name: Remove private native engine settings
        if: always()
        run: rm -f "$RUNNER_TEMP/images.bazelrc"
