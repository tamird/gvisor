name: Check the Bazel 9 network plugin overlay
on:
  push:
    branches: [qualification/bazel9-plugin-rule]
permissions:
  contents: read
jobs:
  plugin:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STOCK: 4c2df79754b332dab322e4e8c77e55ca401904ce
      FIXED: 28ef58c4c071365fcdcb727e7f7de12fff3b9824
      PRODUCT: 48ffa4b25b28229f15edbec5c17ab04d36dbcc4b
      REPORTER: fb60e127516defd6aab633f80be09a03022f0737
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
      - name: Open the bounded receipt before setup
        run: |
          mkdir -p "$RUNNER_TEMP/plugin"
          printf '{"status":"INCOMPLETE","phase":"setup","source":"%s"}\n' "$FIXED" > "$RUNNER_TEMP/plugin/result.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Prepare the pinned Bazel client and existing AMD64 GNU builder
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/plugin"
          test "$(git rev-parse HEAD^)" = "$FIXED"
          test "$(git rev-parse HEAD^^)" = "$STOCK"
          git fetch --no-tags --depth=1 origin "$PRODUCT" "$REPORTER"
          path=external/tools/plugin-stack/plugin-stack.BUILD
          test "$(git diff --name-only "$STOCK" "$FIXED")" = "$path"
          test "$(git rev-parse "$PRODUCT:$path")" = "$(git rev-parse "$FIXED:$path")"
          cp .github/qualification/plugin_rule.py "$d/"
          for f in qualification_report unit_matrix; do git show "$REPORTER:test/rbe/$f.py" > "$d/$f.py"; done
          curl -fsSL --retry 3 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $d/bazel" | sha256sum -c -
          chmod +x "$d/bazel"
          docker pull --platform linux/amd64 "$GNU"
          docker run -d --name plugin --entrypoint /bin/bash --user root \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" \
            -v "$d:$d" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
          test "$(docker exec plugin "$d/bazel" --version)" = "bazel 9.3.1"
      - name: Compare package loading and build both runtime consumers
        timeout-minutes: 47
        run: python3 "$RUNNER_TEMP/plugin/plugin_rule.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: plugin-rule-result
          if-no-files-found: error
          path: ${{ runner.temp }}/plugin/result.json
