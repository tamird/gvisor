name: Check the real sandbox environment in pure and cgo releases
on:
  push:
    branches: [qualification/sentry-glibc-arena-env]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PRODUCT: 2b5c4fa4ddb3565a83c636e31b2cc99526cf3015
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record the original parent frames from the existing capture without replaying the guest
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          mkdir -p "$RUNNER_TEMP/receipt"
          cp test/rbe/tldk_posture/{parent-native.py,posture-case.py} "$RUNNER_TEMP/"
          cp test/rbe/tldk_posture/{denied-openat.json,diagnosis.json} "$RUNNER_TEMP/receipt/"
          git checkout --detach "$PRODUCT"
          image=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          docker pull "$image" >/dev/null
          docker run --rm --entrypoint=cat "$image" /usr/lib/x86_64-linux-gnu/libc.a > "$RUNNER_TEMP/qualified-native-libc.a"
          if ! /usr/bin/python3 -c 'import elftools'; then sudo apt-get -qq update; sudo apt-get -qq install -y python3-pyelftools; fi
          /usr/bin/python3 "$RUNNER_TEMP/parent-native.py"
      - name: Configure the pinned Linux execution platform
        id: setup
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
          test "$(gcc -dumpversion | cut -d. -f1)" = 11
          mkdir -p "$RUNNER_TEMP/gnu"
          GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
          test -n "$BUILDBUDDY_API_KEY"
          rc=$RUNNER_TEMP/images.bazelrc
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          cat >> "$rc" <<'RC'
          build --jobs=8
          build --strategy=ReleaseFiles=linux-sandbox
          build --strategy=GoStdlib=linux-sandbox
          build --strategy=GoStdlibList=linux-sandbox
          build --strategy=GoStandardLibraryAnalysis=linux-sandbox
          build --strategy=GoStaticAnalysis=linux-sandbox
          build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache
          build --noremote_upload_local_results
          build --remote_download_outputs=toplevel
          build --nobuild_event_json_file_path_conversion
          build --noshow_progress
          RC

          # The qualified GNU container has its C++ cross compiler; host-routed
          # C++ actions must instead use the matching GCC on this AMD64 runner.
          printf '%s\n' 'build --strategy=CppCompile=linux-sandbox' 'build --jobs=3' >> "$rc"
          if ! command -v aarch64-linux-gnu-gcc >/dev/null; then sudo apt-get -qq update; sudo apt-get -q install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu; fi
      - name: Build the unchanged-family pure and cgo Sentry distributions and actual root test
        timeout-minutes: 125
        run: |
          set -euo pipefail
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          b() { bazelisk "--bazelrc=$RUNNER_TEMP/images.bazelrc" "$@"; }
          for mode in pure race; do
            flags=(--config=x86_64); targets=(//:release)
            if [[ $mode = race ]]; then flags+=(--config=race); else targets+=(//test/root:root_test); fi
            b build "${flags[@]}" --build_event_json_file="$RUNNER_TEMP/$mode.bep" "${targets[@]}" > "$RUNNER_TEMP/$mode.log" 2>&1
            if [[ $mode = pure ]]; then
              src=$(b cquery "${flags[@]}" --output=files //test/root:root_test 2>"$RUNNER_TEMP/cquery.log")
              install -m755 "$src" "$RUNNER_TEMP/posture-test"
            fi
            cp -RL bazel-bin/release "$RUNNER_TEMP/posture-$mode"
            test -x "$RUNNER_TEMP/posture-$mode/gvisor-bin/gvisor_sentry"
          done
      - name: Check the named case against both real hosted Sentry process environments
        timeout-minutes: 12
        run: python3 "$RUNNER_TEMP/posture-case.py"
      - name: Record the original release build outcomes
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import json,os,re
          d=Path(os.environ['RUNNER_TEMP']);root=d/'receipt';root.mkdir(exist_ok=True);r={}
          for mode in ('pure','race'):
              f=d/(mode+'.bep'); l=d/(mode+'.log');v=r[mode]={}
              if f.exists():
                  for line in f.open():
                      e=json.loads(line)
                      if 'started'in e:v['invocation']=e['started'].get('uuid')
                      if 'finished'in e:v['exit']=e['finished'].get('exitCode')
                      if 'targetCompleted'in e.get('id',{}):
                          v.setdefault('labels',{})[e['id']['targetCompleted']['label']]=e['completed'].get('success',False)
              if l.is_file() and v.get('exit',{}).get('name')!='SUCCESS':
                  v['errors']=[x[-350:] for x in l.read_text(errors='replace').splitlines() if re.search(r'\b(?:ERROR:|fatal:|error:|killed)',x) and not re.search(r'authorization|header|secret|key|credential',x,re.I)][-10:]
          (root/'root-builds.json').write_text(json.dumps(r,indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sentry-environment-and-original-parent-frames
          path: ${{ runner.temp }}/receipt
          if-no-files-found: error
