name: Compare corked FIN through Linux and runsc syscalls
on:
  push:
    branches: [qualification/tcp-cork-common-syscall]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 4, persist-credentials: false}
      - name: Run the actual Linux and sentry socket cases
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/cork-syscall"
          mkdir -p "$receipt" "$RUNNER_TEMP/cork-platform"
          cp test/rbe/cork-syscall-result.py "$RUNNER_TEMP/verify-cork.py"
          stock=c65b3b5f8f5560421298cbfb36928b3c232ae54a
          proposed=4f06bbb67a8e45dbf89c036ae937607dc3561d50
          [[ "$(git rev-parse HEAD^1)" == "$proposed" && "$(git rev-parse HEAD^2)" == "$stock" ]]
          printf 'module(name="cork_platform")\n' > "$RUNNER_TEMP/cork-platform/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/cork-platform/BUILD"
          rc=$RUNNER_TEMP/cork.bazelrc
          umask 077
          trap 'rm -f "$rc"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=remote' "build --inject_repository=cork_platform=$RUNNER_TEMP/cork-platform" 'build --host_platform=@cork_platform//:gnu' 'build --extra_execution_platforms=@cork_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          for arm in linux stock proposed; do
            d="$receipt/$arm"
            mkdir -p "$d"
            source=$stock
            platform=runsc_ptrace
            [[ "$arm" != proposed ]] || source=$proposed
            [[ "$arm" != linux ]] || platform=native
            git checkout --quiet --detach "$source"
            [[ "$(git rev-parse HEAD)" == "$source" && -z "$(git status --porcelain --untracked-files=no)" ]]
            target="//test/syscalls:socket_ip_tcp_generic_loopback_test_$platform"
            printf '%s\n' "$source" > "$d/source"
            printf '%s\n' "$target" > "$d/target"
            sha256sum test/syscalls/linux/socket_ip_tcp_generic.cc > "$d/fixture-sha256"
            date -u +%FT%TZ > "$d/started"
            args=(test --config=x86_64 --jobs=64 --test_sharding_strategy=disabled --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --test_output=all --test_timeout=450 '--test_env=GTEST_FILTER=*TCPCorkFlushOnClose/*:*TCPCorkFlushOnShutdown/*:*TCPCork/*' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' "--build_event_json_file=$RUNNER_TEMP/$arm-bep.jsonl" "$target")
            printf '%s\n' "${args[@]}" > "$d/arguments"
            code=0
            bazel --bazelrc="$rc" "${args[@]}" > "$d/bazel.log" 2>&1 || code=$?
            echo "$code" > "$d/exit"
            date -u +%FT%TZ > "$d/ended"
            logdir="$(bazel --bazelrc="$rc" info bazel-testlogs)/test/syscalls/${target#*:}"
            for name in test.log test.xml; do
              [[ ! -f "$logdir/$name" ]] || cp "$logdir/$name" "$d/$name"
            done
            python3 - "$RUNNER_TEMP/$arm-bep.jsonl" "$d/action.json" <<'PYTHON'
          import json,sys
          from pathlib import Path
          records=[]
          if Path(sys.argv[1]).is_file():
              for line in Path(sys.argv[1]).read_text().splitlines():
                  e=json.loads(line)
                  for k in ("started","testResult","testSummary","finished"):
                      if k in e:
                          value=e[k]
                          records.append({k:{f:value[f] for f in ("uuid","overallStatus","status","executionInfo","exitCode") if f in value}})
          Path(sys.argv[2]).write_text(json.dumps(records,indent=2)+"\n")
          PYTHON
          done
          python3 "$RUNNER_TEMP/verify-cork.py" "$receipt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tcp-cork-syscalls
          path: ${{ runner.temp }}/cork-syscall/
          if-no-files-found: error
