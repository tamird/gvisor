name: Check the syscall allocator with the declared C++ compiler
on:
  push:
    branches: [qualification/llvm-allocator-warning]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 9
          persist-credentials: false
      - name: Compile the master allocator and its two-declaration correction
        run: |
          set -euo pipefail
          cp test/rbe/allocator-warning.py "$RUNNER_TEMP/allocator-proof.py"
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
          python3 "$RUNNER_TEMP/allocator-proof.py"
      - name: Preserve the selected Clang flags, diagnostics, and per-arm verdicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: allocator-compiler
          path: ${{ runner.temp }}/allocator
          if-no-files-found: error
