name: Verify the two existing LLVM race coverage outputs
on:
  push:
    branches: [qualification/llvm-race-coverage-original]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind the reader and unchanged ELF inspector to the original build
        run: |
          test "$(git rev-parse HEAD^)" = a33d233c2208aee1ef58147492f23724cf31b287
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/llvm_race_original.py'
      - name: Read only the two target and GoLink outputs from the original invocation
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -EsB .github/qualification/llvm_race_original.py recover
      - name: Inspect the digest-checked native ELFs and run the original CLI
        run: python3 -EsB .github/qualification/llvm_race_original.py inspect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: llvm-race-coverage-original
          path: ${{ runner.temp }}/llvm-race-original/result.json
          if-no-files-found: error
      - name: Require both original race-and-coverage binaries
        run: python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"llvm-race-original/result.json"; raise SystemExit(0 if json.loads(p.read_text()).get("verified") else 1)'
