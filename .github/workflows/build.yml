name: Trace the actual two-architecture release producer graphs
"on":
  push:
    branches: [qualification/registry-llvm-release-reachable-actions]
permissions: {}
jobs:
  release-graph:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Bind the release source and the original empty worker
        run: |
          set -eu
          umask 077
          work="$RUNNER_TEMP/release-graph"
          mkdir -p "$work/receipt"
          public=https://github.com/tamird/gvisor.git
          product=9e1db6e550d181ff2c691a5e8df8412b74316415
          worker=e89646dda45516a7fe54427a0586a39dc20a7db3
          parser=eec8914ee486c04cc2e53e41d79ba32022e85ceb
          git init -q .
          GIT_TERMINAL_PROMPT=0 git fetch -q --depth=2 "$public" "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD^)" = "$product"
          git diff --exit-code "$product" FETCH_HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/release_reachable.py'
          git show 'FETCH_HEAD:.github/qualification/release_reachable.py' > "$work/reach.py"
          git checkout --detach -q "$product"
          test ! -e test/rbe/release_prewarmer
          mkdir -p test/rbe/release_prewarmer
          GIT_TERMINAL_PROMPT=0 git fetch -q --depth=1 "$public" "$worker"
          git show "$worker:test/rbe/release_prewarmer/BUILD" > test/rbe/release_prewarmer/BUILD
          echo 'ae1f23a11f3cb747fbec49a34c510c5ab9dcb75d06d94bfd4d9a49d50c629271  test/rbe/release_prewarmer/BUILD' | sha256sum -c -
          GIT_TERMINAL_PROMPT=0 git fetch -q --depth=1 "$public" "$parser"
          git show "$parser:.github/qualification/native_graph.py" > "$work/native_graph.py"
          test "$(cat .bazelversion)" = 9.3.1
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$work/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $work/bazel" | sha256sum -c -
          chmod 700 "$work/bazel"
      - name: Follow production output files to their configured producer actions
        run: env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$RUNNER_TEMP/release-graph/reach.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: registry-llvm-release-action-graph
          path: ${{ runner.temp }}/release-graph/receipt/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary coordinator outputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/release-graph"
