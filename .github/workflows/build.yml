name: Exercise the remote source coordinator hooks offline
on:
  push:
    branches: [qualification/buildkite-remote-source-bootstrap]
permissions: {contents: read}

jobs:
  bootstrap:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 4}
      - name: Bind both hook trees and the official command-line tools
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/buildkite-source-hooks"
          mkdir -p "$w/results" "$w/legacy-log"
          test "$(git rev-parse HEAD^)" = 74eeb2c4eb4a456d1ed3db2a609d625df8de18cb
          test "$(git rev-parse HEAD^^)" = 4eb27c4081e535d69c1257998a6c94256d9812e2
          git diff --exit-code HEAD^ HEAD -- . ':!.github/qualification/source_hooks' ':!.github/workflows/build.yml'
          git diff --exit-code HEAD^^ HEAD^ -- . ':!.buildkite/hooks/libhook' ':!.buildkite/hooks/pre-command' ':!.buildkite/hooks/post-command' ':!.buildkite/rbe-source.yaml' ':!.buildkite/scripts/rbe-source'
          cp .github/qualification/source_hooks/* "$w/"
          chmod 755 "$w/dispatch.py"
          printf '%s\n' '--- FAIL: TestCoordinatorLegacy (0.01s)' >"$w/legacy-log/test.log"
          cd "$w"
          curl --retry 2 --max-time 120 --proto '=https' --proto-redir '=https' -fsSL https://github.com/buildkite/agent/releases/download/v4.10.1/buildkite-agent-linux-amd64-4.10.1.tar.gz -o agent.tar.gz
          curl --retry 2 --max-time 120 --proto '=https' --proto-redir '=https' -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o bazelisk
          sha256sum --check <<'SUMS'
          f7ecf75a3be41a786f25e9cdbff332dc49b7f18ef63a1fd73bf77056fd4d7fe0  agent.tar.gz
          e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  bazelisk
          SUMS
          python3 -IB - <<'PY'
          import pathlib, tarfile
          with tarfile.open("agent.tar.gz") as t:
              member, = [i for i in t if i.isfile() and pathlib.PurePosixPath(i.name).name == "buildkite-agent"]
              pathlib.Path("agent").write_bytes(t.extractfile(member).read())
          PY
          chmod 755 agent bazelisk
          ./agent --version | grep -F '4.10.1'
      - name: Warm only the sentinel dependencies on the disposable runner
        run: |
          set -eu
          w="$RUNNER_TEMP/buildkite-source-hooks"
          target=//test/rbe/coordinator_hook_fixture:sentinel
          git checkout --quiet --detach 4eb27c4081e535d69c1257998a6c94256d9812e2
          mkdir -p test/rbe/coordinator_hook_fixture
          cp "$w/fixture.BUILD" test/rbe/coordinator_hook_fixture/BUILD
          cp "$w/sentinel.sh" test/rbe/coordinator_hook_fixture/
          chmod 755 test/rbe/coordinator_hook_fixture/sentinel.sh
          echo "$target" > "$w/sentinel.targets"
          cat > "$w/local-flags" <<'FLAGS'
          --remote_executor=
          --remote_cache=
          --bes_backend=
          --spawn_strategy=standalone
          --strategy=TestRunner=standalone
          --cpu=k8
          --platforms=//tools/bazeldefs:linux_amd64
          --host_platform=//tools/bazeldefs:linux_amd64
          --extra_execution_platforms=//tools/bazeldefs:linux_amd64
          --jobs=4
          --color=no
          --curses=no
          --noshow_progress
          FLAGS
          test "$("$w/bazelisk" --version)" = 'bazel 9.3.1'
          mapfile -t flags < "$w/local-flags"
          "$w/bazelisk" --batch --nosystem_rc --nohome_rc build --config=source-presubmit "${flags[@]}" "$target"
      - name: Exercise the original hooks without Docker or package installation
        id: stock
        run: |
          set -eu
          w="$RUNNER_TEMP/buildkite-source-hooks"
          test "$(git rev-parse HEAD)" = 4eb27c4081e535d69c1257998a6c94256d9812e2
          sudo unshare --mount --net --pid --fork --kill-child=KILL --mount-proc /bin/bash "$w/isolate.sh" "$w" "$(id -u)" "$(id -g)" stock
      - name: Exercise the revised hooks and real local Bazel sentinel
        if: always() && (steps.stock.outcome == 'success' || steps.stock.outcome == 'failure')
        run: |
          set -eu
          w="$RUNNER_TEMP/buildkite-source-hooks"
          git checkout --quiet --detach 74eeb2c4eb4a456d1ed3db2a609d625df8de18cb
          sudo unshare --mount --net --pid --fork --kill-child=KILL --mount-proc /bin/bash "$w/isolate.sh" "$w" "$(id -u)" "$(id -g)" fixed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: offline-source-hook-results
          path: |
            ${{ runner.temp }}/buildkite-source-hooks/results/stock.json
            ${{ runner.temp }}/buildkite-source-hooks/results/fixed.json
          if-no-files-found: warn
          retention-days: 14
