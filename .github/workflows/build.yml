name: Compare guest MemTotal under nested OCI memory limits
on:
  push:
    branches: [qualification/oci-ancestor-memory]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: c89f8f55abfe0d08c2bfc836192bd27d0aee7161
      STOCK: d624fba03a2b3f1f9a314e54198c95460005cc15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 8, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        cp test/rbe/verify-oci-direct.py "$RUNNER_TEMP/verify-tcp.py"
        cp test/rbe/run-oci-mem.py "$RUNNER_TEMP/oci.py"
        [[ "$(git rev-parse HEAD^1^1)" == "$CURRENT" && "$(git rev-parse HEAD^1^2)" == "$STOCK" ]]
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /var/run/docker.sock:/var/run/docker.sock -v "$(command -v docker):/usr/local/bin/host-docker:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Recover the compiler failures from the original two builds
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'DIAG'
        import base64,json,os,urllib.request
        from pathlib import Path
        for name,i in [('stock','859bc879-4d17-46ed-823b-dec507325c16'),('fixed','3b12b777-3801-4084-afac-d54b433945bf')]:
            req=urllib.request.Request('https://app.buildbuddy.io/rpc/BuildBuddyService/GetEventLogChunk',json.dumps(dict(invocationId=i,minLines=100000)).encode(),{'Content-Type':'application/json','x-buildbuddy-api-key':os.environ['BB_KEY']})
            try:
                with urllib.request.urlopen(req,timeout=45) as response:
                    o=json.load(response)
                txt=base64.b64decode(o['buffer']).decode(errors='replace')
                lines=[l for l in txt.splitlines() if 'fatal error:' in l or 'error:' in l or 'treated as errors' in l]
                diagnostic='\n'.join(lines)[:12000]
            except Exception as e:
                diagnostic=type(e).__name__+': '+str(e)
            (Path(os.environ['RUNNER_TEMP'])/'records'/('original-'+name+'.log')).write_text(diagnostic+'\n')
        DIAG
    - name: Run the same OCI guest on stock and corrected runsc
      run: |
        set -euo pipefail
        for arm in stock fixed; do
          src=$STOCK; [[ $arm == stock ]] || src=$CURRENT
          git checkout --quiet --detach "$src"; [[ "$(git rev-parse HEAD)" == "$src" ]]
          rec=$RUNNER_TEMP/records/$arm; mkdir -p "$rec"
          echo "$src" > "$rec/source"
          sha256sum test/root/runsc_test.go > "$rec/test.sha256"
          rc=0
          docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" build --config=x86_64 --jobs=32 --spawn_strategy=remote,local --remote_download_outputs=toplevel //runsc:runsc > "$rec/build.log" 2>&1 || rc=$?
          echo "$rc" > "$rec/build.exit"
          if [[ $rc == 0 ]]; then
            docker exec tcp-compiler cp bazel-bin/runsc/runsc_/runsc "$RUNNER_TEMP/runsc-$arm"
            docker exec tcp-compiler python3 "$RUNNER_TEMP/oci.py" "$RUNNER_TEMP/runsc-$arm" "$rec" || true
          fi
          grep -E 'Invocation ID:|fatal error:|error:|^ERROR:' "$rec/build.log" | head -60 > "$rec/build.diagnostics" || true
          rm "$rec/build.log"
        done
        date -u +%FT%TZ > "$RUNNER_TEMP/records/end"
    - name: Reconcile all six guest results
      if: always()
      run: python3 "$RUNNER_TEMP/verify-tcp.py" "$RUNNER_TEMP/records"
    - name: Exclude credentials from the evidence bundle
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key=os.environ["BB_KEY"].encode()
        for f in (Path(os.environ["RUNNER_TEMP"])/"records").rglob("*"):
            if f.is_file() and key and key in (data:=f.read_bytes()):
                f.write_bytes(data.replace(key,b"[REDACTED]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: oci-memtotal-direct
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
