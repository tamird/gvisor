name: Recover the original occupied-worker control
on:
  push:
    branches: [qualification/fdbased-attachment-original-result]
permissions: {contents: read}
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Bind the original native qualification
        run: |
          test "$(git rev-parse HEAD^)" = 5d0ce126c6119470ac3a59330e8db83dfe24a64b
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/fdbased_original.py'
      - name: Read only the original failed TestRunner log and XML
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -IB .github/qualification/fdbased_original.py
      - name: Verify the bounded receipt
        id: bound
        if: always() && !cancelled()
        run: |
          f="$RUNNER_TEMP/fdbased-original.json"
          test -s "$f" && test "$(wc -c < "$f")" -lt 8192
          jq -e '.invocation=="f9367db2-e9da-4009-be7f-3e7521dcc254" and .owner=="//pkg/tcpip/link/fdbased:fdbased_test"' "$f" >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.bound.outcome == 'success' && !cancelled()
        with:
          name: fdbased-original-control
          path: ${{ runner.temp }}/fdbased-original.json
          if-no-files-found: error
          retention-days: 14
