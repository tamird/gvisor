name: Compare the Newt TCP client transfers
on:
  push:
    branches: [qualification/tcp-newt-pr16081-transfer]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/tcp-newt-pr16081-transfer'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: adios-404/netstack-rack-repro
        ref: ae0978c979502245730603fbe269edcc51166906
        persist-credentials: false
        path: reporter
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: fosrl/newt
        ref: 76ff3b13801b8a03e18f808aabde4bd4bef15058
        persist-credentials: false
        path: newt
    - name: Build the pinned Newt data path and compare ten local fetches
      env:
        GOTOOLCHAIN: go1.27.3
        GOPROXY: https://proxy.golang.org
      run: python3 test/rbe/tcp_newt_transfer.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: newt-transfer
        path: ${{ runner.temp }}/newt-transfer.json
        if-no-files-found: error
