name: Submit one source-test graph to RBE
on:
  push:
    branches: [qualification/unified-rbe-submission]
permissions:
  contents: read
jobs:
  submit:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run the Buildkite command with remote compilation and tests
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          rc="$RUNNER_TEMP/remote.bazelrc"
          trap 'rm -f "$rc" "$RUNNER_TEMP/bep" "$RUNNER_TEMP/bazel.log"' EXIT
          : "${BUILDBUDDY_API_KEY:?missing fork credential}"
          printf '%s\n' 'build:buildbuddy_remote_executor --remote_executor=grpcs://remote.buildbuddy.io' 'build:buildbuddy_remote_executor --remote_cache=grpcs://remote.buildbuddy.io' 'build:buildbuddy_remote_executor --bes_backend=grpcs://remote.buildbuddy.io' 'build:buildbuddy_remote_executor --bes_results_url=https://app.buildbuddy.io/invocation/' > "$rc"
          printf 'build:buildbuddy_remote_executor --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          printf '%s\n' 'test --nocache_test_results' 'test --flaky_test_attempts=1' 'test --keep_going' "build --build_event_json_file=$RUNNER_TEMP/bep" >> "$rc"
          unset BUILDBUDDY_API_KEY
          export QUALIFY_BAZELRC="$rc"
          ruby -ryaml -rshellwords -e '
            steps = YAML.load_file(".buildkite/rbe-source.yaml").fetch("steps")
            abort "expected one submitter" unless steps.length == 1
            executable, *args = Shellwords.split(steps.first.fetch("command"))
            exec(executable, "--bazelrc=" + ENV.fetch("QUALIFY_BAZELRC"), *args)
          ' > "$RUNNER_TEMP/bazel.log" 2>&1 || code=$?
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          observations = []
          errors = []
          log = (tmp / "bazel.log").read_text(errors="replace")
          urls = sorted(set(re.findall(r"https://app\.buildbuddy\.io/invocation/[a-f0-9-]{36}", log)))
          if (tmp / "bep").exists():
              for line in (tmp / "bep").open():
                  event = json.loads(line)
                  if "testResult" in event:
                      result = event["testResult"]
                      info = result.get("executionInfo", {})
                      observations.append(dict(label=event["id"]["testResult"]["label"], status=result["status"], strategy=info.get("strategy"), cached=result.get("cachedLocally", False) or info.get("cachedRemotely", False)))
          for line in log.splitlines():
              if re.search(r"error:|^FAILED:", line, re.I) and not re.search(r"header|authorization|api.key|token",line,re.I):
                  errors.append(line[:1200])
          receipt = dict(invocations=urls, tests=observations, errors=errors[:12])
          print(json.dumps(receipt, indent=2))
          (tmp / "receipt.json").write_text(json.dumps(receipt, indent=2)+"\n")
          expected = {f"//pkg/atomicbitops:atomicbitops_test_{cpu}" for cpu in ("amd64", "arm64")} | {f"//test/util:posix_error_test_{cpu}" for cpu in ("amd64","arm64")} | {"//test/syscalls:uname_test_native_amd64", "//test/syscalls:uname_test_runsc_systrap_shared_amd64"}
          assert len(urls) == 1 and {t["label"] for t in observations} == expected
          assert all(t["status"] == "PASSED" and t["strategy"] == "remote" and not t["cached"] for t in observations)
          PY
          exit "${code:-0}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: unified-rbe-receipt
          path: ${{ runner.temp }}/receipt.json
          retention-days: 7
