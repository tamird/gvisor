name: Check FIB netlink validation on Linux and gVisor
on:
  push:
    branches: [qualification/socket-netfilter-fib-boundaries]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/socket-netfilter-fib-boundaries'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      OSTOCK: d9bf840053079763c93040823c600ea195621598
      OFIXED: 632655077dd22ba059b970f211c3cf2a59dd2ac9
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
        persist-credentials: false
    - name: Verify the source pair and native kernel
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^1)" = "$OFIXED"
        test "$(git rev-parse HEAD^2)" = "$OSTOCK"
        test "$(git rev-parse "$OFIXED^")" = 1398e3d66dd10492c6c7ba72c1dfdc3e438ee0d7
        test "$(git rev-parse "$OSTOCK^")" = dd6f043ac9e6bd4b27bef3bb0417019cd179dc64
        p=test/syscalls/linux/socket_netlink_netfilter.cc
        for source in "$OFIXED" "$OSTOCK"; do
          test "$(git diff --name-only "$source^" "$source")" = "$p"
        done
        test "$(git show "$OFIXED" -- "$p" | git patch-id --stable | cut -d' ' -f1)" = "$(git show "$OSTOCK" -- "$p" | git patch-id --stable | cut -d' ' -f1)"
        mkdir -p "$RUNNER_TEMP/records"
        cp test/rbe/fib_netlink_report.py "$RUNNER_TEMP/fib-report.py"
        if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        uname -a > "$RUNNER_TEMP/records/kernel"
        for m in nf_tables nft_fib nft_fib_ipv4 nft_fib_ipv6; do
          status=0; sudo -n modprobe "$m" >> "$RUNNER_TEMP/records/modules" 2>&1 || status=$?
          echo "$m $status" >> "$RUNNER_TEMP/records/modules"
        done
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Start the existing GNU Bazel coordinator
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --privileged --name overlay-guest --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
    - name: Execute the identical three netlink requests on every arm
      run: |
        set -euo pipefail
        fixed=$OFIXED; original=$OSTOCK
        for arm in linux current original; do
          source=$fixed
          target=socket_netlink_netfilter_test_runsc_systrap_directfs_nftables
          if [[ $arm = original ]]; then source=$original; fi
          if [[ $arm = linux ]]; then target=socket_netlink_netfilter_test_native; fi
          git checkout --quiet --detach "$source"
          test "$(git rev-parse HEAD)" = "$source"
          out="$RUNNER_TEMP/records/$arm"; mkdir -p "$out"
          printf '%s\n' "$source" > "$out/source"
          date -u --iso-8601=ns > "$out/started"
          ec=0
          filter='FibRuleTest/AddRuleWithExprTest.AddRuleWithExpr/DregWouldTruncate:FibRuleTest/AddRuleWithExprTest.AddRuleWithExpr/UnknownFlag:FibRuleTest/AddRuleWithExprTest.AddRuleWithExpr/ValidLastRegister'
          docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=32 --strategy=TestRunner=local --nocache_test_results --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_sharding_strategy=disabled --test_timeout=300 --test_output=all --test_env="GTEST_FILTER=$filter" "--build_event_json_file=$RUNNER_TEMP/fib-bep-$arm" --build_event_json_file_path_conversion=false "//test/syscalls:$target" >"$RUNNER_TEMP/$arm.bazel-log" 2>&1 || ec=$?
          echo "$ec" > "$out/exit"; date -u --iso-8601=ns > "$out/ended"
          docker exec overlay-guest cat "bazel-testlogs/test/syscalls/$target/test.log" >"$out/test.log" || :
          grep -E 'INFO: Invocation ID:|^ERROR:|^FAIL:|Build (did NOT complete|completed)|FibRuleTest/AddRuleWithExprTest' "$RUNNER_TEMP/$arm.bazel-log" | tail -30 > "$out/bazel.receipt" || :
          sudo chown -R "$(id -u):$(id -g)" "$out"
        done
    - name: Validate the named syscall cases
      if: always()
      run: python3 "$RUNNER_TEMP/fib-report.py" "$RUNNER_TEMP/records"
    - name: Return the original exits, named cases and source identity
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: fib-netlink-abi
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
