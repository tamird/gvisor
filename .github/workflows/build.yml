name: Iperf ARM64 static link and image consumer
on:
  push:
    branches: [qualification/iperf-static-arm]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.19.0
      - name: Configure the existing declared GNU worker
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD^)" = c63dd53b987ba347983312252352e85bb71c1273
          test "$(git rev-parse HEAD^^)" = 67601a14c6ffdf37d7e27a9124170a9d54ef0e12
          mkdir -p "$RUNNER_TEMP/iperf-static/gnu"
          cp test/rbe/gnu_platform/{MODULE.bazel,BUILD.bazel} "$RUNNER_TEMP/iperf-static/gnu/"
          cp test/rbe/{iperf_static,image_execution}.py "$RUNNER_TEMP/iperf-static/"
          umask 077
          {
            printf '%s\n' 'build --compilation_mode=opt' 'build --jobs=16' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --remote_timeout=10m' 'build --remote_download_outputs=all' 'build --remote_cache_compression' 'build --noshow_progress' 'build --noannounce_rc' 'build --noremote_upload_local_results' 'build --host_platform=@qualification_gnu//:gnu' 'build --extra_execution_platforms=@qualification_gnu//:gnu'
            printf 'build --inject_repository=qualification_gnu=%s/iperf-static/gnu\n' "$RUNNER_TEMP"
            printf 'build --remote_header=x-buildbuddy-api-key=%s\nbuild --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/iperf-static/remote.bazelrc"
      - name: Inspect actual links and native cancellation
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 "$RUNNER_TEMP/iperf-static/iperf_static.py"
      - name: Validate typed artifact boundary
        id: boundary
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 "$RUNNER_TEMP/iperf-static/iperf_static.py" --scan
      - uses: actions/upload-artifact@v7.0.1
        if: always() && steps.boundary.outcome == 'success'
        with:
          name: iperf-static
          path: ${{ runner.temp }}/iperf-static/public/result.json
          if-no-files-found: error
