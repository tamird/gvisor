name: Compare callback reservation against upstream
on:
  push:
    branches: [qualification/state-reservation-final-comparison]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: ${{ github.sha }}
      BASE: aa767e4c43d011121271551fe24da501a56f729d
      PRODUCT: 255bc204e6d5304fb4816605c2b32aaf1b311000
      STOCK: 42fe72c8e751a6e109cc4ded3e0dda8e8570376c
      FIXED: 4cebf830f4b7128ff5ed8f0e24401bbeb1b7980b
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 8, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD)" == "$CURRENT" ]]
        test "$(git rev-parse HEAD^)" = "$FIXED"
        test "$(git rev-parse "$FIXED^2")" = "$STOCK"
        test "$(git rev-parse "$STOCK^")" = "$BASE"
        test "$(git rev-parse HEAD~3)" = "$PRODUCT"
        test "$(git rev-parse HEAD~4)" = "$BASE"
        git diff --exit-code "$BASE" "$STOCK" -- . ':!runsc/container/BUILD' ':!runsc/container/container_save_restore_test.go' ':!pkg/state/graph_decode_unsafe.go' ':!pkg/state/tests/bench_test.go' ':!test/benchmarks/checkpointfile/checkpointfile.go'
        git diff --exit-code "$PRODUCT" "$FIXED" -- . ':!runsc/container/BUILD' ':!runsc/container/container_save_restore_test.go' ':!pkg/state/graph_decode_unsafe.go' ':!pkg/state/tests/bench_test.go' ':!test/benchmarks/checkpointfile/checkpointfile.go'
        git diff --exit-code "$STOCK" "$FIXED" -- runsc/container/BUILD runsc/container/container_save_restore_test.go pkg/state/tests/bench_test.go test/benchmarks/checkpointfile/checkpointfile.go
        before=$(git diff -U0 "$BASE" "$PRODUCT" | git patch-id --stable)
        after=$(git diff -U0 "$STOCK" "$FIXED" | git patch-id --stable)
        test -n "$before" && test "$before" = "$after"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /var/run/docker.sock:/var/run/docker.sock -v "$(command -v docker):/usr/local/bin/docker:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Preserve comparison driver outside the selected trees
      run: |
        mkdir -p "$RUNNER_TEMP/pair/records"
        cp test/rbe/tmpfs_profile/pair-{run,bench}.py "$RUNNER_TEMP/pair/"
    - name: Verify both state test suites and graph object resolution cases
      id: positive
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" positive
    - name: Run both state suites with the race detector
      id: race
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" race
    - name: Check the four owning analyzers for both target architectures
      id: analyzers
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" analyzers
    - name: Build the two existing benchmark binaries
      id: compiled
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" prepare
    - name: Compare ordinary fresh startup and initializer allocation
      id: startup
      if: ${{ !cancelled() && steps.compiled.outcome == 'success' }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" startup
    - name: Check the original three warm pool controls before native comparisons
      id: small
      if: ${{ !cancelled() && steps.compiled.outcome == 'success' }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" small
    - name: Check callback pool admission and latency at 1025, 8192 and 8193 records
      id: boundary
      if: ${{ !cancelled() && steps.compiled.outcome == 'success' }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" boundary
    - name: Compare native systrap restores and verify 50,000 files
      id: live
      if: ${{ !cancelled() && steps.positive.outcome == 'success' && steps.small.outcome == 'success' && steps.boundary.outcome == 'success' }}
      timeout-minutes: 29
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" native
    - name: Compare sixteen paired GC-on and GC-off loads on one frozen checkpoint
      id: bench
      if: ${{ !cancelled() && steps.live.outcome == 'success' }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" benchmark
    - name: Observe actual callback capacity and pool admission on the same frozen kernel
      id: capacity
      if: ${{ !cancelled() && steps.bench.outcome == 'success' }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" capacity
    - name: Compare elapsed time, CPU and allocations with pinned benchstat
      id: comparison
      if: ${{ !cancelled() && steps.bench.outcome == 'success' && steps.live.outcome == 'success' }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" stats
    - name: Record the qualification verdict
      if: always()
      env:
        STEP_RESULTS: ${{ toJSON(steps) }}
      run: |
        python3 - <<'PYTHON'
        import json, os, pathlib, time
        folder = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pair" / "records"
        folder.mkdir(parents=True, exist_ok=True)
        phases = json.loads(os.environ["STEP_RESULTS"])
        expected = ["positive", "race", "analyzers", "compiled", "startup", "small", "boundary", "live", "bench", "capacity", "comparison"]
        outcomes = {key: phases.get(key, {}).get("outcome", "missing") for key in expected}
        required = ["fixed-race-suites.json", "startup.json", "startup-init.json", "startup-finished.json", "analyzers.json", "fixed-suites.json", "source.json", "bench-finished.json", "benchstat.txt", "small-finished.json", "boundary-rows.json", "capacity.json", "live-07-stock.json", "live-07-fixed.json"]
        missing = [name for name in required if not (folder / name).is_file()]
        passed = all(status == "success" for status in outcomes.values()) and not missing
        small_path = folder / "small-gate.json"
        slowdowns = {k: v for k, v in json.loads(small_path.read_text()).items() if v["material"]} if small_path.is_file() else None
        verdict = {"pass": passed, "material_small_slowdown": slowdowns, "baseline": os.environ["BASE"], "candidate": os.environ["PRODUCT"], "phases": outcomes, "missing": missing, "verifiedAtNs": time.time_ns()}
        (folder / "verdict.json").write_text(json.dumps(verdict, indent=2) + "\n")
        print(verdict)
        raise SystemExit(0 if passed else 1)
        PYTHON
    - name: Validate the public artifact boundary
      id: artifact_safe
      if: always()
      env:
        CHECK_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os, pathlib
        directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pair" / "records"
        key = os.environ["CHECK_KEY"].encode()
        assert directory.is_dir() and key
        for path in directory.iterdir():
            assert path.is_file() and not path.is_symlink()
            data = path.read_bytes()
            assert key not in data and b"x-buildbuddy-api-key=" not in data.lower(), path.name
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.artifact_safe.outcome == 'success' }}
      with:
        name: tmpfs-callback-reservation-final
        path: ${{ runner.temp }}/pair/records/
        if-no-files-found: error
