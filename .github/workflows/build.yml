name: Complete the checkpoint writer race qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/checkpoint-writer-race'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 5
        persist-credentials: false
    - name: Preserve five verified original results
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        gh api repos/tamird/gvisor/actions/artifacts/13054071409/zip > original.zip
        unzip -q original.zip -d original
        mkdir -p replay-public
        python3 - <<'PYVERIFY'
        from pathlib import Path
        import json, shutil
        sources = {'stock': '9a5cea57b07bb1a02fbf1fc30522f8cf4e52cb96', 'package': '04c66b4d86260991e49c97c7461a04f5f479c823', 'analyzers': '04c66b4d86260991e49c97c7461a04f5f479c823', 'kernel-stock': '0454c864d6b00ad431d3241c314908691d6ee0c3', 'kernel': '0a195dc3afc5a647153c68ba038cf649a1dfd559'}
        for arm, source in sources.items():
            p=Path('original')/(arm+'.json')
            v=json.loads(p.read_text())
            assert v['arm']==arm and v['source']==source and v['verified'] and not v['verification_errors'] and not v['missing'] and not v['errors'], arm
            shutil.copyfile(p, Path('replay-public')/p.name)
        PYVERIFY
    - name: Run the one remaining race suite
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD^1)" = "9b27568f9b371b0b1dde5da1c091584d2be98db6"
        mkdir -p "$RUNNER_TEMP/checker"
        for file in qualify.sh unit_matrix.py qualification_report.py tcp_long_replay.py; do
          cp "test/rbe/$file" "$RUNNER_TEMP/checker/$file"
        done
        python3 -m py_compile "$RUNNER_TEMP/checker/"*.py
        mkdir -p "$RUNNER_TEMP/fifo_platform" "$RUNNER_TEMP/fifo"
        GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
        platform=$RUNNER_TEMP/fifo_platform
        printf '%s\n' 'module(name="tcp_gnu")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "gnu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "firecracker",
                "EstimatedMemory": "4GB",
                "container-image": "docker://gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/fifo.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
            'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
            'build --remote_accept_cached' \
            "build --inject_repository=tcp_gnu=$platform" \
            'build --host_platform=@tcp_gnu//:gnu' \
            'build --extra_execution_platforms=@tcp_gnu//:gnu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        printf '%s\n' 'build:rbe --spawn_strategy=remote' >> "$rc"
        # Configure Bazel's host toolchain against the same compiler and libc
        # available to build actions. Tests still select the Firecracker image
        # with iptables through their target's execution properties.
        export TCP_BAZEL_ROOT="$HOME/.cache/bazel/_bazel_runner"
        mkdir -p "$TCP_BAZEL_ROOT"
        docker pull --platform linux/amd64 "$GNU"
        docker run -d --name tcp-gnu --entrypoint /bin/bash --user "$(id -u):$(id -g)" \
          -e "HOME=$HOME" -e "USER=$USER" -v "$HOME/.cache/bazel:$HOME/.cache/bazel" \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
          -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-gnu x86_64-linux-gnu-gcc -dumpfullversion
        docker exec tcp-gnu aarch64-linux-gnu-gcc -dumpfullversion
        docker exec tcp-gnu bazel --version
        export FIFO_RC=$rc
        mkdir -p "$RUNNER_TEMP/fifo-bin"
        cat > "$RUNNER_TEMP/fifo-bin/bazel" <<'SH'
        #!/bin/sh
        case "$1" in
          test)
            # Capture the actual argv and Bazel exit, independent of the qualifier's exit.
            printf '%s\n' "$@" > "$TCP_EVIDENCE/executed_arguments"
            status=0
            docker exec tcp-gnu bazel --output_user_root="$TCP_BAZEL_ROOT" --bazelrc="$FIFO_RC" "$@" || status=$?
            printf '%s\n' "$status" > "$TCP_EVIDENCE/native_exit"
            date -u '+%Y-%m-%dT%H:%M:%S.%3N+00:00' > "$TCP_EVIDENCE/finished"
            exit "$status"
            ;;
        esac
        exec docker exec tcp-gnu bazel --output_user_root="$TCP_BAZEL_ROOT" --bazelrc="$FIFO_RC" "$@"
        SH
        chmod +x "$RUNNER_TEMP/fifo-bin/bazel"
        export PATH="$RUNNER_TEMP/fifo-bin:$PATH"
        overall=0
        mkdir -p "$RUNNER_TEMP/replay-private" "$RUNNER_TEMP/replay-public"
        for arm in race; do
          case $arm in
            stock) source=9a5cea57b07bb1a02fbf1fc30522f8cf4e52cb96; parent=aa767e4c43d011121271551fe24da501a56f729d ;;
            kernel-stock) source=0454c864d6b00ad431d3241c314908691d6ee0c3; parent=aa767e4c43d011121271551fe24da501a56f729d ;;
            kernel) source=0a195dc3afc5a647153c68ba038cf649a1dfd559; parent=04c66b4d86260991e49c97c7461a04f5f479c823 ;;
            *) source=04c66b4d86260991e49c97c7461a04f5f479c823; parent=aa767e4c43d011121271551fe24da501a56f729d ;;
          esac
          if ! git cat-file -e "$source^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=2 "https://github.com/$GITHUB_REPOSITORY.git" "$source"
          fi
          git checkout --quiet --detach "$source"
          test "$(git rev-parse HEAD)" = "$source"
          # Verify the recorded parent even if the source is a shallow boundary.
          test "$(git cat-file commit HEAD | awk 'NF == 0 {exit} $1 == "parent" {print $2}')" = "$parent"
          export TCP_EVIDENCE="$RUNNER_TEMP/replay-private/$arm"
          mkdir -p "$TCP_EVIDENCE" test/rbe
          cp "$RUNNER_TEMP/checker/qualify.sh" "$RUNNER_TEMP/checker/unit_matrix.py" test/rbe/
          git status --porcelain --untracked-files=no > "$TCP_EVIDENCE/source_before"
          test ! -s "$TCP_EVIDENCE/source_before"
          git cat-file commit HEAD > "$TCP_EVIDENCE/commit_file"
          raw="$RUNNER_TEMP/replay-private/$arm.raw.jsonl"
          code=0
          opts=()
          case $arm in
            stock) labels=(//pkg/sentry/pgalloc:pgalloc_test); opts+=(--bazel-option=--test_filter=^TestSaveToAfterPageWriteError --bazel-option=--test_arg=-test.v) ;;
            kernel|kernel-stock) labels=(//pkg/sentry/kernel:kernel_test); opts+=(--bazel-option=--test_filter=^TestKernelCheckpointReportsFullDevice --bazel-option=--test_arg=-test.v) ;;
            race) labels=(//pkg/sentry/pgalloc:pgalloc_test); opts+=(--bazel-option=--config=race --bazel-option=--test_arg=-test.v) ;;
            package) labels=(//pkg/sentry/pgalloc:pgalloc_test); opts+=(--bazel-option=--test_arg=-test.v) ;;
            analyzers) labels=(//pkg/sentry/pgalloc:pgalloc_nogo //pkg/sentry/pgalloc:pgalloc_test_nogo) ;;
          esac
          selection=()
          for target in "${labels[@]}"; do selection+=("--test-target=$target"); done
          bash test/rbe/qualify.sh --arch=amd64 "${selection[@]}" "${opts[@]}" \
            "--bazel-option=--build_event_json_file=$raw" --bazel-option=--build_event_json_file_path_conversion=false \
            --bazel-option=--test_sharding_strategy=disabled --bazel-option=--cache_test_results=no \
            --bazel-option=--remote_download_outputs=toplevel test || code=$?
          printf '%s\n' "$code" > "$TCP_EVIDENCE/runner_exit"
          git rev-parse HEAD > "$TCP_EVIDENCE/final_head"
          git status --porcelain --untracked-files=no > "$TCP_EVIDENCE/source_after"
          python3 -B "$RUNNER_TEMP/checker/tcp_long_replay.py" "$TCP_EVIDENCE" "$arm" "$source" "${labels[*]}" "$raw" "$RUNNER_TEMP/replay-public" || overall=1
        done
        python3 - "$RUNNER_TEMP/replay-public" <<'PYRESULT'
        import json, sys
        from pathlib import Path
        root = Path(sys.argv[1])
        arms = ["stock", "package", "analyzers", "kernel-stock", "kernel", "race"]
        verdicts = {a: json.loads((root / (a + ".json")).read_text()) for a in arms if (root / (a + ".json")).is_file()}
        missing = [a for a in arms if a not in verdicts]
        result = {"expected":arms,"executed":list(verdicts),"missing":missing,"status":"PASS" if not missing and all(v["verified"] for v in verdicts.values()) else "FAIL"}
        (root / "summary.json").write_text(json.dumps(result, indent=2) + "\n")
        print(result)
        sys.exit(result["status"] != "PASS")
        PYRESULT
        exit "$overall"
    - name: Save only the typed results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: checkpoint-writer-complete
        path: ${{ runner.temp }}/replay-public/*.json
        if-no-files-found: error
