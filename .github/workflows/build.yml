name: Check VFIO waiters and restore donated gofer devices
on:
  push:
    branches: [qualification/vfio-pci-waiter-checks]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/vfio-pci-waiter-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      NEW: d550413452ad4a9766d7eb67b6649be074ddd485
      OLD: 90284c851bbff0abe39233e260303bfb4f678978
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
        persist-credentials: false
    - name: Bind and retain the source, controls and verifier
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^) == "$NEW" ]]
        git fetch --depth=2 origin "$OLD"
        git fetch --depth=1 origin 35bbafd49355643b3d168adcec91ece2b34585a1
        mkdir -p "$RUNNER_TEMP"/{checker,gofer/normal,gofer/donor,focused}
        cp test/epoll_restore_probe/vfio_report.py "$RUNNER_TEMP/checker/"
        for name in qualify.py missing_donor.py; do git show FETCH_HEAD:test/epoll_restore_probe/"$name" > "$RUNNER_TEMP/checker/$name"; done
    - name: Restore the original gofer releases to a traversable installation
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        gh run download 40948851812 -R tamird/gvisor -n gofer-epoll-checkpoint -D original
        sudo install -d -m 0755 /opt/gofer-epoll
        sudo tar xzf original/runtime-recovery.tgz -C /opt/gofer-epoll
        for variant in stock fixed old-watch rejected-watch; do
          d="/opt/gofer-epoll/bundles/$variant"
          namei -l "$d/gvisor-bin/gvisor-sentry-prewarmer"
          find "$d" -type f -printf '%m %p\n' >> "$RUNNER_TEMP/gofer/original-modes.txt"
          sudo chmod a+rx /opt/gofer-epoll/bundles "$d" "$d/gvisor-bin" "$d/runsc" "$d/probe" "$d"/gvisor-bin/*
          sudo -u nobody test -x "$d/gvisor-bin/gvisor-sentry-prewarmer"
          sha256sum "$d/runsc" "$d"/gvisor-bin/* "$d/probe" | cut -d' ' -f1 | sort > "$RUNNER_TEMP/$variant.sha"
          cut -d' ' -f1 "original/$variant.sha256" | sort > "$RUNNER_TEMP/$variant.orig"
          cmp "$RUNNER_TEMP/$variant.sha" "$RUNNER_TEMP/$variant.orig"
        done
    - name: Run the native and directfs/lisafs controls with original binaries
      run: |
        b=/opt/gofer-epoll/bundles
        sudo python3 "$RUNNER_TEMP/checker/qualify.py" "$b/stock/probe" "$b/stock/runsc" "$b/fixed/runsc" "$RUNNER_TEMP/gofer/normal"
    - name: Run the donated-descriptor controls with original binaries
      if: ${{ !cancelled() }}
      run: |
        b=/opt/gofer-epoll/bundles
        sudo python3 "$RUNNER_TEMP/checker/missing_donor.py" "$b/old-watch/probe" "$b/old-watch/runsc" "$b/rejected-watch/runsc" "$RUNNER_TEMP/gofer/donor"
    - name: Compare live effects on the same worker platform
      if: ${{ !cancelled() }}
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        plat=$RUNNER_TEMP/poll-gnu-platform
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        cat >"$plat/BUILD" <<BUILD
        platform(
            name = "gnu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {"Arch":"amd64", "OSFamily":"linux", "workload-isolation-type":"firecracker", "container-image":"docker://$GNU"},
            visibility = ["//visibility:public"],
        )
        BUILD
        rc=$RUNNER_TEMP/poll-gnu.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=remote' "build --inject_repository=poll_gnu_platform=$plat" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$rc"
        unset BUILDBUDDY_API_KEY
        docker run --rm --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c '
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
          work=$1; old=$2; new=$3
          for lane in stock fixed race analyzers; do
            rev=$new; [[ $lane != stock ]] || rev=$old
            git checkout --quiet --detach "$rev"
            [[ $(git rev-parse HEAD) == "$rev" && -z $(git status --porcelain --untracked-files=no) ]]
            out="$work/focused/$lane"; mkdir -p "$out"
            args=(--test_arg=-test.v); targets=(//pkg/sentry/devices/tpuproxy/vfio:vfio_test)
            if [[ $lane == race ]]; then args+=(--config=race); fi
            if [[ $lane == analyzers ]]; then args=(); targets=(//pkg/sentry/devices/tpuproxy/vfio:vfio_nogo //pkg/sentry/devices/tpuproxy/vfio:vfio_test_nogo); fi
            code=0
            bazel --bazelrc="$work/poll-gnu.bazelrc" test --keep_going --config=x86_64 -c opt --test_timeout=300 --test_output=all --jobs=60 --nocache_test_results --modify_execution_info="^TestRunner$=+no-remote-cache" --remote_download_outputs=toplevel --remote_download_regex=".*[/]test[.](log|xml)$" --test_sharding_strategy=disabled --build_event_json_file="$out/events.jsonl" "${args[@]}" "${targets[@]}" >"$out/bazel.log" 2>&1 || code=$?
            for t in "${targets[@]}"; do python3 -B "$work/checker/vfio_report.py" "$out" "$t" "$rev" "$lane" "$code"; done
          done
        ' _ "$RUNNER_TEMP" "$OLD" "$NEW"
    - name: Verify the complete comparison
      if: always()
      shell: bash
      run: |
        python3 - "$RUNNER_TEMP/focused" <<'PYTHON'
        import json, pathlib, sys
        p=pathlib.Path(sys.argv[1]); rows=[json.loads(f.read_text()) for f in p.glob("*/*.json") if f.name not in ("events.jsonl",)]
        assert len(rows)==5, [(r["lane"],r["target"]) for r in rows]
        for r in rows:
            assert r["qualified"], r
            print(r["lane"],r["target"],r["invocation"],len(r["cases"]),r["status"])
        PYTHON
    - name: Preserve each original verdict
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pci-waiter-controls
        path: |
          ${{ runner.temp }}/gofer/**/*.json
          ${{ runner.temp }}/gofer/**/*.log
          ${{ runner.temp }}/gofer/**/*.txt
          ${{ runner.temp }}/focused/*/*.json
          ${{ runner.temp }}/focused/*/*.test.log
          ${{ runner.temp }}/focused/*/*.test.xml
        if-no-files-found: error
