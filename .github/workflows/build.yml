name: Qualify the ptrace group-stop correction on Linux
on:
  push:
    branches: [qualification/ptrace-attach-mode-owners]
permissions: {}
jobs:
  linux:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 152
    steps:
      - name: Bind the fixed runtime, tests and public dependency helpers
        shell: bash
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/netip-wildcard"
          mkdir -m 700 "$w" "$w/receipt"
          mkdir -p "$RUNNER_TEMP/recvbuf/dist"
          echo '{"verified":false,"stage":"setup"}' > "$w/receipt/result.json"
          candidate=71bdb92251810c03229d67d0e3bdf2a9c9cba9d2
          prep=1dd5c8738089670485a347cfb85dad07b92d0e0d
          assets=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
          inputs=c3569a60dc1836ac6fad05e86d7951866c796b4f
          native=885416118fc84d4ec6ba1cb7629a4f4bd346e051
          git init -q .
          git fetch -q --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$prep" "$assets" "$inputs" "$native"
          git checkout -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git rev-parse "$candidate^{tree}")" = 6e8dac8f1f5e89ef7fe8a93c409e0e77b1cb9896
          test "$(git rev-parse "$candidate^")" = dd49ce763bea6f5b38eff62f2ca586b6a22c4a9f
          git diff --exit-code "$candidate" HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/ptrace_owners.py' ':!test/qualify-corrected-debugger'
          git show "$GITHUB_SHA:.github/qualification/ptrace_owners.py" > "$w/check.py"
          git show "$native:.github/qualification/netip_wildcard.py" > "$w/native.py"
          git show "$prep:.github/qualification/go_branch_netgofer.py" > "$w/previous.py"
          git show "$assets:.github/qualification/recvbuf_deps.py" > "$w/public_assets.py"
          git show "$inputs:.github/qualification/tldk_public_inputs.py" > "$w/tldk_public_inputs.py"
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $w/bazel" | sha256sum -c
          chmod +x "$w/bazel"
          for suite in jammy jammy-updates; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu $suite main universe"
          done > "$w/jammy.list"
          opts=(-o "Dir::Etc::sourcelist=$w/jammy.list" -o Dir::Etc::sourceparts=-)
          sudo -n apt-get "${opts[@]}" update -qq
          sudo -n apt-get "${opts[@]}" install -qq -y --no-install-recommends g++-aarch64-linux-gnu libnuma-dev
          for item in sudo@sha256:b3d0b74c37eeec266b9bd38a9b8311287fdf3db5cefa7afc1e3efe9005f366a5 gdb@sha256:7ba36a4fbb5a32c2c33bc7b77baedc231173db1216a6c60dc7cb18f679a92b0a; do
            name="${item%@*}"
            uri="us-central1-docker.pkg.dev/gvisor-presubmit/gvisor-presubmit-images/basic/${name}_x86_64@${item#*@}"
            docker pull --platform=linux/amd64 "$uri"
            docker tag "$uri" "gvisor.dev/images/basic/$name"
          done
      - name: Check both attach modes and the upstream sudo and debugger owners
        timeout-minutes: 138
        shell: bash
        run: |
          env -i HOME="$HOME" USER="$USER" PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$RUNNER_TEMP/netip-wildcard/check.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !cancelled()
        with:
          name: ptrace-group-stop-owner-results
          path: ${{ runner.temp }}/netip-wildcard/receipt/
          if-no-files-found: error
          retention-days: 14
