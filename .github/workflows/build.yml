name: Read original overlay race test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/overlay-overlap-race-original'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Read the existing target's validated log and XML
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 test/rbe/overlay_race_original.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: overlay-overlap-race-original
        path: ${{ runner.temp }}/overlay-race-original.json
        if-no-files-found: error
