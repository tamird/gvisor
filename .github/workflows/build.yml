name: Check committed allocation and recycled-page clearing on native Linux
on:
  push:
    branches: [qualification/pgalloc-after-disk-zero]
permissions: {contents: read}
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Check the two allocation paths and collect alternating benchmark samples
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pgalloc-review"
          mkdir -p "$work/results"
          cp .github/qualification/pgalloc/{check.py,recycled_benchmark.go} "$work/"
          test "$(git rev-parse HEAD^)" = 61470ea4162137e6871edd94e369f1c03592c163
          test "$(git rev-parse HEAD^^)" = 70008149cff7b8d3b858877ae9c359b9046d19c5
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/pgalloc/check.py' ':!.github/qualification/pgalloc/recycled_benchmark.go'
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$work/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $work/bazel" | sha256sum -c -
          chmod 755 "$work/bazel"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -IB "$work/check.py"
      - name: Compare the complete original benchmark samples
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pgalloc-review/results"
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e 70008149c 61470ea41 | tee benchstat.txt
          grep -Fq 'sec/op' benchstat.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: allocator-cases-and-recycled-benchstat
          path: |
            ${{ runner.temp }}/pgalloc-review/results/results.json
            ${{ runner.temp }}/pgalloc-review/results/70008149c
            ${{ runner.temp }}/pgalloc-review/results/61470ea41
            ${{ runner.temp }}/pgalloc-review/results/benchstat.txt
          if-no-files-found: error
          retention-days: 30
