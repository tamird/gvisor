name: Qualify the root-only Linux header default
on:
  push:
    branches: [qualification/kernel-header-root-policy]
permissions:
  contents: read
  actions: read
jobs:
  queries:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 5, persist-credentials: false}
      - name: Prepare the existing diagnostic reader and original query receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          d="$RUNNER_TEMP/header-policy"
          mkdir -p "$d"
          cp test/rbe/header_root_policy.py "$d/"
          echo '{"verdict":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/header-policy.json"
          curl --retry 3 -fsSL https://raw.githubusercontent.com/tamird/gvisor/56ed4a613a3f82c5005718e4404a5393647aba06/.github/qualification/lint-pilot/check.py -o "$d/check.py"
          curl --retry 3 -fsSL https://raw.githubusercontent.com/tamird/gvisor/b068472ea88909183902fc4bf12dac266f39d34d/test/rbe/external_go_policy.py -o "$d/external_go_policy.py"
          test "$(git rev-parse HEAD~3)" = 48428434392bfa3b1a1ce9fb50ca404b38f21b73
          git fetch --depth=1 https://github.com/tamird/gvisor.git d85bc40fda9451667fb01002c577d62ed8308b59
          gh api repos/tamird/gvisor/actions/artifacts/13125283113/zip > "$d/original.zip" || true
      - name: Verify diagnostic-only import and reconcile the original three queries
        run: env -u LINT_RC python3 -B "$RUNNER_TEMP/header-policy/header_root_policy.py" --reconcile "$RUNNER_TEMP/header-policy/original.zip"
      - name: Check the single compact report
        id: privacy
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "header-policy.json"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size < 65536
          data = p.read_bytes()
          assert all(s not in data.lower() for s in (b"x-buildbuddy-api-key", b"authorization:", b"bearer "))
          assert isinstance(json.loads(data), dict)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: header-policy
          path: ${{ runner.temp }}/header-policy.json
          if-no-files-found: error
