name: Verify toolchain libraries on freestanding and hosted Linux links
on:
  push:
    branches: [qualification/native-sidecars-empty-worker]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Check out the reviewed Linux link rule and its real e2e test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tamird/hermetic-llvm
          ref: 321ef8af9d59c2cce56e5f777bd1d7fc4859aac9
          fetch-depth: 2
          path: llvm
          persist-credentials: false
      - name: Compare the freestanding link and verify hosted and bootstrap defaults
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          test -n "$BUILDBUDDY_API_KEY"
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/sidecar.bazelrc"
          unset BUILDBUDDY_API_KEY
          cd llvm
          python3 ../test/rbe/native_sidecars/run.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-unwind-link
          path: ${{ runner.temp }}/sidecar-evidence
          if-no-files-found: error
