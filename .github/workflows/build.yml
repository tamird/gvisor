name: Check fdbased packet delivery and worker shutdown on native Linux
on:
  push:
    branches: [qualification/fdbased-native-worker-join]
permissions:
  contents: read
jobs:
  receive:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind the product and qualify the private network namespace
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = e5f9acc7624cbb413011c854b5f65db67121678d
          test "$(git rev-parse HEAD^^)" = 4e0324239c7e64cb4d1cb12e804603aa85a963f3
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/fdbased_wait.py' ':!pkg/tcpip/link/fdbased/BUILD' ':!pkg/tcpip/link/fdbased/packet_ring_linux_test.go'
          git fetch --quiet --no-tags --depth=2 https://github.com/tamird/gvisor.git 39d28d4ef5d4a11aa5f8756d62bf99e1cd02816d
          test "$(uname -m)" = x86_64
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/bazel" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bazel"
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo
          echo 'namespace=/usr/bin/unshare --user --map-root-user --net --' >> "$GITHUB_ENV"
      - name: Compare named packet cases and the worker join
        run: python3 .github/qualification/fdbased_wait.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: fdbased-worker-join
          path: ${{ runner.temp }}/fdbased-results/
          if-no-files-found: warn
          retention-days: 7
