name: Recover six native-test receipts
on:
  push:
    branches: [qualification/pr15370-read-original-native-results]
permissions: {}
jobs:
  readback:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify the recorded test actions and XML
        shell: python
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          from urllib.parse import urlencode
          from urllib.request import Request, HTTPRedirectHandler, build_opener
          import xml.etree.ElementTree as ET

          INVOCATION = "9f7f4c12-44cd-4135-9d7d-5b80f8ac1b1b"
          HOST = "https://app.buildbuddy.io"
          OUT = Path(os.environ["RUNNER_TEMP"]) / "receipts"
          OUT.mkdir(exist_ok=True)
          key = os.environ.pop("BUILDBUDDY_API_KEY")


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None


          opener = build_opener(NoRedirect)
          def fetch(path, payload=None):
              headers = {"x-buildbuddy-api-key": key}
              body = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  body = json.dumps(payload).encode()
              request = Request(HOST + path, data=body, headers=headers)
              with opener.open(request, timeout=90) as response:
                  return response.read()


          def field(obj, snake, camel):
              return obj.get(snake, obj.get(camel, []))


          def artifacts(label):
              data = json.loads(fetch("/rpc/BuildBuddyService/GetTarget", {
                  "invocation_id": INVOCATION, "target_label": label,
              }))
              for group in field(data, "target_groups", "targetGroups"):
                  for target in group.get("targets", []):
                      if target.get("metadata", {}).get("label") != label:
                          continue
                      for event in field(target, "test_result_events", "testResultEvents"):
                          result = field(event, "test_result", "testResult")
                          if not isinstance(result, dict):
                              continue
                          if result.get("status") not in ("PASSED", 1):
                              raise ValueError(f"{label}: unexpected test status {result.get('status')}")
                          return {f["name"]: f for f in field(result, "test_action_output", "testActionOutput")}
              raise ValueError(f"{label}: no matching test result in GetTarget")


          def read_file(item):
              if item.get("contents"):
                  return base64.b64decode(item["contents"])
              uri = item["uri"]
              query = urlencode({"bytestream_url": uri, "invocation_id": INVOCATION})
              body = fetch("/file/download?" + query)
              digest, size = uri.rsplit("/", 2)[1:]
              if hashlib.sha256(body).hexdigest() != digest or len(body) != int(size):
                  raise ValueError("Original CAS digest or size differs")
              return body


          def recover(label, machine=None):
              files = artifacts(label)
              receipt = {"label": label, "invocation": INVOCATION, "status": "PASSED"}
              if machine:
                  log = read_file(files["test.log"])
                  # Match the explicit run_under marker, independently of the test label.
                  workers = set(re.findall(rb"^NATIVE_TEST_WORKER=(\S+)\s*$", log, re.M))
                  if workers != {machine.encode()}:
                      raise ValueError(f"{label}: expected {machine}, observed {workers}")
                  xml = read_file(files["test.xml"])
                  cases = list(ET.fromstring(xml).iter("testcase"))
                  focus = "TestOrUint32" if "atomicbitops" in label else "PosixError"
                  if not any(c.get("name") == focus for c in cases):
                      raise ValueError(f"{label}: missing {focus}")
                  if any(c.find(tag) is not None for c in cases for tag in ("failure", "error", "skipped")):
                      raise ValueError(f"{label}: unsuccessful case")
                  receipt.update(machine=machine, cases=len(cases), tested=focus,
                                 log_sha256=hashlib.sha256(log).hexdigest(),
                                 xml_sha256=hashlib.sha256(xml).hexdigest())
              print(json.dumps(receipt), flush=True)
              (OUT / (label.split(":")[-1] + ".json")).write_text(json.dumps(receipt, indent=2) + "\n")


          for cpu, machine in [("arm64", "aarch64"), ("amd64", "x86_64")]:
              recover("//pkg/atomicbitops:atomicbitops_test_" + cpu, machine)
              recover("//test/util:posix_error_test_" + cpu, machine)
          for name in ("verify_native_tests", "atomicbitops_test_nogo"):
              recover("//pkg/atomicbitops:" + name)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-native-test-receipts
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: warn
          retention-days: 14
