name: Run the real race smoke with one source and version
on:
  push:
    branches: [qualification/smoke-race-matched-make]
permissions:
  contents: read
jobs:
  make:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: 8c6ed7a88a418240a629c29a6e9bbe217491bbab
      GLIBC_TUNABLES: glibc.pthread.rseq=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Prepare the ordinary pinned GNU coordinator and its matching RBE worker
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCT" HEAD
          dest="$RUNNER_TEMP/race-make"
          mkdir -p "$dest/records" "$dest/platform" "$HOME/.cache"
          cp test/rbe/race-make-result.py "$dest/verify.py"
          git checkout --detach "$PRODUCT"
          git diff --quiet
          printf 'module(name="gnu_runtime")\n' > "$dest/platform/MODULE.bazel"
          printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$dest/platform/BUILD"
          docker pull --platform=linux/amd64 "$GNU"
          docker run -d --name smoke-compiler --user "$(id -u):$(id -g)" -e HOME="$HOME" -e USER="$USER" -e LOGNAME="$USER" -v "$HOME/.cache:$HOME/.cache" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$dest:$dest" -w "$GITHUB_WORKSPACE" --entrypoint /bin/bash "$GNU" -c 'sleep infinity'
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=gnu_runtime=$dest/platform" 'build --extra_execution_platforms=@gnu_runtime//:gnu' 'build --host_platform=@gnu_runtime//:gnu' 'build --jobs=48'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } | docker exec -i smoke-compiler sh -c 'umask 077; cat > /tmp/make-remote.bazelrc'
          unset BUILDBUDDY_API_KEY
          # The previous Make run stopped before Bazel opened its build event
          # file. Capture that exact client's startup and verify its user/home.
          docker exec smoke-compiler id -un > "$dest/initial-user.log" 2>&1 || true
          docker exec smoke-compiler bazel --bazelrc=/tmp/make-remote.bazelrc info release > "$dest/initial-client.log" 2>&1 || true
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          docker exec --user=root smoke-compiler bash -ceu '
            getent group "$2" >/dev/null || groupadd --gid "$2" smoke
            getent passwd "$1" >/dev/null || useradd --no-create-home --uid "$1" --gid "$2" --home-dir "$3" --shell /bin/bash smoke
            chown "$1:$2" "$3"
          ' _ "$runner_uid" "$runner_gid" "$HOME"
          docker exec smoke-compiler id -un
          docker exec smoke-compiler bazel --bazelrc=/tmp/make-remote.bazelrc info output_base > "$dest/ready-client.log" 2>&1 || {
            tail -35 "$dest/ready-client.log" | grep -Eiv 'api.?key|authorization|credential|remote_header|bes_header'
            exit 1
          }
          docker exec smoke-compiler gcc -dumpfullversion
          docker exec smoke-compiler bazel --version
          cat > "$dest/bazel" <<'SH'
          #!/bin/bash
          set -euo pipefail
          printf '%q ' "$@" >> "$RUNNER_TEMP/race-make/bazel-argv.log"
          printf '\n' >> "$RUNNER_TEMP/race-make/bazel-argv.log"
          args=("$@")
          if [[ "${args[0]}" == build ]]; then
            case "${args[${#args[@]}-1]}" in
              //:release) arm=release ;;
              //runsc:runsc-race) arm=race ;;
              *) echo "unexpected Make build target" >&2; exit 1 ;;
            esac
            args=(build "--build_event_json_file=$RUNNER_TEMP/race-make/$arm.bep" "${args[@]:1}")
          fi
          exec docker exec smoke-compiler bazel --bazelrc=/tmp/make-remote.bazelrc "${args[@]}"
          SH
          chmod 755 "$dest/bazel"
      - name: Build and stage both products with Make, then run its native rootless guest
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          test -z "${BUILDBUDDY_API_KEY:-}"
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare -Ur true
          dest="$RUNNER_TEMP/race-make"
          export RUNTIME_DIR="$dest/runtime"
          printf '%s\n' 'make smoke-race-tests BAZEL=<pinned GNU compiler coordinator>; DOCKER_BUILD=false; BAZEL_OPTIONS=--config=x86_64' > "$dest/command"
          date --utc --iso-8601=ns > "$dest/start"
          status=0
          timeout --kill-after=10s 70m make DOCKER_BUILD=false DOCKER_CLI_PATH=/bin/false BAZEL="$dest/bazel" BAZEL_OPTIONS=--config=x86_64 smoke-race-tests > "$dest/make.log" 2>&1 || status=$?
          date --utc --iso-8601=ns > "$dest/finish"
          python3 "$dest/verify.py" "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-matched-race-make
          path: ${{ runner.temp }}/race-make/records/result.json
          if-no-files-found: error
