name: Time the first guest command after restoring 50,000 files
on:
  push:
    branches: [qualification/state-queue-first-guest]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      QUEUE: 43820f1c39bbed4d99d7a12630e95e74e0f4b8b4
      CURRENT: ${{ github.sha }}
      BASE: 9f19447bdd727295bbaee1d8b198ae4e52a75ce5
      PRODUCT: 148b625b4bd27b81c63faa327e04435e5ce5e37d
      STOCK: 648edf16fc0fb8afa64f8eee101ea2dad9485652
      FIXED: 9770ef8767877466319ad5edde12ea26d13fe8aa
      HARNESS: 92f7f5e7830dfded8b7123e2cd6678807b2f86da
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 4, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD)" == "$CURRENT" ]]
        test "$(git rev-parse HEAD^)" = "$FIXED"
        test "$(git rev-parse "$FIXED^")" = "$STOCK"
        test "$(git rev-parse "$STOCK^")" = "$BASE"
        git fetch -q --depth=2 origin "$PRODUCT" "$QUEUE" "$HARNESS"
        test "$(git rev-parse "$PRODUCT^")" = "$BASE"
        test "$(git diff "$BASE" "$PRODUCT" | git patch-id --stable)" = "$(git diff "$QUEUE^" "$QUEUE" | git patch-id --stable)"
        diff <(git diff "$BASE" "$PRODUCT") <(git diff "$STOCK" "$FIXED")
        git diff --exit-code "$BASE" "$STOCK" -- . ':!runsc/container/BUILD' ':!runsc/container/container_save_restore_test.go'
        test "$(git rev-parse "$STOCK:runsc/container/container_save_restore_test.go")" = 6818655c7dd2c3a8b9b0557ba12112f1a18b5c73
        git diff --exit-code "$CURRENT" "$FIXED" -- . ':!.github/workflows/build.yml' ':!.github/qualification/state_guest_time.py'
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /var/run/docker.sock:/var/run/docker.sock -v "$(command -v docker):/usr/local/bin/docker:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Stage the paired fixture driver and verdict
      run: |
        mkdir -p "$RUNNER_TEMP/pair/records"
        git show "$HARNESS:test/rbe/tmpfs_profile/pair-run.py" > "$RUNNER_TEMP/pair/pair-run.py"
        cp .github/qualification/state_guest_time.py "$RUNNER_TEMP/pair/"
    - name: Warm each runtime and measure eight alternating pairs
      id: measure
      run: python3 "$RUNNER_TEMP/pair/state_guest_time.py" run
    - name: Verify every native guest result
      if: always()
      id: verdict
      env:
        RUN_OUTCOME: ${{ steps.measure.outcome }}
      run: python3 "$RUNNER_TEMP/pair/state_guest_time.py" verify
    - name: Compare all measured pairs with benchstat
      if: ${{ steps.verdict.outcome == 'success' }}
      run: python3 "$RUNNER_TEMP/pair/state_guest_time.py" stats
    - name: Check the public artifact boundary
      id: safe
      if: always()
      env:
        KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os, pathlib
        directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pair" / "records"
        key = os.environ["KEY"].encode()
        assert directory.is_dir() and key
        for f in directory.iterdir():
            assert f.is_file() and not f.is_symlink() and (f.suffix in {".json", ".xml", ".bench"} or f.name == "benchstat.txt")
            content = f.read_bytes()
            assert key not in content and not any(s in content.lower() for s in (b"x-buildbuddy-api-key", b"authorization:", b"begin private key"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.safe.outcome == 'success' }}
      with:
        name: state-queue-first-guest
        path: ${{ runner.temp }}/pair/records/
        if-no-files-found: error
