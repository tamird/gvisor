name: Qualify the standalone release input graph
"on":
  push:
    branches: [qualification/standalone-release-input-graph]
permissions: {}
jobs:
  graph:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    env:
      PRODUCT: 1ddee9fb4a6e2ae7bf346cef19d87f5a4b2c5ac5
      BASE: bb565d84650bd92fd525d05f934aeea8ac058dec
    steps:
      - name: Bind the original source, the native compiler pair and pinned Bazel
        id: setup
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/release-projection"
          mkdir -p "$w"/{src,public}
          cd "$w/src"
          git init -q
          git -c gc.auto=0 fetch -q --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          test "$(git rev-parse "$GITHUB_SHA^")" = "$PRODUCT"
          test "$(git rev-parse "$PRODUCT^")" = "$BASE"
          test "$(git diff --name-only "$PRODUCT" "$GITHUB_SHA")" = "$(printf '%s\n' .github/qualification/release_projection/{BUILD.fixture,boundary.bzl,observe.py,regular-input.patch} .github/workflows/build.yml)"
          git checkout -q --detach "$PRODUCT"
          for file in BUILD.fixture boundary.bzl observe.py regular-input.patch; do
            git show "$GITHUB_SHA:.github/qualification/release_projection/$file" > "$w/$file"
          done
          test "$(cat .bazelversion)" = 9.3.1
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential crossbuild-essential-arm64 libnuma-dev zstd
          curl -fsSL --retry 3 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel' | (cd "$w" && sha256sum -c)
          chmod 0755 "$w/bazel"
      - name: Inspect both configured production graphs and default files
        if: '!cancelled() && steps.setup.outcome == ''success'''
        run: |
          cd "$RUNNER_TEMP/release-projection/src"
          python3 -IB "$RUNNER_TEMP/release-projection/observe.py" graphs
      - name: Check both local Make entry points before signing
        if: '!cancelled() && steps.setup.outcome == ''success'''
        run: |
          cd "$RUNNER_TEMP/release-projection/src"
          python3 -IB "$RUNNER_TEMP/release-projection/observe.py" make
      - name: Compare the original and repaired local stagers on the same declared files
        if: '!cancelled() && steps.setup.outcome == ''success'''
        run: |
          cd "$RUNNER_TEMP/release-projection/src"
          python3 -IB "$RUNNER_TEMP/release-projection/observe.py" fixture
      - name: Archive bounded queried and measured results
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: standalone-release-inputs
          path: ${{ runner.temp }}/release-projection/public/*.json
          if-no-files-found: error
          retention-days: 14
