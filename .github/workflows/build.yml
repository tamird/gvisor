name: Verify the standalone release staging actions
"on":
  push:
    branches: [qualification/standalone-release-input-actions]
permissions: {}
jobs:
  actions:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PRODUCT: 3432ab9163bb0ce2046a991ccf547297b8426739
      BASE: bb565d84650bd92fd525d05f934aeea8ac058dec
    steps:
      - name: Bind the corrected source and the native GNU analysis environment
        id: setup
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/release-actions"
          mkdir -p "$w"/{src,public}
          cd "$w/src"
          git init -q
          git -c gc.auto=0 fetch -q --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          test "$(git rev-parse "$GITHUB_SHA^")" = "$PRODUCT"
          test "$(git rev-parse "$PRODUCT^")" = "$BASE"
          test "$(git rev-parse "$PRODUCT:tools/release/stage.go")" = ced30714042ac610e9d736448b278ca5991233e8
          test "$(git diff --name-only "$PRODUCT" "$GITHUB_SHA")" = "$(printf '%s\n' .github/qualification/release_projection_{actions.py,reference.json} .github/workflows/build.yml)"
          git checkout -q --detach "$PRODUCT"
          for f in release_projection_actions.py release_projection_reference.json; do
            git show "$GITHUB_SHA:.github/qualification/$f" > "$w/$f"
          done
          test "$(cat .bazelversion)" = 9.3.1
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential crossbuild-essential-arm64 libnuma-dev zstd
          curl -fsSL --retry 3 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel' | (cd "$w" && sha256sum -c)
          chmod 0755 "$w/bazel"
      - name: Inspect tagged release actions
        run: |
          cd "$RUNNER_TEMP/release-actions/src"
          python3 -IB "$RUNNER_TEMP/release-actions/release_projection_actions.py" tagged
      - name: Inspect untagged release actions independently
        if: '!cancelled() && steps.setup.outcome == ''success'''
        run: |
          cd "$RUNNER_TEMP/release-actions/src"
          python3 -IB "$RUNNER_TEMP/release-actions/release_projection_actions.py" empty
      - name: Retain the bounded configured action receipts
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: standalone-release-staging-actions
          path: ${{ runner.temp }}/release-actions/public/*.json
          if-no-files-found: error
          retention-days: 14
