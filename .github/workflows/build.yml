name: Separate PRR and RACK flight accounting during timeout recovery
on:
  push:
    branches: [qualification/rack-prr-rto-controls]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Compare the same timeout-control test on sender configurations
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^)" = 610df167b9d239a227dd4d220f6185b38518b05d
        git diff --quiet HEAD^ HEAD -- test/packetimpact pkg/tcpip/transport/tcp/test
        mkdir -p "$RUNNER_TEMP/fifo_platform" "$RUNNER_TEMP/fifo"
        platform=$RUNNER_TEMP/fifo_platform
        printf '%s\n' 'module(name="fifo_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/fifo.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=linux-sandbox' 'build --strategy=TestRunner=local' 'build --jobs=4' \
            'build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' \
            'build --remote_accept_cached' \
            "build --inject_repository=fifo_platform=$platform" \
            'build --host_platform=@fifo_platform//:ubuntu' \
            'build --extra_execution_platforms=@fifo_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        if ! command -v aarch64-linux-gnu-gcc >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        fi
        mkdir -p "$RUNNER_TEMP/retained-tail"
        out=$RUNNER_TEMP/retained-tail
        git rev-parse HEAD HEAD^ > "$out/source"
        uname -r > "$out/kernel"
        target=//pkg/tcpip/transport/tcp/test/e2e:tcp_rack_test
        src=pkg/tcpip/transport/tcp/snd.go
        rc_all=0
        for arm in neither accounting allowance both both-keep-threshold; do
          allowance=false; copies=false; keep=false
          case "$arm" in allowance|both|both-keep-threshold) allowance=true;; esac
          case "$arm" in accounting|both|both-keep-threshold) copies=true;; esac
          if test "$arm" = both-keep-threshold; then keep=true; fi
          git show "HEAD:$src" | sed -e "s/^const experimentAllowance = true$/const experimentAllowance = $allowance/" -e "s/^const experimentCopies = true$/const experimentCopies = $copies/" -e "s/^const experimentKeepRecoveryThreshold = false$/const experimentKeepRecoveryThreshold = $keep/" > "$src"
          grep -Fx "const experimentAllowance = $allowance" "$src"
          grep -Fx "const experimentCopies = $copies" "$src"
          grep -Fx "const experimentKeepRecoveryThreshold = $keep" "$src"
          dest=$out/$arm
          mkdir -p "$dest"
          sha256sum "$src" > "$dest/sender.sha256"
          git diff -- "$src" > "$dest/controls.diff"
          bep=$dest/events.jsonl
          code=0
          bazelisk --bazelrc="$rc" test --config=x86_64 --lockfile_mode=off --strategy=TestRunner=local --spawn_strategy=linux-sandbox \
            --jobs=4 --test_env=GO_TEST_WRAP_TESTV=1 --test_sharding_strategy=disabled --nocache_test_results \
            --test_filter='^TestRTOInterruptsSACKRecovery$' --test_timeout=75 --test_output=errors \
            "--build_event_json_file=$bep" --build_event_json_file_path_conversion=false "$target" > "$RUNNER_TEMP/$arm.log" 2>&1 || code=$?
          echo "$code" > "$dest/exit"
          logdir=bazel-testlogs/pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test
          for file in test.log test.xml; do
            if test -f "$logdir/$file"; then cp "$logdir/$file" "$dest/$file"; fi
          done
          if test -f "$dest/test.log"; then grep -E 'rto-(before|after)-cc|tcp_rack_test.go:416|--- (FAIL|PASS): TestRTOInterrupts' "$dest/test.log" | tail -8 || true; fi
          if ! jq -se '[.[]|select(.testResult!=null)|.testResult] | length == 1 and all(.[]; (.status=="PASSED" or .status=="FAILED") and (.cachedLocally!=true) and (.executionInfo.cachedRemotely!=true) and (.executionInfo.strategy | .=="local" or .=="standalone"))' "$bep" > /dev/null; then tail -20 "$RUNNER_TEMP/$arm.log"; rc_all=1; fi
          if ! test -s "$dest/test.xml" || ! grep -q 'RTOCONTROL phase=send-before' "$dest/test.log"; then rc_all=1; fi
          if ! test "$code" = 0; then rc_all=1; fi
        done
        exit "$rc_all"
    - name: Retain original test reports, socket traffic and sender state
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rack-prr-rto-controls
        path: ${{ runner.temp }}/retained-tail/
        if-no-files-found: error
