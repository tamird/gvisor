name: Check both native NVIDIA parsers with Bazel 9 and the declared LLVM
on:
  push:
    branches: [qualification/bazel9-892-native-parser]
permissions:
  contents: read
jobs:
  parser:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    env:
      PRODUCT: a899bf9086e0b4e17b4513fda40d48480dbc5a64
      OWNER: //tools/nvidia_driver_differ:driver_ast_parser_test
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 2, persist-credentials: false}
    - name: Prepare the released client and pinned GNU worker
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/parser"
        mkdir -p "$d/records" "$d/platform"
        echo '{"verdict":"INCOMPLETE","phase":"bootstrap","test_attempts":0}' > "$d/records/integration.json"
        test "$(git rev-parse HEAD^)" = "$PRODUCT"
        cp test/rbe/parser_integration.py "$d/"
        donor=d3cb77967238fb63b58a36950cc339b26d7653d3
        git fetch -q --no-tags --depth=1 origin "$donor"
        git show "$donor:test/rbe/parser_owner.py" > "$d/parser_owner.py"
        reporter=599cb05aecfb107e07f81b8591a009cb12d6ffa7
        git fetch -q --no-tags --depth=1 origin "$reporter"
        for mod in qualification_report unit_matrix; do
          git show "$reporter:test/rbe/$mod.py" > "$d/$mod.py"
        done
        git checkout --quiet --detach "$PRODUCT"
        git diff --exit-code HEAD --
        test "$(cat .bazelversion)" = 9.3.1
        curl --retry 3 -fsSL https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
        echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $d/bazel" | sha256sum -c -
        chmod +x "$d/bazel"
        printf '%s\n' 'module(name="tcp_gnu")' > "$d/platform/MODULE.bazel"
        cat > "$d/platform/BUILD" <<EOF
        package(default_visibility=["//visibility:public"])
        platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","EstimatedMemory":"8GB","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://$GNU"})
        EOF
        umask 077
        {
          echo 'build --remote_executor=grpcs://remote.buildbuddy.io --remote_cache=grpcs://remote.buildbuddy.io --bes_backend=grpcs://remote.buildbuddy.io --bes_results_url=https://app.buildbuddy.io/invocation/'
          echo "build --spawn_strategy=remote --noremote_local_fallback --inject_repository=tcp_gnu=$d/platform --extra_execution_platforms=@tcp_gnu//:gnu --host_platform=@tcp_gnu//:gnu"
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$d/bb.rc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run --init -d --name gnu --entrypoint /bin/bash --user root -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        test "$(docker exec gnu uname -m)" = x86_64
        test "$(docker exec gnu "$d/bazel" --version)" = 'bazel 9.3.1'
    - name: Check the configured backends and compilers and execute both native parser tests
      run: python3 -B "$RUNNER_TEMP/parser/parser_integration.py"
    - name: Check public evidence
      id: privacy
      if: always()
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import json, os
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"]) / "parser/records"
        key = os.environ["BUILDBUDDY_API_KEY"]
        assert key and {p.name for p in root.iterdir()} == {"integration.json"}
        p = root / "integration.json"
        assert p.is_file() and not p.is_symlink() and p.stat().st_size < 160000
        b = p.read_bytes()
        assert key.encode() not in b and json.dumps(key)[1:-1].encode() not in b and b"x-buildbuddy-api-key" not in b.lower()
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.privacy.outcome == 'success'
      with:
        name: bazel9-declared-llvm-two-backend-parser
        path: ${{ runner.temp }}/parser/records/integration.json
        if-no-files-found: error
