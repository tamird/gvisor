name: Verify master LLVM cross-compilation on one AMD64 worker
on:
  push:
    branches: [qualification/master-llvm-cross-probe]
permissions:
  contents: read
jobs:
  cross:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the original master source and the existing pinned Bazel client
        run: |
          set -eu
          umask 077
          p=90d4e2253f004cdc73a35dbc4050eab3e9a8495d
          test "$(git rev-parse HEAD^)" = "$p"
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/workflows/build.yml test/rbe/llvm_cross_probe.py)"
          d="$RUNNER_TEMP/llvm-cross"
          mkdir "$d"
          cp test/rbe/llvm_cross_probe.py "$d/probe.py"
          git checkout --quiet --detach "$p"
          git diff --exit-code HEAD --
          test "$(cat .bazelversion)" = '9.3.1'
          grep -Fx 'bazel_dep(name = "llvm", version = "0.8.24")' MODULE.bazel
          test "$(uname -m)" = x86_64
          curl --retry 3 --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          test "$("$d/bazel" --version)" = 'bazel 9.3.1'
      - name: Build both gVisor target platforms on this worker
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" USE_BAZEL_VERSION=9.3.1 python3 -B "$RUNNER_TEMP/llvm-cross/probe.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: master-llvm-cross
          path: ${{ runner.temp }}/llvm-cross/verdict.json
          if-no-files-found: error
