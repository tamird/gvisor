name: Check in-flight multicast writes and the corrected network test
on:
  push:
    branches: [qualification/java21-multicast-options]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: 972a7152fa77dc23d98e4cdd3f03a330e615c222
      NEGATIVE: 92d6ed260f3f41fa705c6eb14f86c17f7bdebd8a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD^1)" == "8d37c816182df7e0be0b30ff63d8ad397f0f3b52" ]]
        git fetch --no-tags --depth=2 origin "$NEGATIVE"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        git fetch --no-tags --depth=1 origin "$PRODUCT"
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt systempaths=unconfined -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Require the held writer to detect the in-place route mutation
      run: |
        set -euo pipefail
        for arm in negative fixed; do
          src=$NEGATIVE; [[ $arm != fixed ]] || src=$PRODUCT
          git checkout --quiet --detach "$src"
          d=$RUNNER_TEMP/records/$arm; mkdir -p "$d"; printf '%s\n' "$src" > "$d/source"
          rc=0
          docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --test_arg=-test.run=^TestMulticastLoopInFlightWrite$ --test_arg=-test.v --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' //pkg/tcpip/transport/internal/network:network_test > "$d/build.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$d/exit"
          docker exec tcp-compiler cat bazel-testlogs/pkg/tcpip/transport/internal/network/network_test/test.log > "$d/test.log" || true
          tail -50 "$d/build.log" > "$d/summary"; rm -f "$d/build.log"
        done
    - name: Run the full corrected network test suite and analyze the current test source
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$PRODUCT"
        d=$RUNNER_TEMP/records/network; mkdir -p "$d"; printf '%s\n' "$PRODUCT" > "$d/source"
        targets=(//pkg/tcpip/transport/internal/network:network_test //pkg/tcpip/transport/internal/network:network_test_nogo)
        printf '%s\n' "${targets[@]}" > "$d/targets"
        rc=0
        docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=8 --local_resources=cpu=2 --strategy=GoStaticAnalysis=local --strategy=GoStandardLibraryAnalysis=local --keep_going --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' "--build_event_json_file=$d/tests.bep" --nobuild_event_json_file_path_conversion "${targets[@]}" > "$d/build.log" 2>&1 || rc=$?
        printf '%s\n' "$rc" > "$d/exit"
        python3 - "$d" <<'PY'
        import json,sys
        from pathlib import Path
        d=Path(sys.argv[1]); f=d/'tests.bep'
        if f.exists():
          statuses={row['id']['testSummary']['label']:row['testSummary']['overallStatus'] for row in map(json.loads,f.open()) if 'testSummary' in row}
          (d/'results.json').write_text(json.dumps(statuses,indent=2))
          f.unlink()
        PY
        grep -A4 -E 'Invocation ID:|ERROR:|error:|FAILED|PASSED|Build completed|Build did NOT' "$d/build.log" | tail -100 > "$d/summary" || true
        rm -f "$d/build.log"
    - name: Verify the actual test was reached in both variants, plus all corrected owners
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/records"
        grep -F -- '--- FAIL: TestMulticastLoopInFlightWrite' "$d/negative/test.log"
        grep -F -- 'outgoing multicast loop = false, want true' "$d/negative/test.log"
        [[ $(cat "$d/negative/exit") == 3 ]]
        grep -F -- '--- PASS: TestMulticastLoopInFlightWrite' "$d/fixed/test.log"
        [[ $(cat "$d/fixed/exit") == 0 && $(cat "$d/network/exit") == 0 ]]
        python3 - "$d/network" <<'PY'
        import json,sys
        from pathlib import Path
        d=Path(sys.argv[1]); t=json.loads((d/'results.json').read_text())
        assert set(t)==set((d/'targets').read_text().splitlines()) and set(t.values())=={"PASSED"},t
        PY
    - name: Redact credentials from the evidence bundle
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key=os.environ["BB_KEY"].encode()
        for f in (Path(os.environ["RUNNER_TEMP"])/"records").rglob("*"):
            if f.is_file() and key and key in (data:=f.read_bytes()):
                f.write_bytes(data.replace(key,b"[REDACTED]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: multicast-writer-recovery
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
