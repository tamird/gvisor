name: Verify host Unix poll failure rollback
on:
  push:
    branches: [qualification/unix-host-poll-rollback]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/unix-host-poll-rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      NEW: 6ac36a7fd3ef4d93487a6e450212a530f7f0a7d5
      OLD: 4870df55da4f6dc9e9fcddb5bc43ecdaf5be433d
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
        persist-credentials: false
    - name: Bind product, paired baseline and fixtures
      shell: bash
      run: |
        set -euo pipefail
        git fetch --depth=3 origin "$OLD"
        [[ $(git rev-parse HEAD^) == "$NEW" && $(git rev-parse "$NEW^") == "$OLD" ]]
        [[ $(git rev-parse "$OLD:pkg/sentry/socket/unix/transport/host_test.go") == $(git rev-parse "$NEW:pkg/sentry/socket/unix/transport/host_test.go") ]]
        mkdir -p "$RUNNER_TEMP/checker" "$RUNNER_TEMP/focused"
        cp test/rbe/host_poll_report.py "$RUNNER_TEMP/checker/"
    - name: Compare live effects on the same worker platform
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        plat=$RUNNER_TEMP/poll-gnu-platform
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        cat >"$plat/BUILD" <<BUILD
        platform(
            name = "gnu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {"Arch":"amd64", "OSFamily":"linux", "workload-isolation-type":"firecracker", "container-image":"docker://$GNU"},
            visibility = ["//visibility:public"],
        )
        BUILD
        rc=$RUNNER_TEMP/poll-gnu.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=remote' "build --inject_repository=poll_gnu_platform=$plat" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$rc"
        unset BUILDBUDDY_API_KEY
        docker run --rm --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c '
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
          work=$1; old=$2; new=$3
          for lane in new old; do
            rev=$new
            [[ $lane != old ]] || rev=$old
            git checkout --quiet --detach "$rev"
            [[ $(git rev-parse HEAD) == "$rev" && -z $(git status --porcelain --untracked-files=no) ]]
            out="$work/focused/$lane"; mkdir -p "$out"
            targets=(//pkg/sentry/socket/unix/transport:transport_test)
            args=(); arch=x86_64
            code=0
            bazel --bazelrc="$work/poll-gnu.bazelrc" test --config="$arch" -c opt --test_timeout=300 --test_output=all --jobs=80 --nocache_test_results --modify_execution_info="^TestRunner$=+no-remote-cache" --remote_download_outputs=toplevel --remote_download_regex=".*[/]test[.](log|xml)$" --test_sharding_strategy=disabled --build_event_json_file="$out/events.jsonl" "${args[@]}" "${targets[@]}" >"$out/bazel.log" 2>&1 || code=$?
            for t in "${targets[@]}"; do python3 -B "$work/checker/host_poll_report.py" "$out" "$t" "$rev" "$lane" "$code"; done
            echo "$lane: Bazel $code"
          done
        ' _ "$RUNNER_TEMP" "$OLD" "$NEW"
    - name: Verify the complete comparison
      if: always()
      shell: bash
      run: |
        python3 - "$RUNNER_TEMP/focused" <<'PYTHON'
        import json, pathlib, sys
        p=pathlib.Path(sys.argv[1]); rows=[json.loads(f.read_text()) for f in p.glob("*/*.json") if f.name not in ("events.jsonl",)]
        assert len(rows)==2, [(r["lane"],r["target"]) for r in rows]
        for r in rows:
            assert r["qualified"], r
            print(r["lane"],r["target"],r["invocation"],len(r["cases"]),r["observations"])
        PYTHON
    - name: Preserve each original verdict
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: unix-host-poll-results
        path: ${{ runner.temp }}/focused/*/*.json
        if-no-files-found: error
