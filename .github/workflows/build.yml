name: Check the upstream runtime fix with both native RSEQ owners
on:
  workflow_dispatch:
permissions: {}
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.ref == 'refs/heads/qualification/rseq-llvm-runtime-fix' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Bind the exact integration and public tools
        timeout-minutes: 7
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/rseq-native"
          mkdir -p "$d/results"
          printf '{"verified":false,"stage":"setup"}\n' > "$d/results/setup.json"
          git init -q
          git fetch --no-tags --no-auto-maintenance --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git checkout --detach -q "$GITHUB_SHA"
          product=57c2b402bf5d7a55ca4c20896f5939e63d4a09aa
          base=739b91ea07daded9138c1969aad554960ac642e7
          test "$(git rev-parse HEAD^)" = "$product"
          test "$(git rev-parse "$product^")" = "$base"
          test "$(git rev-parse "$product^{tree}")" = fff4955ca09cc7cedc3dea3cdb5b9f494ebfc939
          test "$(git rev-parse HEAD:test/syscalls/linux/rseq/BUILD)" = ec1f7672f1f7b5b69af4a7cc5fc009c6bb33380d
          test "$(git rev-parse HEAD:test/syscalls/linux/rseq.cc)" = a40681b5098abc4bd0d5b591bff56dca6545bab7
          test "$(git rev-parse HEAD:test/syscalls/linux/rseq/rseq.cc)" = 7475dc22345d3d6afbe02a9d8cbbd77d20772c1e
          test "$(git rev-parse HEAD:test/syscalls/linux/rseq/start_arm64.S)" = 59b8ebda4f0fe3974d34308d4b9cc8ccbd20c3f5
          test "$(git rev-parse HEAD:test/syscalls/linux/rseq/start_amd64.S)" = 0a109b1e68db29c945d7cdc21c152689d817febd
          test "$(git rev-parse HEAD:tools/llvm-freestanding-runtimes.patch)" = 91d64b837b008fe3fc08d78ff0b417f4d6a4db59
          git diff --exit-code "$base" "$product" -- . ':!MODULE.bazel' ':!tools/BUILD' ':!tools/llvm-freestanding-runtimes.patch'
          git diff --exit-code "$product" HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/rseq_native.py' ':!.github/qualification/rseq_remote.sh'
          git fetch --no-tags --no-auto-maintenance --depth=1 https://github.com/tamird/gvisor.git fb9e7ad8abc8fa073045829dc856b9cde5a9c767
          test "$(git rev-parse fb9e7ad8a:.github/qualification/packet_family.py)" = 39182fb6a59c5e94d9d888fc6368a0d26da67689
          git show fb9e7ad8a:.github/qualification/packet_family.py > "$d/packet_family.py"
          diagnostic=269745e60be8c153015c3cb1fc1ea4b918a4e23d
          git fetch --no-tags --no-auto-maintenance --depth=1 https://github.com/tamird/gvisor.git "$diagnostic"
          test "$(git rev-parse "$diagnostic:.github/qualification/rseq_link_diag.py")" = 771e172fb9e26d22a615c6c9a6e65587f4b40f25
          git show "$diagnostic:.github/qualification/rseq_link_diag.py" > "$d/rseq_link_diag.py"
          cp .github/qualification/rseq_native.py .github/qualification/rseq_remote.sh "$d/"
          defaults=14c96d94e2e775381e765e270f485a158362504b
          helper=aebf85cb30b2c1ea959506ce5335016357367ebd
          assets=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
          git fetch --no-tags --no-auto-maintenance --depth=1 https://github.com/tamird/gvisor.git "$defaults" "$helper" "$assets"
          git show "$defaults:.github/qualification/packet_mime/bazel-9.3.1-inputs.json" > "$d/defaults.json"
          git show "$helper:.github/qualification/tldk_public_inputs.py" > "$d/tldk_public_inputs.py"
          git show "$assets:.github/qualification/recvbuf_deps.py" > "$d/public_assets.py"
          cd "$d"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel
          curl --proto '=https' --proto-redir '=https' -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 -o bb ||
            curl --proto '=https' --proto-redir '=https' -fsSL -H 'Accept: application/octet-stream' 'https://api.github.com/repos/buildbuddy-io/bazel/releases/assets/679595483' -o bb
          sha256sum -c <<'SUMS'
          7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel
          205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  bb
          SUMS
          chmod 700 bazel bb
          printf '{"source":"%s","verified":true}\n' "$product" > "$d/results/setup.json"
      - name: Preload checksum-verified public Bazel inputs
        timeout-minutes: 8
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rseq-native"
          env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -B - <<'PYTHON'
          import json
          from pathlib import Path
          import tldk_public_inputs as inputs
          root = Path.cwd()
          inputs.assets.DIST = root / "dist"
          inputs.assets.DIST.mkdir()
          rows = json.loads((root/"defaults.json").read_bytes())
          assert len(rows) == 27 and sum(row[4] for row in rows) == 45503548
          received, missing = [], []
          for directory, item in inputs.seed(rows):
              if directory is None:
                  missing.append(item["source"])
              else:
                  received.append(str(directory))
          (root/"distdirs.json").write_text(json.dumps(received))
          (root/"results"/"preload.json").write_text(json.dumps({"verified_distfiles":len(received),"unavailable":missing}))
          PYTHON
      - name: Run both native RSEQ syscall owners on their target CPUs
        timeout-minutes: 55
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bash "$RUNNER_TEMP/rseq-native/rseq_remote.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: rseq-corrected-native-syscalls
          path: ${{ runner.temp }}/rseq-native/results/
          retention-days: 14
