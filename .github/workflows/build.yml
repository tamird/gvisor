name: Build downstream AF_XDP with released LLVM and Gazelle
on:
  push:
    branches: [qualification/downstream-afxdp-llvm-827-gazelle-stock]
permissions:
  contents: read
jobs:
  downstream:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Build from the published source
        run: |
          set -euo pipefail
          area="$RUNNER_TEMP/downstream-bpf"
          mkdir -p "$area/receipts"
          cp .github/qualification/downstream-afxdp/{run.py,16804.patch,17555.patch} "$area/"
          git checkout --detach 5b433add43739d73d320b1dc029a5e5e26405ad7
          git apply --index "$area/16804.patch"
          cp "$area/16804.patch" "$area/17555.patch" "$area/receipts/"
          curl -fsSL --retry 3 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$area/bazelisk"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $area/bazelisk" | sha256sum -c -
          chmod +x "$area/bazelisk"
          python3 -B "$area/run.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: downstream-afxdp-llvm-827-gazelle-0513
          path: ${{ runner.temp }}/downstream-bpf/receipts
          if-no-files-found: error
          retention-days: 30
