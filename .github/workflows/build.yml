name: Assemble the exact array evidence without rerunning tests
on:
  push:
    branches: [qualification/array-remaining]
permissions: {contents: read, actions: read}
jobs:
  report:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: {SOURCE: f76d229c04d56c4a800f0e3561d36e75410f91a1}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false}
    - name: Authenticate the four original artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        proof="$RUNNER_TEMP/evidence"
        mkdir "$proof" "$RUNNER_TEMP/summary"
        for item in normal:12942087616 race:12942287938 arm:12943075303 original:12941388479; do
          arm=${item%:*}; id=${item#*:}
          dir="$proof/$arm"; mkdir "$dir"
          checksum=$(gh api "repos/tamird/gvisor/actions/artifacts/$id" --jq '.digest|ltrimstr("sha256:")')
          gh api "repos/tamird/gvisor/actions/artifacts/$id/zip" > "$dir.zip"
          printf '%s  %s\n' "$checksum" "$dir.zip" | sha256sum --check
          unzip -q "$dir.zip" -d "$dir"
          printf '%s %s %s\n' "$arm" "$id" "$checksum" >> "$RUNNER_TEMP/summary/origins.txt"
        done
    - name: Verify the retained XML and combine all 20 owners
      run: |
        set -euo pipefail
        proof="$RUNNER_TEMP/evidence"; summary="$RUNNER_TEMP/summary"
        for lane in normal race arm; do
          dir="$proof/$lane"
          python3 -B test/rbe/qualification_report.py verdict --context "$dir/context.json" --events "$dir/events.jsonl" --manifest "$dir/events.jsonl.manifest.json" --expected-targets "$dir/targets.txt" --output "$summary/$lane.json"
        done
        python3 - "$proof" "$summary" "$SOURCE" <<'PY'
        import json,pathlib,sys
        proof,summary=map(pathlib.Path,sys.argv[1:3]); source=sys.argv[3]
        result={}
        for lane in ("normal","race","amd64-check","arm64-check"):
            original=json.loads((proof/"original"/(lane+".json")).read_text())
            assert original["source"]==source
            labels=set(original["expected_labels"])
            if lane=="amd64-check":
                assert original["verified"] and not original["errors"] and not original["failures"] and not original["missing"]
                counts=original["case_counts"]
                result[lane]={"owners":len(labels),"reused":len(labels),"recovered":0,"cases":counts}
                continue
            new=json.loads((summary/({"arm64-check":"arm"}.get(lane,lane)+".json")).read_text())
            assert new["source"]==source and new["status"]=="PASS" and new["native_exit"]==0 and not (new["missing"] or new["failures"] or new["errors"])
            recovered=set(new["expected_labels"])
            reused={rec["owner"]["label"] for rec in original["executed"] if rec["owner"]["label"] not in recovered}
            assert labels==recovered|reused
            assert len(reused)==(0 if lane=="arm64-check" else 2)
            cases=new["case_counts"].copy()
            for k in cases:
                if k!="failed":cases[k]+=original["case_counts"][k]
            result[lane]={"owners":len(labels),"reused":len(reused),"recovered":len(recovered),"cases":cases}
        assert sum(x["owners"] for x in result.values())==20 and sum(x["reused"] for x in result.values())==11 and sum(x["recovered"] for x in result.values())==9
        report={"source":source,"status":"PASS","lanes":result,"failed":[],"missing":[]}
        print(json.dumps(report,indent=2))
        (summary/"summary.json").write_text(json.dumps(report,indent=2)+"\n")
        PY
    - if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: combined-array-qualified, path: '${{ runner.temp }}/summary'}
