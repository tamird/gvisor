name: Measure completion-queue reuse after callback coalescing
on:
  push:
    branches: [qualification/state-queue-after-callbacks]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: ${{ github.sha }}
      BASE: 9f19447bdd727295bbaee1d8b198ae4e52a75ce5
      PRODUCT: 148b625b4bd27b81c63faa327e04435e5ce5e37d
      STOCK: 9f19447bdd727295bbaee1d8b198ae4e52a75ce5
      FIXED: e054c806097d9eb6662cc137d17aa580e6ecbf43
      PROPOSAL: 148b625b4bd27b81c63faa327e04435e5ce5e37d
      HARNESS: 92f7f5e7830dfded8b7123e2cd6678807b2f86da
      QUEUE: 43820f1c39bbed4d99d7a12630e95e74e0f4b8b4
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 4, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD)" == "$CURRENT" ]]
        test "$(git rev-parse HEAD^)" = "$PRODUCT"
        test "$(git rev-parse HEAD~2)" = "$BASE"
        git diff --exit-code "$PRODUCT" "$CURRENT" -- . ':!.github/workflows/build.yml'
        git fetch -q --depth=2 origin "$HARNESS" "$QUEUE"
        queue_patch=$(git diff "$QUEUE^" "$QUEUE" | git patch-id --stable)
        test -n "$queue_patch"
        test "$(git diff "$BASE" "$PRODUCT" | git patch-id --stable)" = "$queue_patch"
        test "$(git rev-parse "$HARNESS^")" = "$FIXED"
        test "$(git rev-parse "$FIXED:runsc/container/container_save_restore_test.go")" = 6818655c7dd2c3a8b9b0557ba12112f1a18b5c73
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /var/run/docker.sock:/var/run/docker.sock -v "$(command -v docker):/usr/local/bin/docker:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Stage the comparison driver
      id: prep
      run: |
        mkdir -p "$RUNNER_TEMP/pair/records"
        for file in pair-run queue-profile queue-pairs; do
          git show "$HARNESS:test/rbe/tmpfs_profile/$file.py" > "$RUNNER_TEMP/pair/$file.py"
        done
    - name: Capture the 50000-file kernel once and verify the persisted guest tree
      id: capture
      run: python3 "$RUNNER_TEMP/pair/queue-profile.py" capture
    - name: Decode the same image in eight alternating pairs on one CPU
      id: compare
      run: python3 "$RUNNER_TEMP/pair/queue-pairs.py"
    - name: Record the verdict for both decoder revisions
      if: always()
      env:
        CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        COMPARE_OUTCOME: ${{ steps.compare.outcome }}
      run: |
        python3 - <<'PYTHON'
        import json, os, pathlib, time
        out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pair/records"
        out.mkdir(parents=True, exist_ok=True)
        path = out / "paired.json"
        pair = json.loads(path.read_text()) if path.exists() else {}
        pair.pop("prior_profile", None)
        if path.exists():
            path.write_text(json.dumps(pair, indent=2) + "\n")
        trials = [r for r in pair.get("attempts", []) if not r["warmup"] and r.get("rows")]
        actual = sorted((r["pair"], r["arm"]) for r in trials)
        expected = sorted((i, arm) for i in range(1, 9) for arm in ("stock", "fixed"))
        passed = (os.environ["COMPARE_OUTCOME"] == "success" and pair.get("status") == "PASS" and
                  actual == expected and pair.get("sources") == {"stock": os.environ["BASE"], "fixed": os.environ["PRODUCT"]})
        failed_commands = {}
        for log in out.glob("*-command.json"):
            code = json.loads(log.read_text())["exit"]
            if code:
                failed_commands[log.name] = code
        verdict = {"status": "PASS" if passed else ("FAIL" if failed_commands else "INCOMPLETE"),
                   "failed_commands": failed_commands, "capture_outcome": os.environ["CAPTURE_OUTCOME"],
                   "comparison_outcome": os.environ["COMPARE_OUTCOME"], "queue_pr": os.environ["QUEUE"],
                   "control": os.environ["BASE"], "combined": os.environ["PRODUCT"],
                   "benchmark": "//test/benchmarks/checkpointfile:checkpointfile_test (DecodeGC)",
                   "capture_source": os.environ["FIXED"], "expected_pairs": 8, "measured_decodes": len(actual),
                   "missing_measurements": sorted(set(expected) - set(actual)),
                   "last_decode_finished_ns": max((r["finished_ns"] for r in trials), default=None),
                   "verified_ns": time.time_ns()}
        (out / "verdict.json").write_text(json.dumps(verdict, indent=2) + "\n")
        if not passed:
            raise SystemExit(1)
        PYTHON
    - name: Check the public artifact boundary
      id: safe
      if: always()
      env:
        KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os, pathlib
        directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pair" / "records"
        key = os.environ["KEY"].encode()
        assert directory.is_dir() and key
        for f in directory.iterdir():
            assert f.is_file() and not f.is_symlink() and (f.suffix in {".json", ".xml", ".bench"} or f.name == "benchstat.txt")
            content = f.read_bytes()
            assert key not in content and not any(s in content.lower() for s in (b"x-buildbuddy-api-key", b"authorization:", b"begin private key"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.safe.outcome == 'success' }}
      with:
        name: completion-queue-after-callbacks
        path: ${{ runner.temp }}/pair/records/
        if-no-files-found: error
