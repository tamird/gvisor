name: Sparse shared MemoryFile checkpoint comparison
on:
  push:
    branches: [qualification/pgalloc-sparse-shared-checkpoint-20261110]
permissions: {}
jobs:
  checkpoint:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 155
    steps:
      - name: Pin the benchmark inputs and Bazel
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/pgalloc-sparse-checkpoint"
          mkdir -m 700 "$w" "$w/receipt"
          mkdir -p "$RUNNER_TEMP/recvbuf/dist"
          parent=6f44bed1a753f2f95337cb46ddde312737597d9e
          fixture=ad69e80bce8ca2540ac99dc128a18b5755698a11
          prep=1dd5c8738089670485a347cfb85dad07b92d0e0d
          assets=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
          inputs=c3569a60dc1836ac6fad05e86d7951866c796b4f
          reporter=2b51abee8530385431b7225198fdd5cd65e78696
          git init -q .
          git fetch -q --no-auto-maintenance --no-tags --depth=4 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$parent" "$prep" "$assets" "$inputs" "$reporter"
          test "$(git rev-parse "$GITHUB_SHA^")" = "$fixture"
          git diff --exit-code "$fixture" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!.github/qualification/pgalloc_sparse_checkpoint.py'
          git show "$GITHUB_SHA:.github/qualification/pgalloc_sparse_checkpoint.py" > "$w/check.py"
          git show "$prep:.github/qualification/go_branch_netgofer.py" > "$w/previous.py"
          git show "$assets:.github/qualification/recvbuf_deps.py" > "$w/public_assets.py"
          git show "$inputs:.github/qualification/tldk_public_inputs.py" > "$w/tldk_public_inputs.py"
          git show "$reporter:MODULE.bazel" > "$w/reporter-module"
          git checkout -q --detach "$fixture"
          test "$(cat .bazelversion)" = 9.3.1
          cd "$w"
          test "$(git hash-object --no-filters previous.py)" = 0c1db7071558c5f9c8de45b60ba625183bd8a400
          test "$(git hash-object --no-filters public_assets.py)" = 9a3f571087a1438113a3a067c300e26fcb0ca9e8
          test "$(git hash-object --no-filters tldk_public_inputs.py)" = 1f3f7d4d75810ad60941772776e01f3b71b3b171
          curl -qfsSL --retry 2 --max-time 120 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel' | sha256sum -c -
          chmod +x bazel
      - name: Run balanced native benchmarks and compare with benchstat
        timeout-minutes: 145
        run: |
          env -i HOME="$HOME" USER="$USER" PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" \
            python3 -B "$RUNNER_TEMP/pgalloc-sparse-checkpoint/check.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: sparse-shared-checkpoint-originals
          path: ${{ runner.temp }}/pgalloc-sparse-checkpoint/receipt
          if-no-files-found: error
          retention-days: 30
