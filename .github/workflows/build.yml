name: Verify primitive array storage with the graph decoder
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/state-primitive-signed-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 5
        persist-credentials: false
    - name: Qualify arrays on the signed-zero prerequisite
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^2)" = "f76d229c04d56c4a800f0e3561d36e75410f91a1"
        test "$(git rev-parse HEAD^2^)" = "40eb760888e9c00c8aaeeee71e42a4f91800734b"
        mkdir -p "$RUNNER_TEMP/checker"
        cp test/rbe/{unit_matrix,qualification_report,tcp_long_replay}.py "$RUNNER_TEMP/checker/"
        PYTHONPATH="$RUNNER_TEMP/checker" python3 -B -c 'import qualification_report'
        cp .github/qualification/array-check.sh "$RUNNER_TEMP/checker/"
        GNU="gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a"
        docker pull --platform=linux/amd64 "$GNU"
        plat=$RUNNER_TEMP/poll-gnu-platform
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        cat >"$plat/BUILD" <<BUILD
        platform(
            name = "gnu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {"Arch":"amd64", "OSFamily":"linux", "workload-isolation-type":"firecracker", "container-image":"docker://$GNU"},
            visibility = ["//visibility:public"],
        )
        BUILD
        rc=$RUNNER_TEMP/poll-gnu.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=remote' "build --inject_repository=poll_gnu_platform=$plat" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$rc"
        unset BUILDBUDDY_API_KEY
        docker run --rm --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" "$RUNNER_TEMP/checker/array-check.sh" "$RUNNER_TEMP" f76d229c04d56c4a800f0e3561d36e75410f91a1
    - name: Save only the typed results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: combined-array-verdicts
        path: ${{ runner.temp }}/replay-public/*.json
        if-no-files-found: error
