name: Read one packet capture for all network interfaces
on:
  push:
    branches: [qualification/multi-link-pcap]
permissions:
  contents: read
  actions: read
jobs:
  router:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      STOCK: aa767e4c43d011121271551fe24da501a56f729d
      FIXED: e63ba1c44f18e0ac076a3491dab5d7aff8632f71
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 3, persist-credentials: false}
    - name: Prepare the compiler and isolated router lab
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        printf '{"verified":false,"reason":"no completed transfer evidence"}\n' > "$RUNNER_TEMP/records/verdict.json"
        test "$(git rev-parse HEAD^)" = "$FIXED"
        test "$(git rev-parse HEAD^^)" = "$STOCK"
        git diff --exit-code "$FIXED" HEAD -- pkg runsc
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --privileged --name tcp-compiler --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler ip -V
        docker exec tcp-compiler /bin/sh -ec 'if ! command -v ping >/dev/null; then apt-get update -qq && apt-get install -y --no-install-recommends iputils-ping; fi; ping -V'
    - name: Verify one external link on the original runtime
      run: |
        set -euo pipefail
        git restore --source="$STOCK" -- pkg/tcpip/link/sniffer/sniffer.go runsc/boot/network.go
        git diff --quiet "$STOCK" -- pkg runsc
        PRODUCT_SHA="$STOCK" python3 test/rbe/forward_gso/qualify.py stock
    - name: Verify one and two links on the corrected runtime
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        git restore --source="$FIXED" -- pkg/tcpip/link/sniffer/sniffer.go runsc/boot/network.go
        git diff --quiet "$FIXED" -- pkg runsc
        PRODUCT_SHA="$FIXED" python3 test/rbe/forward_gso/qualify.py fixed
    - name: Report the original three cases
      if: always()
      run: |
        python3 - <<'PYREPORT'
        import json, os, pathlib, sys
        root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'records'
        phases = {key: json.loads(p.read_text()) if (p := root / (key + '.json')).is_file() else {} for key in ('stock','fixed')}
        verdict = {key: row.get('result', 'not run') for key, row in phases.items()}
        passed = all(r == 'verified' for r in verdict.values())
        (root/'verdict.json').write_text(json.dumps({'verified': passed, 'phases': verdict}, indent=2) + '\n')
        print(verdict)
        sys.exit(not passed)
        PYREPORT
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: network-interface-capture
        path: ${{ runner.temp }}/records
        if-no-files-found: error
