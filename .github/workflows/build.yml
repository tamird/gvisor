name: Read six original source-presubmit diagnostics
on:
  push:
    branches: [qualification/canonical-presubmit-six-errors]
permissions: {contents: read}
jobs:
  recover:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify reader and original carrier before accessing six test and compiler logs
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = cdcaad59e6e7b2743f362b014c6b1ad590fe087c
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/original_six.py'
          cp .github/qualification/original_six.py "$RUNNER_TEMP/reader.py"
          echo "4894a8a3f5a0943ebe283a95957cb047313db2d3632e2598819009ad94eaf80f  $RUNNER_TEMP/reader.py" | sha256sum -c -
      - name: Read the hash-bound six outputs at the original TLS origin
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -IB "$RUNNER_TEMP/reader.py"
      - name: Verify the output scope
        run: |
          python3 - <<'CHECK'
          import json,os,pathlib,re
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-six-errors.json"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size<65000
          b=p.read_bytes()
          assert not re.search(rb"(?i)authorization|x-buildbuddy-api-key|github_pat_|gh[pousr]_[a-z0-9]{20,}|remote_header",b)
          r=json.loads(b);assert r["invocation"]=="7323fde8-cb0d-4d84-a7f1-b5972b3327a8"
          assert set(r["objects"])=={"docprocessor","sandbox_py","runsc_coverage","runsc_race_coverage","sentry_coverage","sentry_race_coverage"}
          CHECK
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-six-source-diagnostics
          path: ${{ runner.temp }}/canonical-six-errors.json
          retention-days: 14
      - name: Require all original hashes and lengths
        run: python3 -c 'import json,pathlib,os; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-six-errors.json"; assert all(v["verified"] for v in json.loads(p.read_text())["objects"].values())'
