name: Qualify the native webhook image and loopback deployment
on:
  push:
    branches: [qualification/webhook-oci-loopback]
permissions:
  contents: read
jobs:
  webhook:
    if: github.repository == 'tamird/gvisor' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Pin the product, Bazelisk and worker-local registry
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/webhook-oci"
          mkdir -p "$work/bin"
          printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$work/result.json"
          test "$(git rev-parse HEAD^)" = 0d54cc79f0155cc02ffd4a1a0c679579f52af9dd
          test "$(git rev-parse HEAD^^)" = 183a39d1b2aff9e8e2219171940001749a2b5db0
          cp .github/qualification/webhook_oci.py "$work/check.py"
          git checkout --quiet --detach HEAD^
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$work/bin/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $work/bin/bazel" | sha256sum -c -
          chmod 755 "$work/bin/bazel"
          echo "$work/bin" >> "$GITHUB_PATH"
          cd "$work"
          sudo apt-get update -qq
          apt-get download docker-registry
          dpkg-deb -x docker-registry_*.deb package
          test -x package/usr/bin/docker-registry
      - name: Configure the established remote GNU build platform
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/webhook-oci"
          umask 077
          mkdir "$work/platform"
          echo 'module(name="webhook_gnu")' > "$work/platform/MODULE.bazel"
          cat > "$work/platform/BUILD" <<'BUILD'
          platform(
              name = "gnu",
              constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
              exec_properties = {
                  "Arch": "amd64",
                  "OSFamily": "linux",
                  "workload-isolation-type": "firecracker",
                  "dockerUser": "root",
                  "EstimatedMemory": "8GB",
                  "container-image": "docker://gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a",
              },
              visibility = ["//visibility:public"],
          )
          BUILD
          {
            printf '%s\n' 'build --jobs=16' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
              'build --remote_cache=grpcs://remote.buildbuddy.io' \
              'build --bes_backend=grpcs://remote.buildbuddy.io' \
              'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
              'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
              'build --remote_accept_cached' \
              "build --inject_repository=webhook_gnu=$work/platform" \
              'build --extra_execution_platforms=@webhook_gnu//:gnu' \
              'build --host_platform=@webhook_gnu//:gnu'
            test -n "$BUILDBUDDY_API_KEY"
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$work/remote.bazelrc"
      - name: Build, render, load, run and push to the loopback registry
        run: python3 "$RUNNER_TEMP/webhook-oci/check.py"
      - name: Verify the single bounded receipt
        id: privacy
        if: always()
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "webhook-oci" / "result.json"
          assert path.is_file() and not path.is_symlink() and 0 < path.stat().st_size < 16384
          data = path.read_bytes()
          assert json.loads(data)["status"] in ("PASS", "FAIL", "INCOMPLETE")
          key = os.environ["ACCESS"].encode()
          assert key and all(x not in data for x in (key, b"remote_header", b"bes_header", b"Authorization:", b"Bearer ", b"X-Amz-Signature"))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: webhook-oci
          path: ${{ runner.temp }}/webhook-oci/result.json
          if-no-files-found: error
