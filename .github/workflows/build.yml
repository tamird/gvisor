name: Run the statefile permission cases in both native profiles
on:
  push:
    branches: [qualification/current-statefile-permissions]
permissions: {contents: read}
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the source, original owners and client
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = d78fe07a0a829205c5e26b864c648efdcb4d098d
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/permission_owner' ':!.github/qualification/exec_cas.py' ':!.github/qualification/source_presubmit_workers.py'
          d="$RUNNER_TEMP/permission-owner"
          mkdir -p "$d/results"
          cp .github/qualification/permission_owner/{original.json,check.py} .github/qualification/{exec_cas.py,source_presubmit_workers.py} "$d/"
          git checkout -q --detach d78fe07a0a829205c5e26b864c648efdcb4d098d
          test "$(git rev-parse HEAD^{tree})" = 2d1f63d09c66fa1bb2b85134eb3dee6a92e3f871
          echo '//runsc/cmd:statefile_output_permissions_test' > "$d/owner.targets"
          curl --retry 2 -fsSL --proto '=https' --proto-redir '=https' --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          cd "$d"
          sha256sum --check <<'SUMS'
          e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  bazel
          e882cee2dcfd58f4b955fbcbb93bdd4c057ca33592080a877ba4ceefb78fe803  original.json
          SUMS
          chmod 755 bazel
      - name: Check both complete package selections without executing actions
        run: python3 -IB "$RUNNER_TEMP/permission-owner/check.py" selection
      - name: Run the new owner in each ordinary native profile
        id: execute
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          : "${BUILDBUDDY_API_KEY:?missing fork credential}"
          d="$RUNNER_TEMP/permission-owner"
          trap 'rm -f "$d/remote.rc"' EXIT
          cat > "$d/remote.rc" <<'RC'
          build:source-presubmit-common --remote_executor=grpcs://remote.buildbuddy.io
          build:source-presubmit-common --remote_cache=grpcs://remote.buildbuddy.io
          build:source-presubmit-common --bes_backend=grpcs://remote.buildbuddy.io
          build:source-presubmit-common --bes_results_url=https://app.buildbuddy.io/invocation/
          RC
          printf 'build:source-presubmit-common --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$d/remote.rc"
          unset BUILDBUDDY_API_KEY
          python3 -IB "$d/check.py" actual
      - name: Verify the original TestRunner worker assignments
        if: always() && (steps.execute.outcome == 'success' || steps.execute.outcome == 'failure')
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -IB "$RUNNER_TEMP/permission-owner/check.py" workers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: current-statefile-results
          path: ${{ runner.temp }}/permission-owner/results/*.json
          if-no-files-found: warn
          retention-days: 14
