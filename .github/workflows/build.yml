name: Read the original checkpoint boot diagnostics
on:
  push:
    branches: [qualification/checkpoint-capacity-logs]
permissions:
  contents: read
jobs:
  diagnosis:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false}
    - name: Read original failed target outputs
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 test/rbe/checkpoint_startup_receipt.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: checkpoint-startup-receipt
        path: ${{ runner.temp }}/verdict.json
