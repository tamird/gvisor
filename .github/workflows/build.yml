name: Check TCP Eifel timing across a clock wrap
on:
  push:
    branches: [qualification/tcp-eifel-wrap-undo]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 47
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      SERIAL: 385c7126ae4a7f31b4f1ca45d6fba49945a28cb6
      REVIEW: d3d6262cc176d6dfe02131e58f032cdc85c87665
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 8, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/records/verdict.json"
        cp test/rbe/eifel-wrap-receipt.py "$RUNNER_TEMP/"
        test "$(git rev-parse "$REVIEW^")" = "1af4ae880239496a8470baaa16f34b131d4fe045"
        test "$(git rev-parse "$SERIAL^")" = "$REVIEW"
        test "$(git diff --name-only "$REVIEW" "$SERIAL")" = "pkg/tcpip/transport/tcp/snd.go"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        test "$(cat .bazelversion)" = 8.3.1
        curl --fail --silent --show-error --location --proto '=https' --retry 3 --output "$RUNNER_TEMP/bazel-8.3.1" https://releases.bazel.build/8.3.1/release/bazel-8.3.1-linux-x86_64
        echo "17247e8a84245f59d3bc633d0cfe0a840992a7760a11af1a30012d03da31604c  $RUNNER_TEMP/bazel-8.3.1" | sha256sum --check --status
        chmod 0555 "$RUNNER_TEMP/bazel-8.3.1"
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler bazel --version > "$RUNNER_TEMP/records/image-bazel"
        docker exec tcp-compiler "$RUNNER_TEMP/bazel-8.3.1" --version > "$RUNNER_TEMP/records/source-bazel"
        grep -Fx 'bazel 8.3.1' "$RUNNER_TEMP/records/source-bazel"
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
    - name: Run only the six transport traces on each sender
      run: |
        set -euo pipefail
        for arm in review serial; do
          case "$arm" in review) source="$REVIEW";; serial) source="$SERIAL";; esac
          d="$RUNNER_TEMP/records/$arm"; mkdir "$d"
          git checkout --quiet --detach "$source"
          git rev-parse HEAD > "$d/head"; test "$(cat "$d/head")" = "$source"
          uuid="$(cat /proc/sys/kernel/random/uuid)"; printf '%s\n' "$uuid" > "$d/uuid"
          code=0
          timeout -k 10 19m docker exec tcp-compiler "$RUNNER_TEMP/bazel-8.3.1" --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --invocation_id="$uuid" --jobs=32 --strategy=TestRunner=remote --nocache_test_results --test_output=errors --test_env=GO_TEST_WRAP_TESTV=1 --test_arg=-test.v --test_timeout=150 --test_filter='^TestEifelWrapUndo$' --build_event_json_file="$RUNNER_TEMP/$arm.bep" //pkg/tcpip/transport/tcp/test/e2e:tcp_sack_test > "$RUNNER_TEMP/$arm.log" 2>&1 || code=$?
          printf '%s\n' "$code" > "$d/exit"
          jq -r 'select(.id.testResult.label == "//pkg/tcpip/transport/tcp/test/e2e:tcp_sack_test") | .testResult.status' "$RUNNER_TEMP/$arm.bep" > "$d/status" || true
          for file in test.log test.xml; do
            docker exec tcp-compiler cat "bazel-testlogs/pkg/tcpip/transport/tcp/test/e2e/tcp_sack_test/$file" > "$d/$file" || true
          done
          grep -E 'tcp_sack_test.go:[0-9]+:|panic: test timed out|^--- (FAIL|PASS):' "$d/test.log" > "$d/sanitized.txt" || true
          grep -E 'tcp_sack_test.go:[0-9]+:|No matching tests|compilation failed|^ERROR:|^Error:' "$RUNNER_TEMP/$arm.log" | grep -viE -- '--|header|api.key|authorization|bearer|secret|credential|token=' | cut -c 1-400 | head -35 >> "$d/sanitized.txt" || true
        done
    - name: Reconcile the original packet and test results
      if: always()
      run: python3 "$RUNNER_TEMP/eifel-wrap-receipt.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: eifel-original-clock-wrap
        path: |
          ${{ runner.temp }}/records/image-bazel
          ${{ runner.temp }}/records/source-bazel
          ${{ runner.temp }}/records/verdict.json
          ${{ runner.temp }}/records/*/uuid
          ${{ runner.temp }}/records/*/exit
          ${{ runner.temp }}/records/*/head
          ${{ runner.temp }}/records/*/status
          ${{ runner.temp }}/records/*/sanitized.txt
          ${{ runner.temp }}/records/*/test.xml
        if-no-files-found: error
