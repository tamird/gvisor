name: Hosted native ARM cmd owner
on:
  push:
    branches: [qualification/native-hosted-arm-cmd]
permissions:
  contents: read
jobs:
  cmd:
    if: github.event.created && github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind the original ARM owner and native launcher
        run: |
          set -eu
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD^)" = 353c484b45fec1ba5ba19445ba03807a5f9638e0
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$(printf '%s\n' .github/qualification/hosted_cmd.py .github/workflows/build.yml)"
          install -m 0755 .github/qualification/hosted_cmd.py "$RUNNER_TEMP/hosted-cmd"
          git checkout --quiet --detach HEAD^
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-arm64 -o "$RUNNER_TEMP/bazelisk"
          echo "bb608519a440d45d10304eb684a73a2b6bb7699c5b0e5434361661b25f113a5d  $RUNNER_TEMP/bazelisk" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bazelisk"
          test "$("$RUNNER_TEMP/bazelisk" --version)" = "bazel 9.3.1"
          echo '//runsc/cmd:cmd_test' > "$RUNNER_TEMP/one.targets"
      - name: Materialize the unchanged owner and matching release
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          : "${BUILDBUDDY_API_KEY:?missing fork credential}"
          rc="$RUNNER_TEMP/cmd.bazelrc"
          trap 'rm -f "$rc"' EXIT
          printf '%s\n' 'build:source-presubmit-arm64 --remote_executor=grpcs://remote.buildbuddy.io' 'build:source-presubmit-arm64 --remote_cache=grpcs://remote.buildbuddy.io' > "$rc"
          printf 'build:source-presubmit-arm64 --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          unset BUILDBUDDY_API_KEY
          code=0
          "$RUNNER_TEMP/bazelisk" --bazelrc="$rc" build --config=source-presubmit-arm64 --remote_download_outputs=toplevel --jobs=24 --test_env=GO_TEST_WRAP_TESTV=1 --run_under="$RUNNER_TEMP/hosted-cmd" //runsc/cmd:cmd_test //:release > "$RUNNER_TEMP/cmd-build.log" 2>&1 || code=$?
          echo "$code" > "$RUNNER_TEMP/cmd-build.exit"
          exit "$code"
      - name: Run the complete owner in private namespaces on the hosted kernel
        run: |
          set -eu
          test ! -e "$RUNNER_TEMP/cmd.bazelrc"
          test -z "${BUILDBUDDY_API_KEY:-}"
          code=0
          "$RUNNER_TEMP/bazelisk" test --config=source-presubmit-arm64 --target_pattern_file="$RUNNER_TEMP/one.targets" --spawn_strategy=sandboxed --strategy=TestRunner=standalone --remote_executor= --remote_cache= --bes_backend= --noremote_upload_local_results --nocache_test_results --flaky_test_attempts=1 --run_under="$RUNNER_TEMP/hosted-cmd" --test_env=GO_TEST_WRAP_TESTV=1 --jobs=3 --build_event_json_file="$RUNNER_TEMP/cmd-local.bep" > "$RUNNER_TEMP/cmd-local.log" 2>&1 || code=$?
          echo "$code" > "$RUNNER_TEMP/cmd-local.exit"
      - name: Retain categorical owner and subtest evidence
        if: always() && !cancelled()
        run: |
          test ! -e "$RUNNER_TEMP/cmd.bazelrc"
          python3 -IB "$RUNNER_TEMP/hosted-cmd" report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: native-hosted-arm-cmd
          path: ${{ runner.temp }}/cmd-result.json
          if-no-files-found: error
