name: Recover original TCP shrink assertion progress
on:
  push:
    branches: [qualification/tcp-shrink-original-log]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Read original test events without a test rerun
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYREC'
        import base64
        import json
        import os
        from pathlib import Path
        import re
        import urllib.request as url

        inv = "8675afa9-acaa-41b2-a391-538a7922e14c"
        label = "//test/syscalls:socket_ip_tcp_generic_loopback_test_runsc_ptrace"
        key = os.environ.pop("BUILDBUDDY_API_KEY")
        def api(name, body):
            req = url.Request("https://app.buildbuddy.io/api/v1/" + name,
                              json.dumps(body).encode(), {"x-buildbuddy-api-key":key, "Content-Type":"application/json"})
            with url.urlopen(req, timeout=30) as response:
                return json.load(response)

        def entries(data):
            result = []
            for line in data.splitlines():
                case = re.search(r"\[ *(RUN|OK|FAILED) *\] *(AllTCPSockets/TCPSocketPairTest\.WriteAfterShrinkingFullReceiveBuffer/\d+)",line)
                if case:
                    result.append([case.group(1),case.group(2)])
                elif (match:=re.search(r"(socket_ip_tcp_generic\.cc:\d+: Failure|(?:WriteFd\(writer|ReadFd\(peer|RetryEINTR\(recv\)\(peer)[^\n]{0,100}|exited with error code 142|SIGALRM|Alarm clock)", line)):
                    result.append(["detail",match.group(0)])
            return result

        sel={"invocation_id":inv, "target_label":label}
        out={"invocation":inv, "target":label}
        def failed(err):
            return getattr(err,"code",type(err).__name__)
        try:
            act=api("GetAction",{"selector":sel})
            files={f["uri"] for a in act.get("action",[]) for f in (a.get("file",[]) or a.get("outputFiles",[]) or a.get("output_files",[]))
                   if f.get("name","").endswith("test.log") and "uri" in f}
            for uri in sorted(files):
                if not uri.startswith("bytestream://"): continue
                n = int(uri.rsplit("/",1)[-1])
                result=api("GetFileRange",{"uri":uri,"start":0,"end":min(n,8*1024*1024)})
                out["cas_events"]=entries(base64.b64decode(result["data"]).decode(errors="replace"))
                if out["cas_events"]: break
            out["matching_files"]=len(files)
        except Exception as err:
            out["file_error"]=failed(err)
        if not out.get("cas_events"):
            try:
                out["build_log_events"]=[]
                token=""
                for _ in range(25):
                    page=api("GetLog",dict(selector={"invocation_id":inv},page_token=token))
                    out["build_log_events"]+=entries(page.get("log",{}).get("contents",""))
                    token=page.get("nextPageToken") or page.get("next_page_token")
                    if not token: break
            except Exception as err:
                out["log_error"]=failed(err)
        raw=json.dumps(out,indent=2)
        assert key not in raw
        Path(os.environ["RUNNER_TEMP"],"original-events.json").write_text(raw+"\n")
        print("Recovered",len(out.get("cas_events",[]) or out.get("build_log_events",[])),"named events")
        PYREC
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: tcp-original-test-events
        path: ${{ runner.temp }}/original-events.json
        if-no-files-found: error
