name: Check the installed release
on:
  push:
    branches: [qualification/release-bridge-make-copy]
permissions:
  contents: read
jobs:
  copy:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PRODUCT: f187880054798de72c74c78d2506c7c60fa6641e
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 2, persist-credentials: false}
    - name: Install the releases with Make
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^)" = "$PRODUCT"
        mkdir -p "$RUNNER_TEMP/proof" "$RUNNER_TEMP/gnu-platform"
        echo '{"verified":false,"status":"incomplete"}' > "$RUNNER_TEMP/proof/verdict.json"
        profile=0ee70efe6d52576b8f173b40ad6b7ac117da3b72
        git fetch -q --no-tags --depth=1 origin "$profile"
        for file in BUILD.bazel MODULE.bazel; do
          git show "$profile:test/rbe/gnu_platform/$file" > "$RUNNER_TEMP/gnu-platform/$file"
        done
        git checkout --quiet --detach "$PRODUCT"
        git diff --quiet
        if git grep -n '@bazel_lib' -- tools/defs.bzl tools/release.bzl; then exit 1; fi
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --init --name tcp-compiler --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        python3 - <<'VERIFY'
        import datetime, json, os, re, stat, subprocess
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"])
        expected = {"runsc", "containerd-shim-runsc-v1"} | {"gvisor-bin/" + s for s in
                    ("checkpointgofer", "runsc-metric-server", "runsc-fd-parking", "gvisor-sentry-prewarmer", "gvisor-proc-umounter", "gvisor_sentry")}
        rows = {}
        record = {"source":os.environ["PRODUCT"], "target":"//:release", "expected":sorted(expected), "architectures":rows}
        def now():
            return datetime.datetime.now(datetime.timezone.utc).isoformat()
        def save():
            record["verified"] = len(rows) == 2 and all(r.get("passed") for r in rows.values())
            record["verified_at"] = now()
            (root / "proof/verdict.json").write_text(json.dumps(record, indent=2) + "\n")
        for arch,machine in (("x86_64",62), ("aarch64",183)):
            installed = Path("bin")
            installed.mkdir()
            row = rows[arch] = {"started":now(), "files":{}, "missing":sorted(expected), "skips":[]}
            save()
            log = root / (arch + ".log")
            args = ["docker","exec","-e","USER=root","tcp-compiler","make","copy","TARGETS=//:release","DESTINATION=bin/",
                    "DOCKER_BUILD=false","STARTUP_OPTIONS=--bazelrc=" + str(root / "tcp.bazelrc"),"BAZEL_OPTIONS=--config=" + arch + " --jobs=400"]
            with log.open("w") as output:
                row["exit"] = subprocess.run(args, stdout=output, stderr=subprocess.STDOUT).returncode
            row["finished"] = now()
            lines = log.read_text(errors="replace").splitlines()
            row["invocations"] = sorted(set(re.findall(r"https://app.buildbuddy.io/invocation/[0-9a-f-]+", "\n".join(lines))))
            for f in installed.rglob("*"):
                if f.is_dir(): continue
                with f.open("rb") as stream: header = stream.read(20)
                row["files"][str(f.relative_to(installed))] = (stat.S_ISREG(f.lstat().st_mode) and os.access(f,os.X_OK)
                    and header[:6] == b"\x7fELF\x02\x01" and int.from_bytes(header[18:20],"little") == machine)
            names = set(row["files"])
            row["missing"] = sorted(expected - names)
            row["unexpected"] = sorted(names - expected)
            if not row["exit"] and arch=="x86_64" and row["files"].get("runsc"):
                row["runsc_version_exit"] = subprocess.run(["bin/runsc","--version"]).returncode
            row["passed"] = (row["exit"] == 0 and names == expected and all(row["files"].values()) and
                             (arch != "x86_64" or row.get("runsc_version_exit") == 0))
            save()
            if not row["passed"]:
                print("Make exit",row["exit"],"missing",row["missing"],"unexpected",row["unexpected"],flush=True)
                for line in [s for s in lines if s.startswith(("ERROR:","make:","make[","FATAL:"))][-20:]:
                    if not any(k in line.lower() for k in ("header","token","secret","api-key")): print(line[:500])
            installed.rename(root / (arch+"-installed"))
        print(json.dumps(record, separators=(",",":")))
        raise SystemExit(not record.get("verified"))
        VERIFY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: release-layout
        path: ${{ runner.temp }}/proof/verdict.json
        if-no-files-found: error
