name: Recover original Hackbench timeout diagnostics
on:
  push:
    branches: [qualification/hackbench-terminal-recovery]
permissions:
  contents: read
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 5, persist-credentials: false}
      - name: Prepare the existing diagnostic reader and original receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp test/rbe/hackbench-release.py "$RUNNER_TEMP/hackbench-release.py"
          git fetch --quiet --depth=1 origin 93de62e8d3573407bfc1ded722a0a73d80cabedc
          git show 93de62e8d3573407bfc1ded722a0a73d80cabedc:test/rbe/plugin_programs/cas_inputs.py > "$RUNNER_TEMP/cas_inputs.py"
          git checkout --detach 7c63124a29588f4cdc264e11b8f345230c6efed3
          gh api repos/tamird/gvisor/actions/artifacts/13186122138/zip > "$RUNNER_TEMP/diagnosis-original.zip"
      - name: Recover the same original console and selected build events
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: PYTHONPATH="$RUNNER_TEMP" python3 -B "$RUNNER_TEMP/hackbench-release.py" diagnose
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hackbench-terminal
          path: ${{ runner.temp }}/hackbench-public/result.json
          if-no-files-found: error
