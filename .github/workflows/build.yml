name: Match the original nine GNU call frames to their build inputs
on:
  push:
    branches: [qualification/tldk-native-frame-symbols]
permissions:
  contents: read
jobs:
  symbolize:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Resolve the measured CFI frames without a build or runtime replay
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 675d49b1c7a1b43ac0d2a5cbe4ab5d897ff44afa
          mkdir -p "$RUNNER_TEMP/receipt"
          image=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          docker pull "$image" >/dev/null
          docker run --rm --entrypoint=dpkg-query "$image" -W libc6 libc6-dev > "$RUNNER_TEMP/receipt/libc-version.txt"
          for p in /usr/lib/x86_64-linux-gnu/libc.a /usr/x86_64-linux-gnu/lib/libc.a; do
            if docker run --rm --entrypoint=test "$image" -f "$p"; then
              case "$p" in /usr/lib/*) tag=native;; *) tag=cross;; esac
              docker run --rm --entrypoint=cat "$image" "$p" > "$RUNNER_TEMP/qualified-$tag-libc.a"
            fi
          done
          if ! /usr/bin/python3 -c 'import elftools' 2>/dev/null; then sudo apt-get -qq install -y python3-pyelftools; fi
          /usr/bin/python3 test/rbe/tldk_original/native-frame-proof.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-tldk-native-stack
          path: ${{ runner.temp }}/receipt
