name: Restore with a lisafs server omitting its host descriptor
on: workflow_dispatch
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retain the controller outside the two source checkouts
        run: |
          cp test/epoll_restore_probe/qualify.py "$RUNNER_TEMP/gofer_qualify.py"
          cp -R test/epoll_restore_probe "$RUNNER_TEMP/probe-src"
          cp test/epoll_restore_probe/inject.py "$RUNNER_TEMP/omit.py"
          python3 -m py_compile "$RUNNER_TEMP/gofer_qualify.py" "$RUNNER_TEMP/omit.py"
          mkdir -p "$RUNNER_TEMP/gofer-evidence"
          echo '{"verdict":"INCOMPLETE","expected":["old-watch","fixed-watch","fixed-empty"],"observations":{}}' >"$RUNNER_TEMP/gofer-evidence/verdict.json"
      - name: Install the cross compiler used for runsc's embedded vDSO
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install g++-aarch64-linux-gnu
      - name: Build the original and corrected runsc with the same ELF
        run: |
          set -euo pipefail
          opts=(--config=x86_64 --jobs=4 --local_ram_resources=HOST_RAM*.65)
          fetch_source() {
            git fetch --depth=3 origin "$1"
            git switch --detach "$1"
            test "$(git rev-parse HEAD)" = "$1"
          }
          binary() { bazel cquery --config=x86_64 --output=files "$1"; }
          for variant in stock fixed; do
            case "$variant" in
              stock) product=64758ff8b5b9c25a780afc75f830260c68b58bbb ;;
              fixed) product=d971b7abc867da47292289eba8792aa62775df0c ;;
            esac
            fetch_source "$product"
            mkdir -p test/epoll_restore_probe
            cp "$RUNNER_TEMP/probe-src"/{BUILD,probe.c} test/epoll_restore_probe/
            python3 "$RUNNER_TEMP/omit.py"
            git diff -- runsc/gofer/fs/lisafs.go > "$RUNNER_TEMP/gofer-evidence/$variant-provider.diff"
            test -s "$RUNNER_TEMP/gofer-evidence/$variant-provider.diff"
            bazel build "${opts[@]}" //runsc:runsc //test/epoll_restore_probe:probe
            cp "$(binary //runsc:runsc)" "$RUNNER_TEMP/$variant-runsc"
            cp "$(binary //test/epoll_restore_probe:probe)" "$RUNNER_TEMP/gofer-probe"
            git restore --source=HEAD -- runsc/gofer/fs/lisafs.go
          done
          cmp "$RUNNER_TEMP/gofer-evidence/stock-provider.diff" "$RUNNER_TEMP/gofer-evidence/fixed-provider.diff"
          file "$RUNNER_TEMP/gofer-probe" | grep 'statically linked'
      - name: Exercise watched and unwatched restored character devices
        run: |
          sudo python3 "$RUNNER_TEMP/gofer_qualify.py" "$RUNNER_TEMP/gofer-probe"             "$RUNNER_TEMP/stock-runsc" "$RUNNER_TEMP/fixed-runsc" "$RUNNER_TEMP/gofer-evidence"
      - name: Show runtime diagnostics if a required trace is missing
        if: failure()
        run: |
          sudo find "$RUNNER_TEMP/gofer-evidence" -maxdepth 1 -name '*.log' -exec tail -30 '{}' ';'
          sudo grep -irE 'FATAL|WARNING.*(error|failed)|panic:' "$RUNNER_TEMP/gofer-evidence" | cut -c1-1200 | tail -55 || :
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gofer-missing-device-donor
          path: |
            ${{ runner.temp }}/gofer-evidence/verdict.json
            ${{ runner.temp }}/gofer-evidence/*.log
            ${{ runner.temp }}/gofer-evidence/*.diff
          if-no-files-found: error
