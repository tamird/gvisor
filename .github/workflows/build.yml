name: Check the scheduling boundary of a TCP processor queue
on:
  push:
    branches: [qualification/tcp-processor-fifo-tail]
permissions:
  contents: read
jobs:
  measure:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Read the previously measured scheduling policy
        run: git fetch --no-tags --depth=3 origin refs/heads/qualification/tcp-processor-contended-pass
      - name: Compare finite processor queues
        run: python3 .github/workflows/tcp_owner_results.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tcp-processor
          path: ${{ runner.temp }}/owner/*.json
          if-no-files-found: error
