name: Systemd journal timeout
on:
  push:
    branches: [qualification/systemd-journal-silent-service-20261112]
jobs:
  journal:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      QUALIFICATION_LANES: docker
      QUALIFICATION_ARCH: amd64
      QUALIFICATION_TARGETS: //test/e2e:integration_runtime_test_owned
      QUALIFICATION_TEST_FILTER: '^TestSystemdSimpleDaemon$'
      QUALIFICATION_EXECUTION: remote-actions
      QUALIFICATION_COMMIT: ${{ github.sha }}
      QUALIFICATION_HEADER_BASE: ''
      QUALIFICATION_COS_GZIP_BASE64: ''
      QUALIFICATION_COS_SHA256: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run the unchanged journal assertion against the silent service
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set +e
          bash test/rbe/actions.sh
          rc=$?
          set -e
          mkdir -p "$RUNNER_TEMP/journal"
          printf '%s\n' "$rc" > "$RUNNER_TEMP/journal/coordinator-exit.txt"
          python3 - <<'PY'
          import os, re, shutil
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          out = root / "journal"
          paths = list((root / "qualification").rglob("test.log"))
          paths.extend((Path("bazel-testlogs") / "test/e2e").glob("integration_runtime_test_owned/test.log"))
          logs = []
          for path in paths:
              data = path.read_bytes()
              if b"journal-control reads=" in data:
                  logs.append((path, data))
          assert logs, f"Missing original case output: {paths}"
          path, data = logs[0]
          assert all(other == data for _, other in logs)
          (out / "test.log").write_bytes(data)
          xml = path.with_name("test.xml")
          if xml.is_file():
              shutil.copyfile(xml, out / "test.xml")
          log = data.decode(errors="replace")
          match = re.search(r"journal-control reads=(\d+) elapsed-ms=(\d+)", log)
          assert match
          reads, ms = map(int, match.groups())
          print(f"Real journal reads {reads}; bounded wait {ms} ms")
          assert reads >= 2 and 55000 <= ms <= 120000
          assert int((out / "coordinator-exit.txt").read_text()) != 0
          assert "test-daemon started with PID " in log
          assert "journalctl ran while daemon stdout remained blocked" in log
          assert "test-daemon restarted with PID" in log
          assert re.search(r"--- FAIL: TestSystemdSimpleDaemon", log)
          assert "waiting for test-daemon.service output:" in log
          # Check whether the daemon's last real journal is reported on timeout.
          report = log.split("waiting for test-daemon.service output:", 1)[1].split("journal-control", 1)[0]
          assert 'journal does not contain "Hello from test daemon"' in report
          assert "systemd[1]: Started " in report
          PY
      - name: Retain original results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: journal-timeout
          path: |
            ${{ runner.temp }}/journal/
            ${{ runner.temp }}/qualification.tar.gz
          if-no-files-found: error
