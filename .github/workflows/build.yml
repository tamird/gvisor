name: Measure the first RACK repair burst
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/rack-first-repair-count'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
        persist-credentials: false
    - name: Compare the first post-timeout repair burst
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD^1)" = "a41c73d52de75c05cb113ff14de338db4d94ceb1"
        mkdir -p "$RUNNER_TEMP/checker"
        for file in qualify.sh unit_matrix.py tcp_review_report.py; do
          cp "test/rbe/$file" "$RUNNER_TEMP/checker/$file"
        done
        python3 -m py_compile "$RUNNER_TEMP/checker/tcp_review_report.py"
        mkdir -p "$RUNNER_TEMP/fifo_platform" "$RUNNER_TEMP/fifo"
        platform=$RUNNER_TEMP/fifo_platform
        printf '%s\n' 'module(name="fifo_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/fifo.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
            'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
            'build --remote_accept_cached' \
            "build --inject_repository=fifo_platform=$platform" \
            'build --host_platform=@fifo_platform//:ubuntu' \
            'build --extra_execution_platforms=@fifo_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        printf '%s\n' 'build:rbe --spawn_strategy=remote' >> "$rc"
        export FIFO_RC=$rc
        mkdir -p "$RUNNER_TEMP/fifo-bin"
        cat > "$RUNNER_TEMP/fifo-bin/bazel" <<'SH'
        #!/bin/sh
        exec bazelisk --bazelrc="$FIFO_RC" "$@"
        SH
        chmod +x "$RUNNER_TEMP/fifo-bin/bazel"
        export PATH="$RUNNER_TEMP/fifo-bin:$PATH"
        overall=0
        for arm in proposal single_credit; do
          case $arm in
            proposal) source=d15557950cc9cb70c595f1d471961fbad2e3cdd6; parent=00aaa82b9e9cda8dc25dbe1df6e07a56c68302c5 ;;
            single_credit) source=a41c73d52de75c05cb113ff14de338db4d94ceb1; parent=d15557950cc9cb70c595f1d471961fbad2e3cdd6 ;;
          esac
          label=//pkg/tcpip/transport/tcp/test/e2e:tcp_rack_test
          pattern='^TestRACKRecoveryAfterRTOTailLoss$'
          git checkout --quiet --detach "$source"
          test "$(git rev-parse HEAD)" = "$source"
          test "$(git rev-parse HEAD^)" = "$parent"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p test/rbe "$RUNNER_TEMP/cork/$arm"
          cp "$RUNNER_TEMP/checker/qualify.sh" "$RUNNER_TEMP/checker/unit_matrix.py" test/rbe/
          out="$RUNNER_TEMP/cork/$arm"
          code=0
          bash test/rbe/qualify.sh --arch=amd64 "--test-target=$label" "--test-filter=$pattern" \
            "--bazel-option=--build_event_json_file=$out/events.jsonl" \
            --bazel-option=--test_arg=-test.v --bazel-option=--test_sharding_strategy=disabled --bazel-option=--cache_test_results=no \
            --bazel-option=--remote_download_outputs=toplevel test || code=$?
          test "$(git rev-parse HEAD)" = "$source"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 -B "$RUNNER_TEMP/checker/tcp_review_report.py" "$out" "$arm" "$source" "$label" "$code" || overall=1
        done
        exit "$overall"
    - name: Save only the typed results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rack-first-repair-verdict
        path: ${{ runner.temp }}/cork/*/result.json
        if-no-files-found: error
