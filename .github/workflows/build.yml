name: Verify optional plugin analyzer results
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/plugin-exact-analyzers'
    runs-on: ubuntu-24.04
    timeout-minutes: 175
    env:
      SOURCE: c3b5dc8de9a7b547529aa65740e7bb766f4b6ac0
      ORIGINAL: 0dad36edccfd1ca5ce82e498d6c5fd2bca9ffa66
      PRODUCT: 82f0e4f38f65529f18851f196504957874ec56fa
      PREVIOUS: "40952859734"
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Prepare exact plugin owners
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/exact/plugin"
        printf '%s\n' //pkg/sentry/socket/plugin/stack:stack_nogo //pkg/sentry/socket/plugin/stack:stack_test_nogo //pkg/sentry/socket/plugin/cgo:cgo_nogo > "$RUNNER_TEMP/exact/plugin/targets.txt"
        cp -a .github/qualification/epoll "$RUNNER_TEMP/checker"
        git fetch --no-tags --depth=2 origin "$SOURCE"
        git checkout --quiet --detach "$SOURCE"
        [[ $(git rev-parse HEAD^) == "$PRODUCT" ]]
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
    - name: Verify the optional plugin and cgo analyzer owners
      if: ${{ !cancelled() }}
      env:
        LANE: plugin
        CONFIG: x86_64
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: &verify_owner |
        set -euo pipefail
        out="$RUNNER_TEMP/exact/$LANE"
        if [[ ! -s $out/targets.txt ]]; then echo 'All this architecture’s owners qualified in the original run'; exit 0; fi
        mapfile -t labels < "$out/targets.txt"
        mkdir -p "$RUNNER_TEMP/gnu"
        printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
        printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
        checker=$RUNNER_TEMP/checker
        rc=$RUNNER_TEMP/epoll.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        [[ $(git rev-parse HEAD) == "$SOURCE" ]]
        git cat-file -p HEAD > "$out/commit.txt"
        git status --porcelain --untracked-files=no > "$out/source-before.txt"
        test ! -s "$out/source-before.txt"
        args=(test --config="$CONFIG" -c opt --jobs=4 --strategy=GoStdlib=linux-sandbox --strategy=GoStdlibList=linux-sandbox --strategy=GoStandardLibraryAnalysis=linux-sandbox --strategy=GoStaticAnalysis=linux-sandbox '--modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' --nocache_test_results --keep_going --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_sharding_strategy=disabled --test_output=errors --build_event_json_file_path_conversion=false "--build_event_json_file=$RUNNER_TEMP/raw.jsonl" "${labels[@]}")
        printf '%s\n' "${args[@]}" > "$out/arguments.txt"
        if [[ $LANE == pci ]]; then args+=(--test_arg=-test.v); fi
        code=0; capture=0; verify=0
        timeout --signal=INT --kill-after=40s 72m bazelisk --bazelrc="$rc" "${args[@]}" || code=$?
        finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        printf '%s\n' "$code" > "$out/native-exit.txt"
        git rev-parse HEAD > "$out/final-head.txt"
        git status --porcelain --untracked-files=no > "$out/source-after.txt"
        python3 -B "$checker/qualification_report.py" capture --events "$RUNNER_TEMP/raw.jsonl" --output "$out/events.jsonl" --output-root "$PWD/bazel-out" --report-dir "$out/reports" --expected-kind test || capture=$?
        printf '%s\n' "$capture" > "$out/capture-exit.txt"
        python3 - "$out" "$SOURCE" "$finished" <<'PY'
        import json, sys
        from pathlib import Path
        d=Path(sys.argv[1])
        ctx=dict(expected_source=sys.argv[2],command_kind="test",execution_finished_at=sys.argv[3],commit_file="commit.txt",source_before="source-before.txt",source_after="source-after.txt",final_head="final-head.txt",executed_arguments="arguments.txt",native_exit="native-exit.txt",capture_exit="capture-exit.txt")
        (d/"context.json").write_text(json.dumps(ctx))
        PY
        python3 -B "$checker/qualification_report.py" verdict --context "$out/context.json" --events "$out/events.jsonl" --manifest "$out/events.jsonl.manifest.json" --expected-targets "$out/targets.txt" --output "$out/verdict.json" || verify=$?
        if [[ $LANE == pci && $code == 0 ]]; then
          grep -E -- '--- PASS: TestPCIDevicePoll' "$PWD/bazel-testlogs/pkg/sentry/devices/tpuproxy/vfio/vfio_test/test.log" >/dev/null || exit 1
          grep -E -- '--- PASS: TestPCIDeviceRestoredWaiter' "$PWD/bazel-testlogs/pkg/sentry/devices/tpuproxy/vfio/vfio_test/test.log" >/dev/null || exit 1
        fi
        if ((code)); then exit "$code"; elif ((capture)); then exit "$capture"; else exit "$verify"; fi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: epoll-plugin-analyzers
        path: ${{ runner.temp }}/exact/plugin
        if-no-files-found: warn
