name: Check locking of the advertised TCP receive window
on:
  push:
    branches: [qualification/tcp-advertised-window-lock]
permissions: {contents: read}
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Bind the receive-window patch and native GNU environment
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/tcp-advertised-window"
          mkdir -p "$d"
          echo '{"verified":false,"stage":"setup"}' > "$d/result.json"
          product=3e626e8ca498199e41510a594fcf9c9192c561b4
          base=9ee2906f518e1d0f9fd109e9e1feb2812096418b
          test "$(git rev-parse HEAD^)" = "$product"
          test "$(git rev-parse HEAD^^)" = "$base"
          test "$(git diff --name-only "$base" "$product")" = pkg/tcpip/transport/tcp/rcv.go
          cp .github/qualification/tcp_advertised_window.py "$d/"
          git switch --detach "$product"
          test "$(uname -m)" = x86_64
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends -y build-essential crossbuild-essential-arm64
          curl -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          test "$(cat .bazelversion)" = 9.3.1
          test "$("$d/bazel" --version)" = 'bazel 9.3.1'
      - name: Run the scaled-window test and check the actual guard on both analyzer targets
        run: python3 -IB "$RUNNER_TEMP/tcp-advertised-window/tcp_advertised_window.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tcp-advertised-window-lock
          path: ${{ runner.temp }}/tcp-advertised-window/result.json
          if-no-files-found: error
