name: Qualify the optional TLDK backtrace on GNU and musl
on:
  push:
    branches: [qualification/tldk-musl-landed-15153]
permissions:
  contents: read
jobs:
  plugin:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind the exact source and existing native tools
        id: source
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/tldk-llvm"
          mkdir "$d"
          test "$(git rev-parse HEAD^)" = f283709146b5cc6c169d5b814c7abd5eb6b616c7
          test "$(git rev-parse HEAD^^)" = 1f49f256eae8d2dd2c69ea4cfe9ef2a5bb05516d
          cp .github/qualification/tldk_musl.py "$d/"
          git checkout --detach HEAD^
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --retry 3 --max-time 120 https://raw.githubusercontent.com/tamird/gvisor/5d2fe309d11bb2af1e5ffdb02326f4b1d5f6bfaf/test/rbe/native_cross_inputs.py -o "$d/native_cross_inputs.py"
          echo "b0626fb5ecb5bb9c41d644ced5af036019cbefbeef7975c71878021f6e146653  $d/native_cross_inputs.py" | sha256sum -c -
          curl -fsSL --retry 3 --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          test "$("$d/bazel" --version)" = 'bazel 9.3.1'
      - name: Provide the compilers used by the existing GNU configuration
        id: tools
        run: |
          set -euo pipefail
          if ! test -x /usr/bin/aarch64-linux-gnu-g++; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y g++-aarch64-linux-gnu
          fi
          for cpu in x86_64 aarch64; do
            test "$("/usr/bin/$cpu-linux-gnu-g++" -dumpmachine)" = "$cpu-linux-gnu"
          done
      - name: Compare disabled and enabled plugin targets
        run: env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$RUNNER_TEMP/tldk-llvm/tldk_musl.py" selection
      - name: Run the real GNU backtrace test
        if: always() && !cancelled() && steps.tools.outcome == 'success'
        run: env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$RUNNER_TEMP/tldk-llvm/tldk_musl.py" gnu
      - name: Run the real musl backtrace test
        if: always() && !cancelled() && steps.tools.outcome == 'success'
        run: env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$RUNNER_TEMP/tldk-llvm/tldk_musl.py" musl
      - name: Link both public plugin binaries with musl
        if: always() && !cancelled() && steps.tools.outcome == 'success'
        run: env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$RUNNER_TEMP/tldk-llvm/tldk_musl.py" links
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plugin-musl-after-15153
          path: |
            ${{ runner.temp }}/tldk-llvm/selection.json
            ${{ runner.temp }}/tldk-llvm/gnu.json
            ${{ runner.temp }}/tldk-llvm/musl.json
            ${{ runner.temp }}/tldk-llvm/links.json
          if-no-files-found: error
