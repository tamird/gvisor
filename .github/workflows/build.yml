name: Read the original plugin configuration failure
on:
  push:
    branches: [qualification/plugin-original-helper]
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Read only the original action or invocation output
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B test/rbe/plugin_programs/original_log.py
      - name: Check the single typed report
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "helper-evidence.json"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size < 32768
          data = p.read_bytes()
          json.loads(data)
          assert os.environ["KEY"] and os.environ["KEY"].encode() not in data
          assert all(v not in data.lower() for v in (b"authorization:", b"bearer ", b"x-buildbuddy-api-key"))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: original-dpdk-helper
          path: ${{ runner.temp }}/helper-evidence.json
          if-no-files-found: error
