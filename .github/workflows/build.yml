name: Qualify the Protobuf rebase
on:
  push:
    branches: [qualification/protobuf-catalog-rebase]
permissions:
  contents: read
jobs:
  catalog:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/protobuf-catalog-rebase'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PRODUCT: 94e8c3760f27577ab466bb750a3479531bb7a676
      BASE: aa5305e99cc2501aede44cac257338d954e7d7dc
      OLD: 6c330bf066b45334570a16b293a135fc167951b2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
        persist-credentials: false
    - name: Bind release, compatibility patch and catalog inputs
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^) == "$PRODUCT" && $(git rev-parse HEAD^^) == "$BASE" ]]
        git fetch --quiet --no-tags --depth=1 origin "$OLD"
        git checkout --quiet --detach "$PRODUCT"
        git diff --exit-code "$OLD" HEAD -- tools/grpc_upb_reflection_cc.patch
        git diff --exit-code "$BASE" HEAD -- . ':!MODULE.bazel' ':!tools/grpc_upb_reflection_cc.patch' ':!tools/licensecheck/dependencies.yaml'
        out="$RUNNER_TEMP/protobuf"
        mkdir -p "$out"
        git rev-parse HEAD > "$out/source.txt"
        cp tools/licensecheck/dependencies.yaml "$out/original.yaml"
        python3 - <<'GATE'
        from pathlib import Path
        import os, re, subprocess
        def get(ref):
            return subprocess.check_output(["git","show",ref+":tools/licensecheck/dependencies.yaml"]).decode()
        def block(s, name):
            return re.search(r'^- dependency: '+name+r'\n.*?(?=^- dependency: |\Z)',s,re.M|re.S)[0]
        base=get(os.environ["BASE"]); old=get(os.environ["OLD"]); current=get("HEAD")
        assert current == base.replace(block(base,"protobuf"), block(old,"protobuf"))
        assert "2.4.5" in block(current,"rules_python") and "37.0-rc1" in block(current,"protobuf")
        GATE
    - name: Fetch the full catalog twice and verify the result
      env:
        GITHUB_TOKEN: ${{ github.token }}
        MAKEFLAGS: DOCKER_BUILD=false
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/protobuf"
        command -v bazelisk
        command -v bazel
        for pass in first second; do
          bazelisk run //tools/licensecheck/main:licensecheck -- --mode=fetch > "$out/$pass.log" 2>&1 || { tail -45 "$out/$pass.log"; exit 1; }
          cp tools/licensecheck/dependencies.yaml "$out/$pass.yaml"
          date --iso-8601=ns > "$out/$pass-end.txt"
        done
        bazelisk run //tools/licensecheck/main:licensecheck -- --mode=verify 2>&1 | tee "$out/verify.log"
        sha256sum "$out"/{original,first,second}.yaml | tee "$out/digests.txt"
        git diff -- tools/licensecheck/dependencies.yaml > "$out/regeneration.diff"
        cmp "$out/first.yaml" "$out/second.yaml"
        if ! cmp "$out/original.yaml" "$out/first.yaml"; then
          cat "$out/regeneration.diff"
          exit 1
        fi
    - name: Compile the four gRPC targets that include reflection headers
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/protobuf"
        targets=(@com_github_grpc_grpc//:xds_client @com_github_grpc_grpc//src/core:promise_like @com_github_grpc_grpc//src/core:channelz_text_encode @com_github_grpc_grpc//src/core:channelz_v2tov1_convert)
        bazelisk build --jobs=4 --build_event_json_file="$RUNNER_TEMP/grpc.bep" "${targets[@]}"
        python3 - "$RUNNER_TEMP/grpc.bep" "$out/targets.json" "${targets[@]}" <<'EOT'
        import json,sys
        from pathlib import Path
        expected=set(sys.argv[3:]); finished={}; last=None
        for line in Path(sys.argv[1]).read_text().splitlines():
            event=json.loads(line); key=event.get("id",{}).get("targetCompleted",{}).get("label","")
            if key.startswith("@@") and "//" in key:
                key="@com_github_grpc_grpc//"+key.split("//",1)[1] if key.split("//",1)[0] in ("@@grpc+", "@@grpc~1.84.0") else key
            if key and not event["id"]["targetCompleted"].get("aspect") and key in expected:
                finished[key]=event.get("completed",{}).get("success",False)
            if "finished" in event: last=event["finished"].get("finishTime")
        Path(sys.argv[2]).write_text(json.dumps(dict(expected=sorted(expected),finished=finished,execution_finished=last),indent=2))
        assert set(finished)==expected and all(finished.values()), finished
        EOT
    - name: Record executed checks and omissions
      if: always()
      run: |
        python3 - <<'VERDICT'
        import json,os,hashlib
        from datetime import datetime,timezone
        from pathlib import Path
        d=Path(os.environ["RUNNER_TEMP"])/"protobuf"; d.mkdir(exist_ok=True)
        bits={name:(d/name).is_file() for name in ("source.txt","first.yaml","second.yaml","verify.log","targets.json")}
        archives=[hashlib.sha256((d/n).read_bytes()).hexdigest() for n in ("original.yaml","first.yaml","second.yaml") if (d/n).is_file()]
        result=json.loads((d/"targets.json").read_text()) if bits["targets.json"] else {}
        expected=4
        ok=all(bits.values()) and len(archives)==3 and len(set(archives))==1 and len(result.get("finished",{}))==expected and all(result["finished"].values()) and (d/"source.txt").read_text().strip()==os.environ["PRODUCT"] and os.environ["PRIOR_STATUS"]=="success"
        (d/"verdict.json").write_text(json.dumps(dict(source=os.environ["PRODUCT"],status="pass" if ok else "failed-or-incomplete",expected_targets=expected,build=result,catalog_digests=archives,missing=[k for k,v in bits.items() if not v],verified=datetime.now(timezone.utc).isoformat()),indent=2))
        raise SystemExit(int(not ok))
        VERDICT
      env:
        PRIOR_STATUS: ${{ job.status }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: protobuf-rebase
        path: |
          ${{ runner.temp }}/protobuf/verdict.json
          ${{ runner.temp }}/protobuf/regeneration.diff
          ${{ runner.temp }}/protobuf/digests.txt
          ${{ runner.temp }}/protobuf/targets.json
        if-no-files-found: error
