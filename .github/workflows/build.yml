name: Resolve the real governance areas on a coordinator without host tools
on:
  push:
    branches: [qualification/bazel-lib-governance]
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Query both versions of the actual governance repository
        run: python3 test/rbe/bazel_lib_governance_probe.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bazel-lib-governance
          path: repo-fetch-evidence
          if-no-files-found: error
