name: Check calibrated and reference clocks across live restore
on:
  push:
    branches: [qualification/clock-source-warm-restore]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: 80bbb7478312a10e7335a5475c9683a76d5c17d6
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        cp test/rbe/clock-restore-result.py "$RUNNER_TEMP/clock-restore-result.py"
        [[ "$(git rev-parse HEAD^1)" == "$CURRENT" ]]
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0
        if [[ ! -c /dev/net/tun ]]; then sudo mkdir -p /dev/net; sudo mknod /dev/net/tun c 10 200; fi
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --device /dev/net/tun --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Check monotonicity before and after a real restore
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$CURRENT"
        target=//test/syscalls:vdso_clock_gettime_test_runsc_systrap_directfs
        overall=0
        for mode in reference calibrated; do
          for clock in CLOCK_MONOTONIC CLOCK_BOOTTIME; do
            gtest="ClockGettime/MonotonicVDSOClockTest.IsCorrect/$clock"
            d="$RUNNER_TEMP/records/$mode-$clock"
            mkdir -p "$d"
            git rev-parse HEAD > "$d/source"
            test "$(cat "$d/source")" = "$CURRENT"
            printf '%s\n' "$target" "$gtest" "--clock-source=$mode" --save=true > "$d/inputs"
            rc=0
            date -u +%FT%TZ > "$d/start"
            docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=6 --strategy=GoStaticAnalysis=local --strategy=GoStandardLibraryAnalysis=local --strategy=TestRunner=local --nocache_test_results --remote_download_outputs=toplevel --zip_undeclared_test_outputs --nobuild_event_json_file_path_conversion --test_timeout=600 --test_sharding_strategy=disabled --test_env=GTEST_FILTER="$gtest" --test_arg=--strace=false --test_arg=--save=true --test_arg="--clock-source=$mode" --test_output=errors "$target" 2>&1 | tee "$RUNNER_TEMP/bazel-output" | sed -un '/^INFO: Invocation ID:/p' || rc=$?
            date -u +%FT%TZ > "$d/end"; printf '%s\n' "$rc" > "$d/exit"
            grep -A3 -E 'Invocation ID:|ERROR:|error:|FAILED|Build did NOT complete' "$RUNNER_TEMP/bazel-output" | head -100 > "$d/compiler-diagnostics" || :
            docker exec tcp-compiler python3 "$RUNNER_TEMP/clock-restore-result.py" "$d" "$mode" "$gtest" || overall=1
          done
        done
        python3 - "$RUNNER_TEMP/records" <<'RESULT'
        import json, sys
        from pathlib import Path
        from datetime import datetime, timezone
        d=Path(sys.argv[1])
        expected=[m+'-'+c for m in ('reference','calibrated') for c in ('CLOCK_MONOTONIC','CLOCK_BOOTTIME')]
        arms={k:json.loads((d/k/'verdict.json').read_text()) for k in expected if (d/k/'verdict.json').is_file()}
        executed=[k for k,v in arms.items() if v['gtestPass'] and v['completedRestores']]
        v={'expected':expected,'executed':executed,'missing':sorted(set(expected)-set(executed)),'failed':[k for k,a in arms.items() if not a['verified']],'arms':arms,'executionFinishedAt':max(((d/k/'end').read_text().strip() for k in expected if (d/k/'end').exists()),default=None),'verdictAvailableAt':datetime.now(timezone.utc).isoformat()}
        (d/'summary.json').write_text(json.dumps(v,indent=2)+'\n')
        sys.exit(bool(v['missing'] or v['failed']))
        RESULT
        exit "$overall"
    - name: Redact credentials from the evidence bundle
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key=os.environ["BB_KEY"].encode()
        for f in (Path(os.environ["RUNNER_TEMP"])/"records").rglob("*"):
            if f.is_file() and key and key in (data:=f.read_bytes()):
                f.write_bytes(data.replace(key,b"[REDACTED]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: clock-source-restore
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
