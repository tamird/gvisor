name: Locate the original netgofer loopback test result
on:
  push:
    branches: [qualification/netgofer-loopback-diagnostic]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Prepare the native Bazel client and existing original-report reader
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results" "$RUNNER_TEMP/bazelisk-bin"
          echo '{"status":"INCOMPLETE","phase":"setup"}' > "$RUNNER_TEMP/results/verdict.json"
          test "$(git rev-parse HEAD^)" = 76fb5c2defd0b3aa53eebf1229bfc37f423b90f1
          test "$(git rev-parse HEAD^^)" = 183a39d1b2aff9e8e2219171940001749a2b5db0
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$(printf '%s\n' .github/qualification/netgofer_records.py .github/workflows/build.yml)"
          verifier=6b3fe9ab6c03facafe6340c85f8d60ca3591566b
          git fetch --quiet --depth=1 origin "$verifier"
          for tool in qualification_report unit_matrix; do git show "$verifier:test/rbe/$tool.py" > "$RUNNER_TEMP/$tool.py"; done
          cp .github/qualification/netgofer_records.py "$RUNNER_TEMP"
          git checkout --detach 183a39d1b2aff9e8e2219171940001749a2b5db0
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazelisk-bin/bazelisk"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/bazelisk-bin/bazelisk" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bazelisk-bin/bazelisk"
          echo "$RUNNER_TEMP/bazelisk-bin" >> "$GITHUB_PATH"
      - name: Run the original loopback owner and retain its source assertion
        run: python3 "$RUNNER_TEMP/netgofer_records.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: netgofer-loopback-result
          path: ${{ runner.temp }}/results/verdict.json
          if-no-files-found: error
