name: Measure both public revisions of the connected TCP read change
on:
  push:
    branches: [qualification/tcp-read-reviewed-16]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 4, persist-credentials: false}
      - name: Measure alternating source pairs with the same two CPUs
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tcp-read-stream"
          mkdir -p "$root/results"
          printf '{"status":"INCOMPLETE","phase":"bootstrap"}\n' > "$root/results/verdict.json"
          cp .github/qualification/{stream_fixture.go,stream_profile.go,stream_compare.py} "$root/"
          test "$(git rev-parse HEAD^)" = e9abe5401c9fa5bc3c96738e52d406b0b1fbc15b
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/stream_fixture.go' ':!.github/qualification/stream_profile.go' ':!.github/qualification/stream_compare.py'
          sha256sum --check <<'SUMS'
          cd0b0af723f37718e8405c3db13b574db6a75ab33011006ec31eec7213d98735  .github/qualification/stream_fixture.go
          5bd3bf1a3bd7904250f0c8d93834fa88730c8ecad979b61aa6f20e21121a4502  .github/qualification/stream_profile.go
          SUMS
          git fetch --quiet --depth=2 https://github.com/google/gvisor.git a2e86ef832a8833222daf6362528d982b3179079 e9abe5401c9fa5bc3c96738e52d406b0b1fbc15b
          git fetch --quiet --depth=2 https://github.com/tamird/gvisor.git 890afa390aa44699ecbe493699b5260ad50dbaba
          curl --retry 3 -fsSL --proto '=https' --proto-redir '=https' --max-time 100 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$root/bazelisk"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $root/bazelisk" | sha256sum -c
          chmod 755 "$root/bazelisk"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -B "$root/stream_compare.py"
      - name: Calculate benchstat for the original measurements
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tcp-read-stream/results"
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e a2e86ef83 e9abe5401 | tee benchstat.txt
          grep -Fq 'sec/op' benchstat.txt
          grep -Fq 'B/s' benchstat.txt
      - name: Verify the bounded original results
        id: boundary
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'tcp-read-stream' / 'results'
          assert (root/'verdict.json').is_file()
          for path in root.iterdir():
              assert path.is_file() and not path.is_symlink()
              assert re.fullmatch(r'verdict\.json|benchstat\.txt|a2e86ef83|e9abe5401|(?:shape|p[0-9]{2})-(?:a2e86ef83|e9abe5401)\.log', path.name)
              data = path.read_bytes()
              assert len(data) < 256000
              assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{25,}|github_pat_[A-Za-z0-9]+|BEGIN (RSA |OPENSSH )?PRIVATE KEY|(?i:authorization|x-buildbuddy-api-key)\s*[:=]', data)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.boundary.outcome == 'success'
        with:
          name: reviewed-tcp-read-benchstat
          path: ${{ runner.temp }}/tcp-read-stream/results/
          if-no-files-found: error
          retention-days: 30
