name: Recover TCP captures and compare receiver intervals
on:
  push:
    branches: [qualification/tcp-mss-forwarder-captures]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/tcp-mss-forwarder-captures'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the existing native Linux TCP tools
      run: |
        set -euo pipefail
        sudo -n apt-get update -qq
        sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark tcpdump iproute2 iperf3 ethtool bc kmod iputils-ping
        sudo -n modprobe sch_netem
    - name: Retrieve the exact original report and executable artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/mss-forwarder"
        gh api repos/tamird/gvisor/actions/artifacts/13135903972/zip > "$RUNNER_TEMP/mss-forwarder/original.zip"
        gh api repos/tamird/gvisor/actions/artifacts/13137025228/zip > "$RUNNER_TEMP/mss-forwarder/helpers.zip"
    - name: Verify original bytes, capture controls and eight duration pairs
      run: python3 test/rbe/tcp_mss_forwarder.py recover
    - name: Validate the typed publication
      id: privacy
      if: always()
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        GH_TOKEN: ${{ github.token }}
      run: python3 test/rbe/tcp_mss_forwarder.py scan
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.privacy.outcome == 'success' }}
      with:
        name: tcp-mss-forwarder-captures
        path: |
          ${{ runner.temp }}/mss-forwarder/public/build.json
          ${{ runner.temp }}/mss-forwarder/public/result.json
        if-no-files-found: error
