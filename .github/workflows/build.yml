name: Check the published GNU plugin on its external interface
on:
  push:
    branches: [qualification/plugin-gnu-external-traffic]
permissions:
  contents: read
  actions: read
jobs:
  plugin:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: product, fetch-depth: 2, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tamird/bazel-central-registry
          path: registry
          ref: f8f5f201805db9b0c27571f7630cb8a37f3a78d6
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tamird/rules_cc_autoconf
          path: supplier
          ref: b0b4b6c173c4312c14f3c5a427e9e3cb7271143c
          persist-credentials: false
      - name: Pin prerequisites for original-output recovery
        working-directory: product
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/plugin-evidence"
          echo '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/plugin-evidence/result.json"
          test -n "$BUILDBUDDY_API_KEY"
          test "$(git -C ../registry rev-parse HEAD)" = f8f5f201805db9b0c27571f7630cb8a37f3a78d6
          test "$(git -C ../supplier rev-parse HEAD)" = b0b4b6c173c4312c14f3c5a427e9e3cb7271143c
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/'
            # Preserve original non-plugin dependency cache keys. The target
            # itself selects TMPDIR=/tmp inside its declared build environment.
            printf '%s\n' 'build --action_env=TMPDIR=.' 'build --host_action_env=TMPDIR=.'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --override_module=rules_cc_autoconf=%s/supplier\n' "$GITHUB_WORKSPACE"
          } > "$RUNNER_TEMP/sidecar.bazelrc"
          unset BUILDBUDDY_API_KEY
          printf 'PYTHONPATH=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          git fetch -q --no-tags --depth=1 origin fb60e127516defd6aab633f80be09a03022f0737
          for module in qualification_report unit_matrix; do
            git show "fb60e127516defd6aab633f80be09a03022f0737:test/rbe/$module.py" > "$RUNNER_TEMP/$module.py"
          done
      - name: Retrieve the original installed runtime receipt
        working-directory: product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tamird/gvisor/actions/artifacts/13047222365/zip > "$RUNNER_TEMP/original.zip"
          gh api repos/tamird/gvisor/actions/artifacts/13048790798/zip > "$RUNNER_TEMP/actions.zip"
          gh api repos/tamird/gvisor/actions/artifacts/13136054697/zip > "$RUNNER_TEMP/control.zip"
      - name: Recover and install the exact original executables
        id: original
        working-directory: product
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B test/rbe/plugin_programs/traffic_consumer.py stage
      - name: Run TCP and UDP over the bridge with native Linux and the plugin
        if: steps.original.outcome == 'success'
        working-directory: product
        env:
          BUILDBUDDY_API_KEY: ''
        run: python3 -B test/rbe/plugin_programs/traffic_consumer.py traffic
      - name: Check the typed evidence boundary
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "plugin-evidence"
          files = list(folder.iterdir())
          assert {f.name for f in files} in ({"result.json"}, {"result.json", "wire.json"})
          for f in files:
              assert f.is_file() and not f.is_symlink() and f.stat().st_size < 100000
              data = f.read_bytes()
              json.loads(data)
              assert os.environ["KEY"] and os.environ["KEY"].encode() not in data
              assert all(marker not in data.lower() for marker in (b"authorization:", b"bearer ", b"x-buildbuddy-api-key"))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: plugin-gnu-external-payload
          path: |
            ${{ runner.temp }}/plugin-evidence/result.json
            ${{ runner.temp }}/plugin-evidence/wire.json
          if-no-files-found: error
      - name: Require the fresh GNU owner and the matched native control
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          base = Path(os.environ["RUNNER_TEMP"]) / "plugin-evidence"
          r, w = [json.loads((base / name).read_text()) for name in ("result.json", "wire.json")]
          assert r["source"] == os.environ["GITHUB_SHA"] and r["status"] == r["stage"] == r["external"]["status"] == "PASS"
          assert r["case_records"] == r["tests_executed"] == r["passed"] == 1 and r["failed"] == r["skipped"] == 0
          assert r["runtime_markers"] == {"plugin_sentry": True, "plugin_init": True} and r["product_builds"] == 0
          assert set(w) == ({"runsc-qualified-plugin"} if r["native_basis"]["reused"] else {"runc", "runsc-qualified-plugin"})
          for arm in w.values():
              assert arm["ok"] and arm["image"] == r["guest_image"]["image_id"]
              assert set(arm["wire"]) == {"tcp_request", "tcp_reply", "udp_request", "udp_reply"}
          PYTHON
