name: Recover the original VFIO proposal outputs
on:
  push:
    branches: [qualification/plugin-musl-vfio-proposal]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Prepare the existing CAS reader
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/vfio-original-evidence"
          echo '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/vfio-original-evidence/result.json"
          git fetch -q --no-tags --depth=1 origin 7c639344dfffdb686c1952d9e62adbabea8ff2f6
          git show 7c639344dfffdb686c1952d9e62adbabea8ff2f6:test/rbe/plugin_programs/cas_inputs.py > "$RUNNER_TEMP/cas_inputs.py"
          test "$(git hash-object "$RUNNER_TEMP/cas_inputs.py")" = 54047870d2d32c621a5c8616687a74bdc75001d5
          printf 'PYTHONPATH=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "bdb65b4bddb8405a80b3e45a3ef4c740819b151d0709d360e8add8dac534c224  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
      - name: Retrieve the retained producer receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/tamird/gvisor/actions/artifacts/13114535148/zip > "$RUNNER_TEMP/original.zip"
      - name: Inspect original actions and CAS bytes only
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B test/rbe/plugin_vfio_original.py
      - name: Check the exact publication boundary
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "vfio-original-evidence"
          files = list(folder.iterdir())
          assert {f.name for f in files} == {"result.json"}
          f, = files
          assert f.is_file() and not f.is_symlink() and f.stat().st_size < 100000
          data = f.read_bytes()
          json.loads(data)
          assert os.environ["KEY"] and os.environ["KEY"].encode() not in data
          assert all(m not in data.lower() for m in (b"authorization:", b"bearer ", b"x-buildbuddy-api-key"))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: vfio-proposal-original-outputs
          path: ${{ runner.temp }}/vfio-original-evidence/result.json
          if-no-files-found: error
      - name: Require recovered original output proof
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ["RUNNER_TEMP"]) / "vfio-original-evidence/result.json").read_text())
          assert r["status"] == "PASS", r["status"]
          assert r["new_builds"] == r["new_tests"] == 0
          PYTHON
