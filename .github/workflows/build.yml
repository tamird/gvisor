name: Recover the completed LLVM parser invocation
on:
  push:
    branches: [qualification/llvm-original-parser-receipt]
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read the original invocation metadata and allowlisted diagnostics
        env:
          PRODUCT: 0afd5b37e31824e0299c44235ef4cb58af0358ce
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 test/rbe/parser_receipt.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-parser-receipt
          path: ${{ runner.temp }}/parser-receipt
          if-no-files-found: error
