name: Compare protobuf stage-1 generation on ordinary and shell-free workers
on:
  push:
    branches: [qualification/protobuf-stage1-scratch]
permissions:
  contents: read
jobs:
  six-generators:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    env:
      USE_BAZEL_VERSION: 8.8.1
    steps:
      - name: Initialize the evidence bundle
        run: |
          mkdir -p "$RUNNER_TEMP/stage1-evidence"
          echo '{"status":"FAIL","error":"qualification did not finish"}' > "$RUNNER_TEMP/stage1-evidence/verdict.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tamird/protobuf
          ref: a4504c5467dde4ef8ee4a075ee240c54a7da4883
          path: supplier
          fetch-depth: 2
          persist-credentials: false
      - name: Check all six Bazel actions and compare the nine generated files
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 test/rbe/protobuf_stage1_scratch.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: protobuf-stage1-comparison
          path: ${{ runner.temp }}/stage1-evidence/
          if-no-files-found: error
