name: Configure the release with no host tools on PATH
on:
  push:
    branches: [qualification/lean-release-zero-host]
permissions: {contents: read}
jobs:
  linux:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Query release dependencies without building actions
        run: |
          test "$(git rev-parse HEAD^)" = ab32faca2351caa03d67f5463d3b17c3307f8be4
          test "$(git rev-parse HEAD^^)" = d5fe3c2eef21434cbe13e3604f0f070ace4d7edb
          test "$(git rev-parse HEAD^:tools/gazelle-native-environment.patch)" = 99d3fd3d2e7d0d6eb562eff6eb66a553fefb6d72
          cp .github/qualification/lean_release_client.py "$RUNNER_TEMP/lean-client.py"
          git switch --detach d5fe3c2eef21434cbe13e3604f0f070ace4d7edb
          python3 -I -B "$RUNNER_TEMP/lean-client.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clean-client-public-release
          path: ${{ runner.temp }}/lean-client.json
          if-no-files-found: error
          retention-days: 7
