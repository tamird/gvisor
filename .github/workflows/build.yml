name: Recover the original Kind archive handoff
on:
  push:
    branches: [qualification/kind-release-handoff]
permissions:
  contents: read
  actions: read
jobs:
  archive:
    if: github.repository == 'tamird/gvisor' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRODUCT: dab2124cde6f1c76d44ff2af7c297566d86c10f5
      PRODUCER: 2882b32e315991b4063c0baf2aedd40539ce6fd4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 4}
      - name: Bind both original receipts and the real product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 582ed3a3e5c7b579970da9bbc3f393c1d503182d
          test "$(git rev-parse HEAD^^)" = "$PRODUCT"
          mkdir "$RUNNER_TEMP/original" "$RUNNER_TEMP/tools" "$RUNNER_TEMP/witness"
          printf '%s\n' '{"status":"INCOMPLETE","phase":"original-artifacts"}' > "$RUNNER_TEMP/result.json"
          gh api repos/tamird/gvisor/actions/artifacts/13301172607/zip > "$RUNNER_TEMP/first.zip"
          echo "e8ef0988128ece639f0476ac7db37bc7f8278530965cab73a25bb7f7f9beed4b  $RUNNER_TEMP/first.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/first.zip" result.json > "$RUNNER_TEMP/first.json"
          gh api repos/tamird/gvisor/actions/artifacts/13299000441/zip > "$RUNNER_TEMP/original.zip"
          echo "61daebedc7b18692f0d4f1df7f220820fbccdb6a6364a4b710d5d1715e3a03dd  $RUNNER_TEMP/original.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/original.zip" amd64.json -d "$RUNNER_TEMP/original"
          cp .github/qualification/kind_archive.py "$RUNNER_TEMP/tools/witness"
          chmod +x "$RUNNER_TEMP/tools/witness"
          for name in kind kubectl docker bazel; do ln -s witness "$RUNNER_TEMP/tools/$name"; done
          git checkout --detach "$PRODUCT"
          cp test/kubernetes/scripts/run_kind_e2e.sh "$RUNNER_TEMP/run_kind_e2e.sh"
      - name: Fetch the one bounded original output
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, urllib.parse, urllib.request
          tmp = Path(os.environ["RUNNER_TEMP"])
          receipt = json.loads((tmp / "original/amd64.json").read_text())
          p = receipt["packages"]["gvisor.tar.bz2"]
          inv, digest, size = receipt["events"]["invocation"], p["sha256"], p["bytes"]
          assert receipt["status"] == "PASS" and p["verified"] and receipt["source"] == os.environ["PRODUCER"]
          assert (inv,digest,size) == ("38177d3c-dfbe-4d99-a788-21ddf93ae205","f7729cdd7718741dd30d5ecfc930ba15bbfdda157a3828ead35d0c292bf714fc",84291492)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          uri = "bytestream://remote.buildbuddy.io/blobs/" + digest + "/" + str(size)
          url = "https://app.buildbuddy.io/file/download?" + urllib.parse.urlencode(dict(bytestream_url=uri, invocation_id=inv))
          req = urllib.request.Request(url, headers={"x-buildbuddy-api-key":os.environ["ACCESS"]})
          row = {"status":"INCOMPLETE", "phase":"fetch-original", "invocation":inv, "expected_bytes":size, "received_bytes":0}
          output = tmp / "result.json"
          output.write_text(json.dumps(row))
          h = hashlib.sha256()
          try:
              with urllib.request.build_opener(NoRedirect).open(req,timeout=90) as response, (tmp / "retained.tar.bz2").open("xb") as f:
                  for block in iter(lambda:response.read(1<<20),b""):
                      row["received_bytes"] += len(block)
                      assert row["received_bytes"] <= size
                      h.update(block)
                      f.write(block)
              assert h.hexdigest() == digest and row["received_bytes"] == size
          except Exception as e:
              row.update(error=type(e).__name__, http_status=getattr(e, "code", None))
              output.write_text(json.dumps(row))
              raise SystemExit(1)
          PY
      - name: Observe the exact archive at the node-copy boundary without invoking Bazel
        env:
          KIND_RETAINED: '1'
          DOCKER_HOST: unix:///nonexistent/kind.sock
        run: |
          export PATH="$RUNNER_TEMP/tools:$PATH"
          "$RUNNER_TEMP/tools/witness"
      - name: Check the bounded public projection
        id: privacy
        if: always()
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "result.json"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size < 16000
          raw=p.read_bytes()
          assert os.environ["ACCESS"] and all(x not in raw for x in (os.environ["ACCESS"].encode(), b"remote_header", b"bes_header", b"Bearer ", b"Authorization:", b"X-Amz-"))
          json.loads(raw)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: retained-kind-release-archive
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error
