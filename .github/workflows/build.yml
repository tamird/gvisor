name: Check the attachment-owned receive loops on native Linux
on:
  push:
    branches: [qualification/fdbased-attachment-batches]
permissions:
  contents: read
jobs:
  receive:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind the product and qualify the private network namespace
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 95ca4e7317b6418d4ba8674a4f8d96b4c950ae78
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/fdbased_wait.py' ':!pkg/tcpip/link/fdbased/BUILD' ':!pkg/tcpip/link/fdbased/packet_ring_linux_test.go' ':!pkg/tcpip/link/fdbased/receive_lifetime_test.go'
          git fetch --quiet --no-tags --depth=2 https://github.com/tamird/gvisor.git c0e6b2876b97d87503e115d87c905c45926245b9
          test "$(uname -m)" = x86_64
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/bazel" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bazel"
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo
          echo 'namespace=/usr/bin/unshare --user --map-root-user --net --' >> "$GITHUB_ENV"
      - name: Exercise both attachment regressions, packet delivery and live save
        run: python3 .github/qualification/fdbased_wait.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: fdbased-attachment-batches
          path: ${{ runner.temp }}/fdbased-results/
          if-no-files-found: warn
          retention-days: 7
