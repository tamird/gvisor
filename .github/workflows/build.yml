name: Profile a 50,000-file kernel checkpoint
on:
  push:
    branches: [qualification/tmpfs-kernel-profile]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: ${{ github.sha }}
      BASE: aa767e4c43d011121271551fe24da501a56f729d
      SOURCE: d280d49cf180e6443fdba49d57260c3bfd471ff5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 6, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD)" == "$CURRENT" ]]
        test "$(git rev-parse HEAD^)" = "$SOURCE"
        test "$(git rev-parse HEAD~2)" = "$BASE"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /var/run/docker.sock:/var/run/docker.sock -v "$(command -v docker):/usr/local/bin/docker:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Build unchanged benchmark and capture one real tmpfs checkpoint
      timeout-minutes: 42
      run: |
        set -euo pipefail
        d=$RUNNER_TEMP/workload
        mkdir -p "$d/records" "$d/capture"
        chmod 0777 "$d/capture"
        cp test/rbe/tmpfs_profile/measure.py "$d/"
        git checkout --quiet --detach "$SOURCE"
        git diff --quiet
        test "$(git rev-parse HEAD)" = "$SOURCE"
        git rev-parse HEAD > "$d/records/source"
        git rev-parse HEAD:test/benchmarks/checkpointfile/checkpointfile.go > "$d/records/benchmark-blob"
        test "$(cat "$d/records/benchmark-blob")" = "$(git rev-parse "$BASE:test/benchmarks/checkpointfile/checkpointfile.go")"
        common=(--config=x86_64 --spawn_strategy=remote,local --noremote_upload_local_results --strategy=GoStaticAnalysis=local --strategy=GoStandardLibraryAnalysis=local --remote_download_outputs=toplevel --jobs=24)
        runbazel=(docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc")
        trap 'grep -E "Invocation ID:|^ERROR:|TMPFS-|--- FAIL:|panic:|Build did NOT|container_save_restore_test.go:[0-9]+:" "$d/"*.log 2>/dev/null | tail -36 > "$d/records/diagnostics" || true' EXIT
        "${runbazel[@]}" build "${common[@]}" //test/benchmarks/checkpointfile:checkpointfile_test > "$d/build.log" 2>&1
        "${runbazel[@]}" cquery "${common[@]}" --output=files //test/benchmarks/checkpointfile:checkpointfile_test > "$d/path" 2> "$d/query.log"
        grep -E '(^|/)checkpointfile_test$' "$d/path" > "$d/benchpath"
        test "$(wc -l < "$d/benchpath")" -eq 1
        bin="$GITHUB_WORKSPACE/$(cat "$d/benchpath")"
        docker exec tcp-compiler test -x "$bin"
        docker exec tcp-compiler sha256sum "$bin" | awk '{print $1}' > "$d/records/benchmark-sha256"
        rc=0
        "${runbazel[@]}" test "${common[@]}" --strategy=TestRunner=local --test_filter='^TestCheckpointTmpfsTreeForProfile$' --test_env=WORKLOAD_CHECKPOINT_DIR="$d/capture" --test_arg=-test.v --test_sharding_strategy=disabled --nocache_test_results --test_timeout=600 //runsc/container:container_test > "$d/capture.log" 2>&1 || rc=$?
        printf '%d\n' "$rc" > "$d/records/capture-exit"
        docker exec tcp-compiler cat bazel-testlogs/runsc/container/container_test/test.log > "$d/case.log" || true
        grep -E 'TMPFS-|^--- (PASS|FAIL): TestCheckpointTmpfsTreeForProfile' "$d/case.log" > "$d/records/capture.txt" || true
        test "$rc" -eq 0
        grep -q 'TMPFS-VERIFIED 50000' "$d/records/capture.txt"
        grep -q '^--- PASS: TestCheckpointTmpfsTreeForProfile' "$d/records/capture.txt"
        grep -q 'TMPFS-GRAPH kernel=true' "$d/records/capture.txt"
        for stage in save restore; do grep -q "TMPFS-CAP $stage 2147483648" "$d/records/capture.txt"; done
        docker exec tcp-compiler python3 "$d/measure.py" "$d" "$bin" > "$d/measure.log" 2>&1 || { tail -24 "$d/measure.log" | tee "$d/records/benchmark-error"; exit 1; }
    - name: Attribute CPU samples from each measured operation
      run: |
        set -euo pipefail
        d=$RUNNER_TEMP/workload
        for mode in EncodeStatefile DecodeStatefile DecodeGC; do
          why=loadKernel
          if [[ $mode == EncodeStatefile ]]; then why=saveKernel; fi
          out="$d/records/profile-$mode.txt"
          go tool pprof -top -nodecount=22 -nodefraction=0 -focus="checkpointfile\.$why" "$d/private/$mode.pprof" > "$out"
          grep -q 'Duration:' "$out"
          grep -Eq '^Showing nodes accounting for [1-9]' "$out"
          go tool pprof -top -cum -nodecount=30 -nodefraction=0 -focus="checkpointfile\.$why" "$d/private/$mode.pprof" > "$d/records/cumulative-$mode.txt"
        done
        date -u +%FT%T.%3NZ > "$d/records/verdict-at"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: tmpfs-kernel-profile
        path: ${{ runner.temp }}/workload/records/
        if-no-files-found: error
