name: Trace TCP selective acknowledgment accounting
on:
  push:
    branches: [qualification/tcp-sack-live-restore]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 4
      - name: Check one live TCP checkpoint and four peer ACKs
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/checkpoint"
          mkdir -p "$out"
          git checkout --quiet --detach 4b852c98a58160296e64921484f43a3eee8da8ad
          test "$(git rev-parse HEAD)" = 4b852c98a58160296e64921484f43a3eee8da8ad
          test "$(git rev-parse HEAD^)" = da50c9f56d8119f183a0fcf815ba42416a9d751b
          git diff --name-only da50c9f56d8119f183a0fcf815ba42416a9d751b 4b852c98a58160296e64921484f43a3eee8da8ad > "$out/fixture-paths.txt"
          date -u +%FT%TZ > "$out/start"
          rc=0
          bazel test --jobs=4 --test_sharding_strategy=disabled --test_arg=-test.v --test_filter='^TestSACKPacketsAfterLiveRestore$' //pkg/tcpip/transport/tcp/test/e2e:tcp_test > "$out/bazel.log" 2>&1 || rc=$?
          date -u +%FT%TZ > "$out/finished"
          for ext in log xml; do
            f="bazel-testlogs/pkg/tcpip/transport/tcp/test/e2e/tcp_test/test.$ext"
            if test -f "$f"; then cp -L "$f" "$out/test.$ext"; fi
          done
          tail -20 "$out/bazel.log"
          python3 - "$out" "$rc" <<'PY'
          import json, pathlib, re, sys, xml.etree.ElementTree as X
          from datetime import datetime, timezone
          out=pathlib.Path(sys.argv[1]);rc=int(sys.argv[2])
          log=(out/'test.log').read_text() if (out/'test.log').is_file() else ''
          rows=[(k,int(v)) for k,v in re.findall(r'SACK_RESTORE stage=(\S+) count=(-?\d+)',log)]
          cases=[] if not (out/'test.xml').is_file() else [n for n in X.parse(out/'test.xml').findall('.//testcase') if n.get('name')=='TestSACKPacketsAfterLiveRestore']
          ok=rc==0 and len(cases)==1 and all(cases[0].find(x) is None for x in ['skipped','error','failure']) and rows==[('before',1),('reset',0),('reinstate',1),('drain',0)]
          v={'status':'pass' if ok else 'incomplete' if not cases else 'fail','source':'da50c9f56d8119f183a0fcf815ba42416a9d751b','fixture':'4b852c98a58160296e64921484f43a3eee8da8ad','source_delta':(out/'fixture-paths.txt').read_text().splitlines(),'expected':['//pkg/tcpip/transport/tcp/test/e2e:tcp_test/TestSACKPacketsAfterLiveRestore'],'executed':len(cases),'bazel_exit':rc,'observations':rows,'skips':0 if not cases else sum(n.find('skipped') is not None for n in cases),'finished':(out/'finished').read_text().strip(),'verified':datetime.now(timezone.utc).isoformat()}
          (out/'verdict.json').write_text(json.dumps(v,indent=2));print(v);sys.exit(not ok)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sack-live-checkpoint
          path: ${{ runner.temp }}/checkpoint
