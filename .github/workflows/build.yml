name: Read the original RSEQ linker diagnostic
on:
  push:
    branches: [qualification/rseq-original-stderr]
permissions:
  contents: read
  actions: read
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Stage the source-bound reader and existing fixed-origin client
        run: |
          set -eu
          umask 077
          task="$RUNNER_TEMP/release-rbe"
          mkdir -p "$task/harness" "$task/public"
          test "$(git rev-parse HEAD:test/rbe/release_prewarmer/original_stderr.py)" = 58e55a76d6e52e4900c6a981522e5a50dcbad280
          cp test/rbe/release_prewarmer/original_stderr.py "$task/harness/"
          echo '8274275ef9cf5a547e17044693bdf220e0cfc3be0f708dbf593f390eb9e5181a  '"$task/harness/original_stderr.py" | sha256sum -c -
          git fetch --quiet --depth=1 https://github.com/tamird/gvisor.git 7aa5d441a1078a4e9e77547a2a56e23faa6fc238
          test "$(git rev-parse 7aa5d441a:test/rbe/plugin_programs/cas_inputs.py)" = 54047870d2d32c621a5c8616687a74bdc75001d5
          git show 7aa5d441a:test/rbe/plugin_programs/cas_inputs.py > "$task/harness/cas_inputs.py"
      - name: Retrieve the immutable original typed receipt
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/tamird/gvisor/actions/artifacts/13408670826/zip > "$RUNNER_TEMP/release-rbe/original.zip"
      - name: Read only the exact original 484-byte stderr
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B "$RUNNER_TEMP/release-rbe/harness/original_stderr.py"
      - name: Check the bounded typed result
        id: privacy
        if: always()
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "release-rbe" / "public"
          paths = list(root.iterdir())
          assert len(paths) == 1 and paths[0].name == 'original-stderr.json'
          path = paths[0]
          assert path.is_file() and not path.is_symlink() and path.stat().st_size < 8192
          raw = path.read_bytes()
          assert isinstance(json.loads(raw), dict)
          key = os.environ['ACCESS'].encode()
          assert key and not any(value in raw for value in (key, b'remote_header', b'bes_header', b'Authorization:', b'Bearer ', b'X-Amz-Signature'))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: original-rseq-stderr
          path: ${{ runner.temp }}/release-rbe/public/*.json
          if-no-files-found: error
          retention-days: 14
