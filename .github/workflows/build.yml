name: Read original compiler stderr
on:
  push:
    branches: [qualification/recover-protobuf-f68018e9]
permissions: {contents: read}
jobs:
  diagnostic:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Recover only the failed compiler stderr
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 -B .github/qualification/epoll/compiler_failure.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: original-compiler-diagnostic
        path: original-compiler-diagnostic.json
