name: State schema performance

"on":
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remote-qualification:
    if: github.repository == 'tamird/gvisor' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qualification/state-schema-ownership-actions'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - name: Checkout the triggering method commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Run the fixed paired comparison
      timeout-minutes: 43
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        : "${BUILDBUDDY_API_KEY:?Configure the BUILDBUDDY_API_KEY repository secret}"
        export BUILDBUDDY_ARTIFACTS_DIRECTORY="$RUNNER_TEMP/qualification"
        mkdir -p "$BUILDBUDDY_ARTIFACTS_DIRECTORY"
        method="$RUNNER_TEMP/state-schema-performance.sh"
        export STATE_PERFORMANCE_CREDENTIAL_RC
        STATE_PERFORMANCE_CREDENTIAL_RC=$(mktemp "$RUNNER_TEMP/state-schema-credential.XXXXXX")
        finish() {
          local result=$? cleanup_status=0
          trap - EXIT
          rm -f -- "$STATE_PERFORMANCE_CREDENTIAL_RC" "$method" || cleanup_status=$?
          printf '%d\n' "$result" > "$BUILDBUDDY_ARTIFACTS_DIRECTORY/workflow-primary-exit.txt" || cleanup_status=1
          printf '%d\n' "$cleanup_status" > "$BUILDBUDDY_ARTIFACTS_DIRECTORY/workflow-cleanup-exit.txt" || cleanup_status=1
          if (( result == 0 && cleanup_status != 0 )); then result=$cleanup_status; fi
          exit "$result"
        }
        trap finish EXIT
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        cp test/rbe/state_schema_performance.sh "$method"
        cp "$method" "$BUILDBUDDY_ARTIFACTS_DIRECTORY/method.sh"
        cp .github/workflows/build.yml "$BUILDBUDDY_ARTIFACTS_DIRECTORY/workflow.yml"
        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path

        root = Path(os.environ['BUILDBUDDY_ARTIFACTS_DIRECTORY'])
        keys = ('GITHUB_SERVER_URL', 'GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_REF',
                'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH',
                'ImageOS', 'ImageVersion')
        record = {key: os.environ.get(key) for key in keys}
        record['measuredSource'] = 'fc2b6b435b97fed95b4c41fd5c39a535f2dee6e2'
        record['beforeSource'] = '6212e4f7b92d3090be49c21a376f1e53b7e79ce5'
        record['methodSHA256'] = hashlib.sha256((root / 'method.sh').read_bytes()).hexdigest()
        record['workflowSHA256'] = hashlib.sha256((root / 'workflow.yml').read_bytes()).hexdigest()
        (root / 'actions-identity.json').write_text(json.dumps(record, indent=2) + '\n')
        PY
        # Keep workflow changes outside the measured 48-path source comparison.
        measured_source=fc2b6b435b97fed95b4c41fd5c39a535f2dee6e2
        if ! git cat-file -e "$measured_source^{commit}" 2>/dev/null; then
          timeout --signal=TERM --kill-after=5s 60s git fetch --no-tags --depth=1 origin "$measured_source"
        fi
        timeout --signal=TERM --kill-after=5s 30s git checkout --detach "$measured_source"
        test "$(git rev-parse HEAD)" = "$measured_source"
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(<images/default/bazelversion)
        command -v bazelisk
        # Use the canonical Actions RBE endpoints and operation-scoped secret.
        # This RC is never copied into the artifact directory.
        {
          printf '%s\n' \
            'build:buildbuddy_remote_executor --remote_executor=grpcs://remote.buildbuddy.io' \
            'build:buildbuddy_remote_executor --remote_cache=grpcs://remote.buildbuddy.io' \
            'build:buildbuddy_remote_executor --bes_backend=grpcs://remote.buildbuddy.io' \
            'build:buildbuddy_remote_executor --bes_results_url=https://app.buildbuddy.io/invocation/'
          printf 'build:buildbuddy_remote_executor --build_metadata=COMMIT_SHA=%s\n' "$measured_source"
          printf 'build:buildbuddy_remote_executor --build_metadata=REPO_URL=%s/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
          printf 'build:buildbuddy_remote_executor --build_metadata=BRANCH_NAME=%s\n' "$GITHUB_REF_NAME"
          printf 'build:buildbuddy_remote_executor --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build:buildbuddy_remote_executor --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$STATE_PERFORMANCE_CREDENTIAL_RC"
        unset BUILDBUDDY_API_KEY
        bash "$method"

    - name: Retain original comparison evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: state-schema-performance-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/qualification
        if-no-files-found: error
