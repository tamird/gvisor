name: Check TCP close after both directions shut down
on:
  push:
    branches: [qualification/tcp-close-sequence-recheck]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: 254c8ddfcc97180f83ba6454db22afb6235b5df3
      TEST_ARCH: x86_64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        cp test/rbe/tcp-poll-recovery.py "$RUNNER_TEMP/receipt.py"
        mkdir -p "$RUNNER_TEMP/tcp-evidence"
        echo '{"verified":false,"reason":"checks incomplete"}' > "$RUNNER_TEMP/tcp-evidence/verdict.json"
        git fetch -q --depth=1 https://github.com/tamird/gvisor.git "$PRODUCT"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu' 'build --local_resources=cpu=1' 'build --strategy_regexp=^Analyzing.(@@)?//pkg/abi/(linux:linux|nvgpu:nvgpu)$=local'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
        docker exec tcp-compiler python3 -c 'import socket; s=socket.socket(socket.AF_INET6); s.bind(("::1",0)); print(s.getsockname())' > "$RUNNER_TEMP/records/native-ipv6"
    - name: Run the corrected packet owner and its two analyzers
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$PRODUCT"
        [[ "$(git rev-parse HEAD)" == "$PRODUCT" ]]
        for name in owners analysis; do
          d="$RUNNER_TEMP/tcp-evidence/$name"; mkdir -p "$d"
          python3 "$RUNNER_TEMP/receipt.py" labels "$name" > "$d/labels"
          mapfile -t labels < "$d/labels"; (( ${#labels[@]} > 0 ))
          args=(); if [[ "$name" == owners ]]; then args+=(--test_arg=-test.v); fi
          date -u +%FT%TZ > "$d/start"; code=0
          docker exec tcp-compiler timeout --kill-after=45s 35m bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=64 --keep_going --build_tag_filters= --test_tag_filters= --noremote_local_fallback --nocache_test_results --test_output=errors --test_sharding_strategy=disabled --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --build_event_json_file="$d/bep" "${args[@]}" "${labels[@]}" > "$d/log" 2>&1 || code=$?
          printf '%s\n' "$code" > "$d/exit"; date -u +%FT%TZ > "$d/end"
          docker exec -e PRODUCT="$PRODUCT" -e RUNNER_TEMP="$RUNNER_TEMP" -e TEST_ARCH="$TEST_ARCH" tcp-compiler python3 "$RUNNER_TEMP/receipt.py" inspect "$name"
        done
        python3 "$RUNNER_TEMP/receipt.py" finish
    - name: Remove credentials from bounded diagnostics
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key = os.environ["BB_KEY"].encode()
        for record in (Path(os.environ["RUNNER_TEMP"]) / "tcp-evidence").glob("*.json"):
            data = record.read_bytes()
            if key and key in data:
                record.write_bytes(data.replace(key, b"[redacted]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: tcp-close-packet-and-analyzers
        path: |
          ${{ runner.temp }}/tcp-evidence/*.json
        if-no-files-found: error
