name: Recover the failed Nogo analyzers from their original actions
on:
  push:
    branches: [qualification/scratch-nogo-original]
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Read the one failed remote command and its executable
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 709cd18c362576aaea12aa6d36c72034dbe001c8
          test -n "$ACCESS"
          umask 077
          env -i PATH="$PATH" ACCESS="$ACCESS" python3 -B .github/qualification/original_nogo.py "$RUNNER_TEMP/nogo.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-nogo-start
          path: ${{ runner.temp }}/nogo.json
          if-no-files-found: error
          retention-days: 5
