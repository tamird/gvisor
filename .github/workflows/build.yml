name: Qualify the native target and worker of each mixed presubmit family
"on":
  push:
    branches: [qualification/mixed-presubmit-native-targets]
permissions: {}
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Check out the public source and pinned Bazel client
        id: source
        env:
          SOURCE: 1dfd7e45f54fbeb7a93d801bd04d893b43bb0100
        run: |
          set -eu
          work="$RUNNER_TEMP/native-graph"
          mkdir -p "$work/results"
          git init -q .
          GIT_TERMINAL_PROMPT=0 git fetch -q --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD^)" = "$SOURCE"
          test "$(git rev-parse FETCH_HEAD~2)" = 493a1a89937e667a41381dcceb66442333c5f309
          git diff --exit-code "$SOURCE" FETCH_HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/native_graph.py' ':!.github/qualification/families.py'
          git show 'FETCH_HEAD:.github/qualification/native_graph.py' > "$work/native_graph.py"
          git show 'FETCH_HEAD:.github/qualification/families.py' > "$work/families.py"
          git checkout -q --detach "$SOURCE"
          test "$(cat .bazelversion)" = 9.3.1
          curl --proto '=https' --proto-redir '=https' -fsSL --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$work/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $work/bazel" | sha256sum -c -
          chmod 755 "$work/bazel"
      - name: Verify public ARM64 controls and the compiled inputs of the Skylib build test
        id: preflight
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -EsB "$RUNNER_TEMP/native-graph/families.py" preflight
      - name: Check every native test shard, size, target platform and worker assignment
        id: graph
        if: always() && !cancelled() && steps.source.outcome == 'success'
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$RUNNER_TEMP/native-graph/native_graph.py"
      - name: Run the 21 newly selected owners and AMD64 control on their native workers
        id: physical
        if: success() && steps.preflight.outcome == 'success' && steps.graph.outcome == 'success'
        timeout-minutes: 55
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          : "${BUILDBUDDY_API_KEY:?missing fork key}"
          work="$RUNNER_TEMP/native-graph"
          rc="$work/remote.rc"
          trap 'rm -f "$rc"' EXIT
          cat > "$rc" <<'RC'
          build:source-presubmit-mixed --remote_executor=grpcs://remote.buildbuddy.io
          build:source-presubmit-mixed --remote_cache=grpcs://remote.buildbuddy.io
          build:source-presubmit-mixed --bes_backend=grpcs://remote.buildbuddy.io
          build:source-presubmit-mixed --bes_results_url=https://app.buildbuddy.io/invocation/
          RC
          printf 'build:source-presubmit-mixed --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          unset BUILDBUDDY_API_KEY
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -EsB "$work/families.py" execute
      - name: Verify fresh test results, worker identities, and the ARM64 integration binary
        if: always() && !cancelled() && steps.graph.outcome == 'success' && steps.physical.outcome != 'skipped'
        run: |
          work="$RUNNER_TEMP/native-graph"
          test ! -e "$work/remote.rc"
          test -s "$work/physical.bep"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -EsB "$work/families.py" collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: mixed-source-presubmit-native-targets
          path: ${{ runner.temp }}/native-graph/results/*.json
          if-no-files-found: error
          retention-days: 14
