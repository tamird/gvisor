name: Verify overlay poll lifetime and cost
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/overlay-poll-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      STOCK: da75cb7209560b5bada6f4c4b291d6ff928ae911
      MAP: b676b287a3430dda53742b46ced77ba110b2be50
      FIXED: 296a5e2d83542e917b570aa8e1c94e775dc6d6e9
      BENCHTOOL: 2b51abee8530385431b7225198fdd5cd65e78696
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Preserve the original compiler and checkpoint diagnostics
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        dir=$RUNNER_TEMP/overlay-proof; mkdir -p "$dir"
        python3 test/rbe/overlay_report/original_diagnostics.py >"$dir/original.txt"
        cat "$dir/original.txt"
        cp test/rbe/overlay_report/benchinputs.py "$RUNNER_TEMP/"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: overlay-original-verdicts
        path: ${{ runner.temp }}/overlay-proof/original.txt
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=3 origin "$STOCK" "$MAP" "$FIXED" "$BENCHTOOL"
        [[ $(git rev-parse HEAD^) == "$FIXED" ]]
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Run the three previously unexecuted cost and refcount arms
      shell: bash
      run: |
        set -euo pipefail
        for lane in stock map fixed; do
          case $lane in stock) rev=$STOCK;; map) rev=$MAP;; fixed) rev=$FIXED;; esac
          git checkout --quiet --detach "$rev"; [[ $(git rev-parse HEAD) == "$rev" ]]
          out="$RUNNER_TEMP/overlay-proof/$lane-cost"; mkdir -p "$out"; rc=0
          printf '%s\n' "$rev" >"$out/commit"
          bazelisk --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=48 --strategy=TestRunner=local --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=all --test_sharding_strategy=disabled --test_arg=-test.v '--test_arg=-test.run=^(TestOverlayPollCost|TestOverlayLowerPollLifetime)$' //pkg/sentry/syscalls/linux:linux_test >"$RUNNER_TEMP/bazel-cost.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" >"$out/exit"
          logfile=bazel-testlogs/pkg/sentry/syscalls/linux/linux_test/test.log
          if [[ -f "$logfile" ]]; then grep -E '^BenchmarkOverlayPoll/|--- (PASS|FAIL): TestOverlay|lower refs=|original lower|old lower|released waiter|missing live lower|removed first waiter|last lower waiter' "$logfile" >"$out/receipt" || true; fi
          grep -E 'INFO: Invocation ID:|^ERROR:|Build (did NOT complete|completed)|overlay_poll_waiter_test[.]go:[0-9]+:[0-9]+:' "$RUNNER_TEMP/bazel-cost.log" | tail -20 >>"$out/receipt" || true
          printf '%s exit=%s\n' "$lane" "$rc"; grep -Ev '^BenchmarkOverlayPoll/' "$out/receipt" | tail -10
        done
        python3 "$RUNNER_TEMP/benchinputs.py" "$RUNNER_TEMP/overlay-proof" "$RUNNER_TEMP/overlay-proof"
        for lane in map fixed; do [[ $(cat "$RUNNER_TEMP/overlay-proof/$lane-cost/exit") == 0 ]]; grep -q -- '--- PASS: TestOverlayLowerPollLifetime' "$RUNNER_TEMP/overlay-proof/$lane-cost/receipt"; done
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: overlay-cost-and-lifetime
        path: |
          ${{ runner.temp }}/overlay-proof/*-cost/
          ${{ runner.temp }}/overlay-proof/*.bench
    - name: Format the complete samples with pinned benchstat
      shell: bash
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$BENCHTOOL"
        tgt=@org_golang_x_perf//cmd/benchstat
        baz=(bazelisk --bazelrc="$RUNNER_TEMP/overlay.bazelrc")
        "${baz[@]}" build -c opt --config=x86_64 --jobs=60 --remote_download_outputs=toplevel "$tgt" > "$RUNNER_TEMP/benchtool.log" 2>&1 || { grep -E '^ERROR:|Invocation ID:' "$RUNNER_TEMP/benchtool.log" | tail -5; exit 1; }
        "${baz[@]}" cquery -c opt --config=x86_64 --output=files "$tgt" > "$RUNNER_TEMP/tools" 2>"$RUNNER_TEMP/tools.log"
        mapfile -t bins < <(while IFS= read -r f; do [[ ! -f $f || ! -x $f ]] || echo "$f"; done <"$RUNNER_TEMP/tools"); [[ ${#bins[@]} == 1 ]]
        tool=$PWD/${bins[0]}; cd "$RUNNER_TEMP/overlay-proof"
        "$tool" stock.bench map.bench fixed.bench >benchstat.txt
        "$tool" map.bench fixed.bench >map-fixed.txt
        sha256sum "$tool" | cut -d' ' -f1 >tool.sha256
        cat benchstat.txt
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: overlay-benchstat
        path: |
          ${{ runner.temp }}/overlay-proof/benchstat.txt
          ${{ runner.temp }}/overlay-proof/map-fixed.txt
          ${{ runner.temp }}/overlay-proof/tool.sha256
    - name: Run only the missing analyzer against the product tree
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$FIXED"; git checkout --quiet --detach HEAD^; [[ $(git rev-parse HEAD) == 84a21e699e533ce807970ffb29842095ce878a7f ]]
        git checkout --quiet --detach HEAD^; [[ $(git rev-parse HEAD) == d762dbd75de6b7232bd2efbbac5a576324c402ca ]]
        out=$RUNNER_TEMP/overlay-proof/nogo; mkdir -p "$out"; rc=0
        timeout --signal=INT --kill-after=40s 74m bazelisk --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=4 --strategy=GoStdlib=linux-sandbox --strategy=GoStdlibList=linux-sandbox --strategy=GoStandardLibraryAnalysis=linux-sandbox --strategy=GoStaticAnalysis=linux-sandbox '--modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' --nocache_test_results --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=errors --build_event_json_file_path_conversion=false --build_event_json_file="$RUNNER_TEMP/nogo.jsonl" //pkg/sentry/fsimpl/overlay:overlay_nogo > "$RUNNER_TEMP/nogo.log" 2>&1 || rc=$?
        git rev-parse HEAD >"$out/commit"; printf '%s\n' "$rc" >"$out/exit"
        grep -E 'INFO: Invocation ID:|Build (did NOT complete|completed)|^ERROR:|overlay_nogo.*(PASSED|FAILED)|regular_file[.]go:[0-9]+' "$RUNNER_TEMP/nogo.log" | tail -16 >"$out/receipt" || true
        cat "$out/receipt"; [[ $rc == 0 ]]; grep -q 'overlay_nogo.*PASSED' "$out/receipt"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: overlay-analyzer
        path: ${{ runner.temp }}/overlay-proof/nogo/
    - name: Clear ephemeral RBE settings
      if: always()
      run: rm -f "$RUNNER_TEMP/overlay.bazelrc"
