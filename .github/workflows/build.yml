name: Compare the native ARM64 runsc ELF with Bazel output path mapping
on:
  push:
    branches: [qualification/arm64-runsc-output-paths]
permissions: {contents: read}
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the original public runsc, version and native architecture transition
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mapped-runsc"
          mkdir -m 700 "$d"
          test "$(uname -m)" = aarch64
          source=bb983b988802b854bd03dd7a0a5220e7e7b4440e
          test "$(git rev-parse HEAD^)" = "$source"
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/mapped_runsc/**' ':!test/rbe/release_prewarmer/**'
          sha256sum --check <<'SUMS'
          655b5bff434c5024b1fc6f3712241d3027d2cea5ed63f70517d775270cd7bb7a  test/rbe/release_prewarmer/native.bzl
          061a1178b5937611110ee473f3d77987a420437d474d5569efe0c6d159913f23  test/rbe/release_prewarmer/BUILD
          SUMS
          cp .github/qualification/mapped_runsc/{elf.py,report.py} test/rbe/release_prewarmer/{BUILD,native.bzl} "$d/"
          git checkout --quiet --detach "$source"
          mkdir -p test/rbe/release_prewarmer
          cp "$d/"{BUILD,native.bzl} test/rbe/release_prewarmer/
          cat >>test/rbe/release_prewarmer/BUILD <<'BUILD'
          native_release(
              name = "cli_only",
              arch = "arm64",
              archive = "//runsc",
              runsc = "//runsc",
              sentry = "//runsc",
          )
          BUILD
          git diff --exit-code HEAD
          test "$(git ls-files --others --exclude-standard)" = "$(printf '%s\n' test/rbe/release_prewarmer/BUILD test/rbe/release_prewarmer/native.bzl)"
          test "$(tools/workspace_status.sh)" = "STABLE_VERSION bb983b988802"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --max-time 100 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-arm64 -o "$d/bazel"
          echo "bb608519a440d45d10304eb684a73a2b6bb7699c5b0e5434361661b25f113a5d  $d/bazel" | sha256sum --check
          chmod 755 "$d/bazel"
          test "$("$d/bazel" --version)" = 'bazel 9.3.1'
      - name: Build and inspect exactly the two native ARM64 runsc configurations
        run: python3 -EsB "$RUNNER_TEMP/mapped-runsc/report.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !cancelled()
        with:
          name: mapped-runsc
          path: ${{ runner.temp }}/mapped-runsc/result.json
          if-no-files-found: warn
