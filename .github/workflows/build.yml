name: Read the three original source failure records
on:
  push:
    branches: [qualification/source-presubmit-first-cpp-failure]
permissions: {contents: read}
jobs:
  retrieve:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify parser, original invocation, and source code
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = c17c75a75a8ac1bac84d5369d8050f84ce8b5bff
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/three_source_failures.py'
          cp .github/qualification/three_source_failures.py "$RUNNER_TEMP/"
          echo "e8e678e77c5ecb816da2eb33b07f5c6e365648ea4fb36fadf6597f276b02c49d  $RUNNER_TEMP/three_source_failures.py" | sha256sum -c
      - name: Retrieve the exact C++ stderr and two test logs
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          python3 -IB "$RUNNER_TEMP/three_source_failures.py"
      - name: Validate the closed receipt
        id: validate
        if: always()
        run: |
          python3 -IB - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"closed-source-failures.json"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size<70000
          b=p.read_bytes()
          assert not re.search(rb"(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}",b)
          r=json.loads(b); assert r["invocation"]=="2e8e8f7d-8d06-4b9e-83c6-e6134aaf7924"
          assert set(r["blobs"])=={"cstate_wake_probe","sandbox_test","netgofer_test"}
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.validate.outcome == 'success'
        with:
          name: original-source-failures
          path: ${{ runner.temp }}/closed-source-failures.json
          if-no-files-found: error
          retention-days: 14
      - name: Require exact CAS returns
        if: steps.validate.outcome == 'success'
        run: |
          python3 -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"closed-source-failures.json").read_text()); assert all(b.get("verified") for b in r["blobs"].values())'
