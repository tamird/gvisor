name: Compare wire and graph checkpoints of four Nginx workers
on:
  push:
    branches: [qualification/state-nginx-live-checkpoint]
permissions: {}
jobs:
  measure:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    steps:
    - name: Bind the gVisor release source, benchmark harness, and public dependencies
      run: |
        set -euo pipefail
        w="$RUNNER_TEMP/state-working-set"
        mkdir -p "$w/src" "$w/results"
        echo '{"build_verified":false,"stage":"setup"}' > "$w/results/build.json"
        cd "$w/src"
        git init -q
        helper=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
        seeds=a7cc851b17555ce6daec1391e6e3591270342bdc
        s=451b92800b9cb82262dc8a735388f7cf4d17d895
        parent=c6010aa935b53b01499c65e333a88975e8066259
        git -c gc.auto=0 fetch -q --no-auto-maintenance --no-tags --depth=2 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$s" "$helper" "$seeds"
        test "$(git rev-parse "$GITHUB_SHA^")" = "$parent"
        git diff --exit-code "$parent" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!.github/qualification/state_working_set/build.py' ':!.github/qualification/state_working_set/measure.py'
        test "$(git rev-parse "$seeds:.github/qualification/tldk_queue_seeds.json")" = b8f4e0994d4a51afa05ee61162a9eeddb7dcecee
        git show "$seeds:.github/qualification/tldk_queue_seeds.json" > "$w/seeds.json"
        test "$(git rev-parse "$helper:.github/qualification/recvbuf_deps.py")" = 9a3f571087a1438113a3a067c300e26fcb0ca9e8
        git show "$helper:.github/qualification/recvbuf_deps.py" > "$w/public_assets.py"
        for f in build.py measure.py isolate.sh benchstat.module; do
          git show "$GITHUB_SHA:.github/qualification/state_working_set/$f" > "$w/$f"
        done
        git checkout -q --detach "$s"
        test "$(cat .bazelversion)" = 9.3.1
        sudo -n apt-get -qq update
        sudo -n apt-get -qq install --no-install-recommends -y build-essential crossbuild-essential-arm64 libnuma-dev
        curl -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
        echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $w/bazel" | sha256sum -c -
        chmod 755 "$w/bazel"
    - name: Prove a dedicated writable cgroup namespace before compiling
      run: |
        w="$RUNNER_TEMP/state-working-set"
        unit="state-quarter-preflight-$GITHUB_RUN_ID"
        sudo -n systemd-run --wait --pipe --collect --service-type=exec --unit="$unit" -p Delegate=yes \
          /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root RUNNER_TEMP="$RUNNER_TEMP" UNIT="$unit" \
          /bin/bash "$w/isolate.sh" preflight
    - name: Export gVisor's pinned benchmark image
      run: |
        set -euo pipefail
        w="$RUNNER_TEMP/state-working-set"
        src=us-central1-docker.pkg.dev/gvisor-presubmit/gvisor-presubmit-images/benchmarks/nginx_x86_64@sha256:31c649d512cced4f7dd414fd05cfa9bb7416ee37575caeba46cc1e9b56aef163
        docker pull "$src"
        docker image inspect --format='{{.Id}}' "$src" > "$w/image-config"
        test "$(cat "$w/image-config")" = sha256:5f9e05caa37420ad50b7ccf873ea117fcbd8cff24b3fcb689cb904bcab624cf5
        id="$(docker create "$src")"
        trap 'docker rm "$id" >/dev/null' EXIT
        mkdir -p "$w/bundle/rootfs"
        docker export "$id" | sudo -n tar --numeric-owner -xf - -C "$w/bundle/rootfs"
    - name: Build the original release and pinned benchstat on Linux
      run: |
        set -euo pipefail
        w="$RUNNER_TEMP/state-working-set"
        cd "$w/src"
        env -i HOME="$HOME" PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB - <<'PYBUILD'
        import json, os, sys
        from pathlib import Path
        work = Path(os.environ["RUNNER_TEMP"]) / "state-working-set"
        sys.path.insert(0, str(work))
        import public_assets as assets
        import build
        assets.DIST = work / "dist"
        assets.DIST.mkdir()
        report = {"registry": assets.REGISTRY, "assets": [], "unavailable": []}
        for module, version, sha, asset_id in json.loads((work / "seeds.json").read_bytes()):
            try:
                info = assets.acquire(module, version, pinned=sha, asset_id=asset_id)
                if info:
                    report["assets"].append(info)
            except (OSError, ValueError, KeyError, AssertionError) as error:
                report["unavailable"].append([module, version, type(error).__name__])
        (work / "results/public-seeds.json").write_text(json.dumps(report))
        build.build()
        PYBUILD
        "$w/bazel" --nosystem_rc --nohome_rc shutdown
    - name: Measure checkpoint, restore, and the first complete HTTP response
      run: |
        w="$RUNNER_TEMP/state-working-set"
        unit="state-quarter-measure-$GITHUB_RUN_ID"
        sudo -n systemd-run --wait --pipe --collect --service-type=exec --unit="$unit" -p Delegate=yes \
          /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root RUNNER_TEMP="$RUNNER_TEMP" UNIT="$unit" \
          /bin/bash "$w/isolate.sh" measure
    - name: Compare all three policies with pinned benchstat
      run: |
        set -euo pipefail
        w="$RUNNER_TEMP/state-working-set"
        cd "$w/results"
        "$w/benchstat" wire.txt graph.txt > benchstat.txt
        for c in unlimited oci-quarter; do
          for m in command sandbox_cpu; do
            grep -q "Checkpoint/$c/$m " benchstat.txt
          done
        done
        for c in unlimited oci-quarter ancestor-quarter; do
          for m in restore_command through_first_http_response restore_group_cpu; do
            grep -q "Restore/$c/$m " benchstat.txt
          done
        done
        cat benchstat.txt
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && !cancelled()
      with:
        name: state-nginx-checkpoint-and-first-response
        path: |
          ${{ runner.temp }}/state-working-set/results/ancestors-*.json
          ${{ runner.temp }}/state-working-set/results/delegation.json
          ${{ runner.temp }}/state-working-set/results/assets.json
          ${{ runner.temp }}/state-working-set/results/public-seeds.json
          ${{ runner.temp }}/state-working-set/results/build.json
          ${{ runner.temp }}/state-working-set/results/measurements.json
          ${{ runner.temp }}/state-working-set/results/wire.txt
          ${{ runner.temp }}/state-working-set/results/graph.txt
          ${{ runner.temp }}/state-working-set/results/benchstat.txt
        if-no-files-found: error
        retention-days: 14
