name: Check the Buildkite Python release producer
on:
  push:
    branches: [qualification/buildkite-python-native-producer]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Select the retained release outputs and pinned Bazel launcher
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -eu
          cp test/rbe/buildkite_python_producer.py "$RUNNER_TEMP/producer.py"
          gh api repos/tamird/gvisor/actions/artifacts/13065956385/zip > "$RUNNER_TEMP/make.zip"
          mkdir -p "$RUNNER_TEMP/pinned"
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/pinned/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/pinned/bazel" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/pinned/bazel"
          echo "$RUNNER_TEMP/pinned" >> "$GITHUB_PATH"
      - name: Run the old and new Buildkite commands without Docker or publishing
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --config=x86_64' 'build --lockfile_mode=off'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/sidecar.bazelrc"
          unset BUILDBUDDY_API_KEY
          /usr/bin/python3 "$RUNNER_TEMP/producer.py"
      - name: Check the single public receipt
        if: always()
        id: privacy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          /usr/bin/python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "producer.json"
          assert p.is_file() and not p.is_symlink()
          data = p.read_bytes()
          json.loads(data)
          assert not any(s in data for s in (b"remote_header", b"bes_header", b"x-buildbuddy", b"CI_TOKEN", os.environ["BUILDBUDDY_API_KEY"].encode()))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: buildkite-python-producer
          path: ${{ runner.temp }}/producer.json
          if-no-files-found: error
