name: Check declared Buildifier config and Bazel filenames
on: workflow_dispatch
permissions:
  contents: read
jobs:
  buildifier:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: carrier, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: source, ref: 6946292a2275252009256d882c44900419ff0934, persist-credentials: false}
      - name: Check the unchanged supplier on two empty workers
        working-directory: source
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          export PROOF_RC="$RUNNER_TEMP/buildifier.bazelrc"
          p="$RUNNER_TEMP/buildifier_platforms"
          mkdir "$p"
          cp ../carrier/.github/qualification/buildifier-declared/platform.BUILD "$p/BUILD.bazel"
          echo 'module(name = "buildifier_platforms")' > "$p/MODULE.bazel"
          umask 077
          trap 'rm -f "$PROOF_RC"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --remote_download_outputs=toplevel' "build --inject_repository=buildifier_platforms=$p"
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$PROOF_RC"
          unset BUILDBUDDY_API_KEY
          python3 -B ../carrier/.github/qualification/buildifier-declared/check.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: buildifier-declared
          path: ${{ runner.temp }}/buildifier-result.json
          if-no-files-found: error
