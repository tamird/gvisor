name: Check short echo exchanges with real Docker in the public July Sentry
on:
  push:
    branches: [qualification/tcp-july-dind-closers]
permissions: {contents: read}
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Stage immutable public Linux packages outside the sandbox
        run: |
          set -euo pipefail
          phase=source
          trap 'printf "%s %s\n" "$phase" "$?" > "$RUNNER_TEMP/dind-setup"' EXIT
          test "$(git rev-parse HEAD^)" = a723461aec54e041222511c98f6a1f61442ccb3d
          p=test/rtnetlink/linux
          phase=july-package
          base=https://storage.googleapis.com/gvisor/releases/pool/20260727.0/binary-amd64
          curl -fsSL --retry 2 "$base/runsc.deb" -o "$p/july.deb"
          echo "386bdc2196fc600b68ff8dafdd8ecdc6a8e033ecf9cfa9dfab61ec1b389da307  $p/july.deb" | sha256sum -c
          stage_image() {
            local name="$1" manifest="$2" id="$3"; shift 3
            for registry in mirror.gcr.io docker.io; do
              if docker pull --platform linux/amd64 "$registry/library/$name@$manifest"; then
                test "$(docker image inspect -f '{{.Id}}' "$registry/library/$name@$manifest")" = "$id"
                return
              fi
            done
            return 1
          }
          phase=docker-image
          dind=sha256:d2dc198f7d839eae26b5a9cb0e7cdc4e2c97d9cb4ea66dbeb0a4c0c7f0b165f8
          stage_image docker sha256:f649ef046008ca7f926a2571c32b0ac22e5c59eb61b959617f9acc2a4c638cf5 "$dind"
          container="$(docker create --network none "$dind")"
          docker export -o "$p/dind-rootfs.tar" "$container"
          docker rm -v "$container"
          phase=python-image
          py=sha256:38fd5a425aa93b06d367e2e47e2da6a9bc0cabdaf5788fb1707d143fd1416e97
          stage_image python sha256:69ebe56e2a764c399514a0a6117131cb730cc4d0e71e85c08deb9af74cbb9f41 "$py"
          docker tag "$py" python:3.12-alpine
          docker save -o "$p/python-image.tar" python:3.12-alpine
          phase=ready
      - name: Run the fresh local Bazel owner on the isolated Linux VM
        run: |
          set -eu
          rc=0
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" "$(command -v bazel)" test --config=x86_64 \
            --strategy=TestRunner=local --nocache_test_results --flaky_test_attempts=1 --test_timeout=780 \
            --build_tag_filters= --test_tag_filters= --build_event_json_file="$RUNNER_TEMP/dind.events" \
            //test/rtnetlink/linux:nested_docker_july > "$RUNNER_TEMP/dind.buildlog" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/dind.exit"
          exit "$rc"
      - name: Preserve original setup and test evidence, including incomplete runs
        if: always()
        run: |
          python3 .github/qualification/nested_docker_receipt.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nested-docker-july
          path: ${{ runner.temp }}/nested-docker.json
          if-no-files-found: error
