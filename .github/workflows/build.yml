name: Qualify the NVIDIA parser with upstream hermetic-llvm
on:
  push:
    branches: [qualification/llvm-parser-upstream-dependency]
permissions: {}
jobs:
  parser:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Pin both product sources, the GNU client and the compiler executor
        id: setup
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/parser-cost"
          mkdir -p "$d/platform"
          cp .github/qualification/parser_backend_cost.py "$d/"
          test "$(git rev-parse HEAD^)" = ea1d3141c60dff8b172fd2d44dcf20427d1d2cd8
          test "$(git rev-parse HEAD^^)" = 59b69962bd510505fa8538aa1c4dcc61f615edd3
          git diff --exit-code HEAD^ HEAD -- . ':!.github/qualification/parser_backend_cost.py' ':!.github/workflows/build.yml'
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --retry 3 --max-time 180 --proto '=https' --proto-redir '=https' https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          echo 'module(name="tcp_gnu")' > "$d/platform/MODULE.bazel"
          cat > "$d/platform/BUILD" <<PLAT
          package(default_visibility=["//visibility:public"])
          platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","EstimatedMemory":"8GB","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://$GNU"})
          PLAT
          docker pull --platform=linux/amd64 "$GNU"
          docker run --init -d --name gnu --entrypoint /bin/bash --user root -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" -v "$d:$d" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
          test "$(docker exec gnu uname -m)" = x86_64
          test "$(docker exec gnu "$d/bazel" --version)" = 'bazel 9.3.1'
          ln -s bazel "$d/bazelisk"
      - name: Measure both Linux architectures on each source
        id: graphs
        run: python3 -IB "$RUNNER_TEMP/parser-cost/parser_backend_cost.py" graphs
      - name: Preserve the source and architecture comparisons
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parser-backend-graphs
          path: |
            ${{ runner.temp }}/parser-cost/parent-*.json
            ${{ runner.temp }}/parser-cost/candidate-*.json
            ${{ runner.temp }}/parser-cost/*-repo.txt
          if-no-files-found: warn
      - name: Check the candidate source license with the project verifier
        if: always() && !cancelled() && steps.setup.outcome == 'success'
        run: python3 -IB "$RUNNER_TEMP/parser-cost/parser_backend_cost.py" license
      - name: Run the compiled parser on each native Linux worker
        if: always() && !cancelled() && steps.setup.outcome == 'success'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/parser-cost"
          rc="$d/private.rc"
          trap 'rm -f "$rc"' EXIT
          test -n "$BUILDBUDDY_API_KEY"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$d/parser_backend_cost.py" tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !cancelled()
        with:
          name: parser-native-and-license
          path: |
            ${{ runner.temp }}/parser-cost/license.json
            ${{ runner.temp }}/parser-cost/test-*.json
            ${{ runner.temp }}/parser-cost/*-test.log
            ${{ runner.temp }}/parser-cost/*-test.xml
          if-no-files-found: warn
