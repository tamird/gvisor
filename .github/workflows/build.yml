name: Qualify the static Linux native test wrapper
on:
  push:
    branches: [qualification/native-wrapper-buildbuddy-network]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: carrier, persist-credentials: false, fetch-depth: 6}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: tamird/bazel, ref: b70c334832ca2a1109a8b5e8cdc632b411174b6f, path: supplier, persist-credentials: false, fetch-depth: 2}
      - name: Prepare private remote configuration and evidence
        working-directory: carrier
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/native-package-evidence"
          printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap","executed_targets":0}' > "$RUNNER_TEMP/native-package-evidence/bootstrap.json"
          test -n "$BUILDBUDDY_API_KEY"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --action_env=TMPDIR=.' 'build --host_action_env=TMPDIR=.'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/sidecar.bazelrc"
          {
            printf '%s\n' 'build:buildbuddy --config=ubuntu2404' 'build:buildbuddy --nogoogle_default_credentials' 'build:buildbuddy --remote_instance_name=' 'build:buildbuddy --remote_executor=grpcs://remote.buildbuddy.io' 'build:buildbuddy --remote_cache=grpcs://remote.buildbuddy.io' 'build:buildbuddy --bes_backend=grpcs://remote.buildbuddy.io' 'build:buildbuddy --bes_results_url=https://app.buildbuddy.io/invocation/' 'build:buildbuddy --spawn_strategy=remote' 'build:buildbuddy --noremote_local_fallback' 'build:buildbuddy --remote_download_outputs=toplevel' 'build:buildbuddy --noremote_upload_local_results'
            printf 'build:buildbuddy --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build:buildbuddy --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/supplier.bazelrc"
          mkdir -p ../supplier/qualification_platform
          cp test/rbe/native_packages/supplier-platform.BUILD ../supplier/qualification_platform/BUILD
          unset BUILDBUDDY_API_KEY
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "bdb65b4bddb8405a80b3e45a3ef4c740819b151d0709d360e8add8dac534c224  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
          command -v objcopy nm jq
          cp test/rbe/{qualification_report.py,unit_matrix.py} "$RUNNER_TEMP/"
          cp test/rbe/native_packages/{run.py,static_build.py,native-wrapper-control.json} "$RUNNER_TEMP/"
          git fetch --no-tags --depth=1 origin b60abfb1a3212c36dafef881c73c4b7d584f8dd6
          git show b60abfb1a3212c36dafef881c73c4b7d584f8dd6:test/rbe/native-xml/probe.py > "$RUNNER_TEMP/glibc_probe.py"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bazel --bazelrc="$RUNNER_TEMP/sidecar.bazelrc" run //tools/actionlint -- "$PWD/.github/workflows/build.yml" > "$RUNNER_TEMP/actionlint.log" 2>&1 || { tail -30 "$RUNNER_TEMP/actionlint.log"; exit 1; }
          printf '%s\n' '{"status":"PASS","phase":"bootstrap","executed_targets":0}' > "$RUNNER_TEMP/native-package-evidence/bootstrap.json"
      - name: Build Bazel on RBE and verify its Linux wrapper
        id: supplier
        working-directory: supplier
        run: python3 "$RUNNER_TEMP/static_build.py"
      - name: Run the original AMD64 state and TCP suites on scratch
        working-directory: carrier
        env:
          PRODUCT: 851d04fc2918adcaa60a78fd9fa7e766bc4fec68
        run: python3 "$RUNNER_TEMP/run.py"
      - name: Reconcile the supplier and original package verdicts
        if: always()
        run: |
          python3 - <<'PY_RESULT'
          import datetime, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "native-package-evidence"
          root.mkdir(exist_ok=True)
          def read(name):
              path = root / name
              return json.loads(path.read_text()) if path.exists() else {"status": "INCOMPLETE"}
          supplier, runtime = read("supplier.json"), read("summary.json")
          states = [supplier["status"], runtime["status"]]
          identity = (supplier.get("source") == "b70c334832ca2a1109a8b5e8cdc632b411174b6f"
                      and runtime.get("source") == "851d04fc2918adcaa60a78fd9fa7e766bc4fec68"
                      and supplier.get("binary_sha256") == runtime.get("native_bazel", {}).get("sha256"))
          status = "FAIL" if "FAIL" in states else "PASS" if states == ["PASS", "PASS"] and identity else "INCOMPLETE"
          result = {"status": status, "supplier_status": states[0], "runtime_status": states[1],
                    "source_and_binary_identity": identity, "verified_at": datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (root / "result.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result))
          raise SystemExit(status != "PASS")
          PY_RESULT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-static-wrapper
          path: |
            ${{ runner.temp }}/native-package-evidence
            ${{ runner.temp }}/bazel-candidate
          if-no-files-found: error
