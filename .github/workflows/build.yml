name: Compare forwarding the saved reconnect before draining its TIME_WAIT queue
on:
  push:
    branches: [qualification/timewait-forwarder-reopen]
permissions: {contents: read, actions: read}
jobs:
  packet:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PUBLISHED: ed8a800c0c2d10916616ad2e0a791976fbd60274
      ORDER: b45a5aeb1d164ff2840ade5c1659779e365a912e
      HANDOFF: 70164ab468354f33742456b52a7e652a65971f77
      PRODUCT: 936ad90db65df3d348b9af3c04b83b186a988a0d
      CURRENT: d18a5341801defddca36091b20db2f7296eb0d05
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 12, persist-credentials: false}
    - name: Bind the completed original without running it again
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records/published"
        prior="$RUNNER_TEMP/original.zip"
        gh api repos/tamird/gvisor/actions/artifacts/13208555953/zip > "$prior"
        echo "af35e64a5941d6b32b7535d40a98a93e0d8fed550ac34db9ed50e7a7da7cea5b  $prior" | sha256sum -c
        unzip -p "$prior" result.json > "$RUNNER_TEMP/records/published/result.json"
        jq -e --arg p "$PUBLISHED" --arg f "$CURRENT" '.product==$p and .fixture==$f and .verdict=="DUPLICATE_REFUSED" and .invocations==["58980a3e-9830-49ac-8c94-ae2f02b1657d"]' "$RUNNER_TEMP/records/published/result.json"
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        test "$(git rev-parse HEAD^)" = "$HANDOFF"
        test "$(git rev-parse "$HANDOFF^")" = "$ORDER"
        test "$(git rev-parse "$ORDER^")" = "$CURRENT"
        test "$(git rev-parse "$CURRENT^")" = "$PUBLISHED"
        test "$(git diff --name-only "$PUBLISHED" "$CURRENT")" = "$(printf '%s\n' pkg/tcpip/transport/tcp/test/e2e/BUILD pkg/tcpip/transport/tcp/test/e2e/forwarder_test.go)"
        test "$(git diff --name-only "$CURRENT" "$ORDER")" = pkg/tcpip/transport/tcp/dispatcher.go
        test "$(git rev-parse "$ORDER:pkg/tcpip/transport/tcp/dispatcher.go")" = bb068711d2d0441fa9630cd6253942616b4dbf10
        git fetch --quiet --depth=2 origin refs/heads/proposal/timewait-forwarder-handoff
        test "$(git rev-parse FETCH_HEAD)" = "$PRODUCT"
        test "$(git rev-parse "$PRODUCT^")" = "$PUBLISHED"
        test "$(git diff --name-only "$PUBLISHED" "$PRODUCT")" = "$(printf '%s\n' pkg/tcpip/transport/tcp/connect.go pkg/tcpip/transport/tcp/dispatcher.go)"
        git diff --exit-code "$PRODUCT" "$HANDOFF" -- . ':(exclude)pkg/tcpip/transport/tcp/test/e2e/BUILD' ':(exclude)pkg/tcpip/transport/tcp/test/e2e/forwarder_test.go'
        git diff --exit-code "$CURRENT" "$HANDOFF" -- pkg/tcpip/transport/tcp/test/e2e
        test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/qualification/reconnect-result.py .github/workflows/build.yml)"
        cp .github/qualification/reconnect-result.py "$RUNNER_TEMP/records/"
        git checkout --quiet --detach "$ORDER"
        test -z "$(git status --porcelain --untracked-files=no)"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --user root --entrypoint /bin/bash -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        version=$(cat images/default/bazelversion)
        test "$version" = 8.3.1
        bin="$RUNNER_TEMP/bazel-$version"
        curl --retry 3 --fail --silent --show-error --location -o "$bin" "https://releases.bazel.build/$version/release/bazel-$version-linux-x86_64"
        echo "17247e8a84245f59d3bc633d0cfe0a840992a7760a11af1a30012d03da31604c  $bin" | sha256sum --check
        chmod 755 "$bin"
        docker exec tcp-compiler "$bin" --version | grep -Fx 'bazel 8.3.1'
    - name: Run the forwarder and its connecting peer on the remote Linux test worker
      run: |
        set -euo pipefail
        failed=0
        for arm in order handoff; do
          if [[ "$arm" = order ]]; then tested="$ORDER"; source="$ORDER"; else tested="$HANDOFF"; source="$PRODUCT"; fi
          root="$RUNNER_TEMP/records/$arm"
          mkdir -p "$root"
          git checkout --quiet --detach "$tested"
          test "$(git rev-parse HEAD)" = "$tested"
          label=//pkg/tcpip/transport/tcp/test/e2e:forwarder_test
          filter='^(TestForwarder(ReopenAfterTimeWait|TimeWaitSynAckKeepsEndpoint|TimeWaitDeclinedSynGetsReset)|TestQueuedForwarderReconnect)$'
          code=0
          docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" tcp-compiler \
            "$RUNNER_TEMP/bazel-8.3.1" --batch --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 \
            --strategy=GoImports=processwrapper-sandbox --strategy=CppCompile=processwrapper-sandbox,local --strategy=CppLink=processwrapper-sandbox,local \
            --strategy=TestRunner=remote --jobs=3 --nocache_test_results --flaky_test_attempts=1 --test_sharding_strategy=disabled '--modify_execution_info=^TestRunner$=+no-remote-cache' \
            --test_env=GO_TEST_WRAP_TESTV=1 --test_env=GVISOR_TEST_CLOCK_SOURCE=calibrated --define=gvisor_test_clock_source=calibrated \
            --test_arg=-test.v --test_timeout=180 --test_filter="$filter" --test_output=errors \
            --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' \
            --build_event_json_file="$root/events" --build_event_json_file_path_conversion=false "$label" > "$root/bazel.log" 2>&1 || code=$?
          path=bazel-testlogs/pkg/tcpip/transport/tcp/test/e2e/forwarder_test/test.log
          if docker exec tcp-compiler test -f "$path"; then docker exec tcp-compiler cat "$path" > "$root/test.log"; fi
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 -B "$RUNNER_TEMP/records/reconnect-result.py" "$root" "$source" "$tested" "$code" || failed=1
        done
        exit "$failed"
    - name: Keep original test evidence and bounded build diagnostics
      id: scan
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'CHECK'
        import os
        from pathlib import Path
        root=Path(os.environ["RUNNER_TEMP"])/"records"
        out=root/"public"
        out.mkdir(parents=True,exist_ok=True)
        key=os.environ["BB_KEY"].encode()
        assert key
        for arm in ("published","order","handoff"):
            for name in ("result.json","test.log","bazel.log"):
                src=root/arm/name
                if not src.is_file(): continue
                data=src.read_bytes()
                if name=="bazel.log":
                    data=b"\n".join(line[:600] for line in data.splitlines() if line.startswith((b"ERROR:",b"FAIL:",b"error:")))[:5500]
                assert key not in data and all(x not in data.lower() for x in (b"x-buildbuddy-api-key",b"remote_header",b"bes_header",b"authorization: bearer",b"github_pat_",b"ghp_"))
                (out/arm).mkdir(exist_ok=True)
                (out/arm/name).write_bytes(data)
        CHECK
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.scan.outcome == 'success'
      with:
        name: timewait-forwarder-handoff
        path: ${{ runner.temp }}/records/public/
        if-no-files-found: error
