name: Run the seven GNU diff golden tests on both targets
on:
  push:
    branches: [qualification/go-generics-native-golden]
permissions: {}
jobs:
  linux:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Bind the original consumer and published qualification
        run: |
          umask 022
          git init -q
          git fetch --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 3cb821c774f96833cbfe28a375a73a2ab22d5879
          test "$(git rev-parse HEAD^^)" = 7d1b049f5d541992b47cc38cf564025908a9ed7b
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/qualification/generics_diff.py .github/workflows/build.yml)"
          w="$RUNNER_TEMP/golden"
          mkdir "$w"
          cp .github/qualification/generics_diff.py "$w/"
          curl -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $w/bazel" | sha256sum -c
          curl -fsSL --retry 2 https://github.com/bazelbuild/buildtools/releases/download/v8.5.1/buildifier-linux-amd64 -o "$w/buildifier"
          echo "887377fc64d23a850f4d18a077b5db05b19913f4b99b270d193f3c7334b5a9a7  $w/buildifier" | sha256sum -c
          chmod +x "$w"/{bazel,buildifier}
          test "$("$w/bazel" --version)" = 'bazel 9.3.1'
          sudo apt-get -qq update
          sudo apt-get install -y -qq qemu-user-static build-essential crossbuild-essential-arm64 libnuma-dev
      - name: Exercise the ordinary targets and the two target GNU binaries
        run: |
          w="$RUNNER_TEMP/golden"
          env -i HOME="$HOME" USER="$USER" LANG=C.UTF-8 PATH="$w:$PATH" GITHUB_SHA="$GITHUB_SHA" W="$w" DOCKER_BUILD=false python3 -IB "$w/generics_diff.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: go-generics-diff
          path: ${{ runner.temp }}/golden/result.json
          if-no-files-found: warn
