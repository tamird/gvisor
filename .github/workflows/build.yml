name: Compare declared release inputs and offline publication
"on":
  push:
    branches: [qualification/declared-release-layout]
permissions: {}
jobs:
  release:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    steps:
      - name: Bind the physical release source, regular archive inputs and qualification platform
        id: prepare
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mixed-publication"
          mkdir -p "$d"/{source,public,platform}
          cd "$d/source"
          git init -q
          git -c gc.auto=0 fetch -q --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD^)" = d6f54c947d3ddb46c773c82b5be10ee438d379fb
          test "$(git rev-parse HEAD^^)" = 89dd704c2788432602032e3a9d407083bc900860
          git diff --quiet HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/mixed_release/**' ':!test/rbe/stamped_release/**'
          cp .github/qualification/mixed_release/*.py "$d/"
          cp test/rbe/stamped_release/{BUILD,boundary.bzl,platform_mappings} "$d/platform/"
          git checkout -q --detach d6f54c947d3ddb46c773c82b5be10ee438d379fb
          test "$(git rev-parse 'HEAD^{tree}')" = 1810fb84cf11546bf2a6d621e916515eeb1ad5fd
          mkdir -p test/rbe/stamped_release
          cp "$d/platform/"* test/rbe/stamped_release/
          git diff --quiet HEAD
          test "$(git ls-files --others --exclude-standard)" = "$(printf '%s\n' test/rbe/stamped_release/{BUILD,boundary.bzl,platform_mappings})"
          git -c tag.gpgSign=false tag release-20261106.0 HEAD
          git fetch -q --depth=1 https://github.com/google/gvisor.git 9ee2906f518e1d0f9fd109e9e1feb2812096418b
          mkdir -p "$d/stock/tools"
          for tool in make_apt make_python_release make_release; do
            git show "9ee2906f518e1d0f9fd109e9e1feb2812096418b:tools/$tool.sh" >"$d/stock/tools/$tool.sh"
            chmod 0755 "$d/stock/tools/$tool.sh"
          done
          (cd "$d/stock/tools" && sha256sum -c <<'SHA'
          78c25cd133fd978d021a3ffc8cd3012583e068c29da9a05bf123dd940c997717  make_release.sh
          926c3490518cce3f73f912644b4fd4f1e0c26d6a7d8a8c0acb8a07cea05b1175  make_apt.sh
          181ae111e4b7f9c197ed06896b67a7b93fae61bed2466a7a172d3e087acf4894  make_python_release.sh
          SHA
          )
          test "$(cat .bazelversion)" = 9.3.1
          sudo apt-get -qq update
          sudo apt-get -qq install -y dpkg-sig apt-utils gnupg zstd jq
          curl -fsSL --retry 2 --max-time 150 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel.public"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $d/bazel.public" | sha256sum -c -
          curl -fsSL --retry 2 --max-time 150 https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 -o "$d/bb"
          echo "205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  $d/bb" | sha256sum -c -
          chmod 0755 "$d"/{bb,bazel.public}
          python3 -IBs "$d/memory.py"

      - name: Inspect both configured native sets and the single Python writer
        id: graph
        if: '!cancelled() && steps.prepare.outcome == ''success'''
        run: |
          d="$RUNNER_TEMP/mixed-publication"
          cd "$d/source"
          python3 -IBs "$d/mixed.py" graph

      - name: Execute one release build on the two declared native RBE platforms
        id: build
        if: '!cancelled() && steps.graph.outcome == ''success'''
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mixed-publication"
          cd "$d/source"
          rc="$d/client.rc"
          trap 'rm -f "$rc"' EXIT
          test -n "$BUILDBUDDY_API_KEY"
          cat >"$rc" <<'RC'
          build --remote_executor=grpcs://remote.buildbuddy.io --remote_cache=grpcs://remote.buildbuddy.io
          build --bes_backend=grpcs://remote.buildbuddy.io --bes_results_url=https://app.buildbuddy.io/invocation/
          build --spawn_strategy=remote --noremote_local_fallback --jobs=48 --remote_timeout=10m
          build --remote_default_exec_properties=OSFamily=linux
          build --remote_default_exec_properties=workload-isolation-type=oci
          build --remote_default_exec_properties=container-image=docker://cgr.dev/chainguard/static@sha256:fc42af33e643f20d08baf03cddcc1c02ba57052dfb02edb0d79f3fc47bcea8d9
          RC
          printf 'build --remote_header=x-buildbuddy-api-key=%s\nbuild --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" "$BUILDBUDDY_API_KEY" >>"$rc"
          unset BUILDBUDDY_API_KEY
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -IBs "$d/mixed.py" build

      - name: Join materialized files and tree children to original configured remote actions
        id: outputs
        if: '!cancelled() && steps.graph.outcome == ''success'' && steps.build.outcome != ''skipped'''
        run: |
          d="$RUNNER_TEMP/mixed-publication"
          cd "$d/source"
          test ! -e "$d/client.rc"
          python3 -IBs "$d/mixed.py" collect

      - name: Publish the actual downloaded inputs offline with a disposable key
        if: '!cancelled() && steps.build.outcome == ''success'' && steps.outputs.outcome != ''skipped'''
        run: |
          d="$RUNNER_TEMP/mixed-publication"
          cd "$d/source"
          test ! -e "$d/client.rc"
          python3 -IBs "$d/publish.py"

      - name: Replace a populated wheel tree on a no-Python build and check the actual gate
        if: '!cancelled() && steps.prepare.outcome == ''success'''
        run: |
          d="$RUNNER_TEMP/mixed-publication"
          cd "$d/source"
          python3 -IBs "$d/mixed.py" boundary

      - name: Upload only bounded typed observations
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: declared-release-layout
          path: ${{ runner.temp }}/mixed-publication/public/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove disposable source, private logs and fixture
        if: always()
        run: |
          d="$RUNNER_TEMP/mixed-publication"
          if [[ -d "$d/source/.git" && -x "$d/bazel.public" ]]; then
            (cd "$d/source" && "$d/bazel.public" --nosystem_rc --nohome_rc --bazelrc="$d/heap.rc" shutdown) || true
          fi
          rm -rf -- "$d"
