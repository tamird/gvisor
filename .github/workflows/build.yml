name: Check the approved systrap stub and sidecars with released LLVM
on:
  push:
    branches: [qualification/current-llvm-stub-abi]
permissions:
  contents: read
jobs:
  measure:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Build and inspect the signal stub, its Go offsets and the three public sidecars
        timeout-minutes: 110
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = fcd2cc824cf0523364c9e9bab534fc8b5f70e2ab
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/current_stub.py'
          mkdir -m 700 "$RUNNER_TEMP/current-stub"
          cp .github/qualification/current_stub.py "$RUNNER_TEMP/current-stub/"
          git checkout --quiet --detach HEAD^
          test "$(bazelisk --version)" = 'bazel 9.3.1'
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$RUNNER_TEMP/current-stub/current_stub.py"
      - name: Verify the diagnostic receipt
        id: receipt
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"current-stub/receipt.json"
          b=p.read_bytes()
          assert 0<len(b)<32000 and not re.search(rb"(?i)authorization\s*[:=]|x-buildbuddy-api-key|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}",b)
          assert json.loads(b)["source"]=="fcd2cc824cf0523364c9e9bab534fc8b5f70e2ab"
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.receipt.outcome == 'success'
        with:
          name: current-llvm-stub-abi
          path: ${{ runner.temp }}/current-stub/receipt.json
          retention-days: 14
