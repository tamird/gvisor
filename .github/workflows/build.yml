name: Probe native and gVisor epoll on an aborted FUSE device
on: workflow_dispatch
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1e5a147a41322c801145578ee6333c12a5cbaea8
          fetch-depth: 2
          persist-credentials: false
      - name: Install upstream's ARM cross compiler for the vDSO built in gVisor tests
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install g++-aarch64-linux-gnu
      - name: Demonstrate the existing queue and remount defects
        if: '!cancelled()'
        run: |
          set -euo pipefail
          git restore --source=HEAD^ -- pkg/sentry/fsimpl/fuse/dev.go pkg/sentry/fsimpl/fuse/fusefs.go
          set +e
          bazel test --config=x86_64 --jobs=4 --local_ram_resources=HOST_RAM*.65 \
            --test_filter='^Test(EpollAfterAbort|ReuseFd)$' --test_arg=-test.v --test_output=all \
            //pkg/sentry/fsimpl/fuse:fuse_test 2>&1 | tee "$RUNNER_TEMP/control.log"
          status=${PIPESTATUS[0]}
          set -e
          git restore -- pkg/sentry/fsimpl/fuse/dev.go pkg/sentry/fsimpl/fuse/fusefs.go
          test "$status" -eq 3
          grep -F 'EPOLL_CTL_DEL left a waiter on the aborted connection' "$RUNNER_TEMP/control.log"
          grep -F 'mounting an aborted FUSE device replaced its connection' "$RUNNER_TEMP/control.log"
      - name: Capture the corrected Go package case names
        if: '!cancelled()'
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --
          bazel test --config=x86_64 --jobs=4 --local_ram_resources=HOST_RAM*.65 \
            --test_arg=-test.v --test_output=all //pkg/sentry/fsimpl/fuse:fuse_test 2>&1 | tee "$RUNNER_TEMP/corrected.log"
      - name: Summarize the Go recovery
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          python3 - <<'PY_SUMMARY'
          import json, os, re
          from pathlib import Path
          tmp = Path(os.environ["RUNNER_TEMP"])
          def read(name):
            p = tmp/name
            return p.read_text() if p.is_file() else ""
          old, fixed = read("control.log"), read("corrected.log")
          failures = re.findall(r"(?m)^--- FAIL: (Test[^ ]+)",old)
          passed = re.findall(r"(?m)^--- PASS: (Test[^ ]+)",fixed)
          defects = ["EPOLL_CTL_DEL left a waiter on the aborted connection","mounting an aborted FUSE device replaced its connection"]
          names = {"TestEpollAfterAbort","TestReuseFd"}
          good = os.environ["RESULT"]=="success" and set(failures)==names and all(x in old for x in defects) and names.issubset(passed)
          record = {"verdict":"PASS" if good else "FAIL","source":"1e5a147a41322c801145578ee6333c12a5cbaea8","stockFailed":failures,"correctedPassed":passed,"skips":re.findall(r"(?m)^--- SKIP: (Test[^ ]+)",fixed),"existingNativeAndNogo":40942820675}
          (tmp/"fuse-epoll.json").write_text(json.dumps(record,indent=2)+"\n");print(record)
          if not good: raise SystemExit(1)
          PY_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fuse-epoll-abort
          path: ${{ runner.temp }}/fuse-epoll.json
          if-no-files-found: error
