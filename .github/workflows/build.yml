name: Check the upstream LLVM instrumentor overlay
on:
  push:
    branches: [qualification/upstream-llvm-instrumentor-template]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT: 47a6f55681edffa637e6ccf43c220449f7ce2c50
      BASE: 1c7a3fd23f422faed9c4abd05f820f19a495a360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tamird/llvm-project
          ref: ${{ env.PRODUCT }}
          path: llvm-project
          fetch-depth: 2
          persist-credentials: false
      - name: Use LLVM's pinned Bazel
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/bazelisk-bin" "$RUNNER_TEMP/llvm-evidence"
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazelisk-bin/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/bazelisk-bin/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bazelisk-bin/bazel"
          echo "$RUNNER_TEMP/bazelisk-bin" >> "$GITHUB_PATH"
      - name: Generate and compile from an editable checkout and an immutable source archive
        timeout-minutes: 36
        run: python3 test/rbe/llvm_scratch/verify-upstream.py
      - name: Check the bounded result
        id: publish
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d = Path(os.environ['RUNNER_TEMP']) / 'llvm-evidence'
          p = d / 'verdict.json'
          assert list(d.iterdir()) == [p] and p.is_file() and not p.is_symlink()
          b = p.read_bytes()
          assert len(b) < 50000 and b'authorization:' not in b.lower() and b'x-buildbuddy-api-key' not in b.lower()
          assert json.loads(b)['product'] == os.environ['PRODUCT']
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.publish.outcome == 'success'
        with:
          name: upstream-instrumentor-verdict
          path: ${{ runner.temp }}/llvm-evidence/verdict.json
          if-no-files-found: error
