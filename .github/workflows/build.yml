name: Measure selective acknowledgment through a partial ACK and recovery
on:
  push:
    branches: [qualification/tcp-sack-endpoints]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/tcp-sack-endpoints'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 8
        persist-credentials: false
    - name: Run matched Linux and gVisor recovery cases
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        nparent=ba1947269b1b733c8110f785961ea883fd3ed7a8; candidate=8613f944ff1973f8741dbd5b995640b09af980c7; product=da50c9f56d8119f183a0fcf815ba42416a9d751b; stock=7334cd876b68aa3c63aa442c8d6752e476833350
        test "$(git rev-parse HEAD^2)" = "$candidate"
        test "$(git rev-parse "$candidate^")" = "$product"
        test "$(git diff --name-only "$product" "$candidate" | wc -l)" = 2
        git diff --quiet "$product" "$candidate" -- . ':(exclude)pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test.go' ':(exclude)pkg/tcpip/transport/tcp/rack_test.go'
        git diff --quiet "$stock" "$candidate" -- pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test.go
        mkdir -p "$RUNNER_TEMP/checker"
        for file in qualify.sh unit_matrix.py qualification_report.py tcp_native_report.py tcp_race_report.py; do
          cp "test/rbe/$file" "$RUNNER_TEMP/checker/$file"
        done
        python3 -m py_compile "$RUNNER_TEMP/checker/"*.py
        mkdir -p "$RUNNER_TEMP/fifo_platform" "$RUNNER_TEMP/fifo"
        platform=$RUNNER_TEMP/fifo_platform
        printf '%s\n' 'module(name="fifo_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/fifo.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=linux-sandbox' 'build --strategy=TestRunner=local' 'build --jobs=4' \
            'build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' \
            'build --remote_accept_cached' \
            "build --inject_repository=fifo_platform=$platform" \
            'build --host_platform=@fifo_platform//:ubuntu' \
            'build --extra_execution_platforms=@fifo_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        export FIFO_RC=$rc
        mkdir -p "$RUNNER_TEMP/fifo-bin"
        cat > "$RUNNER_TEMP/fifo-bin/bazel" <<'SH'
        #!/bin/sh
        case "$1" in
          test)
            # Capture the actual argv and Bazel exit, independent of the qualifier's exit.
            printf '%s\n' "$@" > "$TCP_EVIDENCE/executed_arguments"
            status=0
            bazelisk --bazelrc="$FIFO_RC" "$@" || status=$?
            printf '%s\n' "$status" > "$TCP_EVIDENCE/native_exit"
            date -u '+%Y-%m-%dT%H:%M:%S.%3N+00:00' > "$TCP_EVIDENCE/finished"
            exit "$status"
            ;;
        esac
        exec bazelisk --bazelrc="$FIFO_RC" "$@"
        SH
        chmod +x "$RUNNER_TEMP/fifo-bin/bazel"
        export PATH="$RUNNER_TEMP/fifo-bin:$PATH"
        if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        unshare -Ur true
        overall=0
        mkdir -p "$RUNNER_TEMP/replay-private" "$RUNNER_TEMP/replay-public"
        for arm in candidate; do
          case "$arm" in
            linux) source=$native; parent=$nparent; label=//test/packetimpact/tests:tcp_rack_native_test
                   checker=tcp_native_report.py; options=(--test_filter=TestLinuxSACKRecoverySplit --test_timeout=240);;
            stock|candidate) source=$stock; parent=$nparent
                   if test "$arm" = candidate; then source=$candidate; parent=$product; fi
                   label=//pkg/tcpip/transport/tcp/test/e2e:tcp_rack_test
                   checker=tcp_native_report.py; options=(--test_filter=TestSACKRecoverySplitAfterPartialACK --test_timeout=120);;
          esac
          git checkout --quiet --detach "$source"
          test "$(git rev-parse HEAD)" = "$source"
          test "$(git rev-parse HEAD^)" = "$parent"
          export TCP_EVIDENCE="$RUNNER_TEMP/replay-private/$arm"
          mkdir -p "$TCP_EVIDENCE"
          git status --porcelain --untracked-files=no > "$TCP_EVIDENCE/source_before"
          test ! -s "$TCP_EVIDENCE/source_before"
          git cat-file commit HEAD > "$TCP_EVIDENCE/commit_file"
          raw="$RUNNER_TEMP/replay-private/$arm.raw.jsonl"
          uname -r > "$TCP_EVIDENCE/kernel"
          code=0
          bazel test --config=x86_64 --strategy=TestRunner=local --spawn_strategy=linux-sandbox \
            --jobs=4 --test_env=GO_TEST_WRAP_TESTV=1 --test_env=GVISOR_TEST_CLOCK_SOURCE=calibrated --test_env=XTABLES_LOCKFILE \
            --define=gvisor_test_clock_source=calibrated --strip=never --test_sharding_strategy=disabled \
            --nocache_test_results --test_output=all "--build_event_json_file=$raw" \
            --build_event_json_file_path_conversion=false "${options[@]}" "$label" || code=$?
          printf '%s\n' "$code" > "$TCP_EVIDENCE/runner_exit"
          git rev-parse HEAD > "$TCP_EVIDENCE/final_head"
          git status --porcelain --untracked-files=no > "$TCP_EVIDENCE/source_after"
          python3 -B "$RUNNER_TEMP/checker/$checker" "$TCP_EVIDENCE" "$arm" "$source" "$label" "$raw" "$RUNNER_TEMP/replay-public" || overall=1
        done
        test "$(git rev-parse HEAD)" = "$candidate"
        cd "$GITHUB_WORKSPACE"
        export TCP_EVIDENCE="$RUNNER_TEMP/replay-private/owners"
        mkdir -p "$TCP_EVIDENCE"
        mkdir -p "$RUNNER_TEMP/replay-public"
        package=//pkg/tcpip/transport/tcp:tcp_test
        nogo=//pkg/tcpip/transport/tcp:tcp_nogo
        tnogo=//pkg/tcpip/transport/tcp:tcp_test_nogo
        raw="$TCP_EVIDENCE/owners.jsonl"
        git cat-file commit HEAD > "$TCP_EVIDENCE/commit_file"
        git status --porcelain --untracked-files=no > "$TCP_EVIDENCE/source_before"
        ec=0
        bazel test --config=x86_64 --jobs=4 --test_env=GO_TEST_WRAP_TESTV=1 --test_arg=-test.v --test_sharding_strategy=disabled --nocache_test_results --build_event_json_file_path_conversion=false "--build_event_json_file=$raw" "$package" "$nogo" "$tnogo" || ec=$?
        test "$ec" -eq 0 || overall=1
        git rev-parse HEAD > "$TCP_EVIDENCE/final_head"
        git status --porcelain --untracked-files=no > "$TCP_EVIDENCE/source_after"
        python3 -B - "$RUNNER_TEMP/checker" "$TCP_EVIDENCE" "$raw" "$candidate" "$RUNNER_TEMP/replay-public" "$package" "$nogo" "$tnogo" <<'OWNERS' || overall=1
        import sys,json
        from pathlib import Path
        checker,ev,raw,head,out,*labels=sys.argv[1:];sys.path.insert(0,checker)
        import qualification_report as r
        ev=Path(ev); (ev/"targets.txt").write_text("\n".join(labels)+"\n")
        cap=r.capture(Path(raw),ev/"events.jsonl",Path("bazel-out"),ev/"reports")
        (ev/"capture_exit").write_text("1" if cap["errors"] else "0")
        ctx={k:k for k in ("commit_file","source_before","source_after","final_head","executed_arguments","native_exit","capture_exit")}
        ctx.update(expected_source=head,command_kind="test",execution_finished_at=(ev/"finished").read_text().strip())
        r.write_json(ev/"context.json",ctx)
        v=r.verdict(ev/"events.jsonl",r.manifest_path(ev/"events.jsonl"),ev/"context.json",ev/"targets.txt",())
        logs="".join((ev/row["path"]).read_text() for row in cap["reports"] if row["name"]=="test.log")
        cases=["TestSACKBridgesRetransmittedQueueFragment","TestSACKedSplitUnitsAcrossSequenceWrap"]
        v["matched_controls"]={name:("--- PASS: "+name in logs) for name in cases}
        if not all(v["matched_controls"].values()) and v["status"]=="PASS": v["status"]="INCOMPLETE"
        r.write_json(Path(out)/"owners.json",v)
        print(v["status"],v["case_counts"],v["errors"],v["matched_controls"]);sys.exit(v["status"]!="PASS")
        OWNERS
        python3 - "$RUNNER_TEMP/replay-public" <<'PYRESULT'
        import json, sys
        from pathlib import Path
        root = Path(sys.argv[1])
        arms = ["candidate","owners"]
        verdicts = {a: json.loads((root / (a + ".json")).read_text()) for a in arms if (root / (a + ".json")).is_file()}
        missing = [a for a in arms if a not in verdicts]
        if "candidate" in verdicts:
            got=[s["sacked"] for s in verdicts["candidate"]["packet_observations"]]
            if got!=[1,1,4,0]:
                verdicts["candidate"]["status"]="FAIL"
                print("packet count mismatch",got,"want [1,1,4,0]")

        result = {"expected":arms,"executed":list(verdicts),"missing":missing,"status":"PASS" if not missing and all(v["status"] == "PASS" and v.get("verified",True) for v in verdicts.values()) else "FAIL"}
        (root / "summary.json").write_text(json.dumps(result, indent=2) + "\n")
        print(result)
        sys.exit(result["status"] != "PASS")
        PYRESULT
        exit "$overall"
    - name: Save only the typed results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: tcp-sack-endpoints
        path: ${{ runner.temp }}/replay-public/*.json
        if-no-files-found: error
