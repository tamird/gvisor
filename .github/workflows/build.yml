name: Observe MSS and SACK option space on Linux and stock netstack
on:
  push:
    branches: [qualification/tcp-mss-sack-observation]
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      REPORTER: 599cb05aecfb107e07f81b8591a009cb12d6ffa7
      PROFILE: 0ee70efe6d52576b8f173b40ad6b7ac117da3b72
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 3, persist-credentials: false}
    - name: Prepare the existing GNU and packetimpact profiles
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        git fetch origin "$REPORTER" "$PROFILE"
        mkdir -p "$RUNNER_TEMP/reporter" "$RUNNER_TEMP/platform" "$RUNNER_TEMP/mss-report"
        for f in qualification_report.py unit_matrix.py; do git show "$REPORTER:test/rbe/$f" > "$RUNNER_TEMP/reporter/$f"; done
        for f in BUILD.bazel MODULE.bazel; do git show "$PROFILE:test/rbe/gnu_platform/$f" > "$RUNNER_TEMP/platform/$f"; done
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/mss.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name mss-compiler --entrypoint /bin/bash --user root --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
    - name: One invocation of both existing packetimpact owners
      id: observe
      run: docker exec -e RUNNER_TEMP -e PYTHONPATH="$RUNNER_TEMP/reporter" mss-compiler python3 test/rbe/tcp_mss.py run
    - name: Validate the bounded publication
      id: privacy
      if: always()
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: PYTHONPATH="$RUNNER_TEMP/reporter" python3 test/rbe/tcp_mss.py scan
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.privacy.outcome == 'success' }}
      with:
        name: tcp-mss-sack-observation
        path: ${{ runner.temp }}/mss-report
        if-no-files-found: error
