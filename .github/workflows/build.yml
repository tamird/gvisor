name: Check the stamped runsc version on native Linux
on:
  push:
    branches: [qualification/stamped-runsc-version]
permissions:
  contents: read
jobs:
  version:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: amd64
            runner: ubuntu-22.04
            digest: e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76
          - cpu: arm64
            runner: ubuntu-22.04-arm
            digest: bb608519a440d45d10304eb684a73a2b6bb7699c5b0e5434361661b25f113a5d
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Pin the source and native Bazel client
        env:
          CPU: ${{ matrix.cpu }}
          CLIENT_SHA: ${{ matrix.digest }}
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 14590f5fbf933f155a44a13d4c606de8932521df
          test "$(git rev-parse HEAD^^)" = 70008149cff7b8d3b858877ae9c359b9046d19c5
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/check_runsc_version.py'
          git diff --exit-code HEAD^^ HEAD^ -- . ':!runsc/BUILD' ':!runsc/version_test.sh' ':!runsc/version_test.go'
          work="$RUNNER_TEMP/runsc-version"
          mkdir -p "$work"
          cp .github/check_runsc_version.py "$work/"
          curl -fsSL --max-time 90 "https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-$CPU" -o "$work/bazel"
          echo "$CLIENT_SHA  $work/bazel" | sha256sum -c -
          chmod 755 "$work/bazel"
          test "$(cat .bazelversion)" = 9.3.1
      - name: Check real stdout and the owning test on both source revisions
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$RUNNER_TEMP/runsc-version/check_runsc_version.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: runsc-version-${{ matrix.cpu }}
          path: ${{ runner.temp }}/runsc-version/result.json
          if-no-files-found: error
          retention-days: 14
