name: Compare guest MemTotal under nested OCI memory limits
on:
  push:
    branches: [qualification/oci-ancestor-memory]
permissions:
  contents: read
  actions: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: c89f8f55abfe0d08c2bfc836192bd27d0aee7161
      STOCK: d624fba03a2b3f1f9a314e54198c95460005cc15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 8, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        cp test/rbe/verify-oci-direct.py "$RUNNER_TEMP/verify-tcp.py"
        cp test/rbe/run-oci-mem.py "$RUNNER_TEMP/oci.py"
        [[ "$(git rev-parse HEAD^1^1^1^1)" == "$CURRENT" && "$(git rev-parse HEAD^1^1^1^2)" == "$STOCK" ]]
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /var/run/docker.sock:/var/run/docker.sock -v "$(command -v docker):/usr/local/bin/host-docker:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Verify and reuse the six completed OCI kernel reads
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api repos/tamird/gvisor/actions/artifacts/12993434913/zip > "$RUNNER_TEMP/previous.zip"
        echo "f770738ccaa9a290c42f3d3cfc655affe12439f1c929790ec5d08cf14b0cf960  $RUNNER_TEMP/previous.zip" | sha256sum -c
        unzip -p "$RUNNER_TEMP/previous.zip" verdict.json > "$RUNNER_TEMP/records/guests.json"
    - name: Run only the missing canonical root fixture
      run: |
        set -euo pipefail
        for arm in stock fixed; do
          src=$STOCK; [[ $arm == stock ]] || src=$CURRENT
          git checkout --quiet --detach "$src"; [[ "$(git rev-parse HEAD)" == "$src" ]]
          rec=$RUNNER_TEMP/records/$arm; mkdir -p "$rec"
          echo "$src" > "$rec/source"; sha256sum test/root/runsc_test.go > "$rec/test.sha256"
          cli=(docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc")
          opts=(--config=x86_64 --jobs=2 --spawn_strategy=remote,local --remote_download_outputs=toplevel --strategy=CppCompile=local)
          "${cli[@]}" build "${opts[@]}" //:release > "$rec/release.log" 2>&1
          docker exec tcp-compiler cp -rL bazel-bin/release "$RUNNER_TEMP/release-$arm"
          echo "{\"runtimes\":{\"runsc\":{\"path\":\"$RUNNER_TEMP/release-$arm/runsc\"}}}" > "$RUNNER_TEMP/docker-config-$arm.json"
          tst=0
          "${cli[@]}" test "${opts[@]}" --strategy=TestRunner=local --test_arg=-test.v --test_arg=-test.run='^TestNestedMemoryLimit$' --test_arg=-docker_cli=/usr/local/bin/host-docker --test_arg=-runtime=runsc --test_arg=-config_path="$RUNNER_TEMP/docker-config-$arm.json" --nocache_test_results --test_output=all //test/root:root_test > "$rec/owner.log" 2>&1 || tst=$?
          echo "$tst" > "$rec/owner.exit"
          if [[ $tst == 0 || $tst == 3 ]]; then for f in test.xml test.log; do docker exec tcp-compiler cat "bazel-testlogs/test/root/root_test/$f" > "$rec/$f"; done; fi
          grep -E 'Invocation ID:|fatal error:|error:|^ERROR:|^FAIL|MemTotal|^=== RUN|panic:|docker:|cannot|requires ' "$rec/owner.log" | head -100 > "$rec/owner.diagnostics" || true
          rm "$rec/release.log" "$rec/owner.log"
        done
        date -u +%FT%TZ > "$RUNNER_TEMP/records/end"
    - name: Verify each canonical root fixture result and combine with the original guest records
      if: always()
      run: python3 "$RUNNER_TEMP/verify-tcp.py" "$RUNNER_TEMP/records"
    - name: Exclude credentials from the evidence bundle
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key=os.environ["BB_KEY"].encode()
        for f in (Path(os.environ["RUNNER_TEMP"])/"records").rglob("*"):
            if f.is_file() and key and key in (data:=f.read_bytes()):
                f.write_bytes(data.replace(key,b"[REDACTED]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: oci-memtotal-owner
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
