name: Compare graph completion-queue allocations on one frozen checkpoint
on:
  push:
    branches: [qualification/state-queue-storage-50k]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: ${{ github.sha }}
      BASE: 918aefd5f3771a161013fb72873d8aa19196e1bc
      PRODUCT: 50af9d03a449718476b629619086c071912467b1
      STOCK: 918aefd5f3771a161013fb72873d8aa19196e1bc
      FIXED: ${{ github.sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 3, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD)" == "$CURRENT" ]]
        test "$(git rev-parse HEAD^)" = "$PRODUCT"
        test "$(git rev-parse HEAD~2)" = "$BASE"
        git diff --exit-code "$PRODUCT" "$CURRENT" -- . ':!runsc/container/BUILD' ':!runsc/container/container_save_restore_test.go' ':!pkg/state/graph_decode_callbacks_test.go' ':!test/rbe/tmpfs_profile' ':!.github/workflows/build.yml'
        test "$(git rev-parse HEAD:runsc/container/container_save_restore_test.go)" = 6818655c7dd2c3a8b9b0557ba12112f1a18b5c73
        test "$(git rev-parse HEAD:test/rbe/tmpfs_profile/pair-run.py)" = 2fa7067efded5142a68ed0e1c46c9436b47292cb
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /var/run/docker.sock:/var/run/docker.sock -v "$(command -v docker):/usr/local/bin/docker:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Stage the comparison driver
      id: prep
      run: |
        mkdir -p "$RUNNER_TEMP/pair/records"
        cp test/rbe/tmpfs_profile/{pair-run,queue-profile}.py "$RUNNER_TEMP/pair/"
    - name: Run the core graph and printer suite with callback ordering and short-table controls
      id: normal
      run: python3 "$RUNNER_TEMP/pair/queue-profile.py" normal
    - name: Run the same suite under the race detector
      id: race
      if: ${{ !cancelled() && steps.prep.outcome == 'success' }}
      run: python3 "$RUNNER_TEMP/pair/queue-profile.py" race
    - name: Capture a 50000-file kernel once and verify the restored file tree
      id: capture
      if: ${{ !cancelled() && steps.normal.outcome == 'success' }}
      run: python3 "$RUNNER_TEMP/pair/queue-profile.py" capture
    - name: Profile a single cold decode on unchanged master
      id: stock
      if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
      run: python3 "$RUNNER_TEMP/pair/queue-profile.py" stock
    - name: Profile a single cold decode of the same checkpoint on the candidate
      id: candidate
      if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
      run: python3 "$RUNNER_TEMP/pair/queue-profile.py" candidate
    - name: Reconcile both original samples and the two owners
      if: always()
      env:
        OUTCOMES: ${{ toJSON(steps) }}
      run: |
        python3 - <<'PYTHON'
        import json, os, pathlib, time
        p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pair" / "records"
        p.mkdir(parents=True, exist_ok=True)
        outcomes = {key: item["outcome"] for key, item in json.loads(os.environ["OUTCOMES"]).items()}
        complete = all(outcomes.get(key) == "success" for key in ("normal", "race", "capture", "stock", "candidate"))
        verified = supported = False
        if complete:
            old, new = [json.loads((p / (key + ".json")).read_text()) for key in ("stock", "candidate")]
            verified = old["source"] == os.environ["BASE"] and new["source"] == os.environ["PRODUCT"] and old["binary_sha256"] != new["binary_sha256"] and old["frozen"] == new["frozen"] and old["benchmark_blob"] == new["benchmark_blob"] == "588cc13ed911b4a04f5d192032a5afa315be61a0"
            supported = old["alloc_space"]["flat"] > 500000 and new["alloc_space"]["flat"] < 65536 and old["alloc_objects"]["flat"] > new["alloc_objects"]["flat"]
        (p / "verdict.json").write_text(json.dumps({"verified": verified, "queue_savings_observed": supported, "source": os.environ["PRODUCT"], "phases": outcomes, "at_ns": time.time_ns()}, indent=2))
        raise SystemExit(0 if verified else 1)
        PYTHON
    - name: Check the public artifact boundary
      id: safe
      if: always()
      env:
        KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os, pathlib
        directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pair" / "records"
        key = os.environ["KEY"].encode()
        assert directory.is_dir() and key
        for f in directory.iterdir():
            assert f.is_file() and not f.is_symlink() and f.suffix in {".json", ".xml"}
            content = f.read_bytes()
            assert key not in content and not any(s in content.lower() for s in (b"x-buildbuddy-api-key", b"authorization:", b"begin private key"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.safe.outcome == 'success' }}
      with:
        name: graph-completion-queue
        path: ${{ runner.temp }}/pair/records/
        if-no-files-found: error
