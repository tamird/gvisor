name: Report retained state samples with benchstat
on:
  push:
    branches: [qualification/state-window-benchstat]
permissions:
  actions: read
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - name: Reconcile the retained timing samples
      env:
        GH_TOKEN: ${{ github.token }}
      working-directory: ${{ runner.temp }}
      run: |
        python3 - <<'PY'
        import hashlib, io, json, pathlib, re, subprocess, zipfile
        sources = [
            ('stock', 13024129668, 'e6d89729059310205237d4f9d79ded1dcc0d5fea01f01bfe5fe466e11b43350f', 'base/test.log'),
            ('updated', 13026721647, '99901f8f991204bbd83dc8a44a2ba60835282c472a84a6d2b82c858a88f24faf', 'full/state.test.log'),
        ]
        out = pathlib.Path('report')
        out.mkdir()
        for label, artifact, digest, name in sources:
            blob = subprocess.check_output(['gh', 'api', f'repos/tamird/gvisor/actions/artifacts/{artifact}/zip'])
            assert hashlib.sha256(blob).hexdigest() == digest
            with zipfile.ZipFile(io.BytesIO(blob)) as z:
                log = z.read(name).decode()
            rows = re.findall(r'WINDOW-SAVE n=2048 order=(wide|narrow) sample=(\d+) save_ns=(\d+) bytes=(\d+)', log)
            assert sorted((o,int(i)) for o,i,t,b in rows) == [(o,i) for o in ('narrow','wide') for i in range(6)]
            assert {int(b) for o,i,t,b in rows} == {8119}
            (out/label).write_text(''.join(f'BenchmarkSharedSliceSave/order={o} 1 {t} ns/op\n' for o,i,t,b in rows if i != '0'))
        (out/'sources.json').write_text(json.dumps(sources))
        PY
    - name: Calculate benchstat from the two original samples
      working-directory: ${{ runner.temp }}/report
      run: |
        go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e stock updated | tee benchstat.txt
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: shared-window-benchstat
        path: ${{ runner.temp }}/report
        if-no-files-found: error
