name: Read the original SandboxExec distribution failure
"on":
  push:
    branches: [qualification/mixed-flit-original-stderr]
permissions:
  actions: read
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bind the verified reader and the original writer receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          task="$RUNNER_TEMP/mixed-flit-diagnostic"
          mkdir -p "$task"
          cd "$task"
          git init -q .
          git fetch --quiet --no-tags --depth=2 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD^)" = a57a8be7f0f73f1862a4e0797cab6ac1ff4b1b62
          git diff --exit-code FETCH_HEAD^ FETCH_HEAD -- . ':!.github/workflows/build.yml'
          git fetch --quiet --no-tags --depth=1 https://github.com/tamird/gvisor.git 7aa5d441a1078a4e9e77547a2a56e23faa6fc238
          test "$(git rev-parse FETCH_HEAD:test/rbe/plugin_programs/cas_inputs.py)" = 54047870d2d32c621a5c8616687a74bdc75001d5
          git show FETCH_HEAD:test/rbe/plugin_programs/cas_inputs.py > cas_inputs.py
          gh api repos/tamird/gvisor/actions/artifacts/13580519640/zip > original.zip
          echo '5e59cbb967e9d9c2b8f46409c80c7ac75a44ed8428866600be2182fd548c27ad  original.zip' | sha256sum -c -
      - name: Read and verify the one original 260-byte writer stderr
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/mixed-flit-diagnostic"
          python3 -IB - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import zipfile
          sys.path.insert(0, str(Path.cwd()))
          from cas_inputs import blob

          with zipfile.ZipFile("original.zip") as archive:
              original = json.loads(archive.read("outputs.json"))
          invocation = "78ad8dfa-f556-4cbe-a9bb-7cc73fcbdb4e"
          digest = "4f409f8c9a96120c010b2721de7b3395a716452a52ee46981b9f328b306503df"
          owner = "//sandboxexec/sandbox/python:dist"
          assert original["source"] == "331c9f51e7e380fc243f8dcae646a9794f2aef65"
          assert original["invocation"] == original["bep"]["iid"] == invocation
          assert original["bep"]["exit"] == 1 and not original["bep"]["complete"]
          failed, = original["bep"]["failures"]
          assert failed == {"owner": owner, "mnemonic": "SandboxExecDist", "exit": 1, "stderr": [digest, 260]}
          raw = blob({"hash": digest, "sizeBytes": 260}, invocation)
          assert len(raw) == 260 and hashlib.sha256(raw).hexdigest() == digest
          key = os.environ.pop("BUILDBUDDY_API_KEY").encode()
          assert key and key not in raw
          assert not re.search(rb"(?i)https?://|bearer |authorization|password|api[-_]?key=|token=", raw)
          lines = raw.decode("utf-8").splitlines()
          assert len(lines) <= 16 and all(all(c.isprintable() or c == "\t" for c in line) for line in lines)
          # Keep original messages and source locations. Normalize only runner-specific path components.
          text = [re.sub(r"/(?:buildbuddy|tmp|home/runner)/[^\s\x22']*?/(?:execroot/[^/]+/)?(?=sandboxexec/|external/)", "<execroot>/", line) for line in lines]
          result = {"source": original["source"], "invocation": invocation, "owner": owner,
                    "mnemonic": failed["mnemonic"], "exit": failed["exit"], "sha256": digest,
                    "size": len(raw), "diagnostic": text}
          Path("diagnostic.json").write_text(json.dumps(result, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-sandboxexec-dist-stderr
          path: ${{ runner.temp }}/mixed-flit-diagnostic/diagnostic.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove the temporary original data
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mixed-flit-diagnostic"
