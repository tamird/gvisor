name: Check the OCI TCP buffer Nogo owners
on:
  push:
    branches: [qualification/oci-tcp-buffer-owners]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/oci-tcp-buffer-owners'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      SOURCE: e290b349e0d5d5e92ed816f30599112870f5c811
      SUPPORT: e5f3df889d68e39a1dff10a805c921fea0bf5867
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 3
        persist-credentials: false
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^1) == "$SOURCE" && $(git rev-parse HEAD^2) == "$SUPPORT" ]]
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Start the existing GNU Bazel coordinator
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name overlay-guest --entrypoint /bin/bash --user root --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt systempaths=unconfined -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
    - name: Check the changed proc and boot owners on AMD64 and ARM64
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -euo pipefail
        out=$RUNNER_TEMP/proof
        check=$RUNNER_TEMP/oci-check
        mkdir -p "$out" "$check"
        for f in qualification_report.py unit_matrix.py; do
          git show "$SUPPORT:.github/qualification/bwrap/$f" > "$check/$f"
        done
        git checkout --quiet --detach "$SOURCE"
        git rev-parse HEAD > "$out/final-head.txt"
        test "$(cat "$out/final-head.txt")" = "$SOURCE"
        git cat-file -p HEAD > "$out/commit.txt"
        git status --porcelain --untracked-files=no > "$out/source-before.txt"
        test ! -s "$out/source-before.txt"
        labels=(//pkg/sentry/fsimpl/proc:proc_nogo //runsc/boot:boot_nogo)
        printf '%s\n' "${labels[@]}" > "$out/targets.txt"
        args=(test --config=x86_64 --jobs=6 --strategy=TestRunner=remote --strategy=GoStdlib=linux-sandbox --strategy=GoStdlibList=linux-sandbox --strategy=GoStandardLibraryAnalysis=linux-sandbox --strategy=GoStaticAnalysis=linux-sandbox '--modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache,^TestRunner$=+no-remote-cache' --nocache_test_results --keep_going --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_sharding_strategy=disabled --test_timeout=900 --test_output=errors --output_groups=default,nogo_findings --build_event_json_file_path_conversion=false "--build_event_json_file=$RUNNER_TEMP/oci-owners-raw.jsonl" "${labels[@]}")
        printf '%s\n' "${args[@]}" > "$out/arguments.txt"
        code=0; capture=0; verify=0; arch=0
        log=$RUNNER_TEMP/oci-owners.log
        printf '%s\n' "$(date -u +%FT%T.%3NZ)" > "$out/start.txt"
        docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel "--bazelrc=$RUNNER_TEMP/overlay.bazelrc" "${args[@]}" > "$log" 2>&1 & pid=$!
        (while sleep 50; do echo "Nogo heartbeat $(date -u +%FT%TZ) $(wc -c < "$log") bytes"; tail -c 500 "$log"; done) & keeper=$!
        wait "$pid" || code=$?
        kill "$keeper" 2>/dev/null || :
        wait "$keeper" 2>/dev/null || :
        finished=$(date -u +%FT%T.%3NZ)
        echo "$code" > "$out/native-exit.txt"
        echo "$finished" > "$out/end.txt"
        git rev-parse HEAD > "$out/final-head.txt"
        git status --porcelain --untracked-files=no > "$out/source-after.txt"
        grep -E 'Invocation ID|^ERROR:|remote host|error:|FAILED|PASSED|^FAIL:' "$log" | tail -120 > "$out/diagnostics.txt" || :
        for label in "${labels[@]}"; do
          name=${label##*:}
          package=${label#//}; package=${package%:*}
          for cpu in amd64 arm64; do
            path="bazel-bin/$package/$name.$cpu.findings"
            docker exec overlay-guest sha256sum "$path" > "$out/$name.$cpu.sha256" || arch=1
          done
          docker exec overlay-guest cat "bazel-testlogs/$package/$name/test.log" > "$out/$name.log" || arch=1
          for cpu in amd64 arm64; do grep -F "$cpu..." "$out/$name.log" >/dev/null || arch=1; done
        done
        docker exec overlay-guest python3 -B "$check/qualification_report.py" capture --events "$RUNNER_TEMP/oci-owners-raw.jsonl" --output "$out/events.jsonl" --output-root "$GITHUB_WORKSPACE/bazel-out" --report-dir "$out/reports" --expected-kind test || capture=$?
        docker exec overlay-guest chown -R "$(id -u):$(id -g)" "$out"
        printf '%s\n' "$capture" > "$out/capture-exit.txt"
        printf '%s\n' "$arch" > "$out/architectures-exit.txt"
        python3 - "$out" "$SOURCE" "$finished" <<'PY'
        import json, sys
        from pathlib import Path
        out = Path(sys.argv[1])
        ctx = dict(expected_source=sys.argv[2], command_kind="test", execution_finished_at=sys.argv[3], commit_file="commit.txt", source_before="source-before.txt", source_after="source-after.txt", final_head="final-head.txt", executed_arguments="arguments.txt", native_exit="native-exit.txt", capture_exit="capture-exit.txt")
        (out / "context.json").write_text(json.dumps(ctx))
        PY
        python3 -B "$check/qualification_report.py" verdict --context "$out/context.json" --events "$out/events.jsonl" --manifest "$out/events.jsonl.manifest.json" --expected-targets "$out/targets.txt" --output "$out/verdict.json" || verify=$?
        if ((code)); then exit "$code"; fi
        if ((capture)); then exit "$capture"; fi
        if ((arch)); then exit "$arch"; fi
        exit "$verify"
    - name: Sanitize the receipt
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PY_REDACT'
        import os
        from pathlib import Path
        key = os.environ['BB_KEY'].encode()
        for p in (Path(os.environ['RUNNER_TEMP'])/'proof').rglob('*'):
            if key and p.is_file() and key in (data := p.read_bytes()):
                p.write_bytes(data.replace(key, b'[REDACTED]'))
        PY_REDACT
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: oci-tcp-buffer-owners
        path: ${{ runner.temp }}/proof/
        if-no-files-found: error
