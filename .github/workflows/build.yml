name: Compare the interrupted TCP flight boundary on the wire
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/rto-flight-cross-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 5
        persist-credentials: false
    - name: Observe the same two packet inputs on Linux and netstack
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD^1^1)" = "b59f6644079d3654fa46edbf2d3eab4045bcc95a"
        mkdir -p "$RUNNER_TEMP/checker"
        for file in qualify.sh unit_matrix.py qualification_report.py tcp_fence_report.py; do
          cp "test/rbe/$file" "$RUNNER_TEMP/checker/$file"
        done
        python3 -m py_compile "$RUNNER_TEMP/checker/"*.py
        mkdir -p "$RUNNER_TEMP/fifo_platform" "$RUNNER_TEMP/fifo"
        platform=$RUNNER_TEMP/fifo_platform
        printf '%s\n' 'module(name="fifo_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/fifo.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=linux-sandbox' 'build --strategy=TestRunner=local' 'build --jobs=4' \
            'build --remote_accept_cached' \
            "build --inject_repository=fifo_platform=$platform" \
            'build --host_platform=@fifo_platform//:ubuntu' \
            'build --extra_execution_platforms=@fifo_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        export FIFO_RC=$rc
        mkdir -p "$RUNNER_TEMP/fifo-bin"
        cat > "$RUNNER_TEMP/fifo-bin/bazel" <<'SH'
        #!/bin/sh
        case "$1" in
          test)
            # Capture the actual argv and Bazel exit, independent of the qualifier's exit.
            printf '%s\n' "$@" > "$TCP_EVIDENCE/executed_arguments"
            status=0
            bazelisk --bazelrc="$FIFO_RC" "$@" || status=$?
            printf '%s\n' "$status" > "$TCP_EVIDENCE/native_exit"
            date -u '+%Y-%m-%dT%H:%M:%S.%3N+00:00' > "$TCP_EVIDENCE/finished"
            exit "$status"
            ;;
        esac
        exec bazelisk --bazelrc="$FIFO_RC" "$@"
        SH
        chmod +x "$RUNNER_TEMP/fifo-bin/bazel"
        export PATH="$RUNNER_TEMP/fifo-bin:$PATH"
        if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        test -x /sbin/iptables-nft
        test -x /sbin/ip6tables-nft
        test -x /usr/bin/x86_64-linux-gnu-gcc
        mkdir -p "$RUNNER_TEMP/replay-public"
        printf '%s\n' '{"status":"INCOMPLETE","phase":"compiler installation"}' > "$RUNNER_TEMP/replay-public/preflight.json"
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu tcpdump
        export FENCE_HOST_ID=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT FENCE_HOST_PROBE=$RUNNER_TEMP/host-marker
        printf '%s' "$FENCE_HOST_ID" > "$FENCE_HOST_PROBE"
        probe_raw=$RUNNER_TEMP/host-probe.jsonl
        printf '%s\n' '{"status":"INCOMPLETE","phase":"Bazel host compiler/namespace test"}' > "$RUNNER_TEMP/replay-public/preflight.json"
        bazelisk --bazelrc="$rc" test --nocache_test_results --test_output=all --strategy=TestRunner=local \
          --test_env=FENCE_HOST_ID --test_env=FENCE_HOST_PROBE --build_event_json_file="$probe_raw" \
          //test/rbe/fence_host_probe:check
        python3 - "$probe_raw" "$RUNNER_TEMP/replay-public/preflight.json" <<'PYCHECK'
        import json, sys
        from pathlib import Path
        events = [json.loads(row) for row in Path(sys.argv[1]).read_text().splitlines()]
        results = [e["testResult"] for e in events if "testResult" in e]
        assert len(results) == 1, results
        result = results[0]
        assert result["status"] == "PASSED" and not result.get("cachedLocally"), result
        assert result["executionInfo"]["strategy"] in ("local", "standalone"), result["executionInfo"]
        assert not result["executionInfo"].get("cachedRemotely"), result["executionInfo"]
        Path(sys.argv[2]).write_text(json.dumps({"status":"PASS","target":"//test/rbe/fence_host_probe:check","execution":result["executionInfo"],"hostMarker":True,"writableDAD":True,"crossCompilers":["x86_64","aarch64"]})+"\n")
        print("Both compilers, namespace sysctl, real host marker and uncached local TestRunner verified")
        PYCHECK
        overall=0
        mkdir -p "$RUNNER_TEMP/replay-private" "$RUNNER_TEMP/replay-public"
        for arm in linux stock pr16081 pr16495; do
          variant=netstack
          case $arm in
            linux|stock) source=0a327bb504c4546650bba238595bcd89e1a2e279; parent=3783a01936040c062d46a6ab20201307d34644f0 ;;
            pr16081) source=8c72427d96b655a40558ed65395de1e63398ea00; parent=0a327bb504c4546650bba238595bcd89e1a2e279 ;;
            pr16495) source=b59f6644079d3654fa46edbf2d3eab4045bcc95a; parent=0a327bb504c4546650bba238595bcd89e1a2e279 ;;
          esac
          if [[ $arm == linux ]]; then variant=native; fi
          label=//test/packetimpact/tests:tcp_rack_${variant}_test
          if ! git cat-file -e "$source^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=2 "https://github.com/$GITHUB_REPOSITORY.git" "$source"
          fi
          git checkout --quiet --detach "$source"
          test "$(git rev-parse HEAD)" = "$source"
          test "$(git rev-parse HEAD^)" = "$parent"
          git diff --quiet 0a327bb504c4546650bba238595bcd89e1a2e279 "$source" -- . ':(exclude)pkg/tcpip/transport/tcp/**'
          export TCP_EVIDENCE="$RUNNER_TEMP/replay-private/$arm"
          mkdir -p "$TCP_EVIDENCE" test/rbe
          cp "$RUNNER_TEMP/checker/qualify.sh" "$RUNNER_TEMP/checker/unit_matrix.py" test/rbe/
          git status --porcelain --untracked-files=no > "$TCP_EVIDENCE/source_before"
          test ! -s "$TCP_EVIDENCE/source_before"
          git cat-file commit HEAD > "$TCP_EVIDENCE/commit_file"
          raw="$RUNNER_TEMP/replay-private/$arm.raw.jsonl"
          uname -r > "$TCP_EVIDENCE/kernel"
          code=0
          bazel test --config=x86_64 --strategy=TestRunner=local --spawn_strategy=linux-sandbox \
            --jobs=4 --test_env=GO_TEST_WRAP_TESTV=1 --test_env=GVISOR_TEST_CLOCK_SOURCE=calibrated \
            --define=gvisor_test_clock_source=calibrated --strip=never --test_sharding_strategy=disabled \
            --nocache_test_results --test_output=all "--build_event_json_file=$raw" \
            --build_event_json_file_path_conversion=false "$label" || code=$?
          printf '%s\n' "$code" > "$TCP_EVIDENCE/runner_exit"
          git rev-parse HEAD > "$TCP_EVIDENCE/final_head"
          git status --porcelain --untracked-files=no > "$TCP_EVIDENCE/source_after"
          python3 -B "$RUNNER_TEMP/checker/tcp_fence_report.py" "$TCP_EVIDENCE" "$arm" "$source" "$label" "$raw" "$RUNNER_TEMP/replay-public" || overall=1
          # If the common target cannot compile, repeating three builds cannot add measurements.
          if [[ $arm == linux && ! -s "$raw" ]]; then break; fi
          if [[ $arm == linux && $code != 0 ]] && ! grep -q '"testResult":' "$raw"; then break; fi
        done
        python3 - "$RUNNER_TEMP/replay-public" <<'PYRESULT'
        import json, sys
        from pathlib import Path
        root = Path(sys.argv[1])
        arms = ["linux","stock","pr16081","pr16495"]
        verdicts = {a: json.loads((root / (a + ".json")).read_text()) for a in arms if (root / (a + ".json")).is_file()}
        missing = [a for a in arms if a not in verdicts]
        result = {"expected":arms,"executed":list(verdicts),"missing":missing,"status":"PASS" if not missing and all(v["status"] == "PASS" for v in verdicts.values()) else "FAIL"}
        (root / "summary.json").write_text(json.dumps(result, indent=2) + "\n")
        print(result)
        sys.exit(result["status"] != "PASS")
        PYRESULT
        exit "$overall"
    - name: Save only the typed results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: tcp-rto-flight-boundary
        path: ${{ runner.temp }}/replay-public/*.json
        if-no-files-found: error
