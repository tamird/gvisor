name: Verify TCP cookie handshakes and negotiated windows with the GNU toolchain
on:
  push:
    branches: [qualification/tcp-cookie-gnu-missing]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/tcp-cookie-gnu-missing'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 5
        persist-credentials: false
    - name: Recover the completed native packet observations from their original invocation
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        python3 - "$RUNNER_TEMP/replay-public" <<'PYRECEIPT' || echo 'Original evidence is incomplete; keep running the missing arms.'
        """Recover the original packet bytes after GitHub cancelled artifact collection."""

        import hashlib
        from http.client import HTTPSConnection
        import json
        import os
        from pathlib import Path
        import re
        import sys
        from urllib.parse import urlsplit
        from xml.etree import ElementTree

        invocation = '344ad19f-9bb2-4d19-9b6e-fffe84e20544'
        source = '249a997c7478cc4bdb21cc248ccb554ed8aba71b'
        target = '//test/packetimpact/tests:tcp_syncookie_native_test'
        proof = Path(sys.argv[1])
        proof.mkdir(parents=True, exist_ok=True)

        def request(method, body):
            connection = HTTPSConnection('app.buildbuddy.io', timeout=45)
            try:
                connection.request('POST', '/api/v1/' + method, json.dumps(body), {'Content-Type': 'application/json', 'x-buildbuddy-api-key': os.environ['BUILDBUDDY_API_KEY']})
                with connection.getresponse() as response:
                    if response.status != 200:
                        raise ValueError(f'{method}: HTTP {response.status}')
                    return response.read(16 * 1024 * 1024 + 1)
            finally:
                connection.close()

        def evidence():
            sel = {'selector': {'invocation_id': invocation}}
            meta, = json.loads(request('GetInvocation', sel))['invocation']
            selected = {'selector': {'invocation_id': invocation, 'target_label': target}}
            action_response = json.loads(request('GetAction', selected))
            files = {name: {} for name in ('test.log', 'test.xml')}
            for action in action_response.get('action', []):
                if action.get('targetLabel') != target:
                    raise ValueError('incorrect action owner')
                for file in action.get('file', []):
                    name = file.get('name', '').split('/')[-1]
                    if name in files:
                        files[name][file['uri']] = file
            result = {'arm':'native','invocation':invocation,'expected_source':source,'source_metadata':meta.get('commitSha'), 'expected_labels':[target], 'execution_origin':'original run 41223629069; source and clean tree checked in its workflow', 'errors':[], 'missing':[], 'files':{}}
            data = {}
            for name, uris in files.items():
                if len(uris) != 1:
                    raise ValueError(f'{name}: {len(uris)} distinct original reports')
                uri, = uris
                parsed = urlsplit(uri)
                cas = re.search(r'/blobs/([0-9a-f]{64})/(\d+)$',parsed.path)
                if parsed.scheme != 'bytestream' or not cas:
                    raise ValueError(f'{name}: missing CAS identity')
                raw = request('GetFile', {'uri': uri}); digest, size = cas.groups()
                if len(raw) != int(size) or hashlib.sha256(raw).hexdigest() != digest:
                    raise ValueError(f'{name}: original CAS content mismatch')
                data[name] = raw; result['files'][name] = {'sha256':digest, 'bytes':int(size)}
            cases = list(ElementTree.fromstring(data['test.xml']).iter('testcase'))
            counts = {k: sum(any(c.find(x) is not None for x in tags) for c in cases) for k,tags in [('failed',('failure','error')),('skipped',('skipped',))]}
            counts['passed'] = len(cases) - sum(counts.values()); result['case_counts']=counts
            rows = [line[line.index('COOKIE_WS '):].strip() for line in data['test.log'].decode().splitlines() if 'COOKIE_WS ' in line]
            result['observed']=rows
            if not counts['passed'] or counts['failed'] or counts['skipped'] or len(rows)!=2 or any(sum(f'timestamps={ts} ' in row and f'window_field=16 initial_bytes={n} want_bytes={n}' in row for row in rows) != 1 for ts,n in [('true',128),('false',16)]):
                raise ValueError(f'original test evidence disagrees: {counts}, {rows}')
            result.update(verified=True,status='PASS',verification_errors=[])
            return result

        try:
            result=evidence()
        except Exception as error:
            result={'arm':'native','invocation':invocation,'verified':False,'status':'INCOMPLETE','verification_errors':[str(error)]}
        (proof/'native.json').write_text(json.dumps(result,indent=2)+'\n')
        print(json.dumps(result)); sys.exit(not result['verified'])
        PYRECEIPT
    - name: Run the four packet targets that never started
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD^1)" = "9f849b37e8c0e26e35e43a46cf188450f86b6d12"
        mkdir -p "$RUNNER_TEMP/checker"
        for file in qualify.sh unit_matrix.py qualification_report.py tcp_long_replay.py; do
          cp "test/rbe/$file" "$RUNNER_TEMP/checker/$file"
        done
        python3 -m py_compile "$RUNNER_TEMP/checker/"*.py
        mkdir -p "$RUNNER_TEMP/fifo_platform" "$RUNNER_TEMP/fifo"
        GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
        platform=$RUNNER_TEMP/fifo_platform
        printf '%s\n' 'module(name="tcp_gnu")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "gnu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "firecracker",
                "EstimatedMemory": "4GB",
                "container-image": "docker://gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/fifo.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
            'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
            'build --remote_accept_cached' \
            "build --inject_repository=tcp_gnu=$platform" \
            'build --host_platform=@tcp_gnu//:gnu' \
            'build --extra_execution_platforms=@tcp_gnu//:gnu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        printf '%s\n' 'build:rbe --spawn_strategy=remote' >> "$rc"
        # Configure Bazel's host toolchain against the same compiler and libc
        # available to build actions. Tests still select the Firecracker image
        # with iptables through their target's execution properties.
        export TCP_BAZEL_ROOT="$HOME/.cache/bazel/_bazel_runner"
        mkdir -p "$TCP_BAZEL_ROOT"
        docker pull --platform linux/amd64 "$GNU"
        docker run -d --name tcp-gnu --entrypoint /bin/bash --user "$(id -u):$(id -g)" \
          -e "HOME=$HOME" -e "USER=$USER" -v "$HOME/.cache/bazel:$HOME/.cache/bazel" \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
          -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-gnu x86_64-linux-gnu-gcc -dumpfullversion
        docker exec tcp-gnu aarch64-linux-gnu-gcc -dumpfullversion
        docker exec tcp-gnu bazel --version
        export FIFO_RC=$rc
        mkdir -p "$RUNNER_TEMP/fifo-bin"
        cat > "$RUNNER_TEMP/fifo-bin/bazel" <<'SH'
        #!/bin/sh
        case "$1" in
          test)
            # Capture the actual argv and Bazel exit, independent of the qualifier's exit.
            printf '%s\n' "$@" > "$TCP_EVIDENCE/executed_arguments"
            status=0
            docker exec tcp-gnu bazel --output_user_root="$TCP_BAZEL_ROOT" --bazelrc="$FIFO_RC" "$@" || status=$?
            printf '%s\n' "$status" > "$TCP_EVIDENCE/native_exit"
            date -u '+%Y-%m-%dT%H:%M:%S.%3N+00:00' > "$TCP_EVIDENCE/finished"
            exit "$status"
            ;;
        esac
        exec docker exec tcp-gnu bazel --output_user_root="$TCP_BAZEL_ROOT" --bazelrc="$FIFO_RC" "$@"
        SH
        chmod +x "$RUNNER_TEMP/fifo-bin/bazel"
        export PATH="$RUNNER_TEMP/fifo-bin:$PATH"
        overall=0
        mkdir -p "$RUNNER_TEMP/replay-private" "$RUNNER_TEMP/replay-public"
        for arm in netstack stock-native fixed-native fixed-netstack; do
          case $arm in
            native|netstack) source=249a997c7478cc4bdb21cc248ccb554ed8aba71b; parent=df25b25c88d3b7dd52957039bd228fa63a1679d7 ;;
            stock-native) source=8b385d7316941e0e4eacc58276ef072b4410803f; parent=aa767e4c43d011121271551fe24da501a56f729d ;;
            fixed-native|fixed-netstack) source=619758d82036e4647928c485d6cf36c333f81cce; parent=e40d5fe9cdb59a09f5136d9a0761257d8db1a6d1 ;;
          esac
          git fetch --no-tags --depth=2 "https://github.com/$GITHUB_REPOSITORY.git" "$source"
          git checkout --quiet --detach "$source"
          test "$(git rev-parse HEAD)" = "$source"
          test "$(git rev-parse HEAD^)" = "$parent"
          export TCP_EVIDENCE="$RUNNER_TEMP/replay-private/$arm"
          mkdir -p "$TCP_EVIDENCE" test/rbe
          cp "$RUNNER_TEMP/checker/qualify.sh" "$RUNNER_TEMP/checker/unit_matrix.py" test/rbe/
          git status --porcelain --untracked-files=no > "$TCP_EVIDENCE/source_before"
          test ! -s "$TCP_EVIDENCE/source_before"
          git cat-file commit HEAD > "$TCP_EVIDENCE/commit_file"
          raw="$RUNNER_TEMP/replay-private/$arm.raw.jsonl"
          code=0
          opts=()
          labels=("//test/packetimpact/tests:tcp_syncookie_${arm#*-}_test")
          selection=()
          for target in "${labels[@]}"; do selection+=("--test-target=$target"); done
          bash test/rbe/qualify.sh --arch=amd64 "${selection[@]}" "${opts[@]}" \
            "--bazel-option=--build_event_json_file=$raw" --bazel-option=--build_event_json_file_path_conversion=false \
            --bazel-option=--test_sharding_strategy=disabled --bazel-option=--cache_test_results=no \
            --bazel-option=--jobs=32 --bazel-option=--remote_download_outputs=toplevel test || code=$?
          printf '%s\n' "$code" > "$TCP_EVIDENCE/runner_exit"
          git rev-parse HEAD > "$TCP_EVIDENCE/final_head"
          git status --porcelain --untracked-files=no > "$TCP_EVIDENCE/source_after"
          python3 -B "$RUNNER_TEMP/checker/tcp_long_replay.py" "$TCP_EVIDENCE" "$arm" "$source" "${labels[*]}" "$raw" "$RUNNER_TEMP/replay-public" || overall=1
        done
        python3 - "$RUNNER_TEMP/replay-public" <<'PYRESULT'
        import json, sys
        from pathlib import Path
        root = Path(sys.argv[1])
        arms = ["native","netstack","stock-native","fixed-native","fixed-netstack"]
        verdicts = {a: json.loads((root / (a + ".json")).read_text()) for a in arms if (root / (a + ".json")).is_file()}
        missing = [a for a in arms if a not in verdicts]
        result = {"expected":arms,"executed":list(verdicts),"missing":missing,"status":"PASS" if not missing and all(v["verified"] for v in verdicts.values()) else "FAIL"}
        (root / "summary.json").write_text(json.dumps(result, indent=2) + "\n")
        print(result)
        sys.exit(result["status"] != "PASS")
        PYRESULT
        exit "$overall"
    - name: Save only the typed results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cookie-wire-recovered
        path: ${{ runner.temp }}/replay-public/*.json
        if-no-files-found: error
