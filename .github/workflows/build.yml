name: Report the retained TCP packet-accounting benchmark with benchstat
on:
  push:
    branches: [qualification/tcp-sack-benchstat]
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Reconcile the initial result and eight source-bound pairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/packet-bench"
          mkdir -p "$out"
          gh run download 40996472066 -R tamird/gvisor -n sack-packet-cost -D "$RUNNER_TEMP/original"
          echo "73d0cae13d6300a8935212beed70e7edec2c1077cfd62e17a34fd7135254a9b4  $RUNNER_TEMP/original/verdict.json" | sha256sum -c -
          python3 - "$RUNNER_TEMP/original" "$out" <<'INNER'
          import pathlib,re,sys
          src,out=map(pathlib.Path,sys.argv[1:])
          for arm in ('stock','candidate'):
            series=[]
            for n in range(1,9):
              raw=(src/f'cost-{arm}-{n}-test.log').read_text()
              values=[line for line in raw.splitlines() if re.search(r'^BenchmarkRACKSparseCoverage/.*ns/op.*allocs/op$',line)]
              if len(values)!=6: raise SystemExit((arm,n,len(values)))
              series.extend(values)
            (out/f'{arm}.bench').write_text('\n'.join(series)+'\n')
          INNER
      - name: Run the project’s pinned x/perf analyzer
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/packet-bench"
          test "$(git rev-parse HEAD^)" = 2b51abee8530385431b7225198fdd5cd65e78696
          git checkout -q --detach 2b51abee8530385431b7225198fdd5cd65e78696
          tgt=@org_golang_x_perf//cmd/benchstat
          bazel build -c opt --config=x86_64 --jobs=4 "$tgt"
          bazel cquery --config=x86_64 -c opt --output=files "$tgt" > "$RUNNER_TEMP/executables"
          mapfile -t tools < <(while IFS= read -r f; do if test -f "$f" && test -x "$f"; then echo "$f"; fi; done < "$RUNNER_TEMP/executables")
          test "${#tools[@]}" = 1
          exe="$PWD/${tools[0]}"
          sha256sum "$exe" >"$out/tool-sha256"
          (cd "$out"; "$exe" stock.bench candidate.bench | tee benchstat.txt)
          test "$(grep -c 'RACKSparseCoverage' "$out/benchstat.txt")" -ge 6
          echo 'v0.0.0-20260929162123-406019bb8b68' >"$out/benchstat-version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sack-benchstat
          path: ${{ runner.temp }}/packet-bench
