name: Cross-build the public race binaries and boot them on ARM64
on:
  push:
    branches: [qualification/scratch-race-release-generators]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 4}
      - name: Select the scratch release and the verified supplier patch
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/release-rbe"
          mkdir -p "$d"/{harness,handoff}
          cp .github/qualification/{arm64_race_release.py,arm64_race_elf.py} "$d/harness/"
          cp test/rbe/release_prewarmer/BUILD "$d/harness/"
          test "$(git rev-parse HEAD^)" = 709cd18c362576aaea12aa6d36c72034dbe001c8
          test "$(git rev-parse HEAD^^)" = 83f2d8568e1799eab47b02dc92da2988bdb001d9
          test "$(git rev-parse HEAD^^^)" = 87fd1b411e0f2d06557f04e1f33b154692cfd2eb
          git checkout -q --detach HEAD^
          mkdir -p test/rbe/release_prewarmer
          cp "$d/harness/BUILD" test/rbe/release_prewarmer/BUILD
          test "$(cat .bazelversion)" = 9.3.1
          curl --retry 3 -fsSL --proto '=https' --proto-redir '=https' --max-time 100 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          curl --retry 3 -fsSL --proto '=https' --proto-redir '=https' --max-time 100 https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 -o "$d/bb"
          (cd "$d" && sha256sum --check <<'SUMS'
          e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  bazel
          205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  bb
          SUMS
          )
          chmod 755 "$d/bazel" "$d/bb"
          test "$("$d/bazel" --version)" = 'bazel 9.3.1'
      - name: Execute the ARM64 Go links on shell-free AMD64
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/release-rbe"
          rc="$d/private.bazelrc"
          trap 'rm -f "$rc"' EXIT
          test -n "$BUILDBUDDY_API_KEY"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_SHA="$GITHUB_SHA" python3 -B "$d/harness/arm64_race_release.py" producer
      - name: Check the public result boundary
        id: boundary
        if: always()
        run: |
          test ! -e "$RUNNER_TEMP/release-rbe/private.bazelrc"
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"], "release-rbe", "producer.json")
          assert p.is_file() and not p.is_symlink() and 0 < p.stat().st_size < 65536
          raw = p.read_bytes()
          assert not re.search(rb"(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}", raw)
          r = json.loads(raw)
          assert r["status"] in ("PASS", "FAIL", "INCOMPLETE") and r["run"] == os.environ["GITHUB_RUN_ID"]
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.boundary.outcome == 'success'
        with:
          name: arm64-static-gnu-race-producer
          path: ${{ runner.temp }}/release-rbe/producer.json
          if-no-files-found: warn
          retention-days: 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm64-static-gnu-race-installation
          path: ${{ runner.temp }}/release-rbe/handoff/
          if-no-files-found: error
          retention-days: 1
  boot:
    needs: build
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: arm64-static-gnu-race-installation
          path: ${{ runner.temp }}/release-rbe/handoff
      - name: Run the installed race Sentry in the native release capsule
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/release-rbe"
          mkdir "$d/harness"
          cp .github/qualification/{arm64_race_release.py,arm64_race_elf.py} test/rbe/{runtime_cross.py,native_cross_inputs.py,runtime_guest.py} "$d/harness/"
          (cd "$d/harness" && sha256sum --check <<'SUMS'
          b0626fb5ecb5bb9c41d644ced5af036019cbefbeef7975c71878021f6e146653  native_cross_inputs.py
          32cc74e3f3e8189d9678b609a4058e60ea3a1e955566f229b34dc04b81f973c8  runtime_cross.py
          bce1d88d73ba07ca283697e2b9215eb06f1e2f2baacfb43130762ff914d27524  runtime_guest.py
          SUMS
          )
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_SHA="$GITHUB_SHA" python3 -B "$d/harness/arm64_race_release.py" consumer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-static-gnu-race-guest
          path: ${{ runner.temp }}/release-rbe/consumer.json
          if-no-files-found: warn
          retention-days: 5
