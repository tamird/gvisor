name: Recover original ARM64 parser execution metadata
on:
  push:
    branches: [qualification/llvm-parser-arm64-metadata]
permissions:
  contents: read
  actions: read
jobs:
  metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Recover existing TestParser records
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 test/rbe/llvm_parser_metadata.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-arm64-parser-metadata
          path: ${{ runner.temp }}/parser-metadata/result.json
          if-no-files-found: error
