name: Check the GC budget under nested cgroup limits
on:
  push:
    branches: [qualification/cgroup-gc-visible-limits]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: ${{ github.sha }}
      BASE: 7eccf74364d9d4cf13668a17c3ede7b9eebfe9f3
      STOCK: 70142be4618aed138595b80581b8eca734cefe2a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 6, persist-credentials: false}
    - name: Set up an isolated hierarchy on the Linux worker
      run: |
        set -euo pipefail
        d=/sys/fs/cgroup/gvisor-budget-$GITHUB_RUN_ID
        [[ $(stat -f -c %T /sys/fs/cgroup) == cgroup2fs ]]
        sudo mkdir "$d"
        for p in "$d" "$d/pod" "$d/pod/middle"; do
          if [[ "$p" != "$d" ]]; then sudo mkdir "$p"; fi
          echo +memory | sudo tee "$p/cgroup.subtree_control" >/dev/null
        done
        sudo mkdir "$d/pod/finite" "$d/pod/small" "$d/pod/middle/unlimited"
        echo 536870912 | sudo tee "$d/pod/memory.max" >/dev/null
        echo 2147483648 | sudo tee "$d/pod/finite/memory.max" >/dev/null
        echo 268435456 | sudo tee "$d/pod/small/memory.max" >/dev/null
        # No process enters the probe groups. Only their own limits are changed.
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD)" == "$CURRENT" ]]
        [[ "$(git rev-parse HEAD~2)" == "70142be4618aed138595b80581b8eca734cefe2a" && "$(git rev-parse HEAD~3)" == "$BASE" ]]
        git checkout --quiet --detach "$CURRENT"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root -v "/sys/fs/cgroup/gvisor-budget-$GITHUB_RUN_ID:/gc-budget:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Compare the reported cgroup limit and actual Go GC budget
      run: |
        set -euo pipefail
        d=$RUNNER_TEMP/records
        mkdir -p "$d"/{stock,corrected}
        cp test/rbe/gc_budget_verdict.py test/rbe/qualification_report.py test/rbe/unit_matrix.py "$RUNNER_TEMP/"
        git diff --exit-code "$STOCK" "$CURRENT" -- runsc/cgroup/BUILD runsc/cgroup/cgroup_v2_test.go pkg/gccontrol runsc/sandbox runsc/boot pkg/sentry/state
        for variant in stock corrected; do
          rev=$CURRENT
          if [[ "$variant" == stock ]]; then rev=$STOCK; fi
          git checkout --quiet --detach "$rev"
          git rev-parse HEAD > "$d/$variant/source"
          git diff --quiet
          rc=0
          docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --spawn_strategy=remote,local --noremote_upload_local_results --strategy=GoStaticAnalysis=local --strategy=GoStandardLibraryAnalysis=local --strategy=TestRunner=local --test_filter='^TestVisibleCgroupGCBudget$' --test_arg=-test.v --nocache_test_results --test_timeout=180 --test_sharding_strategy=disabled //runsc/cgroup:cgroup_test > "$RUNNER_TEMP/$variant.bazel.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$d/$variant/exit"
          grep -EA4 'Invocation ID:|ERROR:|FAILED|Build did NOT' "$RUNNER_TEMP/$variant.bazel.log" | tail -30 > "$d/$variant/diagnostics" || true
          for file in test.log test.xml; do
            docker exec tcp-compiler cat "bazel-testlogs/runsc/cgroup/cgroup_test/$file" > "$d/$variant/$file" || rm -f "$d/$variant/$file"
          done
          git diff --quiet
        done
        date -u +%FT%TZ > "$d/end"
        python3 "$RUNNER_TEMP/gc_budget_verdict.py" "$d"
    - name: Release the empty probe cgroups
      if: always()
      run: |
        d=/sys/fs/cgroup/gvisor-budget-$GITHUB_RUN_ID
        for sub in pod/middle/unlimited pod/middle pod/finite pod/small pod .; do
          if [[ "$sub" == "." ]]; then path=$d; else path=$d/$sub; fi
          if [[ -d "$path" ]]; then sudo rmdir "$path"; fi
        done
    - name: Redact credentials from the evidence bundle
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key=os.environ["BB_KEY"].encode()
        for f in (Path(os.environ["RUNNER_TEMP"])/"records").rglob("*"):
            if f.is_file() and key and key in (data:=f.read_bytes()):
                f.write_bytes(data.replace(key,b"[REDACTED]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: cgroup-visible-gc-budget
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
