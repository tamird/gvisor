name: Observe sender allowance during CUBIC repairs
on:
  push:
    branches: [qualification/tcp-16495-cubic-ack-allowance]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
          persist-credentials: false
      - name: Build both senders and run eight alternating pairs
        run: |
          cp test/benchmarks/tcp/{current-shared-report,flight_capture,timeout_repair}.py "$RUNNER_TEMP/"
          cp test/benchmarks/tcp/current-shared-driver.sh "$RUNNER_TEMP/driver.sh"
          bash "$RUNNER_TEMP/driver.sh"
      - name: Reconcile receiver bytes, settings and packet observations
        if: always()
        run: python3 "$RUNNER_TEMP/current-shared-report.py"
      - name: Publish the existing synthetic WAN evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcp-16495-cubic-ack-allowance
          path: ${{ runner.temp }}/tcp-public/
          if-no-files-found: error
