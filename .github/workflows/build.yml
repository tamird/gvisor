name: Verify the shim's wedged runtime
on:
  push:
    branches: [qualification/shim-wedged-runtime-tests]
permissions: {}
jobs:
  linux:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Bind the original and candidate sources
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          git init .
          git fetch --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = ee36b19f4c92fe81de475e18cc6b7f546f6aa639
          test "$(git rev-parse HEAD^^)" = 7d1b049f5d541992b47cc38cf564025908a9ed7b
          w="$RUNNER_TEMP/shim-wedge"
          mkdir -m 755 "$w"
          cp .github/qualification/shim_wedge/{entry,check}.py "$w/"
          chmod 755 "$w/entry.py"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $w/bazel" | sha256sum -c
          chmod 755 "$w/bazel"
          "$w/bazel" --version
          sudo -n apt-get update -qq
          sudo -n apt-get install -qy build-essential crossbuild-essential-arm64 libnuma-dev strace
          cp /usr/bin/strace "$w/"
          cmp /usr/bin/strace "$w/strace"
      - name: Exercise the two original Bazel test owners
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          python3 -IB "$RUNNER_TEMP/shim-wedge/check.py"
      - name: Bound the receipt
        id: check
        if: always() && !cancelled()
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "shim-wedge/result.json"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size < 98304
          s = p.read_text()
          assert json.loads(s)["carrier"] == os.environ["GITHUB_SHA"]
          assert not re.search(r"(?i)(authorization:|bearer |x-buildbuddy-api-key|ghp_|github_pat_|-----BEGIN [A-Z ]*PRIVATE KEY)", s)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.check.outcome == 'success'
        with:
          name: shim-wedged-runtime
          path: ${{ runner.temp }}/shim-wedge/result.json
          if-no-files-found: error
