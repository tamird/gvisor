name: Qualify the root-only Linux header default
on:
  push:
    branches: [qualification/kernel-header-root-policy]
permissions:
  contents: read
jobs:
  queries:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Prepare the existing query client and diagnostic reader
        run: |
          set -eu
          umask 077
          d="$RUNNER_TEMP/header-policy"
          mkdir -p "$d"
          cp test/rbe/header_root_policy.py "$d/"
          echo '{"verdict":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/header-policy.json"
          curl --retry 3 -fsSL https://raw.githubusercontent.com/tamird/gvisor/b224a82d47407d754ce438e19f6d1b60f2e20fb3/.github/qualification/lint-pilot/check.py -o "$d/check.py"
          curl --retry 3 -fsSL https://raw.githubusercontent.com/tamird/gvisor/b068472ea88909183902fc4bf12dac266f39d34d/test/rbe/external_go_policy.py -o "$d/external_go_policy.py"
          curl --retry 3 -fsSL https://releases.bazel.build/8.8.1/release/bazel-8.8.1-linux-x86_64 -o "$d/bazel-8.8.1"
          printf '%s  %s\n' 5b5bab2095065817d3416ca9a0678bd39c10c9ede432dbe8187bfe74de285160 "$d/bazel-8.8.1" | sha256sum -c -
          chmod 0755 "$d/bazel-8.8.1"
          test "$(git rev-parse HEAD^)" = 48428434392bfa3b1a1ce9fb50ca404b38f21b73
      - name: Evaluate the dependency before and after, then the gVisor root
        run: python3 -B "$RUNNER_TEMP/header-policy/header_root_policy.py"
      - name: Check the single compact report
        id: privacy
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "header-policy.json"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size < 65536
          data = p.read_bytes()
          assert all(s not in data.lower() for s in (b"x-buildbuddy-api-key", b"authorization:", b"bearer "))
          assert isinstance(json.loads(data), dict)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: header-policy
          path: ${{ runner.temp }}/header-policy.json
          if-no-files-found: error
