name: Recover original network setup records
on:
  push:
    branches: [qualification/pcap-owner-original-evidence]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 1, persist-credentials: false}
    - name: Fetch the right original record readers
      run: |
        set -euo pipefail
        mkdir "$RUNNER_TEMP/records"
        exporter=1fcf113e6349cc55f6321968944da1933ece3252
        reporter=fb60e127516defd6aab633f80be09a03022f0737
        git fetch -q --no-tags --depth=1 https://github.com/tamird/gvisor.git "$reporter" "$exporter"
        for mod in qualification_report unit_matrix; do git show "$reporter:test/rbe/$mod.py" > "$RUNNER_TEMP/$mod.py"; done
        git show "$exporter:test/rbe/semop_owner_recovery.py" > "$RUNNER_TEMP/semop_owner_recovery.py"
    - name: Recover saved logs and XML
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        PYTHONPATH="$RUNNER_TEMP" python3 test/rbe/forward_gso/original_results.py
        python3 - <<'PY'
        import os
        from pathlib import Path
        secret = os.environ['BUILDBUDDY_API_KEY'].encode()
        assert secret and secret not in (Path(os.environ['RUNNER_TEMP'])/'records/original-owners.json').read_bytes()
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: original-network-records
        path: ${{ runner.temp }}/records
        if-no-files-found: error
