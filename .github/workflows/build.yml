name: Read original containerd shim compiler diagnostics
on:
  push:
    branches: [qualification/gazelle-shim-original]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Read the original compiler results
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s\n' '{"verdict":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/external-go.json"
          gh api repos/tamird/gvisor/actions/artifacts/13122060478/zip > "$RUNNER_TEMP/shim.zip"
          d="$RUNNER_TEMP/shim-original"
          mkdir "$d"
          cp test/rbe/external_shim_original.py "$d/"
          curl --retry 3 -fsSL https://raw.githubusercontent.com/tamird/gvisor/4354f9b5c/test/rbe/native_packages/cas_inputs.py -o "$d/cas_inputs.py"
          test "$(git hash-object "$d/cas_inputs.py")" = 54047870d2d32c621a5c8616687a74bdc75001d5
          unset GH_TOKEN
          python3 -B "$d/external_shim_original.py"
      - name: Check the compact artifact boundary
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "external-go.json"
          assert p.is_file() and not p.is_symlink()
          data = p.read_bytes()
          key = os.environ["KEY"].encode()
          assert key and key not in data and b"x-buildbuddy-api-key" not in data.lower()
          assert isinstance(json.loads(data), dict)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: external-shim-original
          path: ${{ runner.temp }}/external-go.json
          if-no-files-found: error
