name: Observe pipe contributions on the captured repeated-repair ACK pair
on:
  push:
    branches: [qualification/tcp-repair-copy-accounting]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/tcp-repair-copy-accounting'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 8
        persist-credentials: false
    - name: Run both sender revisions with an identical CUBIC peer and manual clock
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD^1)" = ae63f4e952fc7c6fefc814954303a6f9a45c9951
        test "$(git rev-parse HEAD^2)" = 6dde0c0005a78bb7cea448c6d2d00a8b4741aa17
        cp test/rbe/pipe_history_sources.json "$RUNNER_TEMP/pipe-heads.json"
        cp test/rbe/pipe_history.py "$RUNNER_TEMP/pipe-driver.py"
        mkdir -p "$RUNNER_TEMP/fifo_platform" "$RUNNER_TEMP/fifo"
        platform=$RUNNER_TEMP/fifo_platform
        printf '%s\n' 'module(name="fifo_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/fifo.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=linux-sandbox' 'build --strategy=TestRunner=local' 'build --jobs=4' \
            'build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' \
            'build --remote_accept_cached' \
            "build --inject_repository=fifo_platform=$platform" \
            'build --host_platform=@fifo_platform//:ubuntu' \
            'build --extra_execution_platforms=@fifo_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        export FIFO_RC=$rc
        if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        mkdir -p "$RUNNER_TEMP/pipe-public"
        printf '%s\n' '{"status":"INCOMPLETE","phase":"Linux compiler installation"}' > "$RUNNER_TEMP/pipe-public/preflight.json"
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        printf '%s\n' '{"status":"COMPLETE","phase":"Linux compiler installation"}' > "$RUNNER_TEMP/pipe-public/preflight.json"
        python3 "$RUNNER_TEMP/pipe-driver.py"
    - name: Return both source revisions, original exits and per-ACK recovery evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: repair-copy-accounting
        path: ${{ runner.temp }}/pipe-public/
        if-no-files-found: error
