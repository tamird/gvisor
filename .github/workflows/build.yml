name: Compare CUBIC recovery accounting on synchronized pair B
on:
  push:
    branches: [qualification/tcp-pipe-cubic-b]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/tcp-pipe-cubic-b'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 30
      - name: Build proxy and run matched transfers
        run: bash test/benchmarks/tcp/current-shared-driver.sh
      - name: Reconcile expected trials, receiver intervals and socket samples
        if: always()
        run: python3 test/benchmarks/tcp/current-shared-report.py
      - name: Match each observed packet and recovery interval across the WAN
        if: always()
        run: python3 test/benchmarks/tcp/reorder_episodes.py "$RUNNER_TEMP/tcp-public" "$RUNNER_TEMP/tcp-public/episodes.json"
      - name: Keep original exits, captures and paired decision criteria
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/tcp-public"
          cp test/benchmarks/tcp/pipe-link-protocol.md "$RUNNER_TEMP/tcp-public/"
          python3 test/benchmarks/tcp/startup-result.py
      - name: Publish allowlisted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcp-pipe-cubic-b
          path: ${{ runner.temp }}/tcp-public/
          if-no-files-found: error
