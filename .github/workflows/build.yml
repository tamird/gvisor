name: Read the original two conflicting LLVM actions
on:
  push:
    branches: [qualification/llvm-filter-conflicting-actions]
permissions: {contents: read}
jobs:
  retrieve:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify parser, original invocation, and source code
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = de7d8d5fd58280a7a60c5bcf3e560c9b137b8484
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/source_filter_error.py'
          cp .github/qualification/source_filter_error.py "$RUNNER_TEMP/"
          echo "9fa5ed5ee75b8ff3b04b346ef53408429c298e79937369c57e9c82a3c6f75672  $RUNNER_TEMP/source_filter_error.py" | sha256sum -c
      - name: Retrieve the original action owners and compiler argument differences
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          python3 -IB "$RUNNER_TEMP/source_filter_error.py"
      - name: Validate the closed receipt
        id: validate
        if: always()
        run: |
          python3 -IB - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"original-filter-error.json"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size<190000
          b=p.read_bytes()
          assert not re.search(rb"(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}",b)
          r=json.loads(b); assert r["invocation"]=="d55f7927-f0e7-46f3-93ea-be5a5c9d24b9"
          assert set(r) <= {"invocation","build","console","errors"}
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.validate.outcome == 'success'
        with:
          name: original-conflicting-llvm-actions
          path: ${{ runner.temp }}/original-filter-error.json
          if-no-files-found: error
          retention-days: 14
      - name: Require an original diagnostic
        if: steps.validate.outcome == 'success'
        run: |
          python3 -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"original-filter-error.json").read_text()); assert len(r["console"]["collisions"])==2'
