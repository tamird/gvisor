name: Compare first object-slab growth on Nginx and small graphs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nginx:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.ref == 'refs/heads/qualification/state-encoder-object-pair-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      SOURCE: 7618caaf74c1bdfabf382bbffa537e28c83dbc92
      CONTROL: 0fda83d08a79c46be4968ec19f9e0b127fb5434b
      BUILD_IMAGE: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      NGINX_IMAGE: us-central1-docker.pkg.dev/gvisor-presubmit/gvisor-presubmit-images/benchmarks/nginx_x86_64@sha256:31c649d512cced4f7dd414fd05cfa9bb7416ee37575caeba46cc1e9b56aef163
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5
          persist-credentials: false
      - name: Stage the repository's pinned Nginx benchmark input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "$SOURCE" && "$(git rev-parse HEAD^^)" == "$CONTROL" && "$(git rev-parse HEAD~3)" == 343ec4301593c800b53915f785a5897531c05579 ]]
          git diff --exit-code HEAD~3 "$CONTROL" -- pkg/state
          [[ "$(git diff --name-only "$CONTROL" "$SOURCE")" == pkg/state/encode_unsafe.go ]]
          for name in qualification_report unit_matrix; do
            curl --fail --silent --show-error --location --proto '=https' "https://raw.githubusercontent.com/tamird/gvisor/c90f4b72db82f87d279d9aa02c9009f96981d9f3/test/rbe/$name.py" --output "$RUNNER_TEMP/$name.py"
          done
          (cd "$RUNNER_TEMP" && printf '%s\n' '209f47696a8c28e0072a6199d40f85edb855e656195189741ba4cb6215246a37  unit_matrix.py' '0afa620e3bf96f21b6bf806edd7cebc18fa53cb9b039ea141a63c9f4f82bee31  qualification_report.py' | sha256sum -c -)
          cp .github/qualification/object_slab/{verify,identify}.py "$RUNNER_TEMP/"
          git checkout --detach "$SOURCE"
          docker pull --platform=linux/amd64 "$NGINX_IMAGE"
          [[ $(docker image inspect --format '{{.Id}}' "$NGINX_IMAGE") == sha256:5f9e05caa37420ad50b7ccf873ea117fcbd8cff24b3fcb689cb904bcab624cf5 ]]
          docker tag "$NGINX_IMAGE" gvisor.dev/images/benchmarks/nginx:latest
          docker save -o test/rbe/restore_phases/nginx.tar gvisor.dev/images/benchmarks/nginx:latest
          docker pull --platform=linux/amd64 "$BUILD_IMAGE"
      - name: Profile graph Save and verify a real kernel frame on BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          out=$RUNNER_TEMP/phase-results
          mkdir -p "$out" "$RUNNER_TEMP/study_platform"
          printf 'module(name="study_platform")\n' >"$RUNNER_TEMP/study_platform/MODULE.bazel"
          cat >"$RUNNER_TEMP/study_platform/BUILD" <<BUILD
          platform(
              name = "gnu",
              constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
              exec_properties = {"Arch":"amd64", "OSFamily":"linux", "workload-isolation-type":"firecracker", "EstimatedMemory":"6GB", "container-image":"docker://$BUILD_IMAGE"},
              visibility = ["//visibility:public"],
          )
          BUILD
          rc=$RUNNER_TEMP/study.bazelrc
          umask 077
          trap 'rm -f "$rc"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=remote' "build --inject_repository=study_platform=$RUNNER_TEMP/study_platform" 'build --host_platform=@study_platform//:gnu' 'build --extra_execution_platforms=@study_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          docker run --rm --env SOURCE --env CONTROL --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$BUILD_IMAGE" -c '
            set -euo pipefail
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
            temp=$1
            out=$temp/phase-results
            [[ "$(git rev-parse HEAD)" == "$SOURCE" ]]
            code=0
            bazel --bazelrc="$temp/study.bazelrc" build --config=x86_64 -c opt --jobs=80 --remote_download_outputs=toplevel --build_event_json_file="$temp/candidate.bep" //test/benchmarks/checkpointfile:checkpointfile_test >"$temp/candidate-build.log" 2>&1 || code=$?
            python3 "$temp/identify.py" "$temp" candidate "$SOURCE" "$code"
            [[ $code == 0 ]]
            git checkout --detach "$CONTROL"
            [[ "$(git rev-parse HEAD)" == "$CONTROL" ]]
            install -m 755 "$temp/candidate.bin" test/rbe/restore_phases/candidate.bin
            status=0
            bazel --bazelrc="$temp/study.bazelrc" test --config=x86_64 -c opt --test_timeout=900 --jobs=80 --nocache_test_results --modify_execution_info="^TestRunner$=+no-remote-cache" --remote_download_outputs=toplevel --zip_undeclared_test_outputs --remote_download_regex=".*[/](test[.](log|xml)|outputs[.]zip)$" --execution_log_json_file="$temp/index-spawns.json" --build_event_json_file="$temp/kernel.bep" //test/rbe/restore_phases:nginx >"$temp/kernel-build.log" 2>&1 || status=$?
            printf "%s\n" "$status" >"$out/bazel-exit"
            for name in test.xml test.log; do
              path=bazel-testlogs/test/rbe/restore_phases/nginx/$name
              if [[ -f $path ]]; then cp -L "$path" "$out/$name"; fi
            done
            archive=bazel-testlogs/test/rbe/restore_phases/nginx/test.outputs/outputs.zip
            if [[ -f "$archive" ]]; then cp -L "$archive" "$out/profiles.zip"; fi
            python3 - "$temp/kernel-build.log" "$out/build-diagnostic.json" <<PY
          import json, pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          markers = ("error:", "error ", "fatal ", "killed", "not found", "no such file", "denied", "undefined reference", "unsupported", "statically linked applications")
          blocked = ("secret", "api-key", "password", "authorization", "token=", "remote_header", "bes_header")
          diagnostic = [s[:550] for s in lines if any(m in s.lower() for m in markers) and not any(x in s.lower() for x in blocked)]
          pathlib.Path(sys.argv[2]).write_text(json.dumps(list(dict.fromkeys(diagnostic))[:24]))
          PY
            chmod -R a+rX "$out" "$temp/kernel.bep" "$temp/kernel-build.log" "$temp/index-spawns.json"
          ' _ "$RUNNER_TEMP"
          jq -c 'select(.targetLabel == "//test/rbe/restore_phases:nginx" and .mnemonic == "TestRunner") | {targetLabel,runner,cacheHit,exitCode,platform}' "$RUNNER_TEMP/index-spawns.json" > "$out/worker.jsonl"
          python3 "$RUNNER_TEMP/verify.py" "$RUNNER_TEMP"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nginx-object-slab
          path: |
            ${{ runner.temp }}/phase-results/build-candidate.json
            ${{ runner.temp }}/phase-results/result.json
            ${{ runner.temp }}/phase-results/test.log
            ${{ runner.temp }}/phase-results/test.xml
            ${{ runner.temp }}/phase-results/bazel-exit
            ${{ runner.temp }}/phase-results/profiles.zip
            ${{ runner.temp }}/phase-results/build-diagnostic.json
            ${{ runner.temp }}/phase-results/worker.jsonl
          if-no-files-found: error
