name: Check the instrumentor backport on LLVM 23 and 24
on:
  push:
    branches: [qualification/llvm-instrumentor-version-selection]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXEC_CPU: amd64
      BAZELISK_HASH: e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 5}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tamird/hermetic-llvm
          ref: 15809f084e3c473b0e3fbcc57ce8dda167f24a6c
          fetch-depth: 2
          path: supplier
          persist-credentials: false
      - name: Pin Bazel
        run: |
          set -eu
          export USE_BAZEL_VERSION=$(cat supplier/.bazelversion)
          echo "USE_BAZEL_VERSION=$USE_BAZEL_VERSION" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bazelisk-bin"
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-$EXEC_CPU -o "$RUNNER_TEMP/bazelisk-bin/bazel"
          echo "$BAZELISK_HASH  $RUNNER_TEMP/bazelisk-bin/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bazelisk-bin/bazel"
          echo "$RUNNER_TEMP/bazelisk-bin" >> "$GITHUB_PATH"
      - name: Select source patches and apply them to the released and upstream overlays
        env:
          PRODUCT: 15809f084e3c473b0e3fbcc57ce8dda167f24a6c
        run: python3 test/rbe/llvm_scratch/verify-selection.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: llvm-supplier-verdict
          path: ${{ runner.temp }}/package-evidence/verdict.json
          if-no-files-found: error
