name: Classify one original ARM64 fixture result
on:
  push:
    branches: [qualification/arm64-posture-field-only]
permissions: {contents: read}
jobs:
  classify:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify the original source and fixed reader
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = dc9dcd2e3566e3adcdcf2fbf50297a95c853a620
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/arm64_posture_category.py'
          cp .github/qualification/arm64_posture_category.py "$RUNNER_TEMP/"
          echo "c4594fb746bff9f006f7050bdcd54a03c627393fc6a2660292119d510758a760  $RUNNER_TEMP/arm64_posture_category.py" | sha256sum -c
      - name: Read the one exact original with the existing credential
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          umask 077
          python3 -IB "$RUNNER_TEMP/arm64_posture_category.py" retrieve
      - name: Classify without the credential
        id: classify
        run: |
          python3 -IB "$RUNNER_TEMP/arm64_posture_category.py" classify
          python3 -IB - <<'PYCHECK'
          import json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"posture-category.json"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size < 600
          r=json.loads(p.read_bytes())
          assert set(r)=={"invocation","sha256","size","comparisons","recognized","categories"}
          assert (r["invocation"],r["sha256"],r["size"],r["comparisons"])==("b31f8bfe-2484-48df-b737-5b9bc46052ac","63f622be0f08d7d6a3bf09d661164eae7c65708f774b8d0ad662d727d421dc33",216982,5)
          assert type(r["recognized"]) is int and 0<=r["recognized"]<=5
          assert set(r["categories"])<={"identity","capability","policy","counter","unclassified"}
          PYCHECK
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.classify.outcome == 'success'
        with:
          name: original-arm64-classification
          path: ${{ runner.temp }}/posture-category.json
          if-no-files-found: error
          retention-days: 7
