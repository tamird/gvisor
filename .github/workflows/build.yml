name: Qualify the LisaFS TEST_TMPDIR contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/lisafs-tmpdir-oct29'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
        persist-credentials: false
    - name: Run the original LisaFS caller and changed-library analyzer
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD^1)" = "412f99aaeae95242664e2612c1ed8d41fdf68319"
        test "$(git rev-parse HEAD^2)" = "75ffc8b5c76b03639ea7502f305d5708663a29ea"
        test "$(git diff --name-only 75ffc8b5c76b03639ea7502f305d5708663a29ea 412f99aaeae95242664e2612c1ed8d41fdf68319)" = "pkg/lisafs/testsuite/testsuite.go"
        mkdir -p "$RUNNER_TEMP/checker"
        for file in qualify.sh unit_matrix.py lisafs_tmp_report.py lisafs_verify_report.py; do
          cp "test/rbe/$file" "$RUNNER_TEMP/checker/$file"
        done
        python3 -B "$RUNNER_TEMP/checker/lisafs_verify_report.py"
        mkdir -p "$RUNNER_TEMP/lisafs_platform" "$RUNNER_TEMP/lisafs"
        platform=$RUNNER_TEMP/lisafs_platform
        printf '%s\n' 'module(name="lisafs_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/lisafs.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
            'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
            'build --remote_accept_cached' \
            "build --inject_repository=lisafs_platform=$platform" \
            'build --host_platform=@lisafs_platform//:ubuntu' \
            'build --extra_execution_platforms=@lisafs_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        printf '%s\n' 'build:rbe --spawn_strategy=remote' >> "$rc"
        export FIFO_RC=$rc
        mkdir -p "$RUNNER_TEMP/lisafs-bin"
        cat > "$RUNNER_TEMP/lisafs-bin/bazel" <<'SH'
        #!/bin/sh
        exec bazelisk --bazelrc="$FIFO_RC" "$@"
        SH
        chmod +x "$RUNNER_TEMP/lisafs-bin/bazel"
        export PATH="$RUNNER_TEMP/lisafs-bin:$PATH"
        overall=0
        for mode in new-bazel new-unset new-empty old-empty analyzer; do
          source=412f99aaeae95242664e2612c1ed8d41fdf68319
          owner=//runsc/gofer/fs:lisafs_test
          filter='^TestFSGofer$/(^passthrough$|^virtual$)/^UDS$'
          args=()
          case "$mode" in
            new-bazel) ;;
            new-unset) args+=("--bazel-option=--run_under=/usr/bin/env -u TEST_TMPDIR TMPDIR=/tmp") ;;
            new-empty) args+=("--bazel-option=--run_under=/usr/bin/env TEST_TMPDIR= TMPDIR=/tmp") ;;
            old-empty) source=75ffc8b5c76b03639ea7502f305d5708663a29ea; args+=("--bazel-option=--run_under=/usr/bin/env TEST_TMPDIR= TMPDIR=/tmp") ;;
            analyzer) owner=//pkg/lisafs/testsuite:testsuite_nogo; filter= ;;
          esac
          git checkout --quiet --detach "$source"
          test "$(git rev-parse HEAD)" = "$source"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p test/rbe "$RUNNER_TEMP/lisafs/$mode"
          cp "$RUNNER_TEMP/checker/qualify.sh" "$RUNNER_TEMP/checker/unit_matrix.py" test/rbe/
          out="$RUNNER_TEMP/lisafs/$mode"
          code=0
          if [[ -n "$filter" ]]; then args+=("--test-filter=$filter"); fi
          bash test/rbe/qualify.sh --arch=amd64 "--test-target=$owner" "${args[@]}"             "--bazel-option=--build_event_json_file=$out/events.jsonl"             --bazel-option=--test_sharding_strategy=disabled --bazel-option=--cache_test_results=no             --bazel-option=--remote_download_outputs=toplevel test || code=$?
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 -B "$RUNNER_TEMP/checker/lisafs_tmp_report.py" "$out" "$mode" "$source" "$owner" "$code" || overall=1
        done
        exit "$overall"
    - name: Save only the typed results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: lisafs-tmpdir-verdict
        path: ${{ runner.temp }}/lisafs/*/result.json
        if-no-files-found: error
