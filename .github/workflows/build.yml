name: Isolate the archive host-peer offload toggle
on:
  push:
    branches: [qualification/issue15253-peer-offload]
permissions:
  contents: read
jobs:
  router:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT_SHA: aa767e4c43d011121271551fe24da501a56f729d
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 2, persist-credentials: false}
    - name: Prepare the compiler and isolated router lab
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        printf '{"result":"incomplete","reason":"preparation has not completed"}\n' > "$RUNNER_TEMP/records/nested.json"
        test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
        git diff --exit-code "$PRODUCT_SHA" HEAD -- pkg runsc
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --privileged --name tcp-compiler --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler ip -V
        docker exec tcp-compiler /bin/sh -ec 'if ! command -v ethtool >/dev/null; then apt-get update -qq && apt-get install -y --no-install-recommends ethtool; fi; ethtool --version'
    - name: Compare the same-node peer toggle through the inner bridge
      run: python3 test/rbe/forward_gso/qualify.py nested
    - name: Check the artifact boundary
      id: privacy
      if: always()
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"]) / "records"
        paths = list(root.iterdir())
        assert {p.name for p in paths} == {"nested.json"}, "unexpected artifact files"
        for p in paths:
            assert p.is_file() and not p.is_symlink(), "artifact is not a regular file"
            data = p.read_bytes()
            json.loads(data)
            key = os.environ["BUILDBUDDY_API_KEY"].encode()
            assert key and key not in data, "credential in artifact"
            assert not any(x in data.lower() for x in (b"x-buildbuddy-api-key", b"authorization:", b"remote_header", b"bes_header")), "credential marker in artifact"
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.privacy.outcome == 'success'
      with:
        name: issue15253-peer-offload
        path: ${{ runner.temp }}/records/nested.json
        if-no-files-found: error
