name: Test rules_distroless Debian layer normalization
on:
  push:
    branches: ["qualification/deb-layer-supplier"]
permissions:
  contents: read
jobs:
  supplier:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tamird/rules_distroless
          ref: "9de063f595a7f0a0140e845bb23c2a0900a64059"
          path: supplier
          persist-credentials: false
      - name: Record supplier source
        working-directory: supplier
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipt"
          test "$(git rev-parse HEAD)" = 9de063f595a7f0a0140e845bb23c2a0900a64059
          git rev-parse HEAD > "$RUNNER_TEMP/receipt/supplier-commit"
      - name: Import pinned AMD64 and ARM64 packages
        working-directory: supplier
        run: |
          set -euo pipefail
          cat >> MODULE.bazel <<'MODULE'
          deb_import = use_repo_rule("//apt/private:deb_import.bzl", "deb_import")
          deb_import(
              name = "deb_amd64",
              package_name = "erofs-utils",
              target_name = "deb_amd64",
              urls = ["https://archive.ubuntu.com/ubuntu/pool/universe/e/erofs-utils/erofs-utils_1.7.1-1build2_amd64.deb"],
              sha256 = "ce1a7283a3ffc47bc832dfd77c4fba6a327f3928f1c90c64fe14e251251cfc3a",
          )
          deb_import(
              name = "deb_arm64",
              package_name = "erofs-utils",
              target_name = "deb_arm64",
              urls = ["https://ports.ubuntu.com/ubuntu-ports/pool/universe/e/erofs-utils/erofs-utils_1.7.1-1build2_arm64.deb"],
              sha256 = "afc3f29f3c0ec4547c60985aa2373dc1dce3324cb3e8970f03b92c4789e74665",
          )
          MODULE
          bazel build --jobs=4 @deb_amd64//:data @deb_arm64//:data
          for entry in amd64:6728633e7fd35e1a7d14d8da37017e516dbe524f2afb0489f50a088971a5f2eb arm64:96bef30c8a26038127d31e9d70e9ae534e3687fa556c217e4dd2f810ccbdd127; do
            arch=${entry%%:*}
            layer=$(bazel cquery "@deb_$arch//:data" --output=files)
            test -f "$layer"
            printf '%s  %s\n' "${entry#*:}" "$layer" | sha256sum --check --strict
            sha256sum "$layer" > "$RUNNER_TEMP/receipt/$arch.sha256"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: supplier-deb-layer-results
          path: ${{ runner.temp }}/receipt
          if-no-files-found: error
