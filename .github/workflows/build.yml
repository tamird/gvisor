name: Qualify the native-wrapper rebase
on:
  push:
    branches: [qualification/native-wrapper-rebase-check]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: carrier, persist-credentials: false, fetch-depth: 1}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: tamird/bazel, ref: aa90c0a75a7ea6b59ddc593d676ab316f1e61aa2, path: supplier, persist-credentials: false, fetch-depth: 1}
      - name: Prepare private remote configuration and evidence
        working-directory: carrier
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/native-package-evidence"
          printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap","executed_targets":0}' > "$RUNNER_TEMP/native-package-evidence/bootstrap.json"
          test -n "$BUILDBUDDY_API_KEY"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --action_env=TMPDIR=.' 'build --host_action_env=TMPDIR=.'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/sidecar.bazelrc"
          {
            printf '%s\n' 'build:buildbuddy --config=ubuntu2404' 'build:buildbuddy --nogoogle_default_credentials' 'build:buildbuddy --remote_instance_name=' 'build:buildbuddy --remote_executor=grpcs://remote.buildbuddy.io' 'build:buildbuddy --remote_cache=grpcs://remote.buildbuddy.io' 'build:buildbuddy --bes_backend=grpcs://remote.buildbuddy.io' 'build:buildbuddy --bes_results_url=https://app.buildbuddy.io/invocation/' 'build:buildbuddy --spawn_strategy=remote' 'build:buildbuddy --noremote_local_fallback' 'build:buildbuddy --remote_download_outputs=toplevel' 'build:buildbuddy --noremote_upload_local_results'
            printf 'build:buildbuddy --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build:buildbuddy --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/supplier.bazelrc"
          mkdir -p ../supplier/qualification_platform
          cp test/rbe/native_packages/supplier-platform.BUILD ../supplier/qualification_platform/BUILD
          unset BUILDBUDDY_API_KEY
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "bdb65b4bddb8405a80b3e45a3ef4c740819b151d0709d360e8add8dac534c224  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
          cp test/rbe/native_packages/static_build.py "$RUNNER_TEMP/"
          bazel --bazelrc="$RUNNER_TEMP/sidecar.bazelrc" run //tools/actionlint -- "$PWD/.github/workflows/build.yml" > "$RUNNER_TEMP/actionlint.log" 2>&1 || { tail -30 "$RUNNER_TEMP/actionlint.log"; exit 1; }
          printf '%s\n' '{"status":"PASS","phase":"bootstrap","executed_targets":0}' > "$RUNNER_TEMP/native-package-evidence/bootstrap.json"
      - name: Run the remaining Java owner on RBE
        id: supplier
        working-directory: supplier
        run: python3 "$RUNNER_TEMP/static_build.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-wrapper-rebase
          path: |
            ${{ runner.temp }}/native-package-evidence
          if-no-files-found: error
