name: Run the nested TCP checkpoint cases on the proposed stack
on:
  push:
    branches: [qualification/dind-active-stream-17028]
permissions: {contents: read}
jobs:
  checkpoint:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Select the submitted TCP restore and DinD sources
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/dind-stream"
          mkdir -p "$d"
          cp .github/qualification/dind_stream.py "$d/driver.py"
          test "$(git rev-parse HEAD^)" = 90d4e2253f004cdc73a35dbc4050eab3e9a8495d
          git fetch --depth=5 --no-tags https://github.com/google/gvisor.git refs/pull/17028/head
          series="$(git rev-parse FETCH_HEAD)"
          test "$series" = a772fedd6521ac693b8e25a41c01e00f2e023461
          git fetch --depth=2 --no-tags https://github.com/google/gvisor.git refs/pull/16666/head
          tcp="$(git rev-parse FETCH_HEAD)"
          test "$tcp" = 5edf5d13c7a6749df466add29d8811260edb4cda
          git switch --detach "$series"
          git -c user.name=Qualification -c user.email=nobody@localhost cherry-pick --no-commit "$tcp"
          test "$(git write-tree)" = 7c513a10040f59a51577e487ef76d52b3cd46b69
      - name: Exercise the original test with the supported Docker daemon
        run: |
          set -euo pipefail
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" BAZEL="$(command -v bazel)" \
            python3 -B "$RUNNER_TEMP/dind-stream/driver.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nested-tcp-checkpoint-cases
          path: ${{ runner.temp }}/dind-stream/result.json
          retention-days: 14
          if-no-files-found: warn
