name: Check committed allocations with the protected-clear implementation
on:
  push:
    branches: [qualification/pgalloc-on-protected-clear]
permissions: {}
jobs:
  allocator:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Bind the production tree and the original native suite reader
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pgalloc-combined"
          mkdir -m 700 "$work"
          echo '{"verified":false,"stage":"setup"}' > "$work/result.json"
          product=7f35395cc6dac0f9c77bf5d8ae273426cec8abfb
          clear=bbf2e6f61cf6c7e3b9594f4ea0242eebbc7aee83
          allocator=61470ea4162137e6871edd94e369f1c03592c163
          reader=e1f43cebd48e54c1ffe62589bc9f3f0d79959b1b
          git init -q
          git fetch --no-auto-maintenance --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$allocator" "$reader"
          git checkout -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$product"
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/pgalloc_clear_suites.py'
          cp .github/qualification/pgalloc_clear_suites.py "$work/"
          git show "$reader:.github/qualification/pgalloc_combined.py" > "$work/original.py"
          test "$(git hash-object "$work/original.py")" = 4853ddcdbce074efdf20b3e6ec657be42de4e192
          git checkout -q --detach "$product"
          test "$(git rev-parse HEAD^)" = "$clear"
          test "$(git rev-parse 'HEAD^{tree}')" = 34e7eb717acbadcea187c9cb4125864b6e3d9f03
          test "$(git rev-parse HEAD:pkg/safecopy)" = 61132b0bd4c6b5cf5b18ae6057b6fb0cec2ed1ff
          paths=(pkg/sentry/pgalloc/BUILD pkg/sentry/pgalloc/pgalloc.go pkg/sentry/pgalloc/pgalloc_test.go)
          git diff --exit-code "$allocator^" "$clear" -- "${paths[@]}"
          git diff --exit-code "$allocator" HEAD -- "${paths[@]}"
          git diff --exit-code "$clear" HEAD -- . ':!pkg/sentry/pgalloc/BUILD' ':!pkg/sentry/pgalloc/pgalloc.go' ':!pkg/sentry/pgalloc/pgalloc_test.go'
          test "$(git rev-parse HEAD:pkg/sentry/pgalloc/save_restore_test.go)" = 3be4447f7bf03e61cd151d4afc829248d7fce40d
          test "$(uname -m)" = x86_64
          test "$(cat .bazelversion)" = 9.3.1
          cd "$work"
          curl -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel' | sha256sum -c -
          chmod 700 bazel
      - name: Run both complete original Bazel owners
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" python3 -IB "$RUNNER_TEMP/pgalloc-combined/pgalloc_clear_suites.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: committed-allocation-protected-clear-suites
          path: ${{ runner.temp }}/pgalloc-combined/result.json
          if-no-files-found: error
          retention-days: 14
