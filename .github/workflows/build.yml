name: Qualify the integration image without Docker builds
on:
  push:
    branches: [qualification/integration-image-no-docker]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PRODUCT: fa1b424ffda1cecb818adffcaf46cfd3e0fb0028
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
      - name: Configure the pinned Linux execution platform
        id: setup
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          echo "Coordinator $(gcc -dumpfullversion), worker GCC 11"
          test "$(gcc -dumpversion | cut -d. -f1)" = 11
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
          mkdir -p "$RUNNER_TEMP/gnu"
          GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","EstimatedMemory":"2GB","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
          test -n "$BUILDBUDDY_API_KEY"
          rc=$RUNNER_TEMP/images.bazelrc
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          cat >> "$rc" <<'RC'
          build --jobs=8
          build --strategy=ReleaseFiles=linux-sandbox
          build --strategy=GoStdlib=linux-sandbox
          build --strategy=GoStdlibList=linux-sandbox
          build --strategy=GoStandardLibraryAnalysis=linux-sandbox
          build --strategy=GoStaticAnalysis=linux-sandbox
          build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache
          build --noremote_upload_local_results
          build --remote_download_outputs=toplevel
          build --noshow_progress
          RC
          for name in integration-image integration-c-guests; do git show "$GITHUB_SHA:test/rbe/$name.py" > "$RUNNER_TEMP/$name.py"; done
          mv "$RUNNER_TEMP/integration-c-guests.py" "$RUNNER_TEMP/guests.py"
          cat > "$RUNNER_TEMP/privileged-fixture" <<'WRAPPER'
          #!/usr/bin/env bash
          set -u
          uid=$(id -u)
          gid=$(id -g)
          rc=0
          sudo -nE "$@" || rc=$?
          if [[ -f "${XML_OUTPUT_FILE:-}" ]]; then sudo -n chown "$uid:$gid" "$XML_OUTPUT_FILE"; fi
          exit "$rc"
          WRAPPER
          chmod 0755 "$RUNNER_TEMP/privileged-fixture"
      - name: Recover the original independent phase outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tamird/gvisor/actions/artifacts/13178134790/zip > "$RUNNER_TEMP/original-integration.zip" || true
          gh api repos/tamird/gvisor/actions/artifacts/13180640411/zip > "$RUNNER_TEMP/prior-preflight.zip" || true
          gh api repos/tamird/gvisor/actions/artifacts/13180457046/zip > "$RUNNER_TEMP/unsigned-source.zip" || true
      - name: Resolve the actual apt consumer and retain the complete catalog audit
        id: preflight
        if: always() && steps.setup.outcome == 'success'
        run: python3 "$RUNNER_TEMP/integration-image.py" --preflight
      - name: Publish preflight before running the image consumers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-preflight
          path: ${{ runner.temp }}/integration-public/result.json
          if-no-files-found: error
      - name: Install the Linux ARM64 binfmt interpreter
        id: qemu
        if: always() && steps.setup.outcome == 'success'
        run: |
          if [[ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
            sudo update-binfmts --enable qemu-aarch64
          fi
          grep -Fx enabled /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -E '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Qualify both inventories and existing integration consumers
        if: always() && steps.setup.outcome == 'success'
        run: python3 "$RUNNER_TEMP/integration-image.py" --runtime
      - name: Publish the bounded result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-image
          path: ${{ runner.temp }}/integration-public/result.json
          if-no-files-found: error
      - name: Remove remote credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/images.bazelrc"
