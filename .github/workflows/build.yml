name: Check declared shell launchers on the empty worker
on:
  push:
    branches: [qualification/foreign-cc-declared-shell]
permissions:
  contents: read
  actions: read
jobs:
  plugin:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: product, fetch-depth: 2, persist-credentials: false}
      - name: Read the original artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/tamird/gvisor/actions/artifacts/13129732760/zip > "$RUNNER_TEMP/original.zip"
      - name: Reconcile the original escaped control error
        working-directory: product
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/plugin-evidence"
          echo '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/plugin-evidence/result.json"
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "bdb65b4bddb8405a80b3e45a3ef4c740819b151d0709d360e8add8dac534c224  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
          python3 -B test/rbe/plugin_programs/native_helper.py --recover-control
      - name: Check the typed evidence boundary
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "plugin-evidence"
          files = list(folder.iterdir())
          assert {f.name for f in files} in ({"result.json"}, {"result.json", "image.json"})
          for f in files:
              assert f.is_file() and not f.is_symlink() and f.stat().st_size < 100000
              data = f.read_bytes()
              json.loads(data)
              assert os.environ["KEY"] and os.environ["KEY"].encode() not in data
              assert all(marker not in data.lower() for marker in (b"authorization:", b"bearer ", b"x-buildbuddy-api-key"))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: foreign-cc-declared-shell
          path: |
            ${{ runner.temp }}/plugin-evidence/result.json
            ${{ runner.temp }}/plugin-evidence/image.json
          if-no-files-found: error
      - name: Require the native-helper verdict
        if: always()
        run: jq -e '.status == "PASS" and .original.build_exit == 0 and .original.proof.verified and .original.launch.verified and .control_recovery.status == "EXPECTED_FAILURE"' "$RUNNER_TEMP/plugin-evidence/result.json"
