name: Check RACK retransmissions after a timeout on Linux and gVisor
on:
  push:
    branches: [qualification/rack-cursor-packet-assertion]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: 85b67686f3cd61965db6393190969dab98c8d5c3
      BASE: 2d59045da5c29f2f6bc62dacd9457591367c9498
      CLOCK: 5a65fe1f080fe147c9f1064f640632ec624c470a
      REPORTER: 38745c527784376e0b5d915fe5ebd85e1d1385fd
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/records/verdict.json"
        cp test/rbe/rack-fresh-head.py "$RUNNER_TEMP/"
        test "$(git rev-parse HEAD^)" = "$PRODUCT"
        git fetch -q --depth=2 https://github.com/tamird/gvisor.git "$REPORTER" "$CLOCK" 7d8e856ba30ef0271690d13d2ddb1c07111a558a
        for report in qualification_report unit_matrix; do
          git show "$REPORTER:test/rbe/$report.py" > "$RUNNER_TEMP/$report.py"
        done
        git diff 7d8e856ba^ 7d8e856ba -- test/packetimpact/runner/defs.bzl > "$RUNNER_TEMP/exec.patch"
        test "$(git rev-parse "$PRODUCT^")" = "$BASE"
        test "$(git diff --name-only "$PRODUCT" "$CLOCK")" = test/packetimpact/tests/tcp_rack_test.go
        test "$(git rev-parse "$PRODUCT:test/packetimpact/tests/tcp_rack_test.go")" = 98aeb3e61b3657dae3bc069aa701d1e037c277a8
        git checkout --quiet --detach "$PRODUCT"
        git apply "$RUNNER_TEMP/exec.patch"
        test "$(git diff --name-only)" = test/packetimpact/runner/defs.bzl
        git rev-parse HEAD:test/packetimpact/tests/tcp_rack_test.go > "$RUNNER_TEMP/records/packet-blob"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","network-enable-ipv6":"true","EstimatedMemory":"8GB","test.EstimatedMemory":"2GB","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        mkdir -p "$RUNNER_TEMP/gnu-home"
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        test "$USE_BAZEL_VERSION" = 8.8.1
        docker run --init -d --name tcp-compiler --entrypoint /bin/sleep --user "$(id -u):$(id -g)" -e HOME="$RUNNER_TEMP/gnu-home" -e USER="$(id -un)" -e USE_BAZEL_VERSION="$USE_BAZEL_VERSION" --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" infinity
        if [[ $(docker exec tcp-compiler /usr/local/bin/bazel --version) != "bazel $USE_BAZEL_VERSION" ]]; then
          binary=bazel-$USE_BAZEL_VERSION-linux-x86_64; base=https://releases.bazel.build/$USE_BAZEL_VERSION/release
          for f in "$binary" "$binary.sha256"; do curl -fsSL --retry 3 "$base/$f" -o "$RUNNER_TEMP/$f"; done
          (cd "$RUNNER_TEMP" && sha256sum -c "$binary.sha256")
          chmod 0755 "$RUNNER_TEMP/$binary"
          docker cp "$RUNNER_TEMP/$binary" tcp-compiler:/usr/local/bin/bazel
        fi
        docker exec tcp-compiler /usr/local/bin/bazel --version > "$RUNNER_TEMP/records/bazel"
        test "$(cat "$RUNNER_TEMP/records/bazel")" = "bazel $USE_BAZEL_VERSION"
        test "$(docker exec tcp-compiler id -un)" = "$(id -un)"
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
    - name: Run the installed regression on both DUTs and the published gVisor control
      run: |
        set -euo pipefail
        runarm() {
          arm=$1; limit=$2; shift 2
          d="$RUNNER_TEMP/records/$arm"; mkdir -p "$d"
          git rev-parse HEAD > "$d/source"
          git hash-object test/packetimpact/tests/tcp_rack_test.go > "$d/fixture"
          git hash-object pkg/tcpip/transport/tcp/rack.go > "$d/rack-blob"
          uuid=$(cat /proc/sys/kernel/random/uuid); echo "$uuid" > "$d/invocation"
          code=0
          timeout --kill-after=10s "$limit" docker exec tcp-compiler /usr/local/bin/bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --invocation_id="$uuid" --config=x86_64 --jobs=150 --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --strategy=TestRunner=remote --nocache_test_results --flaky_test_attempts=1 --keep_going --test_sharding_strategy=disabled --test_output=errors --test_timeout=400 --test_env=GO_TEST_WRAP_TESTV=1 --test_filter='^TestRACKFreshTimeoutRetransmission$' --build_event_json_file="$d/packet.bep" "$@" > "$d/packet.log" 2>&1 || code=$?
          printf '%s\n' "$code" > "$d/exit"
          date -u --iso-8601=ns > "$d/finished"
          for label in "$@"; do
            key=${label##*:}
            for report in test.log test.xml; do
              docker exec tcp-compiler cat "bazel-testlogs/test/packetimpact/tests/$key/$report" > "$d/$key.$report" || true
            done
          done
        }
        runarm candidate 29m //test/packetimpact/tests:tcp_rack_native_test //test/packetimpact/tests:tcp_rack_netstack_test
        git restore -- test/packetimpact/runner/defs.bzl
        git checkout --quiet --detach "$BASE"
        git restore --source="$PRODUCT" -- test/packetimpact/tests/tcp_rack_test.go
        git apply "$RUNNER_TEMP/exec.patch"
        test "$(git diff --name-only)" = "$(printf '%s\n' test/packetimpact/runner/defs.bzl test/packetimpact/tests/tcp_rack_test.go)"
        runarm published 13m //test/packetimpact/tests:tcp_rack_netstack_test
        date -u --iso-8601=ns > "$RUNNER_TEMP/records/finished"
    - name: Verify each named execution, the captured byte ranges and the published-head control
      if: always()
      run: python3 "$RUNNER_TEMP/rack-fresh-head.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: rack-cursor-packet-assertion
        path: ${{ runner.temp }}/records/verdict.json
        if-no-files-found: error
