name: Measure proc inventory after checkpoint cache eviction
on:
  push:
    branches: [qualification/proc-dentry-checkpoint]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/proc-dentry-checkpoint'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      SOURCE: 918aefd5f3771a161013fb72873d8aa19196e1bc
      BASE: 0cf7325e46a196a3c9c8be8c7c4f8a210700a07c
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
        persist-credentials: false
    - name: Bind the original exact releases and unchanged guest fixture
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^) == c1692a41165b91701d4553a99d980ffe65184b81 ]]
        [[ $(git rev-parse HEAD^^) == "$SOURCE" && $(git rev-parse "$SOURCE^") == "$BASE" ]]
        git diff --exit-code HEAD^ HEAD -- .github/qualification/proc-cache/{build.py,guest.py}
        cp -R .github/qualification/proc-cache "$RUNNER_TEMP/proc-cache"
        gh api repos/tamird/gvisor/actions/artifacts/13128918637/zip > "$RUNNER_TEMP/original.zip"
    - name: Recover original release outputs by invocation and digest
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 "$RUNNER_TEMP/proc-cache/recover.py"
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
    - name: Measure the same process inventory in paired fresh sandboxes
      run: |
        sudo env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" python3 "$RUNNER_TEMP/proc-cache/compare.py"
    - name: Check evidence boundary
      id: safe
      if: always()
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os, pathlib, re
        out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "proc-cache-results"
        allowed = {"base-build.json", "current-build.json", "comparison.json", "recovery.json"}
        for path in out.iterdir():
            assert path.is_file() and not path.is_symlink() and path.name in allowed
            raw = path.read_bytes()
            key = os.environ["BUILDBUDDY_API_KEY"].encode()
            assert not key or key not in raw
            assert not re.search(b"(?i)x-buildbuddy-api-key|remote_header|bes_header|authorization:|X-Amz-Signature|X-Goog-Signature", raw)
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.safe.outcome == 'success' }}
      with:
        name: proc-dentry-checkpoint
        path: ${{ runner.temp }}/proc-cache-results/*.json
        if-no-files-found: error
