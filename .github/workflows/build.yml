name: Check stable overlay poll registration
on:
  push:
    branches: [qualification/overlay-poll-clean-qualification]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/overlay-poll-clean-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      SOURCE: e5db0d09f12ea8ce83f7d87e94ea54e9dad9341c
      STOCK: 690aea2e01876ce19927f967fd9688be5f2e2c40
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
        persist-credentials: false
    - name: Bind the two sources and restore the original verifier
      shell: bash
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^) == "$SOURCE" && $(git rev-parse "$SOURCE^") == "$STOCK" ]]
        mkdir -p "$RUNNER_TEMP/checker" "$RUNNER_TEMP/focused/"{stock,corrected}
        cp test/rbe/overlay_report.py "$RUNNER_TEMP/checker/"
    - name: Check the actual proc owner on the matched GNU worker
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        plat=$RUNNER_TEMP/poll-gnu-platform
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        cat >"$plat/BUILD" <<BUILD
        platform(
            name = "gnu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {"Arch":"amd64", "OSFamily":"linux", "workload-isolation-type":"firecracker", "container-image":"docker://$GNU"},
            visibility = ["//visibility:public"],
        )
        BUILD
        rc=$RUNNER_TEMP/poll-gnu.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=remote' "build --inject_repository=poll_gnu_platform=$plat" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$rc"
        unset BUILDBUDDY_API_KEY
        for arm in stock corrected; do
          if [[ "$arm" == stock ]]; then armsha=$STOCK; else armsha=$SOURCE; fi
          git checkout --quiet --detach "$armsha"
          [[ $(git rev-parse HEAD) = "$armsha" && -z $(git status --porcelain --untracked-files=no) ]]
        docker run --rm --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c '
          set -euo pipefail
          temp=$1
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
          out=$temp/focused/$3
          code=0
          test -x /usr/bin/x86_64-linux-gnu-gcc && test -x /usr/bin/aarch64-linux-gnu-gcc
          bazel --bazelrc="$temp/poll-gnu.bazelrc" test --config=x86_64 -c opt --test_timeout=180 --jobs=80 --nocache_test_results --modify_execution_info="^TestRunner$=+no-remote-cache" --remote_download_outputs=toplevel --remote_download_regex=".*[/]test[.](log|xml)$" --test_sharding_strategy=disabled --test_env=GO_TEST_WRAP_TESTV=1 --test_arg=-test.v --test_filter="^TestOverlayPollUnregisterAfterCopyUp$" --build_event_json_file="$out/events.jsonl" //pkg/sentry/fsimpl/proc:proc_test > "$temp/poll-gnu.log" 2>&1 || code=$?
          grep -E "^ERROR:.*(failed|No such file|not found)|Error creating kernel|hostname change woke" "$temp/poll-gnu.log" | tail -8 || :
          python3 -B "$temp/checker/overlay_report.py" "$out" waiter "$2" //pkg/sentry/fsimpl/proc:proc_test "$code"
        ' _ "$RUNNER_TEMP" "$armsha" "$arm"
        done
    - name: Verify that the copy-up regression changed from failing to passing
      if: always()
      shell: bash
      run: |
        python3 - "$RUNNER_TEMP/focused" <<'PYTHON'
        import json, os, sys
        from pathlib import Path
        out=Path(sys.argv[1])
        for arm, key, expected in (("stock","STOCK","FAILED"),("corrected","SOURCE","PASSED")):
            v=json.loads((out/arm/"result.json").read_text())
            assert v["source"]==os.environ[key] and v["verdict"]=="COMPLETE" and v["matched"]
            assert v["test_status"]==expected and v["stale_wake"]==(arm=="stock")
        PYTHON
    - name: Save typed syscall and test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: overlay-poll-results
        path: ${{ runner.temp }}/focused/*/result.json
        if-no-files-found: error
