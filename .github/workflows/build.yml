name: Check gRPC plugin publication on Linux and macOS
on:
  push:
    branches: [qualification/grpc-plugin-artifact]
permissions:
  contents: read
jobs:
  linux:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    env:
      USE_BAZEL_VERSION: 8.8.1
      CC: /usr/bin/gcc
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      MINIMAL: mirror.gcr.io/library/hello-world@sha256:c567b231f65614688711a75f31518a064258a51d442117a3e771a3a8fdba78ef
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 12, persist-credentials: false}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tamird/grpc
        ref: ccfbbe36987afbad715cbca3c6bc791a7e33d2c9
        path: supplier
        persist-credentials: false
        fetch-depth: 2
    - name: Prepare the previously qualified compiler coordinator and execution platforms
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/grpc-receipt"
        mkdir -p "$d" "$RUNNER_TEMP/grpc-workers"
        printf '{"status":"INCOMPLETE","reason":"no final verifier result"}\n' > "$d/verdict.json"
        git merge-base --is-ancestor aa767e4c43d011121271551fe24da501a56f729d HEAD
        cat > "$RUNNER_TEMP/grpc-workers/MODULE.bazel" <<'EOF'
        module(name = "grpc_workers")
        EOF
        cat > "$RUNNER_TEMP/grpc-workers/BUILD" <<EOF
        package(default_visibility=["//visibility:public"])
        constraint_setting(name="contents")
        constraint_value(name="empty",constraint_setting=":contents")
        platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","EstimatedMemory":"4GB","container-image":"docker://$GNU"})
        platform(name="scratch",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux",":empty"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"oci","container-image":"docker://$MINIMAL"})
        EOF
        umask 077
        test -n "$BUILDBUDDY_API_KEY"
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=local' 'build --noremote_local_fallback'
          printf '%s\n' "build --inject_repository=grpc_workers=$RUNNER_TEMP/grpc-workers" 'build --extra_execution_platforms=@grpc_workers//:scratch' 'build --host_platform=@grpc_workers//:scratch'
          printf '%s\n' 'build --strategy=Action=remote' 'build --strategy=Genrule=local' 'build --noremote_upload_local_results'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/grpc.bazelrc"
        unset BUILDBUDDY_API_KEY
        umask 022
        gcc -dumpfullversion > "$d/coordinator-gcc"
        ld.bfd --version | head -1 > "$d/coordinator-linker"
    - name: Run both existing generators on the shell-free worker
      run: python3 test/rbe/grpc-native-codegen/copy.py linux
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: grpc-plugin-file-linux
        path: ${{ runner.temp }}/linux-receipt.json
        if-no-files-found: error
    - name: Install project generator Python dependencies
      if: ${{ !cancelled() }}
      run: |
        python3 -m venv --system-site-packages "$RUNNER_TEMP/grpc-buildgen-env"
        "$RUNNER_TEMP/grpc-buildgen-env/bin/pip" install Mako PyYAML
    - name: Compare canonical Python and C++ generators and render CMake
      if: ${{ !cancelled() }}
      env:
        USE_BAZEL_VERSION: 8.7.0
      run: |
        export PATH="$RUNNER_TEMP/grpc-buildgen-env/bin:$PATH"
        python3 test/rbe/grpc-native-codegen/copy.py metadata
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: grpc-plugin-file-metadata
        path: ${{ runner.temp }}/metadata-receipt.json
        if-no-files-found: error
