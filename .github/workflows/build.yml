name: Check effective TCP MSS across live connection restore
on:
  push:
    branches: [qualification/tcp-migration-mss]
permissions: {}
jobs:
  migration:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Bind the conservative prototype, source correction and identical packet fixture
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tcp-migration-mss"
          mkdir -p "$work/results"
          git init -q
          git -c gc.auto=0 fetch -q --no-auto-maintenance --no-tags --depth=4 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git switch -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 93bdf65ef0c2179f59bf4a4b1ab6703c5eb7c8e5
          test "$(git rev-parse HEAD^^)" = 01fa1742767266686dc5831217daadf8bcead9c3
          test "$(git rev-parse HEAD^^{tree})" = 03c58f8107ee7b973d9773f04cd7f27f45f5a20c
          test "$(git rev-parse HEAD^:pkg/tcpip/transport/tcp/test/e2e/tcp_migration_test.go)" = 191a475f0d6c398d47a9a10bba4215a06a71c944
          printf '%s\n' .github/qualification/tcp_migration_mss.py .github/workflows/build.yml pkg/tcpip/transport/tcp/test/e2e/tcp_migration_test.go | diff - <(git diff --name-only HEAD^ HEAD)
          printf '%s\n' pkg/tcpip/transport/tcp/snd.go pkg/tcpip/transport/tcp/test/e2e/tcp_migration_test.go | diff - <(git diff --name-only HEAD^^ HEAD^)
          cp .github/qualification/tcp_migration_mss.py "$work/report.py"
          test "$(cat .bazelversion)" = 9.3.1
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$work/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $work/bazel" | sha256sum -c -
          chmod 700 "$work/bazel"
      - name: Exercise both real TCP owners with the same restored peer
        timeout-minutes: 48
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" python3 -B "$RUNNER_TEMP/tcp-migration-mss/report.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: tcp-migration-payload-and-ack-credit
          path: ${{ runner.temp }}/tcp-migration-mss/results/
          if-no-files-found: error
          retention-days: 14
