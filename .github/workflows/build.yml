name: Qualify the Buildkite CLI without third-party logs
on:
  push:
    branches: [qualification/buildkite-cli-failure-attribution-processwrapper]
permissions: {contents: read}
jobs:
  offline:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Check the unchanged source, executable and documented help commands
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 30143217adf5ade390febe1a48447b334c874c2e
          git diff --exit-code HEAD^ HEAD -- . ':!tools/buildkite/BUILD' ':!tools/buildkite/offline_observation_test.py' ':!.github/qualification/buildkite_offline.py' ':!.github/workflows/build.yml'
          test "$(git ls-tree HEAD tools/buildkite/buildkite.py)" = "$(git ls-tree HEAD^ tools/buildkite/buildkite.py)"
          d="$RUNNER_TEMP/buildkite-offline"
          mkdir -m 700 "$d"
          direct=0
          tools/buildkite/buildkite.py --help >"$d/direct.out" 2>"$d/direct.err" || direct=$?
          interpreter=0
          python3 -IB tools/buildkite/buildkite.py --help >"$d/python.out" 2>"$d/python.err" || interpreter=$?
          jq -n --arg mode "$(stat -c '%a' tools/buildkite/buildkite.py)" --argjson direct "$direct" --argjson python "$interpreter" '{mode:$mode,direct_help_exit:$direct,python_help_exit:$python}' >"$d/help.json"
          test "$(bazelisk --version)" = 'bazel 9.3.1'
      - name: Run the original and synthetic tests with their offline inputs
        run: |
          d="$RUNNER_TEMP/buildkite-offline"
          code=0
          bazelisk test --strategy=TestRunner=processwrapper-sandbox --nocache_test_results \
            --build_event_json_file="$d/bep" --test_output=errors --jobs=4 \
            //tools/buildkite:buildkite_test //tools/buildkite:offline_observation_test || code=$?
          echo "$code" >"$d/exit"
      - name: Read the actual test results
        if: always() && !cancelled()
        run: python3 -IB .github/qualification/buildkite_offline.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !cancelled()
        with:
          name: buildkite-offline
          path: ${{ runner.temp }}/buildkite-offline/result.json
          if-no-files-found: warn
