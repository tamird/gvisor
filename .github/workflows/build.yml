name: Read the original TCP forwarder XML and lock diagnostics
on:
  push:
    branches: [qualification/tcp-forwarder-guards]
permissions: {}
jobs:
  read-original:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
    - name: Verify two original results without building or testing
      shell: python
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        """Read two original BuildBuddy test files, retaining only their verified names."""
        import base64
        import collections
        import datetime
        import hashlib
        import http.client
        import json
        import os
        import re
        import sys
        import urllib.parse
        import xml.etree.ElementTree as ET
        from pathlib import Path


        def request(route, data=None):
            headers = {"Content-Type": "application/json"}
            if key:
                headers["x-buildbuddy-api-key"] = key
            conn = http.client.HTTPSConnection("app.buildbuddy.io", timeout=30)
            try:
                conn.request("POST" if data else "GET", route,
                             json.dumps(data).encode() if data else None, headers)
                res = conn.getresponse()
                raw = res.read()
                if res.status != 200:
                    raise ValueError(f"BuildBuddy HTTP {res.status}")
                return raw
            finally:
                conn.close()


        def original(uid, label, name):
            refs = []
            try:
                body = json.loads(request("/api/v1/GetAction", {"selector": {
                    "invocation_id": uid, "target_label": label}}))
                for action in body.get("action", []):
                    if action.get("targetLabel", action.get("target_label")) == label:
                        refs.extend(a for a in action.get("file",[]) if a.get("name")==name)
            except ValueError:
                pass
            if len(refs) != 1:
                refs = []
                invocations = json.loads(request("/rpc/BuildBuddyService/GetInvocation", {
                    "lookup": {"invocationId": uid}}))["invocation"]
                for inv in invocations:
                    if inv.get("invocationId") != uid:
                        continue
                    for wrapped in inv.get("event", []):
                        ev = wrapped.get("buildEvent", {})
                        if ev.get("id",{}).get("testResult",{}).get("label") == label:
                            refs.extend(a for a in ev.get("testResult",{}).get("testActionOutput",[]) if a.get("name")==name)
            if len(refs) != 1:
                raise ValueError(f"Expected one {name} on {label}, found {len(refs)}")
            f=refs[0]
            if "contents" in f:
                return base64.b64decode(f["contents"], validate=True)
            uri=f["uri"]
            if not re.fullmatch(r"bytestream://(?:remote|cache)\.buildbuddy\.io/[^?#]*blobs/[0-9a-f]{64}/\d+",uri):
                raise ValueError("Missing a supported original CAS URI")
            _, digest, size = uri.rsplit("/",2)
            try:
                raw=request("/api/v1/GetFile",{"uri":uri})
                if hashlib.sha256(raw).hexdigest() != digest:
                    raise ValueError("alternate download required")
            except ValueError:
                raw=request("/file/download?"+urllib.parse.urlencode({"bytestream_url":uri,"invocation_id":uid}))
            if len(raw)!=int(size) or hashlib.sha256(raw).hexdigest()!=digest:
                raise ValueError("Original file digest or size differs")
            return raw


        key=os.environ.pop("BUILDBUDDY_API_KEY","")
        neg="c2f623d8-1924-453e-9941-d9fd5b9c8eb8"
        fix="872667a3-cc31-413b-9761-f81705a27785"
        assert all(re.fullmatch(r"[0-9a-f-]{36}", s) for s in (neg,fix))
        nogo="//pkg/tcpip/transport/tcp:tcp_nogo"
        suite="//pkg/tcpip/transport/tcp/test/e2e:forwarder_test"
        log=original(neg,nogo,"test.log")
        xml=original(fix,suite,"test.xml")
        samples=[]
        unknown=[]
        for line in log.decode().splitlines():
            if not re.search(r"\b\w+: (?:[.\w/-]+\.go):\d+(?::\d+)?: ",line):
                continue
            m=re.search(r"checklocks: pkg/tcpip/transport/tcp/forwarder\.go:(127|136)(?::\d+)?: .*invalid field access,.*?accessing (forwarder|inFlight) .*?ARCH=(arm64|amd64),",line)
            if m:
                samples.append(m.groups())
            else:
                unknown.append(hashlib.sha256(line.encode()).hexdigest())
        cases={}
        for case in ET.fromstring(xml).iter("testcase"):
            n=case.get("name","")
            if not re.fullmatch(r"[\w /.,:=+-]+", n) or len(n)>180:
                raise ValueError("unexpected case name")
            if case.find("failure") is not None or case.find("error") is not None or case.find("skipped") is not None or case.get("status")=="notrun" or case.get("result")=="suppressed":
                raise ValueError("nonpassing original case")
            cases[n]=cases.get(n,0)+1
        needs={"TestForwarderSendMSSLessThanMTU","TestForwarderDoesNotRejectECNFlags","TestForwarderFailedConnect","TestForwarderDroppedStats"}
        expected={(line,field,arch) for line,field in (("127","forwarder"),("136","inFlight")) for arch in ("amd64","arm64")}
        ok=set(samples)==expected and not unknown and needs <= set(cases)
        record={"source_run":41233276131,"negative":{"source":"f3cc51dd251200f128ebc95ccd7535ce7cdef915","invocation":neg,"label":nogo,"file":"test.log","sha256":hashlib.sha256(log).hexdigest(),"distinct_findings": dict(sorted(collections.Counter("/".join(t) for t in samples).items())),"other_finding_count":len(unknown)},"fixed":{"source":"d65202e4847dea7e019090ddaa02863a39832aeb","invocation":fix,"label":suite,"file":"test.xml","sha256":hashlib.sha256(xml).hexdigest(),"passed":cases},"verified":ok,"finished_at":datetime.datetime.now(datetime.timezone.utc).isoformat()}
        (Path(os.environ["RUNNER_TEMP"])/"original-reports.json").write_text(json.dumps(record,indent=2)+"\n")
        print(json.dumps(record))
        raise SystemExit(not ok)
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: original-forwarder-reports
        path: ${{ runner.temp }}/original-reports.json
        if-no-files-found: error
