name: Check cumulative ACK credit after two route changes
on:
  push:
    branches: [qualification/tcp-migration-credit]
permissions: {}
jobs:
  migration:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Bind both integrated parents and the recorded IPv6 fixture
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tcp-migration-credit"
          mkdir -p "$work/results"
          harness=0d423372840cf49baa3af27956fe7244f5e7bbac
          assets=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
          registry=c3569a60dc1836ac6fad05e86d7951866c796b4f
          prior=fe8e3a2bd83cc3bee9995762569c7f40dfa13a8e
          git init -q
          git -c gc.auto=0 fetch -q --no-auto-maintenance --no-tags --depth=4 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$harness" "$assets" "$registry" "$prior"
          git switch -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^^{tree})" = 9366a726c8b088bb7245e613099efce4b12ec40f
          test "$(git rev-parse HEAD^^1)" = b64ce83201bc89cc9d52186a15ba982b02b4266e
          test "$(git rev-parse HEAD^^2)" = 93bdf65ef0c2179f59bf4a4b1ab6703c5eb7c8e5
          test "$(git rev-parse HEAD^^1^)" = 679d14eed77a4ce6029065d88248c8ce0902c270
          test "$(git rev-parse HEAD^^2^)" = 01fa1742767266686dc5831217daadf8bcead9c3
          test "$(git rev-parse "$prior^")" = 93bdf65ef0c2179f59bf4a4b1ab6703c5eb7c8e5
          printf '%s\n' .github/qualification/tcp_migration_credit.py .github/workflows/build.yml | diff - <(git diff --name-only HEAD^ HEAD)
          cp .github/qualification/tcp_migration_credit.py "$work/report.py"
          git show "$prior:.github/qualification/tcp_migration_mss.py" > "$work/previous.py"
          git show "$harness:.github/qualification/timer_teardown.py" > "$work/timer_teardown.py"
          git show "$assets:.github/qualification/recvbuf_deps.py" > "$work/public_assets.py"
          git show "$registry:.github/qualification/tldk_installed_inputs.json" > "$work/inputs.json"
          git show "$registry:.github/qualification/tldk_public_inputs.py" > "$work/tldk_public_inputs.py"
          test "$(cat .bazelversion)" = 9.3.1
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$work/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $work/bazel" | sha256sum -c -
          chmod 700 "$work/bazel"
      - name: Run the two migration cases through one fresh local TCP TestRunner
        timeout-minutes: 48
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" python3 -B "$RUNNER_TEMP/tcp-migration-credit/report.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: tcp-migration-credit
          path: ${{ runner.temp }}/tcp-migration-credit/results/
          if-no-files-found: error
          retention-days: 14
