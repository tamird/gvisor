name: Check typed TCP shutdown flags on both architectures
on:
  push:
    branches: [qualification/tcp-typed-shutdown]
permissions: {contents: read}
jobs:
  validate:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: bf20197d4c2ba3b36cbd9bb034f407a9c5cce5e6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind the product, syscall fixture and previous saved-scalar test
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/typed-shutdown"
          mkdir -p "$d/platform" "$d/home"
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git rev-parse HEAD^^)" = 254c8ddfcc97180f83ba6454db22afb6235b5df3
          echo "112e9234135cd57b4c17a82a54a434778d213229e0e620683bee4f98c30d49a0  test/syscalls/linux/tcp_socket.cc" | sha256sum -c -
          echo "f0b5b0c8036a82d2371e47165b917bdf777def4c09558bab8b1f56d6acd591e9  .github/qualification/rejected.go" | sha256sum -c -
          cp .github/qualification/{rejected.go,typed_shutdown.py} "$d/"
          git checkout -q --detach "$PRODUCT"
          test "$(cat .bazelversion)" = 8.8.1
          printf 'module(name="tcp_gnu")\n' >"$d/platform/MODULE.bazel"
          printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$d/platform/BUILD"
          docker pull --platform=linux/amd64 "$GNU"
          docker run -d --name tcp-compiler --entrypoint /bin/sleep --user "$(id -u):$(id -g)" -e HOME="$d/home" -e USER="$(id -un)" -e USE_BAZEL_VERSION=8.8.1 --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" infinity
          curl -fsSL --retry 2 --max-time 120 https://releases.bazel.build/8.8.1/release/bazel-8.8.1-linux-x86_64 -o "$d/bazel"
          echo "5b5bab2095065817d3416ca9a0678bd39c10c9ede432dbe8187bfe74de285160  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          test "$(docker exec tcp-compiler "$d/bazel" --version)" = 'bazel 8.8.1'
      - name: Configure the existing remote executor
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/typed-shutdown"
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$d/platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } >"$d/client.rc"
      - name: Run the TCP, atomic, syscall and checkpoint checks
        run: python3 "$RUNNER_TEMP/typed-shutdown/typed_shutdown.py"
      - name: Remove the scoped client configuration
        if: always()
        run: |
          docker rm -f tcp-compiler >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/typed-shutdown/client.rc"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: typed-shutdown
          path: ${{ runner.temp }}/typed-shutdown/result.json
          if-no-files-found: warn
          retention-days: 14
