name: Read original stateify prerequisite failures
on:
  push:
    branches: [qualification/stateify-original-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Bind the original failed receipt and fixed-origin reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"verdict":"INCOMPLETE","phase":"setup"}' > "$RUNNER_TEMP/stateify-native-review.json"
          test "$(git rev-parse HEAD^)" = 674c9bf24453910174c718b2fcc4365bbab248c6
          test "$(git rev-parse HEAD~2)" = 778375bc602d883faf89a2f5b7bdf4016804da10
          gh api repos/tamird/gvisor/actions/artifacts/13255863288/zip > "$RUNNER_TEMP/original.zip"
          helper=680739b629229eb1c8fa91aa1147d1bca71eb04f
          git fetch --no-tags --depth=1 origin "$helper"
          git show "$helper:test/rbe/cas_inputs.py" > "$RUNNER_TEMP/cas_inputs.py"
      - name: Read two existing invocations; no product tests or builds
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B .github/qualification/lint-runtime/stateify.py
      - name: Check the typed artifact boundary
        id: scan
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'stateify-native-review.json'
          data=p.read_bytes()
          json.loads(data)
          for key in ('BUILDBUDDY_API_KEY','GH_TOKEN'):
              value=os.environ.get(key,'').encode()
              if value and value in data: raise SystemExit('credential found in report')
          if any(s in data for s in (b'ghs_',b'ghp_',b'github_pat_',b'x-buildbuddy-api-key=')): raise SystemExit('credential marker found')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && steps.scan.outcome == 'success' }}
        with:
          name: stateify-native-review
          path: ${{ runner.temp }}/stateify-native-review.json
          if-no-files-found: error
