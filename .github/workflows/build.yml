name: Measure release tools on an unmodified Jammy image
on:
  push:
    branches: [qualification/minimal-client-release-execs]
permissions: {contents: read}
jobs:
  release:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && !github.event.deleted
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the release and compiler revisions and the Bazel client
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/direct-client"
          mkdir -p "$d/arm64" "$d/amd64" "$d/observer"
          cp .github/qualification/{release_tools.py,release_tools.sh} "$d/"
          git fetch --quiet --depth=2 https://github.com/tamird/gvisor.git c115840f8a85010111fa5d72b611d7d9ab1df34b
          test "$(git rev-parse FETCH_HEAD^)" = 4bee07965270dc7cb4ed89eb6a3b17968b3e0a90
          git checkout --quiet --detach c115840f8a85010111fa5d72b611d7d9ab1df34b
          test -z "$(git status --porcelain)"
          curl --fail --show-error --silent --location --retry 3 --proto '=https' --proto-redir '=https' https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          sha256sum /usr/bin/git > "$d/git-binding.sha256"
          pool=https://archive.ubuntu.com/ubuntu/pool/main
          curl -fsSL --retry 2 "$pool/s/strace/strace_5.16-0ubuntu3_amd64.deb" -o "$d/strace.deb"
          curl -fsSL --retry 2 "$pool/libu/libunwind/libunwind8_1.3.2-2build2_amd64.deb" -o "$d/unwind.deb"
          echo "847a3535be015325f127f121d2ea5ac042b32bd20a5861a94cb7782b09857b1f  $d/strace.deb" | sha256sum -c -
          echo "475ae509da614dd5d7210f605fd5894a3c98b6fb8c18738b16d8d4b700553c30  $d/unwind.deb" | sha256sum -c -
          dpkg-deb -x "$d/strace.deb" "$d/observer"
          dpkg-deb -x "$d/unwind.deb" "$d/observer"
      - name: Build both releases with the pinned Bazel client and Git for the source stamp
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/direct-client"
          digest=sha256:8a2321a92b438238f93b4346fff61bc4259c99fdd4d9b52ee86f153fee0c344f
          base="mirror.gcr.io/library/ubuntu@$digest"
          if ! docker pull --platform linux/amd64 "$base"; then
            base="docker.io/library/ubuntu@$digest"
            docker pull --platform linux/amd64 "$base"
          fi
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$base")" = linux/amd64
          docker run --rm --workdir /workspace --entrypoint /bin/bash \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            -v "$GITHUB_WORKSPACE:/workspace" -v "$d:/audit" -v "$d/observer:/observer:ro" \
            -v "$d/bazel:/usr/local/bin/bazel:ro" -v /usr/bin/git:/usr/bin/git:ro "$base" /audit/release_tools.sh
      - name: Verify release files and report host executions outside the producer
        if: always() && !cancelled()
        run: python3 -IB "$RUNNER_TEMP/direct-client/release_tools.py" "$RUNNER_TEMP/direct-client"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: minimal-client-release-tools
          path: ${{ runner.temp }}/direct-client/release-tools.json
          if-no-files-found: error
          retention-days: 7
