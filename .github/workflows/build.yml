name: Measure both veth MTUs on native Linux
on:
  push:
    branches: [qualification/tcp-veth-peer-mtu-native]
permissions: {contents: read}
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Run one fresh native Linux MTU comparison in a private namespace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2b35344a82f0d60280afca27b3516f26baef837c
          rc=0
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" "$(command -v bazel)" test --config=x86_64 \
            --strategy=TestRunner=local --nocache_test_results --flaky_test_attempts=1 \
            --remote_executor= --remote_cache= --build_tag_filters= --test_tag_filters= \
            --build_event_json_file="$RUNNER_TEMP/veth.events" \
            //test/rtnetlink/linux:veth_peer_mtu > "$RUNNER_TEMP/veth-build.log" 2>&1 || rc=$?
          echo "$rc" > "$RUNNER_TEMP/veth.exit"
          exit "$rc"
      - name: Preserve only the MTUs and original execution record
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          label = "//test/rtnetlink/linux:veth_peer_mtu"
          report = {"source": os.environ["GITHUB_SHA"], "owner": label, "status":"INCOMPLETE",
                    "attempts":[], "reads":[], "remote_cache":"disabled", "remote_executor":"disabled"}
          try:
              report["bazel_exit"] = int((root/"veth.exit").read_text())
              for line in (root/"veth.events").read_text().splitlines():
                  e = json.loads(line)
                  if e.get("id",{}).get("testResult",{}).get("label") == label:
                      t = e["testResult"]
                      execution = t.get("executionInfo",{})
                      report["attempts"].append({"status":t["status"],"strategy":execution.get("strategy"),
                          "cached":t.get("cachedLocally",False) or execution.get("cachedRemotely",False),
                          "start":t.get("testAttemptStart"),"duration":t.get("testAttemptDuration")})
              log = Path("bazel-testlogs/test/rtnetlink/linux/veth_peer_mtu/test.log")
              for line in log.read_text().splitlines():
                  if line.startswith("VETH_MTU "):
                      report["reads"].append(json.loads(line.split(" ",1)[1]))
                  if line.startswith("VETH_HOST "):
                      report["host"] = json.loads(line.split(" ",1)[1])
              attempt, = report["attempts"]
              assert not report["bazel_exit"] and not attempt["cached"] and attempt["strategy"]=="local" and attempt["status"]=="PASSED"
              assert [x["mtus"] for x in report["reads"]] == [[1500,1500],[3000,1500],[3000,1460]]
              report["status"] = "PASS"
          finally:
              (root/"native-veth-mtu.json").write_text(json.dumps(report, indent=2)+"\n")
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-veth-mtu
          path: ${{ runner.temp }}/native-veth-mtu.json
          if-no-files-found: error
