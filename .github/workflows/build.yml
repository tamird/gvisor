name: Check gRPC plugin publication on macOS
on:
  push:
    branches: [qualification/grpc-plugin-artifact-darwin]
permissions:
  contents: read
jobs:
  darwin:
    if: github.repository == 'tamird/gvisor'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tamird/grpc
        ref: ccfbbe36987afbad715cbca3c6bc791a7e33d2c9
        path: supplier
        persist-credentials: false
        fetch-depth: 2
    - name: Build, archive and run the final universal plugins
      run: python3 test/rbe/grpc-native-codegen/copy.py darwin
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: grpc-plugin-artifact-darwin
        path: ${{ runner.temp }}/darwin-receipt.json
        if-no-files-found: error
