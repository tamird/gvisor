name: Verify the shared process fixtures
on:
  push:
    branches: [qualification/shared-testprocess-exit-owner]
permissions: {contents: read}
jobs:
  linux:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind the public source and install its GNU build prerequisites
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/shared-process"
          mkdir -m 755 "$w"
          cp .github/qualification/shared_process.py "$w/check.py"
          test "$(git rev-parse HEAD^)" = 122b98abdf94f0000340b489c1da77505051de0d
          test "$(git rev-parse HEAD^^)" = 272ad5c729aa522d373a786400c21c2eed198f4d
          git fetch --quiet --no-tags --depth=1 origin 531bc8fc3f23f845f85762e2ee30bc7c511c4181
          git switch --detach HEAD^
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --retry 2 --max-time 90 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $w/bazel" | sha256sum -c -
          chmod 755 "$w/bazel"
          for suite in jammy jammy-updates; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu $suite main universe"
          done > "$w/jammy.list"
          opts=(-o "Dir::Etc::sourcelist=$w/jammy.list" -o Dir::Etc::sourceparts=-)
          sudo -n apt-get "${opts[@]}" update -qq
          sudo -n apt-get "${opts[@]}" install -qq -y --no-install-recommends g++-aarch64-linux-gnu libnuma-dev
      - name: Run the five Linux owners and the missing-runtime control, cross-build the ARM64 owners
        run: python3 -IB "$RUNNER_TEMP/shared-process/check.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: shared-process-wait-owner
          path: |
            ${{ runner.temp }}/shared-process/results.json
            ${{ runner.temp }}/shared-process/*-test.log
            ${{ runner.temp }}/shared-process/*-test.xml
          if-no-files-found: error
          retention-days: 14
