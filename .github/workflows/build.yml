name: Check overlay poll on gVisor and Linux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/overlay-poll-gnu'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      SOURCE: e87b1bcb66e360966026a8435c1907a4179f12db
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
        persist-credentials: false
    - name: Check the source and prepare the original verifier
      id: source
      shell: bash
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD) = "$GITHUB_SHA" && $(git rev-parse HEAD^1^2) = "$SOURCE" ]]
        [[ $(git diff --name-only "$SOURCE^" "$SOURCE" | paste -sd, -) = "pkg/sentry/fsimpl/proc/BUILD,pkg/sentry/fsimpl/proc/overlay_poll_test.go" ]]
        mkdir -p "$RUNNER_TEMP/checker" "$RUNNER_TEMP/focused/"{waiter,linux}
        cp test/rbe/{overlay_report.py,overlay_preflight.py} "$RUNNER_TEMP/checker/"
        python3 -B "$RUNNER_TEMP/checker/overlay_preflight.py"
    - name: Exercise native Linux in a private mount and UTS namespace
      shell: bash
      run: |
        set -euo pipefail
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        out=$RUNNER_TEMP/focused/linux
        code=0
        bazelisk test --spawn_strategy=local --strategy=TestRunner=local --nocache_test_results --test_output=errors "--build_event_json_file=$out/events.jsonl" //test/overlay_poll_control:linux_test || code=$?
        python3 -B - "$out" "$code" <<'PY'
        from hashlib import sha256
        import json
        from pathlib import Path
        import sys
        from urllib.parse import unquote, urlparse

        out, code = Path(sys.argv[1]), int(sys.argv[2])
        owner = "//test/overlay_poll_control:linux_test"
        r = dict(command_exit=code, owner=owner, verdict="INCOMPLETE")
        try:
            events = [json.loads(line) for line in (out / "events.jsonl").read_bytes().splitlines()]
            r["invocation"] = next(e["started"]["uuid"] for e in events if "started" in e)
            r["bazel_exit"] = next(e["finished"]["exitCode"].get("code", 0) for e in events if "finished" in e)
            test, = [e["testResult"] for e in events if e.get("id", {}).get("testResult", {}).get("label") == owner]
            r["test_status"] = test["status"]
            base = Path("bazel-testlogs/test/overlay_poll_control/linux_test")
            data = (base / "test.log").read_bytes()
            file, = [f for f in test["testActionOutput"] if f["name"] == "test.log"]
            dg = sha256(data).hexdigest()
            if file.get("digest"):
                assert file["digest"] == dg and int(file["length"]) == len(data)
            else:
                uri = urlparse(file["uri"])
                assert uri.scheme == "file" and Path(unquote(uri.path)).resolve() == (base / "test.log").resolve()
            r["log"] = {"sha256": dg, "bytes": len(data)}
            line, = [x[len(b"LINUX_OVERLAY_POLL "):] for x in data.splitlines() if x.startswith(b"LINUX_OVERLAY_POLL ")]
            r["syscalls"] = json.loads(line)
            assert test["status"] == "PASSED" and code == r["bazel_exit"] == 0
            r["verdict"] = "COMPLETE"
        except Exception as exc:
            r.update(error=type(exc).__name__, line=exc.__traceback__.tb_lineno)
        finally:
            (out / "result.json").write_text(json.dumps(r, indent=2, sort_keys=True)+"\n")
        sys.exit(r["verdict"] != "COMPLETE")
        PY
    - name: Check the actual proc owner on the matched GNU worker
      if: ${{ !cancelled() && steps.source.outcome == 'success' }}
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        git checkout --quiet --detach "$SOURCE"
        [[ $(git rev-parse HEAD) = "$SOURCE" && -z $(git status --porcelain --untracked-files=no) ]]
        plat=$RUNNER_TEMP/poll-gnu-platform
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        cat >"$plat/BUILD" <<BUILD
        platform(
            name = "gnu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {"Arch":"amd64", "OSFamily":"linux", "workload-isolation-type":"firecracker", "container-image":"docker://$GNU"},
            visibility = ["//visibility:public"],
        )
        BUILD
        rc=$RUNNER_TEMP/poll-gnu.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=remote' "build --inject_repository=poll_gnu_platform=$plat" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$rc"
        unset BUILDBUDDY_API_KEY
        docker run --rm --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c '
          set -euo pipefail
          temp=$1
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
          out=$temp/focused/waiter
          code=0
          test -x /usr/bin/x86_64-linux-gnu-gcc && test -x /usr/bin/aarch64-linux-gnu-gcc
          bazel --bazelrc="$temp/poll-gnu.bazelrc" test --config=x86_64 -c opt --test_timeout=180 --jobs=80 --nocache_test_results --modify_execution_info="^TestRunner$=+no-remote-cache" --remote_download_outputs=toplevel --remote_download_regex=".*[/]test[.](log|xml)$" --test_sharding_strategy=disabled --test_env=GO_TEST_WRAP_TESTV=1 --test_arg=-test.v --test_filter="^TestOverlayPollUnregisterAfterCopyUp$" --build_event_json_file="$out/events.jsonl" //pkg/sentry/fsimpl/proc:proc_test > "$temp/poll-gnu.log" 2>&1 || code=$?
          grep -E "^ERROR:.*(failed|No such file|not found)|Error creating kernel|hostname change woke" "$temp/poll-gnu.log" | tail -8 || :
          python3 -B "$temp/checker/overlay_report.py" "$out" waiter "$2" //pkg/sentry/fsimpl/proc:proc_test "$code"
        ' _ "$RUNNER_TEMP" "$SOURCE"
    - name: Save typed syscall and test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: overlay-poll-results
        path: ${{ runner.temp }}/focused/*/result.json
        if-no-files-found: error
