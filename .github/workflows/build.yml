name: Check complete caller arguments in the supplier C++ jobs
on:
  push:
    branches: [qualification/llvm-runtime-stage-fission-jobs]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Check out the caller-configuration repair directly above PR 938
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tamird/hermetic-llvm
          ref: 7c9e7687d85d46b30225b4047d6cf6150446e69f
          fetch-depth: 2
          path: llvm
          persist-credentials: false
      - name: Configure the existing remote executor
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          test -n "$BUILDBUDDY_API_KEY"
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/sidecar.bazelrc"
      - name: Run the supplier's mapped test, unmapped build and ASan fission test
        run: python3 test/rbe/native_sidecars/validate_fission_jobs.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: llvm-caller-configuration-fission-jobs
          path: ${{ runner.temp }}/sidecar-evidence
          if-no-files-found: error
