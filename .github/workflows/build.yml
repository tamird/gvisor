name: Load the public C++ test rule
on:
  push:
    branches: [qualification/native-rule-package-loading]
permissions:
  contents: read
jobs:
  load:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Load the original transitioned C++ test declaration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d11ab354e1c9e1244752f33f3f819929bb142de2
          git checkout --detach HEAD^
          test "$(bazelisk --version)" = 'bazel 9.3.1'
          bazelisk --nosystem_rc --nohome_rc --noworkspace_rc query --color=no --curses=no //test/util:posix_error_test_arm64
