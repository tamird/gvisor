name: Compile seccheck with LLVM 0.8.26
on:
  push:
    branches: [qualification/seccheck-llvm-0826-stdio-build]
permissions: {}
jobs:
  compile:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify source and fetch the pinned Bazel client
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = a81045f739c45596265f889dff2a4cbc283a9144
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/seccheck_stdio.py'
          test "$(cat .bazelversion)" = 9.3.1
          cd "$RUNNER_TEMP"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o seccheck-bazel
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  seccheck-bazel' | sha256sum -c -
          chmod 700 seccheck-bazel
      - name: Compile the protobuf and its C++ consumer on three targets
        run: |
          env -i HOME="$HOME" USER="$USER" PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB .github/qualification/seccheck_stdio.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: seccheck-llvm-0826-compilation
          path: ${{ runner.temp }}/seccheck-stdio/receipts
          if-no-files-found: error
          retention-days: 30
