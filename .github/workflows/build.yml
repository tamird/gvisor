name: Recover original native VFIO evidence and diagnose linker input
on:
  push:
    branches: [qualification/vfio-original-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/vfio-original-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      OSTOCK: 1d9c89c688bc2e03dc54a8313167bc6fc7cef76d
      OFIXED: 4b155ef913179b993b8fbb6d57fb5b38f3dbc2db
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Read the original invocation data
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 test/rbe/tcg/vfio_evidence.py
    - name: Decide whether a linker replay is needed
      id: needs
      run: |
        shopt -s nullglob
        files=("$RUNNER_TEMP"/records/link-error-*)
        if (( ${#files[@]} )) && grep -Eq 'ld\.lld: error|undefined reference|undefined symbol|cannot find|cannot open' "${files[@]}"; then echo 'link=false' >>"$GITHUB_OUTPUT"; else echo 'link=true' >>"$GITHUB_OUTPUT"; fi
    - name: Prepare native Linux coordinator
      if: steps.needs.outputs.link == 'true'
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records"
        uname -a | tee "$RUNNER_TEMP/records/host-kernel"
        test -c /dev/kvm && sudo test -r /dev/kvm && sudo test -w /dev/kvm
        git rev-parse HEAD > "$RUNNER_TEMP/records/source"
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      if: steps.needs.outputs.link == 'true'
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Start the existing GNU Bazel coordinator
      if: steps.needs.outputs.link == 'true'
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        docker run --device=/dev/kvm -d --name overlay-guest --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
    - name: Recover only the omitted original linker stderr
      if: steps.needs.outputs.link == 'true'
      run: |
        out="$RUNNER_TEMP/records"
        rc=0
        docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" build --config=x86_64 -c opt --jobs=28 --remote_download_outputs=toplevel //test/syscalls/linux:vfio_pci_device_test > "$RUNNER_TEMP/raw.log" 2>&1 || rc=$?
        echo "$rc" >"$out/original-link-exit"
        grep -E 'INFO: Invocation ID:|^ERROR:|^ld\.lld:|^/[^ ]*ld:|undefined (reference|symbol)|^>>>|cannot find|cannot open|^clang\+\+:|Linking.*failed' "$RUNNER_TEMP/raw.log" | head -80 > "$out/original-link-stderr"
        cat "$out/original-link-stderr"
        test -s "$out/original-link-stderr"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: private-vfio-original-diagnostics
        path: ${{ runner.temp }}/records
        if-no-files-found: error
