name: Read original package outputs from the scratch worker
on:
  push:
    branches: [qualification/package-empty-worker]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 5}
      - name: Read the two original execution receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tamird/gvisor/actions/artifacts/13055412963/zip > "$RUNNER_TEMP/controls.zip"
          gh api repos/tamird/gvisor/actions/artifacts/13055989540/zip > "$RUNNER_TEMP/product.zip"
      - name: Compare the stored native ELF, Go offsets and raw mapped bytes
        env:
          BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 test/rbe/empty_worker/replay.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-package-receipt
          path: ${{ runner.temp }}/replay
          if-no-files-found: error
