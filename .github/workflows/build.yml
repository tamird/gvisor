name: Compare TCP_INFO reordering on Linux, stock and corrected gVisor
on:
  push:
    branches: [qualification/rack-reorder-syscall]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/rack-reorder-syscall'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 8
        persist-credentials: false
    - name: Measure matched ACKs on native Linux, stock and corrected gVisor
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        source=e4a95958ac2291b1158a0cb3b768573fabd803db
        test "$(git rev-parse HEAD^)" = "$source"
        test "$(git rev-parse "$source^")" = "aa5305e99cc2501aede44cac257338d954e7d7dc"
        git diff --quiet "$source^" "$source" -- . ':(exclude)test/packetimpact/tests/tcp_rack_test.go'
        fixed=0b8bc0a93e21a6f364bfef5f49ea22a8d2c914ae
        test "$(git rev-parse HEAD^2)" = "$fixed"
        git diff --quiet "$source" "$fixed" -- test/packetimpact/tests
        cp test/rbe/rack_reorder_wire_report.py "$RUNNER_TEMP/report.py"
        mkdir -p "$RUNNER_TEMP/fifo_platform" "$RUNNER_TEMP/fifo"
        platform=$RUNNER_TEMP/fifo_platform
        printf '%s\n' 'module(name="fifo_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/fifo.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=linux-sandbox' 'build --strategy=TestRunner=local' 'build --jobs=4' \
            'build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' \
            'build --remote_accept_cached' \
            "build --inject_repository=fifo_platform=$platform" \
            'build --host_platform=@fifo_platform//:ubuntu' \
            'build --extra_execution_platforms=@fifo_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        export FIFO_RC=$rc
        if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        test -x /sbin/iptables-nft
        test -x /sbin/ip6tables-nft
        test -x /usr/bin/x86_64-linux-gnu-gcc
        mkdir -p "$RUNNER_TEMP/replay-public"
        printf '%s\n' '{"status":"INCOMPLETE","phase":"compiler installation"}' > "$RUNNER_TEMP/replay-public/preflight.json"
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu tcpdump
        export FENCE_HOST_ID=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT FENCE_HOST_PROBE=$RUNNER_TEMP/host-marker
        export XTABLES_LOCKFILE=$RUNNER_TEMP/fence-xtables.lock
        touch "$XTABLES_LOCKFILE"
        printf '%s' "$FENCE_HOST_ID" > "$FENCE_HOST_PROBE"
        probe_raw=$RUNNER_TEMP/host-probe.jsonl
        printf '%s\n' '{"status":"INCOMPLETE","phase":"Bazel host compiler/namespace test"}' > "$RUNNER_TEMP/replay-public/preflight.json"
        bazelisk --bazelrc="$rc" test --nocache_test_results --test_output=all --strategy=TestRunner=local \
          --test_env=FENCE_HOST_ID --test_env=FENCE_HOST_PROBE --test_env=XTABLES_LOCKFILE --build_event_json_file="$probe_raw" \
          //test/rbe/fence_host_probe:check
        python3 - "$probe_raw" "$RUNNER_TEMP/replay-public/preflight.json" <<'PYCHECK'
        import json, sys
        from pathlib import Path
        events = [json.loads(row) for row in Path(sys.argv[1]).read_text().splitlines()]
        results = [e["testResult"] for e in events if "testResult" in e]
        assert len(results) == 1, results
        result = results[0]
        assert result["status"] == "PASSED" and not result.get("cachedLocally"), result
        assert result["executionInfo"]["strategy"] in ("local", "standalone"), result["executionInfo"]
        assert not result["executionInfo"].get("cachedRemotely"), result["executionInfo"]
        Path(sys.argv[2]).write_text(json.dumps({"status":"PASS","target":"//test/rbe/fence_host_probe:check","execution":result["executionInfo"],"hostMarker":True,"writableDAD":True,"crossCompilers":["x86_64","aarch64"]})+"\n")
        print("Both compilers, namespace sysctl, real host marker and uncached local TestRunner verified")
        PYCHECK
        out="$RUNNER_TEMP/replay-public"
        uname -r > "$out/kernel"
        cat /proc/sys/net/ipv4/tcp_recovery > "$out/linux-tcp-recovery"
        git checkout --quiet --detach "$source"
        for arm in linux stock fixed; do
          tested=$source
          if [[ $arm = fixed ]]; then tested=$fixed; git checkout --quiet --detach "$fixed"; fi
          if [[ $arm = linux ]]; then label=tcp_rack_native_test; else label=tcp_rack_netstack_test; fi
          d="$out/$arm"
          mkdir -p "$d"
          date -u --iso-8601=ns > "$d/started"
          code=0
          bazelisk --bazelrc="$rc" test --config=x86_64 --strategy=TestRunner=local --spawn_strategy=linux-sandbox \
            --jobs=4 --test_env=GO_TEST_WRAP_TESTV=1 --test_env=GVISOR_TEST_CLOCK_SOURCE=calibrated --test_env=XTABLES_LOCKFILE \
            --define=gvisor_test_clock_source=calibrated --strip=never --test_sharding_strategy=disabled \
            --nocache_test_results --test_output=all --test_filter=TestRACKReorderACKBoundary --test_timeout=300 \
            "--build_event_json_file=$d/bep.jsonl" --build_event_json_file_path_conversion=false \
            "//test/packetimpact/tests:$label" > "$RUNNER_TEMP/$arm.log" 2>&1 || code=$?
          echo "$code" > "$d/exit"
          date -u --iso-8601=ns > "$d/ended"
          root="bazel-testlogs/test/packetimpact/tests/$label"
          python3 "$RUNNER_TEMP/report.py" "$arm" "$tested" "$root" "$out"
          sed -nE '/^(ERROR|FATAL)|tcpi_reord_seen=|^--- (FAIL|PASS): TestRACKReorderACKBoundary/p' "$RUNNER_TEMP/$arm.log" | tail -18 > "$d/diagnostic"
          rm -f "$d/bep.jsonl"
        done
        python3 - "$out" <<'PYRESULT'
        import json,sys
        from pathlib import Path
        root=Path(sys.argv[1])
        rows={arm:json.loads((root/arm/"result.json").read_text()) for arm in ("linux","stock","fixed")}
        if all(row.get("observed") for row in rows.values()):
            counters={arm:[v["reord_seen"] for v in row["observations"]] for arm,row in rows.items()}
            qualifies=(counters["linux"][:2]==[0,0] and counters["linux"][2]>0 and counters["stock"][0]>0 and counters["stock"][1]==0 and counters["stock"][2]>0 and rows["linux"]["exit"]==0 and rows["stock"]["exit"]!=0 and rows["linux"]["subtests"]=={"one_ack":"PASS","two_acks":"PASS"} and rows["stock"]["subtests"]=={"one_ack":"FAIL","two_acks":"PASS"} and all(v["total_retrans"]==0 for v in rows["linux"]["observations"]))
            fixed=(counters["fixed"][:2]==[0,0] and counters["fixed"][2]>0 and rows["fixed"]["exit"]==0 and rows["fixed"]["subtests"]=={"one_ack":"PASS","two_acks":"PASS"})
            outcome=("REPRODUCED_AND_FIXED" if fixed else "REPRODUCED_FIX_FAILED") if qualifies else "NOT_REPRODUCED"
        else:
            counters={};outcome="INCOMPLETE"
        result={"outcome":outcome,"reord_seen_one_then_two_acks":counters,"sources":{arm:row["source"] for arm,row in rows.items()}}
        (root/"summary.json").write_text(json.dumps(result,indent=2)+"\n")
        print(result)
        raise SystemExit(outcome=="INCOMPLETE")
        PYRESULT
    - name: Save the observed kernel, syscall counters and verified wire ranges
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rack-reorder-syscall
        path: ${{ runner.temp }}/replay-public
        if-no-files-found: error
