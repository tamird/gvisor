name: Qualify the Go source archive
"on":
  push:
    branches:
      - "research/go-archive-architecture"
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Verify architecture selection
      run: |
        set -euo pipefail
        sources() {
          bazel cquery "filter('sighandler_go_arch$', deps($1))" --output=files "$2"
        }
        sources //:release --platforms=//tools/bazeldefs:linux_amd64 > "$RUNNER_TEMP/amd64-files"
        sources //:release --platforms=//tools/bazeldefs:linux_arm64 > "$RUNNER_TEMP/arm64-files"
        sources //:gopath --platforms=//tools/bazeldefs:linux_amd64 > "$RUNNER_TEMP/export-files"
        for key in amd64 arm64 export; do
          printf '%s\n' "$key"
          cat "$RUNNER_TEMP/$key-files"
        done
        grep -q 'sighandler_amd64.go$' "$RUNNER_TEMP/amd64-files"
        ! grep -q 'sighandler_arm64.go$' "$RUNNER_TEMP/amd64-files" || exit 1
        grep -q 'sighandler_arm64.go$' "$RUNNER_TEMP/arm64-files"
        ! grep -q 'sighandler_amd64.go$' "$RUNNER_TEMP/arm64-files" || exit 1
        grep -q 'sighandler_amd64.go$' "$RUNNER_TEMP/export-files"
        grep -q 'sighandler_arm64.go$' "$RUNNER_TEMP/export-files"
        bazel cquery //:gopath --output=files
    - name: Build the Go source archive
      run: make build BAZEL_OPTIONS="" TARGETS="//:gopath"
    - name: Compare generated source and embedded objects with the published Go branch
      run: |
        python3 - <<'PYTHON'
        import hashlib, json, zipfile
        from pathlib import Path
        expected = {
          "pkg/goid/goid_asm_impl_amd64.s": "108787144173e6f18dd204e9c7c4746ccc674f3c",
          "pkg/goid/goid_asm_impl_arm64.s": "9bd8bed6580f36a02f04268dac13233c5c4817c9",
          "pkg/hosttid/hosttid_asm_impl_amd64.s": "fc1720ce1651f22670cb1eb3715969472310a488",
          "pkg/hosttid/hosttid_asm_impl_arm64.s": "59e8aadb83e03ac6cfe8b8a6d0f073f76f73a446",
          "pkg/sentry/loader/vdsodata/vdso_amd64.so": "deb34e5d48793b9da267304342a17da932e5c08e",
          "pkg/sentry/loader/vdsodata/vdso_arm64.so": "19a252784c3dd891a794a40d70902da609bf854d",
          "pkg/sentry/platform/systrap/sysmsg/sighandler.built-in.amd64.bin": "c042afb967af6fcf0c11f53ae480ab4ce16a8c47",
          "pkg/sentry/platform/systrap/sysmsg/sighandler.built-in.arm64.bin": "e690de5befd3828f5c8910d5110ef01fd59f10a5",
          "pkg/sentry/platform/systrap/sysmsg/sighandler_amd64.go": "b86b9437765ff93214fa1471342ec26b393fe132",
          "pkg/sentry/platform/systrap/sysmsg/sighandler_arm64.go": "f98cb451050658b9fd66f83acb590a007dae5fef",
          "pkg/sync/runtime_spinning_asm_impl_amd64.s": "6daa250e6875a46ecd7834a1c0c3946de38d8a3b",
          "pkg/sync/runtime_spinning_asm_impl_arm64.s": "c04da8ac063aeb8f70365cb7476a0dc9890700f0"
        }
        archive = Path("bazel-bin/gopath.zip")
        with zipfile.ZipFile(archive) as z:
            for file, want in expected.items():
                contents = z.read("src/gvisor.dev/gvisor/" + file)
                got = hashlib.sha1(b"blob " + str(len(contents)).encode() + b"\0" + contents).hexdigest()
                print(file, got, want, flush=True)
                if got != want:
                    raise SystemExit(f"{file}: differs from the published Go export")
        print("All 12 generated files match the upstream Go export.", flush=True)
        PYTHON
