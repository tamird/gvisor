name: Run version and non-root statefile tests from the canonical mixed step
on:
  push:
    branches: [qualification/current-mixed-version-permissions]
permissions: {contents: read}
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 82
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind the four-owner control and the pinned client
        run: |
          set -eu
          work="$RUNNER_TEMP/mixed-native"
          mkdir -p "$work/output"
          test "$(git rev-parse HEAD^)" = 2e72c3051b3d7a13761f90961f4e94b8cccc8b11
          test "$(git rev-parse HEAD^^)" = 3d33ffbfa76d80373f4f90b34710f4121e64a0cf
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/mixed_cpu/check.py' ':!.github/qualification/mixed_cpu/exec_cas.py'
          cp .github/qualification/mixed_cpu/{check,exec_cas}.py "$work/"
          git checkout -q --detach HEAD^
          test "$(uname -m)" = x86_64
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$work/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $work/bazel" | sha256sum -c -
          chmod 755 "$work/bazel"
          curl --proto '=https' --proto-redir '=https' -fsSL --max-time 120 https://github.com/buildkite/agent/releases/download/v4.10.1/buildkite-agent-linux-amd64-4.10.1.tar.gz -o "$work/agent.tar.gz"
          echo "f7ecf75a3be41a786f25e9cdbff332dc49b7f18ef63a1fd73bf77056fd4d7fe0  $work/agent.tar.gz" | sha256sum -c -
          python3 -IB - <<'PY'
          import os, pathlib, tarfile
          w = pathlib.Path(os.environ["RUNNER_TEMP"], "mixed-native")
          with tarfile.open(w/"agent.tar.gz") as archive:
              agent, = [m for m in archive if m.isfile() and pathlib.PurePosixPath(m.name).name=="buildkite-agent"]
              (w/"agent").write_bytes(archive.extractfile(agent).read())
          PY
          chmod 755 "$work/agent"
          BUILDKITE_AGENT_ENDPOINT=http://127.0.0.1:1 "$work/agent" pipeline upload --dry-run --format json --agent-access-token unused-token .buildkite/pipeline.yaml > "$work/pipeline.json"
      - name: Check the actual configured selection without executing actions
        id: graph
        timeout-minutes: 25
        run: |
          work="$RUNNER_TEMP/mixed-native"
          python3 -EsB "$work/check.py" analyze
          python3 -IB -c 'import json,sys; assert json.load(open(sys.argv[1]))["eligible"]' "$work/output/selection.json"
      - name: Run the single four-owner command on the two remote architectures
        timeout-minutes: 45
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          : "${BUILDBUDDY_API_KEY:?missing fork key}"
          work="$RUNNER_TEMP/mixed-native"
          rc="$work/remote.rc"
          trap 'rm -f "$rc"' EXIT
          cat > "$rc" <<'RC'
          build:source-presubmit-mixed --remote_executor=grpcs://remote.buildbuddy.io
          build:source-presubmit-mixed --remote_cache=grpcs://remote.buildbuddy.io
          build:source-presubmit-mixed --bes_backend=grpcs://remote.buildbuddy.io
          build:source-presubmit-mixed --bes_results_url=https://app.buildbuddy.io/invocation/
          RC
          printf 'build:source-presubmit-mixed --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          unset BUILDBUDDY_API_KEY
          python3 -EsB "$work/check.py" execute
      - name: Bind the actual public tests, cases and binary identities
        if: always() && !cancelled()
        run: |
          work="$RUNNER_TEMP/mixed-native"
          test ! -e "$work/remote.rc"
          python3 -EsB "$work/check.py" collect
      - name: Read the four original TestRunner actions for this invocation
        if: always() && !cancelled() && steps.graph.outcome == 'success'
        timeout-minutes: 4
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -EsB "$RUNNER_TEMP/mixed-native/check.py" service
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: current-mixed-version-permissions
          path: ${{ runner.temp }}/mixed-native/output/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Check the original physical and case evidence
        if: always() && !cancelled()
        run: |
          python3 -IB -c 'import json,sys; assert json.load(open(sys.argv[1]))["verified"]' "$RUNNER_TEMP/mixed-native/output/workers.json"
