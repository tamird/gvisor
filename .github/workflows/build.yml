name: Inventory both native architectures of the original Go presubmit tests
on:
  push:
    branches: [qualification/mixed-native-go-action-inventory]
permissions: {contents: read}
jobs:
  query:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 4, persist-credentials: false}
      - name: Bind the Go default, original owner list and Bazel version
        run: |
          set -eu
          work="$RUNNER_TEMP/mixed-go-graph"
          mkdir -p "$work"
          test "$(git rev-parse HEAD^)" = 4762045567775f1d258cc0c8cbe167e46e1b1a19
          test "$(git rev-parse HEAD~3)" = 35aa6228edcf1eb2bc07d6aa877b4317da27d68a
          test "$(git diff --name-only HEAD~3 HEAD^)" = tools/bazeldefs/go.bzl
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/mixed_go_graph.py' ':!.github/qualification/mixed-native-owners.txt'
          cp .github/qualification/mixed_go_graph.py "$work/"
          cp .github/qualification/mixed-native-owners.txt "$work/owners.txt"
          git checkout -q --detach HEAD^
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$work/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $work/bazel" | sha256sum -c -
          chmod 755 "$work/bazel"
      - name: Query the original Go owners and analyze their native test shards
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -IB "$RUNNER_TEMP/mixed-go-graph/mixed_go_graph.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: dual-architecture-go-test-graph
          path: ${{ runner.temp }}/mixed-go-graph/receipt.json
          if-no-files-found: error
          retention-days: 14
