name: Compare the source-presubmit unit graph
on:
  push:
    branches: [qualification/source-unit-cgroup-v2-selection]
permissions:
  contents: read
jobs:
  selection:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare the upstream Make selection with the remote target graph
        run: |
          set -eu
          cp .github/qualification/source_unit_selection.py "$RUNNER_TEMP/"
          git fetch --quiet --depth=1 origin 6b3fe9ab6c03facafe6340c85f8d60ca3591566b 9fd10bc0c7a6d2ccc8641491b3539f3cc867943e
          git fetch --quiet --depth=1 https://github.com/google/gvisor.git f51a205a8f4afbc5ab41aded070df74951b081ea
          git show '6b3fe9ab6:test/rbe/unit_matrix.py' > "$RUNNER_TEMP/unit_matrix.py"
          echo "0ddcc589b2ba3e6027b08b88055c5dea533c2e0d376ceb7bac4c6a4768696f03  $RUNNER_TEMP/unit_matrix.py" | sha256sum --check
          python3 "$RUNNER_TEMP/source_unit_selection.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: source-unit-selection
          path: |
            ${{ runner.temp }}/source-unit-selection/*.json
            ${{ runner.temp }}/source-unit-selection/*-selection.jsonl.gz
          if-no-files-found: error
