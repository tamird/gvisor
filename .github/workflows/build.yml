name: Measure indexed graph Save segment boundaries
on:
  push:
    branches: [qualification/graph-save-segment-ends]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      FIXTURE_BLOB: cc73b4c3c452a38f175e7c11753aa85e83f7b7ba
      PAIR_DIR: small
      FULL_FIXED: d1ec4193fa7f0dfec50865c55601c3897f6f0e12
      FULL_STOCK: d280d49cf180e6443fdba49d57260c3bfd471ff5
      CURRENT: ${{ github.sha }}
      BASE: aa767e4c43d011121271551fe24da501a56f729d
      PRODUCT: 19a47a62fbb6bb2ac915938b393a4665f5c93a18
      STOCK: 158dd52e543e845fe6de6d5fa81a2b07be0141ea
      FIXED: 23c077f3707a0e482188fca7ab50a0afddac9c68
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 6, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD)" == "$CURRENT" ]]
        test "$(git rev-parse HEAD^2)" = "$FIXED"
        test "$(git rev-parse HEAD^1)" = "$FULL_FIXED"
        test "$(git rev-parse HEAD^1^2)" = "$FULL_STOCK"
        test "$(git rev-parse HEAD^2^2)" = "$STOCK"
        test "$(git rev-parse HEAD~2)" = "$PRODUCT"
        test "$(git rev-parse HEAD~3)" = "$BASE"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /var/run/docker.sock:/var/run/docker.sock -v "$(command -v docker):/usr/local/bin/docker:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Preserve both existing benchmark drivers outside the selected source trees
      run: |
        set -euo pipefail
        for phase in small full; do
          mkdir -p "$RUNNER_TEMP/$phase/records"
          for mode in run bench; do
            cp "test/rbe/tmpfs_profile/$phase-$mode.py" "$RUNNER_TEMP/$phase/pair-$mode.py"
          done
        done
        cp test/rbe/tmpfs_profile/gate.py "$RUNNER_TEMP/gate.py"
    - name: Build the two matched small and sparse benchmark binaries
      run: python3 "$RUNNER_TEMP/small/pair-run.py" prepare
    - name: Compare nine cold and warm graph shapes
      run: python3 "$RUNNER_TEMP/small/pair-run.py" benchmark
    - name: Compare the complete small and sparse samples with pinned benchstat
      run: python3 "$RUNNER_TEMP/small/pair-run.py" stats
    - name: Check the small and sparse regression gate
      id: gate
      run: python3 "$RUNNER_TEMP/gate.py"
    - name: Verify the splice, prune, alias and round-trip cases
      if: steps.gate.outputs.open == 'true'
      env: {PAIR_DIR: full, STOCK: "${{ env.FULL_STOCK }}", FIXED: "${{ env.FULL_FIXED }}"}
      run: python3 "$RUNNER_TEMP/full/pair-run.py" positive
    - name: Build both original checkpointfile benchmarks
      if: steps.gate.outputs.open == 'true'
      env: {PAIR_DIR: full, STOCK: "${{ env.FULL_STOCK }}", FIXED: "${{ env.FULL_FIXED }}"}
      run: python3 "$RUNNER_TEMP/full/pair-run.py" prepare
    - name: Save and restore the revised native systrap kernel and verify every file
      if: steps.gate.outputs.open == 'true'
      env: {PAIR_DIR: full, STOCK: "${{ env.FULL_STOCK }}", FIXED: "${{ env.FULL_FIXED }}"}
      run: python3 "$RUNNER_TEMP/full/pair-run.py" native
    - name: Compare sixteen pairs of kernel saves on the frozen file
      if: steps.gate.outputs.open == 'true'
      env: {PAIR_DIR: full, STOCK: "${{ env.FULL_STOCK }}", FIXED: "${{ env.FULL_FIXED }}"}
      run: python3 "$RUNNER_TEMP/full/pair-run.py" benchmark
    - name: Compare kernel Save latency and allocated bytes
      if: steps.gate.outputs.open == 'true'
      env: {PAIR_DIR: full, STOCK: "${{ env.FULL_STOCK }}", FIXED: "${{ env.FULL_FIXED }}"}
      run: python3 "$RUNNER_TEMP/full/pair-run.py" stats
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: ordinal-graph-save
        path: |
          ${{ runner.temp }}/small/records/
          ${{ runner.temp }}/full/records/
        if-no-files-found: error
