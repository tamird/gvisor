name: Verify the final subcontainer restore on a tmpfs test directory
on:
  push:
    branches: [qualification/gc-resize-restore-fix]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      SOURCE: 18b3427c1dddf063b951584e8504b66d387d7c80
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD^)" == b1b2781a8d320d5f9fede439f142e5340c265b32 ]]
        [[ "$(git rev-parse HEAD~2)" == "$SOURCE" ]]
        [[ "$(git rev-parse HEAD~3)" == 9d3e6518a0a467c6575390cb6a61ff134024d243 ]]
        git rev-parse HEAD > "$RUNNER_TEMP/records/fixture-source"
        git rev-parse HEAD~2 > "$RUNNER_TEMP/records/product-source"
        sha256sum runsc/container/container_save_restore_test.go pkg/sentry/state/state.go > "$RUNNER_TEMP/records/fixture-hashes"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
    - name: Run just the existing three-container restore on tmpfs
      run: |
        set -euo pipefail
        out=$RUNNER_TEMP/records
        tmp=$RUNNER_TEMP/multi-test-tmp
        docker exec tcp-compiler mkdir -p "$tmp"
        docker exec tcp-compiler mount -t tmpfs -o size=1g tmpfs "$tmp"
        docker exec tcp-compiler stat -f -c %T "$tmp" > "$out/test-tmp-filesystem"
        [[ $(cat "$out/test-tmp-filesystem") == tmpfs ]]
        date -u +%FT%TZ > "$out/start"; rc=0
        docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=32 --spawn_strategy=remote,local --strategy=TestRunner=local --test_sharding_strategy=disabled --nocache_test_results --nozip_undeclared_test_outputs --test_tmpdir="$tmp" --test_timeout=900 --test_arg=-test.v --test_arg=-test.run='^TestMultiContainerCheckpointRestore$/^systrap$/^none$' --test_output=all //runsc/container:container_test > "$RUNNER_TEMP/multi-build.log" 2>&1 || rc=$?
        echo "$rc" > "$out/bazel-exit"; date -u +%FT%TZ > "$out/end"
        grep -A4 -E 'Invocation ID:|ERROR:|error:|failed|FAIL|SKIP' "$RUNNER_TEMP/multi-build.log" | tail -120 > "$out/build-diagnostics" || true
        for f in test.log test.xml; do
          docker exec tcp-compiler cat "bazel-testlogs/runsc/container/container_test/$f" > "$out/$f" || true
        done
        docker exec tcp-compiler bash -c 'shopt -s nullglob; for f in bazel-testlogs/runsc/container/container_test/test.outputs/*.txt; do echo "--- ${f##*/}"; grep -n -E "GCRESIZE soft=|RestoreSubcontainer|failed to validate|panic:" "$f" || true; done' > "$out/sentry-results" || true

    - name: Verify the native three-container restore and selected directory
      if: always()
      run: |
        python3 - "$RUNNER_TEMP/records" <<'PYTHON'
        import json, re, sys
        from pathlib import Path
        out = Path(sys.argv[1])
        def read(name):
            p = out / name
            return p.read_text(errors="replace").strip() if p.is_file() else ""
        case = "TestMultiContainerCheckpointRestore/systrap/none"
        log = read("test.log")
        errors = []
        if read("test-tmp-filesystem") != "tmpfs": errors.append("TEST_TMPDIR filesystem was not tmpfs")
        if "/multi-test-tmp/" not in log: errors.append("test did not use selected test directory")
        if read("bazel-exit") != "0" or not re.search(r"--- PASS: " + case + r"(?:\s|$)", log):
            errors.append("native three-container restore did not pass")
        checks = re.findall(r"GCRESIZE soft=(\d+) startup=(\d+) saved=(\d+) handle=(true|false)", read("sentry-results"))
        if len(checks) != 2: errors.append(f"expected two actual restore observations, found {len(checks)}")
        result = {"product": read("product-source"), "fixture_source":read("fixture-source"), "case":case,
                  "observations":checks, "test_tmpdir":read("test-tmp-filesystem"), "bazel_exit":read("bazel-exit"), "errors":errors,
                  "start":read("start"), "end":read("end"), "previous_result":"https://github.com/tamird/gvisor/actions/runs/41152797282/artifacts/13023434512"}
        out.joinpath("verdict.json").write_text(json.dumps(result, indent=2)+"\n")
        print(json.dumps(result)); sys.exit(bool(errors))
        PYTHON
    - name: Exclude credentials from the evidence bundle
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key=os.environ["BB_KEY"].encode()
        for f in (Path(os.environ["RUNNER_TEMP"])/"records").rglob("*"):
            if f.is_file() and key and key in (data:=f.read_bytes()):
                f.write_bytes(data.replace(key,b"[REDACTED]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: gc-resize-restore-multi-tmpfs
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
