name: Build the complete ARM64 source defaults on RBE
on:
  push:
    branches: [qualification/arm64-source-defaults-rbe]
permissions: {}
jobs:
  build:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Bind the reviewed source and actual full ARM64 graph oracle
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/arm64-source-build"
          mkdir -p "$w"/{src,out}
          cd "$w/src"
          git init -q
          git -c gc.auto=0 fetch -q --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          product=efaf79761adcb3e5ac2b6e5fc96249ac85d435b1
          test "$(git rev-parse "$GITHUB_SHA^")" = "$product"
          test "$(git rev-parse "$product^")" = f6d6788e84731673a155c9fff6f28b8624e34c50
          test "$(git rev-parse "$product^{tree}")" = a90bb1fa21b7b7ef1d0b80cde1604b60404d9a70
          git diff --exit-code "$product^" "$product" -- . ':!.buildkite/pipeline.yaml'
          git diff --exit-code "$product" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!.github/qualification/arm64_source_build'
          for f in observe.py expected.json.gz; do
            git show "$GITHUB_SHA:.github/qualification/arm64_source_build/$f" > "$w/$f"
          done
          git checkout -q --detach "$product"
          test "$(cat .bazelversion)" = 9.3.1
          cd "$w"
          curl -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel
          sha256sum -c <<'SUMS'
          7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel
          2a967704e93722c2a5713f0a34bfd82379a183e1d69e370e217e1d23ea352068  expected.json.gz
          SUMS
          chmod 755 bazel
      - name: Resolve all 3246 public roots before installing the private RBE configuration
        id: graph
        timeout-minutes: 23
        run: |
          set -eu
          w="$RUNNER_TEMP/arm64-source-build"
          cd "$w/src"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$w/observe.py" preflight
      - name: Build the selected ARM64 source defaults using the established remote cache
        id: submit
        timeout-minutes: 53
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          : "${BUILDBUDDY_API_KEY:?missing fork credential}"
          w="$RUNNER_TEMP/arm64-source-build"
          rc="$w/remote.bazelrc"
          trap 'rm -f "$rc"' EXIT
          cat > "$rc" <<'RC'
          build:source-presubmit-arm64 --remote_executor=grpcs://remote.buildbuddy.io
          build:source-presubmit-arm64 --remote_cache=grpcs://remote.buildbuddy.io
          build:source-presubmit-arm64 --bes_backend=grpcs://remote.buildbuddy.io
          build:source-presubmit-arm64 --bes_results_url=https://app.buildbuddy.io/invocation/
          RC
          printf 'build:source-presubmit-arm64 --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          unset BUILDBUDDY_API_KEY
          cd "$w/src"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$w/observe.py" submit
      - name: Read original terminal events and downloaded ELF and archive bytes
        if: always() && !cancelled() && steps.graph.outcome == 'success' && steps.submit.outcome != 'skipped'
        run: |
          set -eu
          w="$RUNNER_TEMP/arm64-source-build"
          test ! -e "$w/remote.bazelrc"
          trap 'rm -f "$w/physical.bep" "$w/physical.log"' EXIT
          cd "$w/src"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$w/observe.py" collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: physical-arm64-source-defaults
          path: |
            ${{ runner.temp }}/arm64-source-build/out/preflight.json
            ${{ runner.temp }}/arm64-source-build/out/run.json
            ${{ runner.temp }}/arm64-source-build/out/receipt.json
            ${{ runner.temp }}/arm64-source-build/out/owners.json.gz
          if-no-files-found: error
          retention-days: 14
