name: Qualify configured clang-tidy actions for both Linux targets
on:
  push:
    branches: [qualification/clang-tidy-stub-headers-final]
permissions:
  contents: read
jobs:
  lint-cc:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Bind integrated source and the scoped RBE client
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD^)" = ccb956b31268a0d9cda723bac9abacaf2008d03a
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/clang_tidy_full.py'
          test -n "$BUILDBUDDY_API_KEY"
          out="$RUNNER_TEMP/clang-tidy-arches"
          mkdir -p "$out/bin"
          echo '{"status":"SETUP"}' > "$out/result.json"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --noremote_local_fallback' 'build --noannounce_rc'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$out/connection.rc"
          curl --silent --show-error --fail --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$out/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $out/bazel" | sha256sum -c -
          chmod 755 "$out/bazel"
          printf '%s\n' '#!/bin/sh' 'exec "$RUNNER_TEMP/clang-tidy-arches/bazel" --bazelrc="$RUNNER_TEMP/clang-tidy-arches/connection.rc" --bazelrc="$RUNNER_TEMP/clang-tidy-arches/selection.rc" "$@"' > "$out/bin/bazel"
          chmod 755 "$out/bin/bazel"
      - name: Run the full source lint entry for AMD64 and ARM64
        run: python3 -B .github/qualification/clang_tidy_full.py
      - name: Build the independent C patch with both supported Ubuntu GNU toolchains
        if: always() && !cancelled()
        run: |
          set -eu
          out="$RUNNER_TEMP/clang-tidy-arches"
          git fetch --depth=1 origin c1bfd318b1b25dd5a59ed8422583076cb281e943
          git switch --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = c1bfd318b1b25dd5a59ed8422583076cb281e943
          tag=$(cd images && find default -type f | sort -f -d | xargs -n 1 sha256sum | sha256sum - | cut -c 1-16)
          test "$tag" = 5d12c16f9c4ad806
          image=us-central1-docker.pkg.dev/gvisor-presubmit/gvisor-presubmit-images/default_x86_64@sha256:2e57d91fbce58ed6f9653aa4f976b78ea388305da7cdfb41d1eea1a594e81606
          docker pull "$image"
          uid=$(id -u)
          gid=$(id -g)
          mkdir -p "$out/gnu"
          docker run --name signal-stub-builder --entrypoint /bin/bash "$image" -euc '
            getent group "$2" >/dev/null || groupadd --gid "$2" ci-build
            getent passwd "$1" >/dev/null || useradd -l --uid "$1" --gid "$2" --no-create-home -d /home/build ci-build
          ' -- "$uid" "$gid"
          image=$(docker commit signal-stub-builder)
          docker rm signal-stub-builder
          docker run --rm --user "$uid:$gid" --env HOME=/home/build --volume "$PWD:/workspace" --volume "$out/gnu:/home/build" --workdir /workspace --entrypoint /bin/bash "$image" -euc '
            for cpu in x86_64 aarch64; do
              log=/home/build/$cpu.log
              if /usr/local/bin/bazel build --config="$cpu" -c opt --lockfile_mode=off //pkg/sentry/platform/systrap/sysmsg:sighandler_object >"$log" 2>&1; then
                cp bazel-bin/pkg/sentry/platform/systrap/sysmsg/sighandler.built-in.bin.o /home/build/$cpu.elf
              fi
            done
          '
          python3 - <<'PYINNER'
          from pathlib import Path
          import os,json,hashlib,subprocess,struct
          w=Path(os.environ["RUNNER_TEMP"])/"clang-tidy-arches"
          path=w/"result.json"
          d=json.loads(path.read_text())
          rows=d["gnu"]={}
          for cpu,arch in (("x86_64",62),("aarch64",183)):
              p=w/"gnu"/(cpu+".elf")
              r=rows[cpu]={"pass":False}
              if p.is_file():
                  b=p.read_bytes()
                  r["machine"]=struct.unpack_from("<H",b,18)[0]
                  r["sha256"]=hashlib.sha256(b).hexdigest()
                  r["memcpy"]=[s for s in subprocess.check_output(["nm",str(p)],text=True).splitlines() if s.endswith(" memcpy")]
                  r["undefined"]=subprocess.check_output(["nm","-u",str(p)],text=True).splitlines()
                  r["pass"]=bool(r["machine"]==arch and r["memcpy"] and not r["undefined"])
              else:
                  log=w/"gnu"/(cpu+".log")
                  r["diagnostics"]=[l.strip()[:350] for l in log.read_text(errors="replace").splitlines() if l.startswith("ERROR:") or ": error:" in l][:12]
          path.write_text(json.dumps(d,indent=2))
          assert all(v["pass"] for v in rows.values())
          PYINNER
      - name: Run the project's clang-format check
        if: always() && !cancelled()
        run: |
          out="$RUNNER_TEMP/clang-tidy-arches"
          if tools/lint.sh clang-format > "$out/clang-format.log" 2>&1; then
            jq '.clang_format="PASS"' "$out/result.json" > "$out/fmt-result.json"
            mv "$out/fmt-result.json" "$out/result.json"
          else
            grep -E 'error:|\.c:[0-9]|\.h:[0-9]|^lint:' "$out/clang-format.log" | head -40 || true
            exit 1
          fi
      - name: Verify bounded public result
        id: validate
        if: always() && !cancelled()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          path = Path(os.environ["RUNNER_TEMP"])/"clang-tidy-arches"/"result.json"
          data = path.read_bytes()
          json.loads(data)
          assert len(data) < 4_000_000
          secret = os.environ.get("BUILDBUDDY_API_KEY", "").encode()
          assert secret and secret not in data
          assert not any(s in data for s in (b"github_pat_", b"ghs_", b"ghp_", b"x-buildbuddy-api-key="))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.validate.outcome == 'success'
        with:
          name: clang-tidy-full-scratch-arches
          path: ${{ runner.temp }}/clang-tidy-arches/result.json
          if-no-files-found: error
