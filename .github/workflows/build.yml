name: Fetch the pinned ARM extras and build the unconfigured runsc owners
on:
  push:
    branches: [qualification/rbe-runsc-arm-fetch]
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Stage the existing pinned coordinator tools and reviewed reader
        run: |
          set -eu
          umask 077
          task="$RUNNER_TEMP/release-rbe"
          mkdir -p "$task/bin" "$task/public" "$task/harness"
          cp test/rbe/release_prewarmer/{BUILD,full.py,qualify.py,image_inventory.py} "$task/harness/"
          cd "$task/harness"
          sha256sum --check <<'SUMS'
          ae1f23a11f3cb747fbec49a34c510c5ab9dcb75d06d94bfd4d9a49d50c629271  BUILD
          d2eab9451f3f3472771e43a31349034dd04cd0481b9be62eabde0aba30232954  full.py
          4bec81089db4b303948a1afff50d7aa7cc753f37f020e38e82613d6ab6631c6c  qualify.py
          a61838c5c848386f2dd0b9abc82cd502ff6031040e94e91f5b2da204ed9e5bfe  image_inventory.py
          SUMS
          curl --location --fail --silent --show-error --proto '=https' --proto-redir '=https' --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-arm64 -o "$task/bin/bazel"
          echo "bb608519a440d45d10304eb684a73a2b6bb7699c5b0e5434361661b25f113a5d  $task/bin/bazel" | sha256sum -c -
          curl --location --fail --silent --show-error --proto '=https' --proto-redir '=https' --max-time 90 https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-arm64 -o "$task/bb"
          echo "32e7c227dcd54baaa98a2d77487860c59507461fdbde52f90307577bf22528fc  $task/bb" | sha256sum -c -
          chmod 755 "$task/bin/bazel" "$task/bb" "$task/harness/full.py"
          echo "$task/bin" >> "$GITHUB_PATH"
          echo "REAL_BAZEL=$task/bin/bazel" >> "$GITHUB_ENV"
          echo 'USE_BAZEL_VERSION=9.3.1' >> "$GITHUB_ENV"
          echo 'PYTHONDONTWRITEBYTECODE=1' >> "$GITHUB_ENV"
      - name: Bind the product and retain only the reviewed platform declarations
        env: {PRODUCT: 21a462deffb0ac1d4d5aa291f2e7b46bcd838d27}
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git rev-parse HEAD^^)" = c43bcb023757ee2a2d31e656ac495a27cb29e3be
          test "$(uname -m)" = aarch64
          git checkout --detach "$PRODUCT"
          mkdir test/rbe/release_prewarmer
          cp "$RUNNER_TEMP/release-rbe/harness/BUILD" test/rbe/release_prewarmer/BUILD
          test "$(git hash-object test/rbe/release_prewarmer/BUILD)" = 0942c3a1b2856d6b31866ec8bb60e280ba38a011
          test -z "$(git diff --name-only HEAD)"
          test "$(cat .bazelversion)" = 9.3.1
          bazel --version | grep -Fx 'bazel 9.3.1'
      - name: Retrieve the original whole-graph owner ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api repos/tamird/gvisor/actions/artifacts/13355668355/zip > "$RUNNER_TEMP/release-rbe/original.zip"
          gh api repos/tamird/gvisor/actions/artifacts/13402650978/zip > "$RUNNER_TEMP/release-rbe/partial.zip"
      - name: Fetch the exact original dependency through Bazel before remote credentials
        id: fetch
        timeout-minutes: 12
        run: python3 "$RUNNER_TEMP/release-rbe/harness/full.py" fetch
      - name: Configure the trusted Bazel client for remote-only execution
        id: remote
        if: steps.fetch.outcome == 'success'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          test -n "$BUILDBUDDY_API_KEY"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --remote_download_regex=^bazel-out/(k8|aarch64)-fastbuild(-[A-Za-z0-9_-]+)?/bin/runsc/(runsc_/runsc|boot/boot_test_/boot_test|fdparking/_linked/runsc-fd-parking|prewarmer/_linked/gvisor-sentry-prewarmer|procumounter/_linked/gvisor-proc-umounter)$'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/release-rbe/private.bazelrc"
          test "$(stat -c %a "$RUNNER_TEMP/release-rbe/private.bazelrc")" = 600
          unset BUILDBUDDY_API_KEY
      - name: Build the 231 mapped runsc owners on native ARM64
        if: always() && !cancelled() && steps.fetch.outcome == 'success' && steps.remote.outcome == 'success'
        timeout-minutes: 38
        run: python3 "$RUNNER_TEMP/release-rbe/harness/full.py" arm64
      - name: Reconcile the ARM-only continuation
        if: always() && !cancelled()
        run: python3 "$RUNNER_TEMP/release-rbe/harness/full.py" verdict
      - name: Stop the client and remove its private configuration
        if: always()
        run: |
          if test -x "$RUNNER_TEMP/release-rbe/bin/bazel"; then
            timeout --signal=INT --kill-after=10 30 "$RUNNER_TEMP/release-rbe/bin/bazel" --nosystem_rc --nohome_rc shutdown >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/release-rbe/private.bazelrc"
      - name: Verify the bounded typed public receipts
        id: privacy
        if: always()
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "release-rbe" / "public"
          allowed = {"arm64.json", "verdict.json", "selection.json", "fetch.json"}
          files = list(root.iterdir())
          key = os.environ["ACCESS"].encode()
          assert key and files
          assert not (root.parent / "private.bazelrc").exists()
          for path in files:
              assert path.name in allowed and path.is_file() and not path.is_symlink()
              assert path.stat().st_size <= 512 * 1024
              raw = path.read_bytes()
              assert isinstance(json.loads(raw), dict)
              assert not any(value in raw for value in (key, b"remote_header", b"bes_header", b"Authorization:", b"X-Amz-Signature", b"Bearer "))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: arm64-runsc-fetch-continuation
          path: ${{ runner.temp }}/release-rbe/public/*.json
          if-no-files-found: error
          retention-days: 14
