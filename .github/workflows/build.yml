name: Check PTY writable wakeups after flush
on:
  push:
    branches: [qualification/pty-flush-writable-notification-v2]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Bind the native Bazel and public dependency inputs
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/pty-tools"
          product=5b2473e2997954bba953f5fb9cd7b7777f0e72b6
          test "$(git rev-parse "$GITHUB_SHA^")" = "$product"
          test "$(git rev-parse "$product^")" = ccf8c9479bad5a0210c33e6e6c93f7829fbb2026
          git diff --exit-code "$product" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!.github/qualify_pty_flush.py'
          mkdir -m 700 "$w"
          mkdir -p "$RUNNER_TEMP/recvbuf/dist"
          cp .github/qualify_pty_flush.py "$w/check.py"
          prep=1dd5c8738089670485a347cfb85dad07b92d0e0d
          assets=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
          inputs=c3569a60dc1836ac6fad05e86d7951866c796b4f
          git fetch --no-tags --depth=1 https://github.com/tamird/gvisor.git "$prep" "$assets" "$inputs"
          git show "$prep:.github/qualification/go_branch_netgofer.py" > "$w/previous.py"
          git show "$assets:.github/qualification/recvbuf_deps.py" > "$w/public_assets.py"
          git show "$inputs:.github/qualification/tldk_public_inputs.py" > "$w/tldk_public_inputs.py"
          test "$(git hash-object "$w/previous.py")" = 0c1db7071558c5f9c8de45b60ba625183bd8a400
          test "$(git hash-object "$w/public_assets.py")" = 9a3f571087a1438113a3a067c300e26fcb0ca9e8
          test "$(git hash-object "$w/tldk_public_inputs.py")" = 1f3f7d4d75810ad60941772776e01f3b71b3b171
          curl -qfsSL --retry 2 --max-time 120 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $w/bazel" | sha256sum -c -
          chmod +x "$w/bazel"
          unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo
      - name: Exercise the flush test on native Linux and systrap
        run: |
          env -i HOME="$HOME" USER="$USER" PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" \
            python3 -B "$RUNNER_TEMP/pty-tools/check.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pty-flush-wakeups
          path: ${{ runner.temp }}/pty-flush
          retention-days: 14
          if-no-files-found: error
