name: Check the external DPDK toolchain and linked plugin
on:
  push:
    branches: [qualification/plugin-bazel9-rebase]
permissions:
  contents: read
jobs:
  plugin:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      PRODUCT: 93993d354e440e71b7e6efaacd72be40e542de57
      PREVIOUS: c7c5dce62b1e19f4bfe3f6231e368fa9219b2986
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 3, persist-credentials: false}
    - name: Bind source and check the main and external packages
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        umask 077
        cd "$GITHUB_WORKSPACE"
        test "$(git rev-parse HEAD^)" = "$PRODUCT"
        mkdir -p "$RUNNER_TEMP/proof" "$RUNNER_TEMP/gnu"
        printf '{"verdict":"INCOMPLETE","source":"%s"}\n' "$PRODUCT" > "$RUNNER_TEMP/proof/verdict.json"
        profile=0ee70efe6d52576b8f173b40ad6b7ac117da3b72
        reporter=599cb05aecfb107e07f81b8591a009cb12d6ffa7
        git fetch -q --no-tags --depth=1 origin "$PREVIOUS" "$profile" "$reporter"
        git checkout --quiet --detach "$PRODUCT"
        test "$(git rev-parse "$PRODUCT^")" = 183a39d1b2aff9e8e2219171940001749a2b5db0
        git diff --exit-code "$PREVIOUS" "$PRODUCT" -- external/tools/plugin-stack pkg/sentry/socket/plugin/cgo/BUILD
        test "$(cat .bazelversion)" = 9.3.1
        curl --fail --silent --show-error --location --proto '=https' --retry 3 --output "$RUNNER_TEMP/bazel-9.3.1" https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64
        echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $RUNNER_TEMP/bazel-9.3.1" | sha256sum --check --status
        chmod 0555 "$RUNNER_TEMP/bazel-9.3.1"
        for f in BUILD.bazel MODULE.bazel; do git show "$profile:test/rbe/gnu_platform/$f" > "$RUNNER_TEMP/gnu/$f"; done
        for f in qualification_report unit_matrix; do git show "$reporter:test/rbe/$f.py" > "$RUNNER_TEMP/$f.py"; done
        test -n "$BUILDBUDDY_API_KEY"
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=gnu_validation=$RUNNER_TEMP/gnu" 'build --extra_execution_platforms=@gnu_validation//:gnu' 'build --host_platform=@gnu_validation//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\nbuild --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/session.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull "$GNU"
        docker run -d --init --name plugin --entrypoint /bin/bash --user root -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        bx() { docker exec plugin "$RUNNER_TEMP/bazel-9.3.1" --bazelrc="$RUNNER_TEMP/session.bazelrc" "$@"; }
        test "$(docker exec plugin "$RUNNER_TEMP/bazel-9.3.1" --version)" = 'bazel 9.3.1'
        bx query 'buildfiles(//external/tools/plugin-stack:all)' > "$RUNNER_TEMP/local.files"
        test -s "$RUNNER_TEMP/local.files"
        if grep -F '//external/tools/plugin-stack:toolchain.bzl' "$RUNNER_TEMP/local.files"; then exit 1; fi
        bx query 'labels(deps, //external/tools/plugin-stack:toolchain_bzl)' | grep -F '//cc:find_cc_toolchain_bzl'
        bx query 'labels(toolchains, @libpluginstack//:libpluginstack)' | grep -E 'libpluginstack[^/]*//:toolchain$'
        touch "$RUNNER_TEMP/packages-ok"
    - name: Compile the archive and its GNU AMD64 consumer on RBE
      run: |
        set -euo pipefail
        id=$(cat /proc/sys/kernel/random/uuid)
        echo "$id" > "$RUNNER_TEMP/uuid"
        labels=(//external/tools/plugin-stack:toolchain_bzl @libpluginstack//:libpluginstack //runsc:runsc-plugin-stack)
        date -u --iso-8601=ns > "$RUNNER_TEMP/started"
        rc=0
        docker exec plugin "$RUNNER_TEMP/bazel-9.3.1" --bazelrc="$RUNNER_TEMP/session.bazelrc" build --invocation_id="$id" --build_event_json_file="$RUNNER_TEMP/build.bep" --config=x86_64 --config=plugin-tldk -c opt --jobs=40 --remote_download_outputs=toplevel "${labels[@]}" || rc=$?
        date -u --iso-8601=ns > "$RUNNER_TEMP/finished"
        printf '%s\n' "$rc" > "$RUNNER_TEMP/exit"
        test "$rc" = 0
        bx() { docker exec plugin "$RUNNER_TEMP/bazel-9.3.1" --bazelrc="$RUNNER_TEMP/session.bazelrc" "$@"; }
        bx cquery --config=x86_64 --config=plugin-tldk -c opt --output=files //runsc:runsc-plugin-stack > "$RUNNER_TEMP/binary-paths"
        mapfile -t bins < "$RUNNER_TEMP/binary-paths"
        test "${#bins[@]}" = 1
        case "${bins[0]}" in bazel-out/*/bin/runsc/*) ;; *) exit 1 ;; esac
        docker exec plugin "${bins[0]}" --version > "$RUNNER_TEMP/version"
        docker exec plugin sha256sum "${bins[0]}" >> "$RUNNER_TEMP/version"
        date -u --iso-8601=ns > "$RUNNER_TEMP/finished"
    - name: Verify target completion and executable startup
      if: always()
      run: |
        python3 - <<'PY'
        import datetime, hashlib, json, os, re
        from pathlib import Path
        import sys
        t = Path(os.environ['RUNNER_TEMP'])
        sys.path.insert(0, str(t))
        from qualification_report import Owner
        out = t / 'proof/verdict.json'
        record = json.loads(out.read_text())
        expected = {'toolchain_bzl', 'libpluginstack', 'runsc-plugin-stack'}
        record.update(bazel='9.3.1', architecture='amd64', tests=[], skipped=[], expected=sorted(expected), executed=[], failures=[], missing=sorted(expected))
        try:
            assert (t/'packages-ok').is_file()
            record['package_queries'] = 'PASS'
            record['build_exit'] = int((t/'exit').read_text())
            record['invocation'] = (t/'uuid').read_text().strip()
            record['execution_finished'] = (t/'finished').read_text().strip()
            for line in (t/'build.bep').open():
                event = json.loads(line)
                key = event['id'].get('targetCompleted')
                if key and not key.get('aspect'):
                    owner = Owner.parse(key).label
                    target = owner.rsplit(':',1)[-1]
                    if target in expected:
                        record['executed' if event['completed'].get('success') else 'failures'].append(target)
            record['missing'] = sorted(expected-set(record['executed'])-set(record['failures']))
            assert record['build_exit'] == 0 and set(record['executed']) == expected and not record['failures']
            version = (t/'version').read_text()
            assert 'runsc version' in version.lower()
            record['binary_sha256'], = re.findall(r'^([a-f0-9]{64})\s+bazel-out/', version, re.M)
            record['startup'] = 'PASS'
            record['verdict'] = 'PASS'
        finally:
            record['verified_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
            out.write_text(json.dumps(record, indent=2)+'\n')
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: dpdk-external-toolchain
        path: ${{ runner.temp }}/proof/verdict.json
        if-no-files-found: error
