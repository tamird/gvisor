name: Replay original stamped release events
on: workflow_dispatch
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.ref == 'refs/heads/qualification/stamped-make-original'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch the original reporter revision
        run: git fetch --depth=1 --no-tags origin 14f280cd18a9aa968e2fee3b041d8621d95ff87f
      - name: Replay the original event stream
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 test/rbe/version_label/replay.py
      - name: Return checksum-bound reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stamped-make-events
          path: ${{ runner.temp }}/make-read/receipt/
          if-no-files-found: error
