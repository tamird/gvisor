name: Preserve the sign of zero through state checkpoints
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/state-optimizer-negative-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 12
        persist-credentials: false
    - name: Compare the optimizer on the same six signed-zero wire cases
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        mkdir -p "$RUNNER_TEMP/checker"
        for file in qualify.sh unit_matrix.py snapshot_report.py; do
          cp "test/rbe/$file" "$RUNNER_TEMP/checker/$file"
        done
        mkdir -p "$RUNNER_TEMP/focused_platform" "$RUNNER_TEMP/focused"
        platform=$RUNNER_TEMP/focused_platform
        printf '%s\n' 'module(name="focused_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/focused.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
            'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
            'build --remote_accept_cached' \
            "build --inject_repository=focused_platform=$platform" \
            'build --host_platform=@focused_platform//:ubuntu' \
            'build --extra_execution_platforms=@focused_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        printf '%s\n' 'build:rbe --spawn_strategy=remote' >> "$rc"
        export FIFO_RC=$rc
        mkdir -p "$RUNNER_TEMP/focused-bin"
        cat > "$RUNNER_TEMP/focused-bin/bazel" <<'SH'
        #!/bin/sh
        exec bazelisk --bazelrc="$FIFO_RC" "$@"
        SH
        chmod +x "$RUNNER_TEMP/focused-bin/bazel"
        export PATH="$RUNNER_TEMP/focused-bin:$PATH"
        git diff --exit-code 9bc4d2d673303710367f1ee2345205a74371b859 5feda466eaf91dde1906aa7c28c43fab7da1b769 -- pkg/state/encode.go
        git diff --exit-code 5feda466eaf91dde1906aa7c28c43fab7da1b769 b1640949d58e0b93f582b52827fa1056d7b3f871 -- pkg/state/types_test.go
        overall=0
        for mode in original corrected fixtures; do
          args=()
          owner=//pkg/state:state_test
          source=b1640949d58e0b93f582b52827fa1056d7b3f871; filter=''
          if [[ "$mode" = original ]]; then
            source=5feda466eaf91dde1906aa7c28c43fab7da1b769; filter='^TestZeroWireRepresentations$'
          elif [[ "$mode" = fixtures ]]; then
            owner=//pkg/state/tests:tests_test
          fi
          git checkout --quiet --detach "$source"
          test "$(git rev-parse HEAD)" = "$source"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p test/rbe "$RUNNER_TEMP/focused/$mode"
          cp "$RUNNER_TEMP/checker/qualify.sh" "$RUNNER_TEMP/checker/unit_matrix.py" test/rbe/
          out="$RUNNER_TEMP/focused/$mode"
          code=0
          if [[ -n "$filter" ]]; then args+=("--test-filter=$filter"); fi
          bash test/rbe/qualify.sh --arch=amd64 "--test-target=$owner" "${args[@]}"             "--bazel-option=--build_event_json_file=$out/events.jsonl"             --bazel-option=--test_sharding_strategy=disabled --bazel-option=--cache_test_results=no             --bazel-option=--remote_download_outputs=toplevel '--bazel-option=--remote_download_regex=.*[/]test[.](log|xml)$' test || code=$?
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 -B "$RUNNER_TEMP/checker/snapshot_report.py" "$out" "$mode" "$source" "$owner" "$code" || overall=1
        done
        exit "$overall"
    - name: Save only the typed results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: optimizer-zero-verdicts
        path: ${{ runner.temp }}/focused/*/result.json
        if-no-files-found: error
