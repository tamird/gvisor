name: Check packet receives after an unsupported shutdown
on:
  push:
    branches: [qualification/hostinet-packet-read-shutdown]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: d47997f8e4c48b4e608436e92c6566d6e03bf76e
      TEST_ARCH: x86_64
      FIXTURE_SHA256: 889cb325cf1bf9ad3c9afdf30d8dd746906f3aa6a4f2ba9694c24e2d548cdcb2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/records/verdict.json"
        cp test/rbe/packet-shutdown-result.py "$RUNNER_TEMP/verify-tcp.py"
        test "$(git rev-parse HEAD^)" = "$PRODUCT"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        if [[ $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null) == 1 ]]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --cap-add=NET_ADMIN --cap-add=NET_RAW --cap-add=SYS_ADMIN --cap-add=SYS_PTRACE --security-opt apparmor=unconfined --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler unshare -Urnm sh -ec 'mount -t tmpfs tmpfs /mnt; ip link set lo up; ip -6 addr show dev lo | grep -Fq ::1'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
        docker exec tcp-compiler python3 -c 'import socket; s=socket.socket(socket.AF_INET6); s.bind(("::1",0)); print(s.getsockname())' > "$RUNNER_TEMP/records/native-ipv6"
    - name: Record each native and guest action independently
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$PRODUCT"
        for name in packet-native packet-hostinet; do
          src=$PRODUCT
          testname=packet_socket_test
          path=test/syscalls/linux/packet_socket.cc
          filter='PacketSocketShutdown.RejectedShutdownLeavesReceiveOpen'
          executor=local
          platform=runsc_systrap_hostnet
          if [[ "$name" == *-native ]]; then executor=local; platform=native; fi
          git checkout --quiet --detach "$src"
          [[ "$(git rev-parse HEAD)" == "$src" ]]
          d=$RUNNER_TEMP/records/$name; mkdir -p "$d"
          git show "$GITHUB_SHA:$path" > "$path"
          sha256sum "$path" > "$d/fixture-sha256"
          [[ "$(cut -d' ' -f1 "$d/fixture-sha256")" == "$FIXTURE_SHA256" ]]
          target="//test/syscalls:${testname}_${platform}"
          printf '%s\n' "$src" > "$d/source"; printf '%s\n' "$target" > "$d/target"
          printf '%s\n' "$executor" > "$d/executor"; printf '%s\n' "$filter" > "$d/filter"
          date -u +%FT%TZ > "$d/start"
          rc=0
          docker exec tcp-compiler timeout --signal=INT --kill-after=30s 22m bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=64 --invocation_id="$(cat /proc/sys/kernel/random/uuid)" --strategy=TestRunner="$executor" --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=all --test_timeout=450 --test_sharding_strategy=disabled --test_env=GTEST_FILTER="$filter" --build_event_json_file="$d/bep" "$target" > "$d/bazel.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$d/exit"; date -u +%FT%TZ > "$d/end"
          for file in test.log test.xml; do
            docker exec tcp-compiler cat "bazel-testlogs/test/syscalls/${target#*:}/$file" > "$d/$file" || rm -f "$d/$file"
          done
          git restore --worktree -- "$path"
          python3 "$RUNNER_TEMP/verify-tcp.py" "$RUNNER_TEMP/records" "$name"
        done
    - name: Verify each actual socket assertion
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/verify-tcp.py" "$RUNNER_TEMP/records"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: packet-shutdown-comparison
        path: |
          ${{ runner.temp }}/records/verdict.json
        if-no-files-found: error
