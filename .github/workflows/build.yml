name: Report existing overlay poll measurements
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  report:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/overlay-poll-report'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      BENCHTOOL: 2b51abee8530385431b7225198fdd5cd65e78696
      ORIGINAL: '40992423939'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Identify the original remote invocations, without running tests
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        mkdir -p "$RUNNER_TEMP/proof"
        cp test/rbe/overlay_report/benchinputs.py "$RUNNER_TEMP/benchinputs.py"
        python3 test/rbe/overlay_report/inventory.py >"$RUNNER_TEMP/proof/inventory.txt"
        cat "$RUNNER_TEMP/proof/inventory.txt"
    - name: Publish early inventory
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: overlay-poll-inventory
        path: ${{ runner.temp }}/proof/inventory.txt
    - name: Resolve the existing pinned benchstat tool with Bazel
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^) == "$BENCHTOOL" ]]
        git checkout --quiet --detach "$BENCHTOOL"
        docker pull --platform=linux/amd64 "$GNU"
        plat=$RUNNER_TEMP/overlay-report-platform
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        cat >"$plat/BUILD" <<BUILD
        platform(name="gnu", constraint_values=["@platforms//cpu:x86_64", "@platforms//os:linux"], exec_properties={"Arch":"amd64", "OSFamily":"linux", "workload-isolation-type":"firecracker", "container-image":"docker://$GNU"}, visibility=["//visibility:public"])
        BUILD
        rc=$RUNNER_TEMP/overlay-report.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$plat" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$rc"
        unset BUILDBUDDY_API_KEY
        docker run --rm --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c '
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
          temp=$1; rc=$2; target=@org_golang_x_perf//cmd/benchstat
          bazel --bazelrc="$rc" build -c opt --config=x86_64 --jobs=80 --remote_download_outputs=toplevel "$target" >"$temp/benchtool.build" 2>&1 || { grep -E "^INFO: Invocation ID:|^ERROR:" "$temp/benchtool.build" | tail -3; exit 1; }
          bazel --bazelrc="$rc" cquery -c opt --config=x86_64 --output=files "$target" >"$temp/benchtool.files" 2>"$temp/benchtool.query"
          mapfile -t bins < <(while IFS= read -r f; do [[ ! -f $f || ! -x $f ]] || echo "$f"; done <"$temp/benchtool.files")
          [[ ${#bins[@]} == 1 ]]; install -m 0755 "${bins[0]}" "$temp/benchstat"
          sha256sum "$temp/benchstat" | cut -d" " -f1 > "$temp/proof/benchstat.sha256"
        ' _ "$RUNNER_TEMP" "$rc"
    - name: Read the original benchmark samples and render the three comparisons
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        [[ $(gh api repos/tamird/gvisor/actions/runs/"$ORIGINAL" --jq .head_sha) == b634fc8f2e995b50323555005836f14d07aca9f0 ]]
        if ! python3 "$RUNNER_TEMP/benchinputs.py" "$RUNNER_TEMP/remote-receipts" "$RUNNER_TEMP/proof" >/dev/null 2>&1; then
          for (( attempt=0; attempt<35; attempt++ )); do
            if gh api repos/tamird/gvisor/actions/runs/"$ORIGINAL"/artifacts --jq '.artifacts[].name' | grep -Fxq overlay-poll-checkpoint-cost; then break; fi
            if [[ $(gh api repos/tamird/gvisor/actions/runs/"$ORIGINAL" --jq .status) == completed ]]; then break; fi
            sleep 120
          done
          gh run download "$ORIGINAL" -R tamird/gvisor -n overlay-poll-checkpoint-cost -D "$RUNNER_TEMP/receipts"
          python3 "$RUNNER_TEMP/benchinputs.py" "$RUNNER_TEMP/receipts" "$RUNNER_TEMP/proof"
        fi
        cd "$RUNNER_TEMP/proof"
        "$RUNNER_TEMP/benchstat" stock.bench map.bench fixed.bench >benchstat.txt
        cat benchstat.txt
    - name: Preserve the original samples and pinned report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: overlay-poll-benchstat
        path: ${{ runner.temp }}/proof/
