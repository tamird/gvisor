name: Check the corrected wrk2 workload and diagnose the original iperf ARM fault
on:
  push:
    branches: [qualification/official-go-images]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 12
      - name: Configure the pinned Linux execution platform
        id: setup
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          echo "Coordinator $(gcc -dumpfullversion), worker GCC 11"
          test "$(gcc -dumpversion | cut -d. -f1)" = 11
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
          mkdir -p "$RUNNER_TEMP/gnu"
          GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
          test -n "$BUILDBUDDY_API_KEY"
          rc=$RUNNER_TEMP/images.bazelrc
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          cat >> "$rc" <<'RC'
          build --jobs=8
          build --strategy=GoStdlib=linux-sandbox
          build --strategy=GoStdlibList=linux-sandbox
          build --strategy=GoStandardLibraryAnalysis=linux-sandbox
          build --strategy=GoStaticAnalysis=linux-sandbox
          build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache
          build --noremote_upload_local_results
          build --remote_download_outputs=toplevel
          build --noshow_progress
          RC
          for name in wrk2-image-check wrk2-source-check iperf-go-consumers iperf-catalog-delta; do git show "$GITHUB_SHA:test/rbe/$name.sh" > "$RUNNER_TEMP/$name.sh"; done
      - name: Read the existing iperf producer status
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          git show "$GITHUB_SHA:test/rbe/iperf-producer-status.py" >"$RUNNER_TEMP/iperf-producer-status.py"
          python3 "$RUNNER_TEMP/iperf-producer-status.py" >"$RUNNER_TEMP/iperf-producer-status.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-iperf-producer-status
          path: ${{ runner.temp }}/iperf-producer-status.json
          if-no-files-found: error
      - name: Install the Linux ARM64 binfmt interpreter
        id: qemu
        run: |
          if [[ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
            sudo update-binfmts --enable qemu-aarch64
          fi
          grep -Fx enabled /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -E '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Build the image and run the HTTP client on amd64
        id: amd64
        if: always() && steps.setup.outcome == 'success'
        timeout-minutes: 44
        run: bash "$RUNNER_TEMP/wrk2-image-check.sh" x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.amd64.outcome != 'skipped'
        with:
          name: wrk2-x86_64
          path: ${{ runner.temp }}/wrk2/x86_64
          if-no-files-found: error
      - name: Build the image and run the HTTP client on arm64
        id: arm64
        if: always() && steps.setup.outcome == 'success' && steps.qemu.outcome == 'success'
        timeout-minutes: 44
        run: bash "$RUNNER_TEMP/wrk2-image-check.sh" aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.arm64.outcome != 'skipped'
        with:
          name: wrk2-aarch64
          path: ${{ runner.temp }}/wrk2/aarch64
          if-no-files-found: error
      - name: Fetch fresh wrk2 notices with the actual SPDX prerequisite
        id: catalog
        if: always() && steps.setup.outcome == 'success'
        timeout-minutes: 28
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash "$RUNNER_TEMP/wrk2-source-check.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.catalog.outcome != 'skipped'
        with:
          name: catalog-receipt
          path: ${{ runner.temp }}/wrk2/licenses
          if-no-files-found: error
      - name: Retrieve the original AMD64 iperf context without rebuilding it
        id: x86archive
        if: always() && steps.setup.outcome == 'success'
        timeout-minutes: 4
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:test/rbe/iperf-recover-context.py" >"$RUNNER_TEMP/iperf-recover.py"
          python3 "$RUNNER_TEMP/iperf-recover.py" "$RUNNER_TEMP/iperf-original-amd64" e13472b6-773d-4ccc-be22-8deda24ad330 62
          docker load -i "$RUNNER_TEMP/iperf-original-image.tar"
          tag=gvisor.dev/images/benchmarks/iperf
          test "$(docker image inspect "$tag:latest" --format '{{.Architecture}}')" = amd64
          docker tag "$tag:latest" "$tag:amd64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.x86archive.outcome != 'skipped'
        with:
          name: x86archive-receipt
          path: ${{ runner.temp }}/iperf-original-amd64
          if-no-files-found: error
      - name: Run the eight real Go network benchmarks on native AMD64
        id: iperfconsumer
        if: always() && steps.x86archive.outcome == 'success'
        timeout-minutes: 50
        run: |
          bash "$RUNNER_TEMP/iperf-go-consumers.sh" iperf x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.iperfconsumer.outcome != 'skipped'
        with:
          name: iperfconsumer-receipt
          path: ${{ runner.temp }}/iperf-results/iperf-go-x86_64
          if-no-files-found: error
      - name: Compare remaining full catalog changes to their no-iperf baseline
        id: iperfcatalog
        if: always() && steps.setup.outcome == 'success'
        timeout-minutes: 22
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash "$RUNNER_TEMP/iperf-catalog-delta.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.iperfcatalog.outcome != 'skipped'
        with:
          name: iperfcatalog-receipt
          path: ${{ runner.temp }}/iperf-results/catalog-delta
          if-no-files-found: error
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Reuse the original ARM ELF and prove its contents again
        id: armarchive
        if: always() && success()
        timeout-minutes: 4
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:test/rbe/iperf-recover-context.py" >"$RUNNER_TEMP/iperf-recover.py"
          python3 "$RUNNER_TEMP/iperf-recover.py" "$RUNNER_TEMP/iperf-original-arm64" a755857a-c2d8-465d-8b4c-13c7f5da31f7 183
          docker load -i "$RUNNER_TEMP/iperf-original-image.tar"
          tag=gvisor.dev/images/benchmarks/iperf
          test "$(docker image inspect "$tag:latest" --format '{{.Architecture}}')" = arm64
          docker tag "$tag:latest" "$tag:arm64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.armarchive.outcome != 'skipped'
        with:
          name: armarchive-receipt
          path: ${{ runner.temp }}/iperf-original-arm64
          if-no-files-found: error
      - name: Identify the trap in the original native ARM client
        id: trap
        if: always() && steps.armarchive.outcome == 'success'
        timeout-minutes: 6
        run: |
          bash test/rbe/iperf-arm-debug.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.trap.outcome != 'skipped'
        with:
          name: trap-receipt
          path: ${{ runner.temp }}/iperf-diagnostic
          if-no-files-found: error
