name: Recover epoll analyzer results on Linux
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/epoll-analysis-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      OVERLAY: df28fab7d4e4c94f943ccc3939f0cbc97fde40e0
      PLUGIN: 1bea5cb1e2a17facc9b8b94d4241f3189d5ebf68
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 5
        persist-credentials: false
    - name: Recover the original worker error before executing new actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        mkdir -p "$RUNNER_TEMP/epoll-results"
        python3 -B .github/qualification/epoll/original_worker.py 0a944ace-cbdb-42c8-ac7e-d9ea932c51f8 "$RUNNER_TEMP/epoll-results/original-worker.json"
    - name: Run the missing analyzer in Linux sandboxes
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        checker=$RUNNER_TEMP/bwrap-checker
        mkdir -p "$checker" "$RUNNER_TEMP/gnu"
        cp .github/qualification/epoll/*.py "$checker"
        printf 'module(name="bwrap_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
        printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
        rc=$RUNNER_TEMP/bwrap.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=bwrap_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@bwrap_gnu//:gnu' 'build --extra_execution_platforms=@bwrap_gnu//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        command -v bazelisk
        failure=0
        for lane in overlay plugin; do
          case $lane in
            overlay) SOURCE=$OVERLAY; labels=(//pkg/sentry/fsimpl/overlay:overlay_nogo); config=() ;;
            plugin) SOURCE=$PLUGIN; labels=(//pkg/sentry/socket/plugin/stack:stack_nogo //pkg/sentry/socket/plugin/stack:stack_test_nogo //pkg/sentry/socket/plugin/cgo:cgo_nogo); config=() ;;
          esac
          if [[ $lane == plugin ]]; then
            # Never run an already-qualified original target a second time.
            for ((waited=0; waited<70; waited++)); do
              state=$(gh run view 40951472713 -R tamird/gvisor --json status --jq .status)
              [[ $state != completed ]] || break
              sleep 30
            done
            if [[ $state != completed ]]; then
              echo "The original plugin job is still running; do not duplicate it." >&2
              exit 1
            fi
            original=$RUNNER_TEMP/plugin-original
            mkdir -p "$original"
            gh run download 40951472713 -R tamird/gvisor -n plugin-epoll-results --dir "$original" || echo "No original bundle available" >&2
            missing=()
            for label in "${labels[@]}"; do
              if ! python3 -c 'import json, pathlib, sys; root,label,source=sys.argv[1:]; rows=(json.loads(p.read_text()) for p in pathlib.Path(root).glob("analyzers/*.json")); raise SystemExit(not any(r.get("target")==label and r.get("qualified") and r.get("source")==source for r in rows))' "$original" "$label" "$PLUGIN"; then
                missing+=("$label")
              fi
            done
            if ((${#missing[@]}==0)); then
              echo "All three plugin owning checks already qualified on the original source."
              continue
            fi
            labels=("${missing[@]}")
          fi
          out="$RUNNER_TEMP/epoll-results/$lane"
          mkdir -p "$out"
          git checkout --quiet --detach "$SOURCE"
          [[ $(git rev-parse HEAD) == "$SOURCE" ]]
          git cat-file -p HEAD > "$out/commit.txt"
          git status --porcelain --untracked-files=no > "$out/source-before.txt"
          test ! -s "$out/source-before.txt"
        printf '%s\n' "${labels[@]}" > "$out/targets.txt"
        args=(test --config=x86_64 -c opt --jobs=4 --strategy=GoStdlib=linux-sandbox --strategy=GoStdlibList=linux-sandbox --strategy=GoStandardLibraryAnalysis=linux-sandbox --strategy=GoStaticAnalysis=linux-sandbox '--modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' --nocache_test_results --keep_going --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_sharding_strategy=disabled --test_output=errors --build_event_json_file_path_conversion=false "--build_event_json_file=$RUNNER_TEMP/raw.jsonl" "${config[@]}" "${labels[@]}")
        printf '%s\n' "${args[@]}" > "$out/arguments.txt"
        code=0; capture=0; verify=0
        bazelisk --bazelrc="$rc" "${args[@]}" || code=$?
        finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        printf '%s\n' "$code" > "$out/native-exit.txt"
        git rev-parse HEAD > "$out/final-head.txt"
        git status --porcelain --untracked-files=no > "$out/source-after.txt"
        python3 -B "$checker/qualification_report.py" capture --events "$RUNNER_TEMP/raw.jsonl" --output "$out/events.jsonl" --output-root "$PWD/bazel-out" --report-dir "$out/reports" --expected-kind test || capture=$?
        printf '%s\n' "$capture" > "$out/capture-exit.txt"
        python3 - "$out" "$SOURCE" "$finished" <<'PY'
        import json, sys
        from pathlib import Path
        d=Path(sys.argv[1])
        ctx=dict(expected_source=sys.argv[2],command_kind="test",execution_finished_at=sys.argv[3],commit_file="commit.txt",source_before="source-before.txt",source_after="source-after.txt",final_head="final-head.txt",executed_arguments="arguments.txt",native_exit="native-exit.txt",capture_exit="capture-exit.txt")
        (d/"context.json").write_text(json.dumps(ctx))
        PY
        python3 -B "$checker/qualification_report.py" verdict --context "$out/context.json" --events "$out/events.jsonl" --manifest "$out/events.jsonl.manifest.json" --expected-targets "$out/targets.txt" --output "$out/verdict.json" || verify=$?
        if ((code)); then failure=$code; elif ((capture)); then failure=$capture; elif ((verify)); then failure=$verify; fi
        done
        exit "$failure"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: epoll-analyzer-recovery
        path: ${{ runner.temp }}/epoll-results
        if-no-files-found: error
