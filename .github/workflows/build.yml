name: Measure runnable TCP lock-owner latency on one Linux P
on:
  push:
    branches: [qualification/tcp-single-p-owner-latency]
permissions:
  contents: read
jobs:
  measure:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Measure the isolated queue and lock
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/owner"
          test "$(git rev-parse HEAD^)" = 7a675ac66a1e2357abdaa6cccedabcd3cce9aa5c
          git diff --exit-code HEAD^ HEAD -- pkg/tcpip/transport/tcp ':!pkg/tcpip/transport/tcp/endpoint_test.go'
          bazel test -c opt --config=x86_64 --jobs=4 --nocache_test_results --strategy=TestRunner=sandboxed --test_filter='^TestSinglePRunnableOwner$' --test_arg=-test.v --test_env=GODEBUG=asyncpreemptoff=0 --test_timeout=60 --build_event_json_file="$RUNNER_TEMP/owner.bep" //pkg/tcpip/transport/tcp:tcp_test || status=$?
          echo "${status:-0}" > "$RUNNER_TEMP/owner/bazel-exit.txt"
          exit "${status:-0}"
      - name: Preserve measurements independently of the timing comparison
        if: always()
        run: python3 .github/workflows/tcp_owner_results.py
      - name: Compare the two sets of twelve trials with the pinned benchstat
        run: |
          set -euo pipefail
          tgt=@org_golang_x_perf//cmd/benchstat
          bazel build -c opt --config=x86_64 --jobs=4 "$tgt"
          bazel cquery --config=x86_64 -c opt --output=files "$tgt" > "$RUNNER_TEMP/benchstat-paths"
          mapfile -t tools < <(while IFS= read -r f; do if test -f "$f" && test -x "$f"; then echo "$f"; fi; done < "$RUNNER_TEMP/benchstat-paths")
          test "${#tools[@]}" = 1
          exe="$PWD/${tools[0]}"
          cd "$RUNNER_TEMP/owner"
          "$exe" retry.bench yield.bench | tee benchstat.txt
          test "$(grep -c '^OwnerResume' benchstat.txt)" = 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tcp-owner
          path: ${{ runner.temp }}/owner/
          if-no-files-found: error
