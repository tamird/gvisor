name: Qualify the official gsutil benchmark image
on:
  push:
    branches: [qualification/gsutil-release]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Configure the pinned Linux execution platform
        id: setup
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
          mkdir -p "$RUNNER_TEMP/gnu"
          GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
          test -n "$BUILDBUDDY_API_KEY"
          rc=$RUNNER_TEMP/images.bazelrc
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          cat >> "$rc" <<'RC'
          build --jobs=8
          build --strategy=GoStdlib=linux-sandbox
          build --strategy=GoStdlibList=linux-sandbox
          build --strategy=GoStandardLibraryAnalysis=linux-sandbox
          build --strategy=GoStaticAnalysis=linux-sandbox
          build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache
          build --noremote_upload_local_results
          build --remote_download_outputs=toplevel
          build --noshow_progress
          RC

          mkdir -p "$RUNNER_TEMP/results"
          git rev-parse HEAD HEAD^ > "$RUNNER_TEMP/results/carrier-product"
      - name: Emit the actual rootfs pod commands with the owning library
        id: spec
        run: |
          set -euo pipefail
          bazel --bazelrc="$RUNNER_TEMP/images.bazelrc" test --config=x86_64 --nocache_test_results --test_output=errors --test_arg=-test.v //test/kubernetes/benchmarks:gsutil_release_command_test
          sed -n 's/^.*GSUTIL_COMMANDS=//p' bazel-testlogs/test/kubernetes/benchmarks/gsutil_release_command_test/test.log > "$RUNNER_TEMP/commands.json"
          python3 -c 'import json,sys; assert set(json.load(open(sys.argv[1])))=={"single","sliced"}' "$RUNNER_TEMP/commands.json"
          cp "$RUNNER_TEMP/commands.json" "$RUNNER_TEMP/results/"
      - name: Install the Linux ARM64 binfmt interpreter
        id: qemu
        if: always()
        run: |
          if [[ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
            sudo update-binfmts --enable qemu-aarch64
          fi
          grep -Fx enabled /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -E '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Load the declared x86_64 archive through Make
        id: make_x86_64
        if: always() && steps.setup.outcome == 'success'
        run: |
          set -euo pipefail
          export MAKEFLAGS=DOCKER_BUILD=false
          make -s rebuild-benchmarks_gsutil ARCH=x86_64 DOCKER_BUILD=false STARTUP_OPTIONS="--bazelrc=$RUNNER_TEMP/images.bazelrc"
      - name: Verify shipped downloads on x86_64
        if: always() && steps.spec.outcome == 'success'
        run: python3 test/rbe/gsutil-release.py x86_64 shipped
      - name: Verify candidate downloads on x86_64
        if: always() && steps.spec.outcome == 'success' && steps.make_x86_64.outcome == 'success'
        run: python3 test/rbe/gsutil-release.py x86_64 candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gsutil-x86_64
          path: ${{ runner.temp }}/results/x86_64
          if-no-files-found: warn
      - name: Load the declared aarch64 archive through Make
        id: make_aarch64
        if: always() && steps.setup.outcome == 'success' && steps.qemu.outcome == 'success'
        run: |
          set -euo pipefail
          export MAKEFLAGS=DOCKER_BUILD=false
          make -s rebuild-benchmarks_gsutil ARCH=aarch64 DOCKER_BUILD=false STARTUP_OPTIONS="--bazelrc=$RUNNER_TEMP/images.bazelrc"
      - name: Verify shipped downloads on aarch64
        if: always() && steps.spec.outcome == 'success' && steps.qemu.outcome == 'success'
        run: python3 test/rbe/gsutil-release.py aarch64 shipped
      - name: Verify candidate downloads on aarch64
        if: always() && steps.spec.outcome == 'success' && steps.qemu.outcome == 'success' && steps.make_aarch64.outcome == 'success'
        run: python3 test/rbe/gsutil-release.py aarch64 candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gsutil-aarch64
          path: ${{ runner.temp }}/results/aarch64
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gsutil-comparison
          path: ${{ runner.temp }}/results
          if-no-files-found: error
      - name: Remove private runner settings
        if: always()
        run: rm -f "$RUNNER_TEMP/images.bazelrc"
