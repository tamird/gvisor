name: Analyze the two TUN owners on a Linux GNU coordinator
on:
  push:
    branches: [qualification/tun-pi-owners]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/tun-pi-owners'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      OSTOCK: 13969a0fd2f1347a25e2b20e4e36e64787dcab15
      OFIXED: 5fa30581c58c120ca603051a3988163d1e9fc0bf
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 3
        persist-credentials: false
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^)" = "$OFIXED"
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Analyze the exact standalone TUN change
      run: |
        set -euo pipefail
        git checkout --detach "$OFIXED"
        out=$RUNNER_TEMP/tun-owners; mkdir -p "$out"
        printf '%s\n' "$OFIXED" > "$out/source"
        rc=0
        bazelisk --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=4 --keep_going --strategy=GoStaticAnalysis=linux-sandbox --strategy=GoStandardLibraryAnalysis=linux-sandbox --strategy=GoStdlib=linux-sandbox --strategy=GoStdlibList=linux-sandbox '--modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' --strategy=TestRunner=linux-sandbox --nocache_test_results --test_output=errors //pkg/sentry/devices/tundev:tundev_nogo //pkg/tcpip/link/tun:tun_nogo > "$RUNNER_TEMP/tun-nogo.log" 2>&1 || rc=$?
        printf '%s\n' "$rc" > "$out/exit"
        grep -A4 -E 'Invocation ID:|ERROR:|error:|diagnostic|FAILED|PASSED|tests? pass|failed to build' "$RUNNER_TEMP/tun-nogo.log" | tail -115 > "$out/receipt" || :
        for owner in pkg/sentry/devices/tundev/tundev_nogo pkg/tcpip/link/tun/tun_nogo; do
          name=${owner##*/}; f="bazel-testlogs/$owner/test.log"
          if [[ -f "$f" ]]; then grep -E '([.]go:[0-9]+|_nogo|nogo:)' "$f" | head -45 > "$out/$name.log" || :; fi
        done
        test "$rc" -eq 0
        grep -E '^//pkg/sentry/devices/tundev:tundev_nogo +PASSED' "$out/receipt"
        grep -E '^//pkg/tcpip/link/tun:tun_nogo +PASSED' "$out/receipt"
    - name: Exclude credentials from validation receipts
      if: always()
      env:
        KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        from pathlib import Path
        import os
        key=os.environ['KEY'].encode()
        for f in (Path(os.environ['RUNNER_TEMP'])/'tun-owners').glob('*'):
            if f.is_file() and key and key in (x:=f.read_bytes()):
                f.write_bytes(x.replace(key,b'[REDACTED]'))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: tun-pi-owners
        path: ${{ runner.temp }}/tun-owners/
        if-no-files-found: error
