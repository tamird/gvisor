name: Verify that the race smoke fails on a Sentry race
on:
  push:
    branches: [qualification/race-smoke-halting]
permissions:
  actions: read
  contents: read
jobs:
  make:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.ref == 'refs/heads/qualification/race-smoke-halting'
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: c58f36d4e068c2b0aa31a207fabbb37e25b60472
      BEFORE: 3e0709a90beefbc5dcbccfb6aa7115fab90b607b
      GLIBC_TUNABLES: glibc.pthread.rseq=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 5, persist-credentials: false}
      - name: Recover the successful clean boot from the original run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/race-make"
          mkdir -p "$dest"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13198740828/zip" > "$dest/previous.zip"
          printf '%s  %s\n' ef020e44c5004fa2a2c6761a3a9eafbbba44d366e1f9d284eb3d351fc51e03f4 "$dest/previous.zip" | sha256sum -c -
          unzip -p "$dest/previous.zip" verdict.json > "$dest/previous.json"
      - name: Prepare the ordinary pinned GNU coordinator and its matching RBE worker
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCT" HEAD
          dest="$RUNNER_TEMP/race-make"
          mkdir -p "$dest/records" "$dest/platform" "$HOME/.cache"
          git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$BEFORE"
          test "$(git diff --name-only "$BEFORE" "$PRODUCT")" = Makefile
          git checkout --detach "$PRODUCT"
          git diff --quiet
          printf 'module(name="gnu_runtime")\n' > "$dest/platform/MODULE.bazel"
          printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$dest/platform/BUILD"
          docker pull --platform=linux/amd64 "$GNU"
          docker run --init -d --name smoke-compiler --user "$(id -u):$(id -g)" -e HOME="$HOME" -e USER="$USER" -e LOGNAME="$USER" -v "$HOME/.cache:$HOME/.cache" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$dest:$dest" -w "$GITHUB_WORKSPACE" --entrypoint /bin/bash "$GNU" -c 'sleep infinity'
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=gnu_runtime=$dest/platform" 'build --extra_execution_platforms=@gnu_runtime//:gnu' 'build --host_platform=@gnu_runtime//:gnu' 'build --jobs=400' 'build --strategy_regexp=^Analyzing.(@@)?//pkg/abi/linux:linux$=local'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } | docker exec -i smoke-compiler sh -c 'umask 077; cat > /tmp/make-remote.bazelrc'
          unset BUILDBUDDY_API_KEY
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          docker exec --user=root smoke-compiler bash -ceu '
            getent group "$2" >/dev/null || groupadd --gid "$2" smoke
            getent passwd "$1" >/dev/null || useradd --no-create-home --uid "$1" --gid "$2" --home-dir "$3" --shell /bin/bash smoke
            chown "$1:$2" "$3"
          ' _ "$runner_uid" "$runner_gid" "$HOME"
          docker exec smoke-compiler id -un
          docker exec smoke-compiler bazel --bazelrc=/tmp/make-remote.bazelrc info output_base > "$dest/ready-client.log" 2>&1 || {
            tail -35 "$dest/ready-client.log" | grep -Eiv 'api.?key|authorization|credential|remote_header|bes_header'
            exit 1
          }
          docker exec smoke-compiler gcc -dumpfullversion
          docker exec smoke-compiler bazel --version
          cat > "$dest/bazel" <<'SH'
          #!/bin/bash
          set -eu
          if [[ "$1" == build ]]; then
            shift
            exec docker exec smoke-compiler bazel --bazelrc=/tmp/make-remote.bazelrc build "--build_event_json_file=$RUNNER_TEMP/race-make/$SMOKE_FLAVOR.bep" "$@"
          fi
          exec docker exec smoke-compiler bazel --bazelrc=/tmp/make-remote.bazelrc "$@"
          SH
          chmod 755 "$dest/bazel"
      - name: Exercise both recipes against the same injected race
        timeout-minutes: 95
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          test -z "${BUILDBUDDY_API_KEY:-}"
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare -Ur true
          dest="$RUNNER_TEMP/race-make"
          date -u --iso-8601=ns > "$dest/start"
          run_smoke() {
            local arm=$1 dir=$2 status=0
            shift 2
            env -u GORACE SMOKE_FLAVOR="$arm" timeout --kill-after=10s 40m make "$@" "RUNTIME_DIR=$dest/$dir" DOCKER_BUILD=false DOCKER_CLI_PATH=/bin/false BAZEL="$dest/bazel" BAZEL_OPTIONS=--config=x86_64 smoke-race-tests > "$dest/$arm.log" 2>&1 || status=$?
            printf '%s\n' "$status" > "$dest/$arm.status"
            if [[ -f $dest/$dir/gvisor-bin/gvisor_sentry ]]; then
              sha256sum "$dest/$dir/gvisor-bin/gvisor_sentry" | cut -d' ' -f1 > "$dest/$arm.sentry"
            fi
          }
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pkg/sentry/syscalls/linux/sys_thread.go")
          src = path.read_text()
          where = "t.PrepareGroupExit(linux.WaitStatusExit(status & 0xff))"
          assert src.count(where) == 1
          # Write distinct high bits to the same exit status without establishing
          # an ordering. The guest still exits with its original low eight bits.
          injection = """done := make(chan struct{})
          \tgo func() {
          \t\tstatus |= 0x100
          \t\tclose(done)
          \t}()
          \tstatus |= 0x200
          \t<-done
          \t"""
          path.write_text(src.replace(where, injection + where))
          PY
          git diff --check
          test "$(git diff --name-only)" = pkg/sentry/syscalls/linux/sys_thread.go
          # tools/bazel.mk finds the repository's copy helper relative to Makefile.
          git show "$BEFORE:Makefile" > Makefile
          run_smoke before injected
          # The remaining difference is the environment of the smoke invocation;
          # retain the very same staged binary while executing the new Make recipe.
          git show "$PRODUCT:Makefile" > Makefile
          run_smoke fixed injected -o "$dest/injected/runsc"
          date -u --iso-8601=ns > "$dest/finish"
      - name: Reconcile the two release builds and three actual make exits
        if: always()
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json, os, re
          from pathlib import Path
          dest = Path(os.environ["RUNNER_TEMP"], "race-make")
          records = dest / "records"
          records.mkdir(parents=True, exist_ok=True)
          verdict = {"source": os.environ["PRODUCT"], "oldRecipe": os.environ["BEFORE"], "carrier": os.environ["GITHUB_SHA"], "expected": ["clean", "before", "fixed"], "arms": {}, "missing": [], "errors": [], "status": "INCOMPLETE"}
          previous = dest / "previous.json"
          if previous.exists():
              original = json.loads(previous.read_text())
              clean = original["arms"]["clean"]
              if original["source"] == verdict["source"] and clean["releaseBuilt"] and clean["boot"] and clean["makeExit"] == 0 and clean["sentry"] and not clean["dataRace"] and not clean["injectedStack"]:
                  verdict["arms"]["clean"] = {**clean, "artifact": 13198740828}
          if "clean" not in verdict["arms"]:
              verdict["missing"].append("clean")
          for arm in ("before", "fixed"):
              status = dest / f"{arm}.status"
              if not status.exists():
                  verdict["missing"].append(arm)
                  continue
              log = (dest / f"{arm}.log").read_text(errors="replace")
              digest = dest / f"{arm}.sentry"
              row = verdict["arms"][arm] = {"makeExit": int(status.read_text()), "sentry": digest.read_text().strip() if digest.exists() else None, "dataRace": "WARNING: DATA RACE" in log, "injectedStack": "linux.ExitGroup" in log.partition("WARNING: DATA RACE")[2], "boot": 'Sidecar "gvisor_sentry" found: booting sandbox' in log, "recipeErrors": re.findall(r"\*\*\* \[.*smoke-race-tests\] Error (\d+)", log)}
              if arm == "before":
                  bep = dest / f"{arm}.bep"
                  events = [json.loads(line) for line in bep.open()] if bep.exists() else []
                  row["invocation"] = next((e["started"]["uuid"] for e in events if "started" in e), None)
                  row["releaseBuilt"] = any(e.get("id", {}).get("targetCompleted", {}).get("label") == "//:release-race" and e.get("completed", {}).get("success") for e in events) and any(e.get("finished", {}).get("exitCode", {}).get("code", 0) == 0 for e in events if "finished" in e)
                  if not row["releaseBuilt"]:
                      verdict["errors"].append(f"{arm}: expected race release build")
              if not row["boot"] or not row["sentry"] or arm != "fixed" and row["makeExit"] != 0 or arm == "fixed" and (row["makeExit"] != 2 or not row["recipeErrors"]):
                  verdict["errors"].append(f"{arm}: missing Sentry boot, staged binary, or expected recipe exit")
              if not row["dataRace"] or not row["injectedStack"]:
                  verdict["errors"].append(f"{arm}: unexpected race report or origin")
          arms = verdict["arms"]
          if not verdict["missing"] and (arms["before"]["sentry"] != arms["fixed"]["sentry"] or arms["clean"]["sentry"] == arms["before"]["sentry"]):
              verdict["errors"].append("unexpected binary identity")
          if not verdict["missing"]:
              verdict["status"] = "FAIL" if verdict["errors"] else "PASS"
          finished = dest / "finish"
          verdict["executionFinishedAt"] = finished.read_text().strip() if finished.exists() else None
          verdict["verdictAt"] = datetime.now(timezone.utc).isoformat()
          (records / "verdict.json").write_text(json.dumps(verdict, indent=2) + "\n")
          print(json.dumps(verdict))
          raise SystemExit(verdict["status"] != "PASS")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: race-smoke-exit-verdict
          path: ${{ runner.temp }}/race-make/records/verdict.json
          if-no-files-found: error
