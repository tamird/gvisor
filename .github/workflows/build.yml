name: Check PacketMmapTest.PacketReserve on three kernels
on:
  push:
    branches: [qualification/packet-reserve-native-linux]
permissions: {contents: read}
jobs:
  verify:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Prepare the matched native test sources
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/packet-reserve"
          mkdir -p "$d/evidence"
          test "$(git rev-parse HEAD^)" = 5de0b08c436460cd3f68cf9a3dfc0bef8f891407
          test "$(git rev-parse HEAD^^)" = f51a205a8f4afbc5ab41aded070df74951b081ea
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/packet_reserve.py'
          test "$(cat .bazelversion)" = 9.3.1
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo
          if ! command -v aarch64-linux-gnu-g++ >/dev/null || ! dpkg -s libnuma-dev >/dev/null 2>&1; then
            for suite in jammy jammy-updates; do
              echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ $suite main universe"
            done > "$d/ubuntu.list"
            opts=(-o "Dir::Etc::sourcelist=$d/ubuntu.list" -o Dir::Etc::sourceparts=-)
            sudo apt-get "${opts[@]}" update -qq
            sudo apt-get "${opts[@]}" install -qq -y --no-install-recommends crossbuild-essential-arm64 libnuma-dev
          fi
          curl -fsSL --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
      - name: Run the real packet reserve case on Linux, corrected and stock gVisor
        timeout-minutes: 142
        run: |
          d="$RUNNER_TEMP/packet-reserve"
          cp .github/packet_reserve.py "$d/"
          git checkout -q --detach 5de0b08c436460cd3f68cf9a3dfc0bef8f891407
          python3 -B "$d/packet_reserve.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-packet-reserve
          path: ${{ runner.temp }}/packet-reserve/evidence/
          if-no-files-found: warn
          retention-days: 14
