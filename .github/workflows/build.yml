name: Verify the inherited-FD netgofer candidate on native ARM64
on:
  push:
    branches: [qualification/arm64-netgofer-queue-drain]
permissions: {contents: read}
jobs:
  readback:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 5, persist-credentials: false}
      - name: Verify the exact source and the owner
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 457f831b47415cff28417dd36fed411f0b07bd59
          test "$(git rev-parse HEAD^^)" = d169ef34506bdd6232ef64ed5f11a05b81644354
          test "$(git rev-parse HEAD^^^)" = 9f3ed22283d9dfe28a001b9d3d126090c6c18951
          test "$(git rev-parse HEAD^^^^)" = 353c484b45fec1ba5ba19445ba03807a5f9638e0
          test "$(git diff HEAD^^^^ HEAD^^^ | git patch-id --stable | cut -d' ' -f1)" = 4018906c378bfcf9daf97832e6e6fa738f5966e9
          test "$(git rev-parse HEAD^^:runsc/gofer/net/netgofer_test.go)" = 982ebbe7ab5eb7e43e31aa8790d8849d31edb5c5
          test "$(git rev-parse HEAD^:runsc/gofer/net/netgofer_test.go)" = 19a5e9969cc0ea35dbff6298d3c20408872ef4ac
          git diff --exit-code HEAD^^^ HEAD^ -- . ':!runsc/gofer/net/BUILD' ':!runsc/gofer/net/netgofer_test.go'
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/source_test_readback.py'
          d="$RUNNER_TEMP/source-test-readback"
          mkdir -m 700 "$d"
          cp .github/qualification/source_test_readback.py "$d/"
          git fetch --quiet --depth=1 origin 1819ee51a2f541b0adc7cacd60bea59ddc4712e6
          git show 1819ee51a2:.github/qualification/three_source_failures.py > "$d/three_source_failures.py"
          echo "e8e678e77c5ecb816da2eb33b07f5c6e365648ea4fb36fadf6597f276b02c49d  $d/three_source_failures.py" | sha256sum -c
          git checkout -q --detach HEAD^
      - name: Run the original suite on the same remote worker profiles
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          : "${BUILDBUDDY_API_KEY:?missing fork credential}"
          umask 077
          d="$RUNNER_TEMP/source-test-readback"
          rc="$d/private.bazelrc"
          trap 'rm -f "$rc"' EXIT
          printf '%s\n' '//runsc/gofer/net:netgofer_test' > "$d/owner"
          cat >> "$rc" <<'RC'
          build:source-presubmit-arm64 --remote_executor=grpcs://remote.buildbuddy.io --remote_cache=grpcs://remote.buildbuddy.io
          build:source-presubmit-arm64 --bes_backend=grpcs://remote.buildbuddy.io --bes_results_url=https://app.buildbuddy.io/invocation/
          build:source-presubmit-arm64 --remote_download_outputs=toplevel --jobs=12 --remote_download_regex=.*/runsc/gofer/net/netgofer_test/test[.](log|xml)
          test:source-presubmit-arm64 --nocache_test_results --flaky_test_attempts=1
          RC
          printf 'build:source-presubmit-arm64 --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          unset BUILDBUDDY_API_KEY
          code=0
          bazelisk --nosystem_rc --nohome_rc --bazelrc="$rc" test --config=source-presubmit-arm64 --target_pattern_file="$d/owner" --build_event_json_file="$d/run.bep" \
            --test_arg='-test.run=^(TestRunProxyModeWithSeccomp|TestFIONREADOnOnlyNetgoferFD|TestNetgoferFinalFrameBehindEmptyRecords)$' --test_arg=-test.count=16 --test_arg=-test.failfast --test_timeout=190 --test_arg=-test.timeout=160s --test_arg=-test.v --test_env=GO_TEST_WRAP_TESTV=1 \
            --run_under="/bin/sh -c 'echo ARM_NETGOFER_HOST=\$(/bin/uname -m); exec \"\$@\"' netgofer" \
            --modify_execution_info=^TestRunner$=+no-remote-cache > "$d/run.console" 2>&1 || code=$?
          printf '%s\n' "$code" > "$d/exit"
      - name: Collect the original test cases and timeout stack
        id: collect
        if: always() && !cancelled()
        run: |
          d="$RUNNER_TEMP/source-test-readback"
          trap 'rm -f "$d/run.bep" "$d/run.console" "$d/private.bazelrc"' EXIT
          python3 -B "$d/source_test_readback.py"
      - name: Verify the result boundary
        id: receipt
        if: always() && !cancelled()
        run: |
          p="$RUNNER_TEMP/source-test-readback/receipt.json"
          test -s "$p" && test ! -L "$p" && test "$(wc -c < "$p")" -lt 240000
          if grep -Eiq 'authorization[[:space:]]*[:=]|x-buildbuddy-api-key|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}' "$p"; then exit 1; fi
          jq -e '.source=="457f831b47415cff28417dd36fed411f0b07bd59"' "$p" >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.receipt.outcome == 'success'
        with:
          name: arm64-netgofer-queue-drain
          path: ${{ runner.temp }}/source-test-readback/receipt.json
          retention-days: 14
