name: Read the four original seccheck compiler errors
on:
  push:
    branches: [qualification/seccheck-original-cpp-errors]
permissions:
  contents: read
  actions: read
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Stage the source-bound reader and existing fixed-origin client
        run: |
          set -eu
          umask 077
          task="$RUNNER_TEMP/release-rbe"
          mkdir -p "$task/harness" "$task/public"
          test "$(git rev-parse HEAD:test/rbe/release_prewarmer/original_stderr.py)" = df5c33ebbf394b46a6eccee414b9e2f4ebba959f
          cp test/rbe/release_prewarmer/original_stderr.py "$task/harness/"
          echo '7d2d777cea27c5e65309637f6f83443a08d7f7d2334a7b5530b84c98ec77fcd2  '"$task/harness/original_stderr.py" | sha256sum -c -
          git fetch --quiet --depth=1 https://github.com/tamird/gvisor.git dc3dc3dba86bb008499de9d959398a64c27c40ad
          test "$(git rev-parse dc3dc3dba:test/rbe/release_prewarmer/cas_inputs.py)" = b5c6f23eb5e3b94aaf412cae2a76843eaf0fa180
          git show dc3dc3dba:test/rbe/release_prewarmer/cas_inputs.py > "$task/harness/cas_inputs.py"
      - name: Retrieve the immutable original typed receipt
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/tamird/gvisor/actions/artifacts/13416191933/zip > "$RUNNER_TEMP/release-rbe/original.zip"
      - name: Read only the four original CppCompile stderr streams
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B "$RUNNER_TEMP/release-rbe/harness/original_stderr.py"
      - name: Check the bounded typed result
        id: privacy
        if: always()
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "release-rbe" / "public"
          paths = list(root.iterdir())
          assert len(paths) == 1 and paths[0].name == 'original-stderr.json'
          path = paths[0]
          assert path.is_file() and not path.is_symlink() and path.stat().st_size < 12288
          raw = path.read_bytes()
          assert isinstance(json.loads(raw), dict)
          key = os.environ['ACCESS'].encode()
          assert key and not any(value in raw for value in (key, b'remote_header', b'bes_header', b'Authorization:', b'Bearer ', b'X-Amz-Signature'))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: original-seccheck-cpp-stderr
          path: ${{ runner.temp }}/release-rbe/public/*.json
          if-no-files-found: error
          retention-days: 14
