name: Recover the original plugin named cases
on:
  push:
    branches: [qualification/plugin-static-musl]
permissions:
  contents: read
  actions: read
jobs:
  plugin:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: product, persist-credentials: false}
      - name: Retrieve the original producer verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/plugin-evidence"
          echo '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/plugin-evidence/result.json"
          gh api repos/tamird/gvisor/actions/artifacts/13109108628/zip > "$RUNNER_TEMP/original.zip"
      - name: Read the two original named test results
        working-directory: product
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B test/rbe/plugin_programs/recover_xml.py
      - name: Check the typed evidence boundary
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "plugin-evidence"
          files = list(folder.iterdir())
          assert {f.name for f in files} in ({"result.json"}, {"result.json", "image.json"})
          for f in files:
              assert f.is_file() and not f.is_symlink() and f.stat().st_size < 100000
              data = f.read_bytes()
              json.loads(data)
              assert os.environ["KEY"] and os.environ["KEY"].encode() not in data
              assert all(marker not in data.lower() for marker in (b"authorization:", b"bearer ", b"x-buildbuddy-api-key"))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: plugin-static-musl-named-verdict
          path: |
            ${{ runner.temp }}/plugin-evidence/result.json
            ${{ runner.temp }}/plugin-evidence/image.json
          if-no-files-found: error
      - name: Require the combined consumer verdict
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ["RUNNER_TEMP"]) / "plugin-evidence/result.json").read_text())
          assert r["status"] == "PASS", r["status"]
          assert r["consumer_inputs"]["status"] == "PASS"
          assert r["named_recovery"]["timing_status"] == "PASS"
          assert r["tests_executed"] == r["passed"] == 2 and r["failed"] == r["skipped"] == 0
          PYTHON
