name: Check the Make image inventory
"on":
  push:
    branches: [qualification/host-image-inventory]
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Compare the actual Make inventory and builder selection
        run: python3 test/rbe/host_image_inventory.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: host-image-inventory
          path: ${{ runner.temp }}/host-image-inventory/verdict.json
          if-no-files-found: error
          retention-days: 14
