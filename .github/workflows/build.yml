name: Compare release generator actions on the Git-free client
on:
  push:
    branches: [qualification/registry-llvm-seccomp-template-client]
permissions: {contents: read}
jobs:
  release:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      ORIGINAL_SOURCE: a13d73782cd4a43d5b3be6cb9dea32dbd599f52f
      RELEASE_SOURCE: facf1d8a895073c09d891f5bb890ab8274b8b020
      RELEASE_LABEL: release-20261106.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Export the pinned source and verify the Bazel client
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/direct-client"
          mkdir -p "$d/arm64" "$d/amd64" "$d/observer" "$d/original-action"
          cp .github/qualification/{release_tools.py,release_tools.sh} "$d/"
          test "$(git rev-parse HEAD^)" = "$RELEASE_SOURCE"
          test "$(git rev-parse HEAD^^)" = "$ORIGINAL_SOURCE"
          test "$(git rev-parse HEAD^:pkg/seccomp/precompiledseccomp)" = 9f4015303cdf068d70835db84e8961ab07a97e9a
          git diff --exit-code HEAD^^ HEAD^ -- . ':!pkg/seccomp/precompiledseccomp'
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/release_tools.py' ':!.github/qualification/release_tools.sh'
          mkdir "$RUNNER_TEMP/exported-source" "$RUNNER_TEMP/original-source"
          git archive "$RELEASE_SOURCE" | tar -xC "$RUNNER_TEMP/exported-source"
          git archive "$ORIGINAL_SOURCE" | tar -xC "$RUNNER_TEMP/original-source"
          test ! -e "$RUNNER_TEMP/exported-source/.git"
          test "$(cat "$RUNNER_TEMP/exported-source/.bazelversion")" = 9.3.1
          git rev-parse "$RELEASE_SOURCE^{tree}" > "$d/source.tree"
          curl --fail --show-error --silent --location --retry 3 --proto '=https' --proto-redir '=https' https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://curl.se/ca/cacert-2026-11-05.pem -o "$d/public-roots.pem"
          echo "427c064216761a1e72a8b30f0d954d08cb6e4435a82091fb865afd20c8497285  $d/public-roots.pem" | sha256sum -c -
          pool=https://archive.ubuntu.com/ubuntu/pool/main
          curl -fsSL --retry 2 "$pool/s/strace/strace_5.16-0ubuntu3_amd64.deb" -o "$d/strace.deb"
          curl -fsSL --retry 2 "$pool/libu/libunwind/libunwind8_1.3.2-2build2_amd64.deb" -o "$d/unwind.deb"
          echo "847a3535be015325f127f121d2ea5ac042b32bd20a5861a94cb7782b09857b1f  $d/strace.deb" | sha256sum -c -
          echo "475ae509da614dd5d7210f605fd5894a3c98b6fb8c18738b16d8d4b700553c30  $d/unwind.deb" | sha256sum -c -
          dpkg-deb -x "$d/strace.deb" "$d/observer"
          dpkg-deb -x "$d/unwind.deb" "$d/observer"
      - name: Trace one original generation action and build both updated releases
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/direct-client"
          digest=sha256:8a2321a92b438238f93b4346fff61bc4259c99fdd4d9b52ee86f153fee0c344f
          base="mirror.gcr.io/library/ubuntu@$digest"
          if ! docker pull --platform linux/amd64 "$base"; then
            base="docker.io/library/ubuntu@$digest"
            docker pull --platform linux/amd64 "$base"
          fi
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$base")" = linux/amd64
          client() {
            docker run --rm --workdir /workspace --entrypoint /bin/bash \
              -e RELEASE_LABEL -v "$1:/workspace" \
              -v "$d:/audit" -v "$d/observer:/observer:ro" \
              -v "$d/public-roots.pem:/etc/ssl/certs/ca-certificates.crt:ro" \
              -v "$d/bazel:/usr/local/bin/bazel:ro" "$base" /audit/release_tools.sh "$2"
          }
          rc=0
          client "$RUNNER_TEMP/original-source" original || rc=1
          client "$RUNNER_TEMP/exported-source" release || rc=1
          exit "$rc"
      - name: Verify release files and report host executions outside the producer
        if: always() && !cancelled()
        run: python3 -IB "$RUNNER_TEMP/direct-client/release_tools.py" "$RUNNER_TEMP/direct-client"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: registry-llvm-seccomp-template-client
          path: ${{ runner.temp }}/direct-client/release-tools.json
          if-no-files-found: error
          retention-days: 7
