name: Inspect the two original TLDK builds
on:
  push:
    branches: [qualification/tldk-musl-pr15153-followup]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Prepare the qualified original-action reader
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/musl-current-evidence"
          echo '{"status":"INCOMPLETE"}' > "$RUNNER_TEMP/musl-current-evidence/result.json"
          git fetch -q --no-tags --depth=1 origin 7c639344dfffdb686c1952d9e62adbabea8ff2f6
          git show 7c639344dfffdb686c1952d9e62adbabea8ff2f6:test/rbe/plugin_programs/cas_inputs.py > "$RUNNER_TEMP/cas_inputs.py"
          test "$(git hash-object "$RUNNER_TEMP/cas_inputs.py")" = 54047870d2d32c621a5c8616687a74bdc75001d5
      - name: Retrieve the two-profile producer receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/tamird/gvisor/actions/artifacts/13446866250/zip > "$RUNNER_TEMP/original.zip"
      - name: Identify blocked actions or repository fetches
        env:
          PYTHONPATH: ${{ runner.temp }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B test/rbe/plugin_musl_diagnose.py
      - name: Check the exact publication boundary
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "musl-current-evidence"
          files = list(folder.iterdir())
          assert {f.name for f in files} == {"result.json"}
          f, = files
          assert f.is_file() and not f.is_symlink() and f.stat().st_size < 100000
          data = f.read_bytes()
          json.loads(data)
          assert os.environ["KEY"] and os.environ["KEY"].encode() not in data
          assert all(m not in data.lower() for m in (b"authorization:", b"bearer ", b"x-buildbuddy-api-key"))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: tldk-original-diagnostics
          path: ${{ runner.temp }}/musl-current-evidence/result.json
          if-no-files-found: error
      - name: Require the complete result
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ["RUNNER_TEMP"]) / "musl-current-evidence/result.json").read_text())
          assert r["status"] == "READ", r["status"]
          PYTHON
