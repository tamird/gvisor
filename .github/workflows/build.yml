name: Read the original LLVM presubmit abort reasons
on:
  push:
    branches: [qualification/llvm-presubmit-original-aborts]
permissions: {contents: read}
jobs:
  retrieve:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify parser, original invocation, and source code
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 4ef17e43d9a6f702c304a2149af7a91b3d5a8ab6
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/llvm_source_aborts.py'
          cp .github/qualification/llvm_source_aborts.py "$RUNNER_TEMP/"
          echo "aaf6fb6e1ce2eda19ca28336675710bdf571d3993ce78a6762ab654cf8db3f83  $RUNNER_TEMP/llvm_source_aborts.py" | sha256sum -c
      - name: Retrieve the original five target records and the exact new parity log
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          python3 -IB "$RUNNER_TEMP/llvm_source_aborts.py"
      - name: Validate the closed receipt
        id: validate
        if: always()
        run: |
          python3 -IB - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"closed-source-aborts.json"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size<190000
          b=p.read_bytes()
          assert not re.search(rb"(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}",b)
          r=json.loads(b); assert r["invocation"]=="bc29a60b-916d-49ee-b194-acb6c21cf98f"
          assert set(r["targets"])=={"//runsc:version_test","//runsc/gofer/net:netgofer_test","//runsc/boot/filter:filter_precompiled","//runsc/gofer/net/filter:filter_precompiled","//test/syscalls:uname_test_native"}

          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.validate.outcome == 'success'
        with:
          name: original-llvm-presubmit-aborts
          path: ${{ runner.temp }}/closed-source-aborts.json
          if-no-files-found: error
          retention-days: 14
      - name: Require original target and console readbacks
        if: steps.validate.outcome == 'success'
        run: |
          python3 -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"closed-source-aborts.json").read_text()); assert r["console"].get("fetched") and all(t.get("fetched") for t in r["targets"].values()) and r["parity"].get("fetched")'
