name: Read the original duplicate-SYN test outputs
on:
  push:
    branches: [qualification/duplicate-syn-original-output]
permissions: {contents: read}
jobs:
  recover:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify the original carrier and two-file reader
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 791ababa51bf6e4b93ab96213cc2cf1e47b0e3cd
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!test/rbe/original_duplicate_syn.py'
      - name: Read four test files from the two original BuildBuddy actions
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -I -B test/rbe/original_duplicate_syn.py
      - name: Verify bounded output
        id: verify
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          data = (Path(os.environ["RUNNER_TEMP"]) / "original-duplicate-syn.json").read_bytes()
          assert 0 < len(data) < 12000
          assert not re.search(rb'(?i)authorization|remote_header|bes_header|github_pat_|x-buildbuddy-api-key|bearer ', data)
          assert set(json.loads(data)["arms"]) == {"native", "fixed"}
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.verify.outcome == 'success'
        with:
          name: original-duplicate-syn
          path: ${{ runner.temp }}/original-duplicate-syn.json
          retention-days: 14
