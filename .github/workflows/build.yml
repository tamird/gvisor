name: packet address dump
on:
  push:
    branches: [qualification/packetimpact-address-dump]
permissions: {}
jobs:
  address-dump:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Bind candidate, original Go owners and public Bazel inputs
        id: bind
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          fix=e18f42092698397c1d1ca248b6bc95bec1c910a2
          base=975fb172241c7946a9f67b4f52e0349d9240589a
          timer=0d423372840cf49baa3af27956fe7244f5e7bbac
          assets=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
          inputs=c3569a60dc1836ac6fad05e86d7951866c796b4f
          packets=ea373739cac60c41017891d6411258f22a100238
          git init -q
          git fetch -q --no-tags --no-auto-maintenance --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$timer" "$assets" "$inputs" "$packets"
          git checkout -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$fix"
          test "$(git rev-parse HEAD^^)" = "$base"
          test "$(git rev-parse "$fix^{tree}")" = 39750fdec96d8b2700a7496ba293639346242477
          test "$(git rev-parse "$packets:.github/qualification/packet_runner/frames.py")" = 34b16e4da74918523c9a7be8ffa27a0aeff40a82
          test "$(git diff --name-only "$fix" HEAD)" = "$(printf '%s\n' .github/qualification/packet_address_dump.py .github/workflows/build.yml test/packetimpact/netdevs/netlink/{BUILD,netlink.go,netlink_test.go})"
          git diff --exit-code "$base" HEAD -- test/packetimpact/tests/tcp_queue_send_recv_in_syn_sent_test.go
          grep -qx '9.3.1' .bazelversion
          d="$RUNNER_TEMP/packet-address-dump"
          mkdir -p "$d/controls" "$d/netstack"
          git show "$GITHUB_SHA:.github/qualification/packet_address_dump.py" > "$d/observe.py"
          git show "$timer:.github/qualification/timer_teardown.py" > "$d/timer_teardown.py"
          git show "$assets:.github/qualification/recvbuf_deps.py" > "$d/public_assets.py"
          git show "$inputs:.github/qualification/tldk_public_inputs.py" > "$d/tldk_public_inputs.py"
          git show "$inputs:.github/qualification/tldk_installed_inputs.json" > "$d/inputs.json"
          git show "$packets:.github/qualification/packet_runner/frames.py" > "$d/frames.py"
          curl --fail --silent --show-error --location https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $d/bazel" | sha256sum -c -
          chmod 0755 "$d/bazel"
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo
          if ! command -v aarch64-linux-gnu-g++ >/dev/null || ! test -x /sbin/iptables-nft || ! test -x /sbin/ip6tables-nft; then
            list="$d/jammy.list"
            printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy main universe' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy-updates main universe' > "$list"
            aptopts=(-o "Dir::Etc::sourcelist=$list" -o 'Dir::Etc::sourceparts=-' -o Acquire::Retries=2)
            sudo apt-get "${aptopts[@]}" -qq update
            sudo apt-get "${aptopts[@]}" -yq --no-install-recommends install g++-aarch64-linux-gnu iptables
          fi
          command -v aarch64-linux-gnu-g++
          test -x /sbin/iptables-nft && test -x /sbin/ip6tables-nft
      - name: Compare real namespace and controlled interrupted address replies
        timeout-minutes: 19
        run: |
          env -i HOME="$HOME" USER="$USER" LANG=C.UTF-8 PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin GITHUB_SHA="$GITHUB_SHA" RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$RUNNER_TEMP/packet-address-dump/observe.py" controls
      - name: Retain the focused control outputs before running PacketImpact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packet-address-controls
          path: ${{ runner.temp }}/packet-address-dump/controls/
          retention-days: 14
          if-no-files-found: error
      - name: Run original SYN-SENT Netstack owner on the uninstrumented candidate
        if: ${{ always() && !cancelled() && steps.bind.outcome == 'success' }}
        timeout-minutes: 24
        run: |
          env -i HOME="$HOME" USER="$USER" LANG=C.UTF-8 PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin GITHUB_SHA="$GITHUB_SHA" RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$RUNNER_TEMP/packet-address-dump/observe.py" netstack
      - name: Retain independent Netstack result and real capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packet-address-netstack
          path: ${{ runner.temp }}/packet-address-dump/netstack/
          retention-days: 14
          if-no-files-found: error
