name: Boot the registry LLVM release on native AMD64
on:
  push:
    branches: [qualification/registry-release-native-amd64-guest]
permissions:
  contents: read
  actions: read
jobs:
  consumer:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false, fetch-depth: 4}
    - name: Verify the known guest and original release receipts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        test "$(uname -m)" = x86_64
        test "$(git rev-parse HEAD^)" = 2f93fb19a21c5930ceb3695539d6dd9326544176
        test -x /usr/sbin/pivot_root
        d="$RUNNER_TEMP/cross-native-guest"
        mkdir -p "$d" test/rbe/payload
        gh api repos/tamird/gvisor/actions/artifacts/13574101258/zip > "$d/remote.zip"
        gh api repos/tamird/gvisor/actions/artifacts/13581779546/zip > "$d/local.zip"
        curl -fsSL --retry 2 --max-time 60 https://raw.githubusercontent.com/tamird/gvisor/7aa5d441a1078a4e9e77547a2a56e23faa6fc238/test/rbe/plugin_programs/cas_inputs.py -o "$d/cas_inputs.py"
        test "$(git hash-object "$d/cas_inputs.py")" = 54047870d2d32c621a5c8616687a74bdc75001d5
        curl -fsSL --retry 2 --max-time 120 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
        echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $d/bazel" | sha256sum --check --strict
        chmod 755 "$d/bazel"
    - name: Read the nine original AMD64 files
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 -IB .github/qualification/registry_guest_inputs.py
    - name: Prepare the checksum-pinned static AMD64 guest
      run: python3 -B test/rbe/cross_release_guest.py fixture
    - name: Boot the cross-built Sentry under native systrap
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/cross-native-guest"
        rc=0
        env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 \
          "$d/bazel" --nosystem_rc --nohome_rc test --build_event_publish_all_actions \
          --config=x86_64 --jobs=3 --remote_executor= --remote_cache= --strategy=TestRunner=local \
          --nocache_test_results --flaky_test_attempts=1 --runs_per_test=1 --test_sharding_strategy=disabled \
          --test_timeout=160 "--build_event_json_file=$d/guest.bep" --noshow_progress \
          //test/rbe:cross_built_release_guest > "$d/bazel.log" 2>&1 || rc=$?
        python3 -B test/rbe/cross_release_guest.py collect
        exit "$rc"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && !cancelled()
      with:
        name: registry-release-native-amd64-guest
        path: |
          ${{ runner.temp }}/cross-native-guest/inputs.json
          ${{ runner.temp }}/cross-native-guest/native.json
        if-no-files-found: warn
        retention-days: 14
