name: Check CUBIC's idle restart on a connected sender
on:
  push:
    branches: [qualification/cubic-idle-after-ack]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Drive the sender with and without the restart callback
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/idle-restart"
          mkdir -m 700 "$dir"
          cp .github/qualification/cubic_idle.py "$dir/"
          test "$(git rev-parse HEAD^)" = defbf40579f226615b687cbdd73bb89cbc2c85a2
          git diff --exit-code HEAD^ HEAD -- . ':!.github/qualification/cubic_idle.py' ':!.github/workflows/build.yml'
          git checkout --detach defbf40579f226615b687cbdd73bb89cbc2c85a2
          test -z "$(git status --short)"
          curl --retry 3 -fsSL --proto '=https' --proto-redir '=https' --max-time 100 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$dir/bazelisk"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $dir/bazelisk" | sha256sum -c
          chmod 755 "$dir/bazelisk"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -B "$dir/cubic_idle.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cubic-idle-restart
          path: ${{ runner.temp }}/idle-restart/receipts.json
          if-no-files-found: error
          retention-days: 7
