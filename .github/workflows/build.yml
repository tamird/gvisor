name: Check the two rebased packet cleanup owners
on:
  push:
    branches: [qualification/packet-cleanup-rebase-3847ed738]
permissions: {contents: read}
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 3, persist-credentials: false}
    - name: Select the repository's native Bazel client
      shell: bash
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/packet-cleanup"
        mkdir "$d"
        cp .github/qualification/packet_cleanup_rebase.py "$d/check.py"
        if [[ "$(bazel --version)" != "bazel $(cat .bazelversion)" ]]; then
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          echo "$d" >> "$GITHUB_PATH"
        fi
    - name: Compare the source and run both Linux owners
      shell: bash
      run: |
        set -euo pipefail
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
        git fetch -q --no-tags --depth=2 https://github.com/tamird/gvisor.git 1c156e11a9760fb68214c2483493f1d50d8836a9
        python3 -B "$RUNNER_TEMP/packet-cleanup/check.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && !cancelled()
      with:
        name: packet-cleanup-linux
        path: ${{ runner.temp }}/packet-cleanup/result.json
        retention-days: 14
        if-no-files-found: warn
