name: Compare the Fastlane benchmark across a one-second boundary
on:
  push:
    branches: [qualification/ruby-fastlane-clock-boundary]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure the existing AMD64 remote executor
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          {
            echo 'startup --host_jvm_args=-Xmx8g'
            echo 'build --remote_executor=grpcs://remote.buildbuddy.io'
            echo 'build --remote_cache=grpcs://remote.buildbuddy.io'
            echo 'build --bes_backend=grpcs://remote.buildbuddy.io'
            echo 'build --bes_results_url=https://app.buildbuddy.io/invocation/'
            echo 'build --remote_cache_compression'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/ruby.bazelrc"
      - name: Run the two Bazel owners against each Fastlane image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruby-bin"
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/ruby-bin/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/ruby-bin/bazel" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/ruby-bin/bazel"
          export PATH="$RUNNER_TEMP/ruby-bin:$PATH"
          export RUBY_RECEIPTS="$RUNNER_TEMP/ruby-receipts" RUBY_RC="$RUNNER_TEMP/ruby.bazelrc"
          python3 -B test/rbe/qualify_fastlane.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ruby-fastlane-boundary
          path: |
            ${{ runner.temp }}/ruby-receipts/**/*.json
            ${{ runner.temp }}/ruby-receipts/**/action-errors.txt
            ${{ runner.temp }}/ruby-receipts/**/clock.log
            ${{ runner.temp }}/ruby-receipts/**/suite.log
          if-no-files-found: error
