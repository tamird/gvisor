name: Verify stable overlay on the fieldless epoll core
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/overlay-stable-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      NEW: 735c4028dc521a302e1d002176b3d7afb35f5c34
      OLD: fecb71b238ea632bbcb1240f8b6696da821bd3b7
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 5
        persist-credentials: false
    - name: Bind the core, overlay refinement, and unchanged four-case fixture
      shell: bash
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^) == "$NEW" && $(git rev-parse "$NEW^") == "$OLD" && $(git rev-parse "$OLD^") == bbadaaacb49e1f5cb40e44804762efee036928d1 ]]
        mkdir -p "$RUNNER_TEMP/checker" "$RUNNER_TEMP/focused"
        cp test/rbe/overlay_stable_report.py "$RUNNER_TEMP/checker/"
    - name: Exercise the four guest cases on the final core
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        plat=$RUNNER_TEMP/poll-gnu-platform
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        cat >"$plat/BUILD" <<BUILD
        platform(
            name = "gnu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {"Arch":"amd64", "OSFamily":"linux", "workload-isolation-type":"firecracker", "container-image":"docker://$GNU"},
            visibility = ["//visibility:public"],
        )
        BUILD
        rc=$RUNNER_TEMP/poll-gnu.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=remote' "build --inject_repository=poll_gnu_platform=$plat" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$rc"
        unset BUILDBUDDY_API_KEY
        docker run --rm --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c '
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
          work=$1; new=$2
          lane=corrected
          rev=$new
          git checkout --quiet --detach "$rev"
          [[ $(git rev-parse HEAD) == "$rev" && -z $(git status --porcelain --untracked-files=no) ]]
          out="$work/focused/$lane"; mkdir -p "$out"
          arch=x86_64
          args=(--test_arg=-test.v --test_arg=-test.run=^TestOverlayEpollAdmission$)
          targets=(//pkg/sentry/fsimpl/proc:proc_test)
            bazel --bazelrc="$work/poll-gnu.bazelrc" query --noshow_progress "set(${targets[*]})" >"$out/targets"
            [[ $(wc -l <"$out/targets") -eq ${#targets[@]} ]]
            code=0
            bazel --bazelrc="$work/poll-gnu.bazelrc" test --keep_going --config="$arch" -c opt --test_timeout=300 --test_output=all --jobs=80 --nocache_test_results --modify_execution_info="^TestRunner$=+no-remote-cache" --remote_download_outputs=toplevel --remote_download_regex=".*[/]test[.](log|xml)$" --test_sharding_strategy=disabled --build_event_json_file="$out/events.jsonl" "${args[@]}" "${targets[@]}" >"$out/bazel.log" 2>&1 || code=$?
            for t in "${targets[@]}"; do python3 -B "$work/checker/overlay_stable_report.py" "$out" "$t" "$rev" "$lane" "$code"; done
            echo "$lane: Bazel $code"
            if ! grep -q TestOverlayEpollAdmission/stable_lower_proc "$out/bazel.log"; then tail -85 "$out/bazel.log"; exit 1; fi
        ' _ "$RUNNER_TEMP" "$NEW"
    - name: Verify every expected guest result
      if: always()
      shell: bash
      run: |
        python3 - "$RUNNER_TEMP/focused" <<'PYTHON'
        import json, pathlib, sys
        p=pathlib.Path(sys.argv[1]); rows=[json.loads(f.read_text()) for f in p.glob("*/*.json") if f.name not in ("events.jsonl",)]
        assert len(rows)==1, [(r["lane"],r["target"]) for r in rows]
        for r in rows:
            assert r["qualified"], r
            print(r["lane"],r["target"],r["invocation"],len(r["cases"]),r["observations"])
        PYTHON
    - name: Preserve each original verdict
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: overlay-stable-final-results
        path: |
          ${{ runner.temp }}/focused/*/*.json
          ${{ runner.temp }}/focused/*/*.test.log
          ${{ runner.temp }}/focused/*/*.test.xml
        if-no-files-found: error
