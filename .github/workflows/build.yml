name: Qualify POSIX timer ownership across checkpoint and exec
on:
  push:
    branches: [qualification/posix-timer-checkpoint-lock]
permissions: {}
jobs:
  timer:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Bind the product, pending-timer fixture and public input helpers
        timeout-minutes: 8
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/posix-teardown"
          mkdir -m700 "$d"
          echo '{"verified":false,"stage":"setup"}' > "$d/result.json"
          fix=5b9d447ba1bbfd67e6db860d585239167d1bc9f9
          base=975fb172241c7946a9f67b4f52e0349d9240589a
          assets=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
          registry=c3569a60dc1836ac6fad05e86d7951866c796b4f
          git init -q
          git fetch -q --no-auto-maintenance --no-tags --depth=4 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$assets" "$registry"
          git checkout -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$fix"
          test "$(git rev-parse HEAD:test/syscalls/linux/timers.cc)" = 9f681892d9865875112fa8e1576956cc64388460
          test "$(git rev-parse "$fix^")" = "$base"
          test "$(git rev-parse "$fix^{tree}")" = e027929a6d2bbba5079bbe2fd9e2a8e4e33ebbdd
          test "$(cat .bazelversion)" = 9.3.1
          git diff --exit-code "$fix" HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/timer_teardown.py' ':!test/syscalls/linux/timers.cc'
          git diff --exit-code "$base" "$fix" -- . ':!pkg/sentry/kernel/thread_group.go' ':!pkg/sentry/kernel/kernel.go' ':!pkg/sentry/kernel/task_exec.go'
          test "$(git rev-parse "$assets:.github/qualification/recvbuf_deps.py")" = 9a3f571087a1438113a3a067c300e26fcb0ca9e8
          test "$(git rev-parse "$registry:.github/qualification/tldk_public_inputs.py")" = 1f3f7d4d75810ad60941772776e01f3b71b3b171
          test "$(git rev-parse "$registry:.github/qualification/tldk_installed_inputs.json")" = 6a2bd5d2ea15eb2adc2cab7695db1de719503d87
          git show "$assets:.github/qualification/recvbuf_deps.py" > "$d/public_assets.py"
          git show "$registry:.github/qualification/tldk_public_inputs.py" > "$d/tldk_public_inputs.py"
          git show "$registry:.github/qualification/tldk_installed_inputs.json" > "$d/inputs.json"
          cp .github/qualification/timer_teardown.py "$d/check.py"
          curl -q -fsSL --max-time 90 --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo
          for suite in jammy jammy-updates; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu $suite main universe"
          done > "$d/jammy.list"
          opts=(-o "Dir::Etc::sourcelist=$d/jammy.list" -o Dir::Etc::sourceparts=-)
          sudo -n apt-get "${opts[@]}" update -qq
          sudo -n apt-get "${opts[@]}" install -qq -y --no-install-recommends g++-aarch64-linux-gnu libnuma-dev
      - name: Run lock analysis and the native, lockdep systrap and checkpoint cases
        timeout-minutes: 108
        run: |
          env -i HOME="$HOME" USER="$USER" PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$RUNNER_TEMP/posix-teardown/check.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: posix-timer-checkpoint-lock
          path: |
            ${{ runner.temp }}/posix-teardown/result.json
            ${{ runner.temp }}/posix-teardown/runtime-timers_test*.log
            ${{ runner.temp }}/posix-teardown/runtime-timers_test*.xml
            ${{ runner.temp }}/posix-teardown/*-kernel_nogo.log
            ${{ runner.temp }}/posix-teardown/*-kernel_nogo.xml
          if-no-files-found: error
          retention-days: 14
