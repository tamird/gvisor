name: Identify the remaining semaphore analysis actions
on:
  push:
    branches: [qualification/semop-last-action-diagnostic]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      REPORTER: fb60e127516defd6aab633f80be09a03022f0737
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Retrieve only retained action metadata from the interrupted two-owner build
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/original-metadata-evidence"
          python3 test/rbe/semop_action_attempts.py
      - name: Check the explicit artifact boundary
        id: privacy
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          key = os.environ["BUILDBUDDY_API_KEY"].encode()
          assert key
          folder = Path(os.environ["RUNNER_TEMP"]) / "original-metadata-evidence"
          for path in folder.iterdir():
              assert path.is_file() and not path.is_symlink() and path.suffix in (".json", ".xml")
              content = path.read_bytes()
              assert key not in content and b"x-buildbuddy-api-key" not in content.lower()
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: semaphore-action-attempts
          path: ${{ runner.temp }}/original-metadata-evidence
          if-no-files-found: error
