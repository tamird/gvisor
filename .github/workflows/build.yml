name: Inspect original RACK qualification
on:
  push:
    branches: [qualification/tcp-rack-flight-receipts]
permissions:
  contents: read
jobs:
  records:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Read original test and target records
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 test/rbe/rack-receipts.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: rack-original-records
        path: ${{ runner.temp }}/original-rack.json
        if-no-files-found: error
