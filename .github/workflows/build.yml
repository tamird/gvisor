name: Read the original typed-shutdown build failure
on:
  push:
    branches: [qualification/tcp-typed-shutdown-original]
permissions: {contents: read}
jobs:
  diagnostic:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the reader to the failed product
        run: |
          test "$(git rev-parse HEAD^)" = bf20197d4c2ba3b36cbd9bb034f407a9c5cce5e6
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/typed_error.py'
      - name: Inspect only the original owner build
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B .github/qualification/typed_error.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: typed-shutdown-original
          path: ${{ runner.temp }}/typed-shutdown-original.json
          retention-days: 14
