name: Observe TCP credit before a cumulative ACK
on:
  push:
    branches: [qualification/tcp-sack-before-cumack]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 72
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: df000e6d7a2ca32aea30416c12cf257c79806c50
      MASTER: aa767e4c43d011121271551fe24da501a56f729d
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/records/verdict.json"
        cp test/rbe/rack-fresh-head.py test/rbe/rack-fresh-head-config.py test/rbe/rack-fresh-head.go.txt "$RUNNER_TEMP/"
        git fetch -q --depth=2 https://github.com/google/gvisor.git refs/pull/14101/head
        git fetch -q --depth=2 https://github.com/tamird/gvisor.git "$MASTER" 7d8e856ba30ef0271690d13d2ddb1c07111a558a
        git diff 7d8e856ba^ 7d8e856ba -- test/packetimpact/runner/defs.bzl > "$RUNNER_TEMP/exec.patch"

        test "$(git rev-parse "$PRODUCT^")" = 35769a56f4fb4f533774ba59ca5e8521acd3e1a4
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        python3 - <<'PYCODE'
        import base64,json,os,re,urllib.request
        try:
            payload = {"invocationId":"289ce2b1-dec5-430e-9155-925df6b8b6f3", "minLines":20000}
            req = urllib.request.Request("https://app.buildbuddy.io/rpc/BuildBuddyService/GetEventLogChunk",data=json.dumps(payload).encode(),headers={"Content-Type":"application/json","x-buildbuddy-api-key":os.environ["BUILDBUDDY_API_KEY"]})
            with urllib.request.urlopen(req,timeout=30) as f: response=json.load(f)
            lines = base64.b64decode(response["buffer"]).decode(errors="replace").splitlines()
            print("Original compiler verdict:", [line[:400] for line in lines if re.search(r"posix_server.cc:[0-9]+.*(?:error:|fatal:)|fatal error: (?:Killed|compilation)",line) and len(line)<1000][:6])
        except Exception as e:
            print("Original compiler detail unavailable:",type(e).__name__)
        PYCODE
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
    - name: Check the same SACK sequence on Linux, stock gVisor, and the PR with its parent
      run: |
        set -euo pipefail
        runarm() {
          arm=$1; source=$(git rev-parse --verify "$2^{commit}"); target=$3; filter=$4; limit=$5
          d="$RUNNER_TEMP/records/$arm"; mkdir -p "$d"
          git checkout --quiet --detach "$source"
          [[ "$(git rev-parse HEAD)" == "$source" ]]
          printf '%s\n' "$source" > "$d/head"
          opts=()
          case "$arm" in
            linux|stock|netstack|prbase)
              python3 "$RUNNER_TEMP/rack-fresh-head-config.py"
              cat "$RUNNER_TEMP/rack-fresh-head.go.txt" >> test/packetimpact/tests/tcp_rack_test.go
              git apply "$RUNNER_TEMP/exec.patch" ;;
            *clock)
              cat "$RUNNER_TEMP/rack-fresh-head.go.txt" >> pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test.go
              opts+=(--test_arg=-test.v) ;;
          esac
          if [[ -n "$filter" ]]; then opts+=("--test_filter=$filter"); fi
          read -r -a labels <<< "$target"
          code=0
          timeout --kill-after=10s "$limit" docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=48 --strategy=TestRunner=remote --nocache_test_results --keep_going --test_sharding_strategy=disabled --test_output=errors --test_timeout=400 --test_env=GO_TEST_WRAP_TESTV=1 --build_event_json_file="$RUNNER_TEMP/$arm.bep" "${opts[@]}" "${labels[@]}" > "$d/log" 2>&1 || code=$?
          printf '%s\n' "$code" > "$d/exit"
          printf '%s\n' "${labels[@]}" > "$d/labels"
          for label in "${labels[@]}"; do
            path=${label#//}; key=${label##*:}; mkdir -p "$d/$key"
            for file in test.log test.xml; do
              docker exec tcp-compiler cat "bazel-testlogs/${path/:/\/}/$file" > "$d/$key/$file" || true
            done
          done
          case "$arm" in
            linux|stock|netstack|prbase) git restore --source="$source" -- test/packetimpact/runner/defs.bzl test/packetimpact/tests/tcp_rack_test.go pkg/tcpip/transport/tcp/protocol.go ;;
            *clock) git restore --source="$source" -- pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test.go ;;
          esac
        }
        runarm linux "$MASTER" //test/packetimpact/tests:tcp_rack_native_test '^TestSACKCreditBeforeCumulativeACK$' 12m
        runarm stock "$MASTER" //test/packetimpact/tests:tcp_rack_netstack_test '^TestSACKCreditBeforeCumulativeACK$' 15m
        runarm netstack "$PRODUCT" //test/packetimpact/tests:tcp_rack_netstack_test '^TestSACKCreditBeforeCumulativeACK$' 16m
        runarm prbase "$PRODUCT^" //test/packetimpact/tests:tcp_rack_netstack_test '^TestSACKCreditBeforeCumulativeACK$' 10m
    - name: Verify the original packet and owner results
      if: always()
      run: python3 "$RUNNER_TEMP/rack-fresh-head.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: tcp-sack-before-cumack
        path: ${{ runner.temp }}/records/verdict.json
        if-no-files-found: error
