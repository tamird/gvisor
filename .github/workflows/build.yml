name: Observe GSUtil worker component boundaries on native AMD64
on:
  push:
    branches: [qualification/gsutil-native-slices]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 3
      - run: |
          mkdir -p "$RUNNER_TEMP/results"
          git rev-parse HEAD HEAD^ HEAD^^ > "$RUNNER_TEMP/results/sources"
          test "$(uname -m)" = x86_64
          uname -smr > "$RUNNER_TEMP/results/worker"
      - name: Install the checked release of runsc with its sidecars
        id: systrap
        if: always()
        run: |
          set -euo pipefail
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          dir="$RUNNER_TEMP/runtime"
          mkdir -p "$dir"
          curl -fsSLo "$dir/gvisor.tar.zstd" 'https://storage.googleapis.com/gvisor/releases/release/20261026.0/x86_64/gvisor.tar.zstd'
          (cd "$dir" && echo 'e6aa030fb8379fe92b53e9b8b696419e0dce8a3bbcc7d4c1cf76b2ea3d6569eabd7360e694deda6ccbdcd77095b3e82ca0f90a3d8fd13a3e5d6b11cd29fe4649  gvisor.tar.zstd' | sha512sum -c - && tar --zstd -xf gvisor.tar.zstd)
          bin=$(find "$dir" -type f -name runsc)
          test -x "$bin"
          "$bin" --version | tee "$RUNNER_TEMP/results/runtime-version"
          sudo "$bin" install --runtime=gsutil-systrap -- --platform=systrap
          sudo systemctl reload docker
          for i in {1..20}; do
            if docker info --format '{{json .Runtimes}}' | jq -e 'has("gsutil-systrap")' >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Record plain and sliced component tracker creation under released runsc
        run: python3 test/rbe/gsutil-slices.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-runsc-components
          path: ${{ runner.temp }}/results
          if-no-files-found: error
