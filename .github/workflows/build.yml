name: Check the supplier Go SDK bootstrap shell
on:
  push:
    branches: [qualification/rules-go-supplier-bootstrap-shell]
permissions: {}
jobs:
  bootstrap:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Fetch public immutable source, Bazel and the existing minimal worker
        run: |
          set -eu
          umask 077
          work="$RUNNER_TEMP/sdk-native"
          mkdir -p "$work/results"
          public=https://github.com/tamird/gvisor.git
          git init -q .
          GIT_TERMINAL_PROMPT=0 git fetch -q --depth=4 "$public" "$GITHUB_SHA"
          git checkout -q --detach "$GITHUB_SHA"
          test "$(cat .bazelversion)" = 9.3.1
          git diff --exit-code f86924e215f07e2ef382865df136b750671da0c6 HEAD -- . ':!MODULE.bazel' ':!.github/workflows/build.yml' ':!.github/qualification/sdk_links.py' ':!test/rbe/sdk_links'
          prior=e89646dda45516a7fe54427a0586a39dc20a7db3
          GIT_TERMINAL_PROMPT=0 git fetch -q --depth=1 "$public" "$prior"
          mkdir -p test/rbe/release_prewarmer
          git show "$prior:test/rbe/release_prewarmer/BUILD" > test/rbe/release_prewarmer/BUILD
          echo 'ae1f23a11f3cb747fbec49a34c510c5ab9dcb75d06d94bfd4d9a49d50c629271  test/rbe/release_prewarmer/BUILD' | sha256sum -c -
          curl --proto '=https' --proto-redir '=https' -fsSL --max-time 120 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$work/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $work/bazel" | sha256sum -c -
          chmod 700 "$work/bazel"
          mkdir -p "$work/distdir"
          package=busybox-static_1.36.1-6ubuntu3.1_amd64.deb
          pin=944b2728f53ceb3916cec2c962873c9951e612408099601751db2a0a5d81e0ed
          for archive in https://security.ubuntu.com/ubuntu https://archive.ubuntu.com/ubuntu https://ubuntu.osuosl.org/ubuntu https://azure.archive.ubuntu.com/ubuntu; do
            url="$archive/pool/main/b/busybox/$package"
            if curl -4 --proto '=https' --proto-redir '=https' -fsSL --connect-timeout 7 --max-time 25 "$url" -o "$work/distdir/$package" && echo "$pin  $work/distdir/$package" | sha256sum -c -; then
              printf '{"url":"%s","sha256":"%s"}\n' "$url" "$pin" > "$work/results/locked-package.json"
              break
            fi
          done
          test -s "$work/results/locked-package.json"
      - name: Compare the SDK builder, pack and covdata on the pinned minimal worker
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          work="$RUNNER_TEMP/sdk-native"
          rc="$work/remote.bazelrc"
          trap 'rm -f "$rc"' EXIT
          : "${BUILDBUDDY_API_KEY:?missing fork key}"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -EsB .github/qualification/sdk_links.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: supplier-go-sdk-shell
          path: ${{ runner.temp }}/sdk-native/results/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove coordinator-only files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/sdk-native"
