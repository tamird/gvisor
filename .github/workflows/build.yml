name: Read the original native bridge assertion
on:
  push:
    branches: [qualification/bridge-mtu-native-original]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      REPORTER: 6b3fe9ab6c03facafe6340c85f8d60ca3591566b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind the original native failure receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/tamird/gvisor/actions/artifacts/13283495690/zip > "$RUNNER_TEMP/bridge-original.zip"
      - name: Read only the original native bridge reports
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/bridge-public"
          cp .github/qualification/bridge_mtu.py "$RUNNER_TEMP/"
          test "$(git rev-parse HEAD^)" = d4c958bc8681caf621a07098b5a5ca5b81309167
          resolver=680739b629229eb1c8fa91aa1147d1bca71eb04f
          git fetch --quiet --depth=1 origin "$REPORTER" "$resolver"
          for helper in unit_matrix qualification_report; do
            git show "$REPORTER:test/rbe/$helper.py" > "$RUNNER_TEMP/$helper.py"
          done
          git show "$resolver:test/rbe/cas_inputs.py" > "$RUNNER_TEMP/cas_inputs.py"
          python3 -B "$RUNNER_TEMP/bridge_mtu.py" --original-native
      - name: Check the compact public receipt
        if: always()
        id: privacy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'bridge-public'
          assert {p.name for p in directory.iterdir()} == {'verdict.json'}
          path = directory / 'verdict.json'
          assert path.is_file() and not path.is_symlink()
          data = path.read_text()
          assert len(data.encode()) < 128 * 1024
          for name in ('BUILDBUDDY_API_KEY', 'GH_TOKEN'):
              value = os.environ[name]
              assert value and value not in data and json.dumps(value)[1:-1] not in data
          assert not re.search(r'(?i)(?:authorization|x-buildbuddy-api-key)\s*[:=]|github_pat_|gh[pousr]_', data)
          json.loads(data)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: bridge-native-original-reports
          path: ${{ runner.temp }}/bridge-public/verdict.json
          if-no-files-found: error
