name: Compare the MySQL log and authenticated TCP readiness
on:
  push:
    branches: [qualification/mysql-cold-start-54914]
permissions: {}
jobs:
  smoke:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - name: Check out the source from Buildkite 54914
        run: |
          set -eu
          git init -q .
          git fetch -q --no-tags --depth=2 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git checkout -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 73e36937be2ecbd264d34ac7ef37550b9f2e71d0
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/mysql_measure.py'
          inputs=c3569a60dc1836ac6fad05e86d7951866c796b4f
          assets=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
          prep=1dd5c8738089670485a347cfb85dad07b92d0e0d
          git fetch -q --no-tags --depth=1 https://github.com/tamird/gvisor.git "$inputs" "$assets" "$prep"
          mkdir -p "$RUNNER_TEMP/recvbuf/dist" "$RUNNER_TEMP/podman-tools"
          git show "$prep:.github/qualification/go_branch_netgofer.py" > "$RUNNER_TEMP/podman-tools/previous.py"
          git show "$assets:.github/qualification/recvbuf_deps.py" > "$RUNNER_TEMP/podman-tools/public_assets.py"
          git show "$inputs:.github/qualification/tldk_public_inputs.py" > "$RUNNER_TEMP/podman-tools/tldk_public_inputs.py"
          cd "$RUNNER_TEMP/podman-tools"
          test "$(git hash-object previous.py)" = 0c1db7071558c5f9c8de45b60ba625183bd8a400
          test "$(git hash-object public_assets.py)" = 9a3f571087a1438113a3a067c300e26fcb0ca9e8
          test "$(git hash-object tldk_public_inputs.py)" = 1f3f7d4d75810ad60941772776e01f3b71b3b171
          curl -qfsSL --retry 2 --max-time 120 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel' | sha256sum -c -
          chmod +x bazel
      - name: Measure the canonical MySQL test on its original runtime
        run: |
          set -eu
          mkdir -m 700 "$RUNNER_TEMP/mysql-54914"
          env -i PATH="/usr/local/bin:/usr/bin:/bin" PYTHONPATH="$RUNNER_TEMP/podman-tools" HOME="$HOME" USER="$USER" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B .github/qualification/mysql_measure.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: mysql-cold-start
          path: ${{ runner.temp }}/mysql-54914/
          if-no-files-found: error
          retention-days: 30
