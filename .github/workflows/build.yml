name: Boot the original utility-free-worker releases on native Linux
on:
  push:
    branches: [qualification/chainguard-release-native-guests]
permissions:
  contents: read
jobs:
  guest:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, host: ubuntu-22.04, machine: x86_64}
          - {arch: arm64, host: ubuntu-22.04-arm, machine: aarch64}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Verify the native host, established rootless fixture and original archive identities
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD^)" = e19812e6f1dfb3b94dafccf0908f4ddffdac078c
          test "$(git rev-parse HEAD^^)" = bb983b988802b854bd03dd7a0a5220e7e7b4440e
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/chainguard_guest/**'
          test "$(uname -m)" = '${{ matrix.machine }}'
          test "$(id -u)" -ne 0
          command -v pivot_root
          d="$RUNNER_TEMP/chainguard-guest"
          mkdir -m 700 "$d"
          cp .github/qualification/chainguard_guest/{expected.json,fetch.py,boot.py} "$d/"
          cp test/rbe/{native_cross_inputs,runtime_cross,runtime_guest}.py "$d/"
          cd "$d"
          sha256sum -c <<'HASHES'
          b0626fb5ecb5bb9c41d644ced5af036019cbefbeef7975c71878021f6e146653  native_cross_inputs.py
          32cc74e3f3e8189d9678b609a4058e60ea3a1e955566f229b34dc04b81f973c8  runtime_cross.py
          bce1d88d73ba07ca283697e2b9215eb06f1e2f2baacfb43130762ff914d27524  runtime_guest.py
          HASHES
      - name: Recover the original archive for this CPU from the single recorded build
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -IB "$RUNNER_TEMP/chainguard-guest/fetch.py" '${{ matrix.arch }}'
      - name: Run the extracted release in private rootless namespaces without credentials
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/chainguard-guest"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$d/boot.py" '${{ matrix.arch }}'
      - name: Retain bounded original-object and native guest results independently
        id: collect
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/chainguard-guest"
          mkdir -p "$d/publish"
          for name in fetch runtime; do
            p="$d/$name.json"
            if [[ -f "$p" && ! -L "$p" ]] && test "$(wc -c <"$p")" -lt 32768 &&
                jq -e --arg a '${{ matrix.arch }}' '.arch==$a and .invocation=="078dbb74-7b6d-44e9-a00f-276d3b82d5de"' "$p" >/dev/null &&
                ! grep -Eiq 'x-buildbuddy-api-key|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}' "$p"; then
              cp "$p" "$d/publish/$name.json"
            fi
          done
          test -f "$d/publish/fetch.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.collect.outcome == 'success'
        with:
          name: original-release-native-guest-${{ matrix.arch }}
          path: ${{ runner.temp }}/chainguard-guest/publish/*.json
          retention-days: 14
          if-no-files-found: error
      - name: Require original bytes and the selected native Sentry
        if: always() && steps.collect.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/chainguard-guest/publish"
          jq -e '.verified' "$d/fetch.json"
          jq -e '.verified and (.installed|length==9)' "$d/runtime.json"
