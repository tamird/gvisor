name: Recover two original graph race test reports
on:
  push:
    branches: [qualification/state-graph-emission-race-receipt]
permissions:
  contents: read
  actions: read
jobs:
  originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 3
      - name: Read original state race reports
        id: joint
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 -B test/rbe/graph_race_receipt.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: graph-race-original
          path: ${{ runner.temp }}/graph-race-original.json
          if-no-files-found: error
