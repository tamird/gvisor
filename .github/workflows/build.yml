name: Read original Buildifier diagnostics
on: workflow_dispatch
permissions: {contents: read}
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Read the two fixed original BuildBuddy invocations
        env:
          ORIGINAL_READ_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B .github/qualification/buildifier-declared/original.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: buildifier-original
          path: ${{ runner.temp }}/original-diagnostics.json
          if-no-files-found: error
