name: Verify bazel_lib source and generated license catalog
on:
  push:
    branches: [qualification/bazel-lib-native-arch]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Compare registry pin, actual archive and release notice
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bazel-lib-catalog"
          mkdir "$out"
          python3 - "$out" <<'PY'
          import base64,hashlib,io,json,sys,tarfile,urllib.request
          from pathlib import Path
          out=Path(sys.argv[1])
          def get(url):
              with urllib.request.urlopen(url,timeout=50) as response: return response.read()
          src=json.loads(get("https://bcr.bazel.build/modules/bazel_lib/3.4.0/source.json"))
          arc=get(src["url"]);sha=hashlib.sha256(arc).hexdigest()
          assert sha==base64.b64decode(src["integrity"].removeprefix("sha256-")).hex()=="3f4abcf708b83ca040cb6b36fa5f8871d60f136b5f7d3c697b6da3343b9ec1da"
          commit="c511ac0a18bc16d98969b92b38fcea4ecbde96e9"
          with tarfile.open(fileobj=io.BytesIO(arc),mode="r:gz") as t:
              root=src["strip_prefix"]+"/";notice=t.extractfile(root+"LICENSE").read()
              assert notice==get("https://raw.githubusercontent.com/bazel-contrib/bazel-lib/"+commit+"/LICENSE")
              assert b"Apache License" in notice
          (out/"provenance.json").write_text(json.dumps({"sha256":sha,"bytes":len(arc),"source":src["url"],"supplier_commit":commit,"license_sha256":hashlib.sha256(notice).hexdigest()},indent=2))
          PY
      - name: Regenerate master’s catalog and verify
        env:
          MAKEFLAGS: DOCKER_BUILD=false
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bazel-lib-catalog"
          cp tools/licensecheck/dependencies.yaml "$out/before.yaml"
          bazelisk run //tools/licensecheck/main:licensecheck -- --mode=fetch > "$out/fetch.log" 2>&1 || { tail -50 "$out/fetch.log"; exit 1; }
          cp tools/licensecheck/dependencies.yaml "$out/generated.yaml"
          git diff -- tools/licensecheck/dependencies.yaml > "$out/generated.diff"
          bazelisk run //tools/licensecheck/main:licensecheck -- --mode=verify > "$out/verify.log" 2>&1 || { tail -50 "$out/verify.log"; exit 1; }
          python3 - "$out" <<'PY'
          import json,sys,re
          from pathlib import Path
          out=Path(sys.argv[1]); get=lambda path: {m.group(1):m.group(0) for m in re.finditer(r"(?ms)^- dependency: ([^\n]+)\n.*?(?=^- dependency: |\Z)",(out/path).read_text())}
          before,after=get("before.yaml"),get("generated.yaml"); diffs={k for k in before.keys()|after.keys() if before.get(k)!=after.get(k)}
          result={"before":len(before),"after":len(after),"changed":sorted(diffs),"bazel_lib":after["bazel_lib"]}
          print(json.dumps(result,indent=2))
          (out/"result.json").write_text(json.dumps(result,indent=2))
          assert "bazel_lib" in diffs and "c511ac0a18bc16d98969b92b38fcea4ecbde96e9" in after["bazel_lib"] and "3f4abcf708b83ca040cb6b36fa5f8871d60f136b5f7d3c697b6da3343b9ec1da" in after["bazel_lib"] and "Apache-2.0" in after["bazel_lib"]
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bazel-lib-catalog
          path: ${{ runner.temp }}/bazel-lib-catalog
          if-no-files-found: error
