name: Verify the three original Nogo scratch actions
on:
  push:
    branches: [qualification/native-nogo-originals]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false}
    - name: Reuse the established CAS decoder
      run: |
        set -eu
        curl -fsSL --max-time 90 https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 -o "$RUNNER_TEMP/bb"
        echo "205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  $RUNNER_TEMP/bb" | sha256sum -c -
        chmod 0500 "$RUNNER_TEMP/bb"
    - name: Read the Nogo inputs and logs from the three original actions
      env:
        GH_TOKEN: ${{ github.token }}
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 test/rbe/native_packages/recover_nogo.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: original-native-nogo-inputs
        path: ${{ runner.temp }}/native-nogo-original.json
        if-no-files-found: error
