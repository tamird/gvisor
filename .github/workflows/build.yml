name: AMD64 pinring executable identity

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinring-kvm:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/pinring-amd64-elf-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the source qualified on RBE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 87d2a5dcdd113aff1dad7018ffd5d11a2a4abd66
          persist-credentials: false

      - name: Run the matching AMD64 executable with KVM
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 87d2a5dcdd113aff1dad7018ffd5d11a2a4abd66
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          sudo -n test -r /dev/kvm
          sudo -n test -w /dev/kvm
          uname -srmo
          ls -l /dev/kvm
          df -h "$PWD"

          # Keep this gate at the exec boundary: Bazel must not run a second
          # configuration's binary after we verify the first.
          cat > "$RUNNER_TEMP/verified-pinring" <<'GATE'
          #!/bin/bash
          set -euo pipefail
          expected=5e076a06708ed3d5f30da6f6fe8fbdbf9ec3c14f58e586753fe1fe62e9a364ec
          actual=$(sha256sum -- "$1" | cut -d' ' -f1)
          printf 'pinring ELF: expected %s, observed %s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          exec sudo -n --preserve-env=XML_OUTPUT_FILE,TEST_SRCDIR,TEST_TMPDIR,TEST_WORKSPACE,GO_TEST_RUN_FROM_BAZEL,GO_TEST_WRAP_TESTV -- "$@"
          GATE
          chmod 755 "$RUNNER_TEMP/verified-pinring"

          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          printf '%s\n' //pkg/pinring:pinring_test > "$RUNNER_TEMP/pinring.targets"
          bazelisk test --lockfile_mode=error --config=x86_64 --config=unit \
            --define=rbe=true --define=gvisor_test_clock_source=calibrated \
            --extra_execution_platforms=//tools/bazeldefs:rbe_linux_amd64,//tools/bazeldefs:rbe_linux_arm64 \
            --strip=never --spawn_strategy=local --strategy=TestRunner=local \
            --strategy=GoStdlib=linux-sandbox \
            --strategy=GoStdlibList=linux-sandbox \
            --nocache_test_results --runs_per_test=1 --flaky_test_attempts=1 \
            --test_env=GO_TEST_RUN_FROM_BAZEL=1 --test_env=GO_TEST_WRAP_TESTV=1 \
            --test_env=GVISOR_TEST_CLOCK_SOURCE=calibrated --test_output=errors \
            "--run_under=$RUNNER_TEMP/verified-pinring" \
            '--test_arg=-test.run=^TestKVMVMDeferredRelease$' \
            "--target_pattern_file=$RUNNER_TEMP/pinring.targets"

          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = Path("bazel-testlogs/pkg/pinring/pinring_test")
          cases = list(ET.parse(reports / "test.xml").iter("testcase"))
          if len(cases) != 1 or cases[0].get("name") != "TestKVMVMDeferredRelease":
              raise SystemExit("The original XML does not contain the single selected KVM case")
          if any(c.tag in ("skipped", "error", "failure") for c in cases[0]):
              raise SystemExit("KVM case skipped or failed")
          log = (reports / "test.log").read_text()
          timings = [line.strip() for line in log.splitlines() if "p50: plain=" in line and "with deferral=" in line]
          identities = [line for line in log.splitlines() if line.startswith("pinring ELF: expected")]
          if len(timings) != 1 or len(identities) != 1:
              raise SystemExit("Missing executable identity or real KVM teardown measurements")
          print(json.dumps({"source": "87d2a5dcdd113aff1dad7018ffd5d11a2a4abd66",
                            "identity": identities[0], "case": cases[0].get("name"),
                            "passed": 1, "failed": 0, "skipped": 0, "missing": 0,
                            "teardown": timings[0]}))
          PY
