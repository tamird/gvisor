name: Diagnose the Gazelle query regression on two sources
on:
  push:
    branches: [qualification/gazelle-supplier-query-diagnostic]
permissions:
  contents: read
jobs:
  downstream:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Pin the compiler, upstream header policy and Linux client
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2eaef0c7d5a096c61189f930f86f8f1767f7e027
          test "$(git rev-parse HEAD^^)" = 919ef9f19ae3c55ec66808abbd39ded804806a42
          d="$RUNNER_TEMP/downstream-llvm"
          mkdir -p "$d"
          cp .github/qualification/{downstream_llvm,supplier_gazelle}.py "$d/"
          cp .github/qualification/gazelle_master_env.patch "$d/supplier.patch"
          echo "fbf9fadc326d34e9f7a0c2860c05beaad93cd7c31ebef951c1241da8a390a191  $d/downstream_llvm.py" | sha256sum -c -
          echo "09a13a97ad6abcb783110876893adffbcc428914da68ec6cb1c45d56ce3fe95f  $d/supplier.patch" | sha256sum -c -
          curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' https://codeload.github.com/bazel-contrib/bazel-gazelle/tar.gz/8b89ee9f6d3c920911bf6ff73fabd4e86b4b9c3e -o "$d/supplier.tar.gz"
          echo "f315fe81ebaa871be7fa4da1e86f3432fec5aa94788f096c601a5af2366a5e46  $d/supplier.tar.gz" | sha256sum -c -
          echo '{"passed":false,"phase":"bootstrap"}' > "$d/result.json"
          curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazelisk"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazelisk" | sha256sum -c -
          chmod 755 "$d/bazelisk"
      - name: Inspect only the two supplier regression tests and direct queries
        run: python3 -B "$RUNNER_TEMP/downstream-llvm/supplier_gazelle.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: downstream-llvm-vdso
          path: ${{ runner.temp }}/downstream-llvm/result.json
          if-no-files-found: error
