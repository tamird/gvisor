name: Native cgroup qualification
"on": workflow_dispatch

permissions:
  contents: read

jobs:
  cgroup:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/native-cgroup-owner' && github.actor == 'tamird'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      QUALIFICATION_COMMIT: d943b4a1776c8c2281cff19eed2ff02a2a892619
      QUALIFICATION_ARCH: arm64
      QUALIFICATION_EXECUTION: remote-actions
      QUALIFICATION_LANES: test
      QUALIFICATION_TARGETS: //runsc/cgroup:cgroup_test_arm64
      QUALIFICATION_CLOCK_SOURCE: calibrated
      QUALIFICATION_HEADER_BASE: ''
      QUALIFICATION_COS_GZIP_BASE64: ''
      QUALIFICATION_COS_SHA256: ''
      QUALIFICATION_LOCAL_TEST_REQUIREMENTS: namespace
    steps:
      - name: Check out the qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false

      - name: Check out the exact mixed-unit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.QUALIFICATION_COMMIT }}
          path: product
          persist-credentials: false

      - name: Prepare the checked source and native execution platforms
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          [[ $(uname -m) == aarch64 && $(id -u) != 0 ]]
          [[ $(git rev-parse HEAD) == "$QUALIFICATION_COMMIT" ]]
          [[ $(git rev-parse 'HEAD^{tree}') == 862713de2e4ed5f6ed6963c3bce2aa20fc7ee1d8 ]]
          [[ -z $(git status --porcelain) && ! -e test/rbe && ! -e MODULE.bazel.lock ]]
          mkdir test/rbe
          cp ../harness/test/rbe/{actions.sh,credential_artifacts.py,go_required_cases.py,qualification_report.py,unit_matrix.py,qualification.bazelrc} test/rbe/
          install -m 0755 ../harness/.github/native-cgroup-test.sh test/rbe/qualify.sh
          cp ../harness/.github/native-unit-platforms.BUILD test/rbe/BUILD
          cp ../harness/test/benchmarks/{lifecycle,unit}.json test/benchmarks/
          export USE_BAZEL_VERSION="$(cat images/default/bazelversion)"
          bazelisk cquery --config=x86_64 --compilation_mode=opt --lockfile_mode=update \
            --extra_execution_platforms=//test/rbe:native_amd64,//test/rbe:native_arm64 \
            --host_platform=@io_bazel_rules_go//go/toolchain:linux_amd64_cgo \
            "$QUALIFICATION_TARGETS"
          [[ -s MODULE.bazel.lock && -z $(git status --porcelain --untracked-files=no) ]]
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          files = [Path("runsc/cgroup") / f for f in ("cgroup_test.go", "cgroup_v2_test.go", "systemd_test.go")]
          cases = sorted(name for f in files for name in re.findall(r"^func (Test\w+)\(t \*testing\.T\)", f.read_text(), re.M))
          if len(cases) != len(set(cases)) or not {"TestCreateController", "TestInstall", "TestUninstallEnoent"} <= set(cases):
              raise ValueError("Cgroup test inventory differs")
          p = Path(os.environ["RUNNER_TEMP"]) / "cgroup-cases.json"
          p.write_text(json.dumps({os.environ["QUALIFICATION_TARGETS"]: cases}) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as out:
              print(f"QUALIFICATION_GO_REQUIRED_CASES={p}", file=out)
          PY

      - name: Run the original ARM target with the existing reporter
        working-directory: product
        id: qualification
        timeout-minutes: 35
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bash test/rbe/actions.sh

      - name: Retain the verified qualification bundle
        if: always() && steps.qualification.outputs.artifacts_safe == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-native-cgroup-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualification.tar.gz
            ${{ runner.temp }}/qualification/verdict.json
          if-no-files-found: error
