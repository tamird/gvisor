name: Compare two published recovery proposals on a Linux receiver
on:
  push:
    branches: [qualification/tcp-proxy-terminal-proposals]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/tcp-proxy-terminal-proposals'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 6, persist-credentials: false}
    - name: Recover the verified original observations
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api repos/tamird/gvisor/actions/artifacts/13154773163/zip > "$RUNNER_TEMP/original.zip"
        echo "a5828142f146b7f5f4928c5376a2c70c484ba7e2c96b7b93f0e9c50316c8600d  $RUNNER_TEMP/original.zip" | sha256sum --check
    - name: Prepare the existing native Linux TCP tools
      run: |
        set -euo pipefail
        sudo -n apt-get update -qq
        sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark tcpdump iproute2 iperf3 ethtool bc kmod iputils-ping strace
        sudo -n modprobe sch_netem
    - name: Bind the experiment and build exactly two native sender variants
      run: |
        set -euo pipefail
        flight=4189b8df0a1d7c27e873fcb071462ee012fddbfa
        boundary=8dccc94866058d9a8f7c9ec588c99a6ba96dc6bf
        test "$(git rev-parse "$boundary^")" = "$flight"
        test "$(git rev-parse "$flight^")" = b779a7dcd19ab980c4e8893ca7c19707f8aaa907
        git fetch --no-tags --depth=1 https://github.com/tamird/gvisor.git 918aefd5f3771a161013fb72873d8aa19196e1bc bd4522d257ee43bb8d0a4c3852b63f58aac22438 00aaa82b9e9cda8dc25dbe1df6e07a56c68302c5 99058130824e4d3166bf0e376f9b15b6ad50146c 5fd5532c13b7e4a17477430fe0ce2f5dc18b599f
        python3 test/rbe/tcp_proxy_source_contrast.py
        test -z "$(git diff --name-only "$boundary" HEAD -- pkg test/benchmarks/tcp ':(exclude)test/benchmarks/tcp/tcp_benchmark.sh')"
        for arm in flight boundary; do
          sha=${!arm}
          git switch --detach "$sha"
          EXPECT_SOURCE="$sha" RUNNER_TEMP="$RUNNER_TEMP/$arm" python3 test/rbe/tcp_mss_forwarder.py build
        done
        git switch --detach "$GITHUB_SHA"
    - name: Run loss and clean controls on both variants
      run: python3 test/rbe/tcp_burst_proxy.py
    - name: Validate the typed publication
      id: privacy
      if: always()
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        for p in "$RUNNER_TEMP/flight" "$RUNNER_TEMP/boundary" "$RUNNER_TEMP"; do
          if test -d "$p/mss-forwarder/public"; then RUNNER_TEMP="$p" python3 test/rbe/tcp_mss_forwarder.py scan; fi
        done
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.privacy.outcome == 'success' }}
      with:
        name: tcp-proxy-terminal-proposals
        path: |
          ${{ runner.temp }}/flight/mss-forwarder/public/build.json
          ${{ runner.temp }}/boundary/mss-forwarder/public/build.json
          ${{ runner.temp }}/mss-forwarder/public/result.json
        if-no-files-found: error
