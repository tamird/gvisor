name: Verify passive SYN-ACK retries and handshake RTT
on:
  push:
    branches: [qualification/tcp-handshake-owned-options]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      MASTER: bc9ffcc0dab81dacb713ea60879fa5bde6e31689
      STALE: f876811701c022fdb3154f5a7c3c78c3c0a4c2d0
      FIXSOURCE: 5a36400ea04ab713d801200aab14f99d49217040
      PRODUCT: 3c8aa1d51dcfb99a39d967c45046483cd42c561d
      FIXTURE: test/packetimpact/tests/tcp_acceptable_ack_syn_rcvd_test.go
      PROPS: test/packetimpact/runner/defs.bzl
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 6, persist-credentials: false}
    - name: Prepare the existing GNU coordinator and Firecracker worker
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^)" = "$FIXSOURCE"
        test "$(git rev-parse "$FIXSOURCE^")" = "$PRODUCT"
        test "$(git rev-parse "$PRODUCT^")" = "$MASTER"
        test "$(git diff --name-only "$MASTER" "$PRODUCT")" = "$(printf '%s\n' pkg/tcpip/transport/tcp/connect.go "$FIXTURE")"
        proof=$RUNNER_TEMP/proof
        mkdir -p "$proof" "$RUNNER_TEMP/records" "$RUNNER_TEMP/platform"
        printf '{"verdict":"INCOMPLETE","executed":[]}\n' > "$proof/verdict.json"
        cp test/rbe/duplicate_syn_wire.py "$RUNNER_TEMP/"
        props=7d8e856ba30ef0271690d13d2ddb1c07111a558a
        reporter=599cb05aecfb107e07f81b8591a009cb12d6ffa7
        git fetch -q --no-tags --depth=2 origin "$props" "$reporter" "$STALE"
        git diff "$props^" "$props" -- "$PROPS" > "$RUNNER_TEMP/exec.patch"
        git show "$reporter:test/rbe/qualification_report.py" > "$RUNNER_TEMP/qualification_report.py"
        git show "$reporter:test/rbe/unit_matrix.py" > "$RUNNER_TEMP/unit_matrix.py"
        git show "$FIXSOURCE:$FIXTURE" > "$RUNNER_TEMP/fixture.go"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","EstimatedMemory":"2GB","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --init --name tcp-compiler --entrypoint /bin/bash --user root --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/gcc"
    - name: Observe both packet responses before the initial timeout
      run: |
        set -euo pipefail
        runarm() {
          arm=$1; source=$2; limit=$3; shift 3
          d=$RUNNER_TEMP/records/$arm; mkdir -p "$d"
          git checkout --quiet --detach "$source"
          test "$(git rev-parse HEAD)" = "$source"
          git diff --quiet HEAD --
          if [[ "$arm" != owners ]]; then cp "$RUNNER_TEMP/fixture.go" "$FIXTURE"; fi
          git apply "$RUNNER_TEMP/exec.patch"
          printf '%s\n' "$source" > "$d/source"
          printf '%s\n' "$@" > "$d/labels"
          date -u +%FT%T.%3NZ > "$d/start"
          flags=(); id="$(cat /proc/sys/kernel/random/uuid)"; printf '%s\n' "$id" > "$d/invocation"
          if [[ "$arm" == owners ]]; then flags+=('--test_filter=^Test(SYNRetransmit|HandshakeTimeoutConnectedCount|TCPDeferAccept)$'); fi
          rc=0
          timeout -k 10s "$limit" docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=48 "--invocation_id=$id" "${flags[@]}" --strategy=TestRunner=remote --nocache_test_results --keep_going --test_sharding_strategy=disabled --test_output=errors --test_timeout=400 --test_env=GO_TEST_WRAP_TESTV=1 --build_event_json_file="$d/bep" "$@" > "$d/build.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$d/exit"
          date -u +%FT%T.%3NZ > "$d/finish"
          for label in "$@"; do
            key=${label##*:}; path=${label#//}; path=${path/:/\/}
            mkdir -p "$d/$key"
            for file in test.log test.xml; do
              docker exec tcp-compiler cat "bazel-testlogs/$path/$file" > "$d/$key/$file" || true
            done
          done
          git restore --source=HEAD -- "$PROPS" "$FIXTURE"
          git diff --quiet HEAD --
        }
        native=//test/packetimpact/tests:tcp_acceptable_ack_syn_rcvd_native_test
        netstack=//test/packetimpact/tests:tcp_acceptable_ack_syn_rcvd_netstack_test
        git checkout --quiet --detach "$PRODUCT"
        docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" query "set($native $netstack //pkg/tcpip/transport/tcp:tcp_nogo //pkg/tcpip/transport/tcp/test/e2e:tcp_test)" --output=label > "$RUNNER_TEMP/target-labels" 2> "$RUNNER_TEMP/query.log"
        diff -u <(printf '%s\n' "$native" "$netstack" //pkg/tcpip/transport/tcp:tcp_nogo //pkg/tcpip/transport/tcp/test/e2e:tcp_test | sort) <(sort "$RUNNER_TEMP/target-labels")
        runarm native "$PRODUCT" 15m "$native"
        runarm fixed "$PRODUCT" 9m "$netstack"
        runarm owners "$PRODUCT" 28m //pkg/tcpip/transport/tcp/test/e2e:tcp_test //pkg/tcpip/transport/tcp:tcp_nogo
    - name: Check original invocations, wire cases and detailed reports
      if: always()
      run: python3 -B "$RUNNER_TEMP/duplicate_syn_wire.py"
    - name: Verify the original report allowlist
      if: always()
      id: privacy
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYSAFE'
        import os
        from pathlib import Path
        proof = Path(os.environ["RUNNER_TEMP"]) / "proof"
        key = os.environ["BUILDBUDDY_API_KEY"].encode()
        names = {"verdict.json"} | {arm + suffix for arm in ("native", "stock", "stale", "fixed") for suffix in (".xml", ".log")}
        files = list(proof.iterdir())
        assert key and files and {p.name for p in files} <= names
        for p in files:
            assert p.is_file() and not p.is_symlink()
            data = p.read_bytes()
            assert key not in data and b"x-buildbuddy-api-key" not in data.lower()
        PYSAFE
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.privacy.outcome == 'success'
      with:
        name: passive-duplicate-syn-and-timestamp
        path: ${{ runner.temp }}/proof/verdict.json
        if-no-files-found: error
