name: Check OCI TCP buffer isolation and startup cost
on:
  push:
    branches: [qualification/tcp-oci-direct-settings]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: ${{ github.sha }}
      BASE: 8a84b240f0f85882e3aacb5b550476fe09e11e25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 6, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD)" == "$CURRENT" ]]
        [[ "$(git rev-parse HEAD^)" == "e290b349e0d5d5e92ed816f30599112870f5c811" && "$(git rev-parse HEAD^^)" == "$BASE" ]]
        git checkout --quiet --detach "$CURRENT"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt systempaths=unconfined -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Check OCI settings, checkpoint restore, and private network startup
      run: |
        set -euo pipefail
        d=$RUNNER_TEMP/records
        git rev-parse HEAD > "$d/source"
        git diff --exit-code e290b349e0d5d5e92ed816f30599112870f5c811 HEAD -- . ':(exclude).github/workflows/build.yml' ':(exclude)runsc/container/container_test.go' ':(exclude)test/rbe/tcp_oci_native.py' ':(exclude)test/rbe/tcp_oci_scope.py'
        echo "d75eae2faf013277ec0f7cce4e18b9102495dee8e4e0684f0725c44b9058316c  runsc/container/container_test.go" | sha256sum --check
        echo "72a49d3fd747eede6a970c909c09ccbed85b53e81079d950f942d92bddab94ef  test/rbe/tcp_oci_native.py" | sha256sum --check
        echo "ace4f2fa77e20095851111b6fa8e82aa910a586c25a1dceb2b897f117aeaee37  test/rbe/tcp_oci_scope.py" | sha256sum --check
        git diff --name-only "$BASE" HEAD > "$d/source-files"
        native_rc=0
        python3 test/rbe/tcp_oci_native.py > "$d/native.json" 2> "$d/native.log" || native_rc=$?
        printf '%s\n' "$native_rc" > "$d/native-exit"
        date -u +%FT%TZ > "$d/start"
        rc=0
        docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=20 --local_resources=cpu=1 --noremote_upload_local_results --strategy=GoStaticAnalysis=local --strategy=GoStandardLibraryAnalysis=local --test_filter='^TestTCPBuffer(OCIAndGuestWrite|Isolation|Sysctls)$' --test_arg=-test.v --test_timeout=600 --test_sharding_strategy=disabled --nocache_test_results --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' //runsc/container:container_test > "$RUNNER_TEMP/bazel.log" 2>&1 || rc=$?
        date -u +%FT%TZ > "$d/end"
        printf '%s\n' "$rc" > "$d/exit"
        grep -E 'Invocation ID:|ERROR:|FAILED|Build did NOT' "$RUNNER_TEMP/bazel.log" | tail -30 > "$d/diagnostics" || true
        for f in test.log test.xml; do
          docker exec tcp-compiler cat "bazel-testlogs/runsc/container/container_test/$f" > "$d/$f" || rm -f "$d/$f"
        done
        python3 test/rbe/tcp_oci_scope.py "$d" "$CURRENT"
    - name: Redact credentials from the evidence bundle
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key=os.environ["BB_KEY"].encode()
        for f in (Path(os.environ["RUNNER_TEMP"])/"records").rglob("*"):
            if f.is_file() and key and key in (data:=f.read_bytes()):
                f.write_bytes(data.replace(key,b"[REDACTED]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: tcp-oci-direct-and-restore
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
