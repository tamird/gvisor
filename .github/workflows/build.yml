name: Measure standard Buildifier test behavior
on: workflow_dispatch
permissions:
  contents: read
jobs:
  upstream:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Compare declared supplier tests and the native formatter
        working-directory: .github/qualification/upstream-format
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          export PROOF_RC="$RUNNER_TEMP/upstream-format.bazelrc"
          umask 077
          trap 'rm -f "$PROOF_RC"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --remote_download_outputs=toplevel'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$PROOF_RC"
          unset BUILDBUDDY_API_KEY
          python3 -B observe.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: upstream-format
          path: ${{ runner.temp }}/upstream-format-result.json
          if-no-files-found: error
