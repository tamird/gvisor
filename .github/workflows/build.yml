name: Inspect existing release binary identities
on:
  push:
    branches: [qualification/identify-sentry-release-notes]
permissions: {contents: read}
jobs:
  inspect:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false}
    - name: Inspect the checksummed AMD64 and ARM64 binary distributions
      run: python3 test/rbe/inspect_release_notes.py "$RUNNER_TEMP/results"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: release-binary-identities
        path: ${{ runner.temp }}/results
        if-no-files-found: error
