name: Measure TCP control backlog goodput on a paired local link
on:
  push:
    branches: [qualification/tcp-ingress-throughput]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 4
      - name: Compare 12 alternating pairs on this runner
        env:
          STOCK: 8bfd3baaaa91337a2343e165d1717cdcf4202c3b
          FIXED: bc9f8ff58ebae5f1b53ed0ee8075e70e5d6e888e
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/throughput"
          mkdir -p "$out"
          git diff --quiet "$STOCK" "$FIXED" -- . ':(exclude)pkg/tcpip/transport/tcp/segment_queue.go'
          printf '%s\n' "$STOCK" "$FIXED" > "$out/sources"
          git rev-parse "$STOCK:pkg/tcpip/transport/tcp/test/benchmarks" > "$out/fixture"
          [[ $(cat "$out/fixture") = "$(git rev-parse "$FIXED:pkg/tcpip/transport/tcp/test/benchmarks")" ]]
          for round in {0..12}; do
            if ((round%2)); then order="candidate stock"; else order="stock candidate"; fi
            for arm in $order; do
              src="$STOCK"; if [[ "$arm" = candidate ]]; then src="$FIXED"; fi
              git checkout --quiet --detach "$src"
              [[ "$(git rev-parse HEAD)" = "$src" ]]
              export USE_BAZEL_VERSION
              USE_BAZEL_VERSION=$(cat .bazelversion 2>/dev/null || cat images/default/bazelversion)
              rc=0
              bazel test --jobs=4 -c opt --nocache_test_results --test_arg=-test.run='^$' --test_arg=-test.bench='^BenchmarkBulkBatchedLocalhost$' --test_arg=-test.benchtime=1x --test_arg=-test.cpu=2 --test_arg=-test.v //pkg/tcpip/transport/tcp/test/benchmarks:netstack_bench_test > "$RUNNER_TEMP/build.log" 2>&1 || rc=$?
              date -u +%FT%T.%3NZ > "$out/execution-end"
              printf '%s %s %s %s\n' "$arm" "$round" "$src" "$rc" >> "$out/exits"
              if ((rc)); then tail -40 "$RUNNER_TEMP/build.log" | tee "$out/diagnosis"; exit "$rc"; fi
              cp -L bazel-testlogs/pkg/tcpip/transport/tcp/test/benchmarks/netstack_bench_test/test.log "$out/$arm-$round.log"
            done
          done
      - name: Reconcile all transfers, including the warmup pair
        if: always()
        env:
          STOCK: 8bfd3baaaa91337a2343e165d1717cdcf4202c3b
          FIXED: bc9f8ff58ebae5f1b53ed0ee8075e70e5d6e888e
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:test/rbe/ingress_benchmark_result.py" > "$RUNNER_TEMP/result.py"
          python3 "$RUNNER_TEMP/result.py" "$RUNNER_TEMP/throughput"
      - name: Compare measured pairs with the pinned benchstat
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/throughput"
          git fetch --depth=1 origin 2b51abee8530385431b7225198fdd5cd65e78696
          git checkout --quiet --detach 2b51abee8530385431b7225198fdd5cd65e78696
          [[ "$(git rev-parse HEAD)" = 2b51abee8530385431b7225198fdd5cd65e78696 ]]
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat .bazelversion 2>/dev/null || cat images/default/bazelversion)
          bazel run --jobs=4 --config=x86_64 -c opt @org_golang_x_perf//cmd/benchstat -- "$out/stock.bench" "$out/candidate.bench" > "$out/benchstat.txt"
          grep -q 'BulkBatchedLocalhost' "$out/benchstat.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tcp-ingress-performance
          path: ${{ runner.temp }}/throughput
