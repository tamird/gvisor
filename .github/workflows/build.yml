name: Qualify native release handoff
on:
  push:
    branches: [qualification/native-release-handoff]
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PRODUCT: 022243756c585939449201d62a0a3c88139d9698
      IMAGE: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Set the evidence directory
        run: |
          echo "RELEASE_TEMP=$RUNNER_TEMP/native-release" >> "$GITHUB_ENV"
          echo "RESULT=$RUNNER_TEMP/native-release/results" >> "$GITHUB_ENV"
      - name: Identify the product and prepare an isolated signing key
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          git diff --exit-code "$PRODUCT" HEAD -- . ':!.github/workflows/build.yml' ':!test/rbe/nativehandoff'
          mkdir -p "$RESULT" "$RELEASE_TEMP/platform" "$RELEASE_TEMP/no-docker" "$RELEASE_TEMP/gpg"
          chmod 0700 "$RELEASE_TEMP/gpg"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends dpkg-sig apt-utils
          bazelisk version
          GNUPGHOME="$RELEASE_TEMP/gpg" gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'Disposable release test <release@example.invalid>' rsa2048 sign 1d
          GNUPGHOME="$RELEASE_TEMP/gpg" gpg --batch --export-secret-keys > "$RELEASE_TEMP/key"
          chmod 0600 "$RELEASE_TEMP/key"
          cat > "$RELEASE_TEMP/no-docker/docker" <<'SH'
          #!/bin/sh
          touch "$RELEASE_TEMP/docker-attempt"
          exit 59
          SH
          chmod +x "$RELEASE_TEMP/no-docker/docker"
          printf 'module(name="release_platform")\n' > "$RELEASE_TEMP/platform/MODULE.bazel"
          cat > "$RELEASE_TEMP/platform/BUILD" <<EOF
          platform(
              name = "gnu",
              constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
              exec_properties = {"Arch":"amd64", "OSFamily":"linux", "workload-isolation-type":"firecracker", "EstimatedMemory":"6GB", "container-image":"docker://$IMAGE"},
              visibility = ["//visibility:public"],
          )
          EOF
      - name: Build and sign directly; reject an incomplete set
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          rc="$RELEASE_TEMP/private.bazelrc"
          trap 'rm -f -- "$rc"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --jobs=64' "build --inject_repository=release_platform=$RELEASE_TEMP/platform" 'build --host_platform=@release_platform//:gnu' 'build --extra_execution_platforms=@release_platform//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          export PATH="$RELEASE_TEMP/no-docker:$PATH" DOCKER_HOST="unix://$RELEASE_TEMP/no-socket" GNUPGHOME="$RELEASE_TEMP/gpg"
          bash test/rbe/nativehandoff/probe.sh
      - name: Write one verdict
        if: ${{ always() }}
        run: python3 test/rbe/nativehandoff/verdict.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: native-release-handoff
          path: ${{ runner.temp }}/native-release/results
