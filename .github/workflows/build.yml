name: Check recurring TCP cork timeouts
on:
  push:
    branches: [qualification/tcp-cork-timer-compare]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      REPORTER: 6b3fe9ab6c03facafe6340c85f8d60ca3591566b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Run the socket case on Linux and both gVisor senders
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cork-public" "$RUNNER_TEMP/cork-private"
          printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/cork-public/verdict.json"
          test "$(git rev-parse HEAD^)" = f69769dd4a4556762a6391e89f3133cfd6bffc05
          cp .github/qualification/cork_timer.py "$RUNNER_TEMP/"
          git fetch --quiet --depth=1 origin "$REPORTER"
          for helper in unit_matrix qualification_report; do
            git show "$REPORTER:test/rbe/$helper.py" > "$RUNNER_TEMP/$helper.py"
          done
          python3 -m py_compile "$RUNNER_TEMP/cork_timer.py" "$RUNNER_TEMP/qualification_report.py" "$RUNNER_TEMP/unit_matrix.py"
          mkdir "$RUNNER_TEMP/cork-platform"
          echo 'module(name="cork_gnu")' > "$RUNNER_TEMP/cork-platform/MODULE.bazel"
          cat > "$RUNNER_TEMP/cork-platform/BUILD" <<'BUILD'
          platform(
              name = "gnu",
              constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
              exec_properties = {
                  "Arch": "amd64",
                  "OSFamily": "linux",
                  "workload-isolation-type": "firecracker",
                  "dockerUser": "root",
                  "EstimatedMemory": "8GB",
                  "container-image": "docker://gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a",
              },
              visibility = ["//visibility:public"],
          )
          BUILD
          umask 077
          trap 'docker rm -f cork-gnu >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/cork.bazelrc"' EXIT
          {
            printf '%s\n' 'build --jobs=16' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
              'build --remote_cache=grpcs://remote.buildbuddy.io' \
              'build --bes_backend=grpcs://remote.buildbuddy.io' \
              'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
              'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
              'build --remote_accept_cached' \
              "build --inject_repository=cork_gnu=$RUNNER_TEMP/cork-platform" \
              'build --extra_execution_platforms=@cork_gnu//:gnu' \
              'build --host_platform=@cork_gnu//:gnu'
            test -n "$BUILDBUDDY_API_KEY"
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/cork.bazelrc"
          unset BUILDBUDDY_API_KEY
          GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          mkdir -p "$HOME/.cache/bazel"
          docker pull --platform linux/amd64 "$GNU"
          docker run -d --name cork-gnu --entrypoint /bin/bash --user "$(id -u):$(id -g)" \
            -e "HOME=$HOME" -e "USER=$USER" -v "$HOME/.cache/bazel:$HOME/.cache/bazel" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
          test "$(docker exec cork-gnu uname -m)" = x86_64
          test "$(docker exec cork-gnu bazel --version)" = "bazel $(cat images/default/bazelversion)"
          python3 -B "$RUNNER_TEMP/cork_timer.py"
      - name: Check the compact public receipt
        if: always()
        id: privacy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'cork-public'
          assert {p.name for p in directory.iterdir()} == {'verdict.json'}
          path = directory / 'verdict.json'
          assert path.is_file() and not path.is_symlink()
          data = path.read_text()
          assert len(data.encode()) < 128 * 1024
          for name in ('BUILDBUDDY_API_KEY', 'GH_TOKEN'):
              value = os.environ[name]
              assert value and value not in data and json.dumps(value)[1:-1] not in data
          assert not re.search(r'(?i)(?:authorization|x-buildbuddy-api-key)\s*[:=]|github_pat_|gh[pousr]_', data)
          json.loads(data)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: tcp-cork-timeouts
          path: ${{ runner.temp }}/cork-public/verdict.json
          if-no-files-found: error
