name: Check IPv4 and IPv6 forwarding across proc mounts on Linux and gVisor
on:
  push:
    branches: [qualification/proc-forwarding-final]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: abf9202abb9b44fe397f96e10caa4ac7e5b17dcd
      STOCK: a396eb2842a2dd9a386c38f4f2e18855603e7aea
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        cp test/rbe/proc-mount-verdict.py "$RUNNER_TEMP/verify-tcp.py"
        [[ "$(git rev-parse HEAD^1)" == "$CURRENT" ]]
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt systempaths=unconfined -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Verify the four proc settings across a real checkpoint
      run: |
        set -euo pipefail
        for name in current-save; do
          src=$CURRENT
          [[ "$name" != stock-guest ]] || src=$STOCK
          testname=proc_net_test
          path=test/syscalls/linux/proc_net.cc
          filter=ProcSysNetIPv4Forwarding.SharedAcrossProcMounts:ProcSysNetIPv6Forwarding.SharedAcrossProcMounts:ProcSysNetIpv4Sack.SharedAcrossProcMounts:ProcSysNetPortRange.SharedAcrossProcMounts
          executor=remote
          platform=runsc_ptrace
          if [[ "$name" == current-native ]]; then executor=local; platform=native; fi
          if [[ "$name" == current-save ]]; then platform=runsc_systrap_directfs_save; fi
          git checkout --quiet --detach "$src"
          [[ "$(git rev-parse HEAD)" == "$src" ]]
          d=$RUNNER_TEMP/records/$name; mkdir -p "$d"
          sha256sum "$path" > "$d/fixture-sha256"
          target="//test/syscalls:${testname}_${platform}"
          printf '%s\n' "$src" > "$d/source"; printf '%s\n' "$target" > "$d/target"
          printf '%s\n' "$executor" > "$d/executor"; printf '%s\n' "$filter" > "$d/filter"
          date -u +%FT%TZ > "$d/start"
          rc=0
          docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=64 --verbose_failures --strategy=TestRunner="$executor" --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=all --test_timeout=600 --test_sharding_strategy=disabled --test_env=GTEST_FILTER="$filter" "$target" > "$d/bazel.log" 2>&1 || rc=$?
          grep -A5 -E 'Invocation ID:|ERROR:|error:|FAILED|Build did NOT complete' "$d/bazel.log" | head -100 > "$d/compiler-diagnostics" || true
          rm -f "$d/bazel.log"
          printf '%s\n' "$rc" > "$d/exit"; date -u +%FT%TZ > "$d/end"
          if [[ $rc != 0 && $rc != 3 ]]; then continue; fi
          for file in test.log test.xml; do
            docker exec tcp-compiler cat "bazel-testlogs/test/syscalls/${target#*:}/$file" > "$d/$file" || rm -f "$d/$file"
          done
        done
    - name: Exercise the remaining procfs package including the rejected-write tests
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$CURRENT"
        d=$RUNNER_TEMP/records/proc-package
        mkdir -p "$d"
        target=//pkg/sentry/fsimpl/proc:proc_test
        printf '%s\n' "$CURRENT" > "$d/source"
        rc=0
        docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=64 --strategy=TestRunner=remote --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_timeout=600 --test_output=all --test_arg=-test.v "$target" > "$d/bazel.log" 2>&1 || rc=$?
        grep -A4 -E 'Invocation ID:|ERROR:|error:|FAILED|Build did NOT complete' "$d/bazel.log" | head -75 > "$d/compiler-diagnostics" || true
        printf '%s\n' "$rc" > "$d/exit"
        if [[ $rc == 0 || $rc == 3 ]]; then
          docker exec tcp-compiler cat bazel-testlogs/pkg/sentry/fsimpl/proc/proc_test/test.log > "$d/test.log"
        fi
        rm -f "$d/bazel.log"
        test "$rc" -eq 0
        grep -q -- '--- PASS: TestRejectedForwardingWrite' "$d/test.log"
    - name: Check the three owners of the production forwarding default
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$CURRENT"
        d=$RUNNER_TEMP/records/owners; mkdir -p "$d"
        rc=0
        docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=4 --keep_going --strategy=GoStaticAnalysis=linux-sandbox --strategy=GoStandardLibraryAnalysis=linux-sandbox --strategy=GoStdlib=linux-sandbox --strategy=GoStdlibList=linux-sandbox '--modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' --test_timeout=300 --test_output=errors //pkg/sentry/inet:inet_nogo //pkg/tcpip/stack:stack_nogo //pkg/sentry/fsimpl/proc:proc_nogo > "$d/bazel.log" 2>&1 || rc=$?
        printf '%s\n' "$rc" > "$d/exit"
        grep -A5 -E 'Invocation ID:|ERROR:|error:|FAILED|diagnostic| PASSED ' "$d/bazel.log" | tail -120 > "$d/receipt" || :
        rm -f "$d/bazel.log"
        test "$rc" -eq 0
    - name: Verify the actual proc mount read in each arm
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/verify-tcp.py" "$RUNNER_TEMP/records"
    - name: Redact credentials from the evidence bundle
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key=os.environ["BB_KEY"].encode()
        for f in (Path(os.environ["RUNNER_TEMP"])/"records").rglob("*"):
            if f.is_file() and key and key in (data:=f.read_bytes()):
                f.write_bytes(data.replace(key,b"[REDACTED]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: proc-forwarding-final
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
