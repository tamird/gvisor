name: Analyze the release on fresh Linux clients
on:
  push:
    branches: [qualification/release-cold-client-graph]
permissions:
  contents: read
jobs:
  analyze:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Compare cold repository evaluation with the same release target
        run: python3 test/rbe/cold_client/analysis.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cold-release-client-arm64
          path: ${{ runner.temp }}/client-evidence
          if-no-files-found: error
