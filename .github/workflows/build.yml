name: Verify original TCP repair traces
on:
  push:
    branches: [qualification/tcp-lost-repair-verdict]
permissions:
  actions: read
  contents: read
jobs:
  verify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Reconcile original TCP traces with native test output
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh run download 41179457328 -R tamird/gvisor -n tcp-lost-timeout-repair -D original
        python3 test/rbe/recover_tcp_repair.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: tcp-lost-repair-verdict
        path: recovered/verdict.json
        if-no-files-found: error
