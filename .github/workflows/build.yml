name: Compare checkpoint identities of exports and labeled releases
on:
  push:
    branches: [qualification/checkpoint-release-provenance]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/checkpoint-release-provenance'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      SOURCE: bffd23afb4a1d50c524b79a55a1b138f934739d6
      BASELINE: d4fcbffa13fb9ae7b242c7827ab0e92e42fa1ae9
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 3
        persist-credentials: false
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^1) == "$SOURCE" ]]
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Start the existing GNU Bazel coordinator
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name overlay-guest --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'

    - name: Keep the fixture and fetch historical product source
      run: |
        set -eu
        cp .github/qualification/owner-pair-*.py .github/qualification/owner_inspect_elf.py "$RUNNER_TEMP/"
        git fetch --no-tags --depth=1 origin "$BASELINE"
        test "$(git rev-parse "$BASELINE^{commit}")" = "$BASELINE"
        test "$(git rev-parse "$SOURCE^{commit}")" = "$SOURCE"
    - name: Build and inspect historical checkpoint executables
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/owner-pair-build.py" historical
    - name: Build and inspect integrated checkpoint executables
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/owner-pair-build.py" integrated
    - name: Build and inspect release checkpoint executables
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/owner-pair-build.py" release
    - name: Build and inspect historical-release checkpoint executables
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/owner-pair-build.py" historical-release
    - name: Save four genuine images, read metadata, restore six source pairs
      if: always()
      run: sudo env SOURCE="$SOURCE" BASELINE="$BASELINE" RUNNER_TEMP="$RUNNER_TEMP" python3 "$RUNNER_TEMP/owner-pair-restore.py"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: checkpoint-release-provenance
        path: ${{ runner.temp }}/label-proof
        if-no-files-found: error
