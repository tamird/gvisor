name: Verify statically linked Go targets with default LLVM
on:
  push:
    branches: [qualification/llvm-race-toolchain-selection]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Select the product and pinned Bazel
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 629d27e5ff9478b7d8d60f8245da07f275373170
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/workflows/build.yml test/rbe/narrow_race.py)"
          git diff --quiet HEAD^^ HEAD^ -- tools/defs.bzl runsc test/cmd/test_app test/syscalls/linux/prctl.cc MODULE.bazel
          cp test/rbe/narrow_race.py "$RUNNER_TEMP/narrow_race.py"
          echo "c9a381d57f5b7dfbb27d19adc74acdbddbd390ba2383f178459e9c9db9b987dc  $RUNNER_TEMP/narrow_race.py" | sha256sum -c -
          git checkout --detach HEAD^
          test "$(cat .bazelversion)" = 9.3.1
          d="$RUNNER_TEMP/static-go-check"
          mkdir -p "$d/bin" "$d/public"
          git rev-parse HEAD > "$d/public/source"
          curl --retry 3 -fsSL --proto '=https' --proto-redir '=https' https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bin/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bin/bazel" | sha256sum -c -
          chmod 755 "$d/bin/bazel"
          echo "$d/bin" >> "$GITHUB_PATH"
          echo "CHECK_DIR=$d" >> "$GITHUB_ENV"
      - name: Bind the non-Linux selector probe to the public race rule
        run: |
          set -eu
          python3 -B - <<'PY'
          import re
          from pathlib import Path
          src=Path('tools/bazeldefs/go.bzl').read_text()
          start=src.index('target = select({')
          end=src.index('}),', start)
          branches=re.findall(r'"(//[^"]+)": ":" \+ (musl|impl)',src[start:end])
          assert len(branches)==5 and branches.count(("//conditions:default","impl"))==1
          d=Path("runsc/race_probe")
          d.mkdir()
          for name in ("raw","musl"):(d/(name+".txt")).write_text(name+"\n")
          cases={condition:[("raw" if v=="impl" else "musl")+".txt"] for condition,v in branches}
          (d/"BUILD").write_text('platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"])\nplatform(name="darwin",constraint_values=["@platforms//cpu:x86_64","@platforms//os:macos"])\nfilegroup(name="source",srcs=select('+repr(cases)+'))\n')
          PY
          rm "$CHECK_DIR/public/source"
      - name: Check actual target transitions before building
        id: select
        timeout-minutes: 28
        run: python3 -B "$RUNNER_TEMP/narrow_race.py" selection
      - name: Link the two public native race binaries
        if: always() && !cancelled()
        timeout-minutes: 39
        run: |
          jq -e '.normal_ready == true' "$CHECK_DIR/public/selection.json" >/dev/null || exit 1
          python3 -B "$RUNNER_TEMP/narrow_race.py" link
      - name: Execute the real Nogo and dependency-policy tests
        if: always() && !cancelled()
        timeout-minutes: 61
        run: |
          jq -e '.normal_ready == true' "$CHECK_DIR/public/selection.json" >/dev/null || exit 1
          python3 -B "$RUNNER_TEMP/narrow_race.py" policy
      - name: Check the complete host GNU sysroot with an explicit toolchain
        if: always() && !cancelled() && steps.select.outcome == 'success'
        timeout-minutes: 32
        run: python3 -B "$RUNNER_TEMP/narrow_race.py" gnu
      - name: Validate bounded typed receipts
        id: boundary
        if: always()
        run: |
          python3 -B - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path(os.environ["CHECK_DIR"])/"public";allowed={n+".json" for n in ("selection","link","policy","gnu")}
          files=list(p.iterdir());assert files and {f.name for f in files}<=allowed
          for f in files:
              b=f.read_bytes();assert f.is_file() and not f.is_symlink() and len(b)<65536 and json.loads(b)["source"]=="629d27e5ff9478b7d8d60f8245da07f275373170"
              assert not re.search(rb"(?i)authorization\s*[:=]|x-buildbuddy-api-key|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}",b)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.boundary.outcome == 'success'
        with:
          name: narrow-static-race
          path: ${{ runner.temp }}/static-go-check/public/*.json
          if-no-files-found: error
