name: Run the native NVIDIA parser with the declared driver headers
on:
  push:
    branches: [qualification/nvproxy-native-source-abi]
permissions:
  contents: read
jobs:
  submit:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify the original source and the Buildkite command
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = b11561ccd3e5bd078b5542a2ee5cdde0a4d36a85
          test "$(git rev-parse HEAD^^)" = a2a4bd4b24213a8331f301c67020cb378a059d74
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/nvproxy_native_abi.py' ':!.github/qualification/source_presubmit_memory.py'
          cp .github/qualification/{nvproxy_native_abi.py,source_presubmit_memory.py} "$RUNNER_TEMP/"
          echo "0f0aa73d358b68e0eb0f3acdbd2c5aaa6d41aae7cfe742b61f23498a9a6a00e3  $RUNNER_TEMP/nvproxy_native_abi.py" | sha256sum -c -
          git checkout --quiet --detach b11561ccd3e5bd078b5542a2ee5cdde0a4d36a85
          test "$(bazelisk --version)" = "bazel 9.3.1"
      - name: Size and check the Bazel server heap on this coordinator
        run: python3 -IB "$RUNNER_TEMP/source_presubmit_memory.py"
      - name: Submit just the four previously failed NVIDIA owners
        timeout-minutes: 95
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          : "${BUILDBUDDY_API_KEY:?missing fork credential}"
          rc="$RUNNER_TEMP/source-presubmit.bazelrc"
          trap 'rm -f "$rc"' EXIT
          cat > "$rc" <<'RC'
          build:nvidia-source --remote_executor=grpcs://remote.buildbuddy.io
          build:nvidia-source --remote_cache=grpcs://remote.buildbuddy.io
          build:nvidia-source --bes_backend=grpcs://remote.buildbuddy.io
          build:nvidia-source --bes_results_url=https://app.buildbuddy.io/invocation/
          build:nvidia-source --remote_download_outputs=toplevel
          build:nvidia-source --config=x86_64 --extra_execution_platforms=//tools/bazeldefs:linux_amd64
          build:nvidia-source --remote_default_exec_properties=Arch=amd64
          build:nvidia-source --remote_default_exec_properties=OSFamily=linux
          build:nvidia-source --remote_default_exec_properties=container-image=docker://docker.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
          build:nvidia-source --remote_default_exec_properties=workload-isolation-type=oci
          build:nvidia-source --remote_default_exec_properties=dockerNetwork=off
          build:nvidia-source --spawn_strategy=remote --noremote_local_fallback --strip=never
          test:nvidia-source --strategy=TestRunner=remote --test_env=CGROUPV2=true --test_env=GO_TEST_WRAP_TESTV=1
          build:nvidia-source --jobs=64 --keep_going
          test:nvidia-source --nocache_test_results --flaky_test_attempts=1
          RC
          printf 'build:nvidia-source --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          printf 'build:nvidia-source --build_event_json_file=%s/source-presubmit.bep\n' "$RUNNER_TEMP" >> "$rc"
          unset BUILDBUDDY_API_KEY
          code=0
          timeout --signal=INT --kill-after=60s 90m bazelisk --bazelrc="$rc" test --config=nvidia-source \
            --run_under=//test/rbe:offline_exec \
            //tools/nvidia_driver_differ:driver_ast_parser_test //pkg/sentry/devices/nvproxy:nvproxy_driver_abi_test > "$RUNNER_TEMP/source-presubmit.log" 2>&1 || code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/source-presubmit-exit"
      - name: Record the native parser, per-version results and actual route
        id: collect
        if: always() && !cancelled()
        run: |
          set -eu
          test ! -e "$RUNNER_TEMP/source-presubmit.bazelrc"
          trap 'rm -f "$RUNNER_TEMP/source-presubmit.log" "$RUNNER_TEMP/source-presubmit.bep"' EXIT
          python3 -IB "$RUNNER_TEMP/source_presubmit_memory.py" diagnose
          python3 -IB "$RUNNER_TEMP/nvproxy_native_abi.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: nvproxy-native-abi
          path: ${{ runner.temp }}/nvproxy-offline.json
          if-no-files-found: error
          retention-days: 14
      - name: Require 25 real comparisons, nine source absences and the native parser test
        if: always() && !cancelled()
        run: |
          python3 -c 'import os,json,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"nvproxy-offline.json").read_text()); assert r["verified"]'
