name: Read original ARM64 cmd and netgofer test evidence
on:
  push:
    branches: [qualification/arm64-presubmit-original-owner-logs]
permissions: {contents: read}
jobs:
  retrieve:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify original source, owner, and evidence reader
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = dc9dcd2e3566e3adcdcf2fbf50297a95c853a620
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/arm64_owner_diagnostics.py'
          cp .github/qualification/arm64_owner_diagnostics.py "$RUNNER_TEMP/"
          echo "fb146b85daa34e1c99cac7bf95d177d2b54a209a0a17a5f0d30c731fa99ef218  $RUNNER_TEMP/arm64_owner_diagnostics.py" | sha256sum -c
      - name: Read four exact original blobs with one scoped credential
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          umask 077
          python3 -IB "$RUNNER_TEMP/arm64_owner_diagnostics.py" retrieve
      - name: Extract only source cases, source locations, and typed comparison fields
        id: project
        run: |
          set -eu
          test -z "${BUILDBUDDY_API_KEY:-}"
          python3 -IB "$RUNNER_TEMP/arm64_owner_diagnostics.py" summarize
          python3 -IB - <<'PYSCAN'
          import json, os, pathlib, re
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"arm-owners.json"
          assert path.is_file() and not path.is_symlink() and path.stat().st_size < 140000
          raw=path.read_bytes()
          assert not re.search(rb"(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}",raw)
          r=json.loads(raw)
          assert r["invocation"]=="b31f8bfe-2484-48df-b737-5b9bc46052ac"
          assert set(r["blobs"])=={"cmd.log","cmd.xml","netgofer.log","netgofer.xml"}
          PYSCAN
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.project.outcome == 'success'
        with:
          name: original-arm64-owner-diagnostics
          path: ${{ runner.temp }}/arm-owners.json
          if-no-files-found: error
          retention-days: 14
      - name: Require all four originals
        run: |
          python3 -IB -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"arm-owners.json").read_text()); assert all(o["http"]==200 for o in r["blobs"].values())'
