name: Check the lock used to clear TCP probe state
on:
  push:
    branches: [qualification/tcp-persist-state-lock]
permissions: {contents: read}
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Prepare the TCP sender and native GNU tools
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/tcp-persist-state"
          mkdir -p "$d"
          echo '{"verified":false,"stage":"setup"}' > "$d/result.json"
          product=455572aa75bf2f6f9c5c4a41661dae78253618e2
          base=7d1b049f5d541992b47cc38cf564025908a9ed7b
          test "$(git rev-parse HEAD^)" = "$product"
          test "$(git rev-parse HEAD^^)" = "$base"
          test "$(git diff --name-only "$base" "$product")" = pkg/tcpip/transport/tcp/snd.go
          cp .github/qualification/tcp_persist_state.py "$d/"
          git switch --detach "$product"
          test "$(uname -m)" = x86_64
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends -y build-essential crossbuild-essential-arm64
          curl -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          test "$(cat .bazelversion)" = 9.3.1
          test "$("$d/bazel" --version)" = 'bazel 9.3.1'
      - name: Run the zero-window packet test and check all three reset writes
        run: python3 -IB "$RUNNER_TEMP/tcp-persist-state/tcp_persist_state.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tcp-persist-state-lock
          path: ${{ runner.temp }}/tcp-persist-state/result.json
          if-no-files-found: error
