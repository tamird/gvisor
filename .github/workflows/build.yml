name: Verify the TCP selective acknowledgment amendment
on:
  push:
    branches: [qualification/tcp-sack-review]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 4
      - name: Compare stock, candidate, and analyzer records
        run: |
          set -eu
          out="$RUNNER_TEMP/sacked"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          run_tests() {
            arm="$1"; head="$2"; shift 2
            git checkout --quiet --detach "$head"
            test "$(git rev-parse HEAD)" = "$head"
            test "$(git rev-parse HEAD^)" = 757d67e79ca401d6d662c470d6470d13f9e23a45
            git diff --quiet
            git rev-parse HEAD > "$out/$arm-source"
            date -u +%FT%TZ > "$out/$arm-start"
            rc=0
            bazel test --jobs=4 --test_sharding_strategy=disabled --nocache_test_results --test_arg=-test.v --test_output=errors "$@" > "$out/$arm-bazel.log" 2>&1 || rc=$?
            date -u +%FT%TZ > "$out/$arm-finish"
            echo "$rc" > "$out/$arm-exit"
            tree="pkg/tcpip/transport/tcp"
            for path in "$tree/test/e2e/tcp_rack_test" "$tree/tcp_test"; do
              if [[ $arm = stock && $path = "$tree/tcp_test" ]]; then continue; fi
              for ext in log xml; do
                if [[ -f bazel-testlogs/$path/test.$ext ]]; then cp -L "bazel-testlogs/$path/test.$ext" "$out/$arm-$(basename "$path").$ext"; fi
              done
            done
            tail -16 "$out/$arm-bazel.log"
          }
          e2e=//pkg/tcpip/transport/tcp/test/e2e:tcp_rack_test
          run_tests stock 574c0fe105112432c1a2785d978064685064b105 '--test_arg=-test.run=^(TestSACKPacketCredit|TestSackedOutAfterPMTU)$' "$e2e"
          run_tests candidate 8a3d1a53448caae65a60f090f1d60fa3d9f548e9 "$e2e" //pkg/tcpip/transport/tcp:tcp_test
          rc=0
          bazel test --jobs=4 --build_tag_filters= --test_tag_filters= --test_sharding_strategy=disabled --nocache_test_results --test_output=errors --strategy=GoStaticAnalysis=linux-sandbox --strategy=GoStandardLibraryAnalysis=linux-sandbox --strategy=GoStdlib=linux-sandbox --strategy=GoStdlibList=linux-sandbox '--modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' //pkg/tcpip/transport/tcp:tcp_nogo //pkg/tcpip/transport/tcp:tcp_test_nogo > "$out/nogo.log" 2>&1 || rc=$?
          for label in tcp_nogo tcp_test_nogo; do
            for ext in xml log; do
              f="bazel-testlogs/pkg/tcpip/transport/tcp/$label/test.$ext"
              if [[ -f "$f" ]]; then cp -L "$f" "$out/$label.$ext"; fi
            done
          done
          echo "$rc" > "$out/nogo-exit"
          git rev-parse HEAD > "$out/final-head"
          git status --porcelain --untracked-files=no > "$out/final-modifications"
          tail -16 "$out/nogo.log"
          git show "$GITHUB_SHA:test/rbe/sack_review_final.py" > "$RUNNER_TEMP/sack-review.py"
          python3 -B "$RUNNER_TEMP/sack-review.py" "$out" 574c0fe105112432c1a2785d978064685064b105 8a3d1a53448caae65a60f090f1d60fa3d9f548e9
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tcp-sack-review
          path: ${{ runner.temp }}/sacked
