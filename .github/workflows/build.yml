name: Verify the Go generics golden tests
on:
  push:
    branches: [qualification/go-generics-compare-lines]
permissions: {}

jobs:
  linux:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Bind the reviewed source and native tools
        run: |
          set -euo pipefail
          umask 022
          git init -q
          git fetch --no-auto-maintenance --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git checkout -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 957b1bd2d6fdb4b244cab3a649ab5d8566cb6a67
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/qualification/generics_go_compare.py .github/workflows/build.yml)"
          test "$(cat .bazelversion)" = 9.3.1
          w="$RUNNER_TEMP/golden"
          mkdir -p "$w/receipt"
          curl -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $w/bazel" | sha256sum -c
          chmod 755 "$w/bazel"
          test "$("$w/bazel" --version)" = 'bazel 9.3.1'
          for suite in jammy jammy-updates; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ $suite main universe"
          done > "$w/jammy.list"
          options=(-o "Dir::Etc::sourcelist=$w/jammy.list" -o Dir::Etc::sourceparts=-)
          sudo -n apt-get "${options[@]}" update -qq
          sudo -n apt-get "${options[@]}" install --no-install-recommends -qy qemu-user-static crossbuild-essential-arm64 build-essential libnuma-dev
      - name: Run seven Bazel tests per target, comparator controls, and an actual mismatched golden
        timeout-minutes: 65
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C LC_ALL=C RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" \
            python3 -IB .github/qualification/generics_go_compare.py
      - name: Check the bounded result
        if: always() && !cancelled()
        id: receipt
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "golden/receipt"
          assert json.loads((root/"result.json").read_text())["carrier"] == os.environ["GITHUB_SHA"]
          for f in root.iterdir():
              assert f.is_file() and not f.is_symlink() and 0 < f.stat().st_size < 65536
              assert re.fullmatch(r"result[.]json|(amd64|amd64-mutated|arm64)[.]\w+_test[.]test[.](log|xml)", f.name)
              assert not re.search(rb"(?i)(authorization:|bearer |x-buildbuddy-api-key|ghp_|github_pat_|-----BEGIN [A-Z ]*PRIVATE KEY)", f.read_bytes())
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.receipt.outcome == 'success'
        with:
          name: go-generics-go-compare
          path: ${{ runner.temp }}/golden/receipt/
          if-no-files-found: error
