name: Replay CUBIC timeout recovery and the data retry budget
on:
  push:
    branches: [qualification/tcp-loss-threshold-and-retry-replay]
permissions: {contents: read}
jobs:
  replay:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind all three TCP sources and the native Bazel client
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 9ee2906f518e1d0f9fd109e9e1feb2812096418b
          git fetch --quiet --no-tags --depth=2 https://github.com/tamird/gvisor.git \
            4a4e33cfc5dede7d3bfbfc8b43b7784578178eb6 \
            8427512c2e8f6c0f1ece278d57df65202da6f0e8 \
            4867d503b71f6c13f0346778ca61373df04ed0ae
          test "$(uname -m)" = x86_64
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/bazel" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bazel"
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo
      - name: Replay the seven application transfers on each sender
        run: python3 .github/qualification/rto_deadline.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: tcp-loss-threshold-retry
          path: ${{ runner.temp }}/rto-diagnostics/receipt.json
          if-no-files-found: error
          retention-days: 14
