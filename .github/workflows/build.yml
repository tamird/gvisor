name: Check fast retransmit after a spurious timeout
on:
  push:
    branches: [qualification/eifel-step8-composition]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && !github.event.deleted
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Replay the first ACK and RACK cases on each sender
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/eifel-check"
          mkdir -m 700 "$dir"
          cp .github/qualification/eifel_check.py "$dir/"
          test "$(git rev-parse HEAD^)" = f23070977169b4084ae8f4a0b18fa139404467e9
          git fetch --quiet --depth=2 https://github.com/google/gvisor.git 1b9768b199524246fe8e4fa66a0b623069778780
          test "$(git rev-parse FETCH_HEAD^)" = f51a205a8f4afbc5ab41aded070df74951b081ea
          git checkout --detach f23070977169b4084ae8f4a0b18fa139404467e9
          test -z "$(git status --short)"
          curl --retry 3 -fsSL --proto '=https' --proto-redir '=https' --max-time 100 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$dir/bazelisk"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $dir/bazelisk" | sha256sum -c
          chmod 755 "$dir/bazelisk"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -B "$dir/eifel_check.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eifel-resume-composition
          path: ${{ runner.temp }}/eifel-check/receipts.json
          if-no-files-found: error
          retention-days: 7
