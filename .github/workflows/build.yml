name: Measure protected clears of 64 MiB mapped files
on:
  push:
    branches: [qualification/erms-disk-backed-clear-64m]
permissions: {}
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind both implementations and their shared protected-fault controls
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/mapped-clear"
          mkdir -m 700 "$w" "$w/backing" "$w/out" "$w/out/logs"
          base=ed70698a7419c55e9b9537d2fb737067b213bdf4
          arm=4b4c6b4793117901deaad118a38f85de17f47ede
          test "$(git rev-parse HEAD^)" = "$arm"
          test "$(git rev-parse "$arm^")" = "$base"
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/mapped_clear'
          git diff --exit-code "$base" "$arm" -- . ':!pkg/safecopy/BUILD' ':!pkg/safecopy/memclr_amd64.s' ':!pkg/safecopy/safecopy_amd64_unsafe.go'
          test "$(git rev-parse "$arm:pkg/safecopy/BUILD")" = 29762dfa5803476bdce0fad0a7489e6f034b8ffa
          test "$(git rev-parse "$arm:pkg/safecopy/memclr_amd64.s")" = e646d67badbdb2f30f0c029e78e782d632b0f95b
          test "$(git rev-parse "$arm:pkg/safecopy/safecopy_amd64_unsafe.go")" = ab4abb2d866794e3801854a3350a5054ced0d38b
          test "$(cat .bazelversion)" = 9.3.1
          cp .github/qualification/mapped_clear/{benchmark.go.inc,compare.py} "$w/"
          cd "$w"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel' | sha256sum -c -
          chmod 700 bazel
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://raw.githubusercontent.com/tamird/gvisor/61470ea4162137e6871edd94e369f1c03592c163/pkg/safecopy/safecopy_test.go -o safecopy_test.go
          test "$(git hash-object safecopy_test.go)" = 8f58ec6d91f7c183852e7b53de0abf9e1264f0fc
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://raw.githubusercontent.com/tamird/gvisor/2b51abee8530385431b7225198fdd5cd65e78696/MODULE.bazel -o benchstat.MODULE
          test "$(git hash-object benchstat.MODULE)" = 1665015b7719a98f2176b44a0f1c298854dadfab
      - name: Verify fault handling and alternate the two native binaries on one core
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/mapped-clear"
          env -i HOME="$HOME" USER="$USER" PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$w/compare.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: protected-64m-mapped-clear
          path: ${{ runner.temp }}/mapped-clear/out
          if-no-files-found: error
          retention-days: 14
