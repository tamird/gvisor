name: Verify the NIC information read lock
on:
  push:
    branches: [qualification/check-nic-info-stack-lock]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Check both architecture analyses on the proposal and controls
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/nic-info-lock"
          mkdir -m 700 "$dir"
          cp .github/qualification/nic_info_lock.py "$dir/"
          source=8ceb51f216ffb44c7edc62ed4fa42a3a3508e976
          test "$(git rev-parse HEAD^)" = "$source"
          git checkout --detach "$source"
          test -z "$(git status --short)"
          curl --retry 3 -fsSL --proto '=https' --proto-redir '=https' --max-time 100 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$dir/bazelisk"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $dir/bazelisk" | sha256sum -c
          chmod 755 "$dir/bazelisk"
          test "$("$dir/bazelisk" --version)" = "bazel 9.3.1"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" SOURCE="$source" LANG=C.UTF-8 python3 -B "$dir/nic_info_lock.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nic-info-lock-evidence
          path: ${{ runner.temp }}/nic-info-lock/results/
          if-no-files-found: error
          retention-days: 14
