name: Check nested graph conversions after the dual-engine test migration
on:
  push:
    branches: [qualification/state-graph-nested-rebase]
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 6
      - name: Verify the original nine test reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 62e214867e089f4ba2db0b79beecd8148c4da509
          out="$RUNNER_TEMP/state-results"
          gh api repos/tamird/gvisor/actions/artifacts/12989230169/zip > "$RUNNER_TEMP/original.zip"
          unzip -q "$RUNNER_TEMP/original.zip" -d "$out"
          python3 test/rbe/state_result.py final "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: state-graph-nested-rebase
          path: ${{ runner.temp }}/state-results/groups.json
          if-no-files-found: error
