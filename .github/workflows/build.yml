name: HTTP benchmark readiness controls
on: workflow_dispatch
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 20
          persist-credentials: false
      - name: Prepare native Bazel and record both source revisions
        run: |
          set -eu
          d="$RUNNER_TEMP/pgo-readiness"
          mkdir -p "$d/bin" "$d/results"
          cp .github/qualification/benchmark-readiness/verify.py "$d/verify.py"
          source=$(git rev-parse HEAD^)
          test "$(git rev-parse HEAD^^)" = 2552c678794e048487e1d18e9c81729b67fc119a
          printf 'SOURCE_COMMIT=%s\n' "$source" >> "$GITHUB_ENV"
          printf 'carrier=%s\nproposal=%s\nstock=%s\n' "$GITHUB_SHA" "$source" "$(git rev-parse HEAD^^)" > "$d/results/source.txt"
          printf 'build --jobs=4\n' > "$d/native.bazelrc"
          version=$(cat .bazelversion)
          base="https://releases.bazel.build/$version/release/bazel-$version-linux-x86_64"
          curl --retry 3 -fsSL "$base" -o "$d/bin/bazel"
          curl --retry 3 -fsSL "$base.sha256" | cut -d ' ' -f 1 | { read -r digest; echo "$digest  $d/bin/bazel" | sha256sum -c -; }
          chmod +x "$d/bin/bazel"
          echo "$d/bin" >> "$GITHUB_PATH"
      - name: Run the ordinary HTTP benchmarks with and without their probe
        run: python3 "$RUNNER_TEMP/pgo-readiness/verify.py"
      - name: Upload benchmark outputs and original exits
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: http-benchmark-readiness
          path: ${{ runner.temp }}/pgo-readiness/results
          if-no-files-found: error
