name: Build Go archives without a host temporary directory
on:
  push:
    branches: [qualification/go-stdlib-owned-temp]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 52
    env:
      EXEC_CPU: amd64
      BB_ARCH: x86_64
      BB_HASH: bdb65b4bddb8405a80b3e45a3ef4c740819b151d0709d360e8add8dac534c224
      BAZELISK_HASH: e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 5}
      - name: Pin Bazel and the compact action log reader
        run: |
          set -eu
          export USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          echo "USE_BAZEL_VERSION=$USE_BAZEL_VERSION" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bazelisk-bin"
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-$EXEC_CPU -o "$RUNNER_TEMP/bazelisk-bin/bazel"
          echo "$BAZELISK_HASH  $RUNNER_TEMP/bazelisk-bin/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bazelisk-bin/bazel"
          echo "$RUNNER_TEMP/bazelisk-bin" >> "$GITHUB_PATH"
          command -v objcopy nm jq
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-$BB_ARCH -o "$RUNNER_TEMP/bb"
          echo "$BB_HASH  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
      - name: Build the same Go consumer before and after in a native ARM64 scratch worker
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/sidecar.bazelrc"
          unset BUILDBUDDY_API_KEY
          for name in BUILD stdlib.bzl; do cp "test/rbe/go_stdlib_workdir/$name" "$RUNNER_TEMP/go-temp-$name"; done
          cp test/rbe/go_stdlib_workdir/qualify.py "$RUNNER_TEMP/go-temp-qualify.py"
          python3 "$RUNNER_TEMP/go-temp-qualify.py"
      - name: Verify exactly the typed evidence files
        id: privacy
        if: always()
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "go-temp-evidence"
          allowed = {"verdict.json", *(f"{version}-{phase}.json" for version in ["9.3.1", "8.8.1"] for phase in ["stock", "fixed"])}
          paths = list(root.iterdir())
          assert paths and all(p.is_file() and p.name in allowed for p in paths)
          key = os.environ["ACCESS"].encode()
          assert key
          for path in paths:
              raw = path.read_bytes()
              assert not any(marker in raw for marker in (key, b"remote_header", b"bes_header", b"Authorization:", b"X-Amz-Signature", b"Bearer "))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: scratch-go-output-temp
          path: ${{ runner.temp }}/go-temp-evidence/*.json
          if-no-files-found: error
