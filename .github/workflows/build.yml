name: Verify the freestanding systrap link
on:
  push:
    branches: [qualification/systrap-stub-runtime-defaults]
permissions:
  contents: read
jobs:
  gnu:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind the published stub and the shared adapter
        run: |
          set -euo pipefail
          umask 077
          git fetch --depth=1 --no-tags https://github.com/tamird/gvisor.git 005743727b3d80d373085133b5da9cd906cc9d7c
          test "$(git rev-parse FETCH_HEAD)" = 005743727b3d80d373085133b5da9cd906cc9d7c
          test "$(git rev-parse HEAD^)" = 7f6ecfff61b465c2ae00d20ee4ebaad09d430519
          test "$(git rev-parse HEAD^^)" = 244010f9c48c93edcf25cfb4acdf91f7bed251c7
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/workflows/build.yml test/rbe/native_cross_inputs.py test/rbe/systrap_runtime_defaults.py)"
          d="$RUNNER_TEMP/native-cross-inputs"
          mkdir "$d"
          cp test/rbe/native_cross_inputs.py test/rbe/systrap_runtime_defaults.py "$d/"
          echo "b0626fb5ecb5bb9c41d644ced5af036019cbefbeef7975c71878021f6e146653  $d/native_cross_inputs.py" | sha256sum -c -
          echo "c0b216b2aa0af35db6dd31ac134e058879e7f09bed0120044de27618b51d85a9  $d/systrap_runtime_defaults.py" | sha256sum -c -
          test "$(cat .bazelversion)" = 9.3.1
          test "$(uname -m)" = x86_64
          curl --retry 3 --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          test "$("$d/bazel" --version)" = 'bazel 9.3.1'
      - name: Provide the compilers declared by the current GNU toolchain
        run: |
          set -euo pipefail
          if ! test -x /usr/bin/aarch64-linux-gnu-g++; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y g++-aarch64-linux-gnu
          fi
          for arch in x86_64 aarch64; do
            compiler="/usr/bin/$arch-linux-gnu-g++"
            test "$("$compiler" -dumpmachine)" = "$arch-linux-gnu"
          done
      - name: Check native link failures and both architecture outputs
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" USE_BAZEL_VERSION=9.3.1 python3 -B "$RUNNER_TEMP/native-cross-inputs/systrap_runtime_defaults.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: systrap-stub-runtime-defaults
          path: ${{ runner.temp }}/native-cross-inputs/verdict.json
          if-no-files-found: error
          retention-days: 14
