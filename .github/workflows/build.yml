name: Verify overlay waiter release context
on:
  push:
    branches: [qualification/overlay-waiter-race-context]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
        persist-credentials: false
    - name: Bind reviewed sources and prepare standard Linux worker
      run: |
        set -euo pipefail
        harness=0d423372840cf49baa3af27956fe7244f5e7bbac
        assets=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
        registry=c3569a60dc1836ac6fad05e86d7951866c796b4f
        git fetch -q --no-tags --depth=2 origin "$harness" "$assets" "$registry"
        test "$(git rev-parse HEAD^)" = c8f8f81e1991ae9510eb86040883c032ebe97f36
        test "$(git rev-parse HEAD^^)" = d01969e4cf73163e16243bd0d8edb666fce733db
        test "$(git rev-parse HEAD^^^)" = aaab1ecb082e650ee857a0f8366229a1f37e3143
        git diff --exit-code HEAD^^ HEAD^ -- pkg/sentry/fsimpl/overlay/regular_file.go
        cp .github/qualification/overlay_waiter_close.py "$RUNNER_TEMP/check.py"
        git show "$harness:.github/qualification/timer_teardown.py" > "$RUNNER_TEMP/timer_teardown.py"
        git show "$assets:.github/qualification/recvbuf_deps.py" > "$RUNNER_TEMP/public_assets.py"
        git show "$registry:.github/qualification/tldk_installed_inputs.json" > "$RUNNER_TEMP/inputs.json"
        git show "$registry:.github/qualification/tldk_public_inputs.py" > "$RUNNER_TEMP/tldk_public_inputs.py"
        curl -q -fsSL --max-time 90 --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$RUNNER_TEMP/bazel"
        echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $RUNNER_TEMP/bazel" | sha256sum -c -
        chmod 755 "$RUNNER_TEMP/bazel"
        for suite in jammy jammy-updates; do
          echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu $suite main universe"
        done > "$RUNNER_TEMP/jammy.list"
        opts=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/jammy.list" -o Dir::Etc::sourceparts=-)
        sudo -n apt-get "${opts[@]}" update -qq
        sudo -n apt-get "${opts[@]}" install -qq -y --no-install-recommends g++-aarch64-linux-gnu libnuma-dev
        df -h .
    - name: Check poll cancellation, lower lifetime, and nested overlays under the race detector
      timeout-minutes: 34
      run: |
        set -euo pipefail
        env -i HOME="$HOME" USER="$USER" LANG=C.UTF-8 PATH=/usr/local/bin:/usr/bin:/bin RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$RUNNER_TEMP/check.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && !cancelled()
      with:
        name: overlay-waiter-release
        path: ${{ runner.temp }}/waiter-results/
        retention-days: 14
        if-no-files-found: error
