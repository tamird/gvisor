name: Read the two original TUN analyzer diagnoses
on:
  push:
    branches: [qualification/tun-pi-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/tun-pi-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      OSTOCK: 13969a0fd2f1347a25e2b20e4e36e64787dcab15
      OFIXED: e539b6e86e21b645f9d8a100e71235c1541477ab
    steps:
    - name: Read the original test logs
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/diagnoses"
        python3 - <<'PYTHON'
        import hashlib,json,os,re,urllib.request as u
        from pathlib import Path
        key=os.environ.pop('BUILDBUDDY_API_KEY')
        out=Path(os.environ['RUNNER_TEMP'])/'diagnoses';inv='75fb5565-d38d-4300-b873-7fefc949ca71'
        def api(method,body,limit):
            req=u.Request('https://app.buildbuddy.io/api/v1/'+method,data=json.dumps(body).encode(),headers={'Content-Type':'application/json','x-buildbuddy-api-key':key})
            with u.urlopen(req,timeout=28) as res:raw=res.read(limit+1)
            if len(raw)>limit:raise ValueError('unexpected result size')
            return raw
        report={}
        for name,label in [('tun','//pkg/tcpip/link/tun:tun_nogo'),('tundev','//pkg/sentry/devices/tundev:tundev_nogo')]:
            rows=json.loads(api('GetAction',{'selector':{'invocation_id':inv,'target_label':label}},4<<20))
            files=[f for a in rows.get('action',[]) for f in a.get('file',[]) if f.get('name','').rsplit('/',1)[-1]=='test.log' and '/blobs/' in f.get('uri','')]
            for f in files:
                hn,size=f['uri'].rsplit('/',2)[-2:];size=int(size)
                assert size<=1<<20
                raw=api('GetFile',{'uri':f['uri']},size)
                assert (hashlib.sha256(raw).hexdigest(),len(raw))==(hn,size)
                txt=raw.decode(errors='replace').replace(key,'[REDACTED]')
                kept=[l[:600] for l in txt.splitlines() if l and 'remote_header' not in l and 'bes_header' not in l and '://'+key not in l and len(l)<1600][:80]
                if f['uri'] not in {v.get('uri') for v in report.get(name,[])}:
                    report.setdefault(name,[]).append(dict(label=label,uri=f['uri'],sha256=hn,size=size,lines=kept))
        if len(report)!=2:
            page='0000';seen=set();kept=[]
            while page and page not in seen and len(seen)<60:
                seen.add(page)
                row=json.loads(api('GetLog',{'selector':{'invocation_id':inv},'page_token':page},4<<20));txt=row.get('log',{}).get('contents','').replace(key,'[REDACTED]')
                kept.extend(l[:600] for l in txt.splitlines() if (re.search(r'pkg/(tcpip/link/tun|sentry/devices/tundev)/[^ ]+\.go:[0-9]+|checklocks:|checkescape:|nogo: ',l) and len(l)<1600 and 'header' not in l))
                page=row.get('nextPageToken','')
            report['console']=kept[:100]
        (out/'original-diagnostics.json').write_text(json.dumps(report,indent=2)+'\n')
        assert {k for k,v in report.items() if v} >= {'tun','tundev'} or report.get('console'), 'no diagnostic recovered'
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: tun-pi-diagnoses
        path: ${{ runner.temp }}/diagnoses/
        if-no-files-found: error
