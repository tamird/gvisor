name: Start both original optimized release archives in native systrap
on:
  push:
    branches: [qualification/package-empty-worker-arm64]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cpu: arm64, os: ubuntu-24.04-arm}
          - {cpu: amd64, os: ubuntu-24.04}
    runs-on: ${{ matrix.os }}
    env:
      EXEC_CPU: ${{ matrix.cpu }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 5}
      - name: Recover original per-architecture release receipt
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -eu
          umask 077
          case "$EXEC_CPU" in
            amd64) receipt=13064517705 ;;
            arm64) receipt=13065375680 ;;
            *) exit 1 ;;
          esac
          gh api "repos/tamird/gvisor/actions/artifacts/$receipt/zip" > "$RUNNER_TEMP/original.zip"
      - name: Verify the original Zstandard archive, ELF payloads and guest
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          umask 077
          python3 test/rbe/empty_worker/recover_release.py fetch
      - name: Run the verified fileset in the real native OCI systrap container
        run: |
          umask 077
          python3 test/rbe/empty_worker/recover_release.py guest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: optimized-release-native-guest-${{ matrix.cpu }}
          path: ${{ runner.temp }}/release-smoke-result
          if-no-files-found: error
