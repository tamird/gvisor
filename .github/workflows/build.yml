name: Observe forwarding through a nested bridge and veth
on:
  push:
    branches: [qualification/forward-gso-neighbor]
permissions:
  contents: read
  actions: read
jobs:
  router:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT_SHA: 203d5e689ba224abe547254faef9f1534f1ac555
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 3, persist-credentials: false}
    - name: Prepare the compiler and isolated router lab
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        printf '{"verified":false,"reason":"no completed transfer evidence"}\n' > "$RUNNER_TEMP/records/verdict.json"
        test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
        git diff --exit-code "$PRODUCT_SHA" HEAD -- pkg runsc ':(exclude)pkg/tcpip/tests/integration/link_resolution_test.go'
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --privileged --name tcp-compiler --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler ip -V
    - name: Observe original forwarding after unanswered ARP and NDP
      id: stock
      continue-on-error: true
      env:
        PRODUCT_SHA: 650d9b49f802ecbc94acd9c4fb81b21145d0d701
      run: |
        set -euo pipefail
        git diff --quiet "$PRODUCT_SHA" HEAD^ -- ':(exclude)pkg/tcpip/network/internal/ip/tcp_segmenter.go'
        git restore --source="$PRODUCT_SHA" --worktree -- pkg/tcpip/network/internal/ip/tcp_segmenter.go
        git diff --quiet "$PRODUCT_SHA" -- pkg runsc ':(exclude)pkg/tcpip/tests/integration/link_resolution_test.go'
        python3 test/rbe/forward_gso/qualify.py neighbor
    - name: Check the forwarded bit restores neighbor-failure ICMP
      id: splitter
      continue-on-error: true
      run: |
        set -euo pipefail
        git restore --source="$PRODUCT_SHA" --worktree -- pkg/tcpip/network/internal/ip/tcp_segmenter.go
        git diff --quiet "$PRODUCT_SHA" -- pkg runsc ':(exclude)pkg/tcpip/tests/integration/link_resolution_test.go'
        python3 test/rbe/forward_gso/qualify.py neighbor
    - name: Require both observed comparisons
      if: always()
      env:
        STOCK: ${{ steps.stock.outcome }}
        SPLITTER: ${{ steps.splitter.outcome }}
      run: |
        python3 - <<'PYRESULT'
        import json,os,pathlib
        root=pathlib.Path(os.environ["RUNNER_TEMP"])/"records"
        results={key:os.environ[key] for key in ("STOCK","SPLITTER")}
        rows={p.stem:json.loads(p.read_text()).get("result") for p in root.glob("neighbor-*.json")}
        ok=all(v=="success" for v in results.values()) and len(rows)==2 and all(v=="verified" for v in rows.values())
        (root/"verdict.json").write_text(json.dumps({"verified":ok,"steps":results,"sources":rows},indent=2))
        raise SystemExit(not ok)
        PYRESULT
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: forwarded-neighbor-failure
        path: ${{ runner.temp }}/records
        if-no-files-found: error
