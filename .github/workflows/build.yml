name: Observe TCP ACK credit across an ordinary MTU change
on:
  push:
    branches: [qualification/tcp-migration-ordinary-mtu]
permissions: {}
jobs:
  migration:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Bind current upstream and the migration-only fixture
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tcp-ordinary-mtu"
          mkdir -p "$work/results"
          git init -q
          git -c gc.auto=0 fetch -q --no-auto-maintenance --no-tags --depth=2 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git switch -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 975fb172241c7946a9f67b4f52e0349d9240589a
          test "$(git rev-parse HEAD:pkg/tcpip/transport/tcp/test/e2e/tcp_migration_test.go)" = e12585a03aecd1276d16a39bc0337d9c455e2bd8
          printf '%s\n' .github/qualification/tcp_migration_ordinary_mtu.py .github/workflows/build.yml pkg/tcpip/transport/tcp/test/e2e/tcp_migration_test.go | diff - <(git diff --name-only HEAD^ HEAD)
          test "$(cat .bazelversion)" = 9.3.1
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$work/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $work/bazel" | sha256sum -c -
          chmod 700 "$work/bazel"
      - name: Restore over both ordinary IPv4 routes and ACK the old packet
        timeout-minutes: 37
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" python3 -B .github/qualification/tcp_migration_ordinary_mtu.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: tcp-migration-ordinary-mtu-ack
          path: ${{ runner.temp }}/tcp-ordinary-mtu/results/
          if-no-files-found: error
          retention-days: 14
