name: Check clang-format on the shell-free worker
on:
  push:
    branches: [qualification/clang-format-native-buildifier]
permissions:
  contents: read
jobs:
  lint:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      SCRATCH: mirror.gcr.io/library/hello-world@sha256:c567b231f65614688711a75f31518a064258a51d442117a3e771a3a8fdba78ef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 4, persist-credentials: false}
      - name: Prepare the verified released client and GNU execution platform
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          d="$RUNNER_TEMP/lint-bazel9"
          mkdir -p "$d/platform"
          cp .github/qualification/lint-pilot/check.py "$d/check.py"
          echo '{"verdict":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/clang-format-bazel9.json"
          git checkout --detach HEAD^
          curl --retry 3 -fsSL https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
          printf '%s  %s\n' 7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c "$d/bazel" | sha256sum -c -
          chmod +x "$d/bazel"
          printf 'module(name="tcp_gnu")\n' > "$d/platform/MODULE.bazel"
          printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$d/platform/BUILD"
          printf 'platform(name="scratch",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"oci","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$SCRATCH" >> "$d/platform/BUILD"
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$d/platform" 'build --extra_execution_platforms=@tcp_gnu//:scratch' 'build --host_platform=@tcp_gnu//:scratch'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$d/bb.rc"
      - name: Check the original sources, damage and repair inputs, and recheck the same worker
        run: LINT_RC="$RUNNER_TEMP/lint-bazel9/bb.rc" python3 -B "$RUNNER_TEMP/lint-bazel9/check.py"
      - name: Exercise the ordinary combined check and the user-facing lint script
        run: |
          "$RUNNER_TEMP/lint-bazel9/bazel" build //tools/lint:check
          "$RUNNER_TEMP/lint-bazel9/bazel" test //tools:lint_test
      - name: Check the compact artifact boundary
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          data = (Path(os.environ["RUNNER_TEMP"]) / "clang-format-bazel9.json").read_bytes()
          key = os.environ["KEY"].encode()
          assert key and key not in data and b"x-buildbuddy-api-key" not in data.lower()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: clang-format-bazel9
          path: ${{ runner.temp }}/clang-format-bazel9.json
          if-no-files-found: error
