name: Check delayed TCP ACKs at a gap and across restore
on:
  push:
    branches: [qualification/tcp-delayed-ack-controls]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 5
        persist-credentials: false
    - name: Bind the public source fixture, local report helpers and Bazelisk
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        root="$RUNNER_TEMP/tcp-ack-restore"
        mkdir -p "$root"/{bin,out,tmp}
        for phase in gap stock fixed; do
          mkdir "$root/out/$phase"
          printf '{"status":"INCOMPLETE","phase":"bootstrap"}\n' > "$root/out/$phase/result.json"
        done
        fixture=8ceb0ea415f881eada665c0fb4229e351d668f46
        test "$(git rev-parse HEAD^)" = 0bb42c582ef70adb7f3022d9cd55cdb489e09844
        test "$(git rev-parse HEAD^^)" = cbb089c143d33281025229a2a7cf1495b2dc675f
        test "$(git rev-parse HEAD^^^)" = 5e903e17232e9191f5c20fa48a9a3ab171826cb1
        git fetch --quiet --no-tags --depth=3 https://github.com/tamird/gvisor.git "$fixture"
        test "$(git rev-parse "$fixture^")" = "$(git rev-parse HEAD^^^)"
        cp test/rbe/delayed_ack_receipt.py "$root/"
        donor=611a6ff017c528dddbd0d2e643aaf23c6ddac488
        git fetch --quiet --depth=1 https://github.com/tamird/gvisor.git "$donor"
        test "$(git rev-parse "$donor:test/rbe/qualification_report.py")" = d2e3eedabc2ad911d958aa448fd916aa6835aa86
        test "$(git rev-parse "$donor:test/rbe/unit_matrix.py")" = d01d9e319084e18ea2928671e417e1b4e86c4954
        for helper in unit_matrix qualification_report; do git show "$donor:test/rbe/$helper.py" > "$root/$helper.py"; done
        git switch --detach --quiet "$fixture"
        test "$(cat .bazelversion)" = 9.3.1
        curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$root/bin/bazel"
        echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $root/bin/bazel" | sha256sum -c -
        chmod 755 "$root/bin/bazel"
        test "$(env -i HOME="$HOME" PATH="$PATH" "$root/bin/bazel" --version)" = 'bazel 9.3.1'
        ctl=(env -i HOME="$HOME" PATH="$root/bin:/usr/local/bin:/usr/bin:/bin" USER=runner LANG=C.UTF-8 TMPDIR="$root/tmp" GIT_TERMINAL_PROMPT=0)
        install_base=$("${ctl[@]}" bazel --ignore_all_rc_files --host_jvm_args=-Xmx3g info install_base)
        host_ns=$(readlink /proc/self/ns/net)
        "${ctl[@]}" "$install_base/linux-sandbox" -n -- python3 -c '
        import os, socket, sys
        assert os.readlink("/proc/self/ns/net") != sys.argv[1]
        assert all(name == "lo" for _, name in socket.if_nameindex())
        assert all(line.split()[1] != "00000000" for line in open("/proc/self/net/route").read().splitlines()[1:])
        ' "$host_ns"
    - name: Run the author suite and original gap trace
      timeout-minutes: 54
      run: |
        root="$RUNNER_TEMP/tcp-ack-restore"
        env -i HOME="$HOME" PATH="$root/bin:/usr/local/bin:/usr/bin:/bin" USER=runner LANG=C.UTF-8 TMPDIR="$root/tmp" GIT_TERMINAL_PROMPT=0 \
          python3 -B "$root/delayed_ack_receipt.py" gap 8ceb0ea415f881eada665c0fb4229e351d668f46 "$root/out/gap"
    - name: Validate the public gap receipt
      if: always()
      id: gap
      run: |
        python3 - <<'PYTHON'
        import json, os, pathlib, re
        p = pathlib.Path(os.environ["RUNNER_TEMP"], "tcp-ack-restore/out/gap/result.json")
        assert not p.is_symlink() and 0 < p.stat().st_size < 100000
        b = p.read_bytes()
        assert json.loads(b)["status"] in {"INCOMPLETE", "FAIL", "PASS"}
        assert not re.search(rb'(?i)authorization\s*[:=]|github_pat_|gh[pousr]_', b)
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.gap.outcome == 'success'
      with:
        name: gap-ack
        path: ${{ runner.temp }}/tcp-ack-restore/out/gap/result.json
        if-no-files-found: error
    - name: Compare the same live checkpoint on the author and corrected sources
      timeout-minutes: 33
      run: |
        set -eu
        root="$RUNNER_TEMP/tcp-ack-restore"
        failed=0
        for phase in stock fixed; do
          case "$phase" in
            stock) source=cbb089c143d33281025229a2a7cf1495b2dc675f ;;
            fixed) source=0bb42c582ef70adb7f3022d9cd55cdb489e09844 ;;
          esac
          git switch --quiet --detach "$source"
          env -i HOME="$HOME" PATH="$root/bin:/usr/local/bin:/usr/bin:/bin" USER=runner LANG=C.UTF-8 TMPDIR="$root/tmp" GIT_TERMINAL_PROMPT=0 \
            python3 -B "$root/delayed_ack_receipt.py" "$phase" "$source" "$root/out/$phase" || failed=1
        done
        exit "$failed"
    - name: Validate the two public restore receipts
      if: always()
      id: restore
      run: |
        python3 - <<'PYTHON'
        import json, os, pathlib, re
        root = pathlib.Path(os.environ["RUNNER_TEMP"], "tcp-ack-restore/out")
        for phase in ("stock", "fixed"):
            p = root / phase / "result.json"
            assert not p.is_symlink() and 0 < p.stat().st_size < 100000
            b = p.read_bytes()
            assert json.loads(b)["status"] in {"INCOMPLETE", "FAIL", "PASS"}
            assert not re.search(rb'(?i)authorization\s*[:=]|github_pat_|gh[pousr]_', b)
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.restore.outcome == 'success'
      with:
        name: restore-ack
        path: |
          ${{ runner.temp }}/tcp-ack-restore/out/stock/result.json
          ${{ runner.temp }}/tcp-ack-restore/out/fixed/result.json
        if-no-files-found: error
