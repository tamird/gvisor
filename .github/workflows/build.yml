name: Run the already-built iperf image and its Go workload on native ARM
on:
  push:
    branches: [qualification/official-go-images]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 12
      - name: Retrieve the exact context from the previous successful ARM64 Bazel build
        id: archive
        timeout-minutes: 5
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          mkdir -p "$RUNNER_TEMP/native-arm/archive"
          python3 test/rbe/iperf-recover-context.py "$RUNNER_TEMP/native-arm/archive" a755857a-c2d8-465d-8b4c-13c7f5da31f7
          docker load -i "$RUNNER_TEMP/iperf-original-image.tar"
          tag=gvisor.dev/images/benchmarks/iperf
          test "$(docker image inspect "$tag:latest" --format '{{.Architecture}}')" = arm64
          docker tag "$tag:latest" "$tag:arm64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-arm64-iperf-archive
          path: ${{ runner.temp }}/native-arm/archive
          if-no-files-found: warn
      - name: Transfer over TCP between the two unprivileged native containers
        id: transfer
        timeout-minutes: 3
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/native-arm/transfer"; mkdir -p "$r"
          exec > >(tee "$r/coordinator.log") 2>&1
          uname -a
          docker network create iperf-net
          image=gvisor.dev/images/benchmarks/iperf:arm64
          docker run -d --name iperfs --network iperf-net --user 65532:65532 "$image" iperf3 -s --forceflush
          cleanup() { docker logs iperfs >"$r/server.log" 2>&1 || :; docker logs iperfc >"$r/client.json" 2>"$r/client.err" || :; docker rm -f iperfc iperfs >/dev/null 2>&1 || :; docker network rm iperf-net >/dev/null 2>&1 || :; }; trap cleanup EXIT
          for i in {1..20}; do docker logs iperfs 2>&1 | grep -q 'Server listening' && break; sleep 1; done
          docker logs iperfs 2>&1 | grep 'Server listening'
          docker run -d --name iperfc --network iperf-net --user 65532:65532 "$image" iperf3 -c iperfs -t 1 --connect-timeout 5000 --json
          timeout 35s docker wait iperfc >"$r/client-exit"
          grep -Fx 0 "$r/client-exit"
          docker logs iperfc >"$r/client.json"
          python3 - "$r" <<'PYTHON'
          from pathlib import Path
          import json,sys
          p=Path(sys.argv[1]);d=json.loads((p/'client.json').read_text())
          assert not d.get('error') and min(d['end'][k]['bytes'] for k in ('sum_sent','sum_received'))>0
          (p/'verdict').write_text('PASS '+str([d['end'][k]['bytes'] for k in ('sum_sent','sum_received')])+'\n')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.transfer.outcome != 'skipped'
        with:
          name: native-arm64-iperf-transfer
          path: ${{ runner.temp }}/native-arm/transfer
          if-no-files-found: error
      - name: Set up the native Bazel coordinator
        id: setup
        if: always() && steps.archive.outcome == 'success'
        uses: bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77
      - name: Execute the eight original Go benchmark cases against the native payload
        if: always() && steps.setup.outcome == 'success' && steps.transfer.outcome == 'success'
        id: go
        timeout-minutes: 70
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:test/rbe/iperf-go-consumers.sh" >"$RUNNER_TEMP/iperf-go-consumers.sh"
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          umask 077
          printf 'build --remote_cache=grpcs://remote.buildbuddy.io\nbuild --bes_backend=grpcs://remote.buildbuddy.io\nbuild --bes_results_url=https://app.buildbuddy.io/invocation/\nbuild --remote_header=x-buildbuddy-api-key=%s\nbuild --bes_header=x-buildbuddy-api-key=%s\nbuild --noremote_upload_local_results\n' "$BUILDBUDDY_API_KEY" "$BUILDBUDDY_API_KEY" >"$RUNNER_TEMP/images.bazelrc"
          unset BUILDBUDDY_API_KEY
          command -v bazel
          bash "$RUNNER_TEMP/iperf-go-consumers.sh" iperf aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.go.outcome != 'skipped'
        with:
          name: native-arm64-iperf-go-consumers
          path: ${{ runner.temp }}/iperf-results/iperf-go-aarch64
          if-no-files-found: error
