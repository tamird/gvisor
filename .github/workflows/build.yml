name: Qualify native nine-file release packages
on:
  push:
    branches: [qualification/netgofer-native-packages]
permissions:
  contents: read
  actions: read
jobs:
  release-member:
    if: github.repository == 'tamird/gvisor' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Install the pinned coordinator tools
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/bazelisk-bin" "$RUNNER_TEMP/release-evidence"
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazelisk-bin/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/bazelisk-bin/bazel" | sha256sum -c -
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bazelisk-bin/bazel" "$RUNNER_TEMP/bb"
          echo "$RUNNER_TEMP/bazelisk-bin" >> "$GITHUB_PATH"
          echo "USE_BAZEL_VERSION=$(cat images/default/bazelversion)" >> "$GITHUB_ENV"
      - name: Pin the product checkout and retain only the verified platform declaration
        env: {PRODUCT: 2882b32e315991b4063c0baf2aedd40539ce6fd4}
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git rev-parse HEAD^^)" = 96057fa928e75e6ff35836902bd4e73297ff1aa9
          cp -R test/rbe/release_prewarmer "$RUNNER_TEMP/harness"
          git checkout --detach "$PRODUCT"
          mkdir test/rbe/release_prewarmer
          cp "$RUNNER_TEMP/harness/BUILD" test/rbe/release_prewarmer/BUILD
          test "$(git hash-object test/rbe/release_prewarmer/BUILD)" = "0942c3a1b2856d6b31866ec8bb60e280ba38a011"
          test -z "$(git diff --name-only HEAD)"
      - name: Bind the existing nine-file native receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api repos/tamird/gvisor/actions/artifacts/13292873920/zip > "$RUNNER_TEMP/native.zip"
          echo "b2294286e527abd8c795f7c4f789fac8e660bc785968156bb845b3cd12e3213f  $RUNNER_TEMP/native.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/native.zip" -d "$RUNNER_TEMP/prior"
      - name: Configure remote execution for the two optimized builds
        id: remote
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/sidecar.bazelrc"
          unset BUILDBUDDY_API_KEY
      - name: Build and inspect the three AMD64 packages
        run: python3 "$RUNNER_TEMP/harness/full.py" amd64
      - name: Build and inspect the three ARM64 packages
        if: always() && !cancelled() && steps.remote.outcome == 'success'
        run: python3 "$RUNNER_TEMP/harness/full.py" arm64
      - name: Reconcile all six outputs
        if: always() && !cancelled()
        run: python3 "$RUNNER_TEMP/harness/full.py" verdict
      - name: Check the allowlisted public evidence
        id: privacy
        if: always()
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "release-evidence"
          allowed = {"amd64.json","arm64.json","verdict.json"}
          files = list(root.iterdir())
          key = os.environ["ACCESS"].encode()
          assert key and files
          for f in files:
              assert f.name in allowed and f.is_file() and not f.is_symlink()
              raw = f.read_bytes()
              assert len(raw) < 250000
              json.loads(raw)
              assert not any(x in raw for x in (key, b"remote_header", b"bes_header", b"Authorization:", b"X-Amz-Signature", b"Bearer "))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: nine-file-native-packages
          path: ${{ runner.temp }}/release-evidence/*.json
          if-no-files-found: error
