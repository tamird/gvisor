name: Compare the original two ARM64 runsc executables
on:
  push:
    branches: [qualification/arm64-release-elf-comparison]
permissions: {contents: read}
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind immutable input identities and the published source tree
        run: |
          set -eu
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD^)" = 1efa43a80d41e8086637de22d10d58ce2352926d
          test "$(git rev-parse HEAD^^)" = bb983b988802b854bd03dd7a0a5220e7e7b4440e
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/release_elf/**'
          mkdir -m 700 "$RUNNER_TEMP/release-elf-comparison"
      - name: Retrieve only the two original digest-bound runsc files
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          python3 -IB .github/qualification/release_elf/fetch.py "$RUNNER_TEMP/release-elf-comparison"
      - name: Compare ELF data offline without executing the programs
        run: |
          set -eu
          d="$RUNNER_TEMP/release-elf-comparison"
          if jq -e '.direct.verified and .paired.verified' "$d/fetch.json" >/dev/null; then
            env -i HOME="$d" PATH="$PATH" LANG=C LC_ALL=C GOTOOLCHAIN=local python3 -EsB .github/qualification/release_elf/compare.py "$d"
          fi
      - name: Retain only the bounded public observations
        id: collect
        if: always() && !cancelled()
        run: |
          set -eu
          d="$RUNNER_TEMP/release-elf-comparison"
          rm -f "$d/direct" "$d/paired"
          mkdir -m 700 "$d/publish"
          for name in fetch comparison; do
            f="$d/$name.json"
            if test -e "$f"; then
              test -f "$f"
              test ! -L "$f"
              test "$(wc -c <"$f")" -lt 45000
              if grep -Eiq 'x-buildbuddy-api-key|authorization[[:space:]]*:|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}|/home/|/Users/|/tmp/' "$f"; then exit 1; fi
              cp "$f" "$d/publish/$name.json"
            fi
          done
          test -f "$d/publish/fetch.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.collect.outcome == 'success'
        with:
          name: arm64-original-release-elf-comparison
          path: ${{ runner.temp }}/release-elf-comparison/publish/*.json
          retention-days: 14
          if-no-files-found: error
      - name: Require original inputs and a complete comparison
        if: always() && steps.collect.outcome == 'success'
        run: |
          d="$RUNNER_TEMP/release-elf-comparison/publish"
          jq -e '.direct.verified and .paired.verified' "$d/fetch.json" >/dev/null
          jq -e '.verified and .nativeARM64' "$d/comparison.json" >/dev/null
