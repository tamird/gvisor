name: Recover original downstream LLVM outputs
on:
  push:
    branches: [qualification/external-protoc-llvm-recovery]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 5, persist-credentials: false}
      - name: Prepare original-byte recovery without a Bazel build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          d="$RUNNER_TEMP/external-go"
          mkdir -p "$d"
          cp test/rbe/external_protoc_recover.py "$d/"
          echo '{"verdict":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/external-protoc-recovery.json"
          curl --retry 3 -fsSL https://raw.githubusercontent.com/tamird/gvisor/56ed4a613a3f82c5005718e4404a5393647aba06/.github/qualification/lint-pilot/check.py -o "$d/check.py"
          curl --retry 3 -fsSL https://raw.githubusercontent.com/tamird/gvisor/bb077e758a01445b6e757c067d0313408ff6f622/test/rbe/external_go_policy.py -o "$d/external_go_policy.py"
          curl --retry 3 -fsSL https://raw.githubusercontent.com/tamird/gvisor/702294b69b629cedd9b74133aa4f37b10ddc82b3/test/rbe/plugin_programs/cas_inputs.py -o "$d/cas_inputs.py"
          printf '%s  %s\n' b4bc68892ad98df6cce81a8e35e0a3c01b83069c80eefa6c146b8d4d27ceeed7 "$d/cas_inputs.py" | sha256sum -c -
          curl --retry 3 -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-x86_64 -o "$RUNNER_TEMP/bb"
          printf '%s  %s\n' bdb65b4bddb8405a80b3e45a3ef4c740819b151d0709d360e8add8dac534c224 "$RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
          if ! gh api repos/tamird/gvisor/actions/artifacts/13126238909/zip > "$d/original.zip" 2> "$d/download.log"; then
            printf '%s\n' 'Original archive unavailable; recovery will retain INCOMPLETE.'
          fi
      - name: Reconcile original startup and identify actual proto generators
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B "$RUNNER_TEMP/external-go/external_protoc_recover.py"
      - name: Check the sole typed report
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "external-protoc-recovery.json"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size < 2 * 1024 * 1024
          data = p.read_bytes()
          key = os.environ["KEY"].encode()
          assert key and key not in data
          assert all(s not in data.lower() for s in (b"x-buildbuddy-api-key", b"authorization:", b"bearer "))
          assert isinstance(json.loads(data), dict)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: external-protoc-recovery
          path: ${{ runner.temp }}/external-protoc-recovery.json
          if-no-files-found: error
