name: Compare LLVM execution configurations on native Linux
on:
  push:
    branches: [qualification/llvm-filter-config-diff]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Select the original source and retain only the analysis harness
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = de7d8d5fd58280a7a60c5bcf3e560c9b137b8484
          test "$(git rev-parse HEAD^^)" = 53c458937842fb431ef351c39781850f5a817234
          cp .github/qualification/{source_presubmit_memory.py,filter_config_diff.py} "$RUNNER_TEMP/"
          git checkout --quiet --detach 53c458937842fb431ef351c39781850f5a817234
          test "$(bazelisk --version)" = "bazel 9.3.1"
      - name: Measure and size the Bazel server
        run: python3 -IB "$RUNNER_TEMP/source_presubmit_memory.py"
      - name: Compare the five original targets without executing any actions
        run: python3 -IB "$RUNNER_TEMP/filter_config_diff.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: llvm-config-comparison
          path: ${{ runner.temp }}/llvm-config-comparison.json
          if-no-files-found: error
          retention-days: 14
