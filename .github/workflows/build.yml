name: CI
"on":
  push:
    branches: [qualification/mixed-native-owner-inventory]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 3
        persist-credentials: false
    - name: Query both native labels for the 363 original owners
      run: python3 -IB .github/qualification/mixed_owner_inventory.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: native-owner-inventory
        path: ${{ runner.temp }}/mixed-owner-inventory/receipt.json
        if-no-files-found: error
        retention-days: 14
