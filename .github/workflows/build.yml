name: Check the TCP closing state timer locks
on:
  push:
    branches: [qualification/tcp-close-timer-locks]
permissions: {contents: read}
jobs:
  analyzer:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 4, persist-credentials: false}
      - name: Use the exact product source and ordinary native compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2e28b2d8df19dcedb294a7372539dbd39fca83ef
          test "$(git rev-parse HEAD^^)" = b4672b800defab1365964be948bbcefe888e1325
          test "$(git rev-parse HEAD^^^)" = 90d4e2253f004cdc73a35dbc4050eab3e9a8495d
          cp .github/qualification/tcp-close-timers.py "$RUNNER_TEMP/"
          git switch --detach HEAD^^
          test -z "$(git status --porcelain)"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu
      - name: Check the close timer handles on both analyzed architectures
        run: python3 "$RUNNER_TEMP/tcp-close-timers.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: tcp-close-timer-locks
          path: ${{ runner.temp }}/tcp-close-timers.json
          if-no-files-found: error
