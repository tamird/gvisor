name: Measure the default syscall workers without running the workloads
"on":
  push:
    branches: [qualification/syscall-default-worker-capacity]
permissions: {contents: read}
jobs:
  capacity:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the worker probes to the unmodified integration and graphs
        run: |
          set -eu
          umask 077
          work="$RUNNER_TEMP/syscall-default-capacity"
          mkdir "$work"
          stock=f6d6788e84731673a155c9fff6f28b8624e34c50
          test "$(git rev-parse HEAD^)" = "$stock"
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/syscall_capacity.py' ':!test/rbe/syscall_capacity/BUILD' ':!test/rbe/syscall_capacity/observe.sh'
          cp .github/qualification/syscall_capacity.py "$work/qualify.py"
          git diff --exit-code "$stock" HEAD -- test/runner test/syscalls .bazelrc test/rbe/BUILD
          public=https://github.com/tamird/gvisor.git
          donor=84ba23476d0f89f176ebb243f8408bc9f1b84022
          parser=eec8914ee486c04cc2e53e41d79ba32022e85ceb
          GIT_TERMINAL_PROMPT=0 git fetch -q --depth=1 "$public" "$donor"
          git show "$donor:.github/qualification/syscall-test-sizes/graph.py" > "$work/graph.py"
          GIT_TERMINAL_PROMPT=0 git fetch -q --depth=1 "$public" "$parser"
          git show "$parser:.github/qualification/native_graph.py" > "$work/native_graph.py"
          test "$(cat .bazelversion)" = 9.3.1
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$work/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $work/bazel" | sha256sum -c -
          chmod 700 "$work/bazel"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$work/qualify.py" graph
      - name: Read capacity from the two matched test worker sizes
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          work="$RUNNER_TEMP/syscall-default-capacity"
          rc="$work/remote.bazelrc"
          trap 'rm -f "$rc"' EXIT
          : "${BUILDBUDDY_API_KEY:?missing fork key}"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$work/qualify.py" observe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: syscall-default-capacity
          path: ${{ runner.temp }}/syscall-default-capacity/receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove coordinator files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/syscall-default-capacity"
