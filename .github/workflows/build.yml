name: Check the Buildkite runtime installation
on:
  push:
    branches: [qualification/buildkite-readme-runtime-install]
permissions:
  contents: read
jobs:
  install:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install the release and start a container through each hook branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5580eac32b0141ea984fae122d52fc30cb13ded7
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml'
          git checkout --detach HEAD^
          python3 - <<'PY'
          import bz2
          import gzip
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import tarfile
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          report = {"source": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), "installs": {}}
          text = Path(".buildkite/hooks/pre-command").read_text()
          start = text.index('  if [[ -n "${STAGED_BINARIES:-}" ]]')
          end = text.index('  if [[ "$HAD_EXPERIMENTAL"', start)
          snippet = text[start:end]
          archive = Path("bin/gvisor.tar.bz2")
          subprocess.run(["bash", "-euo", "pipefail", "-c", "tar -C / -chf - bin/true lib/x86_64-linux-gnu/libc.so.6 lib64/ld-linux-x86-64.so.2 | docker import - hook-probe"], check=True)
          try:
              for name in ("source", "archive"):
                  env = dict(os.environ, RUNTIME="buildkite_" + name, DOCKER_BUILD="true")
                  env.pop("BUILDKITE_STAGED_BINARIES_DIRECTORY", None)
                  env.pop("STAGED_BINARIES", None)
                  env.pop("RUNTIME_ARGS", None)
                  expect_args = []
                  command = snippet
                  if name == "archive":
                      staged = temp / "published.tar.gz"
                      with bz2.open(archive, "rb") as src, gzip.open(staged, "wb") as dst:
                          shutil.copyfileobj(src, dst)
                      env["STAGED_BINARIES"] = str(staged)
                      expect_args = ["--platform=systrap", "--debug"]
                      env["RUNTIME_ARGS"] = " ".join(expect_args)
                      command = 'gcloud() { [[ $# == 3 && $1 == storage && $2 == cat && $3 == "$STAGED_BINARIES" ]] && cat "$3"; }\n' + snippet
                  directory_record = temp / (name + "-stage-dir")
                  env["DIRECTORY_RECORD"] = str(directory_record)
                  command += '\nprintf "%s" "${BUILDKITE_STAGED_BINARIES_DIRECTORY:-}" > "$DIRECTORY_RECORD"'
                  subprocess.run(["bash", "-euo", "pipefail", "-c", command], env=env, check=True)
                  config = json.loads(subprocess.check_output(["sudo", "cat", "/etc/docker/daemon.json"]))
                  entry = config["runtimes"][env["RUNTIME"]]
                  actual = Path(entry["path"])
                  assert entry.get("runtimeArgs", []) == expect_args, entry
                  assert (actual == Path("/usr/local/bin/runsc")) == (name == "source"), actual
                  files = []
                  with tarfile.open(archive, "r:bz2") as release:
                      for member in release.getmembers():
                          if member.isfile():
                              installed = actual.parent / member.name
                              with release.extractfile(member) as f:
                                  assert hashlib.file_digest(f, "sha256").digest() == hashlib.sha256(installed.read_bytes()).digest(), installed
                              assert (installed.stat().st_mode & 0o777) == (member.mode & 0o777), installed
                              files.append(str(Path(member.name)))
                  assert {"runsc", "containerd-shim-runsc-v1", "gvisor-bin/gvisor_sentry", "gvisor-bin/runsc-netgofer"} <= set(files), files
                  assert len(files) == 9 and len(set(files)) == 9, files
                  stage_dir = directory_record.read_text()
                  assert stage_dir == (str(actual.parent) if name == "archive" else ""), stage_dir
                  result = {"file": str(actual), "args": expect_args, "files": sorted(files)}
                  report["installs"][name] = result
                  subprocess.run(["sudo", "systemctl", "restart", "docker"], check=True)
                  result["guestExit"] = subprocess.run(["docker", "run", "--rm", "--network=none", "--runtime=" + env["RUNTIME"], "hook-probe", "/bin/true"], timeout=120).returncode
                  assert result["guestExit"] == 0, name
                  env.update(BUILDKITE_COMMAND_EXIT_STATUS="0", BUILDKITE_PIPELINE_INSTALL_RUNTIME="true",
                             DOCKER_RELOAD_COMMAND="sudo systemctl reload docker", BUILDKITE_LABEL="install")
                  if stage_dir:
                      env["BUILDKITE_STAGED_BINARIES_DIRECTORY"] = stage_dir
                  subprocess.run(["bash", ".buildkite/hooks/post-command"], env=env, check=True)
                  runtimes = json.loads(subprocess.check_output(["docker", "info", "--format", "{{json .Runtimes}}"]))
                  assert env["RUNTIME"] not in runtimes, runtimes
                  assert all((Path("/usr/local/bin") / file).is_file() for file in files), files
                  assert not stage_dir or not Path(stage_dir).exists(), stage_dir
                  result["deregistered"] = True
                  result["sourceFilesRemain"] = True
                  if stage_dir:
                      result["stagedDirectoryRemoved"] = True
              report["verified"] = True
          finally:
              (temp / "install-results.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: install-results
          path: ${{ runner.temp }}/install-results.json
          if-no-files-found: warn
