name: Qualify the TCP data retry budget
on:
  push:
    branches: [qualification/tcp-retry-budget-native]
permissions: {contents: read}
jobs:
  replay:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 4}
      - name: Bind both TCP sources and the native Bazel client
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = a8286c8056a6c2302f62c6dd52e9d818b9c224d9
          test "$(git rev-parse HEAD^^)" = f47e3a56425482ba7090735302d6454757086d51
          test "$(uname -m)" = x86_64
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/bazel" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bazel"
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo
      - name: Compare the retry regression, Linux sender and corrected bursts
        run: python3 .github/qualification/rto_deadline.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: retry-budget
          path: ${{ runner.temp }}/rto-diagnostics/receipt.json
          if-no-files-found: warn
          retention-days: 14
