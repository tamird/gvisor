name: Check 1 GiB overlay checkpoints on loop-mounted ext4
on:
  push:
    branches: [qualification/checkpoint-ext4-capacity]
permissions:
  contents: read
jobs:
  checkpoint:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: aa767e4c43d011121271551fe24da501a56f729d
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 12, persist-credentials: false}
    - name: Mount the two disk-backed checkpoint destinations
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records"
        exec > >(tee "$RUNNER_TEMP/records/filesystems") 2>&1
        # Reserve the backing bytes, and disable mkfs discard so disk
        # exhaustion on the host cannot masquerade as ENOSPC on the loop.
        base="$RUNNER_TEMP/checkpoint-ext4"
        mkdir -p "$base"
        for arm in roomy full; do
          disk="$base/$arm.img"
          mountpoint="$base/$arm"
          mkdir "$mountpoint"
          fallocate -l 1536M "$disk"
          mkfs.ext4 -q -F -m 0 -E nodiscard,lazy_itable_init=0,lazy_journal_init=0 "$disk"
          sudo mount -t ext4 -o loop,nosuid,nodev "$disk" "$mountpoint"
          sudo install -d -m 0777 "$mountpoint/image"
          if [[ "$arm" == full ]]; then
            free=$(df --output=avail -B1 "$mountpoint" | tail -1)
            sudo fallocate -l "$((free - 200*1024*1024))" "$mountpoint/occupied"
            sync -f "$mountpoint"
          fi
          source=$(findmnt -nro SOURCE -T "$mountpoint")
          type=$(findmnt -nro FSTYPE -T "$mountpoint")
          [[ "$source" == /dev/loop* && "$type" == ext4 ]]
          printf '%s loop=%s type=%s before=%s\n' "$arm" "$source" "$type" "$(df --output=avail -B1 "$mountpoint" | tail -1 | tr -d ' ')"
        done
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        git merge-base --is-ancestor "$PRODUCT" HEAD
        test "$(git rev-parse HEAD:runsc/container/container_save_restore_test.go)" = "1908ee5af4f5a3ed7a945754115368570bc2f048"
        git diff --exit-code "$PRODUCT" HEAD -- . ':!.github/workflows/build.yml' ':!runsc/container/container_save_restore_test.go'
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /var/run/docker.sock:/var/run/docker.sock -v "$(command -v docker):/usr/local/bin/docker:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -v "$RUNNER_TEMP/checkpoint-ext4/roomy/image:/checkpoint-destinations/roomy:rw" -v "$RUNNER_TEMP/checkpoint-ext4/full/image:/checkpoint-destinations/full:rw" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Checkpoint a disk-backed writable layer onto roomy and nearly full ext4
      id: measure
      run: |
        set -euo pipefail
        report="$RUNNER_TEMP/records"
        iid=$(cat /proc/sys/kernel/random/uuid)
        printf '%s\n' "$iid" > "$report/invocation-id"
        rc=0
        timeout --signal=TERM --kill-after=30s 52m docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --invocation_id="$iid" --config=x86_64 --spawn_strategy=remote,local --noremote_upload_local_results --strategy=GoStaticAnalysis=local --strategy=GoStandardLibraryAnalysis=local --strategy=TestRunner=local --jobs=24 --test_filter='^TestCheckpointDestinationCapacity$' --test_sharding_strategy=disabled --nocache_test_results --test_arg=-test.v --test_timeout=1200 //runsc/container:container_test > "$RUNNER_TEMP/capacity-bazel.log" 2>&1 || rc=$?
        echo "$rc" > "$report/bazel-exit"
        date -u +%FT%T.%3NZ > "$report/execution-finished"
        grep -E 'ERROR:|error:|Invocation ID:|failed to build| timed out' "$RUNNER_TEMP/capacity-bazel.log" | tail -20 > "$report/build-diagnostics" || true
        docker exec tcp-compiler cat bazel-testlogs/runsc/container/container_test/test.log | grep -E 'PAYLOAD |CHECKPOINT |DESTINATION |CAPACITY |RESTORED |=== RUN|--- (PASS|FAIL|SKIP)|container_save_restore_test.go:[0-9]+:' > "$report/test-observations" || true
        docker exec tcp-compiler cat bazel-testlogs/runsc/container/container_test/test.xml > "$report/test.xml" || true
        if [[ "$rc" != 0 ]]; then
          docker exec tcp-compiler sh -c 'grep -rh -F "FATAL ERROR:" bazel-testlogs/runsc/container/container_test/test.outputs/ 2>/dev/null | head -12 | cut -c1-1200' > "$report/sandbox-errors" || true
        fi
        exit "$rc"
    - name: Reconcile the two original cases
      if: always()
      run: |
        python3 - <<'PYTHON'
        import datetime, hashlib, json, os, re
        from pathlib import Path
        from xml.etree import ElementTree

        root = Path(os.environ["RUNNER_TEMP"]) / "records"
        root.mkdir(exist_ok=True)
        def read(name):
            path = root / name
            return path.read_text().strip() if path.exists() else ""

        cases = {"roomy": [], "full": []}
        xml = root / "test.xml"
        try:
            for case in ElementTree.parse(xml).iter("testcase"):
                parent, _, name = case.get("name", "").partition("/")
                if case.get("classname") == "container" and parent == "TestCheckpointDestinationCapacity" and name in cases:
                    status = "passed"
                    if case.find("failure") is not None or case.find("error") is not None:
                        status = "failed"
                    elif case.find("skipped") is not None or case.get("status") == "notrun":
                        status = "skipped"
                    cases[name].append(status)
        except (OSError, ElementTree.ParseError):
            pass
        log = read("test-observations")
        mounts = read("filesystems")
        def one(pattern):
            matches = re.findall(pattern, log, re.MULTILINE)
            return matches[0] if len(matches) == 1 else None

        arms = {}
        for name, statuses in cases.items():
            mount = re.findall(rf"^{name} loop=(/dev/loop[0-9]+) type=ext4 before=(\d+)$", mounts, re.MULTILINE)
            size_before = one(rf"DESTINATION {name} before type=0xef53 size=(\d+) available=(\d+)$")
            size_after = one(rf"DESTINATION {name} after type=0xef53 size=(\d+) available=(\d+)$")
            payload = one(rf"PAYLOAD {name} bytes=1073741824 sha256=([0-9a-f]{{64}})$")
            restored = one(rf"RESTORED {name} bytes=1073741824 sha256=([0-9a-f]{{64}})$")
            save = one(rf"CAPACITY {name} pages=(-?\d+) checkpoint_error=(.*)$")
            observed = None
            if len(mount) == 1 and size_before and size_after and size_before[0] == size_after[0] and payload and save:
                pages, err = save
                if err == "<nil>" and restored == payload and statuses == ["passed"]:
                    observed = "success_and_verified_restore"
                elif name == "full" and err == "<nil>" and statuses == ["failed"] and re.search(r"(RESTORE_ERROR|CHECKSUM_MISMATCH) full", log):
                    observed = "success_then_restore_failure"
                elif name == "full" and err == "<nil>" and statuses == ["failed"] and "RESTORED_READ_ERROR full " in log:
                    observed = "success_then_restored_payload_read_error"
                elif name == "full" and "no space left on device" in err.lower() and statuses == ["passed"] and int(pages) > 0:
                    observed = "reported_enospc"
            arms[name] = dict(xml=statuses, mount=mount, before=size_before, after=size_after, originalSHA256=payload,
                              restoredSHA256=restored, save=save, outcome=observed)
        full = arms["full"]["outcome"]
        expected_exit = "3" if full in ("success_then_restore_failure", "success_then_restored_payload_read_error") else "0"
        verified = (read("bazel-exit") == expected_exit and arms["roomy"]["outcome"] == "success_and_verified_restore"
                    and bool(full) and arms["roomy"]["mount"][0][0] != arms["full"]["mount"][0][0])
        result = dict(product=os.environ["PRODUCT"], fixture=os.environ["GITHUB_SHA"], fixtureBlob="1908ee5af4f5a3ed7a945754115368570bc2f048",
                      invocation=read("invocation-id"), bazelExit=read("bazel-exit"), arms=arms,
                      xmlSHA256=hashlib.sha256(xml.read_bytes()).hexdigest() if xml.exists() else None,
                      verified=verified, finished=read("execution-finished"), verifiedAt=datetime.datetime.now(datetime.timezone.utc).isoformat())
        (root / "verdict.json").write_text(json.dumps(result, indent=2) + "\n")
        print(json.dumps(result))
        raise SystemExit(0 if verified else 1)
        PYTHON
    - name: Release the ephemeral loop mounts
      if: always()
      run: |
        docker rm -f tcp-compiler >/dev/null 2>&1 || true
        for arm in roomy full; do
          mountpoint="$RUNNER_TEMP/checkpoint-ext4/$arm"
          if mountpoint -q "$mountpoint"; then sudo umount "$mountpoint"; fi
        done
    - name: Check the original evidence before upload
      id: sanitize
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key = os.environ["BB_KEY"].encode()
        assert key
        for f in (Path(os.environ["RUNNER_TEMP"]) / "records").iterdir():
            data=f.read_bytes()
            assert key not in data and b"x-buildbuddy-api-key=" not in data
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.sanitize.outcome == 'success' }}
      with:
        name: checkpoint-ext4-capacity
        path: ${{ runner.temp }}/records
        if-no-files-found: error
