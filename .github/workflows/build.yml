name: Check fdbased packet delivery and worker shutdown on native Linux
on:
  push:
    branches: [qualification/fdbased-inline-and-workers]
permissions:
  contents: read
jobs:
  receive:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the product and qualify the private network namespace
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 4e0324239c7e64cb4d1cb12e804603aa85a963f3
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!pkg/tcpip/link/fdbased/BUILD' ':!pkg/tcpip/link/fdbased/packet_ring_linux_test.go'
          test "$(uname -m)" = x86_64
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/bazel" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bazel"
          if /usr/bin/unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo; then
            echo 'namespace=/usr/bin/unshare --user --map-root-user --net --' >> "$GITHUB_ENV"
          else
            sudo -n /usr/bin/unshare --net -- /usr/bin/test -e /sys/class/net/lo
            echo 'namespace=/usr/bin/sudo -n --preserve-env=TEST_SRCDIR,TEST_WORKSPACE,TEST_TMPDIR,XML_OUTPUT_FILE,RUNFILES_DIR,RUNFILES_MANIFEST_FILE -- /usr/bin/unshare --net --' >> "$GITHUB_ENV"
          fi
      - name: Run the fdbased package including private-loopback UDP
        run: |
          set -uo pipefail
          "$RUNNER_TEMP/bazel" --nosystem_rc --nohome_rc --host_jvm_args=-Xmx3g test --config=x86_64 --jobs=3 --strategy=TestRunner=local --nocache_test_results --test_timeout=240 --test_output=errors --run_under="$namespace" //pkg/tcpip/link/fdbased:fdbased_test
          code=$?
          if test -s bazel-testlogs/pkg/tcpip/link/fdbased/fdbased_test/test.xml; then
            cp bazel-testlogs/pkg/tcpip/link/fdbased/fdbased_test/test.xml "$RUNNER_TEMP/fdbased.xml"
          fi
          exit "$code"
      - name: Check the individual receive cases
        if: always() && !cancelled()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree as E

          root = Path(os.environ["RUNNER_TEMP"])
          tests = E.parse(root / "fdbased.xml").findall(".//testcase")
          passed = sorted(t.get("name") for t in tests if not any(t.find(tag) is not None for tag in ("error", "failure", "skipped")))
          required = (
              {"TestCloseBeforeAttach/" + m for m in ("Readv", "RecvMMsg")}
              | {"TestDispatchPacketFormat/" + m for m in ("readVDispatcher", "recvMMsgDispatcher", "readVDispatcherNoEth", "readVDispatcherNoEthIPv6")}
              | {"TestPacketMMapBeforeAttach"}
              | {"TestPacketMMapDeliversUDP/processors=" + str(n) for n in (0, 1, 2)}
          )
          record = {"source": "4e0324239c7e64cb4d1cb12e804603aa85a963f3", "total": len(tests), "passed": passed, "missing": sorted(required - set(passed))}
          (root / "fdbased.json").write_text(json.dumps(record, indent=2) + "\n")
          assert not record["missing"], record["missing"]
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: fdbased-native-receive
          path: |
            ${{ runner.temp }}/fdbased.xml
            ${{ runner.temp }}/fdbased.json
          if-no-files-found: warn
          retention-days: 7
