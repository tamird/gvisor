name: Check the quoted TCP error and segment footprint
on:
  push:
    branches: [qualification/tcp-quoted-socket-error]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PACKET: 1dd6ebc0115dcf69806034f43e757ac92ad76612
      CANDIDATE: 99504c38e1d016b0f5fd17ff419ac0b1c47e0406
      TERMINAL: ec72fa020b00d78a5c983f9296852930001d87d6
      STOCK: aa767e4c43d011121271551fe24da501a56f729d
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/records/verdict.json"
        cp test/rbe/tcp-established-icmp.py "$RUNNER_TEMP/verify-tcp.py"
        git fetch -q --depth=1 https://github.com/tamird/gvisor.git "$STOCK" "$PACKET" "$CANDIDATE" "$TERMINAL"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
        docker exec tcp-compiler python3 -c 'import socket; s=socket.socket(socket.AF_INET6); s.bind(("::1",0)); print(s.getsockname())' > "$RUNNER_TEMP/records/native-ipv6"
    - name: Exercise the final queue in the packet test and owning TCP suite
      run: |
        set -eu
        git checkout --quiet --detach "$CANDIDATE"
        test "$(git rev-parse HEAD)" = "$CANDIDATE"
        git restore --source="$PACKET" -- test/packetimpact/runner/defs.bzl test/packetimpact/runner/main.go
        python3 - <<'PYFIX'
        from pathlib import Path
        p=Path('test/packetimpact/runner/main.go')
        src=p.read_text()
        assert src.count('^TestListenerReusesReceiveBuffer$') == 1
        p.write_text(src.replace('^TestListenerReusesReceiveBuffer$', '^TestTCPEstablishedICMPError$'))
        PYFIX
        d=$RUNNER_TEMP/records/fixed; mkdir -p "$d"
        sha256sum test/packetimpact/tests/tcp_connect_icmp_error_test.go > "$d/fixture"
        date -u +%FT%TZ > "$d/start"; rc=0
        timeout -k 15s 23m docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --keep_going --config=x86_64 --platforms=//tools/bazeldefs:linux_amd64 --jobs=32 --local_resources=cpu=1 '--strategy_regexp=^Compiling test/packetimpact/(dut/posix_server[.]cc|proto/.*[.]cc)=local' '--strategy_regexp=^Linking test/packetimpact/dut/posix_server=local' '--strategy_regexp=^Analyzing.(@@)?//pkg/abi/linux:linux$=local' --build_tag_filters= --test_tag_filters= --strategy=TestRunner=remote --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel --test_output=all --test_timeout=360 --test_sharding_strategy=disabled --build_event_json_file="$d/bep" //test/packetimpact/tests:tcp_connect_icmp_error_netstack_test //pkg/tcpip/transport/tcp:tcp_test //pkg/tcpip/transport/tcp:tcp_nogo > "$d/bazel.log" 2>&1 || rc=$?
        printf '%s\n' "$rc" > "$d/exit"; date -u +%FT%TZ > "$d/finish"
        python3 "$RUNNER_TEMP/verify-tcp.py" "$RUNNER_TEMP/records" progress
    - name: Compare the Go compiler's actual segment footprint with stock on each architecture
      if: always()
      run: |
        set -eu
        test "$(git rev-parse HEAD)" = "$CANDIDATE"
        git show "$STOCK":pkg/tcpip/transport/tcp/segment.go > "$RUNNER_TEMP/original.go"
        python3 - <<'PYLAYOUT'
        from pathlib import Path
        import os
        d=Path("pkg/tcpip/transport/tcp")
        old=(Path(os.environ["RUNNER_TEMP"])/"original.go").read_text()
        start=old.index("type segment struct {")
        end=old.index("\n}", start)+2
        old=old[start:end].replace("type segment struct {","type originalSegmentLayout struct {",1)
        with (d/"segment.go").open("a") as src:
            src.write("\n"+old+"\n")
        with (d/"segment_unsafe.go").open("a") as src:
            src.write("\nconst originalSize = int(unsafe.Sizeof(originalSegmentLayout{}))\nvar _ [originalSize - segSize]byte\nvar _ [segSize - originalSize]byte\n")
        PYLAYOUT
        for arch in amd64 arm64; do
          config=x86_64; [ "$arch" != arm64 ] || config=aarch64
          d=$RUNNER_TEMP/records/layout-$arch; mkdir -p "$d"; rc=0
          sha256sum "$RUNNER_TEMP/original.go" pkg/tcpip/transport/tcp/segment{,_unsafe}.go > "$d/inputs"
          date -u +%FT%TZ > "$d/start"
          timeout -k 15s 15m docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" build --config="$config" --platforms="//tools/bazeldefs:linux_$arch" --jobs=32 --build_event_json_file="$d/bep" //pkg/tcpip/transport/tcp:tcp > "$d/bazel.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$d/exit"; date -u +%FT%TZ > "$d/finish"
          python3 "$RUNNER_TEMP/verify-tcp.py" "$RUNNER_TEMP/records" progress
        done
        python3 "$RUNNER_TEMP/verify-tcp.py" "$RUNNER_TEMP/records"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: typed-icmp-packet-and-segment-layout
        path: ${{ runner.temp }}/records/verdict.json
        if-no-files-found: error
