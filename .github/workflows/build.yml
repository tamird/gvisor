name: Diagnose the 30-second TCP read deadline
on:
  push:
    branches: [qualification/tcp-16081-heavy-deadline-native]
permissions: {contents: read}
jobs:
  replay:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind both TCP sources and the native Bazel client
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = f51a205a8f4afbc5ab41aded070df74951b081ea
          git fetch --quiet --no-tags --depth=2 https://github.com/kekawia/gvisor.git 1b9768b199524246fe8e4fa66a0b623069778780
          test "$(git rev-parse FETCH_HEAD^)" = f51a205a8f4afbc5ab41aded070df74951b081ea
          test "$(uname -m)" = x86_64
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/bazel" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bazel"
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo
      - name: Run the loss-free controls and heavy bursts
        run: python3 .github/qualification/rto_deadline.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: tcp-deadline
          path: ${{ runner.temp }}/rto-diagnostics/receipt.json
          if-no-files-found: warn
          retention-days: 14
