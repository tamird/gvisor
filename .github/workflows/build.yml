name: Verify the declared clang-format and shared formatter
on:
  push:
    branches: [qualification/clang-format-shared]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: carrier, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: source, ref: 18f71cc3ab440eda53a47b290800ffc839943fcf, fetch-depth: 2, persist-credentials: false}
      - name: Configure the two scratch workers
        run: |
          mkdir "$RUNNER_TEMP/cpplint_qualification"
          cp carrier/.github/qualification/lint-pilot/platform.BUILD "$RUNNER_TEMP/cpplint_qualification/BUILD.bazel"
          echo 'module(name="cpplint_qualification")' > "$RUNNER_TEMP/cpplint_qualification/MODULE.bazel"
      - name: Run the workspace format controls
        working-directory: source
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          export QA_RC="$RUNNER_TEMP/state-review.bazelrc"
          umask 077
          trap 'rm -f "$QA_RC"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --remote_download_outputs=toplevel'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$QA_RC"
          unset BUILDBUDDY_API_KEY
          python3 -B ../carrier/.github/qualification/lint-format/check.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workspace-format
          path: ${{ runner.temp }}/workspace-format.json
          if-no-files-found: error
