name: Read original hostinet process-exit results
on:
  push:
    branches: [qualification/hostinet-exit-linger-original-receipt]
permissions:
  contents: read
jobs:
  receipt:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Read the original per-target records
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 test/rbe/hostinet_linger_original.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: hostinet-exit-linger-original-receipt
        path: original-verdict.json
        if-no-files-found: error
