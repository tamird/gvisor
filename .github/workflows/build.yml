name: Compare native Sentry startup from retained artifacts
on:
  push:
    branches: [qualification/unnamed-sentry-startup]
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Fetch the exact release and guest from the completed checkpoint comparison
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --max-time 120 \
          https://github.com/buildbuddy-io/bazel/releases/download/5.0.488/bazel-5.0.488-linux-x86_64 \
          --output "$RUNNER_TEMP/bb"
        echo "f0d85b1514f784dc25705dd3bbeeaa1e603b5449f721c26add0245198f03e7cb  $RUNNER_TEMP/bb" | sha256sum --check --strict
        chmod +x "$RUNNER_TEMP/bb"
        python3 .github/qualification/unnamed-startup.py --prepare
    - name: Run balanced systrap starts and check the real guest's output
      run: |
        set -euo pipefail
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        sudo env "RUNNER_TEMP=$RUNNER_TEMP" python3 .github/qualification/unnamed-startup.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-unnamed-sentry-startup
        path: ${{ runner.temp }}/startup-proof
        if-no-files-found: error
