name: Benchmark the address representation on Linux
on:
  push:
    branches: [qualification/netip-address-bench-20261112]
permissions: {}
jobs:
  benchmark:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Bind the immutable sources, benchmark fixture and compiler
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/address-benchmark"
          mkdir -m 700 "$w" "$w/results"
          mkdir -p "$RUNNER_TEMP/recvbuf/dist"
          blob=f0a0dff5f142d62c069ece3c7c412d1fe01f0ea3
          tool=acf23f56381ba4c9279780f6f8f64a06cb801c95
          prep=1dd5c8738089670485a347cfb85dad07b92d0e0d
          assets=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
          inputs=c3569a60dc1836ac6fad05e86d7951866c796b4f
          git init -q .
          git fetch -q --no-auto-maintenance --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$blob" "$tool" "$prep" "$assets" "$inputs"
          test "$(git rev-parse "$GITHUB_SHA^")" = 3aaa8098b633dab610b06e4c6d92122c24037451
          test "$(git rev-parse "$GITHUB_SHA^^")" = 2a653cea7b2054a2dc9c6419337d3de8031275d6
          git diff --exit-code "$GITHUB_SHA^" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!.github/qualification/address_benchmark.py'
          git show "$GITHUB_SHA:.github/qualification/address_benchmark.py" > "$w/compare.py"
          git show "$blob:pkg/tcpip/address_bench_test.go" > "$w/address_bench_test.go"
          test "$(git hash-object "$w/address_bench_test.go")" = afd561e9f6f8552d962c13aa72a9c653183b984f
          cp "$w/address_bench_test.go" "$w/results/"
          git show "$tool:MODULE.bazel" > "$w/october.star"
          python3 - "$w" <<'PY'
          import re, sys
          from pathlib import Path
          w = Path(sys.argv[1])
          blocks = [s for s in re.findall(r'^go_deps[.]module\(\n.*?^\)\n', (w/'october.star').read_text(), re.M|re.S)
                    if 'path = "golang.org/x/perf"' in s or 'path = "github.com/aclements/go-moremath"' in s]
          assert len(blocks) == 2
          (w/'benchstat.star').write_text(''.join(blocks))
          PY
          git show "$prep:.github/qualification/go_branch_netgofer.py" > "$w/previous.py"
          git show "$assets:.github/qualification/recvbuf_deps.py" > "$w/public_assets.py"
          git show "$inputs:.github/qualification/tldk_public_inputs.py" > "$w/tldk_public_inputs.py"
          test "$(git hash-object "$w/previous.py")" = 0c1db7071558c5f9c8de45b60ba625183bd8a400
          test "$(git hash-object "$w/public_assets.py")" = 9a3f571087a1438113a3a067c300e26fcb0ca9e8
          test "$(git hash-object "$w/tldk_public_inputs.py")" = 1f3f7d4d75810ad60941772776e01f3b71b3b171
          curl -qfsSL --retry 2 --max-time 120 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $w/bazel" | sha256sum -c -
          chmod +x "$w/bazel"
      - name: Interleave twelve parent and change samples on one CPU
        run: |
          env -i HOME="$HOME" USER="$USER" PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" \
            python3 -B "$RUNNER_TEMP/address-benchmark/compare.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: address-benchstat
          path: ${{ runner.temp }}/address-benchmark/results
          if-no-files-found: error
          retention-days: 30
