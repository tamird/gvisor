name: Check a rejected TCP piggyback
on:
  push:
    branches: [qualification/tcp-delayed-ack-refused-response]
permissions: {}
jobs:
  packets:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Bind the native GNU client and the two public sources
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/delayed-ack"
          mkdir -m 700 "$d" "$d/src"
          cd "$d/src"
          git init -q
          git fetch --quiet --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD^)" = 26513de7a5026a086c35d791fcd9c1596984722c
          test "$(git rev-parse HEAD^^)" = f05cd8923fb8aa27186834df01d7433085db41f1
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/delayed_ack_refusal.py'
          cp .github/qualification/delayed_ack_refusal.py "$d/"
          git switch -q --detach HEAD^
          test "$(uname -sm)" = "Linux x86_64"
          test "$(cat .bazelversion)" = 9.3.1
          curl --proto '=https' --proto-redir '=https' --retry 3 -fsSL --max-time 100 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazelisk"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazelisk" | sha256sum -c
          chmod 755 "$d/bazelisk"
      - name: Observe both responses on each sender
        run: |
          d="$RUNNER_TEMP/delayed-ack"
          cd "$d/src"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -IB "$d/delayed_ack_refusal.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: rejected-tcp-piggyback
          path: ${{ runner.temp }}/delayed-ack/result.json
          if-no-files-found: error
          retention-days: 14
