name: Verify the twelve original M003 transfers from the recorded frames
on:
  push:
    branches: [qualification/tcp-m003-receipt]
permissions: {contents: read, actions: read}
jobs:
  verify:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Retrieve the original twelve recorded transfers
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh api repos/tamird/gvisor/actions/artifacts/13549555582/zip > "$RUNNER_TEMP/original.zip"
          echo "7af85f73a860d142d20e3138fc807c043d326677855eedf19223b04031adfec8  $RUNNER_TEMP/original.zip" | sha256sum -c -
      - name: Verify the actual packets and record each outcome
        run: |
          PYTHONPATH=test/rbe/m003 python3 -B - <<'PY'
          import hashlib, io, json, os, pathlib, zipfile
          from m003_test import inspect
          work = pathlib.Path(os.environ["RUNNER_TEMP"])
          results = {}
          with zipfile.ZipFile(work/"original.zip") as original:
              for name, source in (("master", "65cc808671c466e106f150c6a4d8681c55e3dd2d"), ("PR16495", "08d025c6cef0b59ce55683b1698424994b843328")):
                  os.environ["M003_OBSERVE_DEADLINE"] = str(int(name == "master"))
                  receipt = json.loads(original.read(source+"/summary.json"))
                  assert len(receipt["executed"]) == 1 and not receipt["executed"][0]["cached_locally"]
                  assert not receipt["executed"][0]["execution_info"].get("cachedRemotely")
                  result = []
                  with zipfile.ZipFile(io.BytesIO(original.read(source+"/original-reporter-results.zip"))) as reports:
                      runs = json.loads(reports.read("m003.json"))
                      assert runs["GOMAXPROCS"] == 2 and [r["name"] for r in runs["trials"]] == ["0-control", *[f"{i}-burst24" for i in range(1,6)]]
                      for row in runs["trials"]:
                          data = reports.read(row["name"]+".json")
                          assert row["native_exit"] == 0 and hashlib.sha256(data).hexdigest() == row["report_sha256"]
                          report = json.loads(data)
                          scenario = row["name"].split("-", 1)[1]
                          errors, drops = inspect(report, scenario)
                          assert not errors, (row["name"], errors)
                          result.append({k: report[k] for k in ("scenario", "expected_bytes", "received_bytes", "duration_seconds", "complete", "integrity_ok", "read_error", "injected_drops")})
                          result[-1].update(trial=row["name"], report_sha256=row["report_sha256"], first_copy_drops=drops)
                  results[name] = {"source":source,"original_invocation":receipt["invocation"],"reporter_sha256":runs["reporter_sha256"],"trials":result}
          (work/"m003.json").write_text(json.dumps(results,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-m003-receipts
          path: ${{ runner.temp }}/m003.json
