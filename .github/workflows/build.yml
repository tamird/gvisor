name: Recover completed semaphore comparisons
on:
  push:
    branches: [qualification/semaphore-waiter-original]
permissions: {contents: read}
jobs:
  diagnostic:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the reader to the failed product
        run: |
          test "$(git rev-parse HEAD^)" = 5411129f096b976b511b37d7bc58234a0e16cce1
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/sem_original.py'
      - name: Inspect only the completed original phases
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B .github/qualification/sem_original.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: semaphore-original
          path: ${{ runner.temp }}/semaphore-original.json
          retention-days: 14
