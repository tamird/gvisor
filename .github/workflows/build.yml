name: Check host device epoll restore and VFIO hardware availability
on:
  push:
    branches: [qualification/gofer-checkpoint-syscall]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/gofer-checkpoint-syscall'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      OSTOCK: 1d9c89c688bc2e03dc54a8313167bc6fc7cef76d
      OFIXED: 4b155ef913179b993b8fbb6d57fb5b38f3dbc2db
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Inspect this GitHub Linux host for a compatible, available VFIO group
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records"
        cp test/device_qualification/{vfio_inventory.py,BUILD} "$RUNNER_TEMP/"
        python3 "$RUNNER_TEMP/vfio_inventory.py" > "$RUNNER_TEMP/records/github-vfio.json"
        cat "$RUNNER_TEMP/records/github-vfio.json"
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=2 origin "$OSTOCK" "$OFIXED"
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Start the existing GNU Bazel coordinator
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name overlay-guest --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
    - name: Exercise the same watch on stock and corrected builds
      run: |
        set -euo pipefail
        # Record every arm. The verifier distinguishes the required stock ABI
        # failure from build failures, test timeouts and omitted cases.
        for arm in stock fixed; do
          src=$OSTOCK; test "$arm" = stock || src=$OFIXED
          git checkout --quiet --detach "$src"
          test "$(git rev-parse HEAD)" = "$src"
          out="$RUNNER_TEMP/records/$arm"; mkdir -p "$out"
          git rev-parse HEAD > "$out/source"
          cases=(epoll_test_runsc_systrap_directfs_save epoll_test_runsc_systrap_shared_save)
          other=()
          if [[ $arm == fixed ]]; then
            cases+=(epoll_test_native epoll_test_runsc_systrap_directfs epoll_test_runsc_systrap_directfs_save_resume)
            mkdir -p test/device_qualification
            cp "$RUNNER_TEMP"/{vfio_inventory.py,BUILD} test/device_qualification/
            other+=(//test/device_qualification:vfio_inventory)
          fi
          labels=(); for tc in "${cases[@]}"; do labels+=("//test/syscalls:$tc"); done
          rc=0
          docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=32 --keep_going --strategy=TestRunner=remote --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=all --test_timeout=300 --test_sharding_strategy=disabled --test_env=GTEST_FILTER=EpollTest.WatchOpenRandomDevice "${labels[@]}" "${other[@]}" >"$RUNNER_TEMP/exec-$arm.log" 2>&1 || rc=$?
          echo "$rc" >"$out/exit"
          for tc in "${cases[@]}"; do
            docker exec overlay-guest cat bazel-testlogs/test/syscalls/"$tc"/test.log |
              grep -E 'EpollTest.WatchOpenRandomDevice|Actual:|Expected:|Value of:|Which is:|epoll.cc:[0-9]+|error [0-9]+|Permission denied|Operation not permitted|after restore error|save error|failed to start|PASSED|FAILED' |
              tail -40 >"$out/$tc.receipt" || :
          done
          if [[ $arm == fixed ]]; then
            docker exec overlay-guest cat bazel-testlogs/test/device_qualification/vfio_inventory/test.log |
              grep '^{"container"' > "$out/worker-vfio.json" || :
          fi
          grep -E 'INFO: Invocation ID:|ERROR:|Build (did NOT complete|completed)|FAILED TO BUILD|FAILED|PASSED|FAIL:' "$RUNNER_TEMP/exec-$arm.log" | tail -70 >"$out/bazel.receipt" || :
        done
    - name: Verify individual ABI outcomes
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/records"
        for f in "$dir"/stock/epoll*.receipt; do
          grep -qE '\[  FAILED  \] EpollTest.WatchOpenRandomDevice' "$f"
          grep -Eqi 'Operation not permitted|Permission denied' "$f"
        done
        test "$(cat "$dir/stock/exit")" = 3
        for f in "$dir"/fixed/epoll*.receipt; do grep -qE '\[       OK \] EpollTest.WatchOpenRandomDevice' "$f"; done
        [[ $(cat "$dir/fixed/exit") == 0 ]]
        for f in "$dir/github-vfio.json" "$dir/fixed/worker-vfio.json"; do jq -e 'has("eligible_tpu_groups")' "$f" >/dev/null; done
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: host-device-syscalls
        path: ${{ runner.temp }}/records
        if-no-files-found: error
