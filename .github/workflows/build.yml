name: Qualify native stateify import resolution
on:
  push:
    branches: [qualification/stateify-local-goimports-current]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Fetch the retained baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/tamird/gvisor/actions/artifacts/13200360924/zip > "$RUNNER_TEMP/stateify-control.zip"
      - name: Prepare existing GNU coordinator and remote platform
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stateify-carrier/.github/qualification/lint-runtime" "$RUNNER_TEMP/stateify-carrier/tools/go_stateify"
          cp .github/qualification/lint-runtime/{stateify,check}.py "$RUNNER_TEMP/stateify-carrier/.github/qualification/lint-runtime/"
          cp -R tools/go_stateify/qualification_* "$RUNNER_TEMP/stateify-carrier/tools/go_stateify/"
          git checkout --detach ea9eef3eb688b6b22b6567d68a0314f43005ed1a
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --remote_download_outputs=toplevel'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/review.bazelrc"
          docker pull --platform=linux/amd64 "$GNU"
      - name: Compare stock GNU with the gVisor launcher on a shell-free worker
        run: |
          docker run --rm --entrypoint python3 --user root \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE" -e RUNNER_TEMP -e QA_RC="$RUNNER_TEMP/review.bazelrc" \
            -e CARRIER_DIR="$RUNNER_TEMP/stateify-carrier" -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            "$GNU" -B "$RUNNER_TEMP/stateify-carrier/.github/qualification/lint-runtime/stateify.py"
      - name: Check the typed artifact boundary
        id: scan
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'stateify-native-review.json'
          data=p.read_bytes()
          json.loads(data)
          for key in ('BUILDBUDDY_API_KEY','GH_TOKEN'):
              value=os.environ.get(key,'').encode()
              if value and value in data: raise SystemExit('credential found in report')
          if any(s in data for s in (b'ghs_',b'ghp_',b'github_pat_',b'x-buildbuddy-api-key=')): raise SystemExit('credential marker found')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && steps.scan.outcome == 'success' }}
        with:
          name: stateify-native-review
          path: ${{ runner.temp }}/stateify-native-review.json
          if-no-files-found: error
