name: Check corrected iperf archives, consumers and previously produced OCI layers
on:
  push:
    branches: [qualification/official-go-images]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-22.04
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 12
      - name: Configure the pinned Linux execution platform
        id: setup
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          echo "Coordinator $(gcc -dumpfullversion), worker GCC 11"
          test "$(gcc -dumpversion | cut -d. -f1)" = 11
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
          mkdir -p "$RUNNER_TEMP/gnu"
          GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
          test -n "$BUILDBUDDY_API_KEY"
          rc=$RUNNER_TEMP/images.bazelrc
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          cat >> "$rc" <<'RC'
          build --jobs=8
          build --strategy=GoStdlib=linux-sandbox
          build --strategy=GoStdlibList=linux-sandbox
          build --strategy=GoStandardLibraryAnalysis=linux-sandbox
          build --strategy=GoStaticAnalysis=linux-sandbox
          build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache
          build --noremote_upload_local_results
          build --remote_download_outputs=toplevel
          build --noshow_progress
          RC
          for name in iperf-image-runtime iperf-go-consumers iperf-catalog-delta; do git show "$GITHUB_SHA:test/rbe/$name.sh" > "$RUNNER_TEMP/$name.sh"; done
      - name: Install the Linux ARM64 binfmt interpreter
        id: qemu
        run: |
          if [[ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
            sudo update-binfmts --enable qemu-aarch64
          fi
          grep -Fx enabled /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -E '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Read the original compressed application layers
        id: old_layers
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          git show "$GITHUB_SHA:test/rbe/recorded-image-layers.py" > "$RUNNER_TEMP/recorded-image-layers.py"
          git show "$GITHUB_SHA:test/rbe/recorded-image-layers.json" > "$RUNNER_TEMP/recorded-image-layers.json"
          python3 "$RUNNER_TEMP/recorded-image-layers.py" "$RUNNER_TEMP/recorded-image-layers.json" "$RUNNER_TEMP/original-layers"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.old_layers.outcome != 'skipped'
        with:
          name: original-layer-members
          path: ${{ runner.temp }}/original-layers
          if-no-files-found: error
      - name: Load iperf and transfer as UID 65532 on x86_64
        id: image_x86_64
        if: always() && steps.setup.outcome == 'success'
        run: bash "$RUNNER_TEMP/iperf-image-runtime.sh" x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.image_x86_64.outcome != 'skipped'
        with:
          name: image-x86_64
          path: ${{ runner.temp }}/iperf-results/image-x86_64
          if-no-files-found: error
      - name: Load iperf and transfer as UID 65532 on aarch64
        id: image_aarch64
        if: always() && steps.setup.outcome == 'success' && steps.qemu.outcome == 'success'
        run: bash "$RUNNER_TEMP/iperf-image-runtime.sh" aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.image_aarch64.outcome != 'skipped'
        with:
          name: image-aarch64
          path: ${{ runner.temp }}/iperf-results/image-aarch64
          if-no-files-found: error
      - name: Attribute regenerated license policy findings to the original inputs
        id: catalog
        if: always() && steps.setup.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/iperf-catalog-delta.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.catalog.outcome != 'skipped'
        with:
          name: catalog-delta
          path: ${{ runner.temp }}/iperf-results/catalog-delta
          if-no-files-found: error
      - name: iperf Go benchmark on the x86_64 image
        id: iperf_x86_64
        if: always() && steps.image_x86_64.outcome == 'success'
        run: bash "$RUNNER_TEMP/iperf-go-consumers.sh" iperf x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.iperf_x86_64.outcome != 'skipped'
        with:
          name: iperf-go-x86_64
          path: ${{ runner.temp }}/iperf-results/iperf-go-x86_64
          if-no-files-found: error
      - name: iperf Go benchmark on the aarch64 image
        id: iperf_aarch64
        if: always() && steps.image_aarch64.outcome == 'success'
        run: bash "$RUNNER_TEMP/iperf-go-consumers.sh" iperf aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.iperf_aarch64.outcome != 'skipped'
        with:
          name: iperf-go-aarch64
          path: ${{ runner.temp }}/iperf-results/iperf-go-aarch64
          if-no-files-found: error
      - name: Remove the remote action credential
        if: always()
        run: rm -f "$RUNNER_TEMP/images.bazelrc"
