name: Install the documented release archive without Docker
on:
  push:
    branches: [qualification/native-install-readme-arm64]
permissions:
  contents: read
jobs:
  install:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 126
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Select the documented source and pin the client
        id: setup
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/release-rbe"
          mkdir -m 700 "$d" "$d/tools" "$d/harness"
          cp test/rbe/{native_install_archive.py,native_cross_inputs.py,runtime_cross.py,runtime_guest.py} "$d/harness/"
          (cd "$d/harness" && sha256sum --check <<'SUMS'
          b0626fb5ecb5bb9c41d644ced5af036019cbefbeef7975c71878021f6e146653  native_cross_inputs.py
          32cc74e3f3e8189d9678b609a4058e60ea3a1e955566f229b34dc04b81f973c8  runtime_cross.py
          bce1d88d73ba07ca283697e2b9215eb06f1e2f2baacfb43130762ff914d27524  runtime_guest.py
          SUMS
          )
          test "$(git rev-parse HEAD^)" = e80c8fde8e8b8bb4352f28c321f9d2ec76977159
          test "$(git rev-parse HEAD^^)" = d5fe3c2eef21434cbe13e3604f0f070ace4d7edb
          git fetch --no-tags https://github.com/google/gvisor.git 1f49f256eae8d2dd2c69ea4cfe9ef2a5bb05516d
          test "$(git rev-parse FETCH_HEAD)" = 1f49f256eae8d2dd2c69ea4cfe9ef2a5bb05516d
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-arm64 -o "$d/tools/bazelisk"
          echo "bb608519a440d45d10304eb684a73a2b6bb7699c5b0e5434361661b25f113a5d  $d/tools/bazelisk" | sha256sum --check -
          chmod 755 "$d/tools/bazelisk"
          sudo systemctl stop docker.socket docker.service
          if docker info >/dev/null 2>&1; then exit 1; fi
      - name: Check the release target on current master
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/release-rbe"
          git checkout --detach 1f49f256eae8d2dd2c69ea4cfe9ef2a5bb05516d
          env -i HOME="$HOME" USER="$USER" RUNNER_TEMP="$RUNNER_TEMP" PATH="$d/tools:$PATH" LANG=C.UTF-8 SOURCE_MODE=stock python3 -B "$d/harness/native_install_archive.py"
      - name: Build and run the documented ARM64 installation
        if: always() && steps.setup.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/release-rbe"
          git checkout --detach e80c8fde8e8b8bb4352f28c321f9d2ec76977159
          env -i HOME="$HOME" USER="$USER" RUNNER_TEMP="$RUNNER_TEMP" PATH="$d/tools:$PATH" LANG=C.UTF-8 SOURCE_MODE=proposal python3 -B "$d/harness/native_install_archive.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: documented-native-arm64-install
          path: |
            ${{ runner.temp }}/release-rbe/stock/install.json
            ${{ runner.temp }}/release-rbe/proposal/install.json
          if-no-files-found: warn
          retention-days: 7
