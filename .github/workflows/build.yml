name: Recover gofer checkpoint results
on:
  push:
    branches: [qualification/gofer-epoll-runtime-traces]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Restore the four original release bundles and two completed controls
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        gh run download 40948851812 -R tamird/gvisor -n gofer-epoll-checkpoint -D original
        gh run download 40951138590 -R tamird/gvisor -n pci-waiter-controls -D previous
        sudo install -d -m 0755 /opt/gofer-epoll
        sudo tar xzf original/runtime-recovery.tgz -C /opt/gofer-epoll
        mkdir -p {checker,result/normal,result/donor}
        cp "$GITHUB_WORKSPACE/test/epoll_restore_probe/"{qualify.py,missing_donor.py} checker/
        jq -e 'select(.checks.linux == true) | .observations.linux' previous/gofer/normal/verdict.json > checker/prior-linux.json
        jq -e 'select(.checks["fixed-watch"] == true) | .observations["fixed-watch"]' previous/gofer/donor/verdict.json > checker/prior-donor.json
        for variant in stock fixed old-watch rejected-watch; do
          d="/opt/gofer-epoll/bundles/$variant"
          sudo chmod a+rx /opt/gofer-epoll/bundles "$d" "$d/gvisor-bin" "$d/runsc" "$d/probe" "$d"/gvisor-bin/*
          sudo -u nobody test -x "$d/gvisor-bin/gvisor-sentry-prewarmer"
          sha256sum "$d/runsc" "$d"/gvisor-bin/* "$d/probe" | cut -d' ' -f1 | sort > "$variant.sha"
          cut -d' ' -f1 "original/$variant.sha256" | sort > "$variant.orig"
          cmp "$variant.sha" "$variant.orig"
        done
        printf '%s\n' 'release-binaries-run=40948851812' 'passing-linux-and-fixed-watch=40951138590' > result/provenance.txt
    - name: Check original and corrected ordinary restores in both filesystem modes
      run: |
        b=/opt/gofer-epoll/bundles
        sudo python3 "$RUNNER_TEMP/checker/qualify.py" "$b/stock/probe" "$b/stock/runsc" "$b/fixed/runsc" "$RUNNER_TEMP/result/normal"
    - name: Check missing donor before correction and without watchers
      if: ${{ !cancelled() }}
      run: |
        b=/opt/gofer-epoll/bundles
        sudo python3 "$RUNNER_TEMP/checker/missing_donor.py" "$b/old-watch/probe" "$b/old-watch/runsc" "$b/rejected-watch/runsc" "$RUNNER_TEMP/result/donor"
    - name: Save original runtime diagnostics and the machine verdicts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gofer-epoll-traces
        path: ${{ runner.temp }}/result
        if-no-files-found: error
