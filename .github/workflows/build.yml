name: Measure the loss of two successive head repairs
on:
  push:
    branches: [qualification/tcp-m003-lost-head-repairs]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      BASE: b0d2148f41d2d35577b5fe759192f71947cc87fd
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 6, persist-credentials: false}
    - name: Bind both sender policies and the original reporter
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        [[ "$(git rev-parse HEAD~5)" == "$BASE" && "$(git rev-parse HEAD^)" == 8bdd0898c3bda82e975fc33ead5122cf792265da && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
        p=test/rbe/m003_pair
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu"
        echo '{"verified":false,"phase":"preparation"}' > "$RUNNER_TEMP/records/verdict.json"
        git diff --exit-code HEAD^ HEAD -- "$p/ranges.json" pkg/tcpip/transport/tcp
        remote=https://github.com/tamird/gvisor.git
        git fetch -q --depth=1 "$remote" 0ee70efe6d52576b8f173b40ad6b7ac117da3b72 c7976270813d5218a847539dd94f749c7cb4dfd5
        for f in MODULE.bazel BUILD.bazel; do git show "0ee70efe6:test/rbe/gnu_platform/$f" > "$RUNNER_TEMP/gnu/$f"; done
        curl --fail --silent --show-error --location --retry 2 https://github.com/user-attachments/files/34000273/gvisor-16393-reproducer-final.zip -o "$RUNNER_TEMP/m003.zip"
        echo "3c348dc00359607416c236e7a56fb7e0ea87da4efeec79a377a1020a8b622a24  $RUNNER_TEMP/m003.zip" | sha256sum -c
        unzip -p "$RUNNER_TEMP/m003.zip" main.go > "$p/main.go"
        echo "82cb123ff35d3ed82775d80ae000bab853c7a21a0d8ad698955ed180e2132b72  $p/main.go" | sha256sum -c
        (cd "$p" && patch -s -p1 -i reporter.patch)
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --init --name tcp-compiler --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/gcc"
        docker exec tcp-compiler uname -srvm > "$RUNNER_TEMP/records/kernel"
        echo "$GITHUB_SHA $BASE" > "$RUNNER_TEMP/records/source"
        chmod 755 "$RUNNER_TEMP/records"
    - name: Run the same lost-head transfer once on each sender
      run: |
        set -euo pipefail
        p=test/rbe/m003_pair
        d="$RUNNER_TEMP/records"
        bz() { docker exec -e GOMAXPROCS=2 tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" "$@"; }
        args=(--config=x86_64 --jobs=48 --remote_download_outputs=toplevel)
        run_case() {
          local name="$1" code=0
          date -u --iso-8601=ns > "$d/$name.started"
          bz test "${args[@]}" --strategy=TestRunner=local --nocache_test_results --test_env=GOMAXPROCS=2 --test_sharding_strategy=disabled --test_output=errors --test_timeout=45 --test_env=PYTHONDONTWRITEBYTECODE=1 --nozip_undeclared_test_outputs --build_event_json_file="$RUNNER_TEMP/$name.bep" "//$p:$name" > "$RUNNER_TEMP/$name.log" 2>&1 || code=$?
          date -u --iso-8601=ns > "$d/$name.finished"
          echo "$code" > "$d/$name.exit"
          # Only the compiler container can resolve Bazel's output-base symlinks.
          local path="bazel-testlogs/$p/$name" copy_code=0
          mkdir -p "$d/$name"
          docker exec tcp-compiler /bin/bash -ec 'cp -L "$1/test.xml" "$2/$3.xml"; cp -L "$1"/test.outputs/*.json "$2/$3/"; chmod a+r "$2/$3.xml" "$2/$3/"*.json' -- "$path" "$d" "$name" || copy_code=$?
          if (( code != 0 )); then python3 "$p/status.py" "$name" "$RUNNER_TEMP" "$code"; return "$code"; fi
          [[ $copy_code == 0 ]] || return "$copy_code"
          python3 "$p/status.py" "$name" "$RUNNER_TEMP" "$code"
          [[ $code == 0 ]]
        }
        for arm in stock select; do
          python3 "$p/prepare.py" "$arm" "$d/source-$arm.json"
          python3 - "$d/source-$arm.json" "$arm" <<'PYHASH'
        import hashlib, json, sys
        from pathlib import Path
        m = json.loads(Path(sys.argv[1]).read_text())
        arm = sys.argv[2]
        assert m["arm"] == arm and m["selection_source"].startswith("c79762708")
        policies = {
            "stock": ["0f7052fa5f811ec980e3988519febae05e66225b6253a33ba86251c79b887216", "8be2333862544959f2e0b6dec1cef546ae67a1522271c091351e2bca629610e7"],
            "select": ["ae34f3e35206ce295fd62a27aadbeb0792bc6ab4c756ea3469c895f473967c4b", "b81b07cbde5ebe52edfc5f0ccaf8e195f0428a7bd6eae7ec9ed819633e8484d1"],
        }
        for name, expected in zip(("snd.go", "rack.go"), policies[arm]):
            assert m["files"][name]["policy"] == expected
        for name, hashes in m["files"].items():
            assert hashes["observed"] == hashlib.sha256((Path("pkg/tcpip/transport/tcp")/name).read_bytes()).hexdigest()
        PYHASH
          code=0
          bz build "${args[@]}" "//$p:reporter" > "$RUNNER_TEMP/build-$arm.log" 2>&1 || code=$?
          echo "$code" > "$d/build-$arm.exit"
          if [[ $code != 0 ]]; then
            python3 "$p/status.py" "build-$arm" "$RUNNER_TEMP" "$code"
            exit "$code"
          fi
          docker exec tcp-compiler cp -L "bazel-bin/$p/reporter_/reporter" "$p/$arm"
          docker exec tcp-compiler chmod 755 "$p/$arm"
          sha256sum "$p/$arm" >> "$d/selected-binaries"
        done
        run_case comparison
        python3 - "$d" <<'PYVERIFY'
        import json, sys, time
        from pathlib import Path
        from xml.etree import ElementTree
        folder = Path(sys.argv[1])
        path = folder / "comparison/comparison.json"
        verdict = json.loads(path.read_text())
        attempts = json.loads((folder/"comparison.status.json").read_text())["attempts"]
        cases = list(ElementTree.parse(folder/"comparison.xml").iter("testcase"))
        assert cases and all(not any(case.find(n) is not None for n in ("error","failure","skipped")) for case in cases)
        assert len(attempts) == 1 and attempts[0]["status"] == "PASSED" and not attempts[0]["cached"] and attempts[0]["strategy"] == "local"
        selected = {Path(p).name: digest for digest,p in [line.split() for line in (folder/"selected-binaries").read_text().splitlines()]}
        assert set(selected) == {"stock", "select"} and len(set(selected.values())) == 2
        assert verdict["verified"] and [r["arm"] for r in verdict["rows"]] == ["stock", "select"] and all(selected[r["arm"]] == r["binary"] for r in verdict["rows"])
        verdict["test_finished_utc"] = (folder/"comparison.finished").read_text().strip()
        verdict["bundle_verified_unix"] = time.time()
        (folder/"verdict.json").write_text(json.dumps(verdict)+"\n")
        PYVERIFY
    - name: Check the public observation boundary
      id: allowlist
      if: always()
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYBOUND'
        from pathlib import Path
        import os, re
        root = Path(os.environ["RUNNER_TEMP"]) / "records"
        key = os.environ["BUILDBUDDY_API_KEY"].encode()
        for path in root.rglob("*"):
            assert not path.is_symlink(), path.name
            if not path.is_file():
                continue
            name = path.relative_to(root).as_posix()
            assert re.fullmatch(r"(gcc|kernel|source|selected-binaries|verdict\.json|source-(stock|select|both|deadline)\.json|(build-(stock|select|both|deadline)|screen|comparison)\.(exit|started|finished|xml|status\.json)|(screen|comparison)/[a-z0-9.-]+\.json)", name), name
            data = path.read_bytes()
            assert not (key and key in data) and b"x-buildbuddy-api-key" not in data and b"Authorization: Bearer" not in data
        PYBOUND
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.allowlist.outcome == 'success'
      with: {name: m003-lost-head-repairs, path: "${{ runner.temp }}/records", if-no-files-found: error}
