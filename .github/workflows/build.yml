name: Current shared TCP senders
on:
  push:
    branches: [qualification/tcp-current-shared-path]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 30
      - name: Build proxy and run matched transfers
        run: bash test/benchmarks/tcp/current-shared-driver.sh
      - name: Reconcile expected trials, receiver intervals and socket samples
        if: always()
        run: python3 test/benchmarks/tcp/current-shared-report.py
      - name: Publish allowlisted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-shared-tcp
          path: ${{ runner.temp }}/tcp-public/
          if-no-files-found: error
