name: Qualify the rules_pkg ZIP writer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: carrier, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: source, ref: 700b0bbea70ff699553d8e40827a2f3dab4afdd2, fetch-depth: 2, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: bazelbuild/rules_pkg, ref: "01446201fd8e758267f4e1abd9727926655110b7", path: original, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: tamird/rules_pkg, ref: "1702e63c4673bf8c00df82a1613c2359895fbe20", path: candidate, persist-credentials: false}
      - name: Compare existing and corrected ZIP writers
        working-directory: source
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          export QA_RC="$RUNNER_TEMP/state-review.bazelrc"
          umask 077
          trap 'rm -f "$QA_RC"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --remote_download_outputs=toplevel'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$QA_RC"
          unset BUILDBUDDY_API_KEY
          python3 -B ../carrier/.github/qualification/lint-runtime/zip.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rules-pkg-zip
          path: ${{ runner.temp }}/rules-pkg-zip.json
          if-no-files-found: error
