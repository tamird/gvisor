name: Qualify external buffer restore and accessor costs
on:
  push:
    branches: [qualification/buffer-external-restore-read]
permissions:
  contents: read
jobs:
  buffer:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      PRODUCT: 1624a495b6c1e58e9fd5209e3ff00dba8811cb1c
      BASE: 7bffefa9185aa55ba377e8a5534210a7f0cbf266
      PUBLIC: 5af539b23594b3711fd49c514e236442baad9df3
      REGRESSION: 296615c83a03899059e1e37f9bfc34fd68efdf71
      VERIFIER: 6b3fe9ab6c03facafe6340c85f8d60ca3591566b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare the original reporter and source revisions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          printf '{"status":"INCOMPLETE","phase":"bootstrap"}\n' > "$RUNNER_TEMP/results/verdict.json"
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          cp .github/qualification/window_benchmark.py .github/qualification/buffer_read_benchmark.go "$RUNNER_TEMP"
          for ref in "$BASE" "$PUBLIC" "$REGRESSION" "$VERIFIER"; do
            git fetch --quiet --depth=2 origin "$ref"
          done
          for helper in unit_matrix qualification_report; do
            git show "$VERIFIER:test/rbe/$helper.py" > "$RUNNER_TEMP/$helper.py"
          done
          mkdir -p "$RUNNER_TEMP/bazelisk-bin"
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazelisk-bin/bazelisk"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/bazelisk-bin/bazelisk" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bazelisk-bin/bazelisk"
          echo "$RUNNER_TEMP/bazelisk-bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/bazelisk-bin/bazelisk" --version)" = "bazel $(cat .bazelversion)"
      - name: Run restoration controls and balanced native benchmark blocks
        run: python3 "$RUNNER_TEMP/window_benchmark.py"
      - name: Compare the complete original benchmark samples
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/results"
          for arm in parent public candidate; do test "$(wc -l < "$arm")" -eq 54; done
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e parent public candidate > benchstat-all.txt
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e public candidate > benchstat-amendment.txt
          for output in benchstat-all.txt benchstat-amendment.txt; do
            for metric in sec/op B/op allocs/op; do grep -Fq "$metric" "$output"; done
          done
      - name: Check the bounded original evidence
        id: scan
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "results"
          total = 0
          for path in root.iterdir():
              assert path.is_file() and not path.is_symlink()
              assert re.fullmatch(r"verdict\.json|benchstat-(?:all|amendment)\.txt|parent|public|candidate|(?:ordinary|race|nogo|restore-negative|block-(?:0[1-9]|1[0-8])-(?:parent|public|candidate))\.(?:log|xml)", path.name), path
              data = path.read_bytes()
              total += len(data)
              assert len(data) < 1024**2
              assert not re.search(rb"gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY|(?i:authorization|x-buildbuddy-api-key)\s*[:=]", data)
          assert total < 8 * 1024**2
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.scan.outcome == 'success'
        with:
          name: buffer-restore-accessor-evidence
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
