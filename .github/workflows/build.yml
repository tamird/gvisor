name: Verify captured network packets and packet header lifetime
on:
  push:
    branches: [qualification/packet-capture-analysis]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/packet-capture-analysis'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 8
        persist-credentials: false
    - name: Check the two affected Nogo owners on AMD64 and ARM64
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/replay-public"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD^1)" = 59309b4ed66406d6480efd20fad2467d19c9ddd7
        test "$(git rev-parse HEAD^1^1)" = aa767e4c43d011121271551fe24da501a56f729d
        cp test/rbe/case_records.py "$RUNNER_TEMP/"
        cp test/rbe/tcp_repair_sources.json "$RUNNER_TEMP/tcp-heads.json"
        cp test/rbe/tcp_repair_driver.py "$RUNNER_TEMP/driver.py"
        mkdir -p "$RUNNER_TEMP/fifo_platform" "$RUNNER_TEMP/fifo"
        platform=$RUNNER_TEMP/fifo_platform
        printf '%s\n' 'module(name="fifo_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "oci",
                "container-image": "docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        rc=$RUNNER_TEMP/fifo.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=linux-sandbox' 'build --strategy=TestRunner=local' 'build --jobs=4' \
            'build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' \
            'build --remote_accept_cached' \
            "build --inject_repository=fifo_platform=$platform" \
            'build --host_platform=@fifo_platform//:ubuntu' \
            'build --extra_execution_platforms=@fifo_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        export FIFO_RC=$rc
        if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        python3 "$RUNNER_TEMP/driver.py"
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      if: ${{ !cancelled() }}
      with:
        ref: 0cd3edb6cb054149a36d53c35a1055e851b145b5
        path: .benchstat-tool
        fetch-depth: 2
        persist-credentials: false
    - name: Summarize the original PCAP measurements with pinned benchstat
      id: forward_bench
      if: ${{ !cancelled() }}
      working-directory: .benchstat-tool
      env:
        GH_TOKEN: ${{ github.token }}
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/records/performance"
        mkdir -p "$out"
        printf 'FAIL\n' > "$out/verdict"
        python3 - <<'PYEND'
        from pathlib import Path
        import hashlib, io, json, os, subprocess, zipfile
        b=subprocess.check_output(['gh','api','repos/tamird/gvisor/actions/artifacts/13043332807/zip'])
        assert hashlib.sha256(b).hexdigest()=='1c1756c3edd6ceb6c80112e5b0b4d9fd522322449ce71e333a087aca8be4131d'
        out=Path(os.environ['RUNNER_TEMP'])/'records/performance'
        with zipfile.ZipFile(io.BytesIO(b)) as z:
            v=json.loads(z.read('verdict.json'))
            assert len(v['expected'])==18 and set(v['expected'])==set(v['executed']) and not v['failures'] and not v['missing']
            for arm in ('control','fixed'):
                lines=[]
                for i in range(1,9):
                    k=f'{arm}-{i}'
                    assert v['arms'][k]['verified']
                    samples=[line for line in z.read(k+'/test.log').decode().splitlines() if line.startswith('BenchmarkBinaryCapture/') and 'ns/op' in line]
                    assert len(samples)==3
                    lines.extend(samples)
                (out/(arm+'.bench')).write_text('\n'.join(lines)+'\n')
        PYEND
        mkdir -p "$RUNNER_TEMP/gnu"
        GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
        printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
        printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
        test -n "$BUILDBUDDY_API_KEY"
        rc=$RUNNER_TEMP/epoll.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=remote' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        test "$(git rev-parse HEAD^)" = "2b51abee8530385431b7225198fdd5cd65e78696"
        target=@org_golang_x_perf//cmd/benchstat
        opts=(--config=x86_64 -c opt --jobs=12 --remote_download_outputs=toplevel)
        bazel --bazelrc="$rc" build "${opts[@]}" "$target" > "$RUNNER_TEMP/build.log" 2>&1 || { grep -E '^(ERROR:|INFO: Streaming)' "$RUNNER_TEMP/build.log" | head -8; exit 1; }
        bazel --bazelrc="$rc" cquery "${opts[@]}" --output=files "$target" > "$RUNNER_TEMP/selected"
        mapfile -t bin < <(while IFS= read -r path; do if [[ -f $path && -x $path ]]; then echo "$PWD/$path"; fi; done < "$RUNNER_TEMP/selected")
        test "${#bin[@]}" -eq 1
        (cd "$out"; "${bin[0]}" stock=control.bench metadata=fixed.bench >benchstat.txt)
        for metric in sec/op B/op allocs/op; do grep -Fq "$metric" "$out/benchstat.txt"; done
        grep -q 'n=8' "$out/benchstat.txt"
        printf 'PASS\n' > "$out/verdict"
    - name: Return the actual case results, original exits and packet captures
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: tcp-forward-copy-headers
        path: |
          ${{ runner.temp }}/replay-public/*.json
          ${{ runner.temp }}/records/performance/*.bench
          ${{ runner.temp }}/records/performance/benchstat.txt
          ${{ runner.temp }}/records/performance/verdict
          ${{ runner.temp }}/replay-public/linux-tcp-recovery
          ${{ runner.temp }}/replay-public/*/*.json
          ${{ runner.temp }}/replay-public/*/*.pcap
          ${{ runner.temp }}/replay-public/*/test.log
          ${{ runner.temp }}/replay-public/*/*.proxy.log
          ${{ runner.temp }}/replay-public/*/source
          ${{ runner.temp }}/replay-public/*/exit
          ${{ runner.temp }}/replay-public/*/diagnostics
        if-no-files-found: error
