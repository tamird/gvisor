name: Check the connection mutex for FUSE background limits
on:
  push:
    branches: [qualification/fuse-background-request-lock]
permissions: {}
jobs:
  linux:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: Bind the two original sources and Bazel
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fuse-lock"
          mkdir -m 700 "$work"
          echo '{"verified":false,"stage":"setup"}' > "$work/result.json"
          git init -q
          git fetch --no-auto-maintenance --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git checkout -q --detach "$GITHUB_SHA"
          product=507d221e523577008651afe68aac236e72ba5e9e
          test "$(git rev-parse HEAD^)" = "$product"
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/fuse_background_lock.py'
          git diff --exit-code "$product^" "$product" -- . ':!pkg/sentry/fsimpl/fuse/connection.go' ':!pkg/sentry/fsimpl/fuse/connection_control.go'
          cp .github/qualification/fuse_background_lock.py "$work/"
          test "$(cat .bazelversion)" = 9.3.1
          cd "$work"
          curl -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel' | sha256sum -c -
          chmod 755 bazel
          sudo -n apt-get -qq update
          sudo -n apt-get -qq install -y --no-install-recommends build-essential crossbuild-essential-arm64 libnuma-dev
      - name: Check saved fields, native transport behavior and both checklocks configurations
        run: env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" python3 -IB "$RUNNER_TEMP/fuse-lock/fuse_background_lock.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: fuse-background-request-lock
          path: ${{ runner.temp }}/fuse-lock/result.json
          if-no-files-found: error
          retention-days: 14
