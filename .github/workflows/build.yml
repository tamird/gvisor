name: Check host datagram readiness after a confirmed drain
on:
  push:
    branches: [qualification/gofer-dgram-host-writable]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/gofer-dgram-host-writable'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      OSTOCK: 8d7ac0584873b7b82390340eca48348faf249489
      OFIXED: 86114ad1b83d3871975d774cbcea966b205daff7
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 3
        persist-credentials: false
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^1) == "$OFIXED" && $(git rev-parse HEAD^2) == "$OSTOCK" ]]
        git diff --exit-code "$OSTOCK" "$OFIXED" -- test/syscalls/linux/connect_external.cc test/uds/uds.go test/syscalls/linux/BUILD
        cp test/rbe/dgram_host_writable_{check.sh,result.py} "$RUNNER_TEMP/"
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Start the existing GNU Bazel coordinator
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name overlay-guest --entrypoint /bin/bash --user root --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt systempaths=unconfined -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
    - name: Compare native Linux, stock gVisor and corrected gVisor
      if: ${{ !cancelled() }}
      run: bash "$RUNNER_TEMP/dgram_host_writable_check.sh"
    - name: Recover the unchanged host fixture analyzer result
      if: ${{ !cancelled() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api repos/tamird/gvisor/actions/artifacts/13028588765/zip > "$RUNNER_TEMP/previous-dgram.zip"
        echo "0816cb5d2f25b965d0197920856aa95677a000aa4ad8f52fddcff4b24cdc9486  $RUNNER_TEMP/previous-dgram.zip" | sha256sum -c
        git diff --exit-code bf671e38be5935ae8b44d3f65b630bc5cb018ff3 "$OFIXED" -- test/uds
        python3 - "$RUNNER_TEMP" <<'PY_PRIOR'
        import sys
        from pathlib import Path
        from zipfile import ZipFile
        root=Path(sys.argv[1]); out=root/"proof/owners"
        with ZipFile(root/"previous-dgram.zip") as z:
            assert z.read("owners/source").strip()==b"bf671e38be5935ae8b44d3f65b630bc5cb018ff3"
            for suffix in ("test.log","test.xml","arm64.findings.sha256","amd64.findings.sha256"):
                key="uds_nogo."+suffix
                (out/key).write_bytes(z.read("owners/"+key))
        (out/"uds_nogo.source.txt").write_text("bf671e38be5935ae8b44d3f65b630bc5cb018ff3; https://github.com/tamird/gvisor/actions/runs/41161906129/artifacts/13028588765\n")
        PY_PRIOR
    - name: Check the confirmed drain, timed-out watch and owning targets
      if: ${{ !cancelled() }}
      run: python3 -B "$RUNNER_TEMP/dgram_host_writable_result.py" "$RUNNER_TEMP/proof"
    - name: Sanitize the receipt
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PY_REDACT'
        import os
        from pathlib import Path
        key = os.environ['BB_KEY'].encode()
        for p in (Path(os.environ['RUNNER_TEMP'])/'proof').rglob('*'):
            if key and p.is_file() and key in (data := p.read_bytes()):
                p.write_bytes(data.replace(key, b'[REDACTED]'))
        PY_REDACT
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: gofer-dgram-host-writable
        path: ${{ runner.temp }}/proof/
        if-no-files-found: error
