name: Recover the cold shipping repository diagnostic
"on":
  push:
    branches: [qualification/registry-llvm-cold-shipping-repository]
permissions: {}
jobs:
  repository:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Replay the original client’s credential-free archive query
        run: |
          set -eu
          umask 077
          w="$RUNNER_TEMP/registry-shipping"
          previous=0b006e06280a785585d5ba0ce0b5d3944fba4226
          base=dd2be7670c1baaacebfdcab31bb6145ebce39037
          mkdir -p "$w/public" "$w/data" "$w/base"
          git init -q .
          GIT_TERMINAL_PROMPT=0 git -c gc.auto=0 fetch --no-auto-maintenance -q --depth=4 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD^)" = "$previous"
          test "$(git rev-parse "$previous~2")" = "$base"
          git diff --exit-code "$previous" FETCH_HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/cold_repository.py'
          git show "$previous:.github/qualification/registry_shipping.py" > "$w/registry_shipping.py"
          git show 'FETCH_HEAD:.github/qualification/cold_repository.py' > "$w/cold_repository.py"
          git archive "$base" | tar -x -C "$w/base"
          test ! -e "$w/base/.git"
          mkdir "$w/base/test/rbe/release_prewarmer"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 --max-time 120 https://raw.githubusercontent.com/tamird/gvisor/e89646dda45516a7fe54427a0586a39dc20a7db3/test/rbe/release_prewarmer/BUILD -o "$w/base/test/rbe/release_prewarmer/BUILD"
          cd "$w"
          echo 'ae1f23a11f3cb747fbec49a34c510c5ab9dcb75d06d94bfd4d9a49d50c629271  base/test/rbe/release_prewarmer/BUILD' | sha256sum -c -
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" python3 -B cold_repository.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: cold-shipping-repository
          path: ${{ runner.temp }}/registry-shipping/public/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable sources and client image
        if: always()
        run: |
          docker image rm "empty-shipping:$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          rm -rf -- "$RUNNER_TEMP/registry-shipping"
