name: Recover original release package actions
on:
  push:
    branches: [qualification/staged-release-tag]
permissions: {contents: read}
jobs:
  diagnostic:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Read the four completed package actions and their outputs
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 -B test/rbe/status_recover.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: original-package-versions
        path: ${{ runner.temp }}/rack-results
