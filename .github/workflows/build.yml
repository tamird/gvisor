name: Verify netgofer child shutdown
on:
  push:
    branches: [qualification/netgofer-shutdown-stdinpipe]
permissions: {}
jobs:
  linux:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Bind the original and candidate sources
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          git init .
          previous=a002f475d31483583d61e63381d6919100d1be30
          git fetch --no-auto-maintenance --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$previous"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = a412fc982b122590975cf4f1257fa52294bc0751
          test "$(git rev-parse HEAD^^)" = 975fb172241c7946a9f67b4f52e0349d9240589a
          w="$RUNNER_TEMP/netgofer-child"
          mkdir -m 755 "$w" "$w/receipt"
          cp .github/qualification/netgofer_child/{entry,check}.py "$w/"
          git diff --exit-code "$previous" HEAD -- .github/qualification/netgofer_child/entry.py
          test "$(uname -m)" = x86_64
          test "$(cat .bazelversion)" = 9.3.1
          chmod 755 "$w/entry.py"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $w/bazel" | sha256sum -c
          chmod 755 "$w/bazel"
          "$w/bazel" --version
          for suite in jammy jammy-updates; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ $suite main universe"
          done > "$w/jammy.list"
          options=(-o "Dir::Etc::sourcelist=$w/jammy.list" -o Dir::Etc::sourceparts=-)
          sudo -n apt-get "${options[@]}" update -qq
          sudo -n apt-get "${options[@]}" install --no-install-recommends -qy build-essential crossbuild-essential-arm64 libnuma-dev strace
          cp /usr/bin/strace "$w/"
          cmp /usr/bin/strace "$w/strace"
      - name: Exercise the two named cases in the original Bazel test owner
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" \
            python3 -IB "$RUNNER_TEMP/netgofer-child/check.py"
      - name: Bound the receipt
        id: check
        if: always() && !cancelled()
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "netgofer-child/receipt"
          p = root / "result.json"
          assert json.loads(p.read_text())["carrier"] == os.environ["GITHUB_SHA"]
          for f in root.iterdir():
              assert f.is_file() and not f.is_symlink() and f.stat().st_size < 65536
              assert re.fullmatch(r"result[.]json|(graceful|forced)[.]test[.](log|xml)", f.name)
              assert not re.search(rb"(?i)(authorization:|bearer |x-buildbuddy-api-key|ghp_|github_pat_|-----BEGIN [A-Z ]*PRIVATE KEY)", f.read_bytes())
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.check.outcome == 'success'
        with:
          name: netgofer-shutdown
          path: ${{ runner.temp }}/netgofer-child/receipt/
          if-no-files-found: error
