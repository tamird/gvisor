name: Verify both Nogo filters from the original terminal-poll tests
on:
  push:
    branches: [qualification/tcp-terminal-both-findings]
permissions: {contents: read}
jobs:
  original:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Verify the original fork receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tamird/gvisor/actions/artifacts/13198748523/zip > "$RUNNER_TEMP/original.zip"
      - name: Retrieve the original two service logs and execution dispositions
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 .github/qualification/refusal-dual-log.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: terminal-refusal-reconciled
          path: ${{ runner.temp }}/checked-refusal.json
          if-no-files-found: error
