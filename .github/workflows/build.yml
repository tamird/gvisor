name: Verify terminal poll and single-refusal behavior
on:
  push:
    branches: [qualification/tcp-terminal-refusal-composition]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CANDIDATE: a795edf944519fde538e137b44875d852fe66e96
      STOCK: 5b317311427fabfc62ffeca7d76b1622ff83f7b4
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/records/verdict.json"
        cp .github/qualification/tcp-terminal-composition.py "$RUNNER_TEMP/verify-tcp.py"
        test "$(git rev-parse HEAD^)" = "$CANDIDATE"
        test "$(git rev-parse HEAD^^)" = "$STOCK"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
        docker exec tcp-compiler python3 -c 'import socket; s=socket.socket(socket.AF_INET6); s.bind(("::1",0)); print(s.getsockname())' > "$RUNNER_TEMP/records/native-ipv6"

    - name: Run the same refusal and terminal-poll cases on Linux, master and the composed guest
      run: |
        set -euo pipefail
        filter='TcpConnectTest.RefusalIsReportedOnce:AllInetTests/SimpleTcpSocketTest.NonBlockingConnectRefused/*:AllInetTests/SimpleTcpSocketTest.SynRcvdOnListenerShutdown/*'
        for arm in native stock fixed amd64-nogo arm64-nogo; do
          src=$CANDIDATE; platform=runsc_ptrace; runner=remote; cpu=x86_64
          [[ "$arm" != stock ]] || src=$STOCK
          [[ "$arm" != native ]] || { platform=native; runner=local; }
          [[ "$arm" != arm64-nogo ]] || cpu=aarch64
          git checkout --quiet --detach "$src"
          test "$(git rev-parse HEAD)" = "$src"
          d=$RUNNER_TEMP/records/$arm; mkdir -p "$d"; echo "$src" > "$d/source"; date -u +%FT%TZ > "$d/start"
          owners=(tcp_socket_test socket_ip_tcp_generic_loopback_test)
          labels=(); options=()
          if [[ "$arm" == *-nogo ]]; then
            labels=(//pkg/tcpip/transport/tcp:tcp_nogo)
          else
            # Only the regression overlay differs from stock; runsc and Sentry use the selected source.
            path=test/syscalls/linux/tcp_socket.cc
            git show "$CANDIDATE:$path" > "$path"
            test "$(git hash-object "$path")" = "$(git rev-parse "$CANDIDATE:$path")"
            test "$(git rev-parse "$src:test/syscalls/linux/socket_ip_tcp_generic.cc")" = "$(git rev-parse "$CANDIDATE:test/syscalls/linux/socket_ip_tcp_generic.cc")"
            for owner in "${owners[@]}"; do labels+=("//test/syscalls:${owner}_${platform}"); done
            options+=(--test_env=GTEST_FILTER="$filter")
          fi
          rc=0
          timeout 1200 docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config="$cpu" --jobs=64 --keep_going --strategy=TestRunner="$runner" --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --flaky_test_attempts=1 --test_output=errors --test_timeout=450 --test_sharding_strategy=disabled --build_tag_filters= --test_tag_filters= --build_event_json_file="$d/bep" "${options[@]}" "${labels[@]}" > "$d/bazel.log" 2>&1 || rc=$?
          echo "$rc" > "$d/exit"; date -u +%FT%TZ > "$d/end"
          if [[ "$arm" != *-nogo ]]; then
            for owner in "${owners[@]}"; do
              docker exec tcp-compiler cat "bazel-testlogs/test/syscalls/${owner}_${platform}/test.xml" > "$d/$owner.xml" || rm -f "$d/$owner.xml"
            done
            git restore --source="$src" -- "$path"
          fi
          python3 "$RUNNER_TEMP/verify-tcp.py" "$RUNNER_TEMP/records" progress
        done
    - name: Require the original four poll cases and both refusal paths
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/verify-tcp.py" "$RUNNER_TEMP/records"
    - name: Check public evidence
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'SCAN'
        import os
        from pathlib import Path
        data=(Path(os.environ['RUNNER_TEMP'])/'records/verdict.json').read_bytes()
        assert not any(s and s in data for s in (os.environ['BB_KEY'].encode(),b'--remote_header',b'--bes_header',b'authorization:'))
        SCAN
      id: scan
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.scan.outcome == 'success' }}
      with:
        name: tcp-terminal-refusal-composition
        path: ${{ runner.temp }}/records/verdict.json
        if-no-files-found: error
