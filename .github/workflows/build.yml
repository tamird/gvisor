name: Read the five original LLVM presubmit failure records
on:
  push:
    branches: [qualification/llvm-presubmit-original-failures]
permissions: {contents: read}
jobs:
  retrieve:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify parser, original invocation, and source code
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 4ef17e43d9a6f702c304a2149af7a91b3d5a8ab6
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/llvm_source_failures.py'
          cp .github/qualification/llvm_source_failures.py "$RUNNER_TEMP/"
          echo "da6326910289bd55d97baaa1300e048430dc2edffdb761d4c84f60aef2348809  $RUNNER_TEMP/llvm_source_failures.py" | sha256sum -c
      - name: Retrieve the original three compiler diagnostics and two test logs
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          python3 -IB "$RUNNER_TEMP/llvm_source_failures.py"
      - name: Validate the closed receipt
        id: validate
        if: always()
        run: |
          python3 -IB - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"closed-source-failures.json"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size<190000
          b=p.read_bytes()
          assert not re.search(rb"(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}",b)
          r=json.loads(b); assert r["invocation"]=="bc29a60b-916d-49ee-b194-acb6c21cf98f"
          assert set(r["blobs"])=={"llvm_cpp1","llvm_cpp2","llvm_cpp3","sandbox_test","vdso_test"}
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.validate.outcome == 'success'
        with:
          name: original-llvm-presubmit-failures
          path: ${{ runner.temp }}/closed-source-failures.json
          if-no-files-found: error
          retention-days: 14
      - name: Require exact CAS returns
        if: steps.validate.outcome == 'success'
        run: |
          python3 -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"closed-source-failures.json").read_text()); assert all(b.get("verified") for b in r["blobs"].values())'
