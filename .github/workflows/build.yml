name: CI
on:
  push:
    branches: [qualification/ipv6-quoted-owner-exact]
permissions:
  contents: read
  actions: read
jobs:
  clang_format:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 9bc5517f1f05b62025af3ae4846eaae8431bcc79
        persist-credentials: false
    - name: Reuse the completed IPv6 target
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        mkdir -p "$RUNNER_TEMP/records"
        gh api repos/tamird/gvisor/actions/artifacts/12992862893/zip > "$RUNNER_TEMP/original.zip"
        cd "$RUNNER_TEMP/records"
        unzip -q "$RUNNER_TEMP/original.zip"
        mv verdict.json original-verdict.json
        mv format.log original-format.log
        python3 - <<'CHECK'
        import json
        from pathlib import Path
        v=json.loads(Path("original-verdict.json").read_text())
        assert v["source"]=="9bc5517f1f05b62025af3ae4846eaae8431bcc79" and v["errors"]==["repository formatter did not pass"] and Path("exit").read_text().strip()=="0" and v["records"]
        CHECK
    - name: Run the pinned repository formatter
      run: |
        set -euo pipefail
        [[ "$(git rev-parse HEAD)" == "9bc5517f1f05b62025af3ae4846eaae8431bcc79" ]]
        git ls-files --error-unmatch test/syscalls/linux/udp_raw_socket.cc
        d="$RUNNER_TEMP/records"
        rc=0
        tools/lint.sh clang-format > "$d/format.log" 2>&1 || rc=$?
        cat "$d/format.log"
        echo "$rc" > "$d/format.exit"
        date -u +%FT%TZ > "$d/format.end"
        python3 - "$d" <<'CHECK'
        from datetime import datetime,timezone
        import json,sys
        from pathlib import Path
        d=Path(sys.argv[1])
        v=json.loads((d/'original-verdict.json').read_text())
        rc=(d/'format.exit').read_text().strip(); log=(d/'format.log').read_text()
        f=rc=='0' and 'clang-format' in log and 'fatal:' not in log and 'PASS' in log
        v.update(verified=f,errors=[] if f else ['formatter failed'],formatter_finished=(d/'format.end').read_text().strip(),verified_at=datetime.now(timezone.utc).isoformat(),test_artifact=12992862893)
        (d/'verdict.json').write_text(json.dumps(v,indent=2)+'\n')
        sys.exit(not f)
        CHECK
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: ipv6-quoted-verified
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
