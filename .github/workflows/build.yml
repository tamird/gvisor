name: ARM64 unit tests in the private 4 KiB guest
on:
  push:
    branches: [qualification/arm64-unit-private-guest]
permissions:
  contents: read
jobs:
  guest:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      PRODUCT: 96fadde722e14d482a62276b80237398f8b62fbf
      GUEST: 588d3e6d35225ff5425d0148d3ec468d0a4e7833
      DOCKER_BUILD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind the two existing source trees and install their pinned Bazel
        run: |
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(uname -m)" = aarch64
          git diff --name-only "$PRODUCT" HEAD > "$RUNNER_TEMP/carrier-files"
          diff -u <(printf '%s\n' .github/qualification/arm64-unit-private-guest.py .github/workflows/build.yml) "$RUNNER_TEMP/carrier-files"
          cp .github/qualification/arm64-unit-private-guest.py "$RUNNER_TEMP/"
          git fetch --quiet --depth=1 origin "$GUEST"
          git checkout --quiet --detach "$PRODUCT"
          sed -n '/^install_.*bazel() {$/,$p' .buildkite/hooks/pre-command > "$RUNNER_TEMP/unit-setup.bash"
          source "$RUNNER_TEMP/unit-setup.bash"
          test "$(bazel --version)" = "bazel 8.8.1"
          echo "$BUILDKITE_BAZEL_DIRECTORY" >> "$GITHUB_PATH"
      - name: Configure ARM64 product builds and the existing multiarch guest executor
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          test -n "$BUILDBUDDY_API_KEY"
          umask 077
          for name in product guest; do
            rc="$RUNNER_TEMP/$name.bazelrc"
            base=build
            if [[ $name = guest ]]; then base=build:buildbuddy_remote_executor; fi
            for option in remote_cache remote_executor bes_backend; do echo "$base --$option=grpcs://remote.buildbuddy.io"; done > "$rc"
            echo "$base --bes_results_url=https://app.buildbuddy.io/invocation/" >> "$rc"
            for option in remote_header bes_header; do echo "$base --$option=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"; done >> "$rc"
          done
          cat >> "$RUNNER_TEMP/product.bazelrc" <<'EOF'
          build --remote_default_exec_properties=OSFamily=linux
          build --remote_default_exec_properties=Arch=arm64
          build --remote_default_exec_properties=workload-isolation-type=oci
          build --remote_default_exec_properties=container-image=docker://docker.io/library/buildpack-deps@sha256:496160b38def7107f238785d58e3762c72341dd83533d54c1d1b84c3a6fbcad2
          build --spawn_strategy=sandboxed,local
          build --strategy=GoCompilePkg=remote,local
          build --remote_local_fallback
          EOF
      - name: Build original ARM64 payloads and run only those owners in private guests
        run: python3 "$RUNNER_TEMP/arm64-unit-private-guest.py"
      - name: Check the small publication allowlist
        id: safe
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "guest-report"
          assert (root / "receipt.json").is_file()
          for path in root.iterdir():
              assert path.name in {"receipt.json", "procumounter_test.xml", "safemount_test.xml"}
              assert path.is_file() and not path.is_symlink() and path.stat().st_size < 50000
              data = path.read_bytes()
              for key in ("BUILDBUDDY_API_KEY", "GH_TOKEN"):
                  value = os.environ[key].encode()
                  assert value and value not in data
              assert not re.search(rb"gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY", data)
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.safe.outcome == 'success'
        with:
          name: arm64-unit-private-guest
          path: ${{ runner.temp }}/guest-report/
          if-no-files-found: error
