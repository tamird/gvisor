name: Compare the stock downstream Go override with the original diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  lint:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: carrier, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: source, ref: 0fa6803f2a5991dc066a29fc50414b4a3b519590, persist-credentials: false}
      - name: Build the same public Go target from the unmodified stock checkout
        working-directory: source
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          export CPPLINT_RC="$RUNNER_TEMP/cpplint.bazelrc"
          umask 077
          trap 'rm -f "$CPPLINT_RC"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --remote_download_outputs=toplevel'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$CPPLINT_RC"
          unset BUILDBUDDY_API_KEY
          python3 -B ../carrier/.github/qualification/lint-pilot/stock.py
      - name: Read the two original diagnostic tags
        if: ${{ !cancelled() }}
        env:
          ORIGINAL_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B carrier/.github/qualification/lint-pilot/original.py
      - name: Compare the three observed tags
        if: ${{ !cancelled() }}
        run: python3 -B carrier/.github/qualification/lint-pilot/stock.py compare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: downstream-go-tag
          path: |
            ${{ runner.temp }}/stock-consumer.json
            ${{ runner.temp }}/original-launch.json
          if-no-files-found: error
