name: Identify the ARM64 Sentry test assertion
on:
  push:
    branches: [qualification/arm64-posture-assertions]
permissions: {contents: read}
jobs:
  summarize:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify the original reader and product
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = c0d2d63f5e97db7eb5357286e9831647eca2a991
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/posture_assertion_summary.py'
      - name: Read three original test logs and retain only assertion categories
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -IB .github/qualification/posture_assertion_summary.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: posture-assertions
          path: ${{ runner.temp }}/posture-assertions.json
          if-no-files-found: error
          retention-days: 14
