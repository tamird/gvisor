name: Compare TIME_WAIT on Linux and the forwarded endpoint
on:
  push:
    branches: [qualification/timewait-synack-native-gnu]
permissions: {contents: read}
jobs:
  packet:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: 1a2f2fd5500485145331a4e9d32c33819b843305
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 12, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD^1)" == "$CURRENT" ]]
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        mkdir -p "$RUNNER_TEMP/checker" "$RUNNER_TEMP/measure-public"
        touch "$RUNNER_TEMP/xtables.lock"; printf %s "$GITHUB_RUN_ID" > "$RUNNER_TEMP/host-marker"
        git show "$GITHUB_SHA:test/rbe/timewait-qualify.sh" > "$RUNNER_TEMP/checker/run.sh"
        git show "$GITHUB_SHA:test/rbe/timewait_measure.py" > "$RUNNER_TEMP/checker/measure.py"
        git show "$GITHUB_SHA:test/rbe/qualification_report.py" > "$RUNNER_TEMP/checker/qualification_report.py"
        git show "$GITHUB_SHA:test/rbe/unit_matrix.py" > "$RUNNER_TEMP/checker/unit_matrix.py"
        if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --security-opt apparmor=unconfined -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
        # The hosted bazelisk command is an npm shim. The compiler image has no
        # Node; recover the exact released Bazel identified by each source.
        installed=$(docker exec tcp-compiler /usr/local/bin/bazel --version)
        for expected in 8.3.1 8.8.1; do
          bin="$RUNNER_TEMP/bazel-$expected"
          if [[ "$installed" == "bazel $expected" ]]; then
            docker cp tcp-compiler:/usr/local/bin/bazel "$bin"
          else
            curl --retry 3 --retry-all-errors --fail --location --silent --show-error -o "$bin" "https://releases.bazel.build/$expected/release/bazel-$expected-linux-x86_64"
          fi
          case $expected in
            8.3.1) sha=17247e8a84245f59d3bc633d0cfe0a840992a7760a11af1a30012d03da31604c;;
            8.8.1) sha=5b5bab2095065817d3416ca9a0678bd39c10c9ede432dbe8187bfe74de285160;;
          esac
          echo "$sha  $bin" | sha256sum --check
          chmod 755 "$bin"
          docker exec tcp-compiler "$bin" --version | grep -Fx "bazel $expected"
        done


    - name: Establish memory available to local C++ compilers
      run: |
        docker exec tcp-compiler bash -ec 'grep MemAvailable /proc/meminfo; cat /sys/fs/cgroup/memory.max; gcc --version | head -1' | tee "$RUNNER_TEMP/records/compiler-memory.txt"
    - name: Measure the proposed TIME_WAIT packets
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker exec -e GITHUB_WORKSPACE -e RUNNER_TEMP -e FENCE_HOST_ID="$GITHUB_RUN_ID" -e FENCE_HOST_PROBE="$RUNNER_TEMP/host-marker" -e XTABLES_LOCKFILE="$RUNNER_TEMP/xtables.lock" tcp-compiler bash "$RUNNER_TEMP/checker/run.sh" proposed
    - name: Measure the fixed TIME_WAIT packets
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker exec -e GITHUB_WORKSPACE -e RUNNER_TEMP -e FENCE_HOST_ID="$GITHUB_RUN_ID" -e FENCE_HOST_PROBE="$RUNNER_TEMP/host-marker" -e XTABLES_LOCKFILE="$RUNNER_TEMP/xtables.lock" tcp-compiler bash "$RUNNER_TEMP/checker/run.sh" fixed
    - name: Measure the linux TIME_WAIT packets
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker exec -e GITHUB_WORKSPACE -e RUNNER_TEMP -e FENCE_HOST_ID="$GITHUB_RUN_ID" -e FENCE_HOST_PROBE="$RUNNER_TEMP/host-marker" -e XTABLES_LOCKFILE="$RUNNER_TEMP/xtables.lock" tcp-compiler bash "$RUNNER_TEMP/checker/run.sh" linux
    - name: Reconcile the original three results
      if: always()
      run: |
        set -euo pipefail
        sudo mkdir -p "$RUNNER_TEMP/measure-public"
        sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/measure-public"
        python3 - <<'CHECK'
        from pathlib import Path
        import os,json,sys
        p=Path(os.environ["RUNNER_TEMP"])/"measure-public"
        result={arm:(json.loads(f.read_text()).get("status") if (f:=p/arm/"result.json").is_file() else "MISSING") for arm in ("linux","proposed","fixed")}
        (p/"summary.json").write_text(json.dumps(result)+"\n")
        print(result);sys.exit(set(result.values())!={"PASS"})
        CHECK
    - name: Redact credentials and retain native setup details
      id: redact
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -eu
        for f in coordinator-gcc native-kernel compiler-memory.txt; do
          if test -f "$RUNNER_TEMP/records/$f"; then cp "$RUNNER_TEMP/records/$f" "$RUNNER_TEMP/measure-public/$f"; fi
        done
        python3 - <<'CHECK'
        from pathlib import Path
        import os
        k=os.environ["BB_KEY"].encode()
        assert k
        for f in (Path(os.environ["RUNNER_TEMP"])/"measure-public").rglob("*"):
            if f.is_file() and k in (b:=f.read_bytes()): f.write_bytes(b.replace(k,b"[REDACTED]"))
        CHECK
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.redact.outcome == 'success'
      with:
        name: tcp-timewait-native-gnu
        path: ${{ runner.temp }}/measure-public/
        if-no-files-found: error
