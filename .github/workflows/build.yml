name: Recover the named Go futex cases from the full suite
on:
  push:
    branches: [qualification/futex-waiter-mode-owners]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: 3737ff32e7116dcdad1209cce125602ff3c33785
      REPORTER: fb60e127516defd6aab633f80be09a03022f0737
      READER: 1fcf113e6349cc55f6321968944da1933ece3252
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Read the original Go test log
      id: original
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records"
        printf '%s\n' '{"verified":false,"phase":"original-log"}' > "$RUNNER_TEMP/records/verdict.json"
        git diff --quiet "$CURRENT" HEAD -- pkg/sentry/kernel/futex
        git fetch -q --no-tags --depth=1 origin "$REPORTER" "$READER"
        for module in qualification_report unit_matrix; do
          git show "$REPORTER:test/rbe/$module.py" > "$RUNNER_TEMP/$module.py"
        done
        git show "$READER:test/rbe/semop_owner_recovery.py" > "$RUNNER_TEMP/semop_owner_recovery.py"
        cp test/rbe/recover_futex_go.py "$RUNNER_TEMP/"
        python3 "$RUNNER_TEMP/recover_futex_go.py" original
    - name: Prepare the pinned compiler coordinator and RBE workers
      if: steps.original.outputs.complete != 'true'
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","EstimatedMemory":"2GB","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Run only the Go owner verbosely if the original log omits case names
      if: steps.original.outputs.complete != 'true'
      run: |
        set -euo pipefail
        git checkout -q --detach "$CURRENT"
        test "$(git rev-parse HEAD)" = "$CURRENT"
        d="$RUNNER_TEMP/records"
        uid=$(python3 -c 'import uuid; print(uuid.uuid4())')
        printf '%s\n' "$uid" > "$d/invocation"
        rc=0
        docker exec tcp-compiler timeout 13m bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --invocation_id="$uid" --jobs=8 --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --build_tag_filters= --test_tag_filters= --test_output=all --test_timeout=300 --test_arg=-test.v --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' //pkg/sentry/kernel/futex:futex_test > "$d/bazel.log" 2>&1 || rc=$?
        printf '%s\n' "$rc" > "$d/exit"
        docker exec tcp-compiler cat bazel-testlogs/pkg/sentry/kernel/futex/futex_test/test.log > "$d/test.log" || :
    - name: Verify every named Go case
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/recover_futex_go.py" verdict
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: futex-go-owner-original
        path: |
          ${{ runner.temp }}/records/original.json
          ${{ runner.temp }}/records/verdict.json
        if-no-files-found: error
