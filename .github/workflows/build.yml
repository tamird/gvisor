name: Check the semaphore syscall fixture with the pinned formatter
on:
  push:
    branches: [qualification/semctl-format]
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 475bbaa0e3dde13c24d5e24c3fd8644eeaf932fe
          persist-credentials: false
          fetch-depth: 1
      - name: Run the source's formatter and retain its exact change
        run: |
          set -eu
          f=test/syscalls/linux/semaphore.cc
          test "$(git rev-parse HEAD)" = 475bbaa0e3dde13c24d5e24c3fd8644eeaf932fe
          mkdir "$RUNNER_TEMP/results"
          cp "$f" "$RUNNER_TEMP/original.cc"
          export LINT_CACHE_DIR="$RUNNER_TEMP/lint"
          tools/lint.sh --fix clang-format
          "$LINT_CACHE_DIR/clang-format-23.1.1" --version
          "$LINT_CACHE_DIR/clang-format-23.1.1" --dry-run -Werror "$f"
          git diff -- "$f" > "$RUNNER_TEMP/results/semaphore-format.patch"
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          before = (root / "original.cc").read_bytes()
          after = pathlib.Path("test/syscalls/linux/semaphore.cc").read_bytes()
          assert before.split() == after.split()
          version = subprocess.check_output([root / "lint" / "clang-format-23.1.1", "--version"], text=True).strip()
          assert "23.1.1" in version
          (root / "results" / "receipt.json").write_text(json.dumps({
              "source": "475bbaa0e3dde13c24d5e24c3fd8644eeaf932fe",
              "version": version, "before": hashlib.sha256(before).hexdigest(),
              "after": hashlib.sha256(after).hexdigest(), "postFormatViolations": 0,
              "changed": before != after, "whitespaceOnly": True,
          }, indent=2))
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: semctl-format
          path: ${{runner.temp}}/results
          if-no-files-found: error
