name: Compare root-owned Go dependency policy
on:
  push:
    branches: [qualification/gazelle-external-go-policy]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 4, persist-credentials: false}
      - name: Prepare the two released clients and the shared GNU worker
        env:
          BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          d="$RUNNER_TEMP/external-go"
          mkdir -p "$d/platform"
          cp test/rbe/external_go_policy.py "$d/"
          printf '%s\n' '{"verdict":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/external-go.json"
          curl --retry 3 -fsSL https://raw.githubusercontent.com/tamird/gvisor/b224a82d47407d754ce438e19f6d1b60f2e20fb3/.github/qualification/lint-pilot/check.py -o "$d/check.py"
          for v in 8.8.1 9.3.1; do
            curl --retry 3 -fsSL "https://releases.bazel.build/$v/release/bazel-$v-linux-x86_64" -o "$d/bazel-$v"
            chmod +x "$d/bazel-$v"
          done
          printf '%s  %s\n' 5b5bab2095065817d3416ca9a0678bd39c10c9ede432dbe8187bfe74de285160 "$d/bazel-8.8.1" 7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c "$d/bazel-9.3.1" | sha256sum -c -
          printf 'module(name="tcp_gnu")\n' > "$d/platform/MODULE.bazel"
          printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","EstimatedMemory":"2GB","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$d/platform/BUILD"
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BB_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BB_KEY"
          } > "$d/bb.rc"
      - name: Compare ordinary and explicitly adopting consumers
        run: LINT_RC="$RUNNER_TEMP/external-go/bb.rc" python3 -B "$RUNNER_TEMP/external-go/external_go_policy.py"
      - name: Check the compact artifact boundary
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "external-go.json"
          assert p.is_file() and not p.is_symlink()
          data = p.read_bytes()
          key = os.environ["KEY"].encode()
          assert key and key not in data and b"x-buildbuddy-api-key" not in data.lower()
          assert isinstance(json.loads(data), dict)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: external-go
          path: ${{ runner.temp }}/external-go.json
          if-no-files-found: error
