name: Check open mount descriptors through save, restore and permission retries
on:
  push:
    branches: [qualification/mount-fd-native-build]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: 5c7696351adac2c56ac109c7e28d9018a604d8f6
      BASE: 0bbcbf9de7626fcecba97f37723dce80b435d73d
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        cp test/rbe/mount-fd-verdict.py "$RUNNER_TEMP/verify-mount.py"
        [[ "$(git rev-parse HEAD^)" == "$CURRENT" && "$(git rev-parse HEAD^^)" == "$BASE" ]]
        git checkout --quiet --detach "$CURRENT"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt systempaths=unconfined -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Record each native and guest action independently
      run: |
        set -euo pipefail
        for name in save resume guest-permissions native-permissions; do
          executor=remote
          testname=mount_fd_test
          path=test/syscalls/linux/mount_fd.cc
          filter='*'
          case "$name" in
            save) platform=runsc_systrap_directfs_save;;
            resume) platform=runsc_systrap_directfs_save_resume;;
            *permissions)
              path=test/syscalls/linux/mount.cc; testname=mount_test
              filter='MountTest.UserNamespaceProcFsmount:MountTest.UserNamespaceProcFsmountRetryReadOnly:MountTest.UserNamespaceProcFsmountRevealingLockedMount'
              platform=runsc_systrap_directfs
              if [[ $name == native-permissions ]]; then executor=local; platform=native; fi;;
          esac
          [[ "$(git rev-parse HEAD)" == "$CURRENT" ]]
          d=$RUNNER_TEMP/records/$name; mkdir -p "$d"
          target="//test/syscalls:${testname}_${platform}"
          sha256sum "$path" > "$d/fixture-sha256"
          printf '%s\n' "$CURRENT" > "$d/source"; printf '%s\n' "$target" > "$d/target"
          printf '%s\n' "$executor" > "$d/executor"; printf '%s\n' "$filter" > "$d/filter"
          date -u +%FT%TZ > "$d/start"
          rc=0
          docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=3 --incompatible_modify_execution_info_additive --noremote_upload_local_results --strategy=GoStaticAnalysis=linux-sandbox --strategy=GoStandardLibraryAnalysis=linux-sandbox --strategy=GoStdlib=linux-sandbox --strategy=GoStdlibList=linux-sandbox '--modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache' '--strategy_regexp=Compiling test/syscalls/linux/mount[.]cc=linux-sandbox' --verbose_failures --strategy=TestRunner="$executor" --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=all --test_timeout=900 --test_sharding_strategy=disabled --test_env=GTEST_FILTER="$filter" "$target" > "$d/bazel.log" 2>&1 || rc=$?
          grep -A5 -E 'Invocation ID:|ERROR:|error:|FAILED|Build did NOT complete' "$d/bazel.log" | head -100 > "$d/compiler-diagnostics" || true
          if [[ $rc != 0 ]]; then tail -n 55 "$d/bazel.log" > "$d/terminal-diagnostics"; fi
          rm -f "$d/bazel.log"
          printf '%s\n' "$rc" > "$d/exit"; date -u +%FT%TZ > "$d/end"
          if [[ $rc != 0 && $rc != 3 ]]; then continue; fi
          for file in test.log test.xml; do
            docker exec tcp-compiler cat "bazel-testlogs/test/syscalls/${target#*:}/$file" > "$d/$file" || rm -f "$d/$file"
          done
        done
    - name: Verify all named cases and distinguish a capability skip from a pass
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/verify-mount.py" "$RUNNER_TEMP/records"
    - name: Redact credentials from the evidence bundle
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key=os.environ["BB_KEY"].encode()
        for f in (Path(os.environ["RUNNER_TEMP"])/"records").rglob("*"):
            if f.is_file() and key and key in (data:=f.read_bytes()):
                f.write_bytes(data.replace(key,b"[REDACTED]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: mount-fd-rebase-evidence
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
