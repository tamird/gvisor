name: Analyze the shared source presubmit patterns on both native architectures
on:
  push:
    branches: [qualification/mixed-presubmit-package-patterns]
permissions:
  contents: read
jobs:
  selection:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Bind the shared pattern source and prior source inventory
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 4b87bd4875ecde1ab6b994030d59871b59363ca1
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/mixed_selection.py'
          work="$RUNNER_TEMP/mixed-selection"
          mkdir -p "$work"
          cp .github/mixed_selection.py "$work/"
          git checkout -q --detach HEAD^
          test "$(cat .bazelversion)" = 9.3.1
          prior=https://raw.githubusercontent.com/tamird/gvisor/1841f6d99ecbf4b956331eda3996080881e39aa7/.github/qualification
          curl -fsSL --max-time 90 "$prior/mixed_go_graph.py" -o "$work/inventory.py"
          curl -fsSL --max-time 90 "$prior/mixed-native-owners.txt" -o "$work/owners.txt"
          curl -fsSL --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$work/bazel"
          cd "$work"
          echo '355e71ad64b0ee6eafc3706cb0297fa4cffcf9cb9fa49665f7ab7e71ccda2ad7  inventory.py' | sha256sum -c -
          echo '8d77c4972ee4660d4ebc8517d8042f2ad8aa2ea1e9711ce0138d0860bf1cfd1b  owners.txt' | sha256sum -c -
          echo 'e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  bazel' | sha256sum -c -
          chmod 755 bazel
      - name: Select tests from the package patterns and inspect their TestRunner actions
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -EB "$RUNNER_TEMP/mixed-selection/mixed_selection.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: mixed-native-package-selection
          path: ${{ runner.temp }}/mixed-selection/selection.json
          if-no-files-found: error
          retention-days: 14
