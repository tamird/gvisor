name: Recover the original ARM64 systrap archive
on:
  push:
    branches: [qualification/package-empty-worker-arm64]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Fetch the original public execution receipt and pinned reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          gh api repos/tamird/gvisor/actions/artifacts/13061881875/zip > "$RUNNER_TEMP/original.zip"
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-arm64 -o "$RUNNER_TEMP/bb"
          echo "5e8586e88d169395c2119a4143aa4d86d9b53d7abab3520acc735473f2bd2a90  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
      - name: Verify the two original BuildBuddy outputs by digest
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 test/rbe/empty_worker/recover_sysmsg.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: arm64-sysmsg-original-bytes
          path: ${{ runner.temp }}/sysmsg-recovery/receipt.json
          if-no-files-found: error
