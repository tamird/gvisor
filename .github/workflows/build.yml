name: Trace RACK recovery of a freshly retransmitted head
on:
  push:
    branches: [qualification/tcp-rto-fresh-head-probe]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: b0d2148f41d2d35577b5fe759192f71947cc87fd
      MASTER: aa767e4c43d011121271551fe24da501a56f729d
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/records/verdict.json"
        cp test/rbe/rack-fresh-head.py test/rbe/rack-fresh-head.go.txt "$RUNNER_TEMP/"
        git fetch -q --depth=1 https://github.com/tamird/gvisor.git "$PRODUCT" "$MASTER"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
    - name: Compare the timeout and genuine loss on the same wire fixture
      run: |
        set -euo pipefail
        for arm in master measured; do
          source="$PRODUCT"; [[ "$arm" != master ]] || source="$MASTER"
          git checkout --quiet --detach "$source"
          [[ "$(git rev-parse HEAD)" == "$source" ]]
          target=pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test.go
          cat "$RUNNER_TEMP/rack-fresh-head.go.txt" >> "$target"
          d="$RUNNER_TEMP/records/$arm"; mkdir -p "$d"
          printf '%s\n' "$source" > "$d/head"
          code=0
          timeout 16m docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=64 --strategy=TestRunner=remote --nocache_test_results --test_sharding_strategy=disabled --test_output=all --test_timeout=120 --test_env=GO_TEST_WRAP_TESTV=1 --test_arg=-test.v --test_filter='^TestRACKFreshHead$' --build_event_json_file="$RUNNER_TEMP/$arm.bep" //pkg/tcpip/transport/tcp/test/e2e:tcp_rack_test > "$d/log" 2>&1 || code=$?
          printf '%s\n' "$code" > "$d/exit"
          for file in test.log test.xml; do docker exec tcp-compiler cat "bazel-testlogs/pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test/$file" > "$d/$file" || true; done
          git restore --source="$source" -- "$target"
        done
        python3 "$RUNNER_TEMP/rack-fresh-head.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: rack-fresh-head-wire
        path: ${{ runner.temp }}/records/verdict.json
        if-no-files-found: error
