name: Build both normal releases without hosted sidecar runtimes
'on':
  push:
    branches:
    - qualification/llvm-stage0-normal-release
permissions:
  contents: read
jobs:
  producer:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt
      == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 135
    outputs:
      handoff: ${{ steps.boundary.outputs.handoff }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 2
    - name: Bind the no-909 source and native client
      id: setup
      run: |
        set -eu
        umask 077
        test "$(git rev-parse HEAD^)" = fffadb2bb858399110f8de18d04cbbf5e5c28997
        test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/workflows/build.yml test/rbe/native_cross_inputs.py test/rbe/runtime_cross.py test/rbe/runtime_guest.py test/rbe/runtime_release.py test/rbe/runtime_sidecars.py)"
        d="$RUNNER_TEMP/runtime-cross"
        mkdir -p "$d/public"
        cp test/rbe/native_cross_inputs.py test/rbe/runtime_cross.py test/rbe/runtime_guest.py test/rbe/runtime_sidecars.py test/rbe/runtime_release.py "$d/"
        echo "b0626fb5ecb5bb9c41d644ced5af036019cbefbeef7975c71878021f6e146653  $d/native_cross_inputs.py" | sha256sum -c -
        echo "e0fde0e7bed53e1dc2d9c2a57b1e82fe01d4f0a48aa3e926c323afc49eee0a0c  $d/runtime_cross.py" | sha256sum -c -
        echo "bce1d88d73ba07ca283697e2b9215eb06f1e2f2baacfb43130762ff914d27524  $d/runtime_guest.py" | sha256sum -c -
        echo "11749e757b86843277edae84081f5dbeb5bc4258c722ffd69be1f508bec845d4  $d/runtime_sidecars.py" | sha256sum -c -
        echo "2d2c273ff1c91befc1e6ad05e327220e95a130033e25e1e48992b76d44e749f0  $d/runtime_release.py" | sha256sum -c -
        for n in amd64 arm64 producer; do
          printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$d/public/$n.json"
        done
        git checkout --detach HEAD^
        test "$(uname -m)" = x86_64
        test "$(cat .bazelversion)" = 9.3.1
        command -v ar
        command -v zstd
        curl --retry 3 --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
        echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
        chmod 755 "$d/bazel"
    - name: Build and install the plain native AMD64 release
      id: amd
      if: always() && !cancelled() && steps.setup.outcome == 'success'
      run: env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" USE_BAZEL_VERSION=9.3.1 CARRIER_SHA="$GITHUB_SHA" QUALIFICATION_RUN_ID="$GITHUB_RUN_ID"
        python3 -B "$RUNNER_TEMP/runtime-cross/runtime_release.py" amd64
    - name: Build and install the ordinary ARM64 cross release
      id: arm
      if: always() && !cancelled() && steps.setup.outcome == 'success'
      run: env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" USE_BAZEL_VERSION=9.3.1 CARRIER_SHA="$GITHUB_SHA" QUALIFICATION_RUN_ID="$GITHUB_RUN_ID"
        python3 -B "$RUNNER_TEMP/runtime-cross/runtime_release.py" arm64
    - name: Archive the verified ARM guest inputs
      if: always() && !cancelled() && steps.arm.outcome == 'success'
      run: env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" USE_BAZEL_VERSION=9.3.1 CARRIER_SHA="$GITHUB_SHA" QUALIFICATION_RUN_ID="$GITHUB_RUN_ID"
        python3 -B "$RUNNER_TEMP/runtime-cross/runtime_release.py" producer
    - name: Validate bounded public receipts and exact transport
      id: boundary
      if: always()
      run: |
        python3 -B - <<'PYTHON'
        import hashlib,json,os,re,tarfile
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'runtime-cross/public'
        assert {p.name for p in root.iterdir()} <= {'amd64.json','arm64.json','producer.json','payload.tar.gz'}
        for name in ('amd64','arm64','producer'):
            p=root/(name+'.json')
            assert p.is_file() and not p.is_symlink() and 0<p.stat().st_size<524288
            raw=p.read_bytes();doc=json.loads(raw)
            assert doc['status'] in ('PASS','FAIL','INCOMPLETE')
            assert not re.search(rb'(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}',raw)
        doc=json.loads((root/'producer.json').read_bytes())
        if doc['status']=='PASS':
            archive=root/'payload.tar.gz'
            assert archive.is_file() and not archive.is_symlink() and archive.stat().st_size<64000000
            assert archive.stat().st_size==doc['archive']['bytes'] and hashlib.sha256(archive.read_bytes()).hexdigest()==doc['archive']['sha256']
            with tarfile.open(archive) as tar:
                members=tar.getmembers()
                assert len(members)==4 and {m.name for m in members}=={'runsc','gvisor-bin/gvisor_sentry','gvisor-bin/gvisor-sentry-prewarmer','busybox'}
                for m in members:
                    assert m.isfile() and m.mode==0o755 and m.size==doc['payload'][m.name]['bytes']
                    assert hashlib.sha256(tar.extractfile(m).read()).hexdigest()==doc['payload'][m.name]['sha256']
            with open(os.environ['GITHUB_OUTPUT'],'a') as output: print('handoff=ready',file=output)
        PYTHON
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.boundary.outcome == 'success'
      with:
        name: llvm-stage0-normal-release
        path: ${{ runner.temp }}/runtime-cross/public/*.json
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.boundary.outputs.handoff == 'ready'
      with:
        name: llvm-stage0-arm-handoff
        path: |-
          ${{ runner.temp }}/runtime-cross/public/producer.json
          ${{ runner.temp }}/runtime-cross/public/payload.tar.gz
        if-no-files-found: error
        retention-days: 1
    - name: Stop the native Bazel server
      if: always()
      run: |-
        d="$RUNNER_TEMP/runtime-cross"
        if test -x "$d/bazel"; then timeout -k 5 30 "$d/bazel" shutdown >/dev/null 2>&1 || true; fi
  consumer:
    needs: producer
    if: always() && github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && needs.producer.outputs.handoff == 'ready'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: llvm-stage0-arm-handoff
        path: ${{ runner.temp }}/runtime-cross/handoff
    - name: Bind the native ARM-only consumer
      run: |
        set -eu
        umask 077
        d="$RUNNER_TEMP/runtime-cross"
        mkdir "$d/public"
        cp test/rbe/native_cross_inputs.py test/rbe/runtime_cross.py test/rbe/runtime_guest.py test/rbe/runtime_sidecars.py test/rbe/runtime_release.py "$d/"
        echo "b0626fb5ecb5bb9c41d644ced5af036019cbefbeef7975c71878021f6e146653  $d/native_cross_inputs.py" | sha256sum -c -
        echo "e0fde0e7bed53e1dc2d9c2a57b1e82fe01d4f0a48aa3e926c323afc49eee0a0c  $d/runtime_cross.py" | sha256sum -c -
        echo "bce1d88d73ba07ca283697e2b9215eb06f1e2f2baacfb43130762ff914d27524  $d/runtime_guest.py" | sha256sum -c -
        echo "11749e757b86843277edae84081f5dbeb5bc4258c722ffd69be1f508bec845d4  $d/runtime_sidecars.py" | sha256sum -c -
        echo "2d2c273ff1c91befc1e6ad05e327220e95a130033e25e1e48992b76d44e749f0  $d/runtime_release.py" | sha256sum -c -
        printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$d/public/consumer.json"
        test "$(uname -m)" = aarch64
    - name: Boot the received ARM guest without rebuilding
      run: env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" USE_BAZEL_VERSION=9.3.1 CARRIER_SHA="$GITHUB_SHA" QUALIFICATION_RUN_ID="$GITHUB_RUN_ID"
        python3 -B "$RUNNER_TEMP/runtime-cross/runtime_release.py" consumer
    - name: Validate the bounded native guest receipt
      id: boundary
      if: always()
      run: |
        python3 -B - <<'PYTHON'
        import json,os,re
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'runtime-cross/public'
        assert {p.name for p in root.iterdir()}=={'consumer.json'}
        p=root/'consumer.json'
        assert p.is_file() and not p.is_symlink() and 0<p.stat().st_size<65536
        raw=p.read_bytes();assert json.loads(raw)['status'] in ('PASS','FAIL','INCOMPLETE')
        assert not re.search(rb'(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}',raw)
        PYTHON
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.boundary.outcome == 'success'
      with:
        name: llvm-stage0-arm-native-guest
        path: ${{ runner.temp }}/runtime-cross/public/consumer.json
        if-no-files-found: error
