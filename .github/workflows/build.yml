name: Build the split runtime with source-default LLVM for both targets
on:
  push:
    branches: [qualification/default-llvm-current-runtime]
permissions:
  contents: read
jobs:
  cross:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the reviewed default compiler and ELF offset source
        run: |
          set -eu
          umask 077
          test "$(git rev-parse HEAD^)" = 4bee07965270dc7cb4ed89eb6a3b17968b3e0a90
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/workflows/build.yml test/rbe/native_cross_inputs.py test/rbe/runtime_cross.py)"
          d="$RUNNER_TEMP/runtime-cross"
          mkdir "$d"
          cp test/rbe/native_cross_inputs.py test/rbe/runtime_cross.py "$d/"
          echo "6e5110d042e88f2c8ab8fc3ff63aa66acf81f74e1f9a49c5a59c6cce3c9afabb  $d/native_cross_inputs.py" | sha256sum -c -
          echo "f78a6a372af5142b0d4f107d1b058944bb9f5897adf7308d0959bcd8e7e9321b  $d/runtime_cross.py" | sha256sum -c -
          test "$(cat .bazelversion)" = 9.3.1
          grep -Fx 'bazel_dep(name = "llvm", version = "0.8.24")' MODULE.bazel
          test "$(uname -m)" = x86_64
          curl --retry 3 --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          test "$("$d/bazel" --version)" = 'bazel 9.3.1'
      - name: Build both split runtimes and inspect native or emulated version output
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" USE_BAZEL_VERSION=9.3.1 python3 -B "$RUNNER_TEMP/runtime-cross/runtime_cross.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-master-default-llvm
          path: ${{ runner.temp }}/runtime-cross/verdict.json
          if-no-files-found: error
