name: Qualify requested kernels in generic snapshots
on:
  push:
    branches: [qualification/buildbuddy-generic-kernel-compat]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: carrier, persist-credentials: false, fetch-depth: 1}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tamird/buildbuddy
          ref: 7c8ace19ecf563a0417c2fa39575e04eb7851e5e
          path: product
          persist-credentials: false
          fetch-depth: 2
      - name: Fetch the immutable regression control
        working-directory: product
        run: git fetch --no-tags --depth=1 origin 78f826dd61c078b907ec9328385ea56d01741bfc
      - name: Prepare private remote configuration and reporter
        working-directory: carrier
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/generic-kernel-evidence"
          printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap","executed_targets":0}' > "$RUNNER_TEMP/generic-kernel-evidence/verdict.json"
          test -n "$BUILDBUDDY_API_KEY"
          {
            printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'common --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/generic-kernel-private.bazelrc"
          unset BUILDBUDDY_API_KEY
          cp test/rbe/{qualification_report.py,unit_matrix.py,buildbuddy_generic_kernel.py} "$RUNNER_TEMP/"
          python3 -m py_compile "$RUNNER_TEMP/buildbuddy_generic_kernel.py"
          command -v bazelisk
      - name: Run the same regression before and after the repair
        working-directory: product
        run: python3 "$RUNNER_TEMP/buildbuddy_generic_kernel.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: buildbuddy-generic-kernel
          path: |
            ${{ runner.temp }}/generic-kernel-evidence/*.json
            ${{ runner.temp }}/generic-kernel-evidence/*/*.json
            ${{ runner.temp }}/generic-kernel-evidence/*/test.xml
          if-no-files-found: error
