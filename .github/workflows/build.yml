name: Compare native ZIP actions with manifest and zipped writers
on: workflow_dispatch
permissions: {contents: read}
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tamird/rules_pkg
          ref: 1702e63c4673bf8c00df82a1613c2359895fbe20
          fetch-depth: 2
          persist-credentials: false
          path: supplier
      - name: Compare native Linux ZIP actions and outputs
        env:
          USE_BAZEL_VERSION: 8.8.1
        run: python3 .github/qualification/supplier-zip/runfiles.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: zip-runfiles
          path: ${{ runner.temp }}/rules-zip-runfiles.json
          if-no-files-found: error
