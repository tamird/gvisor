name: Read the original namespace fixture logs
on:
  push:
    branches: [qualification/route-namespace-original-logs]
permissions:
  contents: read
  actions: read
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Stage the source-bound reader and existing fixed-origin client
        run: |
          set -eu
          umask 077
          task="$RUNNER_TEMP/release-rbe"
          mkdir -p "$task/harness" "$task/public"
          cp test/rbe/netns_runner/read_logs.py "$task/harness/read_logs.py"
          git fetch --quiet --depth=1 https://github.com/tamird/gvisor.git dc3dc3dba86bb008499de9d959398a64c27c40ad
          test "$(git rev-parse dc3dc3dba:test/rbe/release_prewarmer/cas_inputs.py)" = b5c6f23eb5e3b94aaf412cae2a76843eaf0fa180
          git show dc3dc3dba:test/rbe/release_prewarmer/cas_inputs.py > "$task/harness/cas_inputs.py"
      - name: Retrieve the immutable original typed receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tamird/gvisor/actions/artifacts/13415219314/zip > "$RUNNER_TEMP/release-rbe/baseline.zip"
          gh api repos/tamird/gvisor/actions/artifacts/13462233733/zip > "$RUNNER_TEMP/release-rbe/candidate.zip"
      - name: Read only the five original test logs
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B "$RUNNER_TEMP/release-rbe/harness/read_logs.py"
      - name: Check the bounded typed result
        id: privacy
        if: always()
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "release-rbe" / "public"
          paths = list(root.iterdir())
          assert len(paths) == 1 and paths[0].name == 'route-logs.json'
          path = paths[0]
          assert path.is_file() and not path.is_symlink() and path.stat().st_size < 49152
          raw = path.read_bytes()
          assert isinstance(json.loads(raw), dict)
          key = os.environ['ACCESS'].encode()
          assert key and not any(value in raw for value in (key, b'remote_header', b'bes_header', b'Authorization:', b'Bearer ', b'X-Amz-Signature'))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: route-namespace-diagnostics
          path: ${{ runner.temp }}/release-rbe/public/*.json
          if-no-files-found: error
          retention-days: 14
