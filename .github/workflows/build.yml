name: Check the GSUtil benchmark on both native architectures
on:
  push:
    branches: [qualification/gsutil-native-release]
permissions:
  contents: read
jobs:
  transfer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            sha: e6aa030fb8379fe92b53e9b8b696419e0dce8a3bbcc7d4c1cf76b2ea3d6569eabd7360e694deda6ccbd77095b3e82ca0f90a3d8fd13a3e5d6b11cd29fe4649
          - arch: aarch64
            os: ubuntu-24.04-arm
            sha: 88d6194a71a73e3934556028e2168c7bd1051aea28fe190cfd97226ff08e2697550927bc98a56270c90f3452401e3b1081b4d75d9a1283228e86e62f60ebdf0d
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Record the actual source, hardware and pod input
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          mkdir -p "$RUNNER_TEMP/results"
          git rev-parse HEAD HEAD^ > "$RUNNER_TEMP/results/carrier-product"
          uname -smr > "$RUNNER_TEMP/results/worker"
          lscpu | sed -n '/^Architecture:/p; /^Model name:/p' >> "$RUNNER_TEMP/results/worker"
          sha256sum test/rbe/gsutil-pod-commands.json >> "$RUNNER_TEMP/results/worker"
      - name: Configure the pinned Linux execution platform
        id: setup
        if: matrix.arch == 'x86_64'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
          mkdir -p "$RUNNER_TEMP/gnu"
          GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
          test -n "$BUILDBUDDY_API_KEY"
          rc=$RUNNER_TEMP/images.bazelrc
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          cat >> "$rc" <<'RC'
          build --jobs=8
          build --strategy=GoStdlib=linux-sandbox
          build --strategy=GoStdlibList=linux-sandbox
          build --strategy=GoStandardLibraryAnalysis=linux-sandbox
          build --strategy=GoStaticAnalysis=linux-sandbox
          build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache
          build --noremote_upload_local_results
          build --remote_download_outputs=toplevel
          build --noshow_progress
          RC

          mkdir -p "$RUNNER_TEMP/results"
          git rev-parse HEAD HEAD^ > "$RUNNER_TEMP/results/carrier-product"
      - name: Emit the actual rootfs pod commands with the owning library
        id: spec
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          bazel --bazelrc="$RUNNER_TEMP/images.bazelrc" test --config=x86_64 --nocache_test_results --test_output=errors --test_arg=-test.v //test/kubernetes/benchmarks:gsutil_release_command_test
          sed -n 's/^.*GSUTIL_COMMANDS=//p' bazel-testlogs/test/kubernetes/benchmarks/gsutil_release_command_test/test.log > "$RUNNER_TEMP/commands.json"
          python3 -c 'import json,sys; assert set(json.load(open(sys.argv[1])))=={"single","sliced"}' "$RUNNER_TEMP/commands.json"
          cmp test/rbe/gsutil-pod-commands.json "$RUNNER_TEMP/commands.json"
          cp "$RUNNER_TEMP/commands.json" "$RUNNER_TEMP/results/"
          cp bazel-testlogs/test/kubernetes/benchmarks/gsutil_release_command_test/test.xml "$RUNNER_TEMP/results/"
      - name: Reproduce the shipped benchmark commands on native Linux
        if: always()
        run: python3 test/rbe/gsutil-direct.py '${{ matrix.arch }}' shipped runc
      - name: Run the benchmark commands using Google's exact release
        if: always()
        run: python3 test/rbe/gsutil-direct.py '${{ matrix.arch }}' candidate runc
      - name: Install the checked release of runsc with its sidecars
        id: systrap
        if: always()
        run: |
          set -euo pipefail
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          dir="$RUNNER_TEMP/runtime"
          mkdir -p "$dir"
          curl -fsSLo "$dir/gvisor.tar.zstd" 'https://storage.googleapis.com/gvisor/releases/release/20261026.0/${{ matrix.arch }}/gvisor.tar.zstd'
          (cd "$dir" && echo '${{ matrix.sha }}  gvisor.tar.zstd' | sha512sum -c - && tar --zstd -xf gvisor.tar.zstd)
          bin=$(find "$dir" -type f -name runsc)
          test -x "$bin"
          "$bin" --version | tee "$RUNNER_TEMP/results/runtime-version"
          sudo "$bin" install --runtime=gsutil-systrap -- --platform=systrap
          sudo systemctl reload docker
          for i in {1..20}; do
            if docker info --format '{{json .Runtimes}}' | jq -e 'has("gsutil-systrap")' >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run the same two transfers under released runsc systrap
        if: always() && steps.systrap.outcome == 'success'
        run: python3 test/rbe/gsutil-direct.py '${{ matrix.arch }}' candidate gsutil-systrap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gsutil-native-${{ matrix.arch }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
      - name: Remove private runner settings
        if: always()
        run: rm -f "$RUNNER_TEMP/images.bazelrc"
