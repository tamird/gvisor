name: Build the current default archive with the released C toolchain
on:
  push:
    branches: [qualification/llvm-current-release-archive-20261112]
permissions: {}
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind the tested tree and install the pinned Linux Bazel
        id: setup
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/compiler-result"
          mkdir -p "$out/dist" "$out/bin"
          git rev-parse HEAD HEAD^ HEAD^^ | tee "$out/source"
          test "$(git rev-parse --short=10 HEAD^)" = a066005a68
          test "$(git rev-parse --short=9 HEAD^^)" = 79c4fcfce
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml'
          test "$(cat .bazelversion)" = 9.3.1
          grep 'name = "rules_go", version = "0.65.0"' MODULE.bazel
          grep 'name = "llvm", version = "0.8.24"' MODULE.bazel
          api=https://api.github.com/repos
          fetch=(curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 --max-time 180 -H 'Accept: application/octet-stream')
          "${fetch[@]}" "$api/bazelbuild/bazel/releases/assets/661108421" -o "$out/bin/bazel"
          "${fetch[@]}" "$api/cerisier/glibc-headers/releases/assets/253918436" -o "$out/dist/x86_64-linux-gnu.2.28.tar.zst"
          (cd "$out" && sha256sum -c <<'SUMS'
          7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bin/bazel
          8015f4a710987439dfdcde7539b62cc5db52d2cd9456af5e2e297494f13c56f3  dist/x86_64-linux-gnu.2.28.tar.zst
          SUMS
          )
          chmod 755 "$out/bin/bazel"
          "$out/bin/bazel" --version | tee "$out/bazel-version"
          echo "$out/bin" >> "$GITHUB_PATH"
          echo "OUT=$out" >> "$GITHUB_ENV"
          cat >"$out/common" <<'FLAGS'
          flags=(--remote_cache= --remote_executor= --bes_backend= --disk_cache= --jobs=4 --lockfile_mode=off --module_mirrors=https://bcr.cloudflaremirrors.com "--distdir=$OUT/dist" --noshow_progress)
          FLAGS
      - name: Build and read the default release archive
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$OUT/common"
          archive=//debian:gvisor-release-tar-zstd
          for attempt in 1 2 3; do
            log="$OUT/release-build-$attempt.log"
            if bazel build "${flags[@]}" "$archive" 2>&1 | tee "$log"; then
              break
            fi
            if (( attempt == 3 )) || ! grep -Eq 'TLS handshake timeout|connection reset by peer|connection timed out|Temporary failure in name resolution' "$log"; then
              exit 1
            fi
          done
          path=$(bazel cquery "${flags[@]}" "$archive" --output=files)
          test -f "$path"
          sha256sum "$path" | tee "$OUT/release-sha256"
          tar --zstd -tf "$path" | tee "$OUT/release-members"
          mkdir "$OUT/installed"
          tar --zstd -xf "$path" -C "$OUT/installed" runsc gvisor-bin/gvisor_sentry gvisor-bin/gvisor-sentry-prewarmer
          for file in "$OUT/installed/runsc" "$OUT"/installed/gvisor-bin/*; do
            readelf -h "$file" | grep -F 'Advanced Micro Devices X86-64'
            sha256sum "$file" >> "$OUT/release-binaries"
          done
          "$OUT/installed/runsc" --version | tee "$OUT/runsc-version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: current-released-compiler-archive
          path: |
            ${{ runner.temp }}/compiler-result/*.log
            ${{ runner.temp }}/compiler-result/*-version
            ${{ runner.temp }}/compiler-result/source
            ${{ runner.temp }}/compiler-result/release-*
          if-no-files-found: error
          retention-days: 14
