name: Verify syscall header handling with Bazel 9
on:
  push:
    branches: [qualification/bazel9-syscall-header-search]
permissions:
  contents: read
jobs:
  syscall-build:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      STOCK: 4c2df79754b332dab322e4e8c77e55ca401904ce
      FIX: ac437abc5d8315f460898d950e1478789fca46fb
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 3, persist-credentials: false}
    - name: Prepare the same GNU compilers used by the syscall builds
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/headers"
        mkdir -p "$d/report"
        echo '{"verdict":"INCOMPLETE","phase":"bootstrap"}' > "$d/report/verdict.json"
        test "$(git rev-parse HEAD^)" = "$FIX"
        test "$(git rev-parse HEAD^^)" = "$STOCK"
        cp test/rbe/verify_syscall_headers.py "$d"
        reporter=599cb05aecfb107e07f81b8591a009cb12d6ffa7
        git fetch --no-tags --depth=1 origin "$reporter"
        for name in qualification_report unit_matrix; do
          git show "$reporter:test/rbe/$name.py" > "$d/$name.py"
        done
        curl --retry 3 -fsSL https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
        echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $d/bazel" | sha256sum -c -
        chmod +x "$d/bazel"
        docker pull "$GNU"
        docker run -d --init --name gnu -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$d:$d" -w "$GITHUB_WORKSPACE" --entrypoint sleep "$GNU" infinity
        docker exec gnu /usr/bin/aarch64-linux-gnu-gcc --version
    - name: Compare the compiler actions and build both failing owners
      run: python3 -B "$RUNNER_TEMP/headers/verify_syscall_headers.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: bazel9-syscall-header-verdict
        path: ${{ runner.temp }}/headers/report/
