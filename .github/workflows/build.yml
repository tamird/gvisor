name: Qualify the DinD exec deadline on native ARM64
on:
  push:
    branches: [qualification/arm64-dind-exec-deadline]
permissions: {}
jobs:
  linux:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 152
    steps:
      - name: Bind the fixed runtime, tests and public dependency helpers
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          w="$RUNNER_TEMP/netip-wildcard"
          mkdir -m 700 "$w" "$w/receipt"
          mkdir -p "$RUNNER_TEMP/recvbuf/dist"
          echo '{"verified":false,"stage":"setup"}' > "$w/receipt/result.json"
          candidate=b37e519bbf5d14868442a32f336f768d955820b3
          prep=1dd5c8738089670485a347cfb85dad07b92d0e0d
          assets=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
          inputs=c3569a60dc1836ac6fad05e86d7951866c796b4f
          native=885416118fc84d4ec6ba1cb7629a4f4bd346e051
          git init -q .
          git fetch -q --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$prep" "$assets" "$inputs" "$native"
          git checkout -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git rev-parse "$candidate^{tree}")" = 5ce0876ee6ef67caf273643f2b4fd4eaa3a7775d
          test "$(git rev-parse "$candidate^")" = dd49ce763bea6f5b38eff62f2ca586b6a22c4a9f
          git diff --exit-code "$candidate" HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/dind_deadline.py' ':!test/image/deadline_qualification_test.go' ':!test/image/BUILD'
          git show "$GITHUB_SHA:.github/qualification/dind_deadline.py" > "$w/check.py"
          git show "$native:.github/qualification/netip_wildcard.py" > "$w/native.py"
          git show "$prep:.github/qualification/go_branch_netgofer.py" > "$w/previous.py"
          git show "$assets:.github/qualification/recvbuf_deps.py" > "$w/public_assets.py"
          git show "$inputs:.github/qualification/tldk_public_inputs.py" > "$w/tldk_public_inputs.py"
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-arm64 -o "$w/bazel"
          echo "10ba9cb76d4ee748d274dcc2981992bb12b74a203dc41a9c2eceeb8f29359366  $w/bazel" | sha256sum -c
          chmod +x "$w/bazel"
          for suite in noble noble-updates; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://ports.ubuntu.com/ubuntu-ports $suite main universe"
          done > "$w/noble.list"
          opts=(-o "Dir::Etc::sourcelist=$w/noble.list" -o Dir::Etc::sourceparts=-)
          sudo -n apt-get "${opts[@]}" update -qq
          sudo -n apt-get "${opts[@]}" install -qq -y --no-install-recommends g++-x86-64-linux-gnu libnuma-dev
          for item in docker@sha256:b7057d9317bbbef47e1263c5f06a56c3960fe90bb433f30bd0259e4ec820937c alpine@sha256:abd08772d6de375e994d318b1d272bac9ff9dc4652381756d0221c6755a04c47; do
            name="${item%@*}"
            uri="us-central1-docker.pkg.dev/gvisor-presubmit/gvisor-presubmit-images/basic/${name}_aarch64@${item#*@}"
            docker pull --platform=linux/arm64 "$uri"
            docker tag "$uri" "gvisor.dev/images/basic/$name"
          done
      - name: Check both callers and the real bridge workload
        timeout-minutes: 138
        shell: bash
        run: |
          env -i HOME="$HOME" USER="$USER" PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$RUNNER_TEMP/netip-wildcard/check.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !cancelled()
        with:
          name: arm64-dind-exec-deadline-results
          path: ${{ runner.temp }}/netip-wildcard/receipt/
          if-no-files-found: error
          retention-days: 14
