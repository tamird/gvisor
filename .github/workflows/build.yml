name: Check native YAML tests with Bazel-expanded paths
on:
  push:
    branches: [qualification/yamltest-configured-inputs]
permissions: {}
jobs:
  yaml-tests:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Fetch the exact public comparison and pinned Bazel
        run: |
          set -euo pipefail
          git init .
          git fetch --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 9ce2163af9df139378f2bd972b897e556895424b
          test "$(git rev-parse HEAD^^)" = 7eda82e34c64918d1f1b2a3d73a244d6979dbe44
          test "$(cat .bazelversion)" = 9.3.1
          work="$RUNNER_TEMP/yaml-native"
          mkdir "$work"
          cp .github/qualification/yamltest_native/{qualify,probe}.py "$work"
          chmod +x "$work/probe.py"
          curl -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$work/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $work/bazel" | sha256sum -c -
          chmod +x "$work/bazel"
      - name: Check the five actual YAML tests and configured controls
        run: python3 -IB "$RUNNER_TEMP/yaml-native/qualify.py"
      - name: Upload bounded original owner outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-yaml-configured-inputs
          path: ${{ runner.temp }}/yaml-native/result.json
          if-no-files-found: error
          retention-days: 14
