name: Install the public release from a tool-free Bazel client
on:
  push:
    branches: [qualification/lean-release-client-worker-identity]
permissions: {contents: read}
jobs:
  release:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 5}
      - name: Stage the stripped client and pinned execution platform
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD^)" = bea45d149b9a8e4a4bc4015c48cb6d6b6ee822fc
          test "$(git rev-parse HEAD^^)" = f358900d9ded0fea0a6ecb78180a2b69a707714a
          test "$(git rev-parse HEAD~3)" = 102ffa219ed50275aabe8731f4e3a3aa35336b48
          test "$(git rev-parse HEAD~4)" = d5fe3c2eef21434cbe13e3604f0f070ace4d7edb
          cp .github/qualification/lean_release_client.py "$RUNNER_TEMP/release-check.py"
          cp .github/qualification/release-worker.BUILD "$RUNNER_TEMP/release-worker.BUILD"
          echo "1f69d151f9bed2a904fea1e141633add759e521367dfe1cf570c5efe0e508142  $RUNNER_TEMP/release-check.py" | sha256sum -c -
          echo "ae1f23a11f3cb747fbec49a34c510c5ab9dcb75d06d94bfd4d9a49d50c629271  $RUNNER_TEMP/release-worker.BUILD" | sha256sum -c -
          git switch --quiet --detach f358900d9ded0fea0a6ecb78180a2b69a707714a
          mkdir -p test/rbe/release_prewarmer
          cp "$RUNNER_TEMP/release-worker.BUILD" test/rbe/release_prewarmer/BUILD
          python3 -I -B "$RUNNER_TEMP/release-check.py" setup
          d="$RUNNER_TEMP/lean-delivery"
          curl --retry 3 -fsSL --proto '=https' --proto-redir '=https' --max-time 100 https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 -o "$d/bb"
          echo "205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  $d/bb" | sha256sum -c -
          chmod 755 "$d/bb"
      - name: Exercise the existing workspace status action without credentials
        run: python3 -I -B "$RUNNER_TEMP/release-check.py" stock
      - name: Select the released source identity
        run: |
          git switch --quiet --detach bea45d149b9a8e4a4bc4015c48cb6d6b6ee822fc
          test "$(git rev-parse HEAD:tools/gazelle-native-environment.patch)" = 99d3fd3d2e7d0d6eb562eff6eb66a553fefb6d72
      - name: Build and install the release using its source commit as its label
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/lean-delivery"
          rc="$d/private.bazelrc"
          trap 'rm -f "$rc"' EXIT
          test -n "$BUILDBUDDY_API_KEY"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" python3 -I -B "$RUNNER_TEMP/release-check.py" archive
      - name: Read the released checkpoint identity and restore the guest
        run: |
          test ! -e "$RUNNER_TEMP/lean-delivery/private.bazelrc"
          if python3 -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"lean-delivery/archive.json").read_text()); raise SystemExit(d.get("cli_version") != d["source"])'; then
            sudo -n env -i HOME=/root PATH=/usr/sbin:/usr/bin:/sbin:/bin RUNNER_TEMP="$RUNNER_TEMP" python3 -I -B "$RUNNER_TEMP/release-check.py" runtime
          fi
      - name: Check the three allowlisted receipts
        id: receipt
        if: always()
        run: |
          python3 -I -B - <<'PY'
          import json, os, re
          from pathlib import Path
          d = Path(os.environ["RUNNER_TEMP"])/"lean-delivery"
          assert not (d/"private.bazelrc").exists()
          found = False
          for name in ("stock", "archive", "runtime"):
              p = d/(name+".json")
              if not p.exists():
                  continue
              found = True
              assert p.is_file() and not p.is_symlink() and p.stat().st_size < 48000
              raw = p.read_bytes()
              assert not re.search(rb'(?i)x-buildbuddy-api-key|remote_header|bes_header|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY', raw)
              result = json.loads(raw)
              assert result["source"] in ("f358900d9ded0fea0a6ecb78180a2b69a707714a","bea45d149b9a8e4a4bc4015c48cb6d6b6ee822fc")
          assert found
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.receipt.outcome == 'success'
        with:
          name: clean-client-scratch-release
          path: |
            ${{ runner.temp }}/lean-delivery/stock.json
            ${{ runner.temp }}/lean-delivery/archive.json
            ${{ runner.temp }}/lean-delivery/runtime.json
          if-no-files-found: error
          retention-days: 7
      - name: Require the expected control failure, installed release, and restored guest
        if: always() && steps.receipt.outcome == 'success'
        run: |
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          d = Path(os.environ["RUNNER_TEMP"])/"lean-delivery"
          def receipt(name):
              return json.loads((d/(name+".json")).read_text())
          stock = receipt("stock")
          assert stock["workspace_status_failed"], "old workspace status action did not reproduce"
          archive = receipt("archive")
          assert archive["container_exit"] == archive["bazel_exit"] == 0, "release build failed"
          assert all(archive["targets"].get(label) for label in (
              "//:release", "//debian:gvisor-release-tar-bz2", "//test/rbe/go_bootstrap:static_ash")), "missing target"
          assert archive["both_package_actions_ran_on_scratch"], "missing uncached scratch package actions"
          assert len(archive["amd64_installed_member_sha256"]) == 9, "missing installed archive members"
          assert archive["cli_version"] == archive["source"], "release identifies another source"
          runtime = receipt("runtime")
          assert runtime["metadata_identity"] == archive["source"] and runtime["restored_guest"], "guest restore incomplete"
          PY
