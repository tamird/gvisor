name: Boot ARM runtimes with a released-musl cross-built companion
'on':
  push:
    branches:
    - qualification/master-llvm-arm-musl-guest
permissions:
  contents: read
  actions: read
jobs:
  producer:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted
      && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 3
    - name: Bind the reviewed native companion without the GNU runtime patch
      run: |
        set -eu
        umask 077
        test "$(git rev-parse HEAD^)" = 1e80b818243dd8132e9d14945f840d927753a2e3
        test "$(git rev-parse HEAD^^)" = 8169ff661d26dba5df30ac8ecaec2f201659eff4
        test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/workflows/build.yml test/rbe/native_cross_inputs.py test/rbe/runtime_arm_guest.py test/rbe/runtime_cross.py test/rbe/runtime_guest.py)"
        d="$RUNNER_TEMP/runtime-cross"
        mkdir "$d"
        mkdir "$d/public"
        cp test/rbe/native_cross_inputs.py test/rbe/runtime_cross.py test/rbe/runtime_guest.py test/rbe/runtime_arm_guest.py "$d/"
        echo "b0626fb5ecb5bb9c41d644ced5af036019cbefbeef7975c71878021f6e146653  $d/native_cross_inputs.py" | sha256sum -c -
        echo "e0fde0e7bed53e1dc2d9c2a57b1e82fe01d4f0a48aa3e926c323afc49eee0a0c  $d/runtime_cross.py" | sha256sum -c -
        echo "8097f1d366ff1f8dea752e505385cea5f5f041e64af924520de5134384a35e69  $d/runtime_guest.py" | sha256sum -c -
        echo "2895ca9923d5b2a884515acded75d3b4f74d36eea703b92f6bff9a88b5b7ccc8  $d/runtime_arm_guest.py" | sha256sum -c -
        printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$d/public/producer.json"
        test "$(cat .bazelversion)" = 9.3.1
        grep -Fx 'bazel_dep(name = "llvm", version = "0.8.24")' MODULE.bazel
        test "$(uname -m)" = x86_64
        curl --retry 3 --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
        echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
        chmod 755 "$d/bazel"
        test "$("$d/bazel" --version)" = 'bazel 9.3.1'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: master-llvm-arm-handoff
        run-id: 42092960755
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/runtime-cross/original
    - name: Cross-build only the released-musl ARM prewarmer
      run: |
        env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" USE_BAZEL_VERSION=9.3.1 \
          CARRIER_SHA="$GITHUB_SHA" QUALIFICATION_RUN_ID="$GITHUB_RUN_ID" \
          python3 -B "$RUNNER_TEMP/runtime-cross/runtime_arm_guest.py" producer
    - name: Validate the exact handoff and bounded producer receipt
      id: receipt
      if: always()
      run: |
        python3 -B - <<'PYTHON'
        import hashlib, json, os, re, tarfile
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP']) / 'runtime-cross/public'
        p = root / 'producer.json'
        assert p.is_file() and not p.is_symlink() and 0 < p.stat().st_size < 524288
        raw = p.read_bytes()
        doc = json.loads(raw)
        assert doc['status'] in ('PASS', 'FAIL', 'INCOMPLETE')
        assert not re.search(rb'(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}', raw)
        assert {p.name for p in root.iterdir()} <= {'producer.json', 'payload.tar.gz'}
        if doc['status'] == 'PASS':
            archive = root / 'payload.tar.gz'
            assert archive.is_file() and not archive.is_symlink() and archive.stat().st_size < 64000000
            assert archive.stat().st_size == doc['archive']['bytes']
            assert hashlib.sha256(archive.read_bytes()).hexdigest() == doc['archive']['sha256']
            with tarfile.open(archive) as tar:
                members = tar.getmembers()
                assert len(members) == 4 and {m.name for m in members} == {'runsc', 'gvisor-bin/gvisor_sentry', 'gvisor-bin/gvisor-sentry-prewarmer', 'busybox'}
                for member in members:
                    assert member.isfile() and member.size == doc['payload'][member.name]['bytes']
                    assert hashlib.sha256(tar.extractfile(member).read()).hexdigest() == doc['payload'][member.name]['sha256']
        PYTHON
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.receipt.outcome == 'success'
      with:
        name: master-llvm-musl-arm-producer
        path: ${{ runner.temp }}/runtime-cross/public/producer.json
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: master-llvm-musl-arm-handoff
        path: |-
          ${{ runner.temp }}/runtime-cross/public/producer.json
          ${{ runner.temp }}/runtime-cross/public/payload.tar.gz
        if-no-files-found: error
        retention-days: 1
    - name: Stop the native Bazel server
      if: always()
      run: |
        d="$RUNNER_TEMP/runtime-cross"
        if test -x "$d/bazel"; then timeout -k 5 30 "$d/bazel" shutdown >/dev/null 2>&1 || true; fi
  consumer:
    needs: producer
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: master-llvm-musl-arm-handoff
        path: ${{ runner.temp }}/runtime-cross/handoff
    - name: Bind the native-only consumer
      run: |
        set -eu
        umask 077
        d="$RUNNER_TEMP/runtime-cross"
        mkdir "$d/public"
        cp test/rbe/native_cross_inputs.py test/rbe/runtime_cross.py test/rbe/runtime_guest.py test/rbe/runtime_arm_guest.py "$d/"
        echo "b0626fb5ecb5bb9c41d644ced5af036019cbefbeef7975c71878021f6e146653  $d/native_cross_inputs.py" | sha256sum -c -
        echo "e0fde0e7bed53e1dc2d9c2a57b1e82fe01d4f0a48aa3e926c323afc49eee0a0c  $d/runtime_cross.py" | sha256sum -c -
        echo "8097f1d366ff1f8dea752e505385cea5f5f041e64af924520de5134384a35e69  $d/runtime_guest.py" | sha256sum -c -
        echo "2895ca9923d5b2a884515acded75d3b4f74d36eea703b92f6bff9a88b5b7ccc8  $d/runtime_arm_guest.py" | sha256sum -c -
        printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$d/public/consumer.json"
        test "$(uname -m)" = aarch64
    - name: Verify received bytes and boot the ARM guest without rebuilding
      run: |
        env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" \
          CARRIER_SHA="$GITHUB_SHA" QUALIFICATION_RUN_ID="$GITHUB_RUN_ID" \
          python3 -B "$RUNNER_TEMP/runtime-cross/runtime_arm_guest.py" consumer
    - name: Check the native receipt boundary
      id: receipt
      if: always()
      run: |
        python3 -B - <<'PYTHON'
        import json, os, re
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP']) / 'runtime-cross/public'
        assert {p.name for p in root.iterdir()} == {'consumer.json'}
        p = root / 'consumer.json'
        assert p.is_file() and not p.is_symlink() and 0 < p.stat().st_size < 65536
        raw = p.read_bytes()
        assert json.loads(raw)['status'] in ('PASS', 'FAIL', 'INCOMPLETE')
        assert not re.search(rb'(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}', raw)
        PYTHON
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.receipt.outcome == 'success'
      with:
        name: master-llvm-musl-arm-native-guest
        path: ${{ runner.temp }}/runtime-cross/public/consumer.json
        if-no-files-found: error
