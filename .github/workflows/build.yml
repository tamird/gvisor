name: Inspect RACK repairs before the second timeout
on:
  push:
    branches: [qualification/rack-cursor-manual-clock]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 52
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: 5a65fe1f080fe147c9f1064f640632ec624c470a
      MASTER: 2d59045da5c29f2f6bc62dacd9457591367c9498
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        echo '{"verified":false,"reason":"qualification incomplete"}' > "$RUNNER_TEMP/records/verdict.json"
        cp test/rbe/rack-fresh-head.py test/rbe/rack-fresh-head.go.txt "$RUNNER_TEMP/"
        git fetch -q --depth=3 https://github.com/tamird/gvisor.git "$PRODUCT" "$MASTER"
        test "$(git rev-parse "$PRODUCT^")" = 0ceccc80ef7bdaa7338e348f0a2c2b0182188ab2
        test "$(git rev-parse "$PRODUCT^^")" = "$MASTER"
        test "$(git diff --name-only "$MASTER" "$PRODUCT^")" = test/packetimpact/tests/tcp_rack_test.go
        test "$(git diff --name-only "$PRODUCT^" "$PRODUCT")" = pkg/tcpip/transport/tcp/rack.go
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","network-enable-ipv6":"true","EstimatedMemory":"8GB","test.EstimatedMemory":"2GB","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        mkdir -p "$RUNNER_TEMP/gnu-home"
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        test "$USE_BAZEL_VERSION" = 8.8.1
        docker run --init -d --name tcp-compiler --entrypoint /bin/sleep --user "$(id -u):$(id -g)" -e HOME="$RUNNER_TEMP/gnu-home" -e USER="$(id -un)" -e USE_BAZEL_VERSION="$USE_BAZEL_VERSION" --sysctl net.ipv6.conf.lo.disable_ipv6=0 -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" infinity
        if [[ $(docker exec tcp-compiler /usr/local/bin/bazel --version) != "bazel $USE_BAZEL_VERSION" ]]; then
          binary=bazel-$USE_BAZEL_VERSION-linux-x86_64; base=https://releases.bazel.build/$USE_BAZEL_VERSION/release
          for f in "$binary" "$binary.sha256"; do curl -fsSL --retry 3 "$base/$f" -o "$RUNNER_TEMP/$f"; done
          (cd "$RUNNER_TEMP" && sha256sum -c "$binary.sha256")
          chmod 0755 "$RUNNER_TEMP/$binary"
          docker cp "$RUNNER_TEMP/$binary" tcp-compiler:/usr/local/bin/bazel
        fi
        docker exec tcp-compiler /usr/local/bin/bazel --version > "$RUNNER_TEMP/records/bazel"
        test "$(cat "$RUNNER_TEMP/records/bazel")" = "bazel $USE_BAZEL_VERSION"
        test "$(docker exec tcp-compiler id -un)" = "$(id -un)"
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
    - name: Record immediate and timer-triggered packets on the two sources
      run: |
        set -euo pipefail
        runarm() {
          arm=$1; source=$2; target=$3; filter=$4; limit=$5
          d="$RUNNER_TEMP/records/$arm"; mkdir -p "$d"
          git checkout --quiet --detach "$source"
          [[ "$(git rev-parse HEAD)" == "$source" ]]
          printf '%s\n' "$source" > "$d/head"
          opts=()
          cat "$RUNNER_TEMP/rack-fresh-head.go.txt" >> pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test.go
          test "$(git diff --name-only)" = pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test.go
          opts+=(--test_arg=-test.v)
          if [[ -n "$filter" ]]; then opts+=("--test_filter=$filter"); fi
          read -r -a labels <<< "$target"
          code=0
          timeout --kill-after=10s "$limit" docker exec tcp-compiler /usr/local/bin/bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=100 --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --strategy=TestRunner=remote --nocache_test_results --flaky_test_attempts=1 --keep_going --test_sharding_strategy=disabled --test_output=errors --test_timeout=400 --test_env=GO_TEST_WRAP_TESTV=1 --build_event_json_file="$RUNNER_TEMP/$arm.bep" "${opts[@]}" "${labels[@]}" > "$d/log" 2>&1 || code=$?
          printf '%s\n' "$code" > "$d/exit"
          printf '%s\n' "${labels[@]}" > "$d/labels"
          for label in "${labels[@]}"; do
            path=${label#//}; key=${label##*:}; mkdir -p "$d/$key"
            for file in test.log test.xml; do
              docker exec tcp-compiler cat "bazel-testlogs/${path/:/\/}/$file" > "$d/$key/$file" || true
            done
          done
          git restore --source="$source" -- pkg/tcpip/transport/tcp/test/e2e/tcp_rack_test.go
        }
        for pair in "master-clock:$MASTER" "fixed-clock:$PRODUCT"; do
          runarm "${pair%%:*}" "${pair#*:}" //pkg/tcpip/transport/tcp/test/e2e:tcp_rack_test '^TestRACKFreshHead$/^(fresh-new-sack|fresh-reorder-timer)$' 20m
        done
        date -u --iso-8601=ns > "$RUNNER_TEMP/records/finished"
    - name: Verify the original packet and owner results
      if: always()
      run: python3 "$RUNNER_TEMP/rack-fresh-head.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: rack-cursor-before-second-rto
        path: ${{ runner.temp }}/records/verdict.json
        if-no-files-found: error
