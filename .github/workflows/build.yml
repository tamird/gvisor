name: Run the finite static filter corpus on both native workers
on:
  push:
    branches: [qualification/paired-rbe-static-filter-corpus]
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Stage the existing pinned coordinator tools and reviewed reader
        run: |
          set -eu
          umask 077
          task="$RUNNER_TEMP/release-rbe"
          mkdir -p "$task/bin" "$task/public" "$task/harness"
          cp test/rbe/release_prewarmer/{BUILD,full.py,qualify.py,image_inventory.py,native_artifacts.py} "$task/harness/"
          cd "$task/harness"
          sha256sum --check <<'SUMS'
          ae1f23a11f3cb747fbec49a34c510c5ab9dcb75d06d94bfd4d9a49d50c629271  BUILD
          1c1fad0a17f68f0787db3ee4d371622561a8b272b891d65c02cdcdc4f34cf76b  full.py
          67ac7e13ab62fa83e78ffa3fc3fcde1f1179e62df7162d20858ff8b16fdd4ad3  qualify.py
          a61838c5c848386f2dd0b9abc82cd502ff6031040e94e91f5b2da204ed9e5bfe  image_inventory.py
          0e4302fffe7c3fbb27b001573d91c2451eae62e20822cfbda09c32342aaa7d02  native_artifacts.py
          SUMS
          reporter=c7606e0bf9b6cc89bfaaad56bd9e294e411f3f45
          for name in qualification_report unit_matrix; do
            curl --proto '=https' --fail --silent --show-error --max-time 90 "https://raw.githubusercontent.com/tamird/gvisor/$reporter/test/rbe/$name.py" -o "$name.py"
          done
          test "$(git hash-object --no-filters qualification_report.py)" = c2303e17753a1e836a5a254fbb0d0bd1fb07f854
          test "$(git hash-object --no-filters unit_matrix.py)" = d01d9e319084e18ea2928671e417e1b4e86c4954
          curl --location --fail --silent --show-error --proto '=https' --proto-redir '=https' --max-time 90 https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 -o "$task/bb"
          echo "205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  $task/bb" | sha256sum -c -
          chmod 755 "$task/bb"
          echo "$task/bin" >> "$GITHUB_PATH"
          echo "REAL_BAZEL=$task/bin/bazel" >> "$GITHUB_ENV"
          echo 'PYTHONDONTWRITEBYTECODE=1' >> "$GITHUB_ENV"
      - name: Reuse the already qualified static-wrapper Bazel supplier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          task="$RUNNER_TEMP/release-rbe"
          gh api repos/tamird/gvisor/actions/artifacts/13078732581/zip > "$task/supplier.zip"
          gh api repos/tamird/gvisor/actions/artifacts/13415219314/zip > "$task/original.zip"
          gh api repos/tamird/gvisor/actions/artifacts/13413349620/zip > "$task/wrapper-ledger.zip"
          gh api repos/tamird/gvisor/actions/artifacts/13100242102/zip > "$task/images.zip"
          unset GH_TOKEN
          echo "993e832b8f926876f2b935e97af3cc50493a507e79ed80d1da32309f00e94619  $task/supplier.zip" | sha256sum -c -
          python3 - <<'PYTHON'
          import hashlib, os, json, zipfile
          from pathlib import Path
          task = Path(os.environ["RUNNER_TEMP"]) / "release-rbe"
          with zipfile.ZipFile(task / "supplier.zip") as bundle:
              item = json.loads(bundle.read("native-package-evidence/supplier.json"))
              assert item["status"] == "PASS" and item["source"] == "c2f5f79dce24877679cede14b85666b7ca65c6de"
              binary = bundle.read("bazel-candidate")
          assert hashlib.sha256(binary).hexdigest() == item["binary_sha256"] == "556164c2874fc66cdac3a32b53f862e705e9b9643c0ad3dea12880c97687d250"
          client = task / "bin" / "bazel"
          client.write_bytes(binary)
          client.chmod(0o755)
          PYTHON
      - name: Bind the product and retain only the reviewed platform declarations
        env: {PRODUCT: 13e82a5acb56321ee2f60e0b6cd65c35ca0a8d1c}
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git rev-parse HEAD^^)" = f35d725669ae45e7617cf66e7ceee2f0f6307490
          test "$(git rev-parse HEAD^:test/secfuzz)" = b376aa2a0ee7e23737f4b25ad6e1b0caaf00355b
          test "$(git rev-parse HEAD^:runsc/boot/filter/filter_fuzz_test.go)" = f30eb5c4cb44ac9ea3b5e016be24ae91f2d0b1db
          test "$(git rev-parse HEAD^:tools/rules_go_bootstrap_shell.patch)" = 033fde5646ef43acaecae9b033ec8f867200e8c1
          git checkout --detach "$PRODUCT"
          mkdir test/rbe/release_prewarmer
          cp "$RUNNER_TEMP"/release-rbe/harness/BUILD test/rbe/release_prewarmer/
          test "$(git hash-object test/rbe/release_prewarmer/BUILD)" = 0942c3a1b2856d6b31866ec8bb60e280ba38a011
          test -z "$(git diff --name-only HEAD)"
          test "$(git rev-parse HEAD:runsc)" = 3100c9e41c8a1d999a27ed3ddde213b7d91ea069
          test "$(cat .bazelversion)" = 9.3.1
          bazel --version
          bazel --ignore_all_rc_files help test > "$RUNNER_TEMP/release-rbe/help.txt"
          grep -q 'incompatible_use_native_posix_test_wrapper' "$RUNNER_TEMP/release-rbe/help.txt"
      - name: Configure the trusted Bazel client for remote-only execution
        id: remote
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          test -n "$BUILDBUDDY_API_KEY"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --modify_execution_info=^TestRunner$=+no-remote-cache'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/release-rbe/private.bazelrc"
          test "$(stat -c %a "$RUNNER_TEMP/release-rbe/private.bazelrc")" = 600
          unset BUILDBUDDY_API_KEY
      - name: Run the finite static filter corpus on native AMD64
        timeout-minutes: 20
        run: python3 "$RUNNER_TEMP/release-rbe/harness/full.py" amd64
      - name: Run the finite static filter corpus on native ARM64
        if: always() && !cancelled() && steps.remote.outcome == 'success'
        timeout-minutes: 20
        run: python3 "$RUNNER_TEMP/release-rbe/harness/full.py" arm64
      - name: Reconcile the per-architecture named test results
        if: always() && !cancelled()
        run: python3 "$RUNNER_TEMP/release-rbe/harness/full.py" verdict
      - name: Stop the client and remove its private configuration
        if: always()
        run: |
          if test -x "$RUNNER_TEMP/release-rbe/bin/bazel"; then
            timeout --signal=INT --kill-after=10 30 "$RUNNER_TEMP/release-rbe/bin/bazel" --nosystem_rc --nohome_rc shutdown >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/release-rbe/private.bazelrc"
      - name: Verify the bounded typed public receipts
        id: privacy
        if: always()
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "release-rbe" / "public"
          allowed = {"amd64.json", "arm64.json", "verdict.json"}
          files = list(root.iterdir())
          key = os.environ["ACCESS"].encode()
          assert key and files
          assert not (root.parent / "private.bazelrc").exists()
          for path in files:
              assert path.name in allowed and path.is_file() and not path.is_symlink()
              assert path.stat().st_size <= 64 * 1024
              raw = path.read_bytes()
              assert isinstance(json.loads(raw), dict)
              assert not any(value in raw for value in (key, b"remote_header", b"bes_header", b"Authorization:", b"X-Amz-Signature", b"Bearer "))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: paired-static-filter-corpus
          path: ${{ runner.temp }}/release-rbe/public/*.json
          if-no-files-found: error
          retention-days: 14
