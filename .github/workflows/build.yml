name: Measure deferred graph decoding on valid Save output
on:
  push:
    branches: [qualification/state-deferred-chain]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STOCK: aa767e4c43d011121271551fe24da501a56f729d
      PRODUCT: 8fa8b12e9c28e33664b73d199656ed1a5eae9258
      OWNER: //pkg/state:state_test
      CASE: TestGraphDeferredPasses
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 3, persist-credentials: false}
    - name: Run the interior-reference graph and its controls on native GNU Linux
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        profile=0ee70efe6d52576b8f173b40ad6b7ac117da3b72
        reporter=599cb05aecfb107e07f81b8591a009cb12d6ffa7
        git fetch -q --no-tags --depth=1 origin "$profile" "$reporter"
        test "$(git rev-parse HEAD^)" = "$PRODUCT"
        test "$(git rev-parse "$PRODUCT^")" = "$STOCK"
        test "$(git diff --name-only "$STOCK" "$PRODUCT")" = "$(printf '%s\n' pkg/state/graph_decode_callbacks{_test,_unsafe}.go)"
        mkdir -p "$RUNNER_TEMP/proof" "$RUNNER_TEMP/gnu-platform"
        echo '{"verdict":"INCOMPLETE"}' > "$RUNNER_TEMP/proof/verdict.json"
        cp test/rbe/state_deferred_scan.py "$RUNNER_TEMP/"
        for file in BUILD.bazel MODULE.bazel; do
          git show "$profile:test/rbe/gnu_platform/$file" > "$RUNNER_TEMP/gnu-platform/$file"
        done
        for mod in qualification_report unit_matrix; do
          git show "$reporter:test/rbe/$mod.py" > "$RUNNER_TEMP/$mod.py"
        done
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=state_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@state_gnu//:gnu' 'build --host_platform=@state_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/state.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --init --name state-compiler --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        git checkout --quiet --detach "$PRODUCT"
        git diff --quiet HEAD --
        d=$RUNNER_TEMP/graph; mkdir "$d"
        git rev-parse HEAD > "$d/source"
        date -u +%FT%T.%3NZ > "$d/start"
        rc=0
        timeout -k 10s 14m docker exec state-compiler bazel --bazelrc="$RUNNER_TEMP/state.bazelrc" test --config=x86_64 --jobs=48 --strategy=TestRunner=remote --nocache_test_results --test_sharding_strategy=disabled --test_output=errors --test_timeout=240 --test_env=GO_TEST_WRAP_TESTV=1 --test_filter="^${CASE}$" --build_event_json_file="$d/bep" "$OWNER" > "$d/build.log" 2>&1 || rc=$?
        echo "$rc" > "$d/exit"
        date -u +%FT%T.%3NZ > "$d/finish"
        for suffix in xml log; do
          docker exec state-compiler cat "bazel-testlogs/pkg/state/state_test/test.$suffix" > "$RUNNER_TEMP/proof/test.$suffix" || true
        done
        git diff --quiet HEAD --
        python3 -B "$RUNNER_TEMP/state_deferred_scan.py"
    - name: Check the original artifact allowlist
      id: privacy
      if: always()
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"]) / "proof"
        key = os.environ["BUILDBUDDY_API_KEY"].encode()
        files = list(root.iterdir())
        assert key and files and {f.name for f in files} <= {"verdict.json", "test.xml", "test.log"}
        for f in files:
            assert f.is_file() and not f.is_symlink()
            body = f.read_bytes()
            assert key not in body and b"x-buildbuddy-api-key" not in body.lower()
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.privacy.outcome == 'success'
      with:
        name: state-deferred-chain
        path: ${{ runner.temp }}/proof/
        if-no-files-found: error
