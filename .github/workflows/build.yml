name: Verify TCP keepalive timeout precedence
on:
  push:
    branches: [qualification/tcp-keepalive-timeout-run]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.ref == 'refs/heads/qualification/tcp-keepalive-timeout-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 5
        persist-credentials: false
    - name: Run identical keepalive socket calls against Linux, stock, and fixed gVisor
      id: compare
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD^1)" = "3ff83e1a9fe9271ef72ae815ef4bed5fc1e7a040"
        mkdir -p "$RUNNER_TEMP/checker"
        for file in qualify.sh unit_matrix.py qualification_report.py tcp_long_replay.py; do
          cp "test/rbe/$file" "$RUNNER_TEMP/checker/$file"
        done
        python3 -m py_compile "$RUNNER_TEMP/checker/"*.py
        mkdir -p "$RUNNER_TEMP/fifo_platform" "$RUNNER_TEMP/fifo"
        platform=$RUNNER_TEMP/fifo_platform
        printf '%s\n' 'module(name="fifo_platform")' > "$platform/MODULE.bazel"
        cat > "$platform/BUILD" <<'BUILD'
        platform(
            name = "ubuntu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {
                "Arch": "amd64",
                "OSFamily": "linux",
                "workload-isolation-type": "firecracker",
                "network-enable-ipv6": "true",
                "EstimatedMemory": "8GB",
                "test.EstimatedMemory": "2GB",
                "container-image": "docker://gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a",
            },
            visibility = ["//visibility:public"],
        )
        BUILD
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        # Configure the native C/C++ toolchain with the same compiler and
        # builtin headers that execute the actions on remote workers.
        image=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
        mkdir -p "$RUNNER_TEMP/gnu-home"
        docker run -d --name gnu-coordinator --entrypoint /bin/sleep \
          --user "$(id -u):$(id -g)" -e HOME="$RUNNER_TEMP/gnu-home" -e USE_BAZEL_VERSION \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
          -w "$GITHUB_WORKSPACE" "$image" infinity
        docker exec gnu-coordinator gcc -print-file-name=include
        if [[ $(docker exec gnu-coordinator /usr/local/bin/bazel --version) != "bazel $USE_BAZEL_VERSION" ]]; then
          binary=bazel-${USE_BAZEL_VERSION}-linux-x86_64
          base=https://releases.bazel.build/${USE_BAZEL_VERSION}/release
          curl -fsSL --retry 3 "$base/$binary" -o "$RUNNER_TEMP/$binary"
          curl -fsSL --retry 3 "$base/$binary.sha256" -o "$RUNNER_TEMP/$binary.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$binary.sha256")
          chmod +x "$RUNNER_TEMP/$binary"
          docker cp "$RUNNER_TEMP/$binary" gnu-coordinator:/usr/local/bin/bazel
        fi
        test "$(docker exec gnu-coordinator /usr/local/bin/bazel --version)" = "bazel $USE_BAZEL_VERSION"
        rc=$RUNNER_TEMP/fifo.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
            'build --remote_cache=grpcs://remote.buildbuddy.io' \
            'build --bes_backend=grpcs://remote.buildbuddy.io' \
            'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
            'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
            'build --remote_accept_cached' \
            "build --inject_repository=fifo_platform=$platform" \
            'build --host_platform=@fifo_platform//:ubuntu' \
            'build --extra_execution_platforms=@fifo_platform//:ubuntu' \
            'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$rc"
        unset BUILDBUDDY_API_KEY
        printf '%s\n' 'build:rbe --spawn_strategy=remote' >> "$rc"
        export FIFO_RC=$rc
        mkdir -p "$RUNNER_TEMP/fifo-bin"
        cat > "$RUNNER_TEMP/fifo-bin/bazel" <<'SH'
        #!/bin/sh
        case "$1" in
          test)
            # Capture the actual argv and Bazel exit, independent of the qualifier's exit.
            printf '%s\n' "$@" > "$TCP_EVIDENCE/executed_arguments"
            status=0
            docker exec gnu-coordinator /usr/local/bin/bazel --bazelrc="$FIFO_RC" "$@" || status=$?
            printf '%s\n' "$status" > "$TCP_EVIDENCE/native_exit"
            date -u '+%Y-%m-%dT%H:%M:%S.%3N+00:00' > "$TCP_EVIDENCE/finished"
            exit "$status"
            ;;
        esac
        exec docker exec gnu-coordinator /usr/local/bin/bazel --bazelrc="$FIFO_RC" "$@"
        SH
        chmod +x "$RUNNER_TEMP/fifo-bin/bazel"
        export PATH="$RUNNER_TEMP/fifo-bin:$PATH"
        overall=0
        mkdir -p "$RUNNER_TEMP/replay-private" "$RUNNER_TEMP/replay-public"
        parent=5b317311427fabfc62ffeca7d76b1622ff83f7b4
        for arm in linux stock fixed; do
          source=45992520240fce3ce2ccc0297017dd87325de327
          platform=netstack
          if [[ $arm == linux ]]; then platform=native; fi
          if [[ $arm == fixed ]]; then source=ef6c8ba9088f877764d5b2b6151108f713c1f1db; fi
          label="//test/packetimpact/tests:tcp_user_timeout_${platform}_test"
          if ! git cat-file -e "$source^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=2 "https://github.com/$GITHUB_REPOSITORY.git" "$source"
          fi
          git checkout --quiet --detach "$source"
          test "$(git rev-parse HEAD)" = "$source"
          test "$(git rev-parse HEAD^)" = "$parent"
          case "$arm" in
            fixed) git diff --quiet "$parent" "$source" -- . ':(exclude)test/packetimpact/tests/tcp_user_timeout_test.go' ':(exclude)pkg/tcpip/transport/tcp/connect.go';;
            *) git diff --quiet "$parent" "$source" -- . ':(exclude)test/packetimpact/tests/tcp_user_timeout_test.go';;
          esac
          test "$(git rev-parse HEAD:test/packetimpact/tests/tcp_user_timeout_test.go)" = "29fa0ba53c5a2356b1d47a6ab7022fbaa24b8113"
          export TCP_EVIDENCE="$RUNNER_TEMP/replay-private/$arm"
          mkdir -p "$TCP_EVIDENCE" test/rbe
          cp "$RUNNER_TEMP/checker/qualify.sh" "$RUNNER_TEMP/checker/unit_matrix.py" test/rbe/
          git status --porcelain --untracked-files=no > "$TCP_EVIDENCE/source_before"
          test ! -s "$TCP_EVIDENCE/source_before"
          git cat-file commit HEAD > "$TCP_EVIDENCE/commit_file"
          raw="$RUNNER_TEMP/replay-private/$arm.raw.jsonl"
          code=0
          bash test/rbe/qualify.sh --arch=amd64 "--test-target=$label" \
            "--bazel-option=--build_event_json_file=$raw" --bazel-option=--build_event_json_file_path_conversion=false \
            --bazel-option=--nokeep_going --bazel-option=--test_timeout=240 --bazel-option=--test_filter=TestKeepaliveUserTimeout --bazel-option=--test_sharding_strategy=disabled --bazel-option=--cache_test_results=no \
            --bazel-option=--remote_download_outputs=toplevel '--bazel-option=--remote_download_regex=.*[/]test[.](log|xml)$' test || code=$?
          printf '%s\n' "$code" > "$TCP_EVIDENCE/runner_exit"
          git rev-parse HEAD > "$TCP_EVIDENCE/final_head"
          git status --porcelain --untracked-files=no > "$TCP_EVIDENCE/source_after"
          python3 -B "$RUNNER_TEMP/checker/tcp_long_replay.py" "$TCP_EVIDENCE" "$arm" "$source" "$label" "$raw" "$RUNNER_TEMP/replay-public" || overall=1
          # If the common target cannot compile, repeating three builds cannot add measurements.
          if [[ $code != 0 ]] && { [[ ! -s $raw ]] || ! grep -q '"testResult":' "$raw"; }; then break; fi
        done
        exit "$overall"
    - name: Record completed and missing comparisons
      if: always()
      env:
        COMPARE_OUTCOME: ${{ steps.compare.outcome }}
      run: |
        python3 - "$RUNNER_TEMP/replay-public" <<'PYRESULT'
        import json, os, sys
        from pathlib import Path
        root = Path(sys.argv[1])
        root.mkdir(exist_ok=True)
        arms = ["linux", "stock", "fixed"]
        verdicts = {a: json.loads((root / (a + ".json")).read_text()) for a in arms if (root / (a + ".json")).is_file()}
        missing = [a for a in arms if a not in verdicts]
        outcome = os.environ["COMPARE_OUTCOME"]
        status = "INCOMPLETE" if missing else "PASS" if outcome == "success" and all(v["matches_expectation"] for v in verdicts.values()) else "FAIL"
        result = {"source":os.environ["GITHUB_SHA"],"compare_outcome":outcome,"expected":arms,"executed":list(verdicts),"missing":missing,"status":status}
        (root / "summary.json").write_text(json.dumps(result, indent=2) + "\n")
        print(result)
        sys.exit(result["status"] != "PASS")
        PYRESULT
    - name: Check the public reports
      id: scan
      if: always()
      env:
        TOKEN_TO_EXCLUDE: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYSCAN'
        import os
        from pathlib import Path
        for path in (Path(os.environ['RUNNER_TEMP'])/'replay-public').glob('*.json'):
            data = path.read_bytes()
            assert not any(s and s in data for s in (os.environ['TOKEN_TO_EXCLUDE'].encode(), b'--remote_header', b'--bes_header', b'authorization:'))
        PYSCAN
    - name: Save only the typed results
      if: ${{ always() && steps.scan.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: tcp-keepalive-timeout
        path: ${{ runner.temp }}/replay-public/*.json
        if-no-files-found: error
