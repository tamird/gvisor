name: Check disk reservation and recycled-page clearing
on:
  push:
    branches: [qualification/pgalloc-recycled-reservation-and-clear]
permissions: {}
jobs:
  allocator:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Bind the two published parents and the original Linux client
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5b93713ad84c447295cc721d3b1af28eb5416427
          test "$(git rev-parse HEAD^1^1)" = bf2f967e3f9c8c9c1bf73783e97a4530329f07d8
          test "$(git rev-parse HEAD^1^2)" = 61470ea4162137e6871edd94e369f1c03592c163
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/pgalloc_combined.py'
          test "$(uname -m)" = x86_64
          test "$(cat .bazelversion)" = 9.3.1
          work="$RUNNER_TEMP/pgalloc-combined"
          mkdir -m 700 "$work"
          cp .github/qualification/pgalloc_combined.py "$work/"
          if ! test -x /usr/bin/strace; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -qq -y --no-install-recommends strace
          fi
          cd "$work"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel' | sha256sum -c
          chmod 700 bazel
      - name: Run original suites and compare allocation results
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$RUNNER_TEMP/pgalloc-combined/pgalloc_combined.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: recycled-disk-reservation
          path: ${{ runner.temp }}/pgalloc-combined/result.json
          if-no-files-found: error
          retention-days: 14
