name: Recover the original checkpoint benchmark action
on:
  push:
    branches: [qualification/encoder-sizing-original]
permissions:
  contents: read
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Read the original invocation's errors
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          test "$(git rev-parse HEAD^)" = 47984e47f5db61a23cb3f019d5478c0a605cca18
          python3 -I -B .github/qualification/sizing_original.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-benchmark-original-error
          path: ${{ runner.temp }}/sizing-original.json
          if-no-files-found: error
          retention-days: 3
