name: Qualify IPv6 multicast interface selection with only a device binding
on:
  push:
    branches: [qualification/multicast-device-review]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: 57e1cc6e6e2870121448f849cd3fd3b00c9805a8
      STOCK: 2701cf3f94ed9f254ff4af68f1c997bdc0df54da
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        cp test/rbe/multicast-device-result.py "$RUNNER_TEMP/multicast-device-result.py"
        [[ "$(git rev-parse HEAD^1)" == "$CURRENT" ]]
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        git fetch --no-tags --depth=1 origin "$STOCK"
        if [[ ! -c /dev/net/tun ]]; then sudo mkdir -p /dev/net; sudo mknod /dev/net/tun c 10 200; fi
        sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0
        sudo modprobe dummy || true
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --device /dev/net/tun --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Run blocking and nonblocking sockets on the kernel, the guest and the targeted mutation
      run: |
        set -euo pipefail
        for name in native fixed control; do
          src=$CURRENT; tests=(socket_ipv6_udp_unbound_external_networking_test); executor=local; platform=runsc_systrap_sandboxnet_directfs
          if [[ "$name" == control ]]; then src=$STOCK; fi
          if [[ "$name" == native ]]; then platform=native; fi
          filter='IPv6UDPUnboundSockets/IPv6UDPUnboundExternalNetworkingSocketTest.TestIPv6MulticastIf/*'
          git checkout --quiet --detach "$src"; [[ "$(git rev-parse HEAD)" == "$src" ]]
          d=$RUNNER_TEMP/records/$name; mkdir -p "$d"
          git rev-parse HEAD >"$d/source"
          sha256sum test/syscalls/linux/socket_ipv6_udp_unbound_external_networking.cc >"$d/fixture"
          sha256sum pkg/tcpip/transport/internal/network/endpoint.go >"$d/product"
          printf '%s\n' "$executor" > "$d/executor"; printf '%s\n' "$filter" > "$d/filter"
          args=(); for test in "${tests[@]}"; do args+=("//test/syscalls:${test}_${platform}"); done
          printf '%s\n' "${args[@]}" >"$d/targets"
          date -u +%FT%TZ >"$d/start"; rc=0
          docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=24 --keep_going --nobuild_event_json_file_path_conversion --verbose_failures --strategy=TestRunner="$executor" --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=all --test_timeout=600 --test_sharding_strategy=disabled --test_env=GTEST_FILTER="$filter" "${args[@]}" > "$d/bazel.log" 2>&1 || rc=$?
          date -u +%FT%TZ >"$d/end"; printf '%s\n' "$rc" > "$d/exit"
          grep -A5 -E 'Invocation ID:|ERROR:|error:|FAILED|Build did NOT complete' "$d/bazel.log" | head -150 > "$d/compiler-diagnostics" || :
          rm -f "$d/bazel.log"
          if [[ "$rc" != 0 && "$rc" != 3 ]]; then continue; fi
          for test in "${tests[@]}"; do
            mkdir -p "$d/$test"
            for file in test.log test.xml; do
              docker exec tcp-compiler cat "bazel-testlogs/test/syscalls/${test}_${platform}/$file" > "$d/$test/$file" || rm -f "$d/$test/$file"
            done
          done
        done
    - name: Verify both exact syscall cases and the device-only negative control
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/multicast-device-result.py" "$RUNNER_TEMP/records"
    - name: Redact credentials from the evidence bundle
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key=os.environ["BB_KEY"].encode()
        for f in (Path(os.environ["RUNNER_TEMP"])/"records").rglob("*"):
            if f.is_file() and key and key in (data:=f.read_bytes()):
                f.write_bytes(data.replace(key,b"[REDACTED]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: multicast-device-results
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
