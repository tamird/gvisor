name: Trace five sender loss decisions on a shared WAN
on:
  push:
    branches: [qualification/tcp-cubic-recovery-events]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/tcp-cubic-recovery-events'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Build one proxy and run the fixed matched schedule
        run: bash test/benchmarks/tcp/current-shared-driver.sh
      - name: Reconcile receiver bytes, settings and packet observations
        if: always()
        run: python3 test/benchmarks/tcp/current-shared-report.py
      - name: Publish the existing synthetic WAN evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcp-cubic-recovery-events
          path: ${{ runner.temp }}/tcp-public/
          if-no-files-found: error
