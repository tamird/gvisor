name: Reconcile the original TCP output queue assertions
on:
  push:
    branches: [qualification/tcp-output-queue-original-results]
permissions: {actions: read, contents: read}
jobs:
  verify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Get one original verdict without running the tests again
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41256062589 --repo tamird/gvisor --name tcp-output-queue-compare --dir "$RUNNER_TEMP/original"
      - name: Check the ABI errno and both positive observations
        run: python3 test/rbe/tcp-outq-original.py "$RUNNER_TEMP/original/verdict.json" test/rbe/tcp-outq-source.json "$RUNNER_TEMP/reconciled.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: original-output-queue-verdict, path: "${{ runner.temp }}/reconciled.json", if-no-files-found: error}
