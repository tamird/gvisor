name: Reconcile retained TUN qualification reports
on:
  push:
    branches: [qualification/tun-persistence-verdict]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false}
    - name: Recover the original reports from the one execution job
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api repos/tamird/gvisor/actions/artifacts/13009345520/zip > "$RUNNER_TEMP/evidence.zip"
        mkdir -p "$RUNNER_TEMP/records"
        unzip -q "$RUNNER_TEMP/evidence.zip" -d "$RUNNER_TEMP/records"
        cp "$RUNNER_TEMP/records/verdict.json" "$RUNNER_TEMP/records/original-verdict.json"
    - name: Verify the source, ioctl values and errno, endpoint lifetime, and analyzer
      run: python3 test/rbe/tun-persist-verdict.py "$RUNNER_TEMP/records"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: tun-persistence-verified
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
