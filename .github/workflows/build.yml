name: Check the registry c-ares in packetimpact
on:
  push:
    branches: [qualification/cares-registry-packetimpact-consumer]
permissions: {}
jobs:
  consumer:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 160
    steps:
      - name: Bind the public parent, dependency requirement and cross compiler
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/cares-consumer"
          mkdir -p "$w"/{src,bin,out}
          cd "$w/src"
          git init -q
          git -c gc.auto=0 fetch --depth=3 -q https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          base=fb9ee22abe02f61549755018afd2c124e55eea98
          fix=ca5436ed33fd2bc67dba510a4ecf730d972448fc
          test "$(git rev-parse "$GITHUB_SHA^")" = "$fix"
          test "$(git rev-parse "$fix^")" = "$base"
          git diff --exit-code "$base" "$fix" -- . ':!MODULE.bazel'
          git diff --exit-code "$fix" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!.github/qualification/cares_consumer.py' ':!test/packetimpact/cares_qualification'
          git show "$GITHUB_SHA:.github/qualification/cares_consumer.py" > "$w/cares_consumer.py"
          git checkout -q --detach "$base"
          test "$(cat .bazelversion)" = 9.3.1
          sudo -n apt-get -qq update
          sudo -n apt-get -qq install --no-install-recommends -y build-essential crossbuild-essential-arm64 libnuma-dev
          x86_64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
          cd "$w/bin"
          curl -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel" | sha256sum -c -
          chmod 755 bazel
          cat > "$w/bounds.bazelrc" <<'RC'
          common --lockfile_mode=off
          build --jobs=3 --loading_phase_threads=3 --remote_cache= --remote_executor= --bes_backend=
          build --spawn_strategy=processwrapper-sandbox --strategy=GoStdlib=processwrapper-sandbox --strategy=GoStdlibList=processwrapper-sandbox
          build --modify_execution_info=^(GoStandardLibraryAnalysis|GoStaticAnalysis)$=-no-sandbox
          build --noshow_progress
          RC
      - name: Read the actual stock resolver and C++ dependency
        run: |
          set -eu
          w="$RUNNER_TEMP/cares-consumer"
          cd "$w/src"
          env -i HOME="$HOME" USER="$USER" PATH="$w/bin:$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$w/cares_consumer.py" base
      - name: Verify both configured headers, the license catalog and the native Socket and Close RPCs
        run: |
          set -eu
          w="$RUNNER_TEMP/cares-consumer"
          cd "$w/src"
          git checkout -q --detach ca5436ed33fd2bc67dba510a4ecf730d972448fc
          git restore --source="$GITHUB_SHA" --worktree -- test/packetimpact/cares_qualification
          env -i HOME="$HOME" USER="$USER" PATH="$w/bin:$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$w/cares_consumer.py" candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: packetimpact-registry-cares
          path: |
            ${{ runner.temp }}/cares-consumer/out/consumer.json
            ${{ runner.temp }}/cares-consumer/out/cares-license.yaml
          if-no-files-found: error
          retention-days: 14
