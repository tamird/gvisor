name: Compare July bridge source binaries in offline guests
on:
  push:
    branches: [qualification/july-bridge-vm-ab]
permissions: {contents: read, actions: read}
jobs:
  observe:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 2, persist-credentials: false}
    - name: Bind the previous two original binary archives and their fork source
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/july-bridge-vm"
        mkdir -m 700 "$d"
        printf '%s\n' '{"status":"INCOMPLETE","binaries":{},"arms":{},"vm_source":"64fea59014b0104240a5e100095b60e51aa90bae","fixture":"55389ccd4ddad77ee81531a7acf0d552d57471dd","original_packet_artifact":13360000336,"build_artifact":13360069037}' >"$d/result.json"
        test "$(git rev-parse HEAD^)" = 64fea59014b0104240a5e100095b60e51aa90bae
        gh api repos/tamird/gvisor/actions/artifacts/13359584720/zip > "$d/stock.zip"
        gh api repos/tamird/gvisor/actions/artifacts/13360118839/zip > "$d/fixed.zip"
        printf '%s  %s\n' 04a7314cb8d1efacf59a696a68755eeb1ffca8afca948f7af809cbee2a10dc0c "$d/stock.zip" 1b32c287347364392ce7c8990536f0cdc30516138dddf962de42d6c33e730bb4 "$d/fixed.zip" | sha256sum -c -
    - name: Stage the original public fixture images without starting either
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/july-bridge-vm"
        phase=source
        trap 'printf "%s %s\n" "$phase" "$?" > "$d/setup"' EXIT
        obs=55389ccd4ddad77ee81531a7acf0d552d57471dd
        rep=75eceea46eaab71ebf693a302e459d3a8dafcd51
        git fetch --no-tags --depth=1 origin "$obs" "$rep"
        test "$(git rev-parse "$obs:test/rtnetlink/linux/dind_socket.py")" = b6f745c9cfc1cd05c83572a52cbe8638eed4bb5e
        test "$(git rev-parse "$obs:test/rtnetlink/linux/dind_guest.sh")" = 1d1f2de2f2174640aec66adc86717ad72a3c7abe
        test "$(git rev-parse "$obs:test/rtnetlink/linux/nested_docker.py")" = 16dcbd65f151794411acf8710b77c2755ea88f52
        test "$(git rev-parse "$obs:.github/qualification/nested_docker_receipt.py")" = 44b65c4b549c6726d4d50a613d0557acec22eba6
        git show "$rep:.github/qualification/july_runsc_build.py" >"$d/build-report.py"
        phase=tools
        test "$(cat .bazelversion)" = 8.8.1
        curl -fsSL --retry 2 https://releases.bazel.build/8.8.1/release/bazel-8.8.1-linux-x86_64 -o "$d/bazel"
        echo "5b5bab2095065817d3416ca9a0678bd39c10c9ede432dbe8187bfe74de285160  $d/bazel" | sha256sum -c -
        chmod 755 "$d/bazel"
        phase=sidecars
        curl -fsSL --retry 2 https://storage.googleapis.com/gvisor/releases/pool/20260727.0/binary-amd64/runsc.deb -o "$d/july.deb"
        echo "386bdc2196fc600b68ff8dafdd8ecdc6a8e033ecf9cfa9dfab61ec1b389da307  $d/july.deb" | sha256sum -c -
        dpkg-deb -x "$d/july.deb" "$d/july"
        # The trusted image importer only pulls, saves and exports; it never
        # starts a workload with the host daemon or supplies that socket to it.
        stage_image() {
          for registry in mirror.gcr.io docker.io; do
            if docker pull --platform linux/amd64 "$registry/library/$1@$2"; then
              test "$(docker image inspect -f '{{.Id}}' "$registry/library/$1@$2")" = "$3"
              return
            fi
          done
          return 1
        }
        phase=docker-image
        dind=sha256:d2dc198f7d839eae26b5a9cb0e7cdc4e2c97d9cb4ea66dbeb0a4c0c7f0b165f8
        stage_image docker sha256:f649ef046008ca7f926a2571c32b0ac22e5c59eb61b959617f9acc2a4c638cf5 "$dind"
        container=$(docker create --network none "$dind")
        docker export -o "$d/dind-rootfs.tar" "$container"
        docker rm -v "$container"
        phase=python-image
        py=sha256:38fd5a425aa93b06d367e2e47e2da6a9bc0cabdaf5788fb1707d143fd1416e97
        stage_image python sha256:69ebe56e2a764c399514a0a6117131cb730cc4d0e71e85c08deb9af74cbb9f41 "$py"
        docker tag "$py" python:3.12-alpine
        docker save -o "$d/python-image.tar" python:3.12-alpine
        phase=ready
    - name: Assemble the public VM once and run both Bazel owners as the ordinary unprivileged user
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/july-bridge-vm"
        sudo -n unshare --mount --pid --fork --mount-proc --propagation private \
          setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            env -i HOME="$HOME" USER="$(id -un)" PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 GIT_TERMINAL_PROMPT=0 \
            /bin/bash -ec '
              set -o pipefail
              dir=$1
              test ! -w /var/run/docker.sock
              python3 -B .github/qualification/july_bridge_vm.py "$dir" stage
              test "$("$dir/bazel" --version)" = "bazel 8.8.1"
              rc=0
              timeout -k 20 3400 "$dir/bazel" --nosystem_rc --nohome_rc test --config=x86_64 --jobs=3 --local_test_jobs=1 --keep_going \
                --remote_executor= --remote_cache= --bes_backend= --strategy=TestRunner=local \
                --nocache_test_results --flaky_test_attempts=1 --test_timeout=840 --build_tests_only=false \
                --build_tag_filters= --test_tag_filters= --color=no --curses=no --noshow_progress \
                --build_event_publish_all_actions --build_event_json_file="$dir/events" \
                //test/rbe/tcg:amd64_cgroup_v1_guest //test/rbe/tcg:kvm_host_tools \
                //test/rbe/tcg:july_bridge_stock //test/rbe/tcg:july_bridge_fixed >"$dir/build.log" 2>&1 || rc=$?
              printf "%s\n" "$rc" >"$dir/exit"
              exit "$rc"
            ' julius "$d"
    - name: Retain native build, both original test results, and first socket exchange independently
      if: always()
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/july-bridge-vm"
        env -i HOME="$HOME" PATH=/usr/bin:/bin LANG=C.UTF-8 /usr/bin/python3 -B .github/qualification/july_bridge_vm.py "$dir" collect
    - name: Validate the bounded public projection
      if: always()
      id: safe
      run: |
        set -eu
        python3 - "$RUNNER_TEMP/july-bridge-vm/result.json" <<'PY'
        import json,re,sys
        from pathlib import Path
        p=Path(sys.argv[1])
        assert p.is_file() and not p.is_symlink() and 0<p.stat().st_size<160000
        data=p.read_bytes()
        assert not re.search(rb'(?i)https?://|github_pat_|gh[pousr]_|bearer\s|authorization\s*[:=]|BEGIN [A-Z]*PRIVATE KEY',data)
        r=json.loads(data)
        assert r["status"] in ("MEASURED","INCOMPLETE") and set(r["arms"])<={"stock","fixed"}
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.safe.outcome == 'success'
      with:
        name: july-bridge-vm-comparison
        path: ${{ runner.temp }}/july-bridge-vm/result.json
        if-no-files-found: error
    - name: Require both measured arms
      if: always()
      run: |
        jq -e '.status == "MEASURED"' "$RUNNER_TEMP/july-bridge-vm/result.json"
