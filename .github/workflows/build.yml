name: Qualify spelling licenses, downstream resolution and native scratch execution
on:
  push:
    branches: [qualification/codespell-bazel9-secondary]
permissions:
  contents: read
jobs:
  lint:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Prepare the verified released client and GNU execution platform
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          d="$RUNNER_TEMP/lint-bazel9"
          mkdir -p "$d/platform" "$d/scratch"
          cp .github/qualification/lint-pilot/secondary.py "$d/"
          curl --retry 3 -fsSL https://raw.githubusercontent.com/tamird/gvisor/b224a82d47407d754ce438e19f6d1b60f2e20fb3/.github/qualification/lint-pilot/check.py -o "$d/check.py"
          curl --retry 3 -fsSL https://raw.githubusercontent.com/tamird/gvisor/82d7d5349301f43e3e683ba3564c20204b187e48/.github/qualification/lint-pilot/platform.BUILD -o "$d/scratch/BUILD"
          printf 'module(name="cpplint_qualification")\n' > "$d/scratch/MODULE.bazel"
          echo '{"verdict":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/codespell-secondary.json"
          for module in qualification_report unit_matrix; do
            curl --retry 3 -fsSL "https://raw.githubusercontent.com/tamird/gvisor/599cb05aecfb107e07f81b8591a009cb12d6ffa7/test/rbe/$module.py" -o "$d/$module.py"
          done
          git checkout --detach 46b096d63f5a90ef49976a6ccdeafe81a5324c57
          curl --retry 3 -fsSL https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
          printf '%s  %s\n' 7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c "$d/bazel" | sha256sum -c -
          chmod +x "$d/bazel"
          printf 'module(name="tcp_gnu")\n' > "$d/platform/MODULE.bazel"
          printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","EstimatedMemory":"2GB","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$d/platform/BUILD"
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$d/bb.rc"
      - name: Check the product and the composed static interpreter
        run: LINT_RC="$RUNNER_TEMP/lint-bazel9/bb.rc" python3 -B "$RUNNER_TEMP/lint-bazel9/secondary.py"
      - name: Check the compact artifact boundary
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          data = (Path(os.environ["RUNNER_TEMP"]) / "codespell-secondary.json").read_bytes()
          key = os.environ["KEY"].encode()
          assert key and key not in data and b"x-buildbuddy-api-key" not in data.lower()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: codespell-secondary
          path: ${{ runner.temp }}/codespell-secondary.json
          if-no-files-found: error
