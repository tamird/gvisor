name: Verify bound epoll mask updates
on:
  push:
    branches: [qualification/epoll-single-entry-checks]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/epoll-single-entry-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      NEW: 2bc054a727c758ebed0a479b7f9256f0b28a9a61
      OLD: 4870df55da4f6dc9e9fcddb5bc43ecdaf5be433d
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
        persist-credentials: false
    - name: Bind product, paired baseline and fixtures
      shell: bash
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^) == "$NEW" && $(git rev-parse "$NEW^") == 93c6a50b6367d544d8587eb80ea81f8df8cc1efd ]]
        mkdir -p "$RUNNER_TEMP/checker" "$RUNNER_TEMP/focused/linux"
        cp test/rbe/epoll_bound_report.py "$RUNNER_TEMP/checker/"
    - name: Exercise native Linux in a private mount and UTS namespace
      shell: bash
      run: |
        set -euo pipefail
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)
        out=$RUNNER_TEMP/focused/linux
        code=0
        bazelisk test --spawn_strategy=local --strategy=TestRunner=local --nocache_test_results --test_output=errors "--build_event_json_file=$out/events.jsonl" //test/overlay_poll_control:linux_test || code=$?
        python3 -B - "$out" "$code" <<'PY'
        from hashlib import sha256
        import json
        from pathlib import Path
        import sys
        from urllib.parse import unquote, urlparse

        out, code = Path(sys.argv[1]), int(sys.argv[2])
        owner = "//test/overlay_poll_control:linux_test"
        r = dict(command_exit=code, target=owner, verdict="INCOMPLETE", lane="native-linux", cases={}, observations=[], qualified=False)
        try:
            events = [json.loads(line) for line in (out / "events.jsonl").read_bytes().splitlines()]
            r["invocation"] = next(e["started"]["uuid"] for e in events if "started" in e)
            r["bazel_exit"] = next(e["finished"]["exitCode"].get("code", 0) for e in events if "finished" in e)
            test, = [e["testResult"] for e in events if e.get("id", {}).get("testResult", {}).get("label") == owner]
            r["test_status"] = test["status"]
            base = Path("bazel-testlogs/test/overlay_poll_control/linux_test")
            data = (base / "test.log").read_bytes()
            file, = [f for f in test["testActionOutput"] if f["name"] == "test.log"]
            dg = sha256(data).hexdigest()
            if file.get("digest"):
                assert file["digest"] == dg and int(file["length"]) == len(data)
            else:
                uri = urlparse(file["uri"])
                assert uri.scheme == "file" and Path(unquote(uri.path)).resolve() == (base / "test.log").resolve()
            r["log"] = {"sha256": dg, "bytes": len(data)}
            line, = [x[len(b"LINUX_OVERLAY_POLL "):] for x in data.splitlines() if x.startswith(b"LINUX_OVERLAY_POLL ")]
            r["syscalls"] = json.loads(line)
            assert test["status"] == "PASSED" and code == r["bazel_exit"] == 0
            r.update(verdict="COMPLETE", qualified=True, observations=[r["syscalls"]])
        except Exception as exc:
            r.update(error=type(exc).__name__, line=exc.__traceback__.tb_lineno)
        finally:
            (out / "result.json").write_text(json.dumps(r, indent=2, sort_keys=True)+"\n")
        sys.exit(r["verdict"] != "COMPLETE")
        PY
    - name: Compare live effects on the same worker platform
      if: ${{ !cancelled() }}
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        plat=$RUNNER_TEMP/poll-gnu-platform
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        cat >"$plat/BUILD" <<BUILD
        platform(
            name = "gnu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {"Arch":"amd64", "OSFamily":"linux", "workload-isolation-type":"firecracker", "container-image":"docker://$GNU"},
            visibility = ["//visibility:public"],
        )
        BUILD
        rc=$RUNNER_TEMP/poll-gnu.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=remote' "build --inject_repository=poll_gnu_platform=$plat" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$rc"
        unset BUILDBUDDY_API_KEY
        docker run --rm --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c '
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
          work=$1; old=$2; new=$3
          for lane in main race analyzers arm; do
            rev=$new
            git checkout --quiet --detach "$rev"
            [[ $(git rev-parse HEAD) == "$rev" && -z $(git status --porcelain --untracked-files=no) ]]
            out="$work/focused/$lane"; mkdir -p "$out"
            vfs=//pkg/sentry/vfs:vfs_test; contract=//pkg/sentry/epollqualification:epoll_contract_test
            arch=x86_64; args=()
            case "$lane" in
              main) targets=("$vfs" "$contract" //pkg/fdnotifier:fdnotifier_test //pkg/sentry/socket/unix/transport:transport_test //pkg/sentry/fsimpl/proc:proc_test); args+=(--test_arg=-test.v) ;;
              race) targets=("$vfs" //pkg/fdnotifier:fdnotifier_test //pkg/sentry/socket/unix/transport:transport_test); args+=(--config=race --test_arg=-test.v) ;;
              analyzers|arm) targets=(//pkg/sentry/vfs:vfs_nogo //pkg/sentry/fsimpl/overlay:overlay_nogo //pkg/sentry/socket/unix/transport:transport_nogo //pkg/fdnotifier:fdnotifier_nogo //pkg/sentry/socket/hostinet:hostinet_nogo //pkg/sentry/fsimpl/fuse:fuse_nogo //pkg/sentry/devices/nvproxy:nvproxy_nogo); [[ $lane != arm ]] || arch=aarch64 ;;
            esac
            code=0
            bazel --bazelrc="$work/poll-gnu.bazelrc" test --keep_going --config="$arch" -c opt --test_timeout=300 --test_output=all --jobs=80 --nocache_test_results --modify_execution_info="^TestRunner$=+no-remote-cache" --remote_download_outputs=toplevel --remote_download_regex=".*[/]test[.](log|xml)$" --test_sharding_strategy=disabled --build_event_json_file="$out/events.jsonl" "${args[@]}" "${targets[@]}" >"$out/bazel.log" 2>&1 || code=$?
            for t in "${targets[@]}"; do python3 -B "$work/checker/epoll_bound_report.py" "$out" "$t" "$rev" "$lane" "$code"; done
            echo "$lane: Bazel $code"
            if [[ $lane == main && $code != 0 ]] && grep -q -e "compilepkg:" -e "GoCompilePkg " "$out/bazel.log"; then break; fi
          done
        ' _ "$RUNNER_TEMP" "$OLD" "$NEW"
    - name: Verify the complete comparison
      if: always()
      shell: bash
      run: |
        python3 - "$RUNNER_TEMP/focused" <<'PYTHON'
        import json, pathlib, sys
        p=pathlib.Path(sys.argv[1]); rows=[json.loads(f.read_text()) for f in p.glob("*/*.json") if f.name not in ("events.jsonl",)]
        assert len(rows)==23, [(r["lane"],r["target"]) for r in rows]
        for r in rows:
            assert r["qualified"], r
            print(r["lane"],r["target"],r["invocation"],len(r["cases"]),r["observations"])
        PYTHON
    - name: Preserve each original verdict
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: epoll-single-entry-results
        path: |
          ${{ runner.temp }}/focused/*/*.json
          ${{ runner.temp }}/focused/*/*.test.log
          ${{ runner.temp }}/focused/*/*.test.xml
        if-no-files-found: error
