name: Verify native test wrappers and Nogo on Linux
on:
  push:
    branches: [qualification/pr15370-inherited-go-nogo]
permissions: {}
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Run the wrapped tests and check both TestRunner platforms
        run: |
          set -euo pipefail
          git init -q .
          git fetch -q --depth=3 --no-tags https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git checkout -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = d41dcb1744e773fe6d7f58b1ad1ee0c1e0771d55
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml'
          git checkout -q --detach HEAD^
          test "$(git rev-parse HEAD^)" = f98c31b5b7d292061d990c97e5ef9d1601d72d8d
          q="$RUNNER_TEMP/native-nogo"
          mkdir -p "$q/records"
          test "$(cat .bazelversion)" = 9.3.1
          curl -qfsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$q/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $q/bazel" | sha256sum -c -
          chmod +x "$q/bazel"
          git rev-parse HEAD > "$q/records/source"
          uname -m | tee "$q/records/host_cpu"
          grep -qx x86_64 "$q/records/host_cpu"
          git diff --exit-code HEAD
          # The public Nogo target checks the ordinary test. Attach the same
          # rule to its two with_cfg wrappers to require exported Go facts.
          sed -i '1i load("//tools/nogo:defs.bzl", "nogo_test")' pkg/atomicbitops/BUILD
          for arch in amd64 arm64; do
            cat >> pkg/atomicbitops/BUILD <<EOF

          nogo_test(
              name = "verify_${arch}_exports",
              config = "//:nogo_config",
              deps = [":atomicbitops_test_${arch}"],
          )
          EOF
          done
          git diff HEAD -- pkg/atomicbitops/BUILD > "$q/records/analyzer-fixture.diff"
          mkdir "$q/worker"
          printf '%s\n' 'module(name="rebased_workers")' >"$q/worker/MODULE.bazel"
          cat > "$q/worker/BUILD" <<'BUILD'
          package(default_visibility = ["//visibility:public"])
          platform(
              name = "gnu_amd64",
              constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
              exec_properties = {
                  "Arch": "amd64",
                  "OSFamily": "linux",
                  "workload-isolation-type": "firecracker",
                  "container-image": "docker://gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a",
              },
          )
          platform(
              name = "native_arm64",
              constraint_values = ["@platforms//cpu:aarch64", "@platforms//os:linux"],
              exec_properties = {
                  "Arch": "arm64",
                  "OSFamily": "linux",
                  "workload-isolation-type": "oci",
                  "container-image": "docker://docker.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
              },
          )
          BUILD
      - name: Run both native suites and analyze the tests themselves
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          q="$RUNNER_TEMP/native-nogo"
          rc="$q/client.rc"
          trap 'rm -f "$rc"' EXIT
          cat >"$rc" <<'RC'
          build --remote_executor=grpcs://remote.buildbuddy.io --remote_cache=grpcs://remote.buildbuddy.io
          build --bes_backend=grpcs://remote.buildbuddy.io --bes_results_url=https://app.buildbuddy.io/invocation/
          build --spawn_strategy=remote --noremote_local_fallback --jobs=64 --remote_timeout=10m
          build --host_platform=@rebased_workers//:gnu_amd64
          build --extra_execution_platforms=@rebased_workers//:gnu_amd64,@rebased_workers//:native_arm64
          RC
          printf 'build --inject_repository=rebased_workers=%s/worker\n' "$q" >> "$rc"
          printf 'build --remote_header=x-buildbuddy-api-key=%s\nbuild --bes_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_API_KEY:?}" "$BUILDBUDDY_API_KEY" >> "$rc"
          unset BUILDBUDDY_API_KEY
          sed -e 's/ --cxxopt=-Wno-error=maybe-uninitialized//' -e 's/ --host_cxxopt=-Wno-error=maybe-uninitialized//' .bazelrc >"$q/llvm.rc"
          bazel=("$q/bazel" --nosystem_rc --nohome_rc --noworkspace_rc --bazelrc="$q/llvm.rc" --bazelrc="$rc")
          common=(--config=x86_64 -c opt --extra_toolchains=@llvm//toolchain:all --lockfile_mode=off)
          g=//pkg/atomicbitops
          targets=("$g:atomicbitops_test_all_architectures" //test/util:posix_error_test_all_architectures "$g:verify_amd64_exports" "$g:verify_arm64_exports")
          for arch in amd64 arm64; do
            test_label="$g:verify_${arch}_exports"
            "${bazel[@]}" cquery "${common[@]}" --output=files --output_groups=nogo_findings "$test_label" > "$q/records/reports-$arch"
            for report_cpu in amd64 arm64; do grep -F "verify_${arch}_exports.${report_cpu}.findings" "$q/records/reports-$arch"; done
          done
          "${bazel[@]}" test "${common[@]}" --keep_going --remote_download_outputs=toplevel --nocache_test_results --flaky_test_attempts=1 --test_sharding_strategy=disabled --test_env=GO_TEST_WRAP=1 --test_env=GO_TEST_WRAP_TESTV=1 --strategy=TestRunner=remote --test_output=errors --run_under="/bin/sh -c 'echo NATIVE_TEST_WORKER=\$(uname -m); exec \"\$@\"' probe" "${targets[@]}"
          for arch in amd64 arm64; do
            worker=x86_64
            [[ $arch = amd64 ]] || worker=aarch64
            for label in "$g:atomicbitops_test_$arch" "//test/util:posix_error_test_$arch"; do
              name=${label#//}
              dir=bazel-testlogs/${name/:/\/}
              grep -Fx "NATIVE_TEST_WORKER=$worker" "$dir/test.log" > "$q/records/${label##*:}.worker"
              cp "$dir/test.xml" "$q/records/${label##*:}.xml"
            done
            grep -Fx PASS "bazel-testlogs/pkg/atomicbitops/verify_${arch}_exports/test.log" > "$q/records/nogo-$arch"
          done
          python3 - "$q/records" <<'PYTEST'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET
          for path in sorted(Path(sys.argv[1]).glob('*.xml')):
              cases = list(ET.parse(path).iter('testcase'))
              expected = 'TestOrUint32' if path.name.startswith('atomicbitops') else 'PosixError'
              if not any(expected in case.get('name', '') for case in cases):
                  raise ValueError(f'{path.name}: no {expected} records')
              if any(case.find(tag) is not None for case in cases for tag in ('error', 'failure', 'skipped')):
                  raise ValueError(f'{path.name}: unsuccessful record')
              print(path.stem, len(cases))
          PYTEST
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr15370-inherited-go-nogo
          path: ${{ runner.temp }}/native-nogo/records/
          if-no-files-found: error
          retention-days: 14
