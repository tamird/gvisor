name: Check Buildkite image dispatch
"on":
  push:
    branches: [qualification/image-check-dispatch]
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Exercise image inventories, Buildkite shards and real mixed contexts
        env:
          USE_BAZEL_VERSION: 9.3.1
        run: |
          set -eu
          grep -Fxq "$USE_BAZEL_VERSION" images/default/bazelversion
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/image-check-bazelisk"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/image-check-bazelisk" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/image-check-bazelisk"
          python3 test/rbe/host_image_inventory.py
      - name: Verify the bounded public result
        id: safe
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "host-image-inventory/verdict.json"
          assert path.is_file() and not path.is_symlink() and 0 < path.stat().st_size < 64000
          raw = path.read_bytes()
          assert not any(x in raw for x in (b"Authorization:", b"Bearer ", b"ghp_", b"github_pat_", b"X-Amz-", b"remote_header"))
          assert json.loads(raw)["status"] in ("PASS", "FAIL", "INCOMPLETE")
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.safe.outcome == 'success'
        with:
          name: host-image-inventory
          path: ${{ runner.temp }}/host-image-inventory/verdict.json
          if-no-files-found: error
          retention-days: 14
