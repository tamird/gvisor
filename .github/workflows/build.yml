name: Build GNU Make and the TLDK plugin with direct compiler probes
on:
  push:
    branches: [qualification/gnu-plugin-with-direct-probes]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: carrier, persist-credentials: false, fetch-depth: 1}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: product, ref: 7dc8df3c4bb7da1bc04037fe9a2d641cb36cc5a4, persist-credentials: false, fetch-depth: 2}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tamird/bazel-central-registry
          path: registry
          ref: f8f5f201805db9b0c27571f7630cb8a37f3a78d6
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tamird/rules_cc_autoconf
          path: supplier
          ref: b0b4b6c173c4312c14f3c5a427e9e3cb7271143c
          persist-credentials: false
          fetch-depth: 2
      - name: Prepare private remote configuration and declared execution platform
        working-directory: carrier
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/package-evidence"
          printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap","executed_targets":0}' > "$RUNNER_TEMP/package-evidence/bootstrap.json"
          test -n "$BUILDBUDDY_API_KEY"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --action_env=TMPDIR=.' 'build --host_action_env=TMPDIR=.'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/sidecar.bazelrc"
          unset BUILDBUDDY_API_KEY
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "bdb65b4bddb8405a80b3e45a3ef4c740819b151d0709d360e8add8dac534c224  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
          cp test/rbe/empty_worker/{wildcard.py,expected-targets.json} "$RUNNER_TEMP/"
          mkdir -p ../product/test/rbe/empty_worker
          if [ ! -e ../product/test/rbe/empty_worker/BUILD ]; then
            cp test/rbe/empty_worker/BUILD ../product/test/rbe/empty_worker/BUILD
          fi
          bazel --bazelrc="$RUNNER_TEMP/sidecar.bazelrc" run //tools/actionlint -- "$PWD/.github/workflows/build.yml" > "$RUNNER_TEMP/actionlint.log" 2>&1 || { tail -20 "$RUNNER_TEMP/actionlint.log"; exit 1; }
          printf '%s\n' '{"status":"PASS","phase":"bootstrap","executed_targets":0}' > "$RUNNER_TEMP/package-evidence/bootstrap.json"
      - name: Pin the qualified compiler probes for both consumers
        run: |
          set -eu
          test "$(git -C supplier rev-parse HEAD)" = b0b4b6c173c4312c14f3c5a427e9e3cb7271143c
          test "$(git -C registry rev-parse HEAD)" = f8f5f201805db9b0c27571f7630cb8a37f3a78d6
          printf 'build --override_module=rules_cc_autoconf=%s/supplier\n' "$GITHUB_WORKSPACE" >> "$RUNNER_TEMP/sidecar.bazelrc"
          printf '%s\n' '{"product":"7dc8df3c4bb7da1bc04037fe9a2d641cb36cc5a4","registry":"f8f5f201805db9b0c27571f7630cb8a37f3a78d6","supplier":"b0b4b6c173c4312c14f3c5a427e9e3cb7271143c"}' > "$RUNNER_TEMP/package-evidence/sources.json"
      - name: Build GNU Make on scratch and run its six existing cases
        id: make
        continue-on-error: true
        working-directory: product
        run: python3 ../carrier/test/rbe/empty_worker/make_revision.py smoke
      - name: Build the TLDK plugin on the scratch worker
        id: plugin
        continue-on-error: true
        working-directory: product
        env:
          PRODUCT: 7dc8df3c4bb7da1bc04037fe9a2d641cb36cc5a4
          REGISTRY: ${{ github.workspace }}/registry
        run: python3 "$RUNNER_TEMP/wildcard.py"
      - name: Require all independent results
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "package-evidence"
          names = ["bootstrap.json", "smoke-after.json", "summary.json"]
          assert all((folder / name).exists() and json.loads((folder / name).read_text()).get("status") == "PASS" for name in names)
          PYCODE
      - name: Check the public records before upload
        id: privacy
        if: always()
        env:
          BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "package-evidence"
          key = os.environ["BB_KEY"].encode()
          assert key and root.is_dir()
          for path in root.rglob("*"):
              if path.is_file() and key in path.read_bytes():
                  raise SystemExit("Credential in an evidence file")
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: make-and-plugin
          path: ${{ runner.temp }}/package-evidence
          if-no-files-found: error
