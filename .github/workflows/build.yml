name: Build native and cross releases on a compiler-free client
on:
  push:
    branches: [qualification/compiler-free-client-release]
permissions: {contents: read}
jobs:
  release:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && !github.event.deleted
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the release and compiler revisions and the Bazel client
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/direct-client"
          mkdir -p "$d/runtime-cross"
          cp .github/qualification/{reduced_builder,cross_release_pack}.py test/rbe/{native_cross_inputs,runtime_cross}.py "$d/runtime-cross/"
          git fetch --quiet --depth=2 https://github.com/tamird/gvisor.git c115840f8a85010111fa5d72b611d7d9ab1df34b
          test "$(git rev-parse FETCH_HEAD^)" = 4bee07965270dc7cb4ed89eb6a3b17968b3e0a90
          git checkout --quiet --detach c115840f8a85010111fa5d72b611d7d9ab1df34b
          test -z "$(git status --porcelain)"
          curl --fail --show-error --silent --location --retry 3 --proto '=https' --proto-redir '=https' https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$d/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          for cpu in arm64 amd64; do
            mkdir -p "$d/$cpu/runtime-cross"
            echo '{"verified":false,"phase":"preparing Jammy client"}' > "$d/$cpu/runtime-cross/verdict.json"
          done
      - name: Run the existing compiler and release checks directly on Jammy
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/direct-client"
          digest=sha256:8a2321a92b438238f93b4346fff61bc4259c99fdd4d9b52ee86f153fee0c344f
          base="mirror.gcr.io/library/ubuntu@$digest"
          if ! docker pull --platform linux/amd64 "$base"; then
            base="docker.io/library/ubuntu@$digest"
            docker pull --platform linux/amd64 "$base"
          fi
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$base")" = linux/amd64
          docker run --rm --workdir /workspace --entrypoint /bin/bash \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            -e RUNNER_TEMP=/audit -e BUILDER_IMAGE="$digest" -e DEBIAN_FRONTEND=noninteractive \
            -v "$GITHUB_WORKSPACE:/workspace" -v "$d:/audit" -v "$d/bazel:/usr/local/bin/bazel:ro" "$base" -euc '
              apt-get update -qq
              apt-get install -qq -y --no-install-recommends ca-certificates git python3 patch zip unzip
              test "$(/usr/local/bin/bazel --version)" = "bazel 9.3.1"
              for cpu in arm64 amd64; do
                export RELEASE_ARCH="$cpu" RUNNER_TEMP="/audit/$cpu"
                python3 -B /audit/runtime-cross/reduced_builder.py
                python3 -B /audit/runtime-cross/cross_release_pack.py
              done'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: compiler-free-client-results
          path: |
            ${{ runner.temp }}/direct-client/*/runtime-cross/verdict.json
            ${{ runner.temp }}/direct-client/*/pack.json
          if-no-files-found: warn
          retention-days: 7
