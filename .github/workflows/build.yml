name: Profile connected short reads and compare the original packet benchmark
on:
  push:
    branches: [qualification/tcp-read-original-profiles]
permissions: {contents: read}
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind stock, approved, the original transport fixture and compiler
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tcp-read-profile"
          mkdir -p "$root/results"
          cp .github/qualification/{stream_fixture.go,stream_cpu_alloc.go,stock_read_profiles.py} "$root/"
          test "$(git rev-parse HEAD^)" = e9abe5401c9fa5bc3c96738e52d406b0b1fbc15b
          test "$(git rev-parse HEAD^^)" = f51a205a8f4afbc5ab41aded070df74951b081ea
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/stream_fixture.go' ':!.github/qualification/stream_cpu_alloc.go' ':!.github/qualification/stock_read_profiles.py'
          git fetch -q --depth=2 https://github.com/tamird/gvisor.git 890afa390aa44699ecbe493699b5260ad50dbaba
          echo "cd0b0af723f37718e8405c3db13b574db6a75ab33011006ec31eec7213d98735  $root/stream_fixture.go" | sha256sum -c -
          curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' --max-time 120 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$root/bazelisk"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $root/bazelisk" | sha256sum -c -
          chmod 755 "$root/bazelisk"
      - name: Collect CPU and allocation profiles in separate test processes
        run: |
          root="$RUNNER_TEMP/tcp-read-profile"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -B "$root/stock_read_profiles.py"
      - name: Calculate benchstat on the original four packet-drain shapes
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tcp-read-profile/results"
          test "$(wc -l < f51a205a8)" -eq 64
          test "$(wc -l < e9abe5401)" -eq 64
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e f51a205a8 e9abe5401 | tee benchstat.txt
          grep -q 'sec/op' benchstat.txt
      - name: Check the bounded result and profile files
        id: boundary
        if: always() && !cancelled()
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"], "tcp-read-profile", "results")
          assert (root/"result.json").is_file()
          paths=list(root.iterdir())
          assert len(paths) <= 28
          for path in paths:
              assert path.is_file() and not path.is_symlink()
              assert re.fullmatch(r"result\.json|benchstat\.txt|f51a205a8|e9abe5401|(?:cpu|alloc)-0[1-4]-(?:f51a205a8|e9abe5401)-(?:cpu|before|after)\.pprof", path.name), path.name
              assert path.stat().st_size < 4 << 20
              if path.suffix==".pprof":
                  assert path.read_bytes()[:2] == b"\x1f\x8b"
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.boundary.outcome == 'success'
        with:
          name: connected-read-stock-and-approved-profiles
          path: ${{ runner.temp }}/tcp-read-profile/results/
          if-no-files-found: error
          retention-days: 30
