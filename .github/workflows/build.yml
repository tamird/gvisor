name: Recover original RACK test reports
on:
  push:
    branches: [qualification/rack-receipt-recovery]
permissions:
  contents: read
  actions: read
jobs:
  originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 3
      - name: Resolve both original verifier revisions
        run: |
          git fetch --depth=1 origin 699298e6761f645cc469aaf106e25e143232f919 b2d2cb2fdf4f48f37a8ad984f2e5d41c69c65262
      - name: Download original joint artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41010892540 --repo tamird/gvisor --name rack-ack-and-16659 --dir "$RUNNER_TEMP/original-joint"
      - name: Verify original joint executable cases
        id: joint
        continue-on-error: true
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 -B test/rbe/recover_rack_receipts.py joint "$RUNNER_TEMP/original-joint" "$RUNNER_TEMP/receipts-joint"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: joint-recovery
          path: ${{ runner.temp }}/receipts-joint
          if-no-files-found: error
      - name: Await primary original artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 150); do
            if gh run view 41009307713 --repo tamird/gvisor --json status --jq .status | grep -qx completed; then
              gh run download 41009307713 --repo tamird/gvisor --name rack-ack-boundary --dir "$RUNNER_TEMP/original-primary"
              exit
            fi
            sleep 30
          done
          echo "Primary run did not finish within the recovery window." >&2
          exit 1
      - name: Verify original primary arms
        id: primary
        continue-on-error: true
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 -B test/rbe/recover_rack_receipts.py primary "$RUNNER_TEMP/original-primary" "$RUNNER_TEMP/receipts-primary"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: primary-recovery
          path: ${{ runner.temp }}/receipts-primary
          if-no-files-found: error
      - name: Check recovered outcomes
        if: always()
        run: |
          test "${{ steps.joint.outcome }}" = success
          test "${{ steps.primary.outcome }}" = success
