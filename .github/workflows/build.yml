name: Check the standalone old-flight TCP migration regression
on:
  push:
    branches: [qualification/tcp-ordinary-ack-standalone]
permissions: {}
jobs:
  migration:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Bind the once-transmitted data change and actual regression fixture
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tcp-ack-standalone"
          mkdir -p "$work/results"
          git init -q
          git -c gc.auto=0 fetch -q --no-auto-maintenance --no-tags --depth=4 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "d12a58f58c341e4aca960e7d2db58e4fa8d087b1"
          git switch -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 74ce2c6b4884c4b6d30d7d8571da43f396de3f80
          test "$(git rev-parse HEAD^^)" = 679d14eed77a4ce6029065d88248c8ce0902c270
          test "$(git rev-parse HEAD^^{tree})" = c2a4d74b05dc3a95525adf3377ac2184583b21b3
          printf '%s\n' .github/qualification/tcp_ack_regression.py .github/workflows/build.yml | diff - <(git diff --name-only HEAD^ HEAD)
          printf '%s\n' pkg/tcpip/transport/tcp/snd.go pkg/tcpip/transport/tcp/test/e2e/tcp_migration_test.go | diff - <(git diff --name-only HEAD^^ HEAD^)
          git show d12a58f58c341e4aca960e7d2db58e4fa8d087b1:.github/qualification/tcp_ack_wire_receipt.json > "$work/results/prior-replay.json"
          echo "f7c7c070e8939c3e64bf917ae9e1bbee121a3bd8af593179613a28ef1bdde987  $work/results/prior-replay.json" | sha256sum -c -
          cp .github/qualification/tcp_ack_regression.py "$work/report.py"
          test "$(cat .bazelversion)" = 9.3.1
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$work/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $work/bazel" | sha256sum -c -
          chmod 700 "$work/bazel"
      - name: Run the migration regressions on the original and corrected sender
        timeout-minutes: 48
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" python3 -B "$RUNNER_TEMP/tcp-ack-standalone/report.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: tcp-ordinary-ack-standalone
          path: ${{ runner.temp }}/tcp-ack-standalone/results/
          if-no-files-found: error
          retention-days: 14
