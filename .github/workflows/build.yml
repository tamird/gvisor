name: Resolve the release fixture tool closure

on: workflow_dispatch

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Resolve the declared GNU Make package with the repository Bazel version
      run: bazelisk query --lockfile_mode=update @release_tools//:flat
    - name: Retain Bazel's generated lock
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-tools-lock
        path: MODULE.bazel.lock
        if-no-files-found: error
