name: Qualify build-test dependency selection
on:
  push:
    branches: [qualification/source-build-test-dependency-contract]
permissions: {contents: read}
jobs:
  dependency-contract:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Bind the original compiler, source and unchanged good and broken dependencies
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 57bd4192fc404cc52298a1a7408efdd3610717bc
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/build_test*.py'
          work="$RUNNER_TEMP/source-build-test"
          mkdir -m 700 "$work"
          cd "$work"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o stock
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 -o bb
          sha256sum -c <<'SUMS'
          7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  stock
          205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  bb
          SUMS
          chmod 700 stock bb
      - name: Preserve the original diagnosis, dependency runs and configured shared links
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B .github/qualification/build_test_contract.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: source-build-test-dependency-contract
          path: ${{ runner.temp }}/source-build-test/result.json
          if-no-files-found: error
          retention-days: 14
