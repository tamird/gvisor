name: Measure atomic parent pointer restore on a 50,000-file checkpoint
on:
  push:
    branches: [qualification/state-atomic-parent-compatible]
permissions:
  contents: read
  actions: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: ${{ github.sha }}
      BASE: 9f19447bdd727295bbaee1d8b198ae4e52a75ce5
      PRODUCT: ad8a4d75d65229a88743b43c85e18c4b23dadb53
      PREVIOUS: 12d3a6e9cdae24e015cc6e51fadf81ead5a24f50
      STOCK: f2f1bbdb6e461671d6e6df41a95a533454ae802a
      FIXED: 887dd7bdc61531a96351a48f7181a16e496f58ec
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 6, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD)" == "$CURRENT" ]]
        git fetch --no-tags --depth=1 origin "$PREVIOUS"
        test "$(git rev-parse HEAD^)" = "$FIXED"
        test "$(git rev-parse HEAD^1^2)" = "$STOCK"
        test "$(git rev-parse HEAD~2)" = "$PRODUCT"
        test "$(git rev-parse HEAD~3)" = "$BASE"
        git diff --exit-code "$BASE" "$STOCK" -- . ':!runsc/container/BUILD' ':!runsc/container/container_save_restore_test.go'
        git diff --exit-code "$PRODUCT" "$FIXED" -- . ':!runsc/container/BUILD' ':!runsc/container/container_save_restore_test.go'
        git diff --exit-code "$STOCK" "$FIXED" -- runsc/container/BUILD runsc/container/container_save_restore_test.go
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /var/run/docker.sock:/var/run/docker.sock -v "$(command -v docker):/usr/local/bin/docker:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Preserve comparison driver outside the selected trees
      run: |
        mkdir -p "$RUNNER_TEMP/pair/records"
        cp test/rbe/tmpfs_profile/pair-{run,bench}.py "$RUNNER_TEMP/pair/"
    - name: Recover original timing records from the completed native trials
      id: recovered
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api repos/tamird/gvisor/actions/artifacts/13083580219/zip > "$RUNNER_TEMP/pair/prior.zip"
        echo "e38ded8bbb979731599e3314449f1ff3554238a2c488835e9f1dd0e7b1241847  $RUNNER_TEMP/pair/prior.zip" | sha256sum --check
    - name: Check both state suites on the revised source
      id: positive
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" positive
    - name: Build the baseline, original prototype and revised benchmark binaries
      id: compiled
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" prepare
    - name: Capture and verify one 50,000-file checkpoint from each revision
      id: live
      if: ${{ !cancelled() && steps.compiled.outcome == 'success' }}
      timeout-minutes: 29
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" native
    - name: Verify cross-revision reads and collect sixteen paired samples per mode
      id: bench
      if: ${{ !cancelled() && steps.live.outcome == 'success' }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" benchmark
    - name: Compare elapsed time, CPU, allocations and guest-ready time with pinned benchstat
      id: comparison
      if: ${{ !cancelled() && steps.bench.outcome == 'success' && steps.live.outcome == 'success' }}
      run: python3 "$RUNNER_TEMP/pair/pair-run.py" stats
    - name: Record the qualification verdict
      if: always()
      env:
        STEP_RESULTS: ${{ toJSON(steps) }}
      run: |
        python3 - <<'PYTHON'
        import json, os, pathlib, time
        folder = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pair" / "records"
        folder.mkdir(parents=True, exist_ok=True)
        phases = json.loads(os.environ["STEP_RESULTS"])
        expected = ["recovered", "positive", "compiled", "live", "bench", "comparison"]
        outcomes = {key: phases.get(key, {}).get("outcome", "missing") for key in expected}
        required = ["fixed-suites.json", "source.json", "bench-finished.json", "benchstat.txt", "compatibility.json", "prior-native-benchstat.txt"]
        missing = [name for name in required if not (folder / name).is_file()]
        passed = all(status == "success" for status in outcomes.values()) and not missing
        if (folder / "compatibility.json").is_file():
            passed &= json.loads((folder / "compatibility.json").read_text())["original_fingerprint_rejection"]
        verdict = {"pass": passed, "baseline": os.environ["BASE"], "candidate": os.environ["PRODUCT"], "phases": outcomes, "missing": missing, "verifiedAtNs": time.time_ns()}
        (folder / "verdict.json").write_text(json.dumps(verdict, indent=2) + "\n")
        print(verdict)
        raise SystemExit(0 if passed else 1)
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: tmpfs-atomic-parent-compatible
        path: ${{ runner.temp }}/pair/records/
        if-no-files-found: error
