name: Qualify proc_net direct logging dependency
on:
  push:
    branches: [qualification/proc-net-logging-review]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Prepare existing GNU coordinator and remote platform
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cp .github/qualification/lint-runtime/proc-net.py "$RUNNER_TEMP/proc-net.py"
          git checkout --detach 26d73328a391591edbd8a91e073a5564b6010ec3
          mkdir -p "$RUNNER_TEMP/gnu-platform"
          printf 'module(name="review_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
          printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --remote_download_outputs=toplevel' "build --inject_repository=review_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@review_gnu//:gnu' 'build --host_platform=@review_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/review.bazelrc"
          docker pull --platform=linux/amd64 "$GNU"
      - name: Build the changed owner and run the pinned include cleaner controls
        run: |
          docker run --rm --entrypoint python3 --user root \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE" -e RUNNER_TEMP -e QA_RC="$RUNNER_TEMP/review.bazelrc" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            "$GNU" -B "$RUNNER_TEMP/proc-net.py"
      - name: Check the typed artifact boundary
        id: scan
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'proc-net-review.json'
          data=p.read_bytes()
          json.loads(data)
          for key in ('BUILDBUDDY_API_KEY','GH_TOKEN'):
              value=os.environ.get(key,'').encode()
              if value and value in data: raise SystemExit('credential found in report')
          if any(s in data for s in (b'ghs_',b'ghp_',b'github_pat_',b'x-buildbuddy-api-key=')): raise SystemExit('credential marker found')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && steps.scan.outcome == 'success' }}
        with:
          name: proc-net-review
          path: ${{ runner.temp }}/proc-net-review.json
          if-no-files-found: error
