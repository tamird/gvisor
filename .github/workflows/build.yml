name: Recover the original MSS forwarder compiler failure
on:
  push:
    branches: [qualification/tcp-mss-forwarder-log]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/tcp-mss-forwarder-log'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 2, persist-credentials: false}
    - name: Read the single original log; no build or transfer
      env:
        GH_TOKEN: ${{ github.token }}
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        ORIGINAL_ZIP: ${{ runner.temp }}/original.zip
      run: |
        set -euo pipefail
        gh api repos/tamird/gvisor/actions/artifacts/13134765428/zip > "$ORIGINAL_ZIP"
        python3 test/rbe/tcp_mss_forwarder.py recover
    - name: Validate the typed publication
      id: privacy
      if: always()
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        GH_TOKEN: ${{ github.token }}
      run: python3 test/rbe/tcp_mss_forwarder.py scan
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.privacy.outcome == 'success' }}
      with:
        name: tcp-mss-forwarder-original-log
        path: ${{ runner.temp }}/mss-forwarder/public/build.json
        if-no-files-found: error
