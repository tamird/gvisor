name: Check released DPDK sources against TLDK’s patch series
on:
  push:
    branches: [qualification/tldk-dpdk-releases]
permissions: {contents: read}
jobs:
  patches:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && !github.event.deleted
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Materialize the supplier archives with Bazel
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/dpdk-qualification"
          mkdir -m 700 "$d"
          cp .github/qualification/dpdk_releases.py "$d/"
          test "$(git rev-parse HEAD^)" = f51a205a8f4afbc5ab41aded070df74951b081ea
          git switch --quiet --detach HEAD^
          curl --proto '=https' -fsSL --retry 3 --max-time 100 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          env -i HOME="$HOME" PATH="$PATH" USER="$USER" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$d/dpdk_releases.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dpdk-release-patch-results
          path: ${{ runner.temp }}/dpdk-qualification/result.json
          retention-days: 14
          if-no-files-found: error
