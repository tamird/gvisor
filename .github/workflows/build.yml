name: Check the native Firecracker placement for graph restore
on:
  push:
    branches: [qualification/gc-restore-firecracker-eligibility]
permissions: {contents: read}
jobs:
  probe:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    env:
      PRODUCT: 71b5044a65ffac66a4d41cd289788d7b9ad5ea22
      TARGET: //.github/qualification/restore-placement:delegation
      USE_BAZEL_VERSION: '9.3.1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 2, persist-credentials: false}
    - name: Bind the existing source, coordinator and remote execution platform
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^)" = "$PRODUCT"
        test "$(git rev-parse "$PRODUCT^{tree}")" = e8167f98a5133e7139f3950f0a06335434e91a96
        test "$(cat .bazelversion)" = "$USE_BAZEL_VERSION"
        pkg=.github/qualification/restore-placement
        test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' "$pkg/BUILD.bazel" "$pkg/delegation.sh" "$pkg/report.py" .github/workflows/build.yml)"
        d="$RUNNER_TEMP/eligibility"; mkdir -m700 "$d" "$d/platform"
        printf '{"status":"INCOMPLETE","product_runs":0}\n' > "$d/result.json"
        curl -fsSL --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
        echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
        chmod 755 "$d/bazel"
        profile=0ee70efe6d52576b8f173b40ad6b7ac117da3b72
        git fetch -q --no-tags --depth=1 origin "$profile"
        for f in BUILD.bazel MODULE.bazel; do git show "$profile:test/rbe/gnu_platform/$f" > "$d/platform/$f"; done
        test "$("$d/bazel" version --gnu_format | tail -1)" = 'bazel 9.3.1'
    - name: Configure the audited client only
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        umask 077; d="$RUNNER_TEMP/eligibility"
        [[ -n "$BUILDBUDDY_API_KEY" ]]
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$d/private.rc"
    - name: Execute only the disposable guest eligibility test
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/eligibility"; cat /proc/sys/kernel/random/uuid > "$d/uuid"
        rc=0
        timeout -k 15s 580s "$d/bazel" --bazelrc="$d/private.rc" test --config=x86_64 \
          --inject_repository="restore_gnu=$d/platform" --extra_execution_platforms=@restore_gnu//:gnu \
          --host_platform=@restore_gnu//:gnu --jobs=3 --strategy=TestRunner=remote --nocache_test_results \
          --remote_download_outputs=all --test_timeout=55 --invocation_id="$(cat "$d/uuid")" \
          --build_event_json_file="$d/bep" "$TARGET" > "$d/console" 2>&1 || rc=$?
        echo "$rc" > "$d/exit"
    - name: Close the private client
      if: always()
      run: |
        d="$RUNNER_TEMP/eligibility"
        if test -x "$d/bazel" && test -f "$d/private.rc"; then timeout 30s "$d/bazel" --bazelrc="$d/private.rc" shutdown > /dev/null 2>&1 || true; fi
        rm -f -- "$d/private.rc"
    - name: Reconcile the one original test result
      if: always()
      run: python3 -B .github/qualification/restore-placement/report.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: gc-placement-eligibility
        path: ${{ runner.temp }}/eligibility/result.json
        if-no-files-found: error
