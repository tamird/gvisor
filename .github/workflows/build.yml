name: Check the FIFO writer generation on Linux and gVisor
on:
  push:
    branches: [qualification/fifo-ring-locks-current]
permissions: {contents: read}
jobs:
  fifo:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Bind the unchanged FIFO source and prepare the GNU coordinator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d6786915fa60f2dc04fc6969fc8ebf3274b39328
          test "$(git rev-parse HEAD^^)" = 70008149cff7b8d3b858877ae9c359b9046d19c5
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/fifo_revision.py'
          work="$RUNNER_TEMP/fifo"
          mkdir -m 700 "$work" "$work/platform"
          cp .github/qualification/fifo_revision.py "$work/"
          git checkout -q --detach HEAD^
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --retry 2 --max-time 100 --proto '=https' --proto-redir '=https' https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$work/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $work/bazel" | sha256sum -c -
          chmod 0755 "$work/bazel"
          printf '%s\n' 'module(name = "fifo_worker")' > "$work/platform/MODULE.bazel"
          cat > "$work/platform/BUILD" <<'BUILD'
          platform(
              name = "gnu",
              constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
              exec_properties = {
                  "Arch": "amd64",
                  "OSFamily": "linux",
                  "EstimatedMemory": "16GB",
                  "test.EstimatedMemory": "2GB",
                  "test.dockerUser": "root",
                  "workload-isolation-type": "firecracker",
                  "network-enable-ipv6": "true",
                  "container-image": "docker://gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a",
              },
              visibility = ["//visibility:public"],
          )
          BUILD
          image=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          docker run --init -d --name fifo-gnu --entrypoint /bin/sleep -e HOME=/home/runner -e USER=runner \
            -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro -v "$work:$work" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$image" infinity
          docker exec --user 0:0 fifo-gnu mkdir -p /home/runner
          docker exec --user 0:0 fifo-gnu chown "$(id -u):$(id -g)" /home/runner
          test "$(docker exec --user "$(id -u):$(id -g)" fifo-gnu "$work/bazel" --version)" = 'bazel 9.3.1'
      - name: Run all seven FIFO syscall cases, the pipe units and both split analyzers
        timeout-minutes: 72
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/fifo"
          rc="$work/private.rc"
          trap 'rm -f "$rc"' EXIT
          cat >"$rc" <<'RC'
          build --remote_executor=grpcs://remote.buildbuddy.io --remote_cache=grpcs://remote.buildbuddy.io
          build --bes_backend=grpcs://remote.buildbuddy.io --bes_results_url=https://app.buildbuddy.io/invocation/
          build --spawn_strategy=remote --strategy=TestRunner=remote --noremote_local_fallback --remote_timeout=10m
          build --host_platform=@fifo_worker//:gnu --extra_execution_platforms=@fifo_worker//:gnu
          RC
          printf 'build --inject_repository=fifo_worker=%s/platform\n' "$work" >>"$rc"
          printf 'build --remote_header=x-buildbuddy-api-key=%s\nbuild --bes_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_API_KEY:?}" "$BUILDBUDDY_API_KEY" >> "$rc"
          unset BUILDBUDDY_API_KEY
          test "$(git rev-parse HEAD)" = d6786915fa60f2dc04fc6969fc8ebf3274b39328
          code=0
          docker exec --user "$(id -u):$(id -g)" fifo-gnu "$work/bazel" --nosystem_rc --nohome_rc --bazelrc="$rc" \
            test --config=x86_64 --jobs=48 --keep_going --build_tag_filters= --test_sharding_strategy=disabled \
            --test_env=GO_TEST_WRAP_TESTV=1 --nocache_test_results --flaky_test_attempts=1 \
            '--modify_execution_info=^TestRunner$=+no-remote-cache' --remote_download_outputs=minimal \
            '--remote_download_regex=.*[/]testlogs/.*/test[.](xml|log)$' --build_event_json_file="$work/events" \
            //test/syscalls:fifo_test_native //test/syscalls:fifo_test_runsc_systrap_directfs \
            //test/syscalls:fifo_test_runsc_systrap_shared //pkg/sentry/kernel/pipe:pipe_test \
            //pkg/sentry/kernel/pipe:pipe_nogo //pkg/sentry/kernel/pipe:pipe_test_nogo > "$work/console" 2>&1 || code=$?
          echo "$code" > "$work/exit"
      - name: Check every original result without the client credential
        if: always() && !cancelled()
        run: |
          set -eu
          work="$RUNNER_TEMP/fifo"
          test ! -e "$work/private.rc"
          if [[ "$(docker inspect --format '{{.State.Running}}' fifo-gnu 2>/dev/null || true)" = true ]]; then
            docker exec --user "$(id -u):$(id -g)" fifo-gnu python3 -IB "$work/fifo_revision.py" "$work"
          else
            python3 -IB "$work/fifo_revision.py" "$work"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: fifo-ring-locks
          path: ${{ runner.temp }}/fifo/result.json
          retention-days: 14
          if-no-files-found: error
