name: Observe native seccomp reporting on the mixed cmd workers
on:
  push:
    branches: [qualification/mixed-cmd-tsync-control]
permissions: {contents: read}
jobs:
  observe:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the original source and the two original cmd TestRunners
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = f6d6788e84731673a155c9fff6f28b8624e34c50
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/mixed_tsync.py' ':!runsc/cmd/BUILD' ':!runsc/cmd/bootposture_test.go' ':!runsc/cmd/tsync_observer_test.go' ':!test/syscalls/linux/seccomp.cc'
          w="$RUNNER_TEMP/mixed-tsync"
          mkdir -m 700 "$w"
          printf '{"source":"%s","carrier":"%s","verified":false}\n' "$(git rev-parse HEAD^)" "$(git rev-parse HEAD)" > "$w/receipt.json"
          cp .github/qualification/mixed_tsync.py "$w/"
          donor=eec8914ee486c04cc2e53e41d79ba32022e85ceb
          GIT_TERMINAL_PROMPT=0 git fetch -q --depth=1 https://github.com/tamird/gvisor.git "$donor"
          git show "$donor:.github/qualification/native_graph.py" > "$w/native_graph.py"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $w/bazel" | sha256sum -c -
          chmod 700 "$w/bazel"
          test "$(cat .bazelversion)" = 9.3.1
          python3 -EsB "$w/mixed_tsync.py" graph
      - name: Run both native workers once, including every TestBootPosture mode
        timeout-minutes: 44
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          : "${BUILDBUDDY_API_KEY:?missing fork key}"
          w="$RUNNER_TEMP/mixed-tsync"
          rc="$w/remote.rc"
          trap 'rm -f "$rc"' EXIT
          cat > "$rc" <<'RC'
          build:source-presubmit-mixed --remote_executor=grpcs://remote.buildbuddy.io
          build:source-presubmit-mixed --remote_cache=grpcs://remote.buildbuddy.io
          build:source-presubmit-mixed --bes_backend=grpcs://remote.buildbuddy.io
          build:source-presubmit-mixed --bes_results_url=https://app.buildbuddy.io/invocation/
          RC
          printf 'build:source-presubmit-mixed --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          unset BUILDBUDDY_API_KEY
          python3 -EsB "$w/mixed_tsync.py" execute
      - name: Verify the original attempts and report bounded observations
        if: always() && !cancelled()
        run: |
          w="$RUNNER_TEMP/mixed-tsync"
          test ! -e "$w/remote.rc"
          python3 -EsB "$w/mixed_tsync.py" collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: mixed-cmd-tsync-control
          path: ${{ runner.temp }}/mixed-tsync/receipt.json
          if-no-files-found: error
          retention-days: 7
