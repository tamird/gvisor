name: Recover the exact coverage release binaries
on:
  push:
    branches: [qualification/pr16507-sentry-output-recovery]
permissions: {contents: read}
jobs:
  recovery:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 183
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind the original sources and Linux coordinator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7f56b080d9f7485957f3514133ffa5f5490a6185
          test "$(git rev-parse HEAD^^)" = f51a205a8f4afbc5ab41aded070df74951b081ea
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/coverage_recovery/'
          test "$(uname -m)" = aarch64
          work="$RUNNER_TEMP/pr16507-coverage"
          mkdir -m 700 "$work" "$work/worker"
          cp .github/qualification/coverage_recovery/*.py "$work/"
          git checkout --detach HEAD^
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --max-time 90 --proto '=https' --proto-redir '=https' https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-arm64 -o "$work/bazel"
          echo "bb608519a440d45d10304eb684a73a2b6bb7699c5b0e5434361661b25f113a5d  $work/bazel" | sha256sum -c -
          chmod 500 "$work/bazel"
          printf '%s\n' 'module(name="rebased_workers")' >"$work/worker/MODULE.bazel"
          cat > "$work/worker/BUILD" <<'BUILD'
          package(default_visibility = ["//visibility:public"])
          platform(
              name = "gnu_amd64",
              constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
              exec_properties = {
                  "Arch": "amd64",
                  "OSFamily": "linux",
                  "workload-isolation-type": "firecracker",
                  "container-image": "docker://gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a",
              },
          )
          platform(
              name = "native_arm64",
              constraint_values = ["@platforms//cpu:aarch64", "@platforms//os:linux"],
              exec_properties = {
                  "Arch": "arm64",
                  "OSFamily": "linux",
                  "workload-isolation-type": "oci",
                  "container-image": "docker://docker.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02",
              },
          )
          BUILD
      - name: Recover original coverage records and two ARM64 executables
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -IB "$RUNNER_TEMP/pr16507-coverage/original.py"
      - name: Run the two original ARM64 race CLIs on native Linux
        run: python3 -B "$RUNNER_TEMP/pr16507-coverage/build.py" native
      - name: Build only the outstanding Sentry targets on the original execution platforms
        timeout-minutes: 160
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pr16507-coverage"
          rc="$work/client.rc"
          umask 077
          trap 'rm -f "$rc"' EXIT
          cat >"$rc" <<'RC'
          build --remote_executor=grpcs://remote.buildbuddy.io --remote_cache=grpcs://remote.buildbuddy.io
          build --bes_backend=grpcs://remote.buildbuddy.io --bes_results_url=https://app.buildbuddy.io/invocation/
          build --spawn_strategy=remote --noremote_local_fallback --jobs=80 --remote_timeout=10m
          build --host_platform=@rebased_workers//:gnu_amd64
          build --extra_execution_platforms=@rebased_workers//:gnu_amd64,@rebased_workers//:native_arm64
          RC
          printf 'build --inject_repository=rebased_workers=%s/worker\n' "$work" >> "$rc"
          printf 'build --remote_header=x-buildbuddy-api-key=%s\nbuild --bes_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_API_KEY:?}" "$BUILDBUDDY_API_KEY" >> "$rc"
          unset BUILDBUDDY_API_KEY
          for arch in amd64 arm64; do
            python3 -B "$work/build.py" "$arch" || printf 'Incomplete Sentry verification on %s.\n' "$arch"
          done
      - name: Assemble per-phase receipts
        if: always() && !cancelled()
        run: |
          python3 - <<'PYREPORT'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"pr16507-coverage"
          result={}
          for name in ("original","arm-native","sentry-amd64","sentry-arm64"):
              f=root/(name+".json")
              result[name]=json.loads(f.read_text()) if f.exists() else {"missing":True}
          runs=result["arm-native"].get("cases",{})
          result["verified"]=(len(runs)==2 and all(r.get("executed") and r.get("exit")==0 and r.get("runsc") for r in runs.values())
                              and all(result["sentry-"+arch].get("verified") for arch in ("amd64","arm64")))
          (root/"result.json").write_text(json.dumps(result,indent=2)+"\n")
          PYREPORT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: pr16507-coverage-recovery
          path: ${{ runner.temp }}/pr16507-coverage/result.json
          retention-days: 14
          if-no-files-found: error
      - if: always() && !cancelled()
        run: jq -e .verified "$RUNNER_TEMP/pr16507-coverage/result.json"
