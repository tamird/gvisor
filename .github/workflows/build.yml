name: Native ARM64 image consumers

"on":
  workflow_dispatch:
    inputs:
      profile:
        description: Native image consumer to run
        type: choice
        options: [fsstress, podman, podman-host, podman-host-runtime]
        default: fsstress
      archive_run:
        description: Reuse the verified image artifact from a prior run in this fork
        type: string
      directfs:
        description: Podman host runtime modes
        type: choice
        options: [both, "false"]
        default: both

permissions:
  contents: read

env:
  PRODUCT: 97c071a74524f2d2fc10f6f4768f1214381b7133
  ARCHIVE: f61319d2805ddcdfe8be464022a826609efebb73a2aadc6374724c12dab7bb4a
  IMAGE: sha256:72d5111b49aa7ec798180547d2a5e3a2855cf017acfcb98dc61bd360fef8368f
  ARCHIVE_TARGET: //images/basic:fsstress_archive
  ARCHIVE_PATH: bazel-bin/images/basic/fsstress_load_docker.tar
  IMAGE_TAG: gvisor.dev/images/basic/fsstress:latest
  TEST_TARGET: //test/fsstress:fsstress_test

jobs:
  podman-host:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/native-arm64-image-consumers-podman' && (inputs.profile == 'podman-host' || inputs.profile == 'podman-host-runtime')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      PRODUCT: 386044d6ad6446430b65e92269f5dc40f9b67737
      LOCK: ca984532b395b146a8d66b6d8f79d243665ac7ed126f93f7fca14b08c0007ea8
      TEST_TARGET: //test/podman:podman_test_arm64
      PODMAN_ALPINE_SHA256: f23115a502a379a64be824ff665a8ceb9fd17df522efc72a79ee21625afdbf8b
      DIRECTFS: ${{ inputs.directfs || 'both' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the stock host rootless Podman environment
        shell: bash
        run: .github/native-podman-fixture.sh --host-preflight
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.profile == 'podman-host-runtime'
        with:
          ref: ${{ env.PRODUCT }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.profile == 'podman-host-runtime' && inputs.archive_run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.archive_run }}
          name: native-arm64-stock-podman-reports
          path: ${{ runner.temp }}/podman-prior
      - name: Build and execute the source-bound Podman owner on the stock host
        if: inputs.profile == 'podman-host-runtime'
        working-directory: source
        shell: bash
        env:
          PRIOR_RUN: ${{ inputs.archive_run }}
        run: |
          set -euo pipefail
          [[ $(id -u) != 0 && $(uname -m) == aarch64 ]]
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf '%s  MODULE.bazel.lock\n' "$LOCK" | sha256sum -c -
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat .bazelversion)
          results="$RUNNER_TEMP/podman-results"
          mkdir "$results"
          wrapper="$GITHUB_WORKSPACE/.github/native-podman-fixture.sh --host-runtime"
          test_options=()
          if [[ -n $PRIOR_RUN ]]; then
            [[ $PRIOR_RUN == 40428705894 && $DIRECTFS == false ]]
            prior="$RUNNER_TEMP/podman-prior"
            printf '%s  %s\n' 548dda7005589bd36b9284d86ce5553c9df682f91df78ca9e4543161a540db35 "$prior/native-inputs.tar.gz" | sha256sum -c -
            mkdir test/podman/reused
            tar -C test/podman/reused -xzf "$prior/native-inputs.tar.gz"
            (cd test/podman/reused && sha256sum -c "$prior/input-sha256.txt")
            test "$(cat test/podman/reused/source.txt)" = "$PRODUCT"
            cmp test/podman/reused/smoke.sh test/podman/smoke.sh
            cmp test/podman/reused/MODULE.bazel.lock MODULE.bazel.lock
            cp "$GITHUB_WORKSPACE/.github/native-podman-reuse.BUILD" test/podman/BUILD
            cp "$prior/input-sha256.txt" "$results/reused-input-sha256.txt"
            printf '%s\n' "$PRIOR_RUN" > "$results/reused-input-run.txt"
            test_options+=(--test_env=PODMAN_SANDBOX_TMPDIR_MODE=dedicated)
          fi
          case "$DIRECTFS" in
            both) ;;
            false) test_options+=(--test_env=RUNTIME_ARGS=--directfs=false) ;;
            *) printf 'Unknown DirectFS selection: %s\n' "$DIRECTFS" >&2; exit 1 ;;
          esac
          status=0
          bazelisk test --config=aarch64 --lockfile_mode=error --strip=never \
            --strategy=GoStdlib=sandboxed --strategy=GoStdlibList=sandboxed --strategy=TestRunner=local \
            --define=gvisor_test_clock_source=calibrated --test_env=GVISOR_TEST_CLOCK_SOURCE=calibrated \
            --test_env=PODMAN_ALPINE_SHA256 --run_under="$wrapper" \
            --nocache_test_results --runs_per_test=1 --flaky_test_attempts=1 \
            --build_event_json_file="$results/bep.json" \
            --test_timeout=600 --test_output=all "${test_options[@]}" "$TEST_TARGET" || status=$?
          finished=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
          # Record the native result before collection can fail independently.
          jq -cn --arg source "$PRODUCT" --arg owner "$TEST_TARGET" --arg finished "$finished" \
            --arg selection "$DIRECTFS" --arg reused "$PRIOR_RUN" --argjson bazel "$status" \
            '{source:$source,owner:$owner,selection:$selection,reused_input_run:$reused,bazel_exit:$bazel,execution_finished:$finished}' \
            | tee "$results/native-result.json"
          printf '%s  MODULE.bazel.lock\n' "$LOCK" | sha256sum -c -
          if [[ -n $PRIOR_RUN ]]; then
            git diff --exit-code -- . ':!test/podman/BUILD'
            cmp "$GITHUB_WORKSPACE/.github/native-podman-reuse.BUILD" test/podman/BUILD
          else
            test -z "$(git status --porcelain --untracked-files=no)"
          fi
          logs=bazel-testlogs/test/podman/podman_test_arm64
          for report in test.log test.xml; do
            if [[ -f "$logs/$report" ]]; then cp "$logs/$report" "$results/$report"; fi
          done
          # Bazel may emit unpacked files or outputs.zip. Preserve either form
          # along with the native manifest.
          for directory in test.outputs test.outputs_manifest; do
            if [[ -d "$logs/$directory" ]]; then cp -a "$logs/$directory" "$results/$directory"; fi
          done
          native=false
          gofer=false
          direct=false
          if [[ -f "$results/test.log" ]]; then
            if grep -Fxq "HOST_PODMAN_IDENTITY arch=aarch64 uid=$(id -u) gid=$(id -g) cgroup=cgroup2fs" "$results/test.log"; then native=true; fi
            if [[ $(grep -Fxc 'PASS: rootless Podman directfs=false' "$results/test.log") == 1 ]]; then gofer=true; fi
            if [[ $(grep -Fxc 'PASS: rootless Podman directfs=true' "$results/test.log") == 1 ]]; then direct=true; fi
            if [[ $DIRECTFS == false && $(grep -Fxc 'PASS: rootless Podman directfs=selected' "$results/test.log") == 1 ]]; then gofer=true; fi
          fi
          jq -cn --arg source "$PRODUCT" --arg owner "$TEST_TARGET" --arg finished "$finished" --arg selection "$DIRECTFS" --arg reused "$PRIOR_RUN" \
            --arg alpinesha "$PODMAN_ALPINE_SHA256" --argjson bazel "$status" --argjson native "$native" \
            --argjson gofer "$gofer" --argjson direct "$direct" \
            '{source:$source,owner:$owner,environment:"stock-host-podman-4.9.3",selection:$selection,reused_input_run:$reused,alpine_sha256:$alpinesha,bazel_exit:$bazel,native_host:$native,directfs_false:$gofer,directfs_true:(if $selection == "both" then $direct else null end),execution_finished:$finished}' \
            | tee "$results/verdict.json"
          [[ $status == 0 && $native == true && $gofer == true && ( $DIRECTFS == false || $direct == true ) ]]
      - name: Retain source-built native inputs for focused diagnosis
        if: always() && inputs.profile == 'podman-host-runtime'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/podman-results"
          if [[ ! -x bazel-bin/release/runsc || ! -f bazel-bin/images/basic/alpine_load_docker.tar ]]; then
            printf 'The build did not produce complete native inputs.\n'
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          printf '%s  MODULE.bazel.lock\n' "$LOCK" | sha256sum -c -
          printf '%s  bazel-bin/images/basic/alpine_load_docker.tar\n' "$PODMAN_ALPINE_SHA256" | sha256sum -c -
          inputs="$RUNNER_TEMP/podman-native-inputs"
          mkdir "$inputs"
          cp -RL bazel-bin/release "$inputs/release"
          cp bazel-bin/images/basic/alpine_load_docker.tar "$inputs/alpine.tar"
          cp test/podman/smoke.sh "$inputs/smoke.sh"
          cp .bazelversion MODULE.bazel.lock "$inputs/"
          printf '%s\n' "$PRODUCT" > "$inputs/source.txt"
          # This artifact contains only explicit product outputs and source
          # records, never the checkout, environment or credential directories.
          [[ $(du -sb "$inputs" | cut -f1) -le 268435456 ]]
          (cd "$inputs" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$results/input-sha256.txt"
          tar -C "$inputs" -czf "$results/native-inputs.tar.gz" .
          sha256sum "$results/native-inputs.tar.gz"
      - name: Retain native Podman reports
        if: always() && inputs.profile == 'podman-host-runtime'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-arm64-stock-podman-reports
          path: ${{ runner.temp }}/podman-results
          if-no-files-found: error
          retention-days: 7

  image:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/native-arm64-image-consumers' && inputs.archive_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PRODUCT }}
          persist-credentials: false
      - name: Reproduce the RBE image with its GNU cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir "$RUNNER_TEMP/transfer"
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            --volume "$RUNNER_TEMP/transfer:/transfer" --env ARCHIVE --env ARCHIVE_TARGET --env ARCHIVE_PATH \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/workspace \
            --entrypoint /bin/bash \
            gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a \
            -euo pipefail -c '
              version=$(cat .bazelversion)
              if [[ "$(bazel --version)" != "bazel $version" ]]; then
                url="https://releases.bazel.build/$version/release/bazel-$version-linux-x86_64"
                curl -fsSLo /tmp/bazel "$url"
                expected=$(curl -fsSL "$url.sha256" | cut -d" " -f1)
                printf "%s  %s\n" "$expected" /tmp/bazel | sha256sum -c -
                chmod +x /tmp/bazel
                PATH=/tmp:$PATH
              fi
              test -z "$(git ls-files -- MODULE.bazel.lock)"
              flags=(--config=aarch64 -c opt --host_platform=@io_bazel_rules_go//go/toolchain:linux_amd64_cgo)
              bazel cquery "${flags[@]}" --lockfile_mode=update "$ARCHIVE_TARGET"
              sha256sum MODULE.bazel.lock >/tmp/qualification-lock.sha256
              bazel build "${flags[@]}" --lockfile_mode=error "$ARCHIVE_TARGET"
              sha256sum -c /tmp/qualification-lock.sha256
              printf "%s  %s\n" "$ARCHIVE" "$ARCHIVE_PATH" | sha256sum -c -
              cp -L "$ARCHIVE_PATH" /transfer/image.tar
            '
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Transfer only the verified public-source image to the ARM runner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-arm64-image
          path: ${{ runner.temp }}/transfer/image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  runtime:
    needs: image
    if: ${{ !cancelled() && github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/native-arm64-image-consumers' && (needs.image.result == 'success' || (needs.image.result == 'skipped' && inputs.archive_run != '')) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PRODUCT }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.archive_run == ''
        with:
          name: qualified-arm64-image
          path: ${{ runner.temp }}/transfer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.archive_run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.archive_run }}
          name: qualified-arm64-image
          path: ${{ runner.temp }}/transfer
      - name: Load the verified ARM image and build the selected gVisor runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(uname -m)" = aarch64
          uname -srmo
          printf '%s  %s\n' "$ARCHIVE" "$RUNNER_TEMP/transfer/image.tar" | sha256sum -c -
          docker load --input "$RUNNER_TEMP/transfer/image.tar"
          docker tag "$IMAGE" "$IMAGE_TAG"
          test "$(docker image inspect --format '{{.Architecture}} {{.Id}}' "$IMAGE_TAG")" = "arm64 $IMAGE"
          # The release graph uses both GNU target toolchains, as in images/default/Dockerfile.
          sudo apt-get -q update
          sudo apt-get -qy install --no-install-recommends crossbuild-essential-amd64 libnuma-dev
          # Use the release rule's installed runsc and every sidecar. The daemon
          # must not fetch a sidecar from a different release.
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat .bazelversion)
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          bazelisk cquery --config=aarch64 -c opt --lockfile_mode=update "set(//:release $TEST_TARGET)"
          sha256sum MODULE.bazel.lock >"$RUNNER_TEMP/qualification-lock.sha256"
          bazelisk build --config=aarch64 -c opt --lockfile_mode=error \
            --strategy=GoStdlib=sandboxed --strategy=GoStdlibList=sandboxed //:release
          runtime_dir="$RUNNER_TEMP/gvisor-runtime"
          mkdir -m 755 "$runtime_dir"
          cp -RL bazel-bin/release/. "$runtime_dir"
          for executable in "$runtime_dir"/{runsc,gvisor-bin/*}; do
            readelf -h "$executable" | grep -E 'Machine: +AArch64$'
            sha256sum "$executable"
          done
          sudo "$runtime_dir/runsc" install --runtime=qualification-images \
            --download-sidecars=NEVER --require-sidecars=ALWAYS -- --platform=systrap
          sudo systemctl reload docker
          for ((n=0; n<30; n++)); do
            if docker info --format '{{json .Runtimes}}' | jq -e 'has("qualification-images")' >/dev/null; then break; fi
            sleep 1
          done
          docker info --format '{{json .Runtimes}}' | jq -e --arg binary "$runtime_dir/runsc" '.["qualification-images"].path == $binary'
          # The original fsstress suite checks exit and output. Also observe the
          # files: a worker that sees PID 1 as its parent can silently do no work.
          directory="$RUNNER_TEMP/fsstress-files"
          mkdir -m 777 "$directory"
          docker run --rm --runtime=qualification-images --mount="type=bind,src=$directory,dst=/test" \
            "$IMAGE" -d /test -n 4 -p 2 -s 1 -z -f creat=1 -c -X -v
          diff -u <(printf '%s 0\n' p{0,1}/f{0,1,2,3}) \
            <(cd "$directory" && find . -type f -printf '%P %s\n' | LC_ALL=C sort)
      - name: Execute the consumer and reconcile its named results
        shell: bash
        run: |
          set -euo pipefail
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat .bazelversion)
          status=0
          bazelisk test --config=aarch64 -c opt --lockfile_mode=error \
            --strategy=GoStdlib=sandboxed --strategy=GoStdlibList=sandboxed \
            --strategy=TestRunner=local --nocache_test_results --runs_per_test=1 \
            --flaky_test_attempts=1 --test_env=GO_TEST_WRAP_TESTV=1 --test_timeout=900 \
            --test_output=all --test_arg=-runtime=qualification-images "$TEST_TARGET" || status=$?
          export BAZEL_EXIT="$status" FINISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from xml.etree import ElementTree

          expected = {"TestFsstressGofer", "TestFsstressGoferShared", "TestFsstressTmpfs"}
          reports = Path("bazel-testlogs/test/fsstress/fsstress_test")
          results = {}
          if (reports / "test.xml").is_file():
              for case in ElementTree.parse(reports / "test.xml").iter("testcase"):
                  name = case.attrib["name"]
                  if name in results:
                      raise SystemExit(f"Duplicate test record: {name}")
                  results[name] = next((child.tag for child in case if child.tag in {"skipped", "failure", "error"}), "pass")
          log = (reports / "test.log").read_text() if (reports / "test.log").is_file() else ""
          executions = log.count("Repro: docker run --rm --runtime=qualification-images")
          passed = (os.environ["BAZEL_EXIT"] == "0" and set(results) == expected
                    and all(result == "pass" for result in results.values()) and executions == len(expected))
          print("IMAGE_VERDICT " + json.dumps({
              "status": "PASS" if passed else "FAIL", "source": os.environ["PRODUCT"],
              "target": os.environ["TEST_TARGET"], "image": os.environ["IMAGE"], "archive": os.environ["ARCHIVE"],
              "architecture": os.uname().machine, "kernel": os.uname().release, "runtime": "systrap",
              "cases": results, "missing": sorted(expected - results.keys()), "runtimeInvocations": executions,
              "bazelExit": int(os.environ["BAZEL_EXIT"]), "executionFinished": os.environ["FINISHED_AT"],
              "verdictAt": datetime.now(timezone.utc).isoformat(),
          }, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PY
          sha256sum -c "$RUNNER_TEMP/qualification-lock.sha256"
          test -z "$(git status --porcelain --untracked-files=no)"

  podman:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/native-arm64-image-consumers-podman' && inputs.profile == 'podman'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      PRODUCT: 386044d6ad6446430b65e92269f5dc40f9b67737
      LOCK: ca984532b395b146a8d66b6d8f79d243665ac7ed126f93f7fca14b08c0007ea8
      TEST_TARGET: //test/podman:podman_test_arm64
      PODMAN_FIXTURE: us-central1-docker.pkg.dev/gvisor-presubmit/gvisor-presubmit-images/basic/podmantest_aarch64@sha256:423781ce282367175283f69e85dbce58c03c075451eb5b2821b52cd795546edf
      PODMAN_ALPINE_SHA256: f23115a502a379a64be824ff665a8ceb9fd17df522efc72a79ee21625afdbf8b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PRODUCT }}
          path: source
          persist-credentials: false
      - name: Prepare the declared native rootless fixture
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          uname -srmo
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf '%s  MODULE.bazel.lock\n' "$LOCK" | sha256sum -c -
          grep -F "docker://$PODMAN_FIXTURE" test/podman/defs.bzl
          if [[ ! -c /dev/net/tun ]]; then sudo modprobe tun; fi
          if [[ ! -c /dev/fuse ]]; then sudo modprobe fuse; fi
          [[ -c /dev/net/tun && -c /dev/fuse ]]
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          docker pull --platform=linux/arm64 "$PODMAN_FIXTURE"
          test "$(docker image inspect --format '{{.Architecture}}' "$PODMAN_FIXTURE")" = arm64
      - name: Check rootless namespace setup before compiling
        shell: bash
        run: |
          set -euo pipefail
          started=$(date --iso-8601=seconds)
          status=0
          "$GITHUB_WORKSPACE/harness/.github/native-podman-fixture.sh" --preflight || status=$?
          # Read only the kernel's namespace/security records from this probe.
          sudo journalctl --dmesg --since "$started" --no-pager --output=short-iso \
            --grep='apparmor|uid_map|newuidmap|userns' || printf 'Kernel audit excerpt unavailable.\n' >&2
          exit "$status"
      - name: Install the declared GNU cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -q update
          sudo apt-get -qy install --no-install-recommends crossbuild-essential-amd64 libnuma-dev
      - name: Build and execute the actual ARM64 Podman Bazel owner
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat .bazelversion)
          wrapper="$GITHUB_WORKSPACE/harness/.github/native-podman-fixture.sh"
          status=0
          bazelisk test --config=aarch64 --lockfile_mode=error --strip=never \
            --strategy=GoStdlib=sandboxed --strategy=GoStdlibList=sandboxed --strategy=TestRunner=local \
            --define=gvisor_test_clock_source=calibrated --test_env=GVISOR_TEST_CLOCK_SOURCE=calibrated \
            --test_env=PODMAN_FIXTURE --test_env=PODMAN_ALPINE_SHA256 \
            --run_under="$wrapper" --nocache_test_results --runs_per_test=1 --flaky_test_attempts=1 \
            --test_timeout=600 --test_output=all "$TEST_TARGET" || status=$?
          printf '%s  MODULE.bazel.lock\n' "$LOCK" | sha256sum -c -
          test -z "$(git status --porcelain --untracked-files=no)"
          log=bazel-testlogs/test/podman/podman_test_arm64/test.log
          native=false
          gofer=false
          direct=false
          if [[ -f $log ]]; then
            if grep -Fxq 'FIXTURE_IDENTITY arch=aarch64 uid=1338 gid=1337 cgroup=cgroup2fs' "$log"; then native=true; fi
            if [[ $(grep -Fxc 'PASS: rootless Podman directfs=false' "$log") == 1 ]]; then gofer=true; fi
            if [[ $(grep -Fxc 'PASS: rootless Podman directfs=true' "$log") == 1 ]]; then direct=true; fi
          fi
          jq -cn --arg source "$PRODUCT" --arg owner "$TEST_TARGET" --arg fixture "$PODMAN_FIXTURE" \
            --arg alpinesha "$PODMAN_ALPINE_SHA256" --argjson bazel "$status" --argjson native "$native" \
            --argjson gofer "$gofer" --argjson direct "$direct" \
            '{source:$source,owner:$owner,fixture:$fixture,alpine_sha256:$alpinesha,bazel_exit:$bazel,nonroot_fixture:$native,directfs_false:$gofer,directfs_true:$direct}'
          [[ $status == 0 && $native == true && $gofer == true && $direct == true ]]
