name: Check release staging across builder and publisher cache mounts
"on":
  push:
    branches: [qualification/release-publisher-signed-cache]
permissions: {}
jobs:
  release:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Prepare the public source, released Bazel, isolated cache and disposable signing environment
        id: prepare
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/release-stage-handoff"
          mkdir -p "$w"/{src,host-cache,fixture-home/.local/bin,public,bin}
          echo "RELEASE_TEST=$w" >> "$GITHUB_ENV"
          cd "$w/src"
          git init -q
          git fetch -q --depth=3 --no-tags https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          product=6cbcb14d9706952a5ad4fc4ba00cf88e54af9d0b
          test "$(git rev-parse "$GITHUB_SHA^")" = "$product"
          test "$(git diff --name-only "$product" "$GITHUB_SHA")" = "$(printf '%s\n' .github/qualification/release_stage_handoff.py .github/workflows/build.yml)"
          git show "$GITHUB_SHA:.github/qualification/release_stage_handoff.py" > "$w/check.py"
          git checkout -q --detach "$product"
          test "$(cat .bazelversion)" = 9.3.1
          curl -fsSL --retry 3 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bin/bazel"
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel' | (cd "$w/bin" && sha256sum -c)
          chmod 0755 "$w/bin/bazel"
          sudo apt-get -q -o Acquire::Retries=2 update
          sudo apt-get -q -o Acquire::Retries=2 install -y dpkg-sig apt-utils
          docker network create release-fixture
          docker run -d --name cache --network release-fixture \
            buchgr/bazel-remote-cache@sha256:4f4da688e2ae53342d5852802270e711924e597511e333d43c65dfe532876fa4 --max_size 3
          docker run -d --name builder --network release-fixture -w "$w/src" \
            -e HOME="$w/fixture-home" -e USER=runner -e RELEASE_TEST="$w" \
            -e PATH="$w/fixture-home/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            -v "$w/src:$w/src" -v "$w/host-cache:$w/fixture-home/.cache/bazel" \
            -v "$w/fixture-home/.local/bin:$w/fixture-home/.local/bin:ro" \
            -v "$w/bin/bazel:/usr/local/bin/bazel:ro" \
            buildpack-deps@sha256:cba7fa3c133e3110d747518182a10a8f969691e6788abea5f454ce7f83de1542 sleep infinity
          docker exec builder bash -eu -c 'getent group "$2" >/dev/null || groupadd -g "$2" runner; getent passwd "$1" >/dev/null || useradd --no-create-home -u "$1" -g "$2" -d "$HOME" runner; chown "$1:$2" "$HOME" "$HOME/.cache"; command -v python3; command -v gcc; command -v git' -- "$(id -u)" "$(id -g)"
          docker exec --user "$(id -u):$(id -g)" builder curl -fsS --retry 3 --retry-connrefused http://cache:8080/status > "$w/public/initial-cache.json"
          { git rev-parse HEAD; docker exec builder bazel --version; docker inspect --format '{{json .Mounts}}' builder; } > "$w/public/inputs.txt"
      - name: Exercise the production caller, deb signer, relocated cache, remote downloads and stale wheel controls
        run: |
          set -euo pipefail
          cd "$RELEASE_TEST/src"
          export HOME="$RELEASE_TEST/fixture-home"
          export PATH="$HOME/.local/bin:$PATH"
          python3 -IB "$RELEASE_TEST/check.py" > "$RELEASE_TEST/public/check.log" 2>&1 || { tail -125 "$RELEASE_TEST/public/check.log"; exit 1; }
      - name: Exercise tagged nightly, historical nonrelease and master through the same reused directory
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd "$RELEASE_TEST/src"
          export HOME="$RELEASE_TEST/fixture-home"
          export PATH="$HOME/.local/bin:$PATH"
          python3 -IB "$RELEASE_TEST/check.py" variants > "$RELEASE_TEST/public/variants.log" 2>&1 || { tail -50 "$RELEASE_TEST/public/variants.log"; exit 1; }
      - name: Inspect each physical manifest path and recover the direct Debian control members
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd "$RELEASE_TEST/src"
          export HOME="$RELEASE_TEST/fixture-home"
          export PATH="$HOME/.local/bin:$PATH"
          python3 -IB "$RELEASE_TEST/check.py" evidence > "$RELEASE_TEST/public/resolution.log" 2>&1 || { tail -80 "$RELEASE_TEST/public/resolution.log"; exit 1; }
      - name: Retain the copy, signatures, cache, promotion records and raw Debian control members
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staged-release-handoff
          path: ${{ runner.temp }}/release-stage-handoff/public
          if-no-files-found: error
          retention-days: 14
