name: Verify the original plugin archive and build helper
on:
  push:
    branches: [qualification/plugin-original-outputs]
permissions:
  contents: read
  actions: read
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Fetch the pinned original receipt and existing CAS reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/plugin-evidence"
          echo '{"status":"INCOMPLETE","phase":"bootstrap","rerun":false}' > "$RUNNER_TEMP/plugin-evidence/result.json"
          gh api repos/tamird/gvisor/actions/artifacts/13106771278/zip > "$RUNNER_TEMP/original.zip"
          echo "65ef7cf33fb432d22307ef33b5775efab008c1702b67573d3dd30d380be57d72  $RUNNER_TEMP/original.zip" | sha256sum -c -
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "bdb65b4bddb8405a80b3e45a3ef4c740819b151d0709d360e8add8dac534c224  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
      - name: Read only the original successful action
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B test/rbe/plugin_programs/recover_outputs.py
      - name: Check the typed evidence boundary
        id: privacy
        if: always()
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "plugin-evidence"
          files = list(folder.iterdir())
          assert {f.name for f in files} == {"result.json"}
          for f in files:
              assert f.is_file() and not f.is_symlink() and f.stat().st_size < 100000
              data = f.read_bytes()
              json.loads(data)
              assert os.environ["KEY"] and os.environ["KEY"].encode() not in data
              assert all(marker not in data.lower() for marker in (b"authorization:", b"bearer ", b"x-buildbuddy-api-key"))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: plugin-original-outputs
          path: ${{ runner.temp }}/plugin-evidence/result.json
          if-no-files-found: error
