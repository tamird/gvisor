name: Compare GC policies on a warmed 100k-file checkpoint
on:
  push:
    branches: [qualification/gc-save-comparison]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 1, persist-credentials: false}
    - name: Prepare the immutable sources and existing GNU profile
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/gc-save"
        mkdir -p "$root/out"
        cp .github/qualification/gc-save/compare.py "$root/compare.py"
        cp runsc/container/gc_reference_test.go "$root/fixture.go"
        cp -R test/rbe/gnu_platform "$root/gnu-platform"
        git fetch -q origin 0bbcbf9de7626fcecba97f37723dce80b435d73d 79637cb45ac762b3a5de6b08d0c2e6067b16ca50
        git fetch -q https://github.com/google/gvisor.git 5068ecb10e0ca383cc00791cc4a655b7a90a626f
        test "$(git rev-parse "79637cb45^{tree}")" = 69f35f233b2dac7d6ded75f414009ad386fcd87a
        test "$(git rev-parse 5068ecb10^)" = 0bbcbf9de7626fcecba97f37723dce80b435d73d
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=gnu_qualification=$root/gnu-platform" 'build --extra_execution_platforms=@gnu_qualification//:gnu' 'build --host_platform=@gnu_qualification//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$root/remote.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name gc-coordinator --entrypoint /bin/bash --user root --privileged --cgroupns=host -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
    - name: Measure twelve balanced triplets and verify every archive
      id: measured
      run: python3 "$RUNNER_TEMP/gc-save/compare.py"
    - name: Compare the same metrics with pinned benchstat
      id: stats
      if: ${{ !cancelled() && steps.measured.outcome == 'success' }}
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/gc-save"
        git restore -- runsc/container/BUILD
        git fetch -q origin 2b51abee8530385431b7225198fdd5cd65e78696
        git checkout --quiet --detach 2b51abee8530385431b7225198fdd5cd65e78696
        docker exec gc-coordinator bazel --bazelrc="$root/remote.bazelrc" run --config=x86_64 --remote_download_outputs=toplevel @org_golang_x_perf//cmd/benchstat -- "$root/out/baseline.bench" "$root/out/reference.bench" "$root/out/proposed.bench" > "$root/out/benchstat.txt" 2> "$root/benchstat.log"
    - name: Preserve the actual phase outcomes and check the upload boundary
      id: safe
      if: always()
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        PHASES: ${{ toJSON(steps) }}
      run: |
        python3 - <<'PYTHON'
        import json, os, pathlib, re, time
        root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gc-save' / 'out'
        root.mkdir(parents=True, exist_ok=True)
        path = root / 'receipt.json'
        receipt = json.loads(path.read_text()) if path.exists() else {'status': 'INCOMPLETE', 'rows': []}
        receipt['phases'] = {k: v.get('outcome') for k, v in json.loads(os.environ['PHASES']).items()}
        receipt['collection_finished_ns'] = time.time_ns()
        path.write_text(json.dumps(receipt, indent=2) + '\n')
        allowed = {'receipt.json', 'baseline.bench', 'reference.bench', 'proposed.bench', 'benchstat.txt'}
        key = os.environ['BUILDBUDDY_API_KEY'].encode()
        for item in root.iterdir():
          assert item.name in allowed and item.is_file() and not item.is_symlink()
          data = item.read_bytes()
          assert not key or key not in data
          assert not re.search(rb'(?i)x-buildbuddy-api-key|remote_header|bes_header|Authorization:|X-Amz-Signature|X-Goog-Signature', data)
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.safe.outcome == 'success' }}
      with:
        name: gc-save-reference-comparison
        path: |
          ${{ runner.temp }}/gc-save/out/receipt.json
          ${{ runner.temp }}/gc-save/out/baseline.bench
          ${{ runner.temp }}/gc-save/out/reference.bench
          ${{ runner.temp }}/gc-save/out/proposed.bench
          ${{ runner.temp }}/gc-save/out/benchstat.txt
        if-no-files-found: error
    - name: Remove the temporary coordinator
      if: always()
      run: docker rm -f gc-coordinator >/dev/null 2>&1 || true
