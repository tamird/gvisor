name: Identify the original public builder plugin fault without rebuilding
on:
  push:
    branches: [qualification/tldk-parent-caller]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PRODUCT: 9e3e72d7316c7530a4455f1d4ebb41f60ca064e3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check exact source and open the two devices
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          mkdir -p "$RUNNER_TEMP/receipt"
          cp test/rbe/tldk_original/{recover.py,cfi-case.py,cfi-secc.py,device.py,parent-native.py} "$RUNNER_TEMP/"
          git checkout -q --detach "$PRODUCT"
          sudo env PRODUCT="$PRODUCT" RUNNER_TEMP="$RUNNER_TEMP" python3 "$RUNNER_TEMP/device.py"
          cp "$RUNNER_TEMP/traffic/device.json" "$RUNNER_TEMP/receipt/"
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Restore the original Bazel-built outputs by digest without rebuilding
        timeout-minutes: 12
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 "$RUNNER_TEMP/recover.py"
      - name: Observe only the original plugin Sentry during the existing failing case
        timeout-minutes: 22
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y python3-bpfcc python3-pyelftools "linux-headers-$(uname -r)"
          test -x /usr/bin/addr2line
          python3 "$RUNNER_TEMP/cfi-case.py"
      - name: Match the actual parent CFI ranges to its pinned libc archive
        run: |
          set -euo pipefail
          builder=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          docker pull "$builder" > /dev/null
          docker run --rm --entrypoint=dpkg-query "$builder" -W libc6 libc6-dev > "$RUNNER_TEMP/receipt/libc-version.txt"
          docker run --rm --entrypoint=cat "$builder" /usr/lib/x86_64-linux-gnu/libc.a > "$RUNNER_TEMP/qualified-native-libc.a"
          /usr/bin/python3 "$RUNNER_TEMP/parent-native.py"
      - name: Retain only verified digests, named case verdicts and redacted error excerpts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tldk-public-parent-caller
          path: ${{ runner.temp }}/receipt
          if-no-files-found: error
