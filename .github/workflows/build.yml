name: Check cumulative ACK credit on ordinary TCP routes
on:
  push:
    branches: [qualification/tcp-cumulative-ack-wire-credit]
permissions: {}
jobs:
  migration:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Bind the conservative prototype, source correction and identical packet fixture
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tcp-ack-wire"
          mkdir -p "$work/results"
          git init -q
          git -c gc.auto=0 fetch -q --no-auto-maintenance --no-tags --depth=4 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git switch -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 52504cbac108b8e55e2ef813a301364681bd5ba3
          test "$(git rev-parse HEAD^^)" = 679d14eed77a4ce6029065d88248c8ce0902c270
          test "$(git rev-parse HEAD^^{tree})" = ae1eea82e28e5c44494995901999beaac3b857af
          test "$(git rev-parse HEAD:pkg/tcpip/transport/tcp/test/e2e/tcp_migration_test.go)" = 6adcec0f362a5d6bf753cbd2314f6c8ab6c4edd7
          printf '%s\n' .github/qualification/tcp_ack_wire_credit.py .github/workflows/build.yml pkg/tcpip/transport/tcp/test/e2e/tcp_migration_test.go | diff - <(git diff --name-only HEAD^ HEAD)
          printf '%s\n' pkg/tcpip/transport/tcp/rack.go pkg/tcpip/transport/tcp/rack_test.go pkg/tcpip/transport/tcp/sack_recovery.go pkg/tcpip/transport/tcp/snd.go | diff - <(git diff --name-only HEAD^^ HEAD^)
          cp .github/qualification/tcp_ack_wire_credit.py "$work/report.py"
          test "$(cat .bazelversion)" = 9.3.1
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$work/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $work/bazel" | sha256sum -c -
          chmod 700 "$work/bazel"
      - name: Exercise both real TCP owners with the same restored peer
        timeout-minutes: 48
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" python3 -B "$RUNNER_TEMP/tcp-ack-wire/report.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: tcp-cumulative-ack-wire-credit
          path: ${{ runner.temp }}/tcp-ack-wire/results/
          if-no-files-found: error
          retention-days: 14
