name: Count actual callback producers on the existing checkpoint
on:
  push:
    branches: [qualification/state-callback-census]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: ${{ github.sha }}
      BASE: 9f19447bdd727295bbaee1d8b198ae4e52a75ce5
      SOURCE: 84b1df4afc8bfaf2a5b8fd03b4fec88be73b4007
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 3, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD)" == "$CURRENT" ]]
        test "$(git rev-parse HEAD^)" = "$SOURCE"
        test "$(git rev-parse "$SOURCE^")" = "$BASE"
        git diff --exit-code "$BASE" "$SOURCE" -- . ':!runsc/container/BUILD' ':!runsc/container/container_save_restore_test.go' ':!pkg/state/graph_decode_unsafe.go' ':!pkg/state/graph_decode_values_unsafe.go'
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /var/run/docker.sock:/var/run/docker.sock -v "$(command -v docker):/usr/local/bin/docker:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Preserve the established comparison helper outside the source tree
      run: |
        mkdir -p "$RUNNER_TEMP/pair/records"
        cp test/rbe/callback_census/run.py "$RUNNER_TEMP/pair/run.py"
    - name: Run the two existing state suites
      id: positive
      run: python3 "$RUNNER_TEMP/pair/run.py" positive
    - name: Build the ordinary checkpoint benchmark
      id: compiled
      run: python3 "$RUNNER_TEMP/pair/run.py" prepare
    - name: Capture and restore the existing 50,000-file native workload once
      id: live
      run: python3 "$RUNNER_TEMP/pair/run.py" native
    - name: Count actual registrations and producer batches on that checkpoint
      id: census
      run: python3 "$RUNNER_TEMP/pair/run.py" census
    - name: Record the independent phase outcomes
      if: always()
      env:
        STEP_RESULTS: ${{ toJSON(steps) }}
      run: |
        python3 - <<'PYTHON'
        import json, os, pathlib, time
        out=pathlib.Path(os.environ["RUNNER_TEMP"])/"pair"/"records"
        out.mkdir(parents=True,exist_ok=True)
        phases=json.loads(os.environ["STEP_RESULTS"])
        outcomes={key:phases.get(key,{}).get("outcome","missing") for key in ("positive","compiled","live","census")}
        data={"status":"PASS" if all(v=="success" for v in outcomes.values()) else ("FAIL" if "failure" in outcomes.values() else "INCOMPLETE"), "source":os.environ["SOURCE"],"baseline":os.environ["BASE"],"phases":outcomes,"verifiedAtNs":time.time_ns()}
        (out/"verdict.json").write_text(json.dumps(data,indent=2)+"\n")
        print(data)
        PYTHON
    - name: Check the explicit artifact boundary
      id: boundary
      if: always()
      env:
        BB_SECRET: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os, pathlib
        root=pathlib.Path(os.environ["RUNNER_TEMP"])/"pair"/"records"
        key=os.environ["BB_SECRET"].encode()
        for path in root.iterdir():
            if not path.is_file():continue
            data=path.read_bytes()
            assert not key or key not in data, path.name
            assert b"x-buildbuddy-api-key=" not in data, path.name
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.boundary.outcome == 'success' }}
      with:
        name: state-callback-producers
        path: ${{ runner.temp }}/pair/records/
        if-no-files-found: error
