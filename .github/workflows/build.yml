name: Inspect original mixed test-frontend failures
"on":
  push:
    branches: [qualification/mixed-presubmit-frontend-diagnostic]
permissions: {}
jobs:
  inspect:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Bind the original source and the read-only diagnostic
        run: |
          set -eu
          git init -q .
          GIT_TERMINAL_PROMPT=0 git fetch -q --depth=2 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD^)" = cb9a994e448a7af740bda67078c543b964a534ea
          git diff --exit-code FETCH_HEAD^ FETCH_HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/diagnose_frontend.py'
          git show 'FETCH_HEAD:.github/qualification/diagnose_frontend.py' > "$RUNNER_TEMP/diagnose_frontend.py"
      - name: Read three original TestRunner records and their invocation diagnostics
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          python3 -IB "$RUNNER_TEMP/diagnose_frontend.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mixed-frontend-diagnostic
          path: ${{ runner.temp }}/frontend-diagnostic.json
          if-no-files-found: error
          retention-days: 14
