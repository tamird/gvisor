name: Run the current SDK and docprocessor owners on native ARM64
on:
  push:
    branches: [qualification/current-arm64-sdk-stdlib-owner]
permissions:
  contents: read
jobs:
  sdk:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Check out the exact integration and run the Bazel suites on the agent
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/native-sdk"
          mkdir -p "$d"
          test "$(git rev-parse HEAD^^)" = 38745c527784376e0b5d915fe5ebd85e1d1385fd
          cp .github/qualification/direct_arm64_sdk.py "$d/"
          git checkout --quiet --detach HEAD^^
          test "$(cat .bazelversion)" = 8.8.1
          curl -fsSL --retry 3 --max-time 90 --proto '=https' --proto-redir '=https' https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-arm64 -o "$d/bazel"
          echo "bb608519a440d45d10304eb684a73a2b6bb7699c5b0e5434361661b25f113a5d  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          test "$("$d/bazel" --version)" = 'bazel 8.8.1'
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" DOCKER_HOST=unix:///nonexistent-sdk-docker.sock python3 -B "$d/direct_arm64_sdk.py"
      - name: Verify the allowed evidence
        if: always()
        id: evidence
        run: |
          python3 - "$RUNNER_TEMP/native-sdk/result.json" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);assert p.is_file() and not p.is_symlink() and p.stat().st_size<100000
          obj=json.loads(p.read_bytes());assert obj["source"]=="38745c527784376e0b5d915fe5ebd85e1d1385fd"
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: native-arm64-sdk-owners
          path: ${{ runner.temp }}/native-sdk/result.json
          retention-days: 7
