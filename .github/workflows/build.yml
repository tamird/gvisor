name: Checkpoint overlay poll registration
on:
  push:
    branches: [qualification/overlay-checkpoint-roundtrip]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/overlay-checkpoint-roundtrip'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      SOURCE: f1757adbd60bc2a0b53b5723bf8928d1b5970540
      NOSAVE: 5c0208b6db64a43fbdb17bdfcb9b27f8df7bfeed
      UNLOCKED: 05b0cad98a0de2f0a11053e787d826570afae680
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
        persist-credentials: false
    - name: Bind corrected source and isolated controls
      shell: bash
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^) == "$UNLOCKED" && $(git rev-parse "$UNLOCKED^") == "$NOSAVE" && $(git rev-parse "$NOSAVE^") == "$SOURCE" ]]
        mkdir -p "$RUNNER_TEMP/checker" "$RUNNER_TEMP/focused"
        cp test/rbe/overlay_cs_report.py "$RUNNER_TEMP/checker/"
    - name: Exercise guest checkpoints and owning analyzers on the matched GNU worker
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        plat=$RUNNER_TEMP/poll-gnu-platform
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        cat >"$plat/BUILD" <<BUILD
        platform(
            name = "gnu",
            constraint_values = ["@platforms//cpu:x86_64", "@platforms//os:linux"],
            exec_properties = {"Arch":"amd64", "OSFamily":"linux", "workload-isolation-type":"firecracker", "container-image":"docker://$GNU"},
            visibility = ["//visibility:public"],
        )
        BUILD
        rc=$RUNNER_TEMP/poll-gnu.bazelrc
        umask 077
        trap 'rm -f "$rc"' EXIT
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=remote' "build --inject_repository=poll_gnu_platform=$plat" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$rc"
        unset BUILDBUDDY_API_KEY
        for lane in corrected nosave nogo-amd64 unlocked nogo-arm64; do
          case "$lane" in
            nosave) revision=$NOSAVE ;;
            unlocked) revision=$UNLOCKED ;;
            *) revision=$SOURCE ;;
          esac
          git checkout --quiet --detach "$revision"
          [[ $(git rev-parse HEAD) == "$revision" && -z $(git status --porcelain --untracked-files=no) ]]
          mkdir -p "$RUNNER_TEMP/focused/$lane"
          docker run --rm --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c '
            set -euo pipefail
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
            out="$1/focused/$3"
            target=//pkg/sentry/fsimpl/overlay:overlay_nogo
            arch=x86_64
            case "$3" in
              corrected|nosave) target=//test/syscalls:epoll_test_runsc_systrap_directfs_save ;;
              nogo-arm64) arch=aarch64 ;;
            esac
            code=0
            bazel --bazelrc="$1/poll-gnu.bazelrc" test --config="$arch" -c opt --test_timeout=300 --jobs=80 --nocache_test_results --modify_execution_info="^TestRunner$=+no-remote-cache" --remote_download_outputs=toplevel --remote_download_regex=".*[/]test[.](log|xml)$" --test_sharding_strategy=disabled --build_event_json_file="$out/events.jsonl" "$target" > "$out/bazel.log" 2>&1 || code=$?
            python3 -B "$1/checker/overlay_cs_report.py" "$out" "$target" "$2" "$3" "$code"
          ' _ "$RUNNER_TEMP" "$revision" "$lane"
        done
    - name: Verify typed results
      if: always()
      run: |
        python3 - "$RUNNER_TEMP/focused" <<'PYTHON'
        from pathlib import Path
        import json, sys
        r = {f.parent.name: json.loads(f.read_text()) for f in Path(sys.argv[1]).glob("*/result.json")}
        assert set(r) == {"corrected","nosave","unlocked","nogo-amd64","nogo-arm64"}
        for mode, v in r.items():
            assert v["qualified"], (mode, v)
        PYTHON
    - name: Save typed syscall and test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: overlay-checkpoint-results
        path: ${{ runner.temp }}/focused/*/result.json
        if-no-files-found: error
