name: Measure small-segment throughput with a slow reader
on:
  push:
    branches: [qualification/paired-small-segment-pressure]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      REVIEWED: 3cd9a5d970293241934d039506f43ad55384c7fe
      BOUNDED: 54c46f4a64beab2932e314bd2122a9cd2b7dd670
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        cp test/rbe/small-segment-goodput.go.inc "$RUNNER_TEMP/fixture.inc"
        cp test/rbe/small-segment-goodput.py "$RUNNER_TEMP/samples.py"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"
    - name: Build both receivers with the identical test fixture
      run: |
        set -euo pipefail
        echo '{"status":"INCOMPLETE","stage":"building","expected":60}' > "$RUNNER_TEMP/records/verdict.json"
        mkdir "$RUNNER_TEMP/paired-inputs"
        for sha in "$REVIEWED" "$BOUNDED"; do
          git fetch --quiet --no-tags --depth=2 https://github.com/tamird/gvisor.git "$sha"
        done
        test "$(git diff --name-only "$REVIEWED" "$BOUNDED")" = "$(printf '%s\n' pkg/tcpip/transport/tcp/segment_queue.go pkg/tcpip/transport/tcp/segment_queue_test.go)"
        for name in reviewed bounded; do
          sha=$REVIEWED; if [[ "$name" == bounded ]]; then sha=$BOUNDED; fi
          git checkout --quiet --detach "$sha"
          test "$(git rev-parse HEAD)" = "$sha"
          target=//pkg/tcpip/transport/tcp/test/e2e:tcp_test
          f=pkg/tcpip/transport/tcp/test/e2e/tcp_test.go
          git diff --quiet "$REVIEWED" "$BOUNDED" -- "$f"
          cat "$RUNNER_TEMP/fixture.inc" >> "$f"
          sha256sum "$f" | cut -d" " -f1 > "$RUNNER_TEMP/records/$name.fixture"
          bzl=(docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc")
          "${bzl[@]}" build --config=x86_64 --jobs=100 --remote_download_outputs=toplevel "$target" > "$RUNNER_TEMP/$name.build" 2>&1 || { grep -E "^ERROR: .*" "$RUNNER_TEMP/$name.build" | grep -Eiv 'credential|token|api.key|remote.header|bes.header' | head -6 | cut -c1-600; exit 1; }
          bin=$("${bzl[@]}" cquery --config=x86_64 --output=files "$target" | tail -1)
          docker exec tcp-compiler cp "$bin" "$RUNNER_TEMP/paired-inputs/$name"
          git restore -- "$f"
        done
        cmp "$RUNNER_TEMP/records/reviewed.fixture" "$RUNNER_TEMP/records/bounded.fixture"
        python3 - <<'PY'
        import hashlib,json,os,pathlib
        dest=pathlib.Path(os.environ["RUNNER_TEMP"])/"paired-inputs"
        out={name:{"source":os.environ[name.upper()],"executable":hashlib.sha256((dest/name).read_bytes()).hexdigest(),"fixture":(dest.parent/"records"/(name+".fixture")).read_text().strip()} for name in ("reviewed","bounded")}
        (dest/"sources.json").write_text(json.dumps(out)+"\n")
        PY
        cp "$RUNNER_TEMP/samples.py" "$RUNNER_TEMP/paired-inputs/compare.py"
        mkdir -p test/rbe; cp -r "$RUNNER_TEMP/paired-inputs" test/rbe/paired
        cat > test/rbe/paired/BUILD <<'STAR'
        load("@rules_python//python:defs.bzl", "py_test")
        py_test(
            name = "compare",
            srcs = ["compare.py"],
            data = ["reviewed", "bounded", "sources.json"],
            size = "large",
        )
        STAR
        echo '{"status":"INCOMPLETE","stage":"paired-run","expected":60}' > "$RUNNER_TEMP/records/verdict.json"
        rc=0
        docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=100 --nocache_test_results --test_timeout=1600 --remote_download_outputs=toplevel --test_output=errors //test/rbe/paired:compare > "$RUNNER_TEMP/measure.log" 2>&1 || rc=$?
        outputs=bazel-testlogs/test/rbe/paired/compare/test.outputs
        if docker exec tcp-compiler test -s "$outputs/outputs.zip"; then
          docker exec tcp-compiler cat "$outputs/outputs.zip" > "$RUNNER_TEMP/records/samples.zip"
          unzip -p "$RUNNER_TEMP/records/samples.zip" verdict.json > "$RUNNER_TEMP/records/verdict.json"
        elif docker exec tcp-compiler test -s "$outputs/verdict.json"; then
          docker exec tcp-compiler cp -R "$outputs/." "$RUNNER_TEMP/records"
        else
          docker exec tcp-compiler cat bazel-testlogs/test/rbe/paired/compare/test.log 2>/dev/null | tail -14 || true
          grep -E "^ERROR: .*" "$RUNNER_TEMP/measure.log" | grep -Eiv 'credential|token|api.key|remote.header|bes.header' | head -5 | cut -c1-500 || true
          exit 1
        fi
        jq '{status,expected,executed:(.samples|length),median_paired_time_ratio,failure}' "$RUNNER_TEMP/records/verdict.json"
        test "$rc" = 0 && jq -e '.status == "PASS" and (.samples|length) == 60' "$RUNNER_TEMP/records/verdict.json"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: paired-small-segment-goodput
        path: ${{ runner.temp }}/records
        if-no-files-found: error
