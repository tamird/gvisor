name: ARM64 unit tests in the private 4 KiB guest
on:
  push:
    branches: [qualification/arm64-unit-private-guest]
permissions:
  contents: read
  actions: read
jobs:
  guest:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      PRODUCT: 96fadde722e14d482a62276b80237398f8b62fbf
      GUEST: 588d3e6d35225ff5425d0148d3ec468d0a4e7833
      DOCKER_BUILD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind the existing guest failure and its read-only accessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = 993c59719c5aabac80afd4a4b25aadf33ccc104e
          gh api repos/tamird/gvisor/actions/artifacts/13214466632/zip > "$RUNNER_TEMP/original.zip"
          git fetch --quiet --depth=1 origin 93de62e8d3573407bfc1ded722a0a73d80cabedc
          git show 93de62e8d3573407bfc1ded722a0a73d80cabedc:test/rbe/plugin_programs/cas_inputs.py > "$RUNNER_TEMP/cas_inputs.py"
          cp .github/qualification/arm64-unit-private-guest.py "$RUNNER_TEMP/"
      - name: Read the original guest diagnostic without running Bazel
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 "$RUNNER_TEMP/arm64-unit-private-guest.py" diagnose
      - name: Check the small publication allowlist
        id: safe
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "guest-report"
          assert (root / "receipt.json").is_file()
          for path in root.iterdir():
              assert path.name in {"receipt.json", "procumounter_test.xml", "safemount_test.xml"}
              assert path.is_file() and not path.is_symlink() and path.stat().st_size < 50000
              data = path.read_bytes()
              for key in ("BUILDBUDDY_API_KEY", "GH_TOKEN"):
                  value = os.environ[key].encode()
                  assert value and value not in data
              assert not re.search(rb"gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY", data)
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.safe.outcome == 'success'
        with:
          name: arm64-unit-private-guest
          path: ${{ runner.temp }}/guest-report/
          if-no-files-found: error
