name: Run the two source-matched gVisor packages on the private bridge
on:
  push:
    branches: [qualification/tcp-short-bridge-packaged]
permissions: {contents: read, actions: read}
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 5, persist-credentials: false}
      - name: Bind the exact original control and both official release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          carrier=d1e3f464d979d34d82fb90d07c0d740acc3344d1
          master=471d6dff5229b99208bf6fec985601067f1f9d69
          test "$(git rev-parse HEAD^)" = fd76963445760a3b8f05cddb8e9da61f98b5b62e
          test "$(git rev-parse HEAD^^)" = "$carrier"
          test "$(git rev-parse HEAD~4)" = "$master"
          git fetch --depth=1 https://github.com/google/gvisor.git refs/tags/release-20260727.0
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = 9f3e9a3fba9416ea1f5832d82923d95830479096
          mkdir -p "$RUNNER_TEMP/bridge-receipts"
          gh api repos/tamird/gvisor/actions/artifacts/13250247550/zip > "$RUNNER_TEMP/native.zip"
          gh api repos/tamird/gvisor/actions/artifacts/13252136757/zip > "$RUNNER_TEMP/packaged-original.zip"
          unset GH_TOKEN
          python3 .github/qualification/short_bridge_receipt.py packaged native-reuse current 0
          p=test/rtnetlink/linux
          git show "$carrier:$p/short_connections.py" > "$p/baseline-short.py"
          git show "$carrier:$p/bridge_test.sh" > "$p/baseline-bridge.sh"
          git diff --exit-code "$carrier" HEAD -- "$p/rtnetlink_test.sh"
          base=https://storage.googleapis.com/gvisor/releases/pool
          curl -fsSL --retry 2 "$base/20261102.0-22-g471d6dff5229/binary-amd64/runsc.deb" -o "$p/current.deb"
          curl -fsSL --retry 2 "$base/20260727.0/binary-amd64/runsc.deb" -o "$p/july.deb"
          sha256sum -c <<EOF
          9a30c8c48fcbf90b7f67fcf92abb77dd61d738c34f5e94a1937d40e001c39dec  $p/current.deb
          386bdc2196fc600b68ff8dafdd8ecdc6a8e033ecf9cfa9dfab61ec1b389da307  $p/july.deb
          EOF
          command -v ip
      - name: Run both baselines independently and then the applicable two-cell July contrast
        run: |
          set -eu
          readonly cli="$(command -v bazel)"
          run() {
            local name="$1" rel="$2"; shift 2
            local rc=0
            env -i HOME="$HOME" PATH="$PATH" USER="$USER" "$cli" test --config=x86_64 \
              --strategy=TestRunner=local --nocache_test_results --flaky_test_attempts=1 --test_timeout=640 \
              --build_tag_filters= --test_tag_filters= --build_event_json_file="$RUNNER_TEMP/$name.events" \
              "$@" "//test/rtnetlink/linux:short_bridge_$rel" > "$RUNNER_TEMP/$name.buildlog" 2>&1 || rc=$?
            printf '%s\n' "$rc" > "$RUNNER_TEMP/bridge-receipts/$name.exit"
            date --utc --iso-8601=ns > "$RUNNER_TEMP/bridge-receipts/$name.finished"
            python3 .github/qualification/short_bridge_receipt.py packaged "$name" "$rel" "$rc" || true
          }
          run current-tools current --test_env=SHORT_BRIDGE_TOOLS=1
          run july-tools july --test_env=SHORT_BRIDGE_TOOLS=1
          if python3 .github/qualification/short_bridge_receipt.py tools-ready; then
            run current-baseline current
            run july-baseline july
          fi
          if python3 .github/qualification/short_bridge_receipt.py baseline-clean; then
            run july-forward july --test_env=SHORT_BRIDGE_FOCUS=1
          fi
      - name: Verify observed outcomes only
        if: ${{ !cancelled() }}
        run: python3 .github/qualification/short_bridge_receipt.py packaged-finish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: short-bridge-packaged
          path: ${{ runner.temp }}/bridge-receipts/
          if-no-files-found: error
