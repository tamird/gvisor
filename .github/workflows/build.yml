name: Qualify the interval timer syscall test
on:
  push:
    branches: [qualification/timer-negative-interval]
permissions:
  contents: read
jobs:
  timers:
    if: github.repository == 'tamird/gvisor' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 78
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind the original full-graph tools and selected source
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/interval-timer"
          mkdir -p "$d/out"
          printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$d/out/verdict.json"
          test "$(git rev-parse HEAD^)" = f876b5047538c0bbe2de38ef3f306a2cab985aa7
          cp test/rbe/timer_interval.py "$d/"
          graph=3bba617f0027960b253684444b36044c133f930a
          donor=0a9bdf9bc331d6a66f35aefcbbb5cf466eb6f7f5
          git fetch -q --no-tags --depth=1 origin "$graph" "$donor"
          test "$(git rev-parse "$graph:.github/qualification/buildkite-client-options.py")" = 335590d65d25d0d67bb55adf7cf1df336fcbfe44
          git show "$graph:.github/qualification/buildkite-client-options.py" > "$d/continuous.py"
          test "$(git rev-parse "$donor:test/rbe/stdlib-provenance.py")" = 126ec85fbfd0c3b9595ff3a1b3b3223832e84a38
          git show "$donor:test/rbe/stdlib-provenance.py" > "$d/stdlib_provenance.py"
          git checkout -q --detach HEAD^
          test "$(git rev-parse HEAD^{tree})" = 5722c11669c8432af7288e470c222ef74312a2e3
          test "$(git rev-parse HEAD^)" = 588e6f3436b08e9b9a49e656458d9ea6178bfedd
          test "$(cat .bazelversion)" = 9.3.1
          curl --retry 3 -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          test "$("$d/bazel" --version)" = 'bazel 9.3.1'
          command -v zstd
          python3 -Bc 'import yaml'
      - name: Link and run the single named case on Linux and systrap
        run: |
          d="$RUNNER_TEMP/interval-timer"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$d" \
              GIT_TERMINAL_PROMPT=0 python3 -B "$d/timer_interval.py"
      - name: Check the bounded receipt
        if: always()
        id: privacy
        run: |
          python3 -B - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"], "interval-timer/out")
          p = root / "verdict.json"
          assert list(root.iterdir()) == [p] and not p.is_symlink() and p.is_file()
          data = p.read_bytes()
          assert 0 < len(data) < 65536 and json.loads(data)["status"] in ("PASS", "FAIL", "INCOMPLETE")
          assert not re.search(rb"(?i)authorization\s*[:=]|x-buildbuddy-api-key|github_pat_|gh[pousr]_[a-zA-Z0-9]{20,}|https?://", data)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: timer-interval
          path: ${{ runner.temp }}/interval-timer/out/verdict.json
          if-no-files-found: error
