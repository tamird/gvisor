name: Check the revised TCP timeout recovery
on:
  push:
    branches: [qualification/eifel-author-rto-threshold]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Replay the five-packet timeout and the finite flight controls
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/eifel-check"
          mkdir -m 700 "$dir"
          cp .github/qualification/eifel_check.py "$dir/"
          test "$(git rev-parse HEAD^)" = c02d0940fd57e7c31432c81164f3e58f41795286
          git fetch --quiet --depth=1 https://github.com/google/gvisor.git d0439e8b83fafeff675910fc544a393fb5d9f85c
          git checkout --detach HEAD^
          test -z "$(git status --short)"
          curl --retry 3 -fsSL --proto '=https' --proto-redir '=https' --max-time 100 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$dir/bazelisk"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $dir/bazelisk" | sha256sum -c
          chmod 755 "$dir/bazelisk"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -B "$dir/eifel_check.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eifel-author-threshold
          path: ${{ runner.temp }}/eifel-check/receipts.json
          if-no-files-found: error
          retention-days: 7
