name: Qualify final RACK flight accounting
on:
  push:
    branches: [qualification/tcp-rack-flight-final]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: c84fa4154331407fc2f16278ff94a87e05c0c501
      CONTROL: 6241e4df320ecaff3131e092fbc827aaa26a2423
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Retrieve original TCP analyzer output
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        ORIGINAL_VERDICT: test/rbe/rack-original-nogo.json
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records"
        cp test/rbe/rack-{flight-evidence,final-evidence,receipts}.py "$RUNNER_TEMP/"
        python3 "$RUNNER_TEMP/rack-final-evidence.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: rack-flight-nogo-original
        path: |
          ${{ runner.temp }}/records/flight-verdict.json
        if-no-files-found: error
