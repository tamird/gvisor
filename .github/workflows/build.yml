name: Measure proc inventory after checkpoint cache eviction
on:
  push:
    branches: [qualification/proc-dentry-checkpoint]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/proc-dentry-checkpoint'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      SOURCE: 918aefd5f3771a161013fb72873d8aa19196e1bc
      BASE: 0cf7325e46a196a3c9c8be8c7c4f8a210700a07c
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 3
        persist-credentials: false
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^1) == "$SOURCE" ]]
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Start the existing GNU Bazel coordinator
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        docker run --init -d --name overlay-guest --entrypoint /bin/bash --user root --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt systempaths=unconfined -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'

    - name: Build the unchanged upstream parent and eviction commit
      run: |
        set -euo pipefail
        test "$(git rev-parse "$SOURCE^")" = "$BASE"
        cp -R .github/qualification/proc-cache "$RUNNER_TEMP/proc-cache"
        mkdir -p "$RUNNER_TEMP/proc-cache-results"
        for arm in base current; do
          if [[ $arm == base ]]; then rev=$BASE; else rev=$SOURCE; fi
          git checkout --quiet --detach "$rev"
          test "$(git rev-parse HEAD)" = "$rev"
          git diff --exit-code HEAD
          ARM="$arm" SOURCE="$rev" python3 "$RUNNER_TEMP/proc-cache/build.py" build amd64
          git diff --exit-code HEAD
        done
    - name: Measure the same process inventory in paired fresh sandboxes
      run: |
        sudo env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" python3 "$RUNNER_TEMP/proc-cache/compare.py"
    - name: Check evidence boundary
      id: safe
      if: always()
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os, pathlib, re
        out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "proc-cache-results"
        allowed = {"base-build.json", "current-build.json", "comparison.json"}
        for path in out.iterdir():
            assert path.is_file() and not path.is_symlink() and path.name in allowed
            raw = path.read_bytes()
            key = os.environ["BUILDBUDDY_API_KEY"].encode()
            assert not key or key not in raw
            assert not re.search(b"(?i)x-buildbuddy-api-key|remote_header|bes_header|authorization:|X-Amz-Signature|X-Goog-Signature", raw)
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() && steps.safe.outcome == 'success' }}
      with:
        name: proc-dentry-checkpoint
        path: ${{ runner.temp }}/proc-cache-results/*.json
        if-no-files-found: error
    - name: Stop the GNU coordinator
      if: always()
      run: docker rm -f overlay-guest >/dev/null 2>&1 || true
