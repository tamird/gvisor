name: Build current package selections on a measured scratch worker
on:
  push:
    branches: [qualification/package-empty-worker]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 5}
      - name: Pin Bazel and the compact action log reader
        run: |
          set -eu
          export USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          echo "USE_BAZEL_VERSION=$USE_BAZEL_VERSION" >> "$GITHUB_ENV"
          command -v bazel
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "bdb65b4bddb8405a80b3e45a3ef4c740819b151d0709d360e8add8dac534c224  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
      - name: Build only the missing Go package and the native systrap stub on scratch
        env:
          BASE: ddf4c56a5ae1a1e539ec5989649930c97c26e593
          ORIGINAL: 17927b34de218b8c26b5feb834856d7d49259444
          CORRECTED: 4777b289c5a9c1ecd0a4df312fd3b02c9251cb0e
          ORIGINAL_CARRIER: c1759d39f1cecd166c0baad718d4e2473b2658c9
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          test -n "$BUILDBUDDY_API_KEY"
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --action_env=TMPDIR=.' 'build --host_action_env=TMPDIR=.'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/sidecar.bazelrc"
          unset BUILDBUDDY_API_KEY
          cp test/rbe/empty_worker/compare.py "$RUNNER_TEMP/package-compare.py"
          python3 "$RUNNER_TEMP/package-compare.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: package-empty-worker
          path: ${{ runner.temp }}/package-evidence
          if-no-files-found: error
