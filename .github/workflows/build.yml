name: Run one LLVM ARM64 release in both page-size guests
on:
  push:
    branches: [qualification/llvm-arm64-locked-page-guests]
permissions: {}
jobs:
  pair:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the candidate, the unchanged guest harness and both stock clients
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2aaaeb4b257fd9d957676a8c1b3da667dc800aec
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/paired_stub_guest.py' ':!test/rbe/paired_stub_guest'
          test "$(cat .bazelversion)" = 9.3.1
          w="$RUNNER_TEMP/paired-stub-guest"
          mkdir -m 700 "$w" "$w/dist"
          git fetch --no-tags --depth=1 https://github.com/tamird/gvisor.git ec4ced798422d27e533369b02d41b06f21b798c1
          test "$(git rev-parse FETCH_HEAD)" = ec4ced798422d27e533369b02d41b06f21b798c1
          git fetch --no-tags --depth=1 https://github.com/tamird/gvisor.git 016d0b4facc9de12033625b597a37c83ba03ca64
          test "$(git rev-parse FETCH_HEAD)" = 016d0b4facc9de12033625b597a37c83ba03ca64
          cp .github/qualification/paired_stub_guest.py test/rbe/paired_stub_guest/{harness.BUILD,guest.sh} "$w/"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 --max-time 180 -H 'Accept: application/octet-stream' https://api.github.com/repos/cerisier/glibc-headers/releases/assets/253918436 -o "$w/dist/x86_64-linux-gnu.2.28.tar.zst"
          cd "$w"
          for v in 9.3.1 8.8.1; do
            curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 "https://releases.bazel.build/$v/release/bazel-$v-linux-x86_64" -o "bazel${v%%.*}"
          done
          sha256sum -c <<'SUMS'
          7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel9
          5b5bab2095065817d3416ca9a0678bd39c10c9ede432dbe8187bfe74de285160  bazel8
          8015f4a710987439dfdcde7539b62cc5db52d2cd9456af5e2e297494f13c56f3  dist/x86_64-linux-gnu.2.28.tar.zst
          SUMS
          chmod 700 bazel8 bazel9
      - name: Materialize and verify the qualified ARM64 release and stub
        id: release
        timeout-minutes: 58
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${BUILDBUDDY_API_KEY:?existing BuildBuddy key is required}"
          w="$RUNNER_TEMP/paired-stub-guest"
          rc="$w/compiler.rc"
          trap 'rm -f "$rc"' EXIT
          cat > "$rc" <<'RC'
          build --remote_executor=grpcs://remote.buildbuddy.io
          build --remote_cache=grpcs://remote.buildbuddy.io
          build --bes_backend=grpcs://remote.buildbuddy.io
          build --bes_results_url=https://app.buildbuddy.io/invocation/
          build --spawn_strategy=remote
          build --noremote_local_fallback
          build --remote_download_outputs=toplevel
          build --remote_default_exec_properties=OSFamily=linux
          build --remote_default_exec_properties=Arch=amd64
          build --remote_default_exec_properties=workload-isolation-type=oci
          build --remote_default_exec_properties=container-image=docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
          RC
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          unset BUILDBUDDY_API_KEY
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$w/paired_stub_guest.py" release
          "$w/bazel9" --nosystem_rc --nohome_rc shutdown
      - name: Rebuild and hash-check the original GNU guest probe
        id: probe
        timeout-minutes: 12
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/paired-stub-guest"
          git checkout -q --detach 016d0b4facc9de12033625b597a37c83ba03ca64
          test "$(git rev-parse HEAD)" = 016d0b4facc9de12033625b597a37c83ba03ca64
          if ! test -x /usr/bin/aarch64-linux-gnu-g++; then
            for suite in jammy jammy-updates; do
              echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu $suite main universe"
            done > "$w/jammy.list"
            opts=(-o "Dir::Etc::sourcelist=$w/jammy.list" -o Dir::Etc::sourceparts=-)
            sudo -n apt-get "${opts[@]}" update -qq
            sudo -n apt-get "${opts[@]}" install -qq -y --no-install-recommends g++-aarch64-linux-gnu
          fi
          test "$(/usr/bin/aarch64-linux-gnu-g++ -dumpmachine)" = aarch64-linux-gnu
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 "$w/bazel9" --nosystem_rc --nohome_rc \
            build --config=aarch64 -c fastbuild --jobs=4 --lockfile_mode=off --remote_executor= --remote_cache= \
            --bes_backend= //test/rbe/paired_stub_guest:pagesize_probe
          python3 -IB "$w/paired_stub_guest.py" probe
          "$w/bazel9" --nosystem_rc --nohome_rc shutdown
          git checkout -q --detach ec4ced798422d27e533369b02d41b06f21b798c1
          test "$(git rev-parse HEAD)" = ec4ced798422d27e533369b02d41b06f21b798c1
          test "$(cat .bazelversion)" = 8.8.1
          test "$(git hash-object MODULE.bazel.lock)" = 32e3c5291e42bd48a5c283f43c5836abbdcd8896
          dst=test/rbe/paired_stub_guest
          mkdir "$dst"
          cp "$w/harness.BUILD" "$dst/BUILD"
          cp "$w/guest.sh" "$dst/guest.sh"
          chmod 755 "$dst/guest.sh"
          mv "$w/inputs" "$dst/inputs"
          git diff --exit-code
      - name: Run only the two declared TCG guests through the original fork executor
        id: guests
        timeout-minutes: 60
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${BUILDBUDDY_API_KEY:?existing BuildBuddy key is required}"
          w="$RUNNER_TEMP/paired-stub-guest"
          rc="$w/executor.rc"
          trap 'rm -f "$rc"' EXIT
          cat > "$rc" <<'RC'
          build:buildbuddy_remote_executor --remote_executor=grpcs://remote.buildbuddy.io
          build:buildbuddy_remote_executor --remote_cache=grpcs://remote.buildbuddy.io
          build:buildbuddy_remote_executor --bes_backend=grpcs://remote.buildbuddy.io
          build:buildbuddy_remote_executor --bes_results_url=https://app.buildbuddy.io/invocation/
          RC
          printf 'build:buildbuddy_remote_executor --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          printf 'build:buildbuddy_remote_executor --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          unset BUILDBUDDY_API_KEY
          outcome=0
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 \
            "$w/bazel8" --nosystem_rc --nohome_rc --host_jvm_args=-Xmx5g --bazelrc=test/rbe/qualification.bazelrc --bazelrc="$rc" \
            test --config=rbe --config=x86_64 --jobs=40 --lockfile_mode=error --keep_going \
            --nocache_test_results --runs_per_test=1 --flaky_test_attempts=1 --test_sharding_strategy=disabled \
            --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=minimal \
            '--remote_download_regex=.*[/]test[.](log|xml)$' --test_timeout=300 \
            --build_event_json_file="$w/guests.bep" --build_event_publish_all_actions \
            //test/rbe/paired_stub_guest:page4k //test/rbe/paired_stub_guest:page64k > "$w/remote.log" 2>&1 || outcome=$?
          printf '%s\n' "$outcome" > "$w/remote.exit"
          exit "$outcome"
      - name: Verify both original TestResults and the guest workload
        if: always() && !cancelled() && steps.guests.outcome != 'skipped'
        run: |
          set -eu
          w="$RUNNER_TEMP/paired-stub-guest"
          test ! -e "$w/executor.rc"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -IB "$w/paired_stub_guest.py" collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: llvm-arm64-runtime-two-page-sizes
          path: |
            ${{ runner.temp }}/paired-stub-guest/release.json
            ${{ runner.temp }}/paired-stub-guest/guests.json
            ${{ runner.temp }}/paired-stub-guest/page*-test.*
          if-no-files-found: error
          retention-days: 14
