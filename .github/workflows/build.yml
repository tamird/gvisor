name: Compare mixed futex wake and PI lock ownership on Linux and gVisor
on:
  push:
    branches: [qualification/futex-waiter-mode]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: 43267730462c437e0b0fa9d749aafcee4719de01
      STOCK: ec49b89b7bd76c8de045a6356f15713c7980333d
      REPORTER: fb60e127516defd6aab633f80be09a03022f0737
      FIXTURE: 2dbd03913fbc773a86cbeb2044cab1b55383711cf45beffef1c59da9ab204c9a
      GTESTS: SharedPrivate/PrivateAndSharedFutexTest.PIBasic/0:SharedPrivate/PrivateAndSharedFutexTest.PIBasic/1:SharedPrivate/PrivateAndSharedFutexTest.PIWaiters/0:SharedPrivate/PrivateAndSharedFutexTest.PIWaiters/1:SharedPrivate/PrivateAndSharedFutexTest.PITryLock/0:SharedPrivate/PrivateAndSharedFutexTest.PITryLock/1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        cp test/rbe/syscall_comparison.py "$RUNNER_TEMP/"
        printf '{"verified":false,"reason":"qualification incomplete"}\n' > "$RUNNER_TEMP/records/verdict.json"
        git fetch -q --no-tags --depth=1 origin "$REPORTER"
        for module in qualification_report unit_matrix; do
          git show "$REPORTER:test/rbe/$module.py" > "$RUNNER_TEMP/$module.py"
        done
        python3 -c 'import sys; sys.path.insert(0, sys.argv[1]); import qualification_report' "$RUNNER_TEMP"
        [[ "$(git rev-parse HEAD^1)" == "$CURRENT" ]]
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","EstimatedMemory":"2GB","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        git fetch --no-tags --depth=1 origin "$STOCK"
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Run the same six private and shared futex cases on Linux and both gVisor sources
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$CURRENT"
        for label in //test/syscalls:futex_test_native //test/syscalls:futex_test_runsc_systrap_directfs //pkg/sentry/kernel/futex:futex_test //pkg/sentry/kernel/futex:futex_nogo; do
          docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" query "$label" | grep -Fx "$label"
        done
        for name in current-native stock-guest current-guest; do
          src=$CURRENT
          [[ "$name" != stock-guest ]] || src=$STOCK
          testname=futex_test
          path=test/syscalls/linux/futex.cc
          filter="$GTESTS"
          executor=remote
          platform=runsc_systrap_directfs
          if [[ "$name" == current-native ]]; then executor=local; platform=native; fi
          git checkout --quiet --detach "$src"
          [[ "$(git rev-parse HEAD)" == "$src" ]]
          d=$RUNNER_TEMP/records/$name; mkdir -p "$d"
          sha256sum "$path" > "$d/fixture-sha256"
          [[ "$(cut -d' ' -f1 "$d/fixture-sha256")" == "$FIXTURE" ]]
          target="//test/syscalls:${testname}_${platform}"
          printf '%s\n' "$src" > "$d/source"; printf '%s\n' "$target" > "$d/target"
          printf '%s\n' "$executor" > "$d/executor"; printf '%s\n' "$filter" > "$d/filter"
          date -u +%FT%TZ > "$d/start"
          rc=0
          docker exec tcp-compiler timeout 13m bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=64 --verbose_failures --strategy=TestRunner="$executor" --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=all --test_timeout=600 --test_sharding_strategy=disabled --test_env=GTEST_FILTER="$filter" "$target" > "$d/bazel.log" 2>&1 || rc=$?
          grep -A5 -E 'Invocation ID:|ERROR:|error:|FAILED|Build did NOT complete' "$d/bazel.log" | head -100 > "$d/compiler-diagnostics" || true
          rm -f "$d/bazel.log"
          printf '%s\n' "$rc" > "$d/exit"; date -u +%FT%TZ > "$d/end"
          if [[ $rc != 0 && $rc != 3 ]]; then continue; fi
          for file in test.log test.xml; do
            docker exec tcp-compiler cat "bazel-testlogs/test/syscalls/${target#*:}/$file" > "$d/$file" || rm -f "$d/$file"
          done
        done
    - name: Check the owning futex suite and lock annotations
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$CURRENT"
        d=$RUNNER_TEMP/records/owners; mkdir -p "$d"
        date -u +%FT%TZ > "$d/start"
        rc=0
        docker exec tcp-compiler timeout 15m bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=4 --nocache_test_results --keep_going --build_tag_filters= --test_tag_filters= --noremote_local_fallback --test_timeout=300 --test_output=errors //pkg/sentry/kernel/futex:futex_test //pkg/sentry/kernel/futex:futex_nogo > "$d/bazel.log" 2>&1 || rc=$?
        printf '%s\n' "$rc" > "$d/exit"
        grep -A5 -E 'Invocation ID:|ERROR:|error:|FAILED|diagnostic| PASSED ' "$d/bazel.log" | tail -120 > "$d/receipt" || :
        rm -f "$d/bazel.log"
        date -u +%FT%TZ > "$d/end"
        test "$rc" -eq 0
    - name: Verify syscall assertions and the analyzer target
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/syscall_comparison.py" "$RUNNER_TEMP/records"
    - name: Redact any credential from the published records
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"]) / "records"
        key = os.environ["BB_KEY"].encode()
        for path in [root / "verdict.json", root / "owners/receipt", *root.glob("*/test.xml")]:
            if path.is_file() and key and key in (data := path.read_bytes()):
                path.write_bytes(data.replace(key, b"[REDACTED]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: futex-waiter-mode
        path: |
          ${{ runner.temp }}/records/verdict.json
          ${{ runner.temp }}/records/*/test.xml
          ${{ runner.temp }}/records/owners/receipt
          ${{ runner.temp }}/records/owners/exit
          ${{ runner.temp }}/records/native-kernel
        if-no-files-found: error
