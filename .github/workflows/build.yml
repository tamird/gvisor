name: Verify proc boot identity across user namespaces and checkpoint restore
on:
  push:
    branches: [qualification/proc-boot-id-fixed]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/proc-boot-id-fixed'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      SOURCE: 62f0c7351e592cedd02c12a29a50691edd63496c
      FIX_PRODUCT: 4ff4f3d6a33db001cc080e44e81604427b7b9784
      BASE: 2947fd836335a4318d2797c939a9a12be53cf3b1
      STOCK_PRODUCT: 25172e526f45929759a44e174e617c320df1ad58
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
        persist-credentials: false
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^1) == "$SOURCE" ]]
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Start the existing GNU Bazel coordinator
      timeout-minutes: 8
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name overlay-guest --entrypoint /bin/bash --user root --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'

    - name: Verify the exact product and identical syscall fixture
      run: |
        set -eu
        cp .github/qualification/boot-identity-*.py "$RUNNER_TEMP/"
        mkdir -p "$RUNNER_TEMP/gnu-platform"
        cp "$RUNNER_TEMP/overlay-gnu/BUILD" "$RUNNER_TEMP/gnu-platform/"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        umask 077
        sed -e '/^build --inject_repository=/s/poll_gnu_platform/tcp_gnu/g' \
            -e '/^build --inject_repository=/s@/overlay-gnu@/gnu-platform@g' \
            -e '/^build --host_platform=/s/poll_gnu_platform/tcp_gnu/g' \
            -e '/^build --extra_execution_platforms=/s/poll_gnu_platform/tcp_gnu/g' \
            "$RUNNER_TEMP/overlay.bazelrc" > "$RUNNER_TEMP/syscall.bazelrc"
        docker exec overlay-guest sh -c 'command -v timeout && gcc -dumpfullversion && nproc'
        awk '/^(MemTotal|MemAvailable):/{print}' /proc/meminfo

        mkdir -p "$RUNNER_TEMP/boot-identity-results"
        test "$(git rev-parse HEAD^1)" = "$SOURCE"
        test "$(git rev-parse HEAD^2)" = "$BASE"
        test "$(git rev-parse "$SOURCE^")" = "$FIX_PRODUCT"
        test "$(git rev-parse "$BASE^")" = "$STOCK_PRODUCT"
        git diff --exit-code "$SOURCE" "$FIX_PRODUCT" -- . ':(exclude)test/rbe/boot_identity/**'
        git diff --exit-code "$BASE" "$STOCK_PRODUCT" -- . ':(exclude)test/rbe/boot_identity/**' ':(exclude)test/syscalls/linux/mount.cc'
        git diff --exit-code "$SOURCE" "$BASE" -- test/rbe/boot_identity/ test/syscalls/linux/mount.cc
    - name: Test proc and its package and test Nogo owners
      if: ${{ !cancelled() }}
      timeout-minutes: 79
      run: |
        git checkout --quiet --detach "$SOURCE"
        python3 "$RUNNER_TEMP/boot-identity-cases.py" owners
    - name: Reuse the five completed results and retain the interrupted original owner receipt
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        prior="$RUNNER_TEMP/proc-boot-id-41196058784.zip"
        gh api repos/tamird/gvisor/actions/artifacts/13041913658/zip > "$prior"
        printf '%s  %s\n' '639fb1088d50e5a3f8ab25164ac5dc8d867f88783c12350418165d180b03f437' "$prior" | sha256sum -c -
        python3 - <<'REUSE'
        import json, os, zipfile
        from pathlib import Path
        tmp=Path(os.environ["RUNNER_TEMP"])
        dest=tmp/"boot-identity-results"
        with zipfile.ZipFile(tmp/"proc-boot-id-41196058784.zip") as z:
            summary=json.loads(z.read("summary.json"))
            assert summary["products"]=={"fixed":os.environ["FIX_PRODUCT"],"stock":os.environ["STOCK_PRODUCT"]}
            assert summary["failures"]==["owners"] and not summary["missing"] and not summary["skips"]
            for name in ("fixed-build","restore","native","stock","fixed"):
                payload=z.read(name+".json")
                record=json.loads(payload)
                assert record.get("status",record.get("result"))=="PASS"
                (dest/(name+".json")).write_bytes(payload)
            (dest/"owners-interrupted.json").write_bytes(z.read("owners.json"))
        REUSE
    - name: Reconcile every original result
      if: ${{ !cancelled() }}
      run: |
        python3 - <<'VERDICT'
        import datetime, json, os
        from pathlib import Path
        d=Path(os.environ["RUNNER_TEMP"])/"boot-identity-results"
        expected=["native","stock","fixed","fixed-build","restore","owners"]
        arms={k:json.loads((d/(k+".json")).read_text()) for k in expected if (d/(k+".json")).exists()}
        missing=sorted(set(expected)-set(arms))
        failures=[k for k,v in arms.items() if v.get("status",v.get("result"))!="PASS"]
        skips={k:v["skips"] for k,v in arms.items() if v.get("skips")}
        same_fixture=len({arms[k].get("fixture_sha256") for k in ("native","stock","fixed") if k in arms})==1
        if not same_fixture: failures.append("fixture mismatch")
        r=dict(retained_behavior_run="41196058784",retained_behavior_artifact="13041913658",previous_run="41189369463",previous_artifact="13041031559",previous_syscalls_executed=0,expected=expected,executed=list(arms),missing=missing,failures=failures,skips=skips,
               products={arm:os.environ[key] for arm,key in (("stock","STOCK_PRODUCT"),("fixed","FIX_PRODUCT"))},
               same_mount_fixture=same_fixture,status="FAIL" if failures or skips or missing else "PASS",
               execution_finished_at=max((v.get("execution_finished_at",v.get("recorded","")) for v in arms.values()),default=None),
               verdict_available_at=datetime.datetime.now(datetime.UTC).isoformat())
        (d/"summary.json").write_text(json.dumps(r,indent=2)+"\n")
        print(json.dumps(r))
        if r["status"]!="PASS": raise SystemExit(1)
        VERDICT
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: proc-boot-id-fixed
        path: ${{ runner.temp }}/boot-identity-results
        if-no-files-found: error
