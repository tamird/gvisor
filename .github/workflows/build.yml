name: Verify TCP checksum start with IPv4 and IPv6 options
on:
  push:
    branches: [qualification/tcp-experiment-gso-offset]
permissions: {}
jobs:
  wire:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Bind the isolated checksum change and native Bazel
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mtu-wire"
          mkdir -m 700 "$work" "$work/out"
          echo '{"verified":false,"stage":"setup"}' > "$work/out/result.json"
          git init -q
          git fetch --no-tags --no-auto-maintenance --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          git switch -q --detach "$GITHUB_SHA"
          base=7d1b049f5d541992b47cc38cf564025908a9ed7b
          product=27e1cb29525c5c182066600391bc150a9aa14421
          test "$(git rev-parse HEAD^)" = "$product"
          test "$(git rev-parse "$product^")" = "$base"
          test "$(git rev-parse "$product^{tree}")" = 6d9218bf77f684b47c98e355000e1dec88458c29
          git diff --exit-code "$base" "$product" -- . ':!pkg/tcpip/network/ipv4/ipv4.go' ':!pkg/tcpip/network/ipv6/ipv6.go' ':!pkg/tcpip/transport/tcp/endpoint.go' ':!pkg/tcpip/transport/tcp/testing/context/context.go' ':!pkg/tcpip/transport/tcp/test/e2e/tcp_test.go'
          git diff --exit-code "$product" HEAD -- . ':!.github/qualification/tcp_path_mtu' ':!.github/workflows/build.yml'
          cp .github/qualification/tcp_path_mtu/* "$work/"
          git switch -q --detach "$product"
          test "$(cat .bazelversion)" = 9.3.1
          mkdir test/tcp_path_mtu_qualification
          cp "$work"/{BUILD,wire_test.go} test/tcp_path_mtu_qualification/
          chmod 700 "$work/netns.sh"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$work/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $work/bazel" | sha256sum -c -
          chmod 700 "$work/bazel"
      - name: Native TestRunner with two private veth ends and zero external routes
        run: |
          set -eu
          env -i HOME="$HOME" USER="$USER" PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" python3 -B "$RUNNER_TEMP/mtu-wire/qualify.py"
      - name: Existing IPv4 and IPv6 socket and raw fdbased contract cases
        if: always() && !cancelled()
        run: |
          set -eu
          env -i HOME="$HOME" USER="$USER" PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" python3 -B "$RUNNER_TEMP/mtu-wire/controls.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: tcp-experiment-gso-offset
          path: ${{ runner.temp }}/mtu-wire/out
          if-no-files-found: error
          retention-days: 14
