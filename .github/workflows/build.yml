name: Test abstract Unix sockets across network namespace restore
on:
  push:
    branches: [qualification/pr14338-unix-restore]
permissions: {}
jobs:
  consumer-tests:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Bind the fallback and public Linux inputs
        id: bootstrap
        timeout-minutes: 13
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/netip-wildcard"
          mkdir -m 700 "$w" "$w/receipt"
          mkdir -p "$RUNNER_TEMP/recvbuf/dist"
          echo '{"verified":false,"stage":"setup"}' > "$w/receipt/result.json"
          product=65a54cd879a8ed66ac93d2ec15ab39bbf94e8d95
          base=5d039b7cace653ed22c8292330ebb2bc0048397f
          prep=1dd5c8738089670485a347cfb85dad07b92d0e0d
          assets=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
          inputs=c3569a60dc1836ac6fad05e86d7951866c796b4f
          git init -q .
          git fetch -q --no-auto-maintenance --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$prep" "$assets" "$inputs" 885416118fc84d4ec6ba1cb7629a4f4bd346e051
          test "$(git rev-parse "$GITHUB_SHA^")" = "$product"
          test "$(git rev-parse "$product^{tree}")" = 1e64d7acbf3c1c96b72a09765daf601a7ea9e32c
          test "$(git rev-parse "$product^")" = "$base"
          git diff --exit-code "$product" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml'
          git show 885416118fc84d4ec6ba1cb7629a4f4bd346e051:.github/qualification/netip_wildcard.py > "$w/native.py"
          git show "$prep:.github/qualification/go_branch_netgofer.py" > "$w/previous.py"
          git show "$assets:.github/qualification/recvbuf_deps.py" > "$w/public_assets.py"
          git show "$inputs:.github/qualification/tldk_public_inputs.py" > "$w/tldk_public_inputs.py"
          git checkout -q --detach "$product"
          test "$(cat .bazelversion)" = 9.3.1
          cd "$w"
          test "$(git hash-object --no-filters previous.py)" = 0c1db7071558c5f9c8de45b60ba625183bd8a400
          test "$(git hash-object --no-filters public_assets.py)" = 9a3f571087a1438113a3a067c300e26fcb0ca9e8
          test "$(git hash-object --no-filters tldk_public_inputs.py)" = 1f3f7d4d75810ad60941772776e01f3b71b3b171
          curl -qfsSL --retry 2 --max-time 120 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel' | sha256sum -c -
          chmod +x bazel
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo
          for suite in jammy jammy-updates; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu $suite main universe"
          done > jammy.list
          opts=(-o "Dir::Etc::sourcelist=$w/jammy.list" -o Dir::Etc::sourceparts=-)
          sudo -n apt-get "${opts[@]}" update -qq
          sudo -n apt-get "${opts[@]}" install -qq -y --no-install-recommends g++-aarch64-linux-gnu libnuma-dev
      - name: Run the syscall and transport and lock owners
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/netip-wildcard"
          PYTHONPATH="$w" python3 -B - <<'CHECK'
          import native
          import previous

          suite = "//test/syscalls:socket_unix_unbound_abstract_test_runsc_systrap_directfs_save"
          transport = "//pkg/sentry/socket/unix/transport:transport_test"
          nogo = ["//pkg/sentry/inet:inet_nogo", transport.removesuffix("_test") + "_nogo", transport + "_nogo"]
          case = "AllUnixDomainSockets/UnboundAbstractUnixSocketPairTest.BindConnectInSubNamespace/"
          native.SYSCALLS[suite] = [case + str(i) for i in range(6)]
          native.GO[transport] = ["TestEnqueueRightsOwnership"]
          native.GO.update({label: [] for label in nogo})
          native.REPORT = {"source": "65a54cd879a8ed66ac93d2ec15ab39bbf94e8d95", "tests": {}, "commands": {}, "inputs": {}}
          previous.OUT = native.WORK
          previous.REPORT["assets"] = native.REPORT["inputs"]
          owners = [suite, transport, *nogo]
          native.run("unix-restore", owners, ["--test_env=GTEST_FILTER=*BindConnectInSubNamespace*"], 100)
          tests = native.REPORT["tests"]
          print({label: (row["status"], row.get("observation_error")) for label, row in tests.items()}, flush=True)
          log = (native.OUT / tests[suite]["test.log"]["file"]).read_text()
          restores = sum("Executing:" in line and " restore " in line and "--image-path" in line for line in log.splitlines())
          native.REPORT["restores"] = restores
          native.REPORT["verified"] = all(tests[label]["verified"] for label in owners) and restores > 0
          native.save()
          assert native.REPORT["verified"], (restores, tests)
          CHECK
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: abstract-unix-namespace-restore
          path: ${{ runner.temp }}/netip-wildcard/receipt
          if-no-files-found: error
          retention-days: 14
