name: Check a consumer-owned Go dependency graph
on:
  push:
    branches: [qualification/consumer-go-graph-current]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 2, persist-credentials: false}
    - name: Build gvisordetect with the consuming module's shared Go configuration
      run: |
        set -euo pipefail
        cp .github/qualification/downstream/consumer-policy.py "$RUNNER_TEMP/consumer-policy.py"
        git checkout --detach HEAD^
        python3 -B "$RUNNER_TEMP/consumer-policy.py"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: consumer-go-graph
        path: ${{ runner.temp }}/go-graph-report/
        if-no-files-found: error
