name: Verify the existing graph root zero-field results
on:
  push:
    branches: [qualification/state-original-root-zero-xml]
permissions: {contents: read}
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Bind the existing test and checksum-qualified reader
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = c0d2d63f5e97db7eb5357286e9831647eca2a991
          test "$(git rev-parse HEAD:pkg/state/tests/graph_test.go)" = 5f9ebfae1eaeb2b6b8ea2b3d3a34438f33e4a1ca
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/state_root_zero_xml.py'
          cp .github/qualification/state_root_zero_xml.py "$RUNNER_TEMP/"
          echo "db4819808095e59fd57f6f736590a6c184a1efb68a5b0877d49b2c0ec2e8553a  $RUNNER_TEMP/state_root_zero_xml.py" | sha256sum -c -
      - name: Read the two original native state-test XMLs
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          umask 077
          python3 -IB "$RUNNER_TEMP/state_root_zero_xml.py" retrieve
      - name: Verify the named row on both CPUs
        run: python3 -IB "$RUNNER_TEMP/state_root_zero_xml.py" check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-state-root-zero
          path: ${{ runner.temp }}/state-root-zero.json
          if-no-files-found: error
          retention-days: 7
      - name: Check both named outcomes
        run: python3 -IB -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/state-root-zero.json")); assert all(v["passed"] and not v["skipped"] for v in r["outcomes"].values())'
