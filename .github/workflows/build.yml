name: TCP tail probe
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  qualification:
    name: Verify all three corrected probes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QUALIFICATION_COMMIT: ${{ github.sha }}
      QUALIFICATION_TARGETS: //pkg/tcpip/transport/tcp/test/e2e:tcp_rack_test
      QUALIFICATION_TEST_FILTER: ^TestTailProbeLastPacket$
      QUALIFICATION_LANES: test
      QUALIFICATION_ARCH: amd64
    steps:
    - name: Check the Remote Bazel credential
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: ': "${BUILDBUDDY_API_KEY:?Configure the BUILDBUDDY_API_KEY repository secret}"'
    - name: Checkout the triggering commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 10
    - name: Run the three TCP tail probe cases on BuildBuddy
      timeout-minutes: 30
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: "set -euo pipefail\ntest \"$QUALIFICATION_COMMIT\" = \"$(git rev-parse HEAD)\"\ntest \"$QUALIFICATION_TARGETS\" = \"//pkg/tcpip/transport/tcp/test/e2e:tcp_rack_test\"\ntest \"$QUALIFICATION_TEST_FILTER\"\
        \ = '^TestTailProbeLastPacket$'\ntest \"$QUALIFICATION_LANES\" = \"test\"\ntest \"$QUALIFICATION_ARCH\" = \"amd64\"\nmkdir -p \"$RUNNER_TEMP/fifo_platform\" \"$RUNNER_TEMP/fifo\"\nplatform=$RUNNER_TEMP/fifo_platform\n\
        printf '%s\\n' 'module(name=\"fifo_platform\")' > \"$platform/MODULE.bazel\"\ncat > \"$platform/BUILD\" <<'BUILD'\nplatform(\n    name = \"ubuntu\",\n    constraint_values = [\"@platforms//cpu:x86_64\"\
        , \"@platforms//os:linux\"],\n    exec_properties = {\n        \"Arch\": \"amd64\",\n        \"OSFamily\": \"linux\",\n        \"workload-isolation-type\": \"oci\",\n        \"container-image\"\
        : \"docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02\",\n    },\n    visibility = [\"//visibility:public\"],\n)\nBUILD\nexport USE_BAZEL_VERSION\n\
        USE_BAZEL_VERSION=$(cat images/default/bazelversion)\nrc=$RUNNER_TEMP/fifo.bazelrc\numask 077\ntrap 'rm -f \"$rc\"' EXIT\n{\n  printf '%s\\n' 'build --remote_executor=grpcs://remote.buildbuddy.io'\
        \ \\\n    'build --remote_cache=grpcs://remote.buildbuddy.io' \\\n    'build --bes_backend=grpcs://remote.buildbuddy.io' \\\n    'build --bes_results_url=https://app.buildbuddy.io/invocation/' \\\
        \n    'build --spawn_strategy=remote' 'build --noremote_local_fallback' \\\n    'build --remote_accept_cached' \\\n    \"build --inject_repository=fifo_platform=$platform\" \\\n    'build --host_platform=@fifo_platform//:ubuntu'\
        \ \\\n    'build --extra_execution_platforms=@fifo_platform//:ubuntu' \\\n    'build --platforms=//tools/bazeldefs:linux_amd64'\n  printf 'build --remote_header=x-buildbuddy-api-key=%s\\n' \"$BUILDBUDDY_API_KEY\"\
        \n  printf 'build --bes_header=x-buildbuddy-api-key=%s\\n' \"$BUILDBUDDY_API_KEY\"\n} > \"$rc\"\nunset BUILDBUDDY_API_KEY\nprintf '%s\\n' 'build:rbe --spawn_strategy=remote' >> \"$rc\"\nexport FIFO_RC=$rc\n\
        mkdir -p \"$RUNNER_TEMP/fifo-bin\"\ncat > \"$RUNNER_TEMP/fifo-bin/bazel\" <<'SH'\n#!/bin/sh\nexec bazelisk --bazelrc=\"$FIFO_RC\" \"$@\"\nSH\nchmod +x \"$RUNNER_TEMP/fifo-bin/bazel\"\nexport PATH=\"\
        $RUNNER_TEMP/fifo-bin:$PATH\"\nstatus=0\nbash test/rbe/qualify.sh --arch=amd64 \"--test-target=$QUALIFICATION_TARGETS\" \\\n  \"--test-filter=$QUALIFICATION_TEST_FILTER\" \"--bazel-option=--build_event_json_file=$RUNNER_TEMP/fifo/events.jsonl\"\
        \ \\\n  \"--bazel-option=--test_sharding_strategy=disabled\" \"--bazel-option=--cache_test_results=no\" \"--bazel-option=--remote_download_outputs=toplevel\" test || status=$?\npython3 -B test/rbe/first_loss_result.py\
        \ \"$RUNNER_TEMP/fifo\" \"$status\"\n"
    - name: Retain the original named cases and report digests
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: highest-tail-evidence
        path: '${{ runner.temp }}/fifo/result.json

          '
        if-no-files-found: error
