name: CI

"on":
  push:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: bazel
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo -E apt update && sudo -E apt install -y make

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/setup-bazel

    - name: build
      run: |
          bazel test --test_output=errors //:github_actions_test
          mkdir -p bin
          make copy TARGETS=//tools/github DESTINATION=bin/
          container=$(docker ps --filter 'name=gvisor-bazel-' --format '{{.ID}}')
          test -n "$container"
          docker inspect "$container" --format '{{json .Mounts}}'
          test -d "$BAZEL_DISK_CACHE/ac"
          test -d "$BAZEL_REPOSITORY_CACHE/content_addressable"
          du -sh "$BAZEL_DISK_CACHE" "$BAZEL_REPOSITORY_CACHE"
          make bazel-shutdown

    - name: Upload runsc
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
          name: runsc
          path: bin/
