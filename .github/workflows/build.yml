name: Check TCP Eifel timing across a clock wrap
on:
  push:
    branches: [qualification/tcp-eifel-wrap-undo]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      SERIAL: 385c7126ae4a7f31b4f1ca45d6fba49945a28cb6
      REVIEW: d3d6262cc176d6dfe02131e58f032cdc85c87665
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Read the two original dependency resolution errors
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 test/rbe/eifel-wrap-original.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: eifel-dependency-diagnostics
        path: ${{ runner.temp }}/original-resolution.json
        if-no-files-found: error
