name: Verify shared memory removal publication
on:
  push:
    branches: [qualification/shm-removal-publication]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      FIXED: 166e166261dd9140cfaac183445b2377b3be4f20
      NEGATIVE: 3078ecfd48010d70020ace440165cf9e6363a4fc
      REPORTER: fb60e127516defd6aab633f80be09a03022f0737
      READER: 029a8365b981b8aee96e6dad1ecf22328ca6c6de
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: carrier, persist-credentials: false, fetch-depth: 1}
      - name: Preserve the shared profile and existing result readers
        working-directory: carrier
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/shm-evidence"
          printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/shm-evidence/verdict.json"
          git fetch -q --no-tags --depth=1 origin "$REPORTER" "$READER"
          for module in qualification_report unit_matrix; do
            git show "$REPORTER:test/rbe/$module.py" > "$RUNNER_TEMP/$module.py"
          done
          git show "$READER:test/rbe/image_execution.py" > "$RUNNER_TEMP/image_execution.py"
          cp test/rbe/shm_removal.py "$RUNNER_TEMP/"
          cp -R test/rbe/gnu_platform "$RUNNER_TEMP/gnu-platform"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: product
          ref: 166e166261dd9140cfaac183445b2377b3be4f20
          persist-credentials: false
          fetch-depth: 1
      - name: Use the shared GNU execution platform
        working-directory: product
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          test "$(git rev-parse HEAD)" = "$FIXED"
          git fetch -q --no-tags --depth=2 origin "$NEGATIVE" 0010e1dfdf3778136f099ddc71b846fdde7dd67a 4ebf1e2536f05750fd0f8567b81841c9bf167c37
          git fetch -q --no-tags --depth=2 origin "$FIXED"
          test -n "$BUILDBUDDY_API_KEY"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/gnu.bazelrc"
          unset BUILDBUDDY_API_KEY
          timeout 180 docker pull --platform=linux/amd64 "$GNU"
          docker run --init -d --name gnu-profile --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" "$GNU" -c 'sleep infinity'
      - name: Compare the forced interleaving, guard mutation and real shmctl calls
        run: docker exec -e RUNNER_TEMP -e GNU -e FIXED -e NEGATIVE gnu-profile python3 "$RUNNER_TEMP/shm_removal.py"
      - name: Check the explicit artifact boundary
        id: privacy
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          key = os.environ["BUILDBUDDY_API_KEY"].encode()
          assert key
          folder = Path(os.environ["RUNNER_TEMP"]) / "shm-evidence"
          required = {"verdict.json"}
          allowed = required | {f"{arm}-{i}-test.{suffix}"
                                for arm in ("stock-contention", "fixed-contention", "guard", "negative-guard", "syscalls", "stock-repeated")
                                for i in range(2 if arm == "syscalls" else 1) for suffix in ("log", "xml")}
          assert required <= {p.name for p in folder.iterdir()} <= allowed
          for path in folder.iterdir():
              assert path.is_file() and not path.is_symlink()
              content = path.read_bytes()
              assert key not in content and b"x-buildbuddy-api-key" not in content.lower()
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: shm-removal-publication
          path: ${{ runner.temp }}/shm-evidence/
          if-no-files-found: error
