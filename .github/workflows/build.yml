name: Replay the two kernel analyzer actions with 2 GB
on:
  push:
    branches: [qualification/nogo-remote-memory]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BB_ARCH: x86_64
      BB_HASH: 205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 5}
      - name: Pin the original action reader
        run: |
          set -eu
          curl -fsSL "https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-$BB_ARCH" -o "$RUNNER_TEMP/bb"
          echo "$BB_HASH  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0500 "$RUNNER_TEMP/bb"
      - name: Replay the original inputs and reconcile both target architectures
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 test/rbe/native_packages/analyzer_memory.py
      - name: Check the public evidence
        id: privacy
        if: always()
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          f = Path(os.environ["RUNNER_TEMP"]) / "analyzer-memory.json"
          assert f.is_file() and not f.is_symlink()
          key = os.environ["ACCESS"].encode()
          assert key and not any(m in f.read_bytes() for m in (key, b"remote_header", b"Authorization:", b"Bearer "))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: original-kernel-analyzer-memory
          path: ${{ runner.temp }}/analyzer-memory.json
          if-no-files-found: error
