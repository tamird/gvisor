name: Check the proposed gVisor timeout threshold
on:
  push:
    branches: [qualification/tcp-rto-recovery-amendment-netstack]
permissions: {contents: read}
jobs:
  packets:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Prepare the native Linux packet test
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/rto-interrupts-recovery"
          mkdir -m 700 "$d"
          echo '{"stage":"setup","verified":false}' > "$d/result.json"
          test "$(git rev-parse HEAD^)" = 8427512c2e8f6c0f1ece278d57df65202da6f0e8
          test "$(git rev-parse HEAD^^)" = eef8f638667640af9d8d49aac7206ecaa2d5c8fe

          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/rto_recovery.py'
          test "$(git rev-parse HEAD^:test/packetimpact/tests/tcp_rack_test.go)" = 2c0d9b215c52f399203bf6d6376bb2028a2275bc
          cp .github/qualification/rto_recovery.py "$d/"
          test "$(cat .bazelversion)" = 8.8.1
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/test -e /sys/class/net/lo
          if ! command -v aarch64-linux-gnu-g++ >/dev/null; then
            for suite in jammy jammy-updates; do
              echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ $suite main universe"
            done > "$d/ubuntu.list"
            opts=(-o "Dir::Etc::sourcelist=$d/ubuntu.list" -o Dir::Etc::sourceparts=-)
            sudo apt-get "${opts[@]}" update -qq
            sudo apt-get "${opts[@]}" install -qq -y --no-install-recommends g++-aarch64-linux-gnu
          fi
          curl -fsSL --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/bazel" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bazel"
      - name: Check the proposed gVisor sender and its existing timeout controls
        run: |
          git switch --detach HEAD^
          python3 -B "$RUNNER_TEMP/rto-interrupts-recovery/rto_recovery.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: tcp-rto-recovery-amendment-netstack
          path: ${{ runner.temp }}/rto-interrupts-recovery/result.json
          if-no-files-found: error
          retention-days: 14
