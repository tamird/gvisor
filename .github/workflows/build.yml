name: Check the Buildkite testlog collector
on:
  push:
    branches: [qualification/host-testlogs]
permissions:
  contents: read
jobs:
  testlogs:
    if: github.repository == 'tamird/gvisor'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      PRODUCT: 096e5e98dda1e4a60eabff04f765eaaa5da16095
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 3, persist-credentials: false}
    - name: Produce Bazel test events and observe the original and corrected post-command
      run: python3 test/rbe/host_testlogs/check.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: host-testlogs-${{ matrix.runner }}
        path: ${{ runner.temp }}/host-testlogs/proof
        if-no-files-found: error
