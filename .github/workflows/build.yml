name: Qualify the integration C image context
on:
  push:
    branches: [qualification/integration-c-context]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    env:
      PRODUCT: 712966d0b4e6fc3f518507c8100a809ff0d0563c
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 5
      - name: Configure the pinned Linux execution platform
        id: setup
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
          test "$(gcc -dumpversion | cut -d. -f1)" = 11
          mkdir -p "$RUNNER_TEMP/gnu"
          GNU=gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          printf 'module(name="epoll_gnu")\n' > "$RUNNER_TEMP/gnu/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu/BUILD"
          test -n "$BUILDBUDDY_API_KEY"
          rc=$RUNNER_TEMP/images.bazelrc
          umask 077
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'test --strategy=TestRunner=linux-sandbox' "build --inject_repository=epoll_gnu=$RUNNER_TEMP/gnu" 'build --host_platform=@epoll_gnu//:gnu' 'build --extra_execution_platforms=@epoll_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          cat >> "$rc" <<'RC'
          build --jobs=8
          build --strategy_regexp=Compiling.*src/google/protobuf/descriptor[.]cc=linux-sandbox
          build --strategy=ReleaseFiles=linux-sandbox
          build --strategy=GoStdlib=linux-sandbox
          build --strategy=GoStdlibList=linux-sandbox
          build --strategy=GoStandardLibraryAnalysis=linux-sandbox
          build --strategy=GoStaticAnalysis=linux-sandbox
          build --modify_execution_info=^Go(StandardLibrary|Static)Analysis$=-no-sandbox,^Go(Stdlib(List)?|StandardLibraryAnalysis)$=+no-remote-cache
          build --noremote_upload_local_results
          build --remote_download_outputs=toplevel
          build --nobuild_event_json_file_path_conversion
          build --noshow_progress
          RC

          git show "$GITHUB_SHA:test/rbe/integration-c-guests.py" > "$RUNNER_TEMP/guests.py"
          git checkout --quiet --detach "$PRODUCT"
          cat > "$RUNNER_TEMP/privileged-fixture" <<'WRAPPER'
          #!/usr/bin/env bash
          set -u
          uid=$(id -u)
          gid=$(id -g)
          rc=0
          sudo -nE "$@" || rc=$?
          if [[ -f "${XML_OUTPUT_FILE:-}" ]]; then sudo -n chown "$uid:$gid" "$XML_OUTPUT_FILE"; fi
          exit "$rc"
          WRAPPER
          chmod 0755 "$RUNNER_TEMP/privileged-fixture"
      - name: Prepare the same content-tagged AMD64 image
        id: image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          export MAKEFLAGS=DOCKER_BUILD=false
          make -s rebuild-basic_integrationtest ARCH=x86_64 DOCKER_BUILD=false STARTUP_OPTIONS="--bazelrc=$RUNNER_TEMP/images.bazelrc" > "$RUNNER_TEMP/results/make.log" 2>&1
          expected=us-central1-docker.pkg.dev/gvisor-presubmit/gvisor-presubmit-images/basic/integrationtest_x86_64:bb5faae2dc44202e
          tag=gvisor.dev/images/basic/integrationtest:latest
          test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$(docker image inspect --format '{{.Id}}' "$expected")"
          docker run --pull=never --runtime=runc --rm --workdir=/home/nonroot --user=nonroot "$tag" /bin/bash -ec 'test -x /home/nonroot/host_connect; test "$(id -u):$(id -g)" = 1338:1337'
      - name: Run all nested runsc cases with the permanent Docker test
        if: always() && steps.image.outcome == 'success'
        run: python3 "$RUNNER_TEMP/guests.py" nested
      - name: Publish the original nested case receipts before the other lane
        if: always() && steps.image.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nested-integration-c-cases
          path: ${{ runner.temp }}/results/nested
          if-no-files-found: error
      - name: Install the selected runsc release from this source
        id: runtime
        if: always() && steps.image.outcome == 'success'
        run: |
          set -euo pipefail
          bazel --bazelrc="$RUNNER_TEMP/images.bazelrc" build --config=x86_64 //:release > "$RUNNER_TEMP/results/release-install.log" 2>&1
          dest="$(realpath bazel-bin/release)"
          test -x "$dest/runsc"
          test -d "$dest/gvisor-bin"
          sudo "$dest/runsc" install --runtime=integration-c -- --platform=systrap --net-raw >> "$RUNNER_TEMP/results/release-install.log" 2>&1
          sudo systemctl reload docker
          for i in {1..15}; do
            if docker info --format '{{json .Runtimes}}' | jq -e 'has("integration-c")' >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run copy-up, rewinddir, link, sticky, and both ping guest cases
        if: always() && steps.runtime.outcome == 'success'
        run: python3 "$RUNNER_TEMP/guests.py" guest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-c-contexts
          path: ${{ runner.temp }}/results
          if-no-files-found: error
      - name: Remove private native engine settings
        if: always()
        run: rm -f "$RUNNER_TEMP/images.bazelrc"
