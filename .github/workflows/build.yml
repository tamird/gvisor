name: Check the retained LLVM RDFGraph parser object
on:
  push:
    branches: [qualification/llvm-raw-two-backend-rdfgraph]
permissions: {}
jobs:
  compile:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Compile the object from the configured NVIDIA parser graph
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = a066005a68e743f3c8bc0d974a2c6c87f414ba18
          test "$(cat .bazelversion)" = 9.3.1
          export BAZEL="$RUNNER_TEMP/bazel"
          curl -fsSL --retry 3 --max-time 180 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$BAZEL"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $BAZEL" | sha256sum -c -
          chmod +x "$BAZEL"
          python3 -IB .github/qualification/rdf_graph/check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: two-backend-parser-object
          path: ${{ runner.temp }}/rdf-graph-results
          if-no-files-found: warn
