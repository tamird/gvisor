name: Check go_marshal after Bazel tidies its Go dependencies
on:
  push:
    branches: [qualification/go-marshal-direct-x-text]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Compare the parent and the corrected Go requirement
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b9be88bed9a17a17e1cacbc4187f069cad22e761
          test "$(git rev-parse HEAD^^)" = 7c325dda4e52be8728f54116b41544c8fa130633
          test "$(git diff --name-only HEAD^^ HEAD^)" = go.mod
          git diff --exit-code HEAD^ HEAD -- . ':!.github/qualification/direct_x_text.py' ':!.github/workflows/build.yml'
          mkdir "$RUNNER_TEMP/gomarshal"
          cp .github/qualification/direct_x_text.py "$RUNNER_TEMP/gomarshal/"
          python3 -IB "$RUNNER_TEMP/gomarshal/direct_x_text.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: go-marshal-bazel-mod-tidy
          path: ${{ runner.temp }}/gomarshal/result.json
          retention-days: 14
          if-no-files-found: error
      - name: Require the parent failure and the rebuilt generator
        if: always() && !cancelled()
        run: jq -e '.verified' "$RUNNER_TEMP/gomarshal/result.json"
