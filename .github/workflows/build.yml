name: Check the native vDSO ABI with LLVM path mapping
on:
  push:
    branches: [qualification/llvm-mixed-vdso-paths]
permissions: {contents: read}
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 4, persist-credentials: false}
      - name: Bind the compiler settings and the unchanged vDSO
        run: |
          set -eu
          w="$RUNNER_TEMP/mixed-vdso"
          mkdir -p "$w/results"
          test "$(git rev-parse HEAD^)" = 097b8d31f4586709d20cf00abb75e8afabb07708
          test "$(git rev-parse HEAD^^)" = 6875646208f68aca6e75e24a676a1478d3d70a61
          test "$(git rev-parse HEAD^^^)" = 35aa6228edcf1eb2bc07d6aa877b4317da27d68a
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/mixed_vdso/check.py' ':!.github/qualification/mixed_vdso/exec_cas.py'
          git diff --exit-code HEAD^^ HEAD^ -- . ':!vdso/BUILD' ':!vdso/mixed_abi.py' ':!vdso/mixed_abi.bzl'
          git diff --exit-code HEAD^^^ HEAD^^ -- . ':!.bazelrc'
          cp .github/qualification/mixed_vdso/{check,exec_cas}.py "$w/"
          git checkout -q --detach HEAD^
          test "$(cat .bazelversion)" = 9.3.1
          curl --fail --location --retry 2 --max-time 100 --proto '=https' --proto-redir '=https' https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$w/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $w/bazel" | sha256sum -c -
          chmod 755 "$w/bazel"
      - name: Verify both architecture-specific TestRunners and the two real vDSO compile/link graphs
        id: graph
        run: |
          set -eu
          w="$RUNNER_TEMP/mixed-vdso"
          for mode in stock mapped; do python3 -EsB "$w/check.py" "$mode" analyze; done
          jq -s -e 'all(.[]; .eligible)' "$w/results/stock.json" "$w/results/mapped.json"
      - name: Build and run only the two native vDSO tests per configuration
        if: steps.graph.outcome == 'success'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          : "${BUILDBUDDY_API_KEY:?missing fork key}"
          w="$RUNNER_TEMP/mixed-vdso"
          rc="$w/remote.rc"
          for mode in stock mapped; do
            (
              trap 'rm -f "$rc"' EXIT
              printf '%s\n' 'build:source-presubmit-mixed --remote_executor=grpcs://remote.buildbuddy.io --remote_cache=grpcs://remote.buildbuddy.io' 'build:source-presubmit-mixed --bes_backend=grpcs://remote.buildbuddy.io --bes_results_url=https://app.buildbuddy.io/invocation/' > "$rc"
              printf 'build:source-presubmit-mixed --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
              unset BUILDBUDDY_API_KEY
              python3 -EsB "$w/check.py" "$mode" execute
            )
            test ! -e "$rc"
            env -u BUILDBUDDY_API_KEY python3 -EsB "$w/check.py" "$mode" collect || true
          done
      - name: Read compiler, linker and native TestRunner command metadata from the two original submissions
        if: always() && !cancelled() && steps.graph.outcome == 'success'
        env:
          ACCESS: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          w="$RUNNER_TEMP/mixed-vdso"
          test ! -e "$w/remote.rc"
          for mode in stock mapped; do
            if jq -e '.invocation and (.spawns|length)>0' "$w/results/$mode.json" >/dev/null; then
              python3 -EsB "$w/check.py" "$mode" physical
            fi
          done
      - name: Compare the native ABI and executable bytes
        if: always() && !cancelled()
        run: |
          python3 -IB - <<'PY'
          import json,os
          from pathlib import Path
          w=Path(os.environ["RUNNER_TEMP"])/"mixed-vdso/results"
          r={}
          for t in ("//vdso:mixed_abi_test_amd64","//vdso:mixed_abi_test_arm64"):
              a,b=[json.loads((w/(m+".json")).read_text()) for m in ("stock","mapped")]
              x,y=[d.get("tests",{}).get(t,[{}])[0].get("elf",{}) for d in (a,b)]
              r[t]={"valid":bool(a.get("verified") and b.get("verified") and x and y and x["version"]==y["version"] and x["symbol_offsets"]==y["symbol_offsets"]),
                    "equal_file":bool(x and y and x["sha256"]==y["sha256"]),"equal_load_segments":bool(x and y and x["load_sha256"]==y["load_sha256"])}
          (w/"comparison.json").write_text(json.dumps(r,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: original-mixed-vdso-actions-and-abi
          path: |
            ${{ runner.temp }}/mixed-vdso/results/stock.json
            ${{ runner.temp }}/mixed-vdso/results/mapped.json
            ${{ runner.temp }}/mixed-vdso/results/comparison.json
          retention-days: 14
          if-no-files-found: warn
      - name: Require actual native results in each mode
        if: always() && !cancelled()
        run: jq -e 'length == 2 and all(.[]; .valid)' "$RUNNER_TEMP/mixed-vdso/results/comparison.json"
