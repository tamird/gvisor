name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-archive:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build the CRI sandbox archive on Linux ARM64
      run: bazelisk build //test/root:sandbox_image_tar
    - name: Verify the selected manifest and pause executable
      run: python3 test/rbe/cri_pause_arm64.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cri-pause-arm64
        path: pause-arm64.json
        if-no-files-found: error
