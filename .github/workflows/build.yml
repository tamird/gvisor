name: CI

"on":
  push:
    branches:
      - "*"
      - "qualification/buildbuddy-kernel-features"
  workflow_dispatch:
    inputs:
      lanes:
        description: Space-separated qualification lanes
        type: string
        default: smoke
        required: true
      architecture:
        description: Target architecture selection
        type: choice
        options: [amd64, arm64, all]
        default: amd64
      execution:
        description: Run tests on BuildBuddy or this Actions runner
        type: choice
        options: [remote, local]
        default: remote
      clock_source:
        description: Explicit runtime clock source for qualification
        type: choice
        options: [calibrated, reference]
        default: calibrated
      local_test_requirements:
        description: Comma-separated requirements missing from remote workers for hybrid lanes
        type: string
        default: namespace
      syscall_bucket:
        description: Optional hash15 bucket (0..14) for local syscall lanes
        type: string
      targets:
        description: Optional build/test labels, or one continuous benchmark label
        type: string
      header_base:
        description: Full comparison commit SHA for license-headers
        type: string
      cos_catalog_gzip_base64:
        description: Gzip/base64-encoded complete gcloud COS image catalog
        type: string
      cos_catalog_sha256:
        description: SHA256 of the uncompressed COS catalog
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.architecture }}-${{ inputs.execution }}-${{ inputs.lanes }}-${{ inputs.syscall_bucket }}-${{ contains(fromJSON('["build","test","benchmarks"]'), inputs.lanes) && inputs.targets || '' }}-${{ inputs.clock_source }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' && (github.repository != 'tamird/gvisor' || (!startsWith(github.ref, 'refs/heads/qualification/') && github.ref != 'refs/heads/rbe-qualification-upstream-refresh' && github.ref != 'refs/heads/rbe-actions-kvm-syscalls' && github.ref != 'refs/heads/rbe-actions-amd64-syscalls' && github.ref != 'refs/heads/rbe-actions-arm64-resume' && github.ref != 'refs/heads/rbe-actions-benchmark-partitions' && github.ref != 'refs/heads/rbe-actions-docker-network' && github.ref != 'refs/heads/rbe-actions-arm64-docker' && github.ref != 'refs/heads/rbe-actions-arm64-images' && github.ref != 'refs/heads/rbe-actions-plugin-network' && github.ref != 'refs/heads/rbe-actions-nftables' && github.ref != 'refs/heads/rbe-actions-kvm-startup' && github.ref != 'refs/heads/rbe-unit-mixed-hybrid'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: bazel
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo -E apt update && sudo -E apt install -y make

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: build
      run: |
          mkdir -p bin
          make copy TARGETS=runsc DESTINATION=bin/

    - name: Upload runsc
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
          name: runsc
          path: bin/runsc

  remote-qualification:
    if: github.repository == 'tamird/gvisor' && (github.ref == 'refs/heads/rbe-qualification-upstream-refresh' || ((startsWith(github.ref, 'refs/heads/qualification/') || github.ref == 'refs/heads/rbe-actions-kvm-syscalls' || github.ref == 'refs/heads/rbe-actions-amd64-syscalls' || github.ref == 'refs/heads/rbe-actions-arm64-resume' || github.ref == 'refs/heads/rbe-actions-benchmark-partitions' || github.ref == 'refs/heads/rbe-actions-docker-network' || github.ref == 'refs/heads/rbe-actions-arm64-docker' || github.ref == 'refs/heads/rbe-actions-arm64-images' || github.ref == 'refs/heads/rbe-actions-plugin-network' || github.ref == 'refs/heads/rbe-actions-nftables' || github.ref == 'refs/heads/rbe-actions-kvm-startup' || github.ref == 'refs/heads/rbe-unit-mixed-hybrid' || github.ref == 'refs/heads/diagnostics/unit-mixed-continuation') && github.event_name == 'workflow_dispatch'))
    runs-on: ${{ inputs.execution == 'local' && (inputs.architecture == 'arm64' || inputs.architecture == 'all' && inputs.lanes == 'unit') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.execution == 'local' && inputs.architecture == 'all' && inputs.lanes == 'unit' && 155 || inputs.execution == 'local' && inputs.lanes == 'container-v1' && 155 || inputs.execution == 'remote' && (contains(fromJSON('["build","test"]'), inputs.lanes) || inputs.architecture == 'arm64' && contains(fromJSON('["syscalls-64k","syscalls-rc"]'), inputs.lanes)) && 155 || inputs.execution == 'local' && contains(fromJSON('["container","syscalls","syscalls-resume","syscalls-kvm","syscalls-rc"]'), inputs.lanes) && 95 || inputs.execution == 'local' && contains(fromJSON('["benchmarks","cpu-images","gpu-images","language-goferfs"]'), inputs.lanes) && 75 || (inputs.execution == 'local' && inputs.lanes != 'unit' && inputs.lanes != 'container-v1-pilot' && inputs.lanes != 'syscalls' && inputs.lanes != 'syscalls-resume' && inputs.lanes != 'syscalls-kvm' && inputs.lanes != 'syscalls-rc-pilot' && inputs.lanes != 'docker' && inputs.lanes != 'plugin-network' && inputs.lanes != 'nftables' && inputs.lanes != 'moby' && inputs.lanes != 'kvm' && 15 || 50) }}
    permissions:
      contents: read
    env:
      QUALIFICATION_COMMIT: ${{ github.sha }}
      QUALIFICATION_EXECUTION: ${{ github.event_name == 'push' && 'remote' || inputs.execution == 'remote' && (contains(fromJSON('["build","test"]'), inputs.lanes) || inputs.architecture == 'arm64' && contains(fromJSON('["syscalls-64k","syscalls-rc"]'), inputs.lanes)) && 'remote-actions' || inputs.execution }}
      QUALIFICATION_CLOCK_SOURCE: ${{ github.event_name == 'push' && 'calibrated' || inputs.clock_source }}
      QUALIFICATION_LOCAL_TEST_REQUIREMENTS: ${{ inputs.local_test_requirements }}
      QUALIFICATION_LANES: ${{ github.event_name == 'push' && 'smoke' || inputs.lanes }}
      QUALIFICATION_ARCH: ${{ github.event_name == 'push' && 'amd64' || inputs.architecture }}
      QUALIFICATION_SYSCALL_BUCKET: ${{ inputs.syscall_bucket }}
      QUALIFICATION_TARGETS: ${{ inputs.targets }}
      QUALIFICATION_HEADER_BASE: ${{ inputs.header_base }}
      QUALIFICATION_COS_GZIP_BASE64: ${{ inputs.cos_catalog_gzip_base64 }}
      QUALIFICATION_COS_SHA256: ${{ inputs.cos_catalog_sha256 }}
    steps:
    - name: Check the Remote Bazel credential
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: ': "${BUILDBUDDY_API_KEY:?Configure the BUILDBUDDY_API_KEY repository secret}"'

    - name: Checkout the triggering commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Download the pinned BuildBuddy CLI
      if: env.QUALIFICATION_EXECUTION == 'remote'
      shell: bash
      run: |
        curl --fail --silent --show-error --location --max-time 120 \
          https://github.com/buildbuddy-io/bazel/releases/download/5.0.488/bazel-5.0.488-linux-x86_64 \
          --output "$RUNNER_TEMP/bb"
        printf '%s  %s\n' \
          f0d85b1514f784dc25705dd3bbeeaa1e603b5449f721c26add0245198f03e7cb \
          "$RUNNER_TEMP/bb" | sha256sum --check --strict
        chmod +x "$RUNNER_TEMP/bb"

    - name: Qualify on Remote Bazel
      if: env.QUALIFICATION_EXECUTION == 'remote'
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        GIT_REPO_DEFAULT_BRANCH: master
        REMOTE_TIMEOUT: ${{ github.event_name == 'workflow_dispatch' && '45m' || '15m' }}
      run: |
        exec "$RUNNER_TEMP/bb" remote \
          --run_from_commit="$GITHUB_SHA" \
          --os=linux --arch=amd64 \
          --runner_exec_properties=EstimatedCPU=4 \
          --runner_exec_properties=EstimatedMemory=16GB \
          --runner_exec_properties=EstimatedFreeDiskBytes=40GB \
          --env="QUALIFICATION_COMMIT=$GITHUB_SHA" \
          --env="QUALIFICATION_LANES=$QUALIFICATION_LANES" \
          --env="QUALIFICATION_ARCH=$QUALIFICATION_ARCH" \
          --env="QUALIFICATION_CLOCK_SOURCE=$QUALIFICATION_CLOCK_SOURCE" \
          --env="QUALIFICATION_SYSCALL_BUCKET=$QUALIFICATION_SYSCALL_BUCKET" \
          --env="QUALIFICATION_TARGETS=$QUALIFICATION_TARGETS" \
          --env="QUALIFICATION_HEADER_BASE=$QUALIFICATION_HEADER_BASE" \
          --env="QUALIFICATION_COS_GZIP_BASE64=$QUALIFICATION_COS_GZIP_BASE64" \
          --env="QUALIFICATION_COS_SHA256=$QUALIFICATION_COS_SHA256" \
          --timeout="$REMOTE_TIMEOUT" --disable_retry \
          --script='bash test/rbe/actions.sh'

    - name: Coordinate qualification on Actions
      if: env.QUALIFICATION_EXECUTION == 'local' || env.QUALIFICATION_EXECUTION == 'remote-actions'
      timeout-minutes: ${{ inputs.execution == 'local' && inputs.architecture == 'all' && inputs.lanes == 'unit' && 145 || inputs.execution == 'local' && inputs.lanes == 'container-v1' && 150 || env.QUALIFICATION_EXECUTION == 'remote-actions' && 145 || inputs.execution == 'local' && contains(fromJSON('["container","syscalls","syscalls-resume","syscalls-kvm","syscalls-rc"]'), inputs.lanes) && 90 || contains(fromJSON('["benchmarks","cpu-images","gpu-images","language-goferfs"]'), inputs.lanes) && 70 || ((inputs.lanes == 'unit' || inputs.lanes == 'container-v1-pilot' || inputs.lanes == 'syscalls' || inputs.lanes == 'syscalls-resume' || inputs.lanes == 'syscalls-kvm' || inputs.lanes == 'syscalls-rc-pilot' || inputs.lanes == 'docker' || inputs.lanes == 'plugin-network' || inputs.lanes == 'nftables' || inputs.lanes == 'moby' || inputs.lanes == 'kvm') && 45 || 15) }}
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: bash test/rbe/actions.sh

    - name: Retain qualification placement and host facts
      if: always() && (env.QUALIFICATION_EXECUTION == 'local' || env.QUALIFICATION_EXECUTION == 'remote-actions')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: qualification-${{ inputs.architecture }}
        path: ${{ runner.temp }}/qualification
        if-no-files-found: error

  buildbuddy-kernel-boot:
    if: github.repository == 'tamird/gvisor' && github.event_name == 'push' && github.ref == 'refs/heads/qualification/buildbuddy-kernel-features'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      QUALIFICATION_COMMIT: 7b114572332da4423710ca957683b9d3cb9c2d48
    steps:
    - name: Checkout exact BuildBuddy diagnostic source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: tamird/buildbuddy
        ref: ${{ env.QUALIFICATION_COMMIT }}
        persist-credentials: false

    - name: Prepare existing local Firecracker requirements
      run: |
        sudo -n apt-get update
        sudo -n apt-get install -y iproute2 iptables e2fsprogs fuse3 zstd
        sudo -n modprobe fuse
        test -c /dev/kvm
        test -c /dev/fuse
        command -v bazelisk

    - name: Build remotely and boot both kernels locally
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        : "${BUILDBUDDY_API_KEY:?Configure the existing BUILDBUDDY_API_KEY secret}"
        umask 077
        QUALIFICATION_CREDENTIAL_RC=$(mktemp "$RUNNER_TEMP/buildbuddy-private.XXXXXX")
        export QUALIFICATION_CREDENTIAL_RC
        cleanup() {
          local status=$?
          if ! rm -f "$QUALIFICATION_CREDENTIAL_RC"; then
            if (( status == 0 )); then status=1; fi
          fi
          exit "$status"
        }
        trap cleanup EXIT
        {
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'common --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$QUALIFICATION_CREDENTIAL_RC"
        unset BUILDBUDDY_API_KEY
        sudo --preserve-env=PATH,RUNNER_TEMP,QUALIFICATION_COMMIT,QUALIFICATION_CREDENTIAL_RC \
          bash enterprise/vmsupport/kernel/boot-validation.sh

    - name: Retain original validation evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: buildbuddy-guest-kernel-boot
        path: ${{ runner.temp }}/qualification/evidence.tar.gz
        if-no-files-found: error
