name: Qualify foreign FD lookup and exec table replacement
on:
  push:
    branches: [qualification/task-foreign-fd]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      FIXED: 8cdb6eb0da66ecf93b0a5e32a2ee970016833a5a
      NEGATIVE: unused
      DONOR: 2a9e72475b37fbcb46e24d44a785b0e5daa661d7
      REPORTER: fb60e127516defd6aab633f80be09a03022f0737
      READER: 029a8365b981b8aee96e6dad1ecf22328ca6c6de
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: carrier, persist-credentials: false, fetch-depth: 2}
      - name: Preserve the unchanged qualifier and execution profile
        working-directory: carrier
        run: |
          set -eu
          umask 077
          test "$(git rev-parse HEAD^)" = "$FIXED"
          mkdir -p "$RUNNER_TEMP/pidfd-lock-evidence" "$RUNNER_TEMP/fd-tools"
          printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/pidfd-lock-evidence/verdict.json"
          git fetch -q --no-tags --depth=1 origin "$DONOR" "$REPORTER" "$READER"
          test "$(git rev-parse HEAD:test/rbe/pidfd_locks.py)" = "$(git rev-parse "$DONOR:test/rbe/pidfd_locks.py")"
          for module in qualification_report unit_matrix; do
            git show "$REPORTER:test/rbe/$module.py" > "$RUNNER_TEMP/$module.py"
          done
          git show "$READER:test/rbe/image_execution.py" > "$RUNNER_TEMP/image_execution.py"
          cp test/rbe/{pidfd_locks,task_foreign_fd}.py "$RUNNER_TEMP/"
          cp -R test/rbe/gnu_platform "$RUNNER_TEMP/gnu-platform"
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/fd-tools/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/fd-tools/bazel" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/fd-tools/bazel"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: product, ref: 8cdb6eb0da66ecf93b0a5e32a2ee970016833a5a, persist-credentials: false, fetch-depth: 1}
      - name: Configure the existing GNU execution profile
        working-directory: product
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          test "$(git rev-parse HEAD)" = "$FIXED"
          test "$(cat .bazelversion)" = 9.3.1
          test "$(cat images/default/bazelversion)" = 9.3.1
          test -n "$BUILDBUDDY_API_KEY"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' 'build --noremote_upload_local_results' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/gnu.bazelrc"
          unset BUILDBUDDY_API_KEY
          timeout 180 docker pull --platform=linux/amd64 "$GNU"
          docker run -d --name gnu-profile --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" "$GNU" -c 'sleep infinity'
          test "$(docker exec -e USE_BAZEL_VERSION=9.3.1 gnu-profile "$RUNNER_TEMP/fd-tools/bazel" --version)" = 'bazel 9.3.1'
      - name: Run the four analyzers and five cases on each syscall owner
        run: |
          docker exec -e RUNNER_TEMP -e GNU -e FIXED -e NEGATIVE -e USE_BAZEL_VERSION=9.3.1 \
            -e PYTHONDONTWRITEBYTECODE=1 -e "PATH=$RUNNER_TEMP/fd-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            gnu-profile python3 "$RUNNER_TEMP/task_foreign_fd.py"
      - name: Check the fixed public artifact boundary
        id: privacy
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          sudo -n chmod -R a+rX "$RUNNER_TEMP/pidfd-lock-evidence"
          python3 - <<'BOUNDARY'
          import json, os, re
          from pathlib import Path
          key = os.environ['BUILDBUDDY_API_KEY']
          assert key
          folder = Path(os.environ['RUNNER_TEMP']) / 'pidfd-lock-evidence'
          assert {p.name for p in folder.iterdir()} == {'verdict.json'}
          p = folder / 'verdict.json'
          assert p.is_file() and not p.is_symlink()
          raw = p.read_bytes()
          assert 0 < len(raw) < 2**20
          assert key.encode() not in raw and json.dumps(key)[1:-1].encode() not in raw
          assert not re.search(rb'(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}', raw)
          assert json.loads(raw)['status'] in {'PASS', 'FAIL', 'INCOMPLETE'}
          BOUNDARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: task-foreign-fd
          path: ${{ runner.temp }}/pidfd-lock-evidence/verdict.json
          if-no-files-found: error
      - if: always()
        run: docker rm -f gnu-profile >/dev/null 2>&1 || true
