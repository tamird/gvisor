name: Run LLVM multicast cases on native Firecracker workers
on:
  push:
    branches: [qualification/llvm-multicast-native-firecracker]
permissions: {}
jobs:
  presubmit:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Check source and tools
        id: setup
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 48f457b4e040312422b8e28b97081998d1d81297
          test "$(git rev-parse HEAD^^)" = 2a653cea7b2054a2dc9c6419337d3de8031275d6
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/source_diagnostics.py'
          test "$(cat .bazelversion)" = 9.3.1
          w="$RUNNER_TEMP/llvm-source-presubmit"
          mkdir -m 700 "$w" "$w/dist" "$w/results"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 --max-time 180 -H 'Accept: application/octet-stream' https://api.github.com/repos/cerisier/glibc-headers/releases/assets/253918436 -o "$w/dist/x86_64-linux-gnu.2.28.tar.zst"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 --max-time 180 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$w/bazel"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 --max-time 180 https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 -o "$w/decoder"
          cp .github/qualification/source_diagnostics.py "$w/"
          git switch --detach HEAD^
          test "$(git rev-parse HEAD)" = 48f457b4e040312422b8e28b97081998d1d81297
          test -z "$(git status --porcelain)"
          cd "$w"
          sha256sum -c <<'SUMS'
          7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel
          8015f4a710987439dfdcde7539b62cc5db52d2cd9456af5e2e297494f13c56f3  dist/x86_64-linux-gnu.2.28.tar.zst
          205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  decoder
          SUMS
          chmod 700 bazel decoder
      - name: Replay failed actions on the unmodified product commit
        timeout-minutes: 130
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${BUILDBUDDY_API_KEY:?existing BuildBuddy key is required}"
          w="$RUNNER_TEMP/llvm-source-presubmit"
          rc="$w/remote.rc"
          trap 'rm -f "$rc"' EXIT
          cat > "$rc" <<'RC'
          build --remote_executor=grpcs://remote.buildbuddy.io
          build --remote_cache=grpcs://remote.buildbuddy.io
          build --bes_backend=grpcs://remote.buildbuddy.io
          build --bes_results_url=https://app.buildbuddy.io/invocation/
          build --remote_default_exec_properties=OSFamily=linux
          build --remote_default_exec_properties=workload-isolation-type=oci
          build --remote_default_exec_properties=container-image=docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
          build --spawn_strategy=remote --noremote_local_fallback --remote_download_outputs=minimal
          test --strategy=TestRunner=remote --modify_execution_info=^TestRunner$=+no-remote-cache
          RC
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> "$rc"
          unset BUILDBUDDY_API_KEY
          result=0
          for arch in amd64 arm64; do
            env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -IB "$w/source_diagnostics.py" "$arch" || result=1
          done
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled() && steps.setup.outcome == 'success'
        with:
          name: llvm-multicast-native-xml
          path: |
            ${{ runner.temp }}/llvm-source-presubmit/results/amd64.json
            ${{ runner.temp }}/llvm-source-presubmit/results/amd64.xml
            ${{ runner.temp }}/llvm-source-presubmit/results/arm64.json
            ${{ runner.temp }}/llvm-source-presubmit/results/arm64.xml
          if-no-files-found: error
          retention-days: 14
