name: Run the PacketImpact handshake on common Ubuntu Firecracker workers
on:
  push:
    branches: [qualification/packetimpact-common-ubuntu-workers]
permissions: {}
jobs:
  packets:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Bind the reviewed sources and the public packet observer
        timeout-minutes: 7
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/packet-worker"
          mkdir -p "$d/results"
          echo '{"verified":false,"stage":"setup"}' > "$d/results/result.json"
          donor=ea373739cac60c41017891d6411258f22a100238
          base=61ff148f0df0efa29c9f500914477525c5debe62
          fix=02168427b8d45b05bc4c4bb1409b0d97a75e56d4
          git init -q
          git fetch --no-tags --no-auto-maintenance --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$donor"
          git checkout --detach -q "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$fix"
          test "$(git rev-parse HEAD^^)" = "$base"
          test "$(git rev-parse "$fix^{tree}")" = 0e4b7e828377401046ecd30f4c956ec6ccaddf11
          test "$(git rev-parse "$donor^")" = c3d696ee1bfdf985a971be5854b18eda85b8820e
          test "$(git diff "$base" "$fix" | git patch-id --stable | cut -d' ' -f1)" = 96d017dc90e321f64eb96d94af231db36ae3ccca
          test "$(git diff "$donor^^" "$donor^" | git patch-id --stable | cut -d' ' -f1)" = 96d017dc90e321f64eb96d94af231db36ae3ccca
          test "$(git diff --name-only "$base" "$donor^^" -- test/packetimpact)" = test/packetimpact/tests/tcp_retransmits_test.go
          test "$(git diff --name-only "$fix" "$donor^" -- test/packetimpact)" = test/packetimpact/tests/tcp_retransmits_test.go
          git diff --exit-code "$fix" HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/packet_workers.py' ':!test/rbe/packet_worker/BUILD'
          git show "$donor:.github/qualification/packet_runner/frames.py" > "$d/frames.py"
          test "$(git hash-object "$d/frames.py")" = 34b16e4da74918523c9a7be8ffa27a0aeff40a82
          cp .github/qualification/packet_workers.py "$d/"
          cp test/rbe/packet_worker/BUILD "$d/platform.BUILD"
          cd "$d"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel
          curl --proto '=https' --proto-redir '=https' -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 -o bb ||
            curl --proto '=https' --proto-redir '=https' -fsSL -H 'Accept: application/octet-stream' 'https://api.github.com/repos/buildbuddy-io/bazel/releases/assets/679595483' -o bb
          sha256sum -c <<'SUMS'
          7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel
          205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  bb
          SUMS
          chmod 700 bazel bb
      - name: Run the stock native owner and the corrected native and netstack owners
        timeout-minutes: 45
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          umask 077
          d="$RUNNER_TEMP/packet-worker"
          rc="$d/remote.bazelrc"
          trap 'rm -f "$rc"' EXIT
          : "${BUILDBUDDY_API_KEY:?missing existing fork key}"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/'
            printf '%s\n' 'build --experimental_remote_downloader=grpcs://remote.buildbuddy.io --noexperimental_remote_downloader_propagate_credentials --experimental_remote_downloader_local_fallback'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          env -i PATH="$PATH" HOME="$HOME" USER="$USER" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -B "$d/packet_workers.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: packetimpact-common-ubuntu-workers
          path: ${{ runner.temp }}/packet-worker/results/
          if-no-files-found: error
          retention-days: 14
