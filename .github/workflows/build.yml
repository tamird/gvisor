name: Compare gVisor dependency test executables
on:
  push:
    branches: [qualification/deps-test-analysis-result]
permissions: {}
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 78
    steps:
      - name: Bind the public source and pinned native Bazel
        timeout-minutes: 9
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/deps-check"
          mkdir -m 700 "$w" "$w/receipt"
          mkdir -p "$RUNNER_TEMP/recvbuf/dist"
          echo '{"verified":false,"stage":"setup"}' > "$w/receipt/result.json"
          product=ebb314fc9f3d09da06f20c5bd601eeb1cf861f80
          base=975fb172241c7946a9f67b4f52e0349d9240589a
          prep=1dd5c8738089670485a347cfb85dad07b92d0e0d
          assets=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
          inputs=c3569a60dc1836ac6fad05e86d7951866c796b4f
          git init -q .
          git fetch -q --no-auto-maintenance --no-tags --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA" "$prep" "$assets" "$inputs"
          test "$(git rev-parse "$GITHUB_SHA^")" = "$product"
          test "$(git rev-parse "$product^{tree}")" = e5db427e21f80cf6dcad399724dfaf6140853da4
          test "$(git rev-parse "$product^")" = "$base"
          test "$(git diff --name-only "$base" "$product")" = tools/deps.bzl
          git diff --exit-code "$product" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!.github/qualification/deps_analysis'
          git checkout -q --detach "$GITHUB_SHA"
          cp .github/qualification/deps_analysis/* "$w/"
          git show "$prep:.github/qualification/go_branch_netgofer.py" > "$w/previous.py"
          git show "$assets:.github/qualification/recvbuf_deps.py" > "$w/public_assets.py"
          git show "$inputs:.github/qualification/tldk_public_inputs.py" > "$w/tldk_public_inputs.py"
          git checkout -q --detach "$product"
          test "$(cat .bazelversion)" = 9.3.1
          cd "$w"
          test "$(git hash-object --no-filters previous.py)" = 0c1db7071558c5f9c8de45b60ba625183bd8a400
          test "$(git hash-object --no-filters public_assets.py)" = 9a3f571087a1438113a3a067c300e26fcb0ca9e8
          test "$(git hash-object --no-filters tldk_public_inputs.py)" = 1f3f7d4d75810ad60941772776e01f3b71b3b171
          curl -qfsSL --retry 2 --max-time 120 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel
          echo '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel' | sha256sum -c -
          chmod +x bazel probe.py
      - name: Run the dependency tests and validation controls
        timeout-minutes: 64
        run: |
          env -i HOME="$HOME" USER="$USER" PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" \
            python3 -B "$RUNNER_TEMP/deps-check/check.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: deps-analysis-comparison
          path: ${{ runner.temp }}/deps-check/receipt
          if-no-files-found: error
          retention-days: 14
