name: Measure save-time cgroup pressure under both GC policies
on:
  push:
    branches: [qualification/gc-save-200m]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      CURRENT: ${{ github.sha }}
      BASE: 874db9fce52716e00f0acb2ab0bd8bc893afbe8c
      PROPOSED: 1216a45cf63a3cb42649b3397a58dc54e3b5dac5
      ORDINARY: 8b53d7b9cbc58eeb0ed8b4dd0eda9c5f5d5ab921
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 6, persist-credentials: false}
    - name: Prepare the pinned compiler coordinator and RBE workers
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        [[ "$(git rev-parse HEAD)" == "$CURRENT" ]]
        test "$(git rev-parse HEAD^)" = "$ORDINARY"
        test "$(git rev-parse HEAD~2)" = "$PROPOSED"
        test "$(git rev-parse HEAD~3)" = "$BASE"
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name tcp-compiler --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /var/run/docker.sock:/var/run/docker.sock -v "$(command -v docker):/usr/local/bin/docker:ro" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
        docker exec tcp-compiler gcc -dumpfullversion > "$RUNNER_TEMP/records/coordinator-gcc"
        docker exec tcp-compiler uname -a > "$RUNNER_TEMP/records/native-kernel"

    - name: Compare save GC policies on the same enforced cap
      timeout-minutes: 47
      run: |
        set -euo pipefail
        cp test/rbe/gc_save_receipt.py "$RUNNER_TEMP/"
        for arm in proposed ordinary; do
          if [[ $arm == proposed ]]; then src=$PROPOSED; else src=$ORDINARY; fi
          d=$RUNNER_TEMP/records/$arm; mkdir -p "$d"
          git checkout --quiet --detach "$src"; git diff --quiet
          git rev-parse HEAD > "$d/source"
          sha256sum runsc/container/container_save_restore_test.go pkg/sentry/state/state.go test/cmd/test_app/main.go > "$d/blobs"
          date -u +%FT%T.%3NZ > "$d/start"
          rc=0
          docker exec tcp-compiler bazel --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --spawn_strategy=remote,local --noremote_upload_local_results --strategy=GoStaticAnalysis=local --strategy=GoStandardLibraryAnalysis=local --remote_download_outputs=toplevel --jobs=24 --strategy=TestRunner=local --test_filter='^TestSaveCgroupMemoryLimit$' --test_arg=-test.v --test_sharding_strategy=disabled --nocache_test_results --test_timeout=600 //runsc/container:container_test > "$RUNNER_TEMP/test-$arm.out" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$d/exit"
          date -u +%FT%T.%3NZ > "$d/end"
          grep -E 'Invocation ID:|ERROR:|FAILED|Build completed' "$RUNNER_TEMP/test-$arm.out" | tail -22 > "$d/diagnostics" || true
          for f in test.xml test.log; do
            docker exec tcp-compiler cat "bazel-testlogs/runsc/container/container_test/$f" > "$d/$f" || rm -f "$d/$f"
          done
          # Retain only this test cgroup's OOM task selection, not the host kernel log.
          cg=$(grep -oE '"cgroup":"/gvisor-test-cg-[A-Z0-9]+"' "$d/test.log" | tail -1 | cut -d/ -f2 | tr -d '"' || true)
          if [[ -n "$cg" ]]; then sudo dmesg | grep -F -- "$cg" | grep 'oom-kill:' > "$d/kernel-victim" || true; fi
        done
        python3 "$RUNNER_TEMP/gc_save_receipt.py" "$RUNNER_TEMP/records"

    - name: Redact credentials from the evidence bundle
      if: always()
      env:
        BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        key=os.environ["BB_KEY"].encode()
        for f in (Path(os.environ["RUNNER_TEMP"])/"records").rglob("*"):
            if f.is_file() and key and key in (data:=f.read_bytes()):
                f.write_bytes(data.replace(key,b"[REDACTED]"))
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: gc-save-200m
        path: ${{ runner.temp }}/records/
        if-no-files-found: error
