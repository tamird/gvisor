name: Qualify the shipping archive on the empty coordinator and AMD64 executor
"on":
  push:
    branches: [qualification/registry-llvm-empty-client-shipping]
permissions: {}
jobs:
  archive:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    steps:
      - name: Verify and export the shipping sources
        run: |
          set -eu
          umask 077
          w="$RUNNER_TEMP/registry-shipping"
          base=dd2be7670c1baaacebfdcab31bb6145ebce39037
          trial=15a0b6098b03c050baeb404cac40c820d9a19a97
          mkdir -p "$w/public" "$w/data" "$w/base" "$w/trial"
          git init -q .
          GIT_TERMINAL_PROMPT=0 git -c gc.auto=0 fetch --no-auto-maintenance -q --depth=3 https://github.com/tamird/gvisor.git "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD^)" = "$trial"
          test "$(git rev-parse "$trial^")" = "$base"
          test "$(git rev-parse "$trial:tools/rules_python_native_launcher.patch")" = fcc585b97c33c4afe7281d3bb32b7e5731da0894
          git diff --exit-code "$trial" FETCH_HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/registry_shipping.py'
          git show 'FETCH_HEAD:.github/qualification/registry_shipping.py' > "$w/qualify.py"
          git archive "$base" | tar -x -C "$w/base"
          git archive "$trial" | tar -x -C "$w/trial"
          cd "$w"
          fetch() { curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 --max-time 120 "$1" -o "$2"; }
          fetch https://raw.githubusercontent.com/tamird/gvisor/e89646dda45516a7fe54427a0586a39dc20a7db3/test/rbe/release_prewarmer/BUILD worker.BUILD
          fetch https://github.com/buildbuddy-io/bazel/releases/download/5.0.498/bazel-5.0.498-linux-x86_64 bb
          sha256sum -c <<'SUMS'
          ae1f23a11f3cb747fbec49a34c510c5ab9dcb75d06d94bfd4d9a49d50c629271  worker.BUILD
          205fb4074012858c858ec357cb0cf1ed0b1fbf8707c5f385efd4abd52bb2cead  bb
          SUMS
          chmod 700 bb
          for src in base trial; do
            test ! -e "$src/.git"
            test ! -e "$src/test/rbe/release_prewarmer"
            mkdir "$src/test/rbe/release_prewarmer"
            cp worker.BUILD "$src/test/rbe/release_prewarmer/BUILD"
          done
          cat > observe <<'BASH'
          #!/bin/bash
          set -eu
          exec env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" python3 -IB "$RUNNER_TEMP/registry-shipping/qualify.py" "$@"
          BASH
          cat > submit <<'BASH'
          #!/bin/bash
          set -eu
          umask 077
          : "${BUILDBUDDY_API_KEY:?missing fork key}"
          w="$RUNNER_TEMP/registry-shipping"
          trap 'rm -f "$w/remote.bazelrc"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$w/remote.bazelrc"
          unset BUILDBUDDY_API_KEY
          "$w/observe" build "$@"
          BASH
          chmod 700 observe submit
      - name: Verify real PackageTar selections on the empty coordinator without credentials
        id: graphs
        run: |
          set -eu
          w="$RUNNER_TEMP/registry-shipping"
          "$w/observe" setup
          "$w/observe" graphs
      - name: Run the shipping target with its original script bootstrap
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: '"$RUNNER_TEMP/registry-shipping/submit" amd64 script'
      - name: Verify the original missing bootstrap interpreter
        run: '"$RUNNER_TEMP/registry-shipping/observe" collect amd64 script'
      - name: Build the amd64 shipping archive
        id: submit_amd64
        if: always() && !cancelled() && steps.graphs.outcome == 'success'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: '"$RUNNER_TEMP/registry-shipping/submit" amd64 native'
      - name: Verify the original amd64 actions and shipped files without credentials
        if: always() && !cancelled() && steps.submit_amd64.outcome == 'success'
        run: '"$RUNNER_TEMP/registry-shipping/observe" collect amd64 native'
      - name: Build the arm64 shipping archive
        id: submit_arm64
        if: always() && !cancelled() && steps.graphs.outcome == 'success'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: '"$RUNNER_TEMP/registry-shipping/submit" arm64 native'
      - name: Verify the original arm64 actions and shipped files without credentials
        if: always() && !cancelled() && steps.submit_arm64.outcome == 'success'
        run: '"$RUNNER_TEMP/registry-shipping/observe" collect arm64 native'
      - name: Check the paired bootstrap and shared Python evidence
        if: always() && !cancelled() && steps.graphs.outcome == 'success'
        run: '"$RUNNER_TEMP/registry-shipping/observe" pair'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: registry-llvm-empty-client-shipping
          path: ${{ runner.temp }}/registry-shipping/public/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove the private coordinator sources and outputs
        if: always()
        run: |
          docker image rm "empty-shipping:$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          rm -rf -- "$RUNNER_TEMP/registry-shipping"
