name: Check Python release eligibility
on:
  push:
    branches: [qualification/python-versioned-releases]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 3, persist-credentials: false}
    - name: Compare the Buildkite entry and existing raw publisher
      env:
        PRODUCT: a11061ec1abab5beb2c6fa2e8c91f5df0ece0c0e
        CONTROL: aa767e4c43d011121271551fe24da501a56f729d
      run: python3 test/rbe/python-release-eligibility.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: python-release-eligibility
        path: ${{ runner.temp }}/release-eligibility/verdict.json
        if-no-files-found: error
