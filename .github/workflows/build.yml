name: Check a real checkpoint directory without Docker
on:
  push:
    branches: [qualification/checkpoint-dir-no-docker]
permissions: {}
jobs:
  checkpoint:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Bind the original sources and the local test tools
        timeout-minutes: 14
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/checkpoint-dir"
          mkdir -p "$dir"
          echo '{"verified":false,"phase":"setup"}' > "$dir/receipt.json"
          test "$(git rev-parse HEAD^)" = cba5d1b3f0a94c5ac55c10fc8f29af4fd8d6978e
          test "$(git rev-parse HEAD^^)" = 451b92800b9cb82262dc8a735388f7cf4d17d895
          test "$(uname -m)" = x86_64
          test "$(cat .bazelversion)" = 9.3.1
          cp .github/qualification/checkpoint_dir.py "$dir/"
          seed=c3569a60dc1836ac6fad05e86d7951866c796b4f
          asset=7ea7ebc29e63bf98bc221f8419a34c6cb57e7003
          capsule=8d980b39ad21950f42c5aeec48935d52c3e50b85
          git fetch -q --no-auto-maintenance --depth=1 --no-tags https://github.com/tamird/gvisor.git "$seed" "$asset" "$capsule"
          test "$(git rev-parse "$seed^{tree}")" = 2dc41aabbafa98e803a84b4f74e71b6ce6e752d7
          git show "$seed:.github/qualification/tldk_installed_inputs.json" > "$dir/inputs.json"
          git show "$seed:.github/qualification/tldk_public_inputs.py" > "$dir/tldk_public_inputs.py"
          git show "$asset:.github/qualification/recvbuf_deps.py" > "$dir/public_assets.py"
          git show "$capsule:test/rbe/runtime_guest.py" > "$dir/runtime_guest.py"
          cd "$dir"
          curl -q -fsSL --max-time 100 --retry 2 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o bazel ||
              curl -q -fsSL --max-time 100 --retry 2 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/bazelbuild/bazel/releases/assets/661108421?download=1' -o bazel
          path=pool/main/b/busybox/busybox-static_1.36.1-6ubuntu3.1_amd64.deb
          got=false
          for mirror in https://archive.ubuntu.com/ubuntu https://snapshot.ubuntu.com/ubuntu/20260928T000000Z; do
              if curl -q -fsSL --max-time 45 --retry 1 "$mirror/$path" -o busybox.deb && echo '944b2728f53ceb3916cec2c962873c9951e612408099601751db2a0a5d81e0ed  busybox.deb' | sha256sum -c; then got=true; break; fi
          done
          "$got"
          dpkg-deb --fsys-tarfile busybox.deb | tar -xO ./usr/bin/busybox > busybox
          sha256sum -c <<'SUMS'
          7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  bazel
          dbac288c29ba568459550a2da9e7ae0ded6b1fc728ee9fad3044c44e62d6ac14  busybox
          95e5a5ce63bf883f17fee14a7f0c677932967f23fc82aa47089c89888cea052a  inputs.json
          SUMS
          chmod 755 bazel busybox
          ./bazel --version | grep -Fx 'bazel 9.3.1'
          for suite in jammy jammy-updates; do
              echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ $suite main universe"
          done > jammy.list
          options=(-o "Dir::Etc::sourcelist=$dir/jammy.list" -o Dir::Etc::sourceparts=-)
          sudo -n apt-get "${options[@]}" update -qq
          sudo -n apt-get "${options[@]}" install --no-install-recommends -y -qq libnuma-dev g++-aarch64-linux-gnu
      - name: Build stock and fixed readers and run the declared native DUT
        timeout-minutes: 77
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" \
            python3 -B "$RUNNER_TEMP/checkpoint-dir/checkpoint_dir.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: checkpoint-dir-no-docker
          path: |
            ${{ runner.temp }}/checkpoint-dir/receipt.json
            ${{ runner.temp }}/checkpoint-dir/test.log
            ${{ runner.temp }}/checkpoint-dir/test.xml
          if-no-files-found: error
          retention-days: 14
