name: Check the permanent VFIO PCI syscall targets
on:
  push:
    branches: [qualification/vfio-permanent-device]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/vfio-permanent-device'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: 53baa516391e749a3373a613b971fe3b257c3edc
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records"
        uname -a | tee "$RUNNER_TEMP/records/host-kernel"
        test -c /dev/kvm && sudo test -r /dev/kvm && sudo test -w /dev/kvm
        git rev-parse HEAD > "$RUNNER_TEMP/records/source"
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Start the existing GNU Bazel coordinator
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        docker run --device=/dev/kvm -d --name overlay-guest --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
    - name: Build the exact public targets, runtime and helper libraries
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/records"
        git fetch --no-tags --depth=2 origin "$PRODUCT"
        carrier=$(git rev-parse HEAD)
        git checkout --quiet --detach "$PRODUCT"
        git rev-parse HEAD > "$out/product"
        docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" build --config=x86_64 -c opt --jobs=25 --remote_download_outputs=toplevel //:release //test/runner:runner //test/runner/setup_container //test/syscalls/linux:vfio_pci_device_test //test/syscalls:vfio_pci_device_test_native //test/syscalls:vfio_pci_device_test_runsc_systrap > "$RUNNER_TEMP/product-build.log" 2>&1 || { grep -A15 -E 'ERROR:|INFO: Invocation ID:' "$RUNNER_TEMP/product-build.log" | tail -80 | tee "$out/build-receipt"; exit 1; }
        grep -E 'INFO: Invocation ID:|Build completed' "$RUNNER_TEMP/product-build.log" > "$out/build-receipt"
        docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" query --output=build 'set(//test/syscalls:vfio_pci_device_test_native //test/syscalls:vfio_pci_device_test_runsc_systrap)' > "$out/target-arguments"
        test "$(grep -Fc -- '--add-host-vfio' "$out/target-arguments")" = 2
        test "$(grep -Fc -- 'exclusive-if-local' "$out/target-arguments")" = 2
        stage="$RUNNER_TEMP/suite"
        mkdir -p "$stage/release"
        for platform in native runsc_systrap; do
          docker exec overlay-guest cp -L "bazel-bin/test/syscalls/vfio_pci_device_test_$platform" "$stage/$platform"
          cp "$stage/$platform" "$out/$platform-wrapper"
        done
        runner=$(awk '$1=="exec"{print $2}' "$stage/native")
        test_bin=$(awk '$1=="exec"{print $NF}' "$stage/native")
        [[ "$runner" == test/runner/* && "$test_bin" == test/syscalls/linux/* ]]
        setup=test/runner/setup_container/setup_container
        for path in "$runner" "$test_bin" "$setup"; do
          mkdir -p "$stage/$(dirname "$path")"
          docker exec overlay-guest cp -L "bazel-bin/$path" "$stage/$path"
          test -x "$stage/$path"
        done
        docker exec overlay-guest cp -RL --preserve=mode bazel-bin/release/. "$stage/release"
        for name in runsc gvisor-bin/gvisor_sentry gvisor-bin/checkpointgofer gvisor-bin/gvisor-sentry-prewarmer gvisor-bin/gvisor-proc-umounter gvisor-bin/runsc-fd-parking gvisor-bin/runsc-metric-server; do test -x "$stage/release/$name"; done
        sha256sum "$stage/$runner" "$stage/$test_bin" "$stage/$setup" "$stage"/{native,runsc_systrap,release/runsc,release/gvisor-bin/*} | sed "s#$stage/##" > "$stage/sha256"
        cp "$stage/sha256" "$out/product-hashes"
        for path in "$runner" "$test_bin" "$setup"; do
          docker exec overlay-guest ldd "$stage/$path" >> "$out/ldd" 2>&1 || { file "$stage/$path" | grep -Eq 'statically linked|static-pie linked'; }
        done
        if grep -q 'not found' "$out/ldd"; then cat "$out/ldd"; exit 1; fi
        awk '$2=="=>" && $3~/^\//{print substr($3,2)} $1~/^\//{print substr($1,2)}' "$out/ldd" | sort -u > "$RUNNER_TEMP/libs"
        grep -q . "$RUNNER_TEMP/libs"
        if grep -vE '^(lib|usr/lib)' "$RUNNER_TEMP/libs"; then exit 1; fi
        docker exec overlay-guest tar -chf "$stage/runtime-libs.tar" -C / -T "$RUNNER_TEMP/libs"
        tar -cf "$RUNNER_TEMP/vfio_suite.tar" -C "$stage" .
        git checkout --detach "$carrier"
        cp "$RUNNER_TEMP/vfio_suite.tar" test/rbe/tcg/
    - name: Run both permanent syscall targets on assigned PCI
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/records"; target=//test/rbe/tcg:vfio_permanent_test
        rc=0
        docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=25 --remote_download_outputs=toplevel --strategy=TestRunner=local --nozip_undeclared_test_outputs --nocache_test_results --test_output=all --test_timeout=500 "$target" > "$RUNNER_TEMP/permanent.log" 2>&1 || rc=$?
        echo "$rc" >"$out/guest-exit"
        grep -E 'INFO: Invocation ID:|ERROR:|FAILED|failed|VfioPCI|VFIO|Build completed' "$RUNNER_TEMP/permanent.log" | tail -75 >"$out/guest-receipt" || :
        for path in test.log test.outputs/console.log test.outputs/guest/vfio-device.txt test.outputs/guest/outputs/identity.txt test.outputs/guest/outputs/native.txt test.outputs/guest/outputs/runsc_systrap.txt test.outputs/guest/outputs/verdict.txt test.outputs/guest/outputs/runtime-diagnostics.txt; do
          name=${path##*/}
          docker exec overlay-guest cat "bazel-testlogs/test/rbe/tcg/vfio_permanent_test/$path" | tail -160 > "$out/$name" || :
        done
        test "$rc" = 0
        for mode in native runsc_systrap; do grep -q 'OK .*VfioPCIDeviceTest.Readiness' "$out/$mode.txt"; grep -Fq "$mode: 0" "$out/verdict.txt"; done
    - name: Check saved-waiter round-trip on the exact product
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/records"
        git checkout --quiet --detach "$PRODUCT"
        rc=0
        docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=24 --remote_download_outputs=toplevel --nocache_test_results --test_output=all //pkg/sentry/devices/tpuproxy/vfio:vfio_test > "$RUNNER_TEMP/checkpoint-test.log" 2>&1 || rc=$?
        echo "$rc" > "$out/checkpoint-exit"
        grep -E 'INFO: Invocation ID:|ERROR:|FAIL|PASS|RUN |Build completed' "$RUNNER_TEMP/checkpoint-test.log" | tail -65 > "$out/checkpoint-receipt" || :
        test "$rc" = 0
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: permanent-vfio-pci
        path: ${{ runner.temp }}/records
        if-no-files-found: error
