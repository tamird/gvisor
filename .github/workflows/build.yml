name: Read the original native variant compiler diagnostics
on:
  push:
    branches: [qualification/native-posix-original]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Verify the original runner source
        run: |
          test "$(git rev-parse HEAD^)" = 886933bb05243c15216a2f0e01f1d516ac4c80e5
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/build.yml' ':!.github/qualification/rebased_owners/original_cpp.py'
      - name: Read the original console using the fixed API
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -IB .github/qualification/rebased_owners/original_cpp.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: original-native-variant-compiler
          path: ${{ runner.temp }}/original-variant-compiler.json
          retention-days: 14
          if-no-files-found: error
