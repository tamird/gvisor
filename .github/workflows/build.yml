name: Check PTY writable wakeups after flush
on:
  push:
    branches: [qualification/pty-flush-writable-notification]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Configure the existing GNU remote execution platform
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/pty-platform" "$RUNNER_TEMP/pty-flush"
          cp .github/qualify_pty_flush.py "$RUNNER_TEMP/qualify_pty_flush.py"
          printf 'module(name="pty_gnu_platform")\n' > "$RUNNER_TEMP/pty-platform/MODULE.bazel"
          printf 'platform(name="gnu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"], exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"}, visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/pty-platform/BUILD"
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=pty_gnu_platform=$RUNNER_TEMP/pty-platform" 'build --host_platform=@pty_gnu_platform//:gnu' 'build --extra_execution_platforms=@pty_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/pty.bazelrc"
      - name: Exercise the native and systrap syscall test owners
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pty-bin"
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/pty-bin/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/pty-bin/bazel" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/pty-bin/bazel"
          docker pull --platform=linux/amd64 "$GNU"
          docker run --rm --platform=linux/amd64 --user=root --entrypoint=/usr/bin/env \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" \
            -i HOME=/root PATH="$RUNNER_TEMP/pty-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            RUNNER_TEMP="$RUNNER_TEMP" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory \
            GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" python3 -B "$RUNNER_TEMP/qualify_pty_flush.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pty-flush-wakeups
          path: ${{ runner.temp }}/pty-flush/*.json
          if-no-files-found: error
