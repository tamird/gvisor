name: Observe overlapping guest close and chmod at the public FUSE boundary
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/overlay-close-public-overlap'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      OSTOCK: a0704ca37733c206da56f40d75984e19f31494bd
      OFIXED: ccc8829dc24e70daa30730f981986da50e947790
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=2 origin "$OSTOCK" "$OFIXED"
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Start the existing GNU Bazel coordinator
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name overlay-guest --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'
    - name: Observe the same close and chmod on native Linux
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$OFIXED"
        git checkout --quiet --detach "$OFIXED"; out="$RUNNER_TEMP/proof-native"; mkdir -p "$out"
        docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" build --config=x86_64 -c opt --jobs=32 --remote_download_outputs=toplevel //test/syscalls/linux:fuse_test >"$RUNNER_TEMP/native-build.log" 2>&1 || { grep -E '^ERROR:' "$RUNNER_TEMP/native-build.log" | tail; exit 1; }
        docker exec overlay-guest cp bazel-bin/test/syscalls/linux/fuse_test "$RUNNER_TEMP/native-fuse"; sudo chmod +x "$RUNNER_TEMP/native-fuse"
        test -e /dev/fuse || sudo modprobe fuse || true
        test -e /dev/fuse || sudo mknod /dev/fuse c 10 229
        uname -sr >"$out/kernel"
        rc=0
        sudo unshare --mount --propagation private bash -euo pipefail -c 'if ! mountpoint -q /sys/fs/fuse/connections; then mount -t fusectl fusectl /sys/fs/fuse/connections; fi; exec timeout 90s "$1" --gtest_filter=FuseServerTest.OverlayCloseDuringCopyUp' _ "$RUNNER_TEMP/native-fuse" >"$RUNNER_TEMP/native.log" 2>&1 || rc=$?
        echo "$rc" >"$out/exit"
        cp "$RUNNER_TEMP/native.log" "$out/test.log"
        git rev-parse HEAD >"$out/source"
        cat "$out/test.log"; [[ $rc == 0 ]]; grep -q 'flush=1 overlap=1' "$out/test.log"; grep -q 'release=1' "$out/test.log"; grep -q 'OK .*FuseServerTest.OverlayCloseDuringCopyUp' "$out/test.log"
    - name: Run the original and the public FUSE peer on stock gVisor
      if: always() && !cancelled()
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$OSTOCK"
        out="$RUNNER_TEMP/proof-stock"
        mkdir -p "$out"; git rev-parse HEAD >"$out/source"
        date -u +%FT%TZ >"$out/start"
        rc=0
        docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=32 --strategy=TestRunner=remote --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=all --test_timeout=90 --test_sharding_strategy=disabled --test_env=GTEST_FILTER=FuseServerTest.OverlayCloseDuringCopyUp //test/syscalls:fuse_test_runsc_systrap_directfs >"$out/bazel.log" 2>&1 || rc=$?
        echo "$rc" >"$out/exit"; date -u +%FT%TZ >"$out/end"
        docker exec overlay-guest cat bazel-testlogs/test/syscalls/fuse_test_runsc_systrap_directfs/test.log >"$out/test.log" || true
        grep -E 'OVLBOUND|OverlayCloseDuringCopyUp|ERROR:|timed out' "$out/test.log" "$out/bazel.log" | tail -55 || true
        [[ $rc == 0 ]]; grep -q 'flush=1 overlap=1' "$out/test.log"; grep -q 'release=1' "$out/test.log"; grep -q 'OK .*FuseServerTest.OverlayCloseDuringCopyUp' "$out/test.log"
    - name: Run the original and the public FUSE peer on fixed gVisor
      if: always() && !cancelled()
      run: |
        set -euo pipefail
        git checkout --quiet --detach "$OFIXED"
        out="$RUNNER_TEMP/proof-fixed"
        mkdir -p "$out"; git rev-parse HEAD >"$out/source"
        date -u +%FT%TZ >"$out/start"
        rc=0
        docker exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" overlay-guest bazel --bazelrc="$RUNNER_TEMP/overlay.bazelrc" test --config=x86_64 -c opt --jobs=32 --strategy=TestRunner=remote --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=all --test_timeout=90 --test_sharding_strategy=disabled --test_env=GTEST_FILTER=FuseServerTest.OverlayCloseDuringCopyUp //test/syscalls:fuse_test_runsc_systrap_directfs >"$out/bazel.log" 2>&1 || rc=$?
        echo "$rc" >"$out/exit"; date -u +%FT%TZ >"$out/end"
        docker exec overlay-guest cat bazel-testlogs/test/syscalls/fuse_test_runsc_systrap_directfs/test.log >"$out/test.log" || true
        grep -E 'OVLBOUND|OverlayCloseDuringCopyUp|ERROR:|timed out' "$out/test.log" "$out/bazel.log" | tail -55 || true
        [[ $rc == 0 ]]; grep -q 'flush=1 overlap=1' "$out/test.log"; grep -q 'release=1' "$out/test.log"; grep -q 'OK .*FuseServerTest.OverlayCloseDuringCopyUp' "$out/test.log"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: public-overlay-close
        path: ${{ runner.temp }}/proof-*
        if-no-files-found: error
