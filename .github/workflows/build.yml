name: Qualify unversioned checkpoint identities
on:
  push:
    branches: [qualification/checkpoint-identity-owners]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/qualification/checkpoint-identity-owners'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      SOURCE: fd84d25a8cc1635b90047a23ef333ec9956fc6ac
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 3
        persist-credentials: false
    - name: Prepare native Linux coordinator
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD^1) == "$SOURCE" ]]
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
        unshare --user --map-root-user true
        plat=$RUNNER_TEMP/overlay-gnu
        mkdir -p "$plat"
        printf 'module(name="poll_gnu_platform")\n' >"$plat/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" >"$plat/BUILD"
    - name: Configure authenticated remote actions
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail; umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=poll_gnu_platform=$RUNNER_TEMP/overlay-gnu" 'build --host_platform=@poll_gnu_platform//:gnu' 'build --extra_execution_platforms=@poll_gnu_platform//:gnu' 'build --platforms=//tools/bazeldefs:linux_amd64'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } >"$RUNNER_TEMP/overlay.bazelrc"
    - name: Start the existing GNU Bazel coordinator
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        docker pull --platform=linux/amd64 "$GNU"
        docker run -d --name overlay-guest --entrypoint /bin/bash --user root --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$GNU" -c 'sleep infinity'

    - name: Select exact reviewed source
      run: |
        set -eu
        cp .github/qualification/owner-*.py .github/qualification/owner_inspect_elf.py "$RUNNER_TEMP/"
        git checkout --detach "$SOURCE"
        test "$(git rev-parse HEAD)" = "$SOURCE"
    - name: Build the unversioned AMD64 install and inspect its ELF
      run: python3 "$RUNNER_TEMP/owner-qualify.py" build amd64
    - name: Checkpoint and restore a graph guest on native AMD64
      if: ${{ !cancelled() }}
      run: sudo env SOURCE="$SOURCE" RUNNER_TEMP="$RUNNER_TEMP" python3 "$RUNNER_TEMP/owner-graph.py"
    - name: Check actual saved wire metadata and CPU features on native AMD64
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/owner-qualify.py" metadata amd64
    - name: Analyze both changed owners targeting AMD64
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/owner-qualify.py" nogo amd64
    - name: Build the unversioned ARM64 Sentry and inspect its ELF
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/owner-qualify.py" build arm64
    - name: Analyze both changed owners targeting ARM64
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/owner-qualify.py" nogo arm64
    - name: Reconcile the six stage results
      if: always()
      run: |
        python3 - <<'PYEND'
        import json,os
        from pathlib import Path
        p=Path(os.environ["RUNNER_TEMP"])/"owner-identity-proof"
        p.mkdir(exist_ok=True)
        names="build-amd64 graph metadata-amd64 nogo-amd64 build-arm64 nogo-arm64".split()
        rows={n:json.loads((p/(n+".json")).read_text()) for n in names if (p/(n+".json")).is_file()}
        missing=sorted(set(names)-set(rows))
        failed=sorted(n for n,r in rows.items() if r["result"]!="PASS" or r["source"]!=os.environ["SOURCE"])
        summary=dict(source=os.environ["SOURCE"],expected=names,executed=list(rows),missing=missing,failures=failed,skips=[],result="FAIL" if missing or failed else "PASS")
        (p/"result.json").write_text(json.dumps(summary,indent=2)+"\n")
        print(json.dumps(summary,indent=2)); assert summary["result"]=="PASS"
        PYEND
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: checkpoint-identity-owners
        path: ${{ runner.temp }}/owner-identity-proof
        if-no-files-found: error
