name: Recover IPv6 host-network linger on native Linux
on:
  push:
    branches: [qualification/hostinet-exit-linger-ipv6]
permissions:
  contents: read
jobs:
  syscalls:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      GNU: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      BASE: c9c954f7e83660917f7c002728bfed64501840c5
      STOCK: 9f6d689c981b74654de046201a98aa8f45ce0a62
      FIXED: b17b56396c10093ac334f9dffcbf94f1f844c9b0
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 5, persist-credentials: false}
    - name: Verify IPv6 in the same kind of namespace used by the syscall suite
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/records" "$RUNNER_TEMP/gnu-platform"
        cp test/rbe/tcp-abi-result.py "$RUNNER_TEMP/verify-tcp.py"
        [[ "$(git rev-parse HEAD^)" == "$FIXED" && "$(git rev-parse HEAD^^)" == "$STOCK" && "$(git rev-parse HEAD^^^)" == "$BASE" ]]
        printf 'module(name="tcp_gnu")\n' > "$RUNNER_TEMP/gnu-platform/MODULE.bazel"
        printf 'platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","container-image":"docker://%s"},visibility=["//visibility:public"])\n' "$GNU" > "$RUNNER_TEMP/gnu-platform/BUILD"
        umask 077
        {
          printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=tcp_gnu=$RUNNER_TEMP/gnu-platform" 'build --extra_execution_platforms=@tcp_gnu//:gnu' 'build --host_platform=@tcp_gnu//:gnu'
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
        } > "$RUNNER_TEMP/tcp.bazelrc"
        unset BUILDBUDDY_API_KEY
        if [[ $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null) == 1 ]]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        unshare -Urn sh -ec 'ip link set lo up; test -s /proc/net/if_inet6 || test -e /proc/net/if_inet6; python3 -c "import socket; s=socket.socket(socket.AF_INET6); s.bind((\"::1\", 0)); print(s.getsockname())"' > "$RUNNER_TEMP/records/native-ipv6"
        uname -a > "$RUNNER_TEMP/records/native-kernel"
    - name: Record each native and guest action independently
      run: |
        set -euo pipefail
        for name in duplex-stock duplex-fixed; do
          src=$STOCK
          [[ "$name" != duplex-fixed ]] || src=$FIXED
          testname=tcp_socket_test
          path=test/syscalls/linux/tcp_socket.cc
          filter='AllInetTests/TcpSocketTest.NoLingerOnProcessExit/1:AllInetTests/TcpSocketTest.AbortiveLingerOnExit/1'
          executor=local
          platform=runsc_systrap_hostnet
          git checkout --quiet --detach "$src"
          [[ "$(git rev-parse HEAD)" == "$src" ]]
          d=$RUNNER_TEMP/records/$name; mkdir -p "$d"
          sha256sum "$path" > "$d/fixture-sha256"
          target="//test/syscalls:${testname}_${platform}"
          printf '%s\n' "$src" > "$d/source"; printf '%s\n' "$target" > "$d/target"
          printf '%s\n' "$executor" > "$d/executor"; printf '%s\n' "$filter" > "$d/filter"
          date -u +%FT%TZ > "$d/start"
          rc=0
          bazelisk --bazelrc="$RUNNER_TEMP/tcp.bazelrc" test --config=x86_64 --jobs=64 --verbose_failures --strategy=TestRunner="$executor" --nocache_test_results --modify_execution_info='^TestRunner$=+no-remote-cache' --remote_download_outputs=toplevel '--remote_download_regex=.*[/]test[.](log|xml)$' --test_output=all --test_timeout=450 --test_sharding_strategy=disabled --test_env=GTEST_FILTER="$filter" "$target" > "$d/bazel.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$d/exit"; date -u +%FT%TZ > "$d/end"
          for file in test.log test.xml; do
            cat "bazel-testlogs/test/syscalls/${target#*:}/$file" > "$d/$file" || rm -f "$d/$file"
          done
        done
    - name: Verify each actual socket assertion
      if: ${{ !cancelled() }}
      run: python3 "$RUNNER_TEMP/verify-tcp.py" "$RUNNER_TEMP/records"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: hostinet-exit-linger-ipv6
        path: ${{ runner.temp }}/records/verdict.json
        if-no-files-found: error
