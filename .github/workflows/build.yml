name: Verify the executable test_app runfile
on:
  push:
    branches: [qualification/stable-test-app-runfile]
permissions:
  contents: read
jobs:
  consumers:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 4}
      - name: Bind the candidate and existing native Bazel launcher
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/test-app-runfile"
          mkdir -p "$d/out"
          printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$d/out/verdict.json"
          test "$(git rev-parse HEAD^)" = 90dd28479a2fbd8bbbf0c9bd79ad9e9f9abb5b4c
          test "$(git rev-parse HEAD^^)" = f35d725669ae45e7617cf66e7ceee2f0f6307490
          test "$(git rev-parse HEAD^:test/cmd/test_app/BUILD)" = a3d3266ef605e150143c187a7650ff585a13a8db
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/qualification/test_app_runfile.py .github/workflows/build.yml)"
          cp .github/qualification/test_app_runfile.py "$d/check.py"
          test "$(cat .bazelversion)" = 9.3.1
          curl --retry 3 -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod 755 "$d/bazel"
          test "$("$d/bazel" --version)" = 'bazel 9.3.1'
      - name: Run the public binary and both existing test consumers on each tree
        timeout-minutes: 93
        run: |
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" \
            USE_BAZEL_VERSION=9.3.1 GIT_TERMINAL_PROMPT=0 setpriv --no-new-privs python3 -B "$RUNNER_TEMP/test-app-runfile/check.py"
      - name: Validate the bounded public result
        id: public
        if: always()
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          d = Path(os.environ["RUNNER_TEMP"], "test-app-runfile/out")
          p = d / "verdict.json"
          assert list(d.iterdir()) == [p] and p.is_file() and not p.is_symlink()
          raw = p.read_bytes()
          assert 0 < len(raw) < 100000 and json.loads(raw)["status"] in ("PASS","FAIL","INCOMPLETE")
          assert not re.search(rb"(?i)x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_[A-Za-z0-9]{20,}|https?://", raw)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.public.outcome == 'success'
        with:
          name: test-app-runfile-consumers
          path: ${{ runner.temp }}/test-app-runfile/out/verdict.json
          if-no-files-found: error
      - name: Stop Bazel
        if: always()
        run: |
          d="$RUNNER_TEMP/test-app-runfile"
          if [[ -x "$d/bazel" ]]; then "$d/bazel" --nosystem_rc --nohome_rc --host_jvm_args=-Xmx4g shutdown; fi
