name: Compare the published TCP recovery fix on a split CUBIC bottleneck
on:
  push:
    branches: [qualification/tcp-16495-split-queue-pairs]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
          persist-credentials: false
      - name: Build both senders and run eight alternating pairs
        run: |
          cp test/benchmarks/tcp/{current-shared-report,flight_capture}.py "$RUNNER_TEMP/"
          cp test/benchmarks/tcp/current-shared-driver.sh "$RUNNER_TEMP/driver.sh"
          bash "$RUNNER_TEMP/driver.sh"
      - name: Reconcile receiver bytes, settings and packet observations
        if: always()
        run: python3 "$RUNNER_TEMP/current-shared-report.py"
      - name: Run the pinned benchstat tool on the verified transfers
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tcp-public"
          tools_source=2b51abee8530385431b7225198fdd5cd65e78696
          git fetch --quiet --no-tags --depth=1 origin "$tools_source"
          git checkout --quiet --detach "$tools_source"
          target=@org_golang_x_perf//cmd/benchstat
          bazel build --jobs=5 "$target"
          mapfile -t bins < <(bazel cquery --output=files "$target" | while read -r file; do if test -x "$file"; then echo "$file"; fi; done)
          test "${#bins[@]}" = 1
          tool="$PWD/${bins[0]}"
          (cd "$out"; "$tool" stock.bench fixed.bench | tee benchstat.txt)
          grep -q '^SharedLinkCUBIC' "$out/benchstat.txt"
      - name: Publish the existing synthetic WAN evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcp-16495-split-queue-pairs
          path: ${{ runner.temp }}/tcp-public/
          if-no-files-found: error
