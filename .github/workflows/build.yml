name: Trace both Make race launcher commands
on:
  push:
    branches: [qualification/make-race-callers]
permissions:
  contents: read
  actions: read
jobs:
  trace:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PRODUCT: d01551afde465a186992ecaf583f57cebbf98415
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Compare the two normal Make commands with the actual matched smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp test/rbe/trace-make-race.py "$RUNNER_TEMP/trace-race.py"
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          git fetch -q --depth=2 origin 8c6ed7a88a418240a629c29a6e9bbe217491bbab
          git checkout --detach "$PRODUCT"
          python3 "$RUNNER_TEMP/trace-race.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: make-race-command-comparison
          path: ${{ runner.temp }}/race-callers/result.json
          if-no-files-found: error
