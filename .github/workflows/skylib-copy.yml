name: Compare wheel namespace copies on stock Bazel
on:
  push:
    branches: [qualification/rules-python-bazel-lib-copy]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: consumer, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: bazel-contrib/rules_python, ref: 674ce0745dea93e54865d9cfb846510b30475969, path: supplier, persist-credentials: false}
      - name: Run the supplier's real namespace generator and replay its declared action
        env:
          USE_BAZEL_VERSION: 8.8.1
        run: python3 consumer/test/rbe/supplier-namespace/compare_copy.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: namespace-copy-comparison
          path: ${{ runner.temp }}/copy-results/
          if-no-files-found: error
