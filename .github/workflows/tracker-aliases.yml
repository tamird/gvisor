name: Validate tracker repository transfers

on:
  push:
    branches: [qualification/tracker-repository-aliases-20261117]

permissions:
  contents: read

jobs:
  tracker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bdc2831095db4802082bf870e74b71e9de243ee0
          persist-credentials: false
      - name: Run the tracker regression suites
        run: |
          python3 -m unittest discover -p '*_test.py'
          node --test app_test.mjs
      - name: Collect current public observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 update-status.py
      - name: Validate the complete snapshot
        run: node metadata-preflight.mjs .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tracker-alias-snapshot
          path: github-status.json
          if-no-files-found: error
