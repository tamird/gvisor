name: Static ZIP archive replay

"on":
  push:
    branches: [qualification/rules-pkg-zip-static-replay]

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the frozen request and original collector
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/supplier-zip-static"
          mkdir -p "$root/task/job"
          cp .github/qualification/supplier-zip-static/{request.json,plan.json,entry.json,submit.py,receipt.py} "$root/task/job/"
          cd "$root"
          src=https://raw.githubusercontent.com/tamird/gvisor/c90f4b72db82f87d279d9aa02c9009f96981d9f3/test/rbe
          for module in qualification_report.py unit_matrix.py; do
            curl --fail --silent --show-error --proto '=https' --max-time 45 "$src/$module" -o "$module"
          done
          sha256sum --check <<'SUMS'
          0afa620e3bf96f21b6bf806edd7cebc18fa53cb9b039ea141a63c9f4f82bee31  qualification_report.py
          209f47696a8c28e0072a6199d40f85edb855e656195189741ba4cb6215246a37  unit_matrix.py
          15a52682dbd12af6ff738472ac096f6434b02bf851b6cb072dbe0f98def2df99  task/job/request.json
          989c22ad844c42a12bcf4f1fe72c4d7ca4423d51060aa2b9275b04348ff9976a  task/job/plan.json
          e85115bdc2e98e4ff71aa80e364ff42e975ff43a9fa49cd0e4677bf7dec6f32d  task/job/entry.json
          37b3d7631c71e3bd5b31e24a43ebedde086c92e130705f2c7afc317221939dca  task/job/submit.py
          87df4528ad0b604c26f4a8bb79a4d02a37fcb31d6d560250ddfd832b8c21a375  task/job/receipt.py
          SUMS
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          job = Path("task/job")
          (job/"request.sh").write_text(json.loads((job/"request.json").read_bytes())["steps"][0]["run"])
          PYTHON
      - name: Submit once and collect the original result
        shell: python
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          import os, runpy
          from pathlib import Path
          key = os.environ.pop("BUILDBUDDY_API_KEY")
          entry = Path(os.environ["RUNNER_TEMP"]) / "supplier-zip-static/task/job/receipt.py"
          runpy.run_path(str(entry))["collect"](key)
      - name: Publish only the bounded verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supplier-zip-static-receipt
          path: ${{ runner.temp }}/supplier-zip-static/verdict.json
          if-no-files-found: error
          retention-days: 14
