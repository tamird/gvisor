name: Exercise native package tool launchers
on:
  push:
    branches: [qualification/rules-python-native-launcher-4183, qualification/rules-python-native-launcher-4183-relocated, qualification/rules-python-native-launcher-4183-relocated-public-zip-lock]
permissions:
  actions: read
  contents: read
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QUALIFICATION_ARCH: amd64
      QUALIFICATION_COMMIT: ${{ github.sha }}
      QUALIFICATION_EXECUTION: remote-actions
      QUALIFICATION_LANES: build
      QUALIFICATION_LOCAL_TEST_REQUIREMENTS: namespace
      QUALIFICATION_CLOCK_SOURCE: calibrated
      QUALIFICATION_TARGETS: ${{ startsWith(github.ref_name, 'qualification/rules-python-native-launcher-4183-relocated') && '//test/rbe/python_package_writers:relocated' || '//test/rbe/python_package_writers:payload //test/rbe/python_package_writers:package //test/rbe/python_package_writers:relocated' }}
      QUALIFICATION_HEADER_BASE: ''
      QUALIFICATION_COS_SHA256: ''
      QUALIFICATION_COS_GZIP_BASE64: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Resolve the published modules before snapshotting the lock
        run: |
          set -euo pipefail
          export USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          printf '%s\n' 'build:buildbuddy_remote_executor --define=writer_graph=true' > "$RUNNER_TEMP/preflight.bazelrc"
          bazelisk --bazelrc="$RUNNER_TEMP/preflight.bazelrc" mod graph --lockfile_mode=update --depth=1 --output=json > "$RUNNER_TEMP/graph.json"
          bazelisk --bazelrc="$RUNNER_TEMP/preflight.bazelrc" aquery --config=rbe --config=x86_64 --lockfile_mode=update --@rules_python//python/config_settings:bootstrap_impl=script --output=jsonproto \
            //test/rbe/python_package_writers:relocated > "$RUNNER_TEMP/zip-graph.json"
          test -s MODULE.bazel.lock
      - name: Fetch the pinned execution log decoder
        run: |
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "bdb65b4bddb8405a80b3e45a3ef4c740819b151d0709d360e8add8dac534c224  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
      - name: Build the original package writers and the manifest control
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          bash test/rbe/actions.sh \
            --bazel-option=--@rules_python//python/config_settings:bootstrap_impl=script \
            --bazel-option=--remote_download_outputs=all \
            '--bazel-option=--modify_execution_info=^(PackageTar|MakeDeb|RelocatedPythonWriter)$=+no-remote-cache'
      - name: Compare the actual Linux worker outputs
        if: always()
        run: python3 test/rbe/python_package_writers/native_evidence.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-launcher-evidence
          path: ${{ runner.temp }}/native-launcher.json
          if-no-files-found: error
