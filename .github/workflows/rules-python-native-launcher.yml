name: Recover original native ARM64 writer evidence
on:
  push:
    branches: [qualification/rules-python-native-arm-original]
permissions: {actions: read, contents: read}
jobs:
  original:
    if: github.repository == 'tamird/gvisor' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Read the original verifier and action identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh api repos/tamird/gvisor/actions/artifacts/12948268383/zip > "$RUNNER_TEMP/previous.zip"
          unzip -q "$RUNNER_TEMP/previous.zip" -d previous
      - name: Recover three original executed actions
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 test/rbe/python_package_writers/recover_arm.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: verified-original-writer-actions
          path: recovered.json
          if-no-files-found: error
