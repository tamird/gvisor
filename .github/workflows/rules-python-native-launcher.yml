name: Exercise native package tool launchers
on:
  push:
    branches: [qualification/rules-python-native-stock-stage1-arm]
permissions:
  actions: read
  contents: read
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QUALIFICATION_ARCH: arm64
      QUALIFICATION_COMMIT: ${{ github.sha }}
      QUALIFICATION_EXECUTION: remote-actions
      QUALIFICATION_LANES: build
      QUALIFICATION_LOCAL_TEST_REQUIREMENTS: namespace
      QUALIFICATION_CLOCK_SOURCE: calibrated
      QUALIFICATION_TARGETS: //test/rbe/python_package_writers:payload //test/rbe/python_package_writers:package //test/rbe/python_package_writers:relocated
      QUALIFICATION_HEADER_BASE: ''
      QUALIFICATION_COS_SHA256: ''
      QUALIFICATION_COS_GZIP_BASE64: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Resolve the dependency lock and both execution-configured writers
        run: |
          set -euo pipefail
          export USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          printf '%s\n' 'build:buildbuddy_remote_executor --define=writer_graph=true' > "$RUNNER_TEMP/preflight.bazelrc"
          bazelisk --bazelrc="$RUNNER_TEMP/preflight.bazelrc" mod graph --lockfile_mode=update --depth=1 --output=json > "$RUNNER_TEMP/graph.json"
          bazelisk --bazelrc="$RUNNER_TEMP/preflight.bazelrc" aquery --config=rbe-arm64 --config=aarch64 --host_platform=//tools/bazeldefs:rbe_linux_arm64 --extra_execution_platforms=//tools/bazeldefs:rbe_linux_arm64 --lockfile_mode=update --@rules_python//python/config_settings:bootstrap_impl=native --output=jsonproto \
            'outputs(".*/(build_tar|make_deb)$", deps(set(//test/rbe/python_package_writers:payload //test/rbe/python_package_writers:package //test/rbe/python_package_writers:relocated)))' > "$RUNNER_TEMP/writers.json"
          python3 test/rbe/python_package_writers/launcher_graph.py "$RUNNER_TEMP/writers.json" "$RUNNER_TEMP/native-graph.json"
      - name: Fetch the pinned execution log decoder
        run: |
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.485/bazel-5.0.485-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "bdb65b4bddb8405a80b3e45a3ef4c740819b151d0709d360e8add8dac534c224  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bb"
      - name: Build the original package writers and the manifest control
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          bash test/rbe/actions.sh \
            --bazel-option=--host_platform=//tools/bazeldefs:rbe_linux_arm64 \
            --bazel-option=--extra_execution_platforms=//tools/bazeldefs:rbe_linux_arm64 \
            --bazel-option=--@rules_python//python/config_settings:bootstrap_impl=native \
            --bazel-option=--remote_download_outputs=all \
            '--bazel-option=--modify_execution_info=^(PackageTar|MakeDeb|RelocatedPythonWriter)$=+no-remote-cache'
      - name: Compare the actual Linux worker outputs
        if: always()
        run: python3 test/rbe/python_package_writers/native_evidence.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-launcher-evidence
          path: |
            ${{ runner.temp }}/native-launcher.json
            ${{ runner.temp }}/native-graph.json
          if-no-files-found: error
