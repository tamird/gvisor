name: D-SACK receiver comparison

"on":
  push:
    branches: [qualification/dsack-above-gap-gcc]

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the frozen request and original collector
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/dsack-comparison"
          mkdir -p "$root/task"
          cp .github/qualification/dsack/{request.json,plan.json,submit.py,wire.py,reconcile.py} "$root/task/"
          cp .github/qualification/dsack/{receipt.py,header_gate.py} "$root/"
          cd "$root"
          src=https://raw.githubusercontent.com/tamird/gvisor/c90f4b72db82f87d279d9aa02c9009f96981d9f3/test/rbe
          for module in qualification_report.py unit_matrix.py; do
            curl --fail --silent --show-error --proto '=https' --max-time 45 "$src/$module" -o "$module"
          done
          sha256sum --check <<'SUMS'
          0afa620e3bf96f21b6bf806edd7cebc18fa53cb9b039ea141a63c9f4f82bee31  qualification_report.py
          209f47696a8c28e0072a6199d40f85edb855e656195189741ba4cb6215246a37  unit_matrix.py
          e50cd93bad465bdefb3f039778337a28ce32c6af1ad8646f9c345b6225e6a79c  receipt.py
          dcdd950f1466fe86818327397b02685ead033c1bc690d17137d3bf42f6286515  header_gate.py
          051e5f82bfda129ded159b0584db17bb3d0450ab8a6b7f6a033018644c912a25  task/request.json
          74e2da65b878c89d86f6a883c6ecc8dff8a6fa19104bc06a7b6dceeb8b0d2e98  task/plan.json
          4c27d3c1d2bda87dbe064551f708238852c8657cc27b646efe8a530c43796ed6  task/submit.py
          3b39e3f25b35967e409d0de1729f29288b32e83352ec84bf114ae3864818893b  task/wire.py
          bde69b236354cfd775dcb8ec12aa7381a22815fd57b1b7885129a74bb7ed4a5f  task/reconcile.py
          SUMS
      - name: Check the pinned coordinator compiler and all original missing headers
        shell: python
        run: |
          import os, runpy
          from pathlib import Path
          runpy.run_path(str(Path(os.environ["RUNNER_TEMP"])/"dsack-comparison"/"header_gate.py"), run_name="__main__")
      - name: Submit the two unexecuted owners once and collect the original result
        shell: python
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          import os, runpy
          from pathlib import Path
          key = os.environ.pop("BUILDBUDDY_API_KEY")
          runpy.run_path(str(Path(os.environ["RUNNER_TEMP"]) / "dsack-comparison" / "receipt.py"))["collect"](key)
      - name: Publish only the bounded verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsack-comparison-receipt
          path: ${{ runner.temp }}/dsack-comparison/verdict.json
          if-no-files-found: error
          retention-days: 14
