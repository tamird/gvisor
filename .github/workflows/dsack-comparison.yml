name: D-SACK corrected receiver

"on":
  push:
    branches: [qualification/dsack-above-gap-fixed-envelope]

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the frozen request and original collector
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/dsack-comparison"
          mkdir -p "$root/task"
          cp .github/qualification/dsack/{request.json,plan.json,submit.py,wire.py,reconcile.py} "$root/task/"
          cp .github/qualification/dsack/receipt.py "$root/"
          cd "$root"
          src=https://raw.githubusercontent.com/tamird/gvisor/c90f4b72db82f87d279d9aa02c9009f96981d9f3/test/rbe
          for module in qualification_report.py unit_matrix.py; do
            curl --fail --silent --show-error --proto '=https' --max-time 45 "$src/$module" -o "$module"
          done
          sha256sum --check <<'SUMS'
          0afa620e3bf96f21b6bf806edd7cebc18fa53cb9b039ea141a63c9f4f82bee31  qualification_report.py
          209f47696a8c28e0072a6199d40f85edb855e656195189741ba4cb6215246a37  unit_matrix.py
          24147a313254c77027c3ff93ccbe0cd778e3f2d1a0cc37ec077fbd1ca96a530d  receipt.py

          8fe6c3c1e95e418ef8dda770db492f920e0475a39990e67356597d5dbfd928c4  task/request.json
          455a1d90cf541ec0b052cf85dc28bcd37cfd1485fa981787d0ba93e2f986c9c7  task/plan.json
          91503f0748c86395a98c8d6fc94f853f5b8033da870c93039e941406eb13a6d4  task/submit.py
          3b39e3f25b35967e409d0de1729f29288b32e83352ec84bf114ae3864818893b  task/wire.py
          6071058a77f5066bb33dc0e76cfdc45ab3f7c25cbf97ab548aa27c6f35383c40  task/reconcile.py
          SUMS
      - name: Submit the corrected receiver once and collect its original wire, SACK and Nogo results
        shell: python
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          import os, runpy
          from pathlib import Path
          key = os.environ.pop("BUILDBUDDY_API_KEY")
          runpy.run_path(str(Path(os.environ["RUNNER_TEMP"]) / "dsack-comparison" / "receipt.py"))["collect"](key)
      - name: Publish only the bounded verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsack-comparison-receipt
          path: ${{ runner.temp }}/dsack-comparison/verdict.json
          if-no-files-found: error
          retention-days: 14
