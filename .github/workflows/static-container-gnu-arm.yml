name: Compare the two GNU ARM64 executable outputs
on:
  push:
    branches: [qualification/static-container-gnu-arm]
permissions:
  contents: read
jobs:
  test:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        mode: [arm-original, arm-fixed]
    env:
      MODE: ${{ matrix.mode }}
      BUILD_IMAGE: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Bind the unmodified test and the two settings to the candidate
        run: |
          set -eu
          test "$(git rev-parse HEAD^^)" = 27e91f79eec42815410e9103a1fcdd4f51c6405b
          test "$(git rev-parse HEAD~3)" = b9193eed0d34d1ad1aa0a5da5603c82871052e2e
          test "$(git rev-parse HEAD~4)" = f8cc8437f954cb8813509846c52fe2292f0c0123
          cp .github/qualification/static-container-root/{inside.sh,verify.py} "$RUNNER_TEMP"
          case "$MODE" in
            arm-original) sha=f8cc8437f954cb8813509846c52fe2292f0c0123;;
            arm-fixed) sha=b9193eed0d34d1ad1aa0a5da5603c82871052e2e;;
            *) exit 2;;
          esac
          git checkout --detach "$sha"
          curl -fsSL --retry 2 --max-time 120 https://github.com/buildbuddy-io/bazel/releases/download/5.0.488/bazel-5.0.488-linux-x86_64 -o "$RUNNER_TEMP/bb"
          printf "f0d85b1514f784dc25705dd3bbeeaa1e603b5449f721c26add0245198f03e7cb  %s\n" "$RUNNER_TEMP/bb" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bb"
          git diff --exit-code b9193eed0d34d1ad1aa0a5da5603c82871052e2e -- runsc/container/container_test.go
          docker pull --platform=linux/amd64 "$BUILD_IMAGE"
      - name: Cross-build exactly the two GNU ARM64 executable outputs
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/static-consumer" "$RUNNER_TEMP/gnu-static-platform"
          printf 'module(name="gnu_static_platform")\n' > "$RUNNER_TEMP/gnu-static-platform/MODULE.bazel"
          cat > "$RUNNER_TEMP/gnu-static-platform/BUILD" <<BUILD
          platform(name="gnu",constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"firecracker","EstimatedMemory":"8GB","container-image":"docker://$BUILD_IMAGE"},visibility=["//visibility:public"])
          BUILD
          umask 077
          trap 'rm -f "$RUNNER_TEMP/consumer.bazelrc"' EXIT
          cat > "$RUNNER_TEMP/consumer.bazelrc" <<EOF
          build --remote_executor=grpcs://remote.buildbuddy.io --remote_cache=grpcs://remote.buildbuddy.io --bes_backend=grpcs://remote.buildbuddy.io --bes_results_url=https://app.buildbuddy.io/invocation/
          build --spawn_strategy=remote --noremote_local_fallback
          test --strategy=TestRunner=remote
          build --inject_repository=gnu_static_platform=$RUNNER_TEMP/gnu-static-platform --host_platform=@gnu_static_platform//:gnu --extra_execution_platforms=@gnu_static_platform//:gnu
          build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY --bes_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
          EOF
          unset BUILDBUDDY_API_KEY
          docker run --rm --entrypoint /bin/bash --user root -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$BUILD_IMAGE" "$RUNNER_TEMP/inside.sh" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$MODE"
      - name: Verify the original configured ELF files
        if: always()
        run: python3 "$RUNNER_TEMP/verify.py" "$RUNNER_TEMP/static-consumer" "$MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: static-container-gnu-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/static-consumer/result.json
          if-no-files-found: error
