name: Check the declared Buildifier and tracked input boundary
on:
  push:
    branches: [qualification/buildifier-native-diff]
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE: d203ad64f60b785e04f2adb777dd78624e5c4958
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: carrier, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: source, ref: '${{ env.SOURCE }}', persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: before, ref: 1f6f8dd9f3f2fad74a597cd034ba30523cf7193c, persist-credentials: false}
      - name: Run the canonical lint driver
        working-directory: source
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cp ../carrier/.github/qualification/lint-source/buildifier.py "$RUNNER_TEMP/buildifier.py"
          p=$RUNNER_TEMP/lint_platform
          mkdir "$p" "$RUNNER_TEMP/bin" "$RUNNER_TEMP/formatter-private"
          echo 'module(name="lint_platform")' > "$p/MODULE.bazel"
          cat > "$p/BUILD" <<'BUILD'
          platform(name="ubuntu", constraint_values=["@platforms//cpu:x86_64","@platforms//os:linux"],
                   exec_properties={"Arch":"amd64","OSFamily":"linux","workload-isolation-type":"oci","container-image":"docker://mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02"}, visibility=["//visibility:public"])
          BUILD
          rc=$RUNNER_TEMP/lint.bazelrc
          umask 077
          trap 'rm -f "$rc"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' 'build --remote_cache=grpcs://remote.buildbuddy.io' 'build --bes_backend=grpcs://remote.buildbuddy.io' 'build --bes_results_url=https://app.buildbuddy.io/invocation/' 'build --spawn_strategy=remote' 'build --noremote_local_fallback' "build --inject_repository=lint_platform=$p" 'build --host_platform=@lint_platform//:ubuntu' 'build --extra_execution_platforms=@lint_platform//:ubuntu' 'build --platforms=//tools/bazeldefs:linux_amd64'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          bazel_binary=$(command -v bazel)
          printf '#!/bin/sh\nexec "%s" --bazelrc="%s" "$@"\n' "$bazel_binary" "$rc" > "$RUNNER_TEMP/bin/bazel"
          chmod +x "$RUNNER_TEMP/bin/bazel"
          export PATH="$RUNNER_TEMP/bin:$PATH" LINT_CACHE_DIR="$RUNNER_TEMP/formatter-private" PYTHONDONTWRITEBYTECODE=1
          python3 "$RUNNER_TEMP/buildifier.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: buildifier-check
          path: ${{ runner.temp }}/buildifier.json
          if-no-files-found: error
