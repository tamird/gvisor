name: Measure string storage in one Nginx kernel checkpoint
on:
  push:
    branches: [qualification/state-string-slab-original-gnu]
permissions:
  contents: read
jobs:
  kernel-original:
    if: github.repository == 'tamird/gvisor' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Read the original GNU packaging diagnostic
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 test/rbe/string_kernel/kernel_original.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-origin
          path: ${{ runner.temp }}/kernel-origin.json
