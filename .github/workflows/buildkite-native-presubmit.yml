name: Native Buildkite presubmit build probe

on:
  push:
    branches: [qualification/buildkite-native-compile-owners]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
            bazel_arch: x86_64
            sha: 5b5bab2095065817d3416ca9a0678bd39c10c9ede432dbe8187bfe74de285160
          - runner: ubuntu-24.04-arm
            machine: aarch64
            bazel_arch: arm64
            sha: 41ad5f9e833fcaee7398111343570cb155ca14985abb084b1f0ad2d29eaaec6d
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PRODUCT: 08a25f9818d1fb17c53e086fcf63d1e6e0a7e294
      MACHINE: ${{ matrix.machine }}
      DOCKER_HOST: unix:///nonexistent-gvisor-builder.sock
      MAKEFLAGS: DOCKER_BUILD=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select the source checkout and the pinned native Bazel
        env:
          BAZEL_ARCH: ${{ matrix.bazel_arch }}
          BAZEL_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          cp .github/qualification/native-presubmit/report.py "$RUNNER_TEMP/report.py"
          git checkout --detach "$PRODUCT"
          test "$(uname -m)" = "$MACHINE"
          test "$(cat .bazelversion)" = 8.8.1
          mkdir "$RUNNER_TEMP/native-bin" "$RUNNER_TEMP/receipts"
          curl -fsSL --retry 3 "https://releases.bazel.build/8.8.1/release/bazel-8.8.1-linux-$BAZEL_ARCH" -o "$RUNNER_TEMP/bazel-real"
          echo "$BAZEL_SHA  $RUNNER_TEMP/bazel-real" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bazel-real"
          cat > "$RUNNER_TEMP/native-bin/bazel" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          subcommand=$1
          shift
          flags=(--jobs=4 --remote_cache= --remote_executor= --spawn_strategy=sandboxed,local)
          if [[ $subcommand == build || $subcommand == test ]]; then
            flags+=(--build_event_json_file="$RUNNER_TEMP/$PHASE.jsonl")
          fi
          exec "$RUNNER_TEMP/bazel-real" "$subcommand" "${flags[@]}" "$@"
          SCRIPT
          chmod +x "$RUNNER_TEMP/native-bin/bazel"
          echo "$RUNNER_TEMP/native-bin" >> "$GITHUB_PATH"
          make -s testlogs
          test ! -e bazel-server-inc
          df -h .
          for tool in gcc g++ ld go python3 perl zip aarch64-linux-gnu-gcc x86_64-linux-gnu-gcc; do
            command -v "$tool" || true
          done
      - name: Trace original configured actions from the real boot and filter owners
        run: |
          set -euo pipefail
          status=0
          for owner in //runsc/boot:boot //runsc/boot:boot_nogo //runsc/boot/filter:filter //runsc/boot/filter:filter_nogo; do
            if bazel aquery --include_artifacts=false --include_commandline --include_aspects --output=jsonproto \
              "mnemonic('Genrule',deps($owner))" > "$RUNNER_TEMP/${owner##*:}-graph.json"; then
              python3 "$RUNNER_TEMP/report.py" graph "$owner" || status=1
            else
              status=1
            fi
          done
          exit "$status"
      - name: Confirm which of the original 97 are selected by the dedicated Nogo job
        if: always() && !cancelled() && matrix.machine == 'x86_64'
        env:
          PHASE: nogo-selection
        run: |
          set +e
          bazel test --nobuild --test_tag_filters=nogo --build_tests_only //... > "$RUNNER_TEMP/$PHASE.log" 2>&1
          code=$?
          tail -n 8 "$RUNNER_TEMP/$PHASE.log"
          python3 "$RUNNER_TEMP/report.py" "$PHASE" "$code"
      - name: Build the 258 original non-analyzer runsc targets
        if: always() && !cancelled()
        env:
          PHASE: runsc
        run: |
          set +e
          timeout 40m make build OPTIONS='--build_tag_filters=-network_plugins,-nogo' TARGETS='//runsc/...' > "$RUNNER_TEMP/$PHASE.log" 2>&1
          code=$?
          if [[ $code == 0 ]]; then
            bazel cquery --output=files //runsc:runsc > "$RUNNER_TEMP/runsc.outputs"
          fi
          tail -n 8 "$RUNNER_TEMP/$PHASE.log"
          python3 "$RUNNER_TEMP/report.py" "$PHASE" "$code"
      - name: Build the independent unfiltered pkg wildcard within 45 minutes
        if: always() && !cancelled() && matrix.machine == 'x86_64'
        env:
          PHASE: pkg
        run: |
          set +e
          timeout 45m make build TARGETS='//pkg/...' > "$RUNNER_TEMP/$PHASE.log" 2>&1
          code=$?
          tail -n 10 "$RUNNER_TEMP/$PHASE.log"
          python3 "$RUNNER_TEMP/report.py" "$PHASE" "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-presubmit-${{ matrix.machine }}
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: warn
