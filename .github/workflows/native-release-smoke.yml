name: Execute the assembled source release on its native CPU
on:
  push:
    branches: [qualification/buildkite-smoke-default-tests]
permissions:
  contents: read
jobs:
  smoke:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: ubuntu-22.04, machine: x86_64}
          - {host: ubuntu-22.04-arm, machine: aarch64}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 118
    env:
      SOURCE: 5b7afbced7307cdf9f90dff013c4acb77707054d
      PROPOSAL: 3ab02c201d1842c00081552221fa8fe37fe3c884
      MACHINE: ${{ matrix.machine }}
      DOCKER_BUILD: "false"
      BAZEL_REMOTE_CACHE: --remote_cache=grpcs://remote.buildbuddy.io
      BAZEL_OPTIONS: "'--build_metadata=SMOKE_QUALIFIER=native smoke'"
    steps:
      - name: Record expected results before setup
        run: |
          mkdir -p "$RUNNER_TEMP/direct-smoke/records"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          targets = ["release"] + (["release-race"] if os.environ["MACHINE"] == "x86_64" else [])
          Path(os.environ["RUNNER_TEMP"], "direct-smoke", "records", "expected.json").write_text(json.dumps({
              "source": os.environ["SOURCE"], "carrier": os.environ["GITHUB_SHA"], "architecture": os.environ["MACHINE"],
              "expected": targets, "requiredFreshPerTarget": 2, "status": "INCOMPLETE"}))
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Select source and check the existing namespace policy
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/direct-smoke"
          cp test/rbe/direct-release-smoke.py "$d/"
          [[ "$(git rev-parse HEAD^)" == "$SOURCE" ]]
          git checkout --detach "$SOURCE"
          git diff --quiet
          [[ "$(uname -m)" == "$MACHINE" && "$(id -u)" != 0 ]]
          python3 - <<'PYTHON'
          import json, os, platform, subprocess
          from pathlib import Path
          p = Path("/proc/sys/kernel/apparmor_restrict_unprivileged_userns")
          proc = subprocess.run(["unshare", "-Ur", "/bin/true"], capture_output=True)
          Path(os.environ["RUNNER_TEMP"], "direct-smoke", "records", "namespace.json").write_text(json.dumps({
              "kernel":platform.release(), "uid":os.getuid(), "policy":p.read_text().strip() if p.exists() else None,
              "exit":proc.returncode}))
          raise SystemExit(proc.returncode)
          PYTHON
          if ! /usr/bin/python3 -c 'import yaml'; then sudo apt-get update -qq && sudo apt-get install -y python3-yaml; fi
      - name: Configure only the shared action cache on the native client
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${BUILDBUDDY_API_KEY:?}"
          {
            printf '%s\n' 'build --remote_download_outputs=toplevel' 'build --noremote_upload_local_results' 'build --modify_execution_info=^GoStdlib$=+no-cache'
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$RUNNER_TEMP/direct-smoke/cache.rc"
      - name: Use the Buildkite Bazelisk setup and run the actual source smoke commands
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source <(sed -n '/^install_bazelisk() {$/,$p' .buildkite/hooks/pre-command)
          [[ "$(command -v bazel)" == "$BUILDKITE_BAZEL_DIRECTORY/bazel" ]]
          df -h . | tail -1
          timeout --kill-after=20s 105m /usr/bin/python3 "$RUNNER_TEMP/direct-smoke/direct-release-smoke.py"
      - name: Keep credentials and HTTP headers out of the public receipt
        id: sanitize
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          records = Path(os.environ['RUNNER_TEMP'], 'direct-smoke', 'records')
          key = os.environ['BUILDBUDDY_API_KEY'].encode()
          assert key
          manifest = records / 'expected.json'
          summary = json.loads(manifest.read_bytes())
          files = {flavor + '.json' for flavor in summary['expected']}
          assert {p.name for p in records.iterdir()} <= files | {'expected.json', 'namespace.json', 'metadata.json'}
          rows = [json.loads((records / name).read_bytes()) for name in files if (records / name).is_file()]
          if len(rows) == len(files) and all(row['accepted'] for row in rows):
              summary['status'] = 'PASS'
          elif any(row.get('error') for row in rows):
              summary['status'] = 'FAIL'
          from datetime import datetime, timezone
          summary['verifiedAt'] = datetime.now(timezone.utc).isoformat()
          manifest.write_text(json.dumps(summary))
          for p in records.iterdir():
              raw = p.read_bytes()
              assert len(raw) < 64000 and p.suffix == '.json'
              json.loads(raw)
              assert key not in raw
              assert not re.search(rb'(?i)x-buildbuddy-api-key|authorization\s*:|bearer\s+[A-Za-z0-9_.-]{12,}', raw)
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.sanitize.outcome == 'success'
        with:
          name: native-smoke-targets-${{ matrix.machine }}
          path: ${{ runner.temp }}/direct-smoke/records/
          if-no-files-found: error
