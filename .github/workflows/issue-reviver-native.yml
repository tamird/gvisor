name: Qualify the native issue reviver
on:
  push:
    branches: [qualification/issue-reviver-repository-guard]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRODUCT: 3f9a9984a26daaf62abdb8498b98a2499e7e132f
      DOCKER_HOST: unix:///no-gvisor-builder.sock
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 3
        persist-credentials: false
    - name: Select the exact source and production commands
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^)" = "$PRODUCT"
        test "$(git rev-parse HEAD~2)" = 3847ed738e1a59892b936aebb1b9164c4f31ee95
        cp .github/qualification/issue-reviver-native/{fixture,unit}.py "$RUNNER_TEMP/"
        git checkout --detach "$PRODUCT"
        test -z "${GITHUB_TOKEN:-}"
        test "$(cat .bazelversion)" = 9.3.1
        test "$(bazel version --gnu_format | tail -1)" = 'bazel 9.3.1'
        git show HEAD^:.github/workflows/issue_reviver.yml > "$RUNNER_TEMP/baseline.yml"
        ruby -ryaml -rjson - "$RUNNER_TEMP/baseline.yml" <<'RUBY'
        old = YAML.safe_load_file(ARGV.fetch(0)).fetch("jobs").fetch("issue_reviver")
        job = YAML.safe_load_file(".github/workflows/issue_reviver.yml").fetch("jobs").fetch("issue_reviver")
        guard = job.fetch("if")
        expected = %q[(github.repository == 'google/gvisor' || github.repository == 'gvisor/gvisor')]
        abort unless guard == expected && old.fetch("steps").map { |step| step.fetch("if") }.uniq == [guard]
        abort unless job.fetch("permissions") == {"issues" => "write"} && job.fetch("runs-on") == old.fetch("runs-on")
        checkout, build, revive = job.fetch("steps")
        abort unless job.fetch("steps").length == 3 && checkout.fetch("with").fetch("persist-credentials") == false
        abort unless checkout.fetch("uses") == old.fetch("steps").first.fetch("uses")
        abort unless job.fetch("steps").none? { |step| step.key?("if") } && !checkout.key?("env") && !build.key?("env")
        abort unless revive.fetch("env") == old.fetch("steps").last.fetch("env")
        tmp = ENV.fetch("RUNNER_TEMP")
        {"build.command" => build, "revive.command" => revive}.each { |file, step| File.write(File.join(tmp, file), step.fetch("run")) }
        File.write(File.join(tmp, "guard-result.json"), JSON.generate({source: ENV.fetch("PRODUCT"), guard: guard, credentials: "revive step only"}))
        RUBY
    - name: Build the real launcher
      id: launcher
      run: |
        set -euo pipefail
        bash "$RUNNER_TEMP/build.command"
        test -x "$RUNNER_TEMP/issue-reviver"
    - name: Capture the original named unit outcomes
      run: |
        set -euo pipefail
        bazel test --cache_test_results=no --test_arg=-test.v --test_output=all --build_event_json_file="$RUNNER_TEMP/unit.bep" //tools/github/reviver:reviver_test
        python3 "$RUNNER_TEMP/unit.py"
    - name: Run the launcher against two fixture issues without external networking
      if: always() && steps.launcher.outcome == 'success'
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/scan/nested"
        printf '%s\n' '// TODO(gvisor.dev/issue/101): open fixture' '// TODO(gvisor.dev/issue/202): closed fixture' > "$RUNNER_TEMP/scan/nested/todos.go"
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=api.github.com -addext subjectAltName=DNS:api.github.com -keyout "$RUNNER_TEMP/fixture.key" -out "$RUNNER_TEMP/fixture.crt" >/dev/null 2>&1
        printf '127.0.0.1 localhost api.github.com\n' > "$RUNNER_TEMP/fixture.hosts"
        sudo env RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" QUAL_UID="$(id -u)" QUAL_GID="$(id -g)" unshare --net --mount --propagation private bash -euc '
          cd /
          ip link set lo up
          mount --bind "$RUNNER_TEMP/fixture.hosts" /etc/hosts
          mount --bind "$RUNNER_TEMP/scan" "$GITHUB_WORKSPACE"
          python3 "$RUNNER_TEMP/fixture.py"'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: issue-reviver-evidence
        path: |
          ${{ runner.temp }}/unit-result.json
          ${{ runner.temp }}/issue-result.json
          ${{ runner.temp }}/guard-result.json
        if-no-files-found: error
