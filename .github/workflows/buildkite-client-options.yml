name: Native Buildkite boot benchmark diagnosis
on:
  push:
    branches: [qualification/buildkite-lifecycle-boot-diagnosis]
permissions:
  contents: read
  actions: read
jobs:
  lifecycle:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    env:
      PRODUCT: b3d4e84a076711ed21508b9022303f77abe370d1
      INTEGRATION: 41bfc26a183f3a2a61d805ef8b4bbd80289f7794
      COMPILER: a385bd2b0155b82faf4fc6a0c195a153ad57550c
      MASTER: 471d6dff5229b99208bf6fec985601067f1f9d69
      REPORTER: 3731120a4fb306ee37126760bae54a4da38e18f8
      DOCKER_BUILD: "false"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 4, persist-credentials: false}
    - name: Select the published Buildkite source and prior native reporter
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/lifecycle"
        mkdir -m 700 "$d"
        printf '{"status":"INCOMPLETE","stage":"source"}\n' > "$d/result.json"
        test "$(git rev-parse HEAD^)" = c5eb76e8a9d756ddbf39d86948656620f0d9574a
        test "$(git rev-parse HEAD~2)" = "$INTEGRATION"
        test "$(git rev-parse "$INTEGRATION^1")" = "$PRODUCT"
        test "$(git rev-parse "$INTEGRATION^2")" = "$COMPILER"
        test "$(git rev-parse "$INTEGRATION^{tree}")" = a2a154ca76bd55ac9528ffc9646a81cfb52b6680
        cp .github/qualification/buildkite-lifecycle.py "$d/"
        git fetch -q --no-tags --depth=1 origin "$REPORTER" "$MASTER"
        for name in qualification_report unit_matrix; do git show "$REPORTER:test/rbe/$name.py" > "$d/$name.py"; done
        git show "$REPORTER:test/benchmarks/lifecycle.json" > "$d/manifest.json"
        git switch --quiet --detach "$INTEGRATION"
        test "$(git diff --name-only "$MASTER" "$PRODUCT" | sort)" = "$(printf '%s\n' .buildkite/first-pass.yaml .buildkite/hooks/post-command .buildkite/hooks/pre-command .buildkite/pipeline.yaml tools/bazel.mk)"
        git diff --quiet "$MASTER" "$PRODUCT" -- Makefile tools/parsers tools/bigquery pkg runsc shim sandboxexec
        git diff --quiet "$PRODUCT" HEAD -- .buildkite Makefile tools/bazel.mk tools/parsers tools/bigquery runsc/container shim/tests sandboxexec/sandbox
        git diff --quiet "$COMPILER" HEAD -- pkg/sentry/platform/systrap/sysmsg/BUILD vdso/BUILD tools/bazeldefs/cc.bzl
        test -z "$(git status --porcelain --untracked-files=no)"
    - name: Bind the original 94 rows, five successful native samples and both failures
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api repos/tamird/gvisor/actions/artifacts/13252074858/zip > "$RUNNER_TEMP/lifecycle/original.zip"
        python3 -B "$RUNNER_TEMP/lifecycle/buildkite-lifecycle.py" originals
    - name: Provision Bazelisk using the native Buildkite hook
      run: |
        set -euo pipefail
        grep -q '^install_bazelisk() {' .buildkite/hooks/pre-command
        source <(sed -n '/^install_bazelisk() {/,$p' .buildkite/hooks/pre-command)
        printf '%s\n' "$BUILDKITE_BAZEL_DIRECTORY" >> "$GITHUB_PATH"
        printf 'BUILDKITE_BAZEL_DIRECTORY=%s\n' "$BUILDKITE_BAZEL_DIRECTORY" >> "$GITHUB_ENV"
        "$BUILDKITE_BAZEL_DIRECTORY/bazel" --version
        command -v python3
        python3 -c 'import yaml'
        sudo -n test -r /dev/kvm
        sudo -n test -w /dev/kvm
        test -r /proc/self/mountinfo
    - name: Run only the original KVM and systrap boot cases with child status capture
      id: native
      run: timeout --signal=INT --kill-after=30s 70m python3 -B "$RUNNER_TEMP/lifecycle/buildkite-lifecycle.py" native
    - name: Exercise the Buildkite successful-shutdown path
      id: cleanup
      if: always() && env.BUILDKITE_BAZEL_DIRECTORY != ''
      run: |
        set -euo pipefail
        test "$(command -v bazel)" = "$BUILDKITE_BAZEL_DIRECTORY/bazel"
        export BUILDKITE_COMMAND_EXIT_STATUS=0
        grep -Fq 'if [[ -n "${BUILDKITE_BAZEL_DIRECTORY:-}"' .buildkite/hooks/post-command
        source <(sed -n '/^if \[\[ -n "${BUILDKITE_BAZEL_DIRECTORY:-}"/,$p' .buildkite/hooks/post-command)
        test ! -e "$BUILDKITE_BAZEL_DIRECTORY"
    - name: Check the bounded evidence for publication
      if: always()
      id: scan
      shell: python
      env:
        CLEANUP: ${{ steps.cleanup.outcome }}
      run: |
        from datetime import datetime, timezone
        import json, os, re
        from pathlib import Path
        path = Path(os.environ['RUNNER_TEMP']) / 'lifecycle/result.json'
        doc = json.loads(path.read_text())
        doc['cleanup'] = os.environ['CLEANUP']
        if doc['status'] == 'PASS' and doc['cleanup'] != 'success':
            doc['status'] = 'FAIL'
        doc['finished_utc'] = datetime.now(timezone.utc).isoformat()
        raw = (json.dumps(doc, indent=2)+'\n').encode()
        assert len(raw) < 160000
        assert json.loads(raw)['status'] in ('PASS', 'FAIL', 'INCOMPLETE')
        assert not re.search(rb'(?i)gh[pousr]_|github_pat_|x-buildbuddy-api-key|authorization[:=]|BEGIN [A-Z]+ PRIVATE KEY', raw)
        for key, value in os.environ.items():
            if value and re.search(r'(?i)(?:TOKEN|PASSWORD|API_KEY|SECRET)$', key):
                assert value.encode() not in raw and json.dumps(value)[1:-1].encode() not in raw
        path.write_bytes(raw)
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.scan.outcome == 'success'
      with:
        name: native-boot-benchmark-diagnosis
        path: ${{ runner.temp }}/lifecycle/result.json
        if-no-files-found: error
