name: Reconcile native Buildkite client options
on:
  push:
    branches: [qualification/buildkite-client-options]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE: 9ae6638ae6d1916725b10f45a5cad76f022d9d7e
      DOCKER_BUILD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 5, persist-credentials: false}
      - name: Retrieve the exact original comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = df6d55271c58bb5d0ecfe2cbf6f4da6e5cd0f9e1
          mkdir "$RUNNER_TEMP/client-options"
          printf '{"status":"INCOMPLETE","source":"%s","stage":"recovery-bootstrap"}\n' "$SOURCE" > "$RUNNER_TEMP/client-options/result.json"
          gh api repos/tamird/gvisor/actions/artifacts/13205600447/zip > "$RUNNER_TEMP/original.zip"
      - name: Reconcile the retained command and configured-owner evidence
        run: .github/qualification/buildkite-client-options.py --reconcile-original "$RUNNER_TEMP/original.zip"
      - name: Check the bounded typed publication
        id: scan
        if: always()
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'client-options/result.json'
          raw=p.read_bytes()
          assert len(raw)<8_000_000
          json.loads(raw)
          assert not re.search(rb'(?i)gh[pousr]_|github_pat_|x-buildbuddy-api-key|authorization[:=]|BEGIN [A-Z]+ PRIVATE KEY',raw)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.scan.outcome == 'success'
        with:
          name: native-buildkite-client-options
          path: ${{ runner.temp }}/client-options/result.json
          if-no-files-found: error
