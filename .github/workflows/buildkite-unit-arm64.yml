name: ARM64 Python sandbox host-policy diagnostic
on:
  push:
    branches: [qualification/arm64-sandbox-python-policy]
permissions:
  contents: read
jobs:
  owner:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    env:
      DOCKER_BUILD: 'false'
      ORIGINAL: ea96012d1c799a775b8781834f9a69a6ffbf583a
      PRODUCT: 96fadde722e14d482a62276b80237398f8b62fbf
      STOCK: 8e13db5ad62802add68356df383e4a581e8eb303
      VERIFIER: 6b3fe9ab6c03facafe6340c85f8d60ca3591566b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Run one unprivileged test from both sources and trace the reproduced failure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit-results"
          printf '{"status":"INCOMPLETE","reason":"bootstrap"}\n' > "$RUNNER_TEMP/unit-results/verdict.json"
          cp .github/qualification/buildkite-unit-arm64.py "$RUNNER_TEMP"
          test "$(git rev-parse HEAD^)" = "$ORIGINAL"
          test "$(git rev-parse HEAD^^)" = "$PRODUCT"
          test "$(git rev-parse HEAD^^^)" = "$STOCK"
          git diff --quiet "$STOCK" "$PRODUCT" -- sandboxexec runsc pkg vdso
          git fetch --quiet --depth=1 origin "$VERIFIER"
          for helper in unit_matrix qualification_report; do
            git show "$VERIFIER:test/rbe/$helper.py" > "$RUNNER_TEMP/$helper.py"
          done
          git checkout --quiet --detach "$PRODUCT"
          sed -n '/^install_.*bazel() {$/,$p' .buildkite/hooks/pre-command > "$RUNNER_TEMP/unit-setup.bash"
          source "$RUNNER_TEMP/unit-setup.bash"
          test -n "$BUILDKITE_BAZEL_DIRECTORY"
          test "$(bazel --version)" = "bazel $(cat .bazelversion)"
          printf '%s\n' 'build --jobs=4' 'build --remote_cache=' 'build --remote_executor=' > "$RUNNER_TEMP/unit-resources.bazelrc"
          python3 "$RUNNER_TEMP/buildkite-unit-arm64.py"
      - name: Check the bounded receipt and original case artifacts
        id: scan
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "unit-results"
          names = {"verdict.json", *(arm + "." + ext for arm in ("stock", "candidate", "trace") for ext in ("xml", "log"))}
          for path in root.iterdir():
              assert path.name in names and path.is_file() and not path.is_symlink()
              data = path.read_bytes()
              assert len(data) < 1024**2
              assert not re.search(rb"gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY|x-buildbuddy-api-key=", data, re.I)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.scan.outcome == 'success'
        with:
          name: arm64-sandbox-python-policy
          path: ${{ runner.temp }}/unit-results/
          if-no-files-found: error
