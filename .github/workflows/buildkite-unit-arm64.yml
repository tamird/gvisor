name: Verify native unit and Nogo jobs together
on:
  push:
    branches: [qualification/buildkite-unit-nogo-combined]
permissions:
  contents: read
  actions: read
jobs:
  owner:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    env:
      PRODUCT: bd30becb998f8ea950fcb7cbf19c9d8224bb5581
      UNIT: 5555ba1f24f319f77ad240a0e0f5aa8ef08a1d57
      NOGO: a19da812a7d6abefcb48cdddf5dba24f0e178e02
      PARENT: 896acc45666c609ab05f92160f322f976a86cea1
      VERIFIER: 6b3fe9ab6c03facafe6340c85f8d60ca3591566b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Initialize the bounded verdict
        run: |
          mkdir -p "$RUNNER_TEMP/unit-results"
          printf '{"status":"INCOMPLETE","source":"%s","reason":"bootstrap"}\n' "$PRODUCT" > "$RUNNER_TEMP/unit-results/verdict.json"
      - name: Retrieve the exact Nogo comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tamird/gvisor/actions/artifacts/13205005426/zip > "$RUNNER_TEMP/original-nogo.zip"
      - name: Check the six job definitions and run the license owner
        run: |
          set -euo pipefail
          cp .github/qualification/buildkite-unit-arm64.py "$RUNNER_TEMP"
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/qualification/buildkite-unit-arm64.py .github/workflows/buildkite-unit-arm64.yml)"
          git fetch --quiet --depth=1 origin "$VERIFIER" "$UNIT" "$NOGO"
          for helper in unit_matrix qualification_report; do
            git show "$VERIFIER:test/rbe/$helper.py" > "$RUNNER_TEMP/$helper.py"
          done
          git checkout --quiet --detach "$PRODUCT"
          sed -n '/^install_bazelisk() {$/,$p' .buildkite/hooks/pre-command > "$RUNNER_TEMP/unit-setup.bash"
          export DOCKER_BUILD=false
          source "$RUNNER_TEMP/unit-setup.bash"
          unset DOCKER_BUILD
          /usr/bin/python3 -c "import yaml" || sudo apt-get -qq install --no-install-recommends python3-yaml
          test -n "$BUILDKITE_BAZEL_DIRECTORY"
          test "$(bazel --version)" = "bazel $(cat .bazelversion)"
          printf '%s\n' 'build --jobs=4' 'build --remote_cache=' 'build --remote_executor=' > "$RUNNER_TEMP/unit-resources.bazelrc"
          /usr/bin/python3 "$RUNNER_TEMP/buildkite-unit-arm64.py"
      - name: Check bounded original evidence
        id: scan
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "unit-results"
          secrets = [v.encode() for k,v in os.environ.items() if re.search(r'TOKEN|SECRET|KEY',k) and len(v)>12]
          for path in root.iterdir():
              assert path.name in {"verdict.json", "test.xml", "test.log"} and path.is_file() and not path.is_symlink()
              data = path.read_bytes()
              assert len(data) < 2*1024**2
              assert not any(value in data for value in secrets)
              assert not re.search(rb"gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY|x-buildbuddy-api-key=", data, re.I)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.scan.outcome == 'success'
        with:
          name: native-combined-unit-nogo
          path: ${{ runner.temp }}/unit-results/
          if-no-files-found: error
