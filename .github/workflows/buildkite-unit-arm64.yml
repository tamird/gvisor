name: Diagnose one ARM64 checkpoint printer child
on:
  push:
    branches: [qualification/buildkite-unit-arm64-checkpoint-diagnostic]
permissions:
  contents: read
  actions: read
jobs:
  unit:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.run_attempt == 1
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 35
    env:
      DOCKER_BUILD: 'false'
      PRODUCT: ef0120bb5f5dc3abf44705334b2db25194406054
      VERIFIER: d077ba62f9ac0895de75076bb3ad19f7ac74223c
      PROVENANCE: 0a9bdf9bc331d6a66f35aefcbbb5cf466eb6f7f5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Recover the original failed leaf receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tamird/gvisor/actions/artifacts/13218491847/zip > "$RUNNER_TEMP/original.zip"
      - name: Configure bounded Go compilation on the ARM64 worker
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BUILDBUDDY_API_KEY"
          umask 077
          cat > "$RUNNER_TEMP/unit-resources.bazelrc" <<EOF
          build --jobs=20
          test --local_test_jobs=3
          build --remote_cache=grpcs://remote.buildbuddy.io
          build --remote_executor=grpcs://remote.buildbuddy.io
          build --remote_default_exec_properties=OSFamily=linux
          build --remote_default_exec_properties=Arch=arm64
          build --remote_default_exec_properties=workload-isolation-type=oci
          build --remote_default_exec_properties=container-image=docker://docker.io/library/buildpack-deps@sha256:496160b38def7107f238785d58e3762c72341dd83533d54c1d1b84c3a6fbcad2
          build --remote_download_outputs=toplevel
          build --spawn_strategy=sandboxed,local
          build --strategy=GoCompilePkg=remote,local
          build --strategy=TestRunner=local
          build --remote_local_fallback
          build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
          EOF
      - name: Run only the failed checkpoint leaf on native ARM64
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit-results"
          printf '{"status":"INCOMPLETE","reason":"bootstrap"}\n' > "$RUNNER_TEMP/unit-results/verdict.json"
          cp .github/qualification/buildkite-unit-arm64.py "$RUNNER_TEMP"
          git fetch --quiet --depth=1 origin "$VERIFIER"
          for tool in unit_matrix qualification_report; do
            git show "$VERIFIER:test/rbe/$tool.py" > "$RUNNER_TEMP/$tool.py"
          done
          git fetch --quiet --depth=1 origin "$PROVENANCE"
          git show "$PROVENANCE:test/rbe/stdlib-provenance.py" > "$RUNNER_TEMP/stdlib_provenance.py"
          command -v zstd
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          git checkout --quiet --detach "$PRODUCT"
          sed -n '/^install_.*bazel() {$/,$p' .buildkite/hooks/pre-command > "$RUNNER_TEMP/unit-setup.bash"
          source "$RUNNER_TEMP/unit-setup.bash"
          test -n "$BUILDKITE_BAZEL_DIRECTORY"
          test "$(bazel --version)" = "bazel $(cat .bazelversion)"
          python3 "$RUNNER_TEMP/buildkite-unit-arm64.py"
      - name: Scan bounded evidence
        id: scan
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'unit-results'
          secrets = [value.encode() for key, value in os.environ.items()
                     if re.search('TOKEN|SECRET|PASSWORD|CREDENTIAL|API_KEY', key) and len(value) > 16]
          path = root / 'verdict.json'
          assert not path.is_symlink()
          data = path.read_bytes()
          assert len(data) < 100_000
          assert not any(secret in data for secret in secrets)
          assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY', data)
          assert not re.search(rb"(?i)\b(?:x-buildbuddy-api-key|authorization)[\"']?\s*[:=]", data)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.scan.outcome == 'success'
        with:
          name: native-arm64-checkpoint-diagnostic
          path: ${{ runner.temp }}/unit-results/verdict.json
          if-no-files-found: error
