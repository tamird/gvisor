name: Qualify the systrap C portability amendment natively
on:
  push:
    branches: [qualification/atomic-systrap-native-resume]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && !github.event.deleted
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64, config: x86_64, bazel_arch: x86_64, bazel_sha: 7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c}
          - {runner: ubuntu-24.04-arm, arch: arm64, config: aarch64, bazel_arch: arm64, bazel_sha: 10ba9cb76d4ee748d274dcc2981992bb12b74a203dc41a9c2eceeb8f29359366}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    env:
      SOURCE: 5a397632d896158997ee7594866b33d741c56917
      BASE: bf5df9a1c9211afe4dbd7267c4423e9ae575f7fa
      QUAL_ARCH: ${{ matrix.arch }}
      QUAL_CONFIG: ${{ matrix.config }}
      BAZEL_ARCH: ${{ matrix.bazel_arch }}
      BAZEL_SHA: ${{ matrix.bazel_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 3}
      - name: Verify the source and prepare native tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/atomic-systrap-native.yml' ':!.github/qualification/atomic_systrap_native.sh'
          w="$RUNNER_TEMP/atomic-systrap-native"
          mkdir -m 700 "$w" "$w/results" "$w/bin"
          cp .github/qualification/atomic_systrap_native.sh "$w/qualify.sh"
          git switch --detach "$SOURCE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          version="$(cat .bazelversion)"
          test "$version" = 9.3.1
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 "https://releases.bazel.build/$version/release/bazel-$version-linux-$BAZEL_ARCH" -o "$w/bin/bazel"
          printf '%s  %s\n' "$BAZEL_SHA" "$w/bin/bazel" | sha256sum -c -
          chmod 700 "$w/bin/bazel"
          sudo apt-get update
          sudo apt-get install -y build-essential python3 unzip zip xz-utils
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "$w/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version: 1.27.3, cache: false}
      - name: Build, test, and compare the actual embedded stubs
        run: bash "$RUNNER_TEMP/atomic-systrap-native/qualify.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: atomic-systrap-native-${{ matrix.arch }}
          path: ${{ runner.temp }}/atomic-systrap-native/results/
          if-no-files-found: error
          retention-days: 30
