name: Check reused Python release staging
on:
  push:
    branches: [qualification/python-release-staging-destination]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Bind both complete release entry points to their commits
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = 8dad7a574b6914fc2aea3609f92235af9ca7b0d3
          test "$(git diff --name-only HEAD^^ HEAD^)" = tools/make_python_release.sh
          git archive HEAD^^ -- Makefile tools images sandboxexec/sandbox/python > test/rbe/python_release_isolation/stock.tar
          git archive HEAD^ -- Makefile tools images sandboxexec/sandbox/python > test/rbe/python_release_isolation/fixed.tar
      - name: Verify flock in the exact release builder image
        run: |
          set -euo pipefail
          tag=$(cd images && find default -type f | sort -f -d | xargs -n 1 sha256sum | sha256sum | cut -c 1-16)
          test "$tag" = 20dc8cdd3e3c498e
          image=us-central1-docker.pkg.dev/gvisor-presubmit/gvisor-presubmit-images/default_x86_64
          digest=sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          docker pull "$image:$tag"
          test "$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag")" = "$image@$digest"
          package=$(docker run --rm --network=none --entrypoint /bin/bash "$image@$digest" -euc '
            test "$(command -v flock)" = /usr/bin/flock
            exec 9</tmp; flock -n 9
            dpkg-query -W -f="\${Package} \${Version} \${Essential}" util-linux')
          printf 'RELEASE_FLOCK_PACKAGE=%s\n' "$package" >> "$GITHUB_ENV"
      - name: Provision the same release frontends as the original comparison
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/release-env"
          "$RUNNER_TEMP/release-env/bin/pip" install build==1.3.0 setuptools==80.9.0 wheel==0.45.1 uv==0.8.24
          "$RUNNER_TEMP/release-env/bin/pip" download --dest "$RUNNER_TEMP/release-wheels" setuptools==80.9.0 wheel==0.45.1
      - name: Compare gVisor archive and manifest staging in the public make targets
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/release-env/bin:$PATH"
          bazel test --test_output=errors --nocache_test_results --strategy=TestRunner=local \
            --test_env=PATH --test_env=PIP_NO_INDEX=1 --test_env=PIP_FIND_LINKS="$RUNNER_TEMP/release-wheels" \
            --test_env=UV_NO_INDEX=1 --test_env=UV_FIND_LINKS="$RUNNER_TEMP/release-wheels" \
            --test_env=UV_PYTHON="$RUNNER_TEMP/release-env/bin/python" --test_env=UV_PYTHON_DOWNLOADS=never \
            --test_env=RELEASE_FLOCK_PACKAGE \
            //test/rbe/python_release_isolation:compare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-staging-comparison
          path: bazel-testlogs/test/rbe/python_release_isolation/compare/test.outputs/verdict.json
          if-no-files-found: warn
