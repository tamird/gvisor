name: Compare conventional Python release backends
on:
  push:
    branches: [qualification/python-release-staging-isolation]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.7.17'
      - name: Resolve the exact offline wheelhouses for the two interpreters
        run: |
          set -eu
          printf 'PACKAGE_PY37=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
          python -m pip install 'pip==24.0'
          python -m pip download --only-binary=:all: -d "$RUNNER_TEMP/release-wheels" hatchling==1.17.1 flit-core==3.12.0 setuptools==68.0.0 wheel==0.42.0
          /usr/bin/python3 -m venv "$RUNNER_TEMP/release-env"
          "$RUNNER_TEMP/release-env/bin/pip" install build==1.3.0 setuptools==80.9.0 wheel==0.45.1 uv==0.8.24
          "$RUNNER_TEMP/release-env/bin/pip" download --only-binary=:all: -d "$RUNNER_TEMP/release-wheels" hatchling==1.33.0 flit-core==3.12.0 setuptools==80.9.0 wheel==0.45.1
      - name: Build a release with both frontends and install the changed archives on CPython 3.7.17
        run: |
          set -euxo pipefail
          export PATH="$RUNNER_TEMP/release-env/bin:$PATH"
          bazel test --test_output=errors --strategy=TestRunner=local \
            --test_env=PATH --test_env=PACKAGE_PY37 --test_env=PIP_NO_INDEX=1 --test_env=PIP_FIND_LINKS="$RUNNER_TEMP/release-wheels" \
            --test_env=UV_NO_INDEX=1 --test_env=UV_FIND_LINKS="$RUNNER_TEMP/release-wheels" \
            --test_env=UV_PYTHON="$RUNNER_TEMP/release-env/bin/python" --test_env=UV_PYTHON_DOWNLOADS=never \
            //test/rbe/python_release_isolation:compare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: conventional-python-backends
          path: |
            bazel-testlogs/test/rbe/python_release_isolation/compare/test.outputs/*
            bazel-testlogs/test/rbe/python_release_isolation/compare/test.log
          if-no-files-found: warn
