name: Compare graph save policy in a precreated native systrap cgroup
on:
  push:
    branches: [qualification/gc-save-native-guard-recovery]
permissions:
  contents: read
jobs:
  restore:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 195
    env:
      IMAGE: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: c31b2adc27b1d19b1e647b3239cd2b3b536a5adf
      BASE: 706b124a2e5a587123d9844a83db5e55d318d3ea
      REPORTER: 2b51abee8530385431b7225198fdd5cd65e78696
      TEST_BLOB: b70a9171605324eef57901601fdd6163572041be
      PKG: .github/qualification/restore-limit-vm
    steps:
    - name: Check the ordinary user's delegated cgroup
      id: host
      shell: bash
      run: |
        set -euo pipefail
        export LC_ALL=C
        unit=gvisor-precreated-leaf-probe.service
        uid=$(id -u)
        test "$uid" -ne 0
        if [[ -S /run/user/$uid/bus && $(stat -c %u "/run/user/$uid") == "$uid" ]]; then
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus"
        fi
        cat > "$RUNNER_TEMP/probe.sh" <<'PROBE'
        set -eu
        if [[ "${1:-}" != inner ]]; then
          echo PHASE=service
          membership=$(awk -F: '$1=="0" {print $3}' /proc/self/cgroup)
          [[ "${membership##*/}" == gvisor-precreated-leaf-probe.service ]]
          [[ $(id -u) != 0 ]]
          # Read effective ancestor limits before changing cgroup namespace.
          python3 - "$membership" <<'LIMITS'
        import os, sys
        from pathlib import Path
        root = Path("/sys/fs/cgroup")
        mount = [line.split() for line in Path("/proc/self/mountinfo").read_text().splitlines()
                 if line.split()[4] == str(root)]
        assert len(mount) == 1 and mount[0][3] == "/" and mount[0][mount[0].index("-") + 1] == "cgroup2"
        service = (root / sys.argv[1].lstrip("/")).resolve(strict=True)
        assert root in service.parents
        print("AFFINITY=", len(os.sched_getaffinity(0)), sep="")
        for path in (service, *service.parents):
            for name in ("cpu.max", "memory.max"):
                limit = path / name
                if limit.exists():
                    print(name, "=", limit.read_text().strip(), sep="")
            if path == root:
                break
        LIMITS
          echo PHASE=user_namespace
          exec setpriv --no-new-privs unshare --user --map-root-user --mount --cgroup --propagation private \
            /bin/bash "$0" inner "$2" "$(readlink /proc/self/ns/cgroup)"
        fi
        [[ $(id -u) == 0 && $(readlink /proc/self/ns/cgroup) != "$3" && $(cat /proc/self/cgroup) == '0::/' ]]
        echo PHASE=private_mount
        mount -t cgroup2 none "$2"
        cd "$2"
        [[ $(stat -f -c %T .) == cgroup2fs ]]
        controllers=$(cat cgroup.controllers)
        echo PHASE=controllers_read
        for key in $controllers; do
          [[ $key =~ ^[a-z_]+$ ]]
          echo "CONTROLLER=$key"
        done
        [[ " $controllers " == *" memory "* ]]
        echo PHASE=create_children
        mkdir client probe
        echo PHASE=move_client
        echo $$ > client/cgroup.procs
        [[ $(cat /proc/self/cgroup) == '0::/client' ]]
        echo PHASE=enable_controllers
        echo +memory > cgroup.subtree_control
        echo PHASE=memory_write
        echo 2147483648 > probe/memory.max
        [[ $(cat probe/memory.max) == 2147483648 ]]
        grep -Fxq 'oom_kill 0' probe/memory.events
        echo PHASE=join_precreated
        (
          child=$BASHPID
          echo "$child" > probe/cgroup.procs
          [[ $(cat /proc/self/cgroup) == '0::/probe' ]]
          grep -Fxq "$child" probe/cgroup.procs
          [[ $(cat probe/memory.max) == 2147483648 ]]
        )
        echo PHASE=complete
        PROBE
        mkdir "$RUNNER_TEMP/native-cgroup"
        set +e
        timeout 45s systemd-run --user --quiet --collect --wait --pipe --unit="$unit" \
          --property=Delegate=yes --property=RuntimeMaxSec=35s -- \
          /bin/bash "$RUNNER_TEMP/probe.sh" outer "$RUNNER_TEMP/native-cgroup" > "$RUNNER_TEMP/probe.log" 2>&1
        code=$?
        set -e
        python3 - "$code" <<'PY'
        import json, os, platform, re, sys
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"])
        lines = (root / "probe.log").read_text(errors="replace").splitlines()
        steps = ("service", "user_namespace", "private_mount", "controllers_read", "create_children",
                 "move_client", "enable_controllers", "memory_write", "join_precreated", "complete")
        phases = [p for p in steps if f"PHASE={p}" in lines]
        cpu = [line.split("=", 1)[1] for line in lines if re.fullmatch(r"cpu\.max=(max|[0-9]{1,18}) [1-9][0-9]{0,11}", line)]
        memory = [line.split("=", 1)[1] for line in lines if re.fullmatch(r"memory\.max=(max|[0-9]{1,20})", line)]
        affinity = [int(line.split("=")[1]) for line in lines if re.fullmatch(r"AFFINITY=[1-9][0-9]{0,3}", line)]
        assert len(cpu) <= 32 and len(memory) <= 32 and len(affinity) <= 1
        controllers = [c for c in ("cpu", "cpuset", "io", "memory", "pids") if f"CONTROLLER={c}" in lines]
        errors = [s for s in ("No medium found", "No such file or directory", "Permission denied",
                              "Operation not permitted", "Failed to connect to bus", "Access denied",
                              "Read-only file system", "Device or resource busy", "Failed to start transient service")
                  if any(s.lower() in line.lower() for line in lines)]
        exit_code = int(sys.argv[1])
        leaf = exit_code == 0 and phases == list(steps) and "memory" in controllers
        comparable = (affinity == [4] and cpu and all(v.startswith("max ") for v in cpu)
                      and memory and all(v == "max" or int(v) >= 2**31 for v in memory))
        ready = leaf and bool(comparable)
        result = {"carrier":os.environ["GITHUB_SHA"], "kernel":platform.release(), "machine":platform.machine(),
                  "native_exit":exit_code, "phases":phases, "controllers":controllers, "diagnostics":errors,
                  "ancestor_cpu_max":cpu, "ancestor_memory_max":memory, "affinity":affinity,
                  "precreated_leaf":leaf, "eligible":ready, "product_cases":0,
                  "product_revisions":["706b124a2","c31b2adc2"], "fixture":"acd90fc2c",
                  "verified_memory_max":2**31 if leaf else None}
        (root / "eligibility.json").write_text(json.dumps(result, indent=2) + "\n")
        missing = (leaf and not ready) or (exit_code != 0 and
                  (bool(errors) or ("controllers_read" in phases and "memory" not in controllers)))
        r = {"status":"INCOMPLETE" if ready else "INELIGIBLE", "product_cases":0, "stages":{}, "host":result,
             "parent":os.environ["BASE"], "product":os.environ["PRODUCT"], "test_blob":os.environ["TEST_BLOB"],
             "carrier":os.environ["GITHUB_SHA"]}
        (root / "restore-vm-verdict.json").write_text(json.dumps(r) + "\n")
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            print("eligible=" + str(ready).lower(), file=output)
        if not (ready or missing):
            sys.exit("incomplete eligibility observation")
        PY
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: steps.host.outputs.eligible == 'true'
      with: {fetch-depth: 2, persist-credentials: false}
    - name: Bind the native Bazel launcher and the matched fixture
      if: steps.host.outputs.eligible == 'true'
      run: |
        set -euo pipefail
        test "$(id -u)" != 0
        awk '$1 == "MemAvailable:" && $2 >= 7*1024*1024 { found=1 } END { exit !found }' /proc/meminfo
        test "$(df -PB1 . | awk 'END {print $4}')" -gt 10000000000
        test "$(git rev-parse HEAD^)" = b6cbf2b98cee47fe8f13fb165254047bf84c9c9e
        test "$(git hash-object "$PKG/gc_reference_test.go")" = b70a9171605324eef57901601fdd6163572041be
        test "$(git hash-object "$PKG/paired.py")" = 6c2214179d14ddf23ced647e6ab0322dc36d943a
        test "$(git hash-object "$PKG/native.sh")" = 28c33fe97dacba26350053483e93099a960da7ce
        test "$(git hash-object "$PKG/payload.sh")" = 800af2caa8968e338fbf470fbc295e2c41aac081
        test "$(git hash-object "$PKG/handoff.py")" = a2c92929659a93d8f80041d4a3b9072a0f181826
        mkdir "$RUNNER_TEMP/restore-tools"
        curl -fsSL --max-time 90 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/restore-tools/bazel"
        echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/restore-tools/bazel" | sha256sum -c -
        chmod 755 "$RUNNER_TEMP/restore-tools/bazel"
        test "$(cat .bazelversion)" = 8.8.1
    - name: Verify the detached private root and precreated cgroup before building either capsule
      if: steps.host.outputs.eligible == 'true'
      timeout-minutes: 2
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/guard-root"
        /bin/bash "$PKG/native.sh" prepare "$root" guard
        rc=0
        /bin/bash "$PWD/$PKG/native.sh" service "$root" > "$RUNNER_TEMP/private-guard.log" 2>&1 || rc=$?
        python3 -B "$PKG/paired.py" guard "$rc"
    - name: Build both exact sources with the identical reference fixture
      if: steps.host.outputs.eligible == 'true'
      timeout-minutes: 80
      run: |
        set -euo pipefail
        for arm in parent candidate; do
          d=$RUNNER_TEMP/restore-build-$arm
          rev=$BASE
          if [[ "$arm" == candidate ]]; then rev=$PRODUCT; fi
          rc=0
          mkdir -p "$d/src" "$d/output"
          chmod a+w "$d/src" "$d/output"
          git -C "$d/src" init -q
          git -C "$d/src" fetch -q --depth=2 https://github.com/google/gvisor.git "$rev"
          git -C "$d/src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$d/src" rev-parse HEAD)" = "$rev"
          if [[ "$arm" == candidate ]]; then test "$(git -C "$d/src" rev-parse HEAD^)" = "$BASE"; fi
          test "$(git -C "$d/src" rev-parse HEAD:runsc/container/BUILD)" = 64be27011edc6d0c29efe6b1b15b3ebe599cacad
          python3 -B "$PKG/paired.py" "$d/src/runsc/container/BUILD"
          cp "$PKG/gc_reference_test.go" "$d/src/runsc/container/"
          test "$(git -C "$d/src" hash-object runsc/container/gc_reference_test.go)" = "$TEST_BLOB"
          test "$(git -C "$d/src" rev-parse HEAD:runsc/config/flags.go)" = b14ed8816390f90b261cf9f7cfd923cf9085de25
          test "$(git -C "$d/src" rev-parse HEAD:pkg/state/state.go)" = c7214909f9ceb6455faaedad00c71a773e00c2bf
          test "$(cat "$d/src/.bazelversion")" = 9.3.1
          test -z "$(git -C "$d/src" remote)"
          test -z "$(git -C "$d/src" config --local --get-regexp 'extraheader|credential' || :)"
          # Only public source filenames and Bazel's own enum names may appear
          # in a diagnostic; keep both allowlists outside the compiler mounts.
          git -C "$d/src" ls-files -z > "$d/source-files"
          curl -fsS --max-time 30 https://raw.githubusercontent.com/bazelbuild/bazel/9.3.1/src/main/protobuf/failure_details.proto > "$d/failure-details.proto"
          test "$(git hash-object "$d/failure-details.proto")" = d867e1db512a1484a20d10b13bd05a97a7e5d020
          docker pull "$IMAGE" > "$d/pull.log" 2>&1
          docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
            -v "$d/src:/src" -v "$d/output:/transfer" -v "$RUNNER_TEMP/restore-tools:/tools:ro" -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            --entrypoint /bin/bash "$IMAGE" -c '
            set -euo pipefail
            export PATH="/tools:$PATH"
            test "$(bazel --version)" = "bazel 9.3.1"
            flags=(--config=x86_64 --jobs=4 --spawn_strategy=local --strategy=GoStdlib=processwrapper-sandbox --strategy=GoStdlibList=processwrapper-sandbox --remote_cache= --remote_executor= --bes_backend= --test_sharding_strategy=disabled)
            target=//runsc/container:container_test
            bazel cquery "${flags[@]}" --output=label --build_event_json_file=/transfer/analysis.bep "$target" || { rc=$?; echo "$rc" > /transfer/analysis.exit; exit "$rc"; }
            echo 0 > /transfer/analysis.exit
            bazel build "${flags[@]}" --build_event_json_file=/transfer/build.bep "$target" || { rc=$?; echo "$rc" > /transfer/build.exit; exit "$rc"; }
            echo 0 > /transfer/build.exit
            p=$(bazel cquery "${flags[@]}" --output=files //runsc/container:container_test)
            test -x "$p" && test "$(basename "$p")" = container_test && test -d "$p.runfiles/_main"
            test "$(git status --porcelain --untracked-files=no)" = " M runsc/container/BUILD"
            sha256sum "$p" | cut -d" " -f1 > /transfer/elf.sha256
            cd "$(dirname "$p")"
            ulimit -f 1048576
            tar --hard-dereference -chf /transfer/capsule.tar container_test container_test.runfiles
            test "$(stat -c %s /transfer/capsule.tar)" -lt 1073741824' > "$d/build.log" 2>&1 || rc=$?
          echo "${rc:-0}" > "$d/compiler.exit"
          # The stopped compiler controlled /transfer. Never follow any path it
          # left behind or introduce one of its links into the trusted workspace.
          handoff_rc=0
          python3 "$PKG/handoff.py" "$d" "$PKG/$arm.tar" || handoff_rc=$?
          echo "$handoff_rc" > "$d/handoff.exit"
          python3 "$PKG/handoff.py" diagnostics "$d" || echo incomplete > "$d/diagnostics.missing"
          if test "${rc:-0}" = 0; then rc=$handoff_rc; fi
          test "${rc:-0}" = 0 || exit "$rc"
        done
    - name: Retain only the two validated public-source capsules for a bounded recovery
      id: capsules
      continue-on-error: true
      if: steps.host.outputs.eligible == 'true'
      run: |
        set -eu
        path="$RUNNER_TEMP/verified-capsules"
        mkdir "$path"
        for arm in parent candidate; do
          ln "$PKG/$arm.tar" "$path/$arm.tar"
          cp "$RUNNER_TEMP/restore-build-$arm/elf.sha256" "$path/$arm.elf.sha256"
        done
        cd "$path"
        sha256sum parent.tar candidate.tar > capsules.sha256
        printf '%s\n' "$GITHUB_SHA" "$BASE" "$PRODUCT" "$TEST_BLOB" > source.txt
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: steps.capsules.outcome == 'success'
      continue-on-error: true
      with:
        name: verified-native-gc-capsules
        path: ${{ runner.temp }}/verified-capsules/
        retention-days: 1
        compression-level: 1
        if-no-files-found: error
    - name: Run both source-bound capsules in isolated native systrap
      if: steps.host.outputs.eligible == 'true'
      timeout-minutes: 58
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/native-root"
        /bin/bash "$PKG/native.sh" prepare "$root" measure
        rc=0
        /bin/bash "$PWD/$PKG/native.sh" service "$root" > "$RUNNER_TEMP/native-service.log" 2>&1 || rc=$?
        RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$PKG/paired.py" receive "$rc"
    - name: Compare the twelve verified saves per arm with the qualified benchstat
      if: steps.host.outputs.eligible == 'true'
      timeout-minutes: 16
      run: |
        set -euo pipefail
        git fetch -q --depth=1 https://github.com/tamird/gvisor.git "$REPORTER"
        git checkout --quiet --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$REPORTER"
        test "$(git rev-parse HEAD:MODULE.bazel)" = 1665015b7719a98f2176b44a0f1c298854dadfab
        test "$(cat .bazelversion)" = 8.5.0
        mkdir "$RUNNER_TEMP/bench-out"
        cp "$RUNNER_TEMP/parent.bench" "$RUNNER_TEMP/bench-out/parent"
        cp "$RUNNER_TEMP/candidate.bench" "$RUNNER_TEMP/bench-out/candidate"
        chmod a+w "$RUNNER_TEMP/bench-out"
        docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
          -v "$PWD:/src" -v "$RUNNER_TEMP/bench-out:/transfer" -v "$RUNNER_TEMP/restore-tools:/tools:ro" -w /src \
          --entrypoint /bin/bash "$IMAGE" -c '
          set -euo pipefail
          test "$(/tools/bazel --version)" = "bazel 8.5.0"
          flags=(--config=x86_64 -c opt --jobs=4 --spawn_strategy=local --strategy=GoStdlib=processwrapper-sandbox --strategy=GoStdlibList=processwrapper-sandbox --remote_cache= --remote_executor= --bes_backend= --stamp --workspace_status_command=)
          /tools/bazel build "${flags[@]}" @org_golang_x_perf//cmd/benchstat >/dev/null 2>&1
          file=$(/tools/bazel cquery "${flags[@]}" --output=files @org_golang_x_perf//cmd/benchstat)
          base=$(/tools/bazel info execution_root)
          tool=$base/$file
          cd /transfer
          "$tool" parent candidate > benchstat.txt'
        test -s "$RUNNER_TEMP/bench-out/benchstat.txt"
    - name: Record individual phases and original measurement scope
      if: always()
      run: |
        python3 - <<'PYTHON'
        from datetime import datetime, timezone
        import hashlib, json, os, re
        from pathlib import Path
        tmp = Path(os.environ["RUNNER_TEMP"])
        out = tmp / "restore-vm-verdict.json"
        data = json.loads(out.read_text())
        for arm in ("parent", "candidate"):
            d = tmp / ("restore-build-" + arm)
            if not d.is_dir(): continue
            phase = data.setdefault("compilers", {}).setdefault(arm, {})
            for key in ("analysis", "build", "compiler", "handoff"):
                p = d / (key + ".exit")
                phase[key] = int(v) if p.is_file() and (v := p.read_text().strip()).isdecimal() else None
            if (d / "diagnostics.json").is_file(): phase["diagnostics"] = json.loads((d / "diagnostics.json").read_text())
            if (d / "elf.sha256").is_file():
                digest = (d / "elf.sha256").read_text().strip()
                if re.fullmatch("[0-9a-f]{64}", digest): phase["elf_sha256"] = digest
        data["product_cases"] = sum("native_exit" in row for row in data["stages"].get("restore", {}).get("samples", []))
        data["original_workload"] = {"run":41802364888, "artifact":13309574814, "source":"1d5db90e0"}
        data["prior_200MiB_correctness"] = {"carrier":"3da1a3fcd","source":"71b5044a6","engine":"graph","compression":"flate-best-speed","measured_performance":False}
        data["host_preflight"] = {"run":42020023134, "artifact":13411067235, "previous_kvm_no_cases":13405209658}
        data["guest_machine"] = "native AMD64 host, 4 allowed CPUs, ordinary delegated service, offline namespaces; systrap Sentry"
        data["planned_workload"] = "100000 empty tmpfs files; 2GiB; native systrap; non-resuming save; graph+none; sampled Sentry RSS through exit; full restore verified"
        stats = tmp / "bench-out/benchstat.txt"
        data["benchstat"] = {"source":os.environ["REPORTER"], "available":stats.is_file() and 0 < stats.stat().st_size < 65536}
        if data["benchstat"]["available"]: data["benchstat"]["sha256"] = hashlib.sha256(stats.read_bytes()).hexdigest()
        data["verified_utc"] = datetime.now(timezone.utc).isoformat()
        out.write_text(json.dumps(data, indent=2) + "\n")
        PYTHON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: native-graph-save-comparison
        path: |
          ${{ runner.temp }}/restore-vm-verdict.json
          ${{ runner.temp }}/parent.bench
          ${{ runner.temp }}/candidate.bench
          ${{ runner.temp }}/bench-out/benchstat.txt
        if-no-files-found: error
