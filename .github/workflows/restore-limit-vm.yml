name: Check both restores in an isolated cgroup-v2 VM
on:
  push:
    branches: [qualification/gc-restore-limits-kvm-sandboxed]
permissions:
  contents: read
  actions: read
jobs:
  restore:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-22.04
    timeout-minutes: 105
    env:
      IMAGE: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: a48b7a12cb3bd615c48f9b36d353c02a6463a929
      TEST_BLOB: 040c7dafa4a9e6286563c80bfda9dc07e6d68767
      PKG: .github/qualification/restore-limit-vm
    steps:
    - name: Initialize an incomplete result
      run: |
        printf '{"status":"INCOMPLETE","stages":{},"product":"%s","carrier":"%s","test_blob":"%s"}\n' \
          "$PRODUCT" "$GITHUB_SHA" "$TEST_BLOB" > "$RUNNER_TEMP/restore-vm-verdict.json"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 2, persist-credentials: false}
    - name: Verify the original six-GiB KVM delegation and unchanged fixture
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        test -c /dev/kvm
        gh api repos/tamird/gvisor/actions/artifacts/13226626592/zip > "$RUNNER_TEMP/preflight.zip"
        python3 -B "$PKG/check.py" preflight
        # The upstream analyzer consumed two GoStdlib trees. The optional
        # GoStdlibList output was not requested by that owner.
        gh api repos/tamird/gvisor/actions/artifacts/13238224825/zip > "$RUNNER_TEMP/producer.zip"
        python3 - <<'CHECK'
        import hashlib, io, json, os
        from pathlib import Path
        from zipfile import ZipFile
        tmp = Path(os.environ["RUNNER_TEMP"])
        data = (tmp/"producer.zip").read_bytes()
        assert hashlib.sha256(data).hexdigest() == "95fc155051926a38611252c4dd52f05e2dcb9b4e81385868b8dd1a124fb70bfe"
        with ZipFile(io.BytesIO(data)) as z:
            assert z.namelist() == ["stdlib-result.json"]
            old = json.loads(z.read("stdlib-result.json"))
        assert old["product"] == "0bbcbf9de7626fcecba97f37723dce80b435d73d" and old["carrier"] == "03469d14d37e94da41b3e8ffa447b87d38ddff6d"
        assert old["status"] == "INCOMPLETE" and old["restore_attempts"] == 0 and old["native_exit"] == old["bep_exit"] == old["container_exit"] == 0 and old["target_success"]
        assert len(old["actions"]) == 1 and old["actions"][0]["mnemonic"] == "GoStandardLibraryAnalysis" and old["actions"][0]["success"]
        assert len(old["producers"]) == 2
        for row in old["producers"]:
            assert row["mnemonic"] == "GoStdlib" and row["runner"] == "processwrapper-sandbox" and not row["cache_hit"] and row["status"] == "" and row["exit"] == 0
            assert row["archive_outputs"] == [{"count":368,"fmt":True,"example2":False}]
        result = tmp/"restore-vm-verdict.json"
        doc = json.loads(result.read_text())
        doc["stdlib_prerequisite"] = {"artifact":13238224825,"original_status":old["status"],"native_exit":0,"actual_go_stdlib_spawns":2,"go_stdlib_list_spawns":0,"archives_per_tree":368,"excluded_example2":True}
        result.write_text(json.dumps(doc,indent=2)+"\n")
        CHECK
    - name: Build just the original test and runfiles without credentials
      timeout-minutes: 60
      run: |
        set -euo pipefail
        d=$RUNNER_TEMP/restore-build
        mkdir -p "$d/src" "$d/output"
        chmod a+w "$d/src" "$d/output"
        git -C "$d/src" init -q
        git -C "$d/src" fetch -q --depth=1 https://github.com/tamird/gvisor.git "$PRODUCT"
        git -C "$d/src" checkout -q --detach FETCH_HEAD
        test "$(git -C "$d/src" rev-parse HEAD)" = "$PRODUCT"
        test "$(git -C "$d/src" hash-object runsc/container/container_save_restore_test.go)" = "$TEST_BLOB"
        test -z "$(git -C "$d/src" remote)"
        test -z "$(git -C "$d/src" config --local --get-regexp 'extraheader|credential' || :)"
        # Only public source filenames and Bazel's own enum names may appear
        # in a diagnostic; keep both allowlists outside the compiler mounts.
        git -C "$d/src" ls-files -z > "$d/source-files"
        curl -fsS --max-time 30 https://raw.githubusercontent.com/bazelbuild/bazel/8.8.1/src/main/protobuf/failure_details.proto > "$d/failure-details.proto"
        test "$(git hash-object "$d/failure-details.proto")" = d77aded3e134c22308621f7c647f4ee5cc5f2717
        docker pull "$IMAGE" > "$d/pull.log" 2>&1
        docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
          -v "$d/src:/src" -v "$d/output:/transfer" -w /src \
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
          --entrypoint /bin/bash "$IMAGE" -c '
          set -euo pipefail
          flags=(--config=x86_64 --jobs=4 --spawn_strategy=local --strategy=GoStdlib=processwrapper-sandbox --strategy=GoStdlibList=processwrapper-sandbox --remote_cache= --remote_executor= --bes_backend= --test_sharding_strategy=disabled)
          target=//runsc/container:container_test
          bazel cquery "${flags[@]}" --output=label --build_event_json_file=/transfer/analysis.bep "$target" || { rc=$?; echo "$rc" > /transfer/analysis.exit; exit "$rc"; }
          echo 0 > /transfer/analysis.exit
          bazel build "${flags[@]}" --build_event_json_file=/transfer/build.bep "$target" || { rc=$?; echo "$rc" > /transfer/build.exit; exit "$rc"; }
          echo 0 > /transfer/build.exit
          p=$(bazel cquery "${flags[@]}" --output=files //runsc/container:container_test)
          test -x "$p" && test "$(basename "$p")" = container_test && test -d "$p.runfiles/_main"
          test -z "$(git status --porcelain --untracked-files=no)"
          sha256sum "$p" | cut -d" " -f1 > /transfer/elf.sha256
          cd "$(dirname "$p")"
          ulimit -f 1048576
          tar --hard-dereference -chf /transfer/capsule.tar container_test container_test.runfiles
          test "$(stat -c %s /transfer/capsule.tar)" -lt 1073741824' > "$d/build.log" 2>&1 || rc=$?
        echo "${rc:-0}" > "$d/compiler.exit"
        # The stopped compiler controlled /transfer. Never follow any path it
        # left behind or introduce one of its links into the trusted workspace.
        handoff_rc=0
        python3 "$PKG/handoff.py" "$d" "$PKG/capsule.tar" || handoff_rc=$?
        echo "$handoff_rc" > "$d/handoff.exit"
        python3 "$PKG/handoff.py" diagnostics "$d" || echo incomplete > "$d/diagnostics.missing"
        if test "${rc:-0}" = 0; then rc=$handoff_rc; fi
        exit "${rc:-0}"
    - name: Run the public binary, unchanged and offline, in that VM
      timeout-minutes: 21
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: python3 -B "$PKG/check.py" restore
    - name: Retain the build disposition and bounded status
      if: always()
      run: |
        python3 - <<'PY'
        from datetime import datetime, timezone
        import json, os, re
        from pathlib import Path
        tmp = Path(os.environ["RUNNER_TEMP"])
        out = tmp / "restore-vm-verdict.json"
        d = tmp / "restore-build"
        data = json.loads(out.read_text())
        for key, path in (("analysis_exit", d/"analysis.exit"), ("compile_exit", d/"build.exit"), ("compiler_container_exit", d/"compiler.exit"), ("handoff_exit", d/"handoff.exit")):
            data[key] = int(path.read_text()) if path.is_file() and path.read_text().strip().isdecimal() else None
        diagnostics = d/"diagnostics.json"
        if diagnostics.is_file(): data["diagnostics"] = json.loads(diagnostics.read_text())
        data["diagnostics_incomplete"] = (d/"diagnostics.missing").exists()
        binary = d/"elf.sha256"
        if binary.is_file() and re.fullmatch(r"[0-9a-f]{64}", v := binary.read_text().strip()): data["owner_elf_sha256"] = v
        if data["status"] != "PASS" and d.is_dir():
            def ends(path):
                with path.open("rb") as stream:
                    first = stream.read(65536)
                    stream.seek(max(0, os.fstat(stream.fileno()).st_size - 65536))
                    return (first + b"\n" + stream.read(65536)).decode(errors="replace")
            log = "\n".join(ends(p) for p in (d/"build.log", d/"pull.log") if p.exists())
            data["build_failure_categories"] = [kind for kind, pattern in {
              "disk":"no space left", "fetch":"downloading|could not resolve host|failed to fetch",
              "permissions":"permission denied|operation not permitted", "compiler":"fatal error:|undefined reference",
            }.items() if re.search(pattern, log, re.I)]
        data["verified_utc"] = datetime.now(timezone.utc).isoformat()
        out.write_text(json.dumps(data, indent=2) + "\n")
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: isolated-cgroup-restore-result
        path: ${{ runner.temp }}/restore-vm-verdict.json
        if-no-files-found: error
