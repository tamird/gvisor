name: Compare the retained native checkpoint samples
on:
  push:
    branches: [qualification/state-segment-checkpoint-statistics]
permissions:
  actions: read
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PREVIOUS: 631e08f3b1687c026e09566d0f3d61654f5e1f1e
      TOOL: 2b51abee8530385431b7225198fdd5cd65e78696
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 2, persist-credentials: false}
    - name: Bind the original measurements without running a guest
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/stats"
        mkdir "$d"
        echo '{"status":"INCOMPLETE","guest_workload_repeated":false}' > "$d/outcome.json"
        test "$(git rev-parse HEAD^)" = "$PREVIOUS"
        gh api repos/tamird/gvisor/actions/artifacts/13249562616/zip > "$RUNNER_TEMP/original.zip"
        python3 - "$d" <<'PY'
        from hashlib import sha256
        import json, os, sys, zipfile
        from pathlib import Path
        d = Path(sys.argv[1])
        original = d.parent / 'original.zip'
        assert sha256(original.read_bytes()).hexdigest() == 'eeed7bb382419e185abdc7a6cd104834089c2e886ec10d2f0781684da0a929e0'
        with zipfile.ZipFile(original) as old:
            assert set(old.namelist()) == {'stock.bench', 'fixed.bench', 'restore-vm-verdict.json'}
            for name in old.namelist():
                (d/name).write_bytes(old.read(name))
        data = json.loads((d/'restore-vm-verdict.json').read_text())
        assert data['carrier'] == os.environ['PREVIOUS'] and data['status'] == 'FAIL'
        assert data['benchstat'] == {'status':'FAIL', 'native_exit':126}
        guest = data['stages']['restore']
        assert guest['status'] == 'PASS' and guest['native_exit'] == 0 and guest['fresh_local']
        samples = guest['measurements']
        assert len(samples) == 34 and all(row['exit'] == 0 and row['restored_files'] == 50000 for row in samples)
        for arm in ('stock', 'fixed'):
            subset = [r for r in samples if r['arm'] == arm and r['round'] > 0]
            assert [r['round'] for r in subset] == list(range(1,17))
            exact = ''.join('BenchmarkNativeCheckpoint 1 %d ns/op %d archive-B %d kernel-file-B\n' % (r['checkpoint_ns'],sum(r['archive_bytes'].values()),r['archive_bytes']['checkpoint.img']) for r in subset)
            assert (d/(arm+'.bench')).read_text() == exact
        PY
        git fetch -q --no-tags --depth=1 origin "$TOOL"
        git switch --quiet --detach "$TOOL"
    - name: Build and run only the pinned benchstat tool
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/stats"
        phase=build
        on_exit() { code=$?; printf '{"status":"%s","phase":"%s","native_exit":%s,"original_artifact":13249562616,"guest_workload_repeated":false,"finished_utc":"%s"}\n' "$(test "$code" = 0 && echo PASS || echo FAIL)" "$phase" "$code" "$(date -u '+%Y-%m-%dT%H:%M:%S.%NZ')" > "$d/outcome.json"; }
        trap on_exit EXIT
        test "$(git rev-parse HEAD)" = "$TOOL"
        test "$(bazel --version)" = "bazel $(cat .bazelversion)"
        target=@org_golang_x_perf//cmd/benchstat
        flags=(--config=x86_64 --jobs=4 --remote_cache= --remote_executor= --bes_backend=)
        bazel build "${flags[@]}" "$target"
        phase=locate
        binary=$(bazel cquery "${flags[@]}" --output=files "$target")
        test -f "$binary" && test -x "$binary"
        binary=$(realpath "$binary")
        phase=statistics
        (cd "$d"; "$binary" stock.bench fixed.bench) > "$RUNNER_TEMP/comparison"
        for metric in sec/op archive-B kernel-file-B; do grep -Fq "$metric" "$RUNNER_TEMP/comparison"; done
        test "$(grep -c NativeCheckpoint "$RUNNER_TEMP/comparison")" = 3
        mv "$RUNNER_TEMP/comparison" "$d/benchstat.txt"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: retained-checkpoint-benchstat
        path: ${{ runner.temp }}/stats/*
        if-no-files-found: error
