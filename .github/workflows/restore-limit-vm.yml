name: Diagnose the standard-library producer on the upstream parent
on:
  push:
    branches: [qualification/restore-limit-stdlib]
permissions: {contents: read}
jobs:
  stdlib:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      IMAGE: gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
      PRODUCT: 0bbcbf9de7626fcecba97f37723dce80b435d73d
      PKG: .github/qualification/restore-limit-vm
    steps:
    - name: Initialize an incomplete result
      run: |
        printf '{"status":"INCOMPLETE","product":"%s","carrier":"%s","restore_attempts":0}\n' "$PRODUCT" "$GITHUB_SHA" > "$RUNNER_TEMP/stdlib-result.json"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 2, persist-credentials: false}
    - name: Execute only the unmodified upstream standard-library analysis
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^)" = 4a22be3573539daf3599a62a3d979eec0c1c22b9
        d=$RUNNER_TEMP/restore-build
        mkdir -p "$d/src" "$d/output"
        chmod a+w "$d/src" "$d/output"
        git -C "$d/src" init -q
        git -C "$d/src" fetch -q --depth=1 https://github.com/google/gvisor.git "$PRODUCT"
        git -C "$d/src" checkout -q --detach FETCH_HEAD
        test "$(git -C "$d/src" rev-parse HEAD)" = "$PRODUCT"
        test -z "$(git -C "$d/src" remote)"
        test -z "$(git -C "$d/src" config --local --get-regexp 'extraheader|credential' || :)"
        cp "$PKG/stdlib.py" "$d/output/"
        docker pull "$IMAGE" > "$d/pull.log" 2>&1
        docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
          -v "$d/src:/src" -v "$d/output:/transfer" -w /src \
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
          --entrypoint /bin/bash "$IMAGE" -c '
          set -eu
          if test -r /sys/fs/cgroup/memory.events; then cp /sys/fs/cgroup/memory.events /transfer/before; fi
          bazel build --config=x86_64 --jobs=4 --spawn_strategy=local --remote_cache= --remote_executor= --bes_backend= \
            --test_sharding_strategy=disabled --build_event_json_file_path_conversion=false \
            --build_event_publish_all_actions --build_event_json_file=/transfer/build.bep \
            //tools/nogo:stdlib || rc=$?
          date --utc --iso-8601=ns > /transfer/finished
          echo "${rc:-0}" > /transfer/build.exit
          if test -r /sys/fs/cgroup/memory.events; then cp /sys/fs/cgroup/memory.events /transfer/after; fi
          python3 -B /transfer/stdlib.py collect || echo "Original action log unavailable"
          exit "${rc:-0}"' > "$d/build.log" 2>&1 || rc=$?
        echo "${rc:-0}" > "$d/compiler.exit"
        exit "${rc:-0}"
    - name: Reconcile native exit, action diagnostic and OOM counters
      if: ${{ !cancelled() }}
      run: python3 -B "$PKG/stdlib.py" verdict
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: upstream-stdlib-diagnostic
        path: ${{ runner.temp }}/stdlib-result.json
        if-no-files-found: error
