name: Check the native cgroup needed for graph restore timing
on:
  push:
    branches: [qualification/gc-restore-native-delegation]
permissions: {}
jobs:
  preflight:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
    - name: Check the ordinary user's delegated cgroup
      shell: bash
      run: |
        set -euo pipefail
        export LC_ALL=C
        unit=gvisor-first-guest-probe.service
        uid=$(id -u)
        test "$uid" -ne 0
        if [[ -S /run/user/$uid/bus && $(stat -c %u "/run/user/$uid") == "$uid" ]]; then
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus"
        fi
        cat > "$RUNNER_TEMP/probe.sh" <<'PROBE'
        set -eu
        if [[ "${1:-}" != inner ]]; then
          echo PHASE=service
          membership=$(awk -F: '$1=="0" {print $3}' /proc/self/cgroup)
          [[ "${membership##*/}" == gvisor-first-guest-probe.service ]]
          [[ $(id -u) != 0 ]]
          echo PHASE=user_namespace
          exec setpriv --no-new-privs unshare --user --map-root-user --mount --cgroup --propagation private \
            /bin/bash "$0" inner "$2" "$(readlink /proc/self/ns/cgroup)"
        fi
        [[ $(id -u) == 0 && $(readlink /proc/self/ns/cgroup) != "$3" && $(cat /proc/self/cgroup) == '0::/' ]]
        echo PHASE=private_mount
        mount -t cgroup2 none "$2"
        cd "$2"
        [[ $(stat -f -c %T .) == cgroup2fs ]]
        # The unchanged runsc cgroupV2.Install requires all five controllers.
        controllers=$(cat cgroup.controllers)
        echo PHASE=controllers_read
        for key in cpu cpuset io memory pids; do
          if [[ " $controllers " == *" $key "* ]]; then echo "CONTROLLER=$key"; fi
        done
        for key in cpu cpuset io memory pids; do [[ " $controllers " == *" $key "* ]]; done
        echo PHASE=private_subtree
        mkdir client probe
        echo $$ > client/cgroup.procs
        echo '+cpu +cpuset +io +memory +pids' > cgroup.subtree_control
        echo 2147483648 > probe/memory.max
        [[ $(cat probe/memory.max) == 2147483648 ]]
        grep -Fxq 'oom_kill 0' probe/memory.events
        echo PHASE=complete
        PROBE
        mkdir "$RUNNER_TEMP/native-cgroup"
        set +e
        timeout 45s systemd-run --user --quiet --collect --wait --pipe --unit="$unit" \
          --property=Delegate=yes --property=RuntimeMaxSec=35s -- \
          /bin/bash "$RUNNER_TEMP/probe.sh" outer "$RUNNER_TEMP/native-cgroup" > "$RUNNER_TEMP/probe.log" 2>&1
        code=$?
        set -e
        python3 - "$code" <<'PY'
        import json, os, platform, sys
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"])
        lines = (root / "probe.log").read_text(errors="replace").splitlines()
        phases = [p for p in ("service", "user_namespace", "private_mount", "controllers_read", "private_subtree", "complete")
                  if f"PHASE={p}" in lines]
        controllers = [c for c in ("cpu", "cpuset", "io", "memory", "pids") if f"CONTROLLER={c}" in lines]
        errors = [s for s in ("No medium found", "No such file or directory", "Permission denied",
                              "Operation not permitted", "Failed to connect to bus", "Access denied",
                              "Read-only file system", "Device or resource busy", "Failed to start transient service")
                  if any(s.lower() in line.lower() for line in lines)]
        exit_code = int(sys.argv[1])
        ready = exit_code == 0 and phases == ["service", "user_namespace", "private_mount", "controllers_read", "private_subtree", "complete"] and len(controllers) == 5
        result = {"carrier":os.environ["GITHUB_SHA"], "kernel":platform.release(), "machine":platform.machine(),
                  "native_exit":exit_code,"phases":phases,"controllers":controllers,"diagnostics":errors,
                  "eligible":ready,"product_cases":0,"product_revisions":["706b124a2","71b5044a6"],
                  "fixture":"648edf16f","verified_memory_max":2147483648 if ready else None}
        (root / "eligibility.json").write_text(json.dumps(result, indent=2) + "\n")
        # A proven missing prerequisite is a finished eligibility check.
        missing = exit_code != 0 and (bool(errors) or ("controllers_read" in phases and len(controllers) < 5))
        if not (ready or missing):
            sys.exit("incomplete eligibility observation")
        PY
    - if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: native-graph-restore-eligibility
        path: ${{ runner.temp }}/eligibility.json
        if-no-files-found: error
