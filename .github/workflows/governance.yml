# Checks that CODEOWNERS and MAINTAINERS.md match the files that
# //governance generates from governance data.
name: Governance

"on":
  pull_request:
  push:
    branches:
      - master
      - "release/**"
      - "review/actions-cache-shared-64d0355994"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-bazel

    - name: Check workflow sources
      run: bazel test --test_output=errors //:github_actions_test //:github_workflows_test

    - run: make governance-check
