name: Verify PR history across registry updates
on:
  push:
    branches: [qualification/work-map-merged-fallback]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Run all frontend tests on the proposed source
        run: |
          test "$(git rev-parse HEAD^)" = b82de5400c76ee569d59b5b6cd0c7e7d8dea75af
          git checkout --detach b82de5400c76ee569d59b5b6cd0c7e7d8dea75af
          node --test app_test.mjs
