name: Verify scratch next steps and narrow compiler evidence
on:
  push:
    branches: [qualification/work-map-scratch-status-reconcile]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Run the canonical collector on the proposed Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = 098d140f84daae928a49ff79babca7e63be611a5
          git checkout --detach 098d140f84daae928a49ff79babca7e63be611a5
          python3 -B update-status.py
      - name: Validate the collected pair and run its existing tests
        run: |
          python3 -B - <<'PYTHON'
          import datetime, hashlib, json, re, subprocess
          from pathlib import Path

          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == '098d140f84daae928a49ff79babca7e63be611a5'
          commands = [['node', 'metadata-preflight.mjs', '.'],
                      ['python3', '-B', '-m', 'unittest', 'work_states_test', 'update_status_test'],
                      ['node', '--test', '--test-reporter=tap', 'app_test.mjs']]
          expected = [' '.join(command) for command in commands]
          record = dict(source=source, expected=expected, executed=[], failed=[], skipped=[], missing=expected.copy())
          for command, label in zip(commands, expected, strict=True):
              result = subprocess.run(command, capture_output=True, text=True)
              if result.returncode:
                  print(result.stdout[-5000:], result.stderr[-5000:])
              record['executed'].append(label)
              record['missing'].remove(label)
              if result.returncode:
                  record['failed'].append(label)
              elif command == commands[0]:
                  record['preflight'] = json.loads(result.stdout)
              if command == commands[1]:
                  record['pythonTests'] = [int(n) for n in re.findall(r'^Ran (\d+) tests?', result.stderr, re.M)]
              elif command == commands[2]:
                  record['jsCounts'] = {k:int(n) for k,n in re.findall(r'^# (tests|pass|fail|skipped) (\d+)$', result.stdout, re.M)}
          snapshot = json.loads(Path('github-status.json').read_text())
          before = json.loads(subprocess.check_output(['git', 'show', 'HEAD:github-status.json']))
          current = {p['number']:p for p in snapshot['prs'] if p.get('repo', 'google/gvisor') == 'google/gvisor'}
          handoffs = [p['number'] for p in current.values() if p.get('terminalImportHandoff')]
          checks = dict(fresh=snapshot['checkedAt'] > before['checkedAt'],
                        requestBudget=1 <= snapshot['limits']['requests'] <= 64,
                        registryUnchanged=not subprocess.run(['git','diff','--quiet','HEAD','--','registry.json']).returncode)
          registry = json.loads(Path('registry.json').read_text())
          previous = json.loads(subprocess.check_output(['git','show',source+'^:registry.json']))
          nodes = {n['id']:n for n in registry['nodes']}
          old = {n['id']:n for n in previous['nodes']}
          changed={k for k in old if old[k]!=nodes[k]}
          checks['scope']=set(nodes)==set(old) and changed=={'branch:hermetic-compiler-review'} and registry['groups']==previous['groups'] and registry['edges']==previous['edges']
          checks['investigationScope']=[x['id'] for x,y in zip(registry['investigations'],previous['investigations'],strict=True) if x!=y]==['investigation:scratch-build-actions']
          checks['decisions']=all(nodes[k].get('contributorReview')==v.get('contributorReview') and nodes[k].get('additionalReviews')==v.get('additionalReviews') and nodes[k].get('settledReviews')==v.get('settledReviews') for k,v in old.items())
          checks['namedDecisions']=all(nodes[k]==old[k] for k in ('pr:17067','pr:16516','pr:bazel-contrib/buildtools:1527'))
          compiler=nodes['branch:hermetic-compiler-review']; urls={e['url'] for e in compiler['evidence']}
          checks['retainedEvidence']=all(e in compiler['evidence'] for e in old[compiler['id']]['evidence'])
          checks['noNewCompilerDecision']='contributorReview' not in compiler and compiler['head']==old[compiler['id']]['head'] and compiler['status']=='Agent work'
          checks['narrowEvidence']=all(u in urls for u in (
              'https://github.com/tamird/gvisor/actions/runs/42117886478/artifacts/13459164255',
              'https://github.com/tamird/gvisor/actions/runs/42125609399/artifacts/13461362085',
              'https://github.com/tamird/hermetic-llvm/actions/runs/42125450746/artifacts/13461480803',
              'https://github.com/tamird/hermetic-llvm/actions/runs/42125450746/artifacts/13461465419'))
          investigations={i['id']:i for i in registry['investigations']}
          old_investigations={i['id']:i for i in previous['investigations']}
          scratch=investigations['investigation:scratch-build-actions']; old_scratch=old_investigations[scratch['id']]
          tcp=investigations['investigation:cubic-recovery']
          checks['tcpRetained']=tcp==old_investigations[tcp['id']] and tcp['summary'] not in scratch['summary']
          checks['scratchHistory']=all(scratch[k]==v for k,v in old_scratch.items() if k not in ('summary','nextStep','updatedAt'))
          checks['pendingPermission']='Await Tamir’s permission' in scratch['nextStep'] and 'production revision is still unknown' in scratch['nextStep']
          checks['releaseEvidence']=all('https://github.com/tamird/gvisor/actions/runs/42124038703/artifacts/'+i in urls for i in ('13459748412','13460685269')) and 'historical BEP/configuration/CAS lookup remains incomplete' in compiler['summary'] and 'not the unamended 9310f06f9' in compiler['summary']
          record.update(requests=snapshot['limits']['requests'], requestLimit=64,
                        checkedAt=snapshot['checkedAt'], previousCheckedAt=before['checkedAt'], reminderPosting=False,
                        liveChecks=checks, terminalImportHandoffs=handoffs,
                        cases={n:{'head':p['head'], 'status':p['status'], 'handoff':n in handoffs}
                               for n,p in current.items() if n in (16516,16522,16735,17067)},
                        finished=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                        exitCode=int(bool(record['failed']) or not all(checks.values())),
                        hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in
                                ('github-status.json','registry.json','app.js','update-status.py','work_states.py','update_status_test.py','README.md')})
          Path('verdict.json').write_text(json.dumps(record, indent=2))
          raise SystemExit(record['exitCode'])
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: work-map-verdict
          path: |
            verdict.json
            github-status.json
          if-no-files-found: error
