name: Verify both published TCP reviewer replies
on:
  push:
    branches: [qualification/work-map-tcp-delivered-replies]
permissions:
  contents: read
jobs:
  collect:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Bind collector to the curated records and published base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3d3f73e688e8a95d8dde8f3e18693d0890747c3d
          test "$(git rev-parse HEAD^^)" = ca5d164cc3314b11f8cbb2dd691ea3df79ea2fa7
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/work-map.yml
          test "$(git diff --name-only HEAD^^ HEAD^)" = registry.json
          mkdir results
          cp registry.json results/
      - name: Refresh the squashed TCP source and its existing import
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          from datetime import datetime, timezone
          from pathlib import Path
          import copy
          import json
          import runpy
          u = runpy.run_path("update-status.py")
          g = u["collect_repository"].__globals__
          r = u["REGISTRY"]
          saved = copy.deepcopy(r)
          repo = "google/gvisor"
          numbers = {16809,16857}
          p = Path("github-status.json")
          old = json.loads(p.read_text())
          prior = [x for x in old["prs"] if x.get("repo",repo) == repo and x["number"] in numbers]
          assert {p["number"] for p in prior} == numbers
          try:
              # The canonical collector supports registered-only repositories. For this
              # publication, scope that existing path to exactly the changed nodes.
              r["nodes"] = [n for n in r["nodes"] if n["id"] in
                            {"pr:" + str(i) for i in numbers}]
              r["meta"]["registeredOnlyRepositories"].append(repo)
              g["PR_BATCH_SIZE"] = 1
              rows, fresh, _, inventory = u["collect_repository"](repo, "copybara", {**old, "prs":prior})
              issues = {}
              assert len(rows) == len(numbers) and set(fresh).issuperset(numbers)
              u["recheck_snapshot_mergeability"](list(fresh.values()), [p for s in rows for p in (s,*s["imports"])], repo)
          finally:
              r.clear()
              r.update(saved)
          maintainers = u["fetch_maintainers"]()
          nodes = {n["id"]:n for n in r["nodes"]}
          current = {}
          for pr in rows:
              key = "pr:"+str(pr["number"])
              node = nodes[key]
              if pr["status"] == "open":
                  pr = u["with_maintainer_reviewers"](pr, maintainers)
                  pr["publicImportDisposition"] = u["public_import_disposition"](pr,node.get("approvedPatch"),node.get("landedPatch"))
              current[pr["url"]] = pr
          prs = [current.get(p["url"],p) for p in old["prs"]]
          assert len({p["url"] for p in prs}) == len(prs)

          now = datetime.now(timezone.utc).isoformat()
          report = u["check_report"](prs,old)
          snap = {**old,"checkedAt":now,"registryDate":r["meta"]["updatedAt"],"prs":prs,"issues":{**old["issues"],**issues},
                  "reviewerHandoff":u["reviewer_handoff"](prs,old),
                  "mergeabilityHandoff":u["mergeability_handoff"](report,old),"checkFailures":report["checkFailures"],
                  "workStates":u["record_states"](prs,r,old,now)}
          snap["limits"] = {**old["limits"],"curationRefresh":{"prs":sorted(numbers),"issues":sorted(issues),"requests":g["requests"],
              "graphqlCost":g["query_cost"],"previousFullSnapshot":old["checkedAt"],"repositoryObservation":inventory}}
          if sweep := u["feedback_sweep"](r,[*prs,*old["reviewPRs"]],old,now):
              snap["projectFeedbackReview"] = sweep
          p.write_text(json.dumps(snap,indent=2,ensure_ascii=False)+"\n")
          PYTHON
          cp github-status.json results/
      - name: Check the data used to render the cards
        run: |
          node metadata-preflight.mjs . > results/preflight.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          nodes = {n["id"]: n for n in json.loads(Path("registry.json").read_text())["nodes"]}
          snap = json.loads(Path("github-status.json").read_text())
          observed = {p["url"]:p for p in snap["prs"]}
          heads = {16809:"f1dbaa4d1e2cfb522fa03197ed36f21df9a74a3b",16857:"85b67686f3cd61965db6393190969dab98c8d5c3"}
          replies = {16809:"https://github.com/google/gvisor/pull/16809#issuecomment-6615907851",
                     16857:"https://github.com/google/gvisor/pull/16857#discussion_r4460678584"}
          for number, head in heads.items():
              n = nodes["pr:"+str(number)]
              pr = observed[n["url"]]
              assert n["head"] == pr["head"] == n["followup"]["sourceHead"] == head
              assert "contributorReview" not in n and not n.get("contributorReviews")
              assert any(d.get("kind") == "reply" and d["head"] == head and d["outcome"] == "approved"
                         and d.get("postedURL") == replies[number] for d in n["settledReviews"])
              assert any(i["url"] == replies[number] and i["author"]["login"] == "tamird"
                         for i in pr["feedback"]["items"])
          unit = nodes["branch:buildkite-native-unit-tests"]
          assert unit["head"] == unit["followup"]["sourceHead"] == "22b87677f7ae1fa27ebee5b4eb95ab9cfe966761"
          assert "contributorReview" not in unit
          receipts = {"https://github.com/tamird/gvisor/actions/runs/41720481581/artifacts/13271776895",
                      "https://github.com/tamird/gvisor/actions/runs/41720701453/artifacts/13271891801"}
          assert receipts <= {e["url"] for e in unit["evidence"]}
          assert receipts <= set(unit["followup"]["evidence"])
          assert snap["limits"]["curationRefresh"]["prs"] == [16809,16857]
          retired = nodes["branch:mount-promise-rack-nits"]
          assert retired["inactive"] is True and "contributorReview" not in retired
          assert not any(e.get("to") == retired["id"] and e.get("from") in {"pr:16594", "pr:16605"}
                         for e in json.loads(Path("registry.json").read_text())["edges"])
          assert "do not contain that classifier" in unit["summary"]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-work-map-pair
          path: results/
          if-no-files-found: error
