name: Verify the merged empty-root supplier and rollout observation
on:
  push:
    branches: [qualification/work-map-scratch-rollout]
permissions:
  contents: read
jobs:
  collect:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Bind collector to the curated records and published base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 00fbedb77ce498e25b40bc1bb58832c1dde404f2
          test "$(git rev-parse HEAD^^)" = 1f94600ae78647165fc7f471b05f5d635401352d
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/work-map.yml
          test "$(git diff --name-only HEAD^^ HEAD^)" = registry.json
          mkdir results
          cp registry.json results/
      - name: Refresh the merged supplier pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          from datetime import datetime, timezone
          from pathlib import Path
          import copy
          import json
          import runpy
          u = runpy.run_path("update-status.py")
          g = u["collect_repository"].__globals__
          r = u["REGISTRY"]
          saved = copy.deepcopy(r)
          repo = "buildbuddy-io/buildbuddy"
          numbers = {14022}
          p = Path("github-status.json")
          old = json.loads(p.read_text())
          prior = [x for x in old["prs"] if x.get("repo",repo) == repo and x["number"] in numbers]
          assert {p["number"] for p in prior} == numbers
          try:
              # The canonical collector supports registered-only repositories. For this
              # publication, scope that existing path to exactly the changed nodes.
              r["nodes"] = [n for n in r["nodes"] if n["id"] in
                            {"pr:" + repo + ":" + str(i) for i in numbers}]
              r["meta"]["registeredOnlyRepositories"].append(repo)
              g["PR_BATCH_SIZE"] = 1
              rows, fresh, _, inventory = u["collect_repository"](repo, "none", {**old, "prs":prior})
              issues = {}
              assert len(rows) == len(numbers) and set(fresh).issuperset(numbers)
              u["recheck_snapshot_mergeability"](list(fresh.values()), [p for s in rows for p in (s,*s["imports"])], repo)
          finally:
              r.clear()
              r.update(saved)
          maintainers = u["fetch_maintainers"]()
          nodes = {n["id"]:n for n in r["nodes"]}
          current = {}
          for pr in rows:
              key = "pr:"+repo+":"+str(pr["number"])
              node = nodes[key]
              if pr["status"] == "open":
                  pr = u["with_maintainer_reviewers"](pr, maintainers)
                  pr["publicImportDisposition"] = u["public_import_disposition"](pr,node.get("approvedPatch"),node.get("landedPatch"))
              current[pr["url"]] = pr
          prs = [current.get(p["url"],p) for p in old["prs"]]
          assert len({p["url"] for p in prs}) == len(prs)

          now = datetime.now(timezone.utc).isoformat()
          report = u["check_report"](prs,old)
          snap = {**old,"checkedAt":now,"registryDate":r["meta"]["updatedAt"],"prs":prs,"issues":{**old["issues"],**issues},
                  "reviewerHandoff":u["reviewer_handoff"](prs,old),
                  "mergeabilityHandoff":u["mergeability_handoff"](report,old),"checkFailures":report["checkFailures"],
                  "workStates":u["record_states"](prs,r,old,now)}
          snap["limits"] = {**old["limits"],"curationRefresh":{"prs":sorted(numbers),"issues":sorted(issues),"requests":g["requests"],
              "graphqlCost":g["query_cost"],"previousFullSnapshot":old["checkedAt"],"repositoryObservation":inventory}}
          if sweep := u["feedback_sweep"](r,[*prs,*old["reviewPRs"]],old,now):
              snap["projectFeedbackReview"] = sweep
          p.write_text(json.dumps(snap,indent=2,ensure_ascii=False)+"\n")
          PYTHON
          cp github-status.json results/
      - name: Check the data used to render the cards
        run: |
          node metadata-preflight.mjs . > results/preflight.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          nodes = {n["id"]: n for n in json.loads(Path("registry.json").read_text())["nodes"]}
          snap = json.loads(Path("github-status.json").read_text())
          observed = {p["url"]:p for p in snap["prs"]}
          n = nodes["pr:buildbuddy-io/buildbuddy:14022"]
          pr = observed[n["url"]]
          assert n["head"] == pr["head"] == "bd7d2e4c3b3a57d1fd19da69ae3edc452aa2cc00"
          assert n["status"] == pr["status"] == "merged"
          assert pr["mergeCommit"] == "1002071cabdfee4eaa61955531f6efe730b01dfd"
          assert pr["mergedAt"] == "2026-11-02T19:15:25Z"
          branch = nodes["branch:buildbuddy:oci-empty-image-root"]
          assert branch["inactive"] is True
          assert "contributorReview" not in n and "contributorReview" not in branch
          registry = json.loads(Path("registry.json").read_text())
          inv = next(i for i in registry["investigations"] if i["id"] == "investigation:scratch-build-actions")
          assert not inv["nextStep"].startswith("Submit")
          assert inv["nextStep"].startswith("Wait for an executor rollout or version signal")
          assert "No DPDK target was executed" in inv["findings"][-1]["text"]
          assert "current pool’s executor version is unknown" in inv["findings"][-1]["text"]
          assert any(e["url"] == "https://github.com/tamird/gvisor/actions/runs/41715196042/artifacts/13268568889" for e in inv["findings"][-1]["evidence"])
          assert snap["limits"]["curationRefresh"]["prs"] == [14022]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-work-map-pair
          path: results/
          if-no-files-found: error
