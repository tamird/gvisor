name: Verify the snapshot paired with the short-link reminder
on:
  push:
    branches: [qualification/work-map-nine-character-reminders]
permissions:
  actions: read
  contents: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Verify the matching registry and retained citation results
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: 897197dcd67453d02d0ba8d4fa161f2a9d4aaa74
          ORIGINAL: 17bb3caa4f6f7a41c2ffcd1a8746078ce7281fd7
          METADATA: 8d9dec8dba40d30344f383d4a835cc99651a02fb
        run: |
          set -eu -o pipefail
          test "$(git rev-parse HEAD^)" = "$ORIGINAL"
          test "$(git rev-parse HEAD^^)" = "$PRODUCT"
          test "$(git diff --name-only "$PRODUCT" HEAD)" = .github/workflows/work-map.yml
          test "$(git rev-parse "$PRODUCT":github-status.json)" = "$(git rev-parse "$METADATA":github-status.json)"
          mkdir results "$RUNNER_TEMP/paired"
          cp app.js github-status.json "$RUNNER_TEMP/paired/"
          git show "$METADATA":registry.json > "$RUNNER_TEMP/paired/registry.json"
          node metadata-preflight.mjs "$RUNNER_TEMP/paired" >results/preflight.json
          gh api repos/tamird/gvisor/actions/artifacts/13170777426/zip >"$RUNNER_TEMP/original.zip"
          echo "04c3088d2e3990c4b623e27a1ec5bb1d8c6d8e2741e54a6cb02c2e0028aaa059  $RUNNER_TEMP/original.zip" | sha256sum --check
          python3 - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile
          import json
          import os

          with ZipFile(Path(os.environ["RUNNER_TEMP"]) / "original.zip") as archive:
              old = json.loads(archive.read("verdict.json"))
          assert old["source"] == os.environ["ORIGINAL"] and old["productionSource"] == os.environ["PRODUCT"]
          assert old["verdict"] == "FAIL" and old["exitCodes"] == {"browser": 0, "planner": 0, "snapshot": 1}
          assert (old["browserTests"], old["plannerTests"]) == (87, 106)
          reminder = old["reminder"]
          assert reminder["head"] == "fa7daa135f0ca5de5461ac4b27f046632707e5e2"
          assert (reminder["action"], reminder["approvers"], reminder["status"]) == ("restore-import-label", ["kerumeto"], "due")
          assert sha256(reminder["body"].encode()).hexdigest() == "9773294b879ef3383ce0956e9e62077d99ef64622a15df9c99b50d05ee3e1824"
          preflight = json.loads(Path("results/preflight.json").read_bytes())
          assert preflight["status"] == "PASS"
          verdict = {"source": os.environ["GITHUB_SHA"], "metadataSource": os.environ["METADATA"],
                     "original": old, "preflight": preflight, "verdict": "PASS",
                     "verifiedAt": datetime.now(timezone.utc).isoformat()}
          Path("results/verdict.json").write_text(json.dumps(verdict, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: work-map-qualification
          path: results
          if-no-files-found: error
