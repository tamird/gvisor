name: Verify the matching Bazel export and TCP reply decision
on:
  push:
    branches: [qualification/work-map-tcp-close-reply]
permissions:
  contents: read
  actions: read
jobs:
  collect:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Restore the exact canonical pair from the original observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, io, json, subprocess, zipfile
          from pathlib import Path
          zdata=subprocess.check_output(["gh","api","repos/tamird/gvisor/actions/artifacts/13261329547/zip"])
          assert hashlib.sha256(zdata).hexdigest()=="e5a24c849836225a604c528b9d6e8d57f6780a13ea03817e09f3baeb0e712fb1"
          with zipfile.ZipFile(io.BytesIO(zdata)) as z:
              assert set(z.namelist())=={"registry.json","github-status.json","preflight.json"}
              r=z.read("registry.json"); s=z.read("github-status.json"); pre=json.loads(z.read("preflight.json"))
          assert pre["status"]=="PASS" and Path("registry.json").read_bytes()==r
          for name,data in (("registry.json",r),("github-status.json",s),("app.js",Path("app.js").read_bytes())):
              assert hashlib.sha256(data).hexdigest()==pre["inputs"][name]["sha256"]
          out=Path("results"); out.mkdir(); (out/"registry.json").write_bytes(r);(out/"github-status.json").write_bytes(s)
          Path("github-status.json").write_bytes(s)
          PYTHON
      - name: Check the data used to render the cards
        run: |
          node metadata-preflight.mjs . > results/preflight.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          nodes = {n["id"]: n for n in json.loads(Path("registry.json").read_text())["nodes"]}
          snap = json.loads(Path("github-status.json").read_text())
          observed = {p["url"]:p for p in snap["prs"]}
          from hashlib import sha256
          q=nodes["pr:16801"]
          pr=observed[q["url"]]
          exports=[n for n in pr["imports"] if n["number"]==16913]
          assert len(exports)==1 and exports[0]["sourceHead"]==q["head"]==pr["approvedHead"]
          assert exports[0]["head"].startswith("2b8dfbe8f") and exports[0]["matchesSourceHead"]
          assert "contributorReview" not in q
          n=nodes["issue:16908"]
          c=n["contributorReview"]
          assert c["kind"]=="reply" and c["status"]=="pending" and c["url"]==n["url"]
          assert sha256(c["body"].encode()).hexdigest()=="dd17552a4cd630f82a4b7aa31356bdb9fdc4b12a4477c6ca06bf7b55e12b45d3"
          assert snap["issues"][n["id"]]["githubState"]=="open"
          assert snap["workStates"][n["id"]]["contributor-review"]["scope"]==n["url"]
          assert "pr:16886" not in nodes and len(snap["limits"]["curationRefresh"]["prs"])==1
          assert any(e["url"].endswith("/13261282119") for e in nodes["branch:goimports-in-process-diff"]["evidence"])
          assert any(e["url"].endswith("/13256418500") for e in nodes["pr:16864"]["evidence"])
          i=next(i for i in json.loads(Path("registry.json").read_text())["investigations"] if i["id"]=="investigation:tcp-issues-and-reviews")
          assert any("1,844" in f["text"] and "1,988" in f["text"] and "both FINs" in f["text"] for f in i["findings"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-work-map-pair
          path: results/
          if-no-files-found: error
