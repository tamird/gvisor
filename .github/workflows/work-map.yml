name: Refresh work map

"on":
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      check_outreach_only:
        description: Read the fork outreach policy with the delivery credential
        type: boolean
        default: false

concurrency:
  group: work-map-publication
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    if: github.repository == 'tamird/gvisor' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 30 }}
    permissions:
      contents: write
      pages: write
    env:
      WORK_MAP_POSTING_PAUSED: ${{ vars.WORK_MAP_POSTING_PAUSED }}
      WORK_MAP_REVIEW_ROTATIONS_ENABLED: ${{ vars.WORK_MAP_REVIEW_ROTATIONS_ENABLED }}
    steps:
      - name: Check out the published site
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: Collect, validate and publish the snapshot
        id: snapshot
        if: ${{ !inputs.check_outreach_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            source=$(git rev-parse HEAD)
            node --test app_test.mjs
            python3 -m unittest discover -p '*_test.py'
            python3 update-status.py
            git add -- github-status.json
            git diff --cached --quiet && exit 0
            git commit -m 'Refresh public GitHub work status'
            if git push origin HEAD:gh-pages; then
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --no-tags origin gh-pages
            # A lost push response may still have published the commit.
            if [[ $(git rev-parse origin/gh-pages) == "$(git rev-parse HEAD)" ]]; then
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Only a changed source permits recollection. Authentication or
            # transport failures against the same head remain errors.
            if [[ $(git rev-parse origin/gh-pages) == "$source" ]]; then
              exit 1
            fi
            # Never merge a snapshot collected against an older registry.
            # The local snapshot is committed, so switching preserves it.
            git switch --detach origin/gh-pages
            echo "Publication raced with a site update (attempt $attempt)."
          done
          echo 'Site updates superseded all three snapshots; the next scheduled refresh will collect again.' >> "$GITHUB_STEP_SUMMARY"
      - name: Request the configured Pages build
        if: steps.snapshot.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/tamird/gvisor/pages/builds --jq '{status, url}'
      - name: Choose outreach mode
        id: outreach
        env:
          COMMENT_TOKEN_CONFIGURED: ${{ secrets.WORK_MAP_COMMENT_TOKEN != '' }}
          GH_TOKEN: ${{ secrets.WORK_MAP_COMMENT_TOKEN || github.token }}
          CHECK_ONLY: ${{ inputs.check_outreach_only || false }}
        run: |
          reviews=plan
          reminders=plan
          if [[ "$COMMENT_TOKEN_CONFIGURED" == true ]]; then
            if policy=$(python3 -c 'from outreach_delivery import live_posting_mode; print(live_posting_mode())'); then
              echo "Verified fork outreach policy: $policy" >> "$GITHUB_STEP_SUMMARY"
              echo "Verified fork outreach policy: $policy"
              case "$policy" in
                all) reviews=post; reminders=post ;;
                rotations) reviews=post ;;
                unknown) [[ "$CHECK_ONLY" != true ]] || exit 1 ;;
              esac
            else
              echo 'Cannot verify the fork outreach policy. All delivery is held.' >> "$GITHUB_STEP_SUMMARY"
              [[ "$CHECK_ONLY" != true ]] || exit 1
            fi
          else
            echo 'No outreach credential is configured. All delivery is held.' >> "$GITHUB_STEP_SUMMARY"
            [[ "$CHECK_ONLY" != true ]] || exit 1
          fi
          echo "reviews=$reviews" >> "$GITHUB_OUTPUT"
          echo "reminders=$reminders" >> "$GITHUB_OUTPUT"
      - name: Remind approvers of amended source
        if: ${{ !inputs.check_outreach_only }}
        env:
          GH_TOKEN: ${{ secrets.WORK_MAP_COMMENT_TOKEN || github.token }}
          MODE: ${{ steps.outreach.outputs.reminders }}
        run: python3 update-status.py --reapproval-reminders "$MODE"
      - name: Follow up on outstanding source reviews
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 15 }}
        if: ${{ !inputs.check_outreach_only && !cancelled() && steps.outreach.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.WORK_MAP_COMMENT_TOKEN || github.token }}
          WORK_MAP_SCHEDULED_REVIEW_OUTREACH: ${{ github.event_name == 'schedule' }}
          MODE: ${{ steps.outreach.outputs.reviews }}
        run: python3 update-status.py --review-outreach "$MODE"
