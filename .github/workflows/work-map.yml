name: Check cached work map startup and refresh
on:
  push:
    branches: [qualification/work-map-legacy-rbe]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner && github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 6, persist-credentials: false}
      - name: Confirm the exact source and both published metadata generations
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 51a149e34a1ccd510c15a6b3c9973f01839178d5
          test "$(git rev-parse HEAD~4)" = ab7a2286aecc6b29c5a72d1c5db40a3208570e15
          node metadata-preflight.mjs .
          mkdir "$RUNNER_TEMP/legacy"
          cp app.js "$RUNNER_TEMP/legacy/"
          for file in registry.json github-status.json; do git show "HEAD~4:$file" > "$RUNNER_TEMP/legacy/$file"; done
          if node metadata-preflight.mjs "$RUNNER_TEMP/legacy" >"$RUNNER_TEMP/negative.log" 2>&1; then exit 1; fi
          grep -F 'Invalid human-only action' "$RUNNER_TEMP/negative.log"
      - name: Run all website tests
        run: |
          node --test app_test.mjs
          python3 -B -m unittest discover -p '*_test.py'
      - name: Open the real cached registry and refresh in headless Chromium
        run: python3 -B .github/qualification/legacy-rbe-browser.py
