name: Check investigation review subscriptions
on: workflow_dispatch
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify the work map and collect its real review subscriptions
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          node --test app_test.mjs
          python3 -m unittest discover -p '*_test.py'
          python3 update-status.py
          python3 - <<'CHECK'
          import json
          from pathlib import Path
          r=json.loads(Path("github-status.json").read_text())
          external={row['number']:row for row in r['reviewPRs']}
          numbers={15325,16659,16660}
          assert set(external)==numbers, set(external)
          assert all(external[n]['repo']=='google/gvisor' and external[n]['feedback']['complete'] for n in numbers)
          assert not numbers & {row['number'] for row in r['prs'] if row.get('repo','google/gvisor')=='google/gvisor'}
          print([(n, external[n]['head']) for n in sorted(numbers)])
          CHECK
