name: Verify the compiler and checkpoint review cards
on:
  push:
    branches: [qualification/work-map-compiler-plugin-and-gc]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'tamird/gvisor' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Run the canonical collector on the proposed Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = c419d43867db4241c026b50a109346fa1c16aba6
          git checkout --detach c419d43867db4241c026b50a109346fa1c16aba6
          python3 -B update-status.py
      - name: Validate the collected pair and run its existing tests
        run: |
          python3 -B - <<'PYTHON'
          import datetime, hashlib, json, re, subprocess
          from pathlib import Path

          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == 'c419d43867db4241c026b50a109346fa1c16aba6'
          commands = [['node', 'metadata-preflight.mjs', '.'],
                      ['python3', '-B', '-m', 'unittest', 'work_states_test', 'update_status_test'],
                      ['node', '--test', '--test-reporter=tap', 'app_test.mjs']]
          expected = [' '.join(command) for command in commands]
          record = dict(source=source, expected=expected, executed=[], failed=[], skipped=[], missing=expected.copy())
          for command, label in zip(commands, expected, strict=True):
              result = subprocess.run(command, capture_output=True, text=True)
              if result.returncode:
                  print(result.stdout[-5000:], result.stderr[-5000:])
              record['executed'].append(label)
              record['missing'].remove(label)
              if result.returncode:
                  record['failed'].append(label)
              elif command == commands[0]:
                  record['preflight'] = json.loads(result.stdout)
              if command == commands[1]:
                  record['pythonTests'] = [int(n) for n in re.findall(r'^Ran (\d+) tests?', result.stderr, re.M)]
              elif command == commands[2]:
                  record['jsCounts'] = {k:int(n) for k,n in re.findall(r'^# (tests|pass|fail|skipped) (\d+)$', result.stdout, re.M)}
          snapshot = json.loads(Path('github-status.json').read_text())
          before = json.loads(subprocess.check_output(['git', 'show', 'HEAD:github-status.json']))
          current = {p['number']:p for p in snapshot['prs'] if p.get('repo', 'google/gvisor') == 'google/gvisor'}
          handoffs = [p['number'] for p in current.values() if p.get('terminalImportHandoff')]
          checks = dict(fresh=snapshot['checkedAt'] > before['checkedAt'],
                        requestBudget=1 <= snapshot['limits']['requests'] <= 64,
                        registryUnchanged=not subprocess.run(['git','diff','--quiet','HEAD','--','registry.json']).returncode)
          registry = json.loads(Path('registry.json').read_text())
          previous = json.loads(subprocess.check_output(['git','show',source+'^:registry.json']))
          nodes = {n['id']:n for n in registry['nodes']}
          old = {n['id']:n for n in previous['nodes']}
          cid = 'branch:hermetic-compiler-review'
          gc_id = 'pr:16735'
          checks['scope'] = (set(nodes) == set(old) and
                             {k for k in old if nodes[k] != old[k]} == {cid, gc_id} and
                             registry['groups'] == previous['groups'] and
                             registry['investigations'] == previous['investigations'])
          c = nodes[cid]
          checks['compiler'] = (c['contributorReview']['head'] == c['head'] == '9310f06f95b100725450a71fbb896fc8403ec0eb' and
                                c['contributorReview']['baseHead'] == 'd96acc0400cec7c48d942c361dbddbc49299fa09' and
                                c['settledReviews'] == old[cid]['settledReviews'] and
                                {'13451067474', '13451557204', '13450896863'} <= {e['url'].rsplit('/', 1)[-1] for e in c['evidence']})
          checks['parents'] = ({e['from'] for e in registry['edges'] if e['to'] == cid and e['type'] == 'depends_on'} ==
                               {'pr:16522', 'pr:16586', 'pr:16516', 'branch:systrap-native-stub'})
          g = nodes[gc_id]
          review = g['contributorReview']
          numbers = ('+3.98%', '+3.64%', '+1.33%', '+30.12%')
          checks['checkpoint'] = (review['kind'] == 'reply' and review['head'] == g['head'] == 'c31b2adc27b1d19b1e647b3239cd2b3b536a5adf' and
                                  review['url'].endswith('issuecomment-6629323131') and all(x in review['body'] for x in numbers) and
                                  '<details>' in review['body'] and g['settledReviews'] == old[gc_id]['settledReviews'])
          cu={e['url'] for e in c['evidence']}
          originals={'https://github.com/tamird/gvisor/actions/runs/42105048733/artifacts/13451318656','https://github.com/tamird/gvisor/actions/runs/42106951758/artifacts/13451568393'}
          checks['transportAndCatalog']=originals<=cu and originals<=set(c['followup']['evidence']) and all(t in c['summary'] for t in ('both verified all 220 dependencies','disposable catalog','148 Clang objects','Neither executable started','3f0bd3a70')) and all(t in c['followup']['nextAction'] for t in ('static GNU pthread and dl','gvisor_sentry_plugin_stack','then test startup')) and 'both optional plugin executables link and start on the submission base' in c['contributorReview']['summary']
          checks['exactReviewBodies']=hashlib.sha256(c['contributorReview']['body'].encode()).hexdigest()=='3411e26ce7bdd5a83662af8f11bd6402983b301fea9ec0f6833d4e30f2c83e5d' and hashlib.sha256(review['body'].encode()).hexdigest()=='93c8dc557074fb2c6a648ce131a82d6e7f34f3a482355320d90c02ca638e11e5' and hashlib.sha256(json.dumps(g,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()=='910a580cd3d70d3b8aaf1627e8a83005793c4dd71a9063a27937a67c03e03811'
          checks['unrelatedEdges'] = ([e for e in registry['edges'] if e['to'] != cid] ==
                                      [e for e in previous['edges'] if e['to'] != cid])
          record.update(requests=snapshot['limits']['requests'], requestLimit=64,
                        checkedAt=snapshot['checkedAt'], previousCheckedAt=before['checkedAt'], reminderPosting=False,
                        liveChecks=checks, terminalImportHandoffs=handoffs,
                        cases={n:{'head':p['head'], 'status':p['status'], 'handoff':n in handoffs}
                               for n,p in current.items() if n in (16516,16522,16586,16735,17064)},
                        finished=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                        exitCode=int(bool(record['failed']) or not all(checks.values())),
                        hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in
                                ('github-status.json','registry.json','app.js','update-status.py','work_states.py','update_status_test.py','README.md')})
          Path('verdict.json').write_text(json.dumps(record, indent=2))
          raise SystemExit(record['exitCode'])
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: work-map-verdict
          path: |
            verdict.json
            github-status.json
          if-no-files-found: error
