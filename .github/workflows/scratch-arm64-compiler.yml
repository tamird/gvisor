name: Qualify native ARM64 release compiler actions
on:
  push:
    branches: [qualification/scratch-arm64-compiler]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'tamird/gvisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      QUALIFICATION_ARCH: arm64
      QUALIFICATION_COMMIT: ${{ github.sha }}
      QUALIFICATION_EXECUTION: remote-actions
      QUALIFICATION_LANES: build
      QUALIFICATION_LOCAL_TEST_REQUIREMENTS: namespace
      QUALIFICATION_CLOCK_SOURCE: calibrated
      QUALIFICATION_HEADER_BASE: ''
      QUALIFICATION_COS_SHA256: ''
      QUALIFICATION_COS_GZIP_BASE64: ''
      QUALIFICATION_TARGETS: //vdso:vdso.so //pkg/abi/linux:linux //tools/package_version:package_version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Verify the frozen graph and reviewed stateify source
        run: |
          cp test/rbe/scratch-release.lock MODULE.bazel.lock
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          mkdir -p "$RUNNER_TEMP/publication"
          sha256sum --check test/rbe/stateify-source.sha256
          bazelisk mod graph --lockfile_mode=error --depth=1 --output=json > "$RUNNER_TEMP/module-graph.json"
          curl -fsSL --retry 2 --max-time 120 https://github.com/buildbuddy-io/bazel/releases/download/5.0.488/bazel-5.0.488-linux-x86_64 -o "$RUNNER_TEMP/bb"
          echo "f0d85b1514f784dc25705dd3bbeeaa1e603b5449f721c26add0245198f03e7cb  $RUNNER_TEMP/bb" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bb"
      - name: Build real release prerequisites on native ARM64 scratch workers
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          BB_LOG_DECODER: ${{ runner.temp }}/bb
        run: |
          bash test/rbe/actions.sh \
            --bazel-option=--host_platform=//tools/bazeldefs:rbe_linux_arm64 \
            --bazel-option=--extra_execution_platforms=//tools/bazeldefs:rbe_linux_arm64 \
            --bazel-option=--remote_download_outputs=toplevel \
            '--bazel-option=--modify_execution_info=^(CppCompile|CppLink|GoStateify|GoCompilePkg|GoLink)$=+no-remote-cache'
      - name: Verify exact worker actions, target architectures and build exit separately
        if: ${{ !cancelled() }}
        env:
          BB_LOG_DECODER: ${{ runner.temp }}/bb
        run: python3 test/rbe/native_arm_compiler.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-arm64-compiler-evidence
          path: ${{ runner.temp }}/publication/arm64.json
          if-no-files-found: warn
