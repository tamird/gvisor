name: Complete the robust-list positive analyzer control
on:
  push:
    branches: [qualification/robust-list-positive-recovery]
permissions:
  contents: read
  actions: read
jobs:
  catalog:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == 1
    name: Missing positive owner only
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: carrier
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7160231be01096832973a93f08cf52690284f070
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Preserve the original timeout and completed negative control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tamird/gvisor/actions/artifacts/13273541045/zip > "$RUNNER_TEMP/robust-original.zip"
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          from zipfile import ZipFile
          root = Path(os.environ["RUNNER_TEMP"])
          archive = root / "robust-original.zip"
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == "a8e6fa41c9c762cdeddc2b4654508de42ae8bd21a73d45e38990984a7df93cfb"
          with ZipFile(archive) as z:
              assert len(z.namelist()) == 2 and set(z.namelist()) == {"final-positive/result.json", "final-negative/result.json"}
              data = {mode: z.read("final-" + mode + "/result.json") for mode in ("positive", "negative")}
          positive, negative = [json.loads(data[mode]) for mode in ("positive", "negative")]
          assert positive["source"] == "7160231be01096832973a93f08cf52690284f070" and positive["native_exit"] == 124
          assert positive["executions"] == [] and positive["reports"] == [] and positive["status"] == "FAIL"
          assert negative["source"] == "589f967e4cebd1c6a1e2db1c4d27ce90ddc7d187" and negative["native_exit"] == 3
          assert negative["status"] == "EXPECTED_FAILURE" and len(negative["executions"]) == 1
          attempt, = negative["executions"]
          assert attempt["remote"] and not attempt["cached"] and attempt["status"] == "FAILED"
          assert attempt["owner"] == "//pkg/sentry/kernel:kernel_test_nogo"
          assert set(negative["negative_control"]) == {"amd64", "arm64"}
          assert all(set(checks) == {"GetRobustList", "SetRobustList", "exitRobustList_read", "exitRobustList_clear"}
                     and all(checks.values()) for checks in negative["negative_control"].values())
          for mode, raw in data.items():
              out = root / ("final-original-" + mode)
              out.mkdir()
              (out / "result.json").write_bytes(raw)
          PYTHON
      - name: Execute only the missing positive analyzer owner
        working-directory: source
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          ARCH: amd64
          CPU: x86_64
          WORKER_IMAGE: docker://gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          ISOLATION: firecracker
          SHA: 7160231be01096832973a93f08cf52690284f070
        shell: bash
        run: |
          set -eu -o pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git rev-parse HEAD^)" = b21a9d4eea7b0066232c33c63df9cf20ed987f6f
          test "$(git -C ../carrier rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C ../carrier rev-parse HEAD:test/rbe/qualification_report.py)" = d2e3eedabc2ad911d958aa448fd916aa6835aa86
          test "$(git -C ../carrier rev-parse HEAD:test/rbe/unit_matrix.py)" = d01d9e319084e18ea2928671e417e1b4e86c4954
          mkdir -p "$RUNNER_TEMP/catalog_platform"
          platform=$RUNNER_TEMP/catalog_platform
          printf '%s\n' 'module(name="catalog_platform")' > "$platform/MODULE.bazel"
          cat > "$platform/BUILD" <<BUILD
          platform(
              name = "gnu",
              constraint_values = ["@platforms//cpu:$CPU", "@platforms//os:linux"],
              exec_properties = {
                  "Arch": "$ARCH",
                  "OSFamily": "linux",
                  "workload-isolation-type": "$ISOLATION",
                  "container-image": "$WORKER_IMAGE",
                  "EstimatedMemory": "8GB",
              },
              visibility = ["//visibility:public"],
          )
          BUILD
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          rc=$RUNNER_TEMP/catalog.bazelrc
          umask 077
          trap 'rm -f "$rc"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
              'build --remote_cache=grpcs://remote.buildbuddy.io' \
              'build --bes_backend=grpcs://remote.buildbuddy.io' \
              'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
              'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
              'build --remote_accept_cached' 'build --remote_cache_compression' 'build --jobs=100' \
              "build --inject_repository=catalog_platform=$platform" \
              'build --host_platform=@catalog_platform//:gnu' \
              'build --extra_execution_platforms=@catalog_platform//:gnu' \
              "build --platforms=//tools/bazeldefs:linux_$ARCH"
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          python3 -B ../carrier/test/rbe/qualify_fd_table.py "robust-list-positive" "$ARCH" "$SHA" "$rc" "$RUNNER_TEMP/final-positive"
      - name: Check bounded public reports
        id: privacy
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          key = os.environ["BUILDBUDDY_API_KEY"]
          assert key
          files = list(Path(os.environ["RUNNER_TEMP"]).glob("final-*/result.json"))
          assert files
          for p in files:
              assert p.is_file() and not p.is_symlink() and p.stat().st_size < 100000
              b = p.read_bytes()
              json.loads(b)
              assert key.encode() not in b and json.dumps(key)[1:-1].encode() not in b
              assert not re.search(rb"x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_", b, re.I)
          PY
      - if: always() && steps.privacy.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: robust-list-positive-recovery
          path: |
            ${{ runner.temp }}/final-original-negative/result.json
            ${{ runner.temp }}/final-original-positive/result.json
            ${{ runner.temp }}/final-positive/result.json
          if-no-files-found: error
