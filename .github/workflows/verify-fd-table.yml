name: Reconcile checkpoint file tests from their original outputs
on:
  push:
    branches: [qualification/stateipc-original-reports]
permissions:
  contents: read
  actions: read
jobs:
  reports:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind the exact original artifact and report reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 3a506e0c40391a106abf8aaab442dc90b6c5e695
          helper=680739b629229eb1c8fa91aa1147d1bca71eb04f
          git fetch --quiet --depth=1 origin "$helper"
          git show "$helper:test/rbe/cas_inputs.py" > "$RUNNER_TEMP/cas_inputs.py"
          gh api repos/tamird/gvisor/actions/artifacts/13286109234/zip > "$RUNNER_TEMP/original.zip"
          cp test/rbe/qualify_fd_table.py "$RUNNER_TEMP/"
      - name: Verify two original Go XML and stdout pairs
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B "$RUNNER_TEMP/qualify_fd_table.py" --original-only
      - name: Screen the bounded projection
        id: privacy
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'recovery.json'
          assert path.is_file() and not path.is_symlink() and path.stat().st_size < 32768
          raw = path.read_text()
          for k in ('BUILDBUDDY_API_KEY','GH_TOKEN'):
              value = os.environ[k]
              assert value and value not in raw and json.dumps(value)[1:-1] not in raw
          assert not re.search(r'(?i)(?:authorization|x-buildbuddy-api-key)\s*[:=]|github_pat_|gh[pousr]_',raw)
          json.loads(raw)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: stateipc-original-results
          path: ${{ runner.temp }}/recovery.json
          if-no-files-found: error
