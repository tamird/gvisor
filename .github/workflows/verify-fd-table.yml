name: Read the original failed race build diagnostic
on:
  push:
    branches: [qualification/task-foreign-fd-race-original]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind the original receipt and declared reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/race-public"
          printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/race-public/verdict.json"
          test "$(git rev-parse HEAD^)" = 4a7a97630c3c55828573878756a79eba1344dd94
          cp test/rbe/qualify_fd_table.py "$RUNNER_TEMP/"
          gh api repos/tamird/gvisor/actions/artifacts/13313558551/zip > "$RUNNER_TEMP/original.zip"
          helper=680739b629229eb1c8fa91aa1147d1bca71eb04f
          git fetch --quiet --depth=1 origin "$helper"
          git show "$helper:test/rbe/cas_inputs.py" > "$RUNNER_TEMP/cas_inputs.py"
          python3 -m py_compile "$RUNNER_TEMP/qualify_fd_table.py"
      - name: Read only the original invocation console
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -B "$RUNNER_TEMP/qualify_fd_table.py" --original-only
      - name: Check the compact public receipt
        if: always()
        id: privacy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'race-public'
          assert {p.name for p in directory.iterdir()} == {'verdict.json'}
          path = directory / 'verdict.json'
          assert path.is_file() and not path.is_symlink()
          assert 0 < path.stat().st_size < 128 * 1024
          data = path.read_text()
          assert len(data.encode()) < 128 * 1024
          for name in ('BUILDBUDDY_API_KEY', 'GH_TOKEN'):
              value = os.environ[name]
              assert value and value not in data and json.dumps(value)[1:-1] not in data
          assert not re.search(r'(?i)(?:authorization|x-buildbuddy-api-key)\s*[:=]|github_pat_|gh[pousr]_', data)
          json.loads(data)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: fd-race-original-diagnostic
          path: ${{ runner.temp }}/race-public/verdict.json
          if-no-files-found: error
