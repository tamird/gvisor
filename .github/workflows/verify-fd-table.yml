name: Verify the protected PIDFD lookup under the Go race detector
on:
  push:
    branches: [qualification/task-foreign-fd-race-gnu]
permissions:
  contents: read
  actions: read
jobs:
  catalog:
    if: github.repository == 'tamird/gvisor' && github.actor == 'tamird' && github.event.created && github.run_attempt == 1
    name: One race-instrumented kernel test on Linux AMD64
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: carrier
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 97bfc4ae73a4e74751f4db335918970889807bb6
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Bind the original failed invocation and its recovered build error
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          mkdir "$RUNNER_TEMP/final-race"
          printf '%s\n' '{"status":"INCOMPLETE","phase":"bootstrap"}' > "$RUNNER_TEMP/final-race/result.json"
          gh api repos/tamird/gvisor/actions/artifacts/13314253662/zip > "$RUNNER_TEMP/fd-race-original.zip"
          echo "8d7b6dbb4a2b83ca9ab862415cf4b74f4be296974b55c0aec739fcfa6c3d11a5  $RUNNER_TEMP/fd-race-original.zip" | sha256sum -c -
          python3 - <<'BIND'
          from pathlib import Path
          import os, json, zipfile
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"]) / "fd-race-original.zip") as z:
              assert z.namelist() == ["verdict.json"]
              r = json.loads(z.read("verdict.json"))
          assert r["status"] == "ORIGINAL_LOGS_READ" and r["console"]["forward"]["complete"]
          assert r["original_zip_sha256"] == "3c63c39edb79de1535951590a711b295b72984ecbb2741831a8d5eb0f4672b16"
          old = r["original"]
          assert old["native_exit"] == 1 and old["cases"] == old["executions"] == []
          assert old["source"] == "97bfc4ae73a4e74751f4db335918970889807bb6" and old["invocations"] == ["ec927e06-b03e-4103-97b5-fe60c96e9c52"]
          assert any("path inclusion s found in rule" in " ".join(d["words"]) for d in r["console"]["forward"]["diagnostics"])
          BIND
      - name: Run the same protected test with the GNU release client and worker
        working-directory: source
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          ARCH: amd64
          CPU: x86_64
          WORKER_IMAGE: docker://gcr.io/gvisor-presubmit/default_x86_64@sha256:cff9bcf01c7a23182b2bb44520cfeb3375b6b138ddca3ab2e121bc54015e754a
          ISOLATION: firecracker
          SHA: 97bfc4ae73a4e74751f4db335918970889807bb6
        shell: bash
        run: |
          set -eu -o pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git rev-parse HEAD^)" = 8cdb6eb0da66ecf93b0a5e32a2ee970016833a5a
          test "$(git -C ../carrier rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C ../carrier rev-parse HEAD^)" = 4a7a97630c3c55828573878756a79eba1344dd94
          test "$(git -C ../carrier rev-parse HEAD^^)" = "$SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' pkg/sentry/kernel/BUILD pkg/sentry/kernel/fd_table_test.go)"
          test "$(git diff --numstat HEAD^ -- pkg/sentry/kernel/BUILD)" = "$(printf '1\t0\tpkg/sentry/kernel/BUILD')"
          test "$(git rev-parse HEAD:pkg/sentry/kernel/BUILD)" = edee10c38f47263b9d611805e09bb3c8fc56700f
          test "$(git rev-parse HEAD:pkg/sentry/kernel/fd_table_test.go)" = eaa1bc48fb34f0b86217249b9ee04c7bb7dc7c9d
          donor=611a6ff017c528dddbd0d2e643aaf23c6ddac488
          git fetch --quiet --no-tags --depth=1 origin "$donor"
          test "$(git rev-parse "$donor:test/rbe/qualification_report.py")" = d2e3eedabc2ad911d958aa448fd916aa6835aa86
          test "$(git rev-parse "$donor:test/rbe/unit_matrix.py")" = d01d9e319084e18ea2928671e417e1b4e86c4954
          for helper in qualification_report unit_matrix; do
            git show "$donor:test/rbe/$helper.py" > "$RUNNER_TEMP/$helper.py"
          done
          export PYTHONPATH="$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/catalog_platform"
          platform=$RUNNER_TEMP/catalog_platform
          printf '%s\n' 'module(name="catalog_platform")' > "$platform/MODULE.bazel"
          cat > "$platform/BUILD" <<BUILD
          platform(
              name = "gnu",
              constraint_values = ["@platforms//cpu:$CPU", "@platforms//os:linux"],
              exec_properties = {
                  "Arch": "$ARCH",
                  "OSFamily": "linux",
                  "workload-isolation-type": "$ISOLATION",
                  "container-image": "$WORKER_IMAGE",
                  "EstimatedMemory": "8GB",
              },
              visibility = ["//visibility:public"],
          )
          BUILD
          mkdir "$RUNNER_TEMP/fd-race-bin"
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/fd-race-bin/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $RUNNER_TEMP/fd-race-bin/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/fd-race-bin/bazel"
          export PATH="$RUNNER_TEMP/fd-race-bin:$PATH"
          test "$(cat .bazelversion)" = 9.3.1
          export USE_BAZEL_VERSION
          USE_BAZEL_VERSION=$(cat images/default/bazelversion)
          test "$(bazel --version)" = "bazel 9.3.1"
          rc=$RUNNER_TEMP/catalog.bazelrc
          umask 077
          trap 'rm -f "$rc"' EXIT
          {
            printf '%s\n' 'build --remote_executor=grpcs://remote.buildbuddy.io' \
              'build --remote_cache=grpcs://remote.buildbuddy.io' \
              'build --bes_backend=grpcs://remote.buildbuddy.io' \
              'build --bes_results_url=https://app.buildbuddy.io/invocation/' \
              'build --spawn_strategy=remote' 'build --noremote_local_fallback' \
              'build --remote_accept_cached' 'build --remote_cache_compression' 'build --jobs=100' \
              "build --inject_repository=catalog_platform=$platform" \
              'build --host_platform=@catalog_platform//:gnu' \
              'build --extra_execution_platforms=@catalog_platform//:gnu' \
              "build --platforms=//tools/bazeldefs:linux_$ARCH"
            printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
            printf 'build --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY"
          } > "$rc"
          unset BUILDBUDDY_API_KEY
          image=${WORKER_IMAGE#docker://}
          timeout 180 docker pull --platform=linux/amd64 "$image"
          docker run -d --name fd-race-gnu --entrypoint /bin/bash --user root \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" "$image" -c 'sleep infinity'
          trap 'docker rm -f fd-race-gnu >/dev/null 2>&1 || true; rm -f "$rc"' EXIT
          test "$(docker exec -e USE_BAZEL_VERSION fd-race-gnu "$RUNNER_TEMP/fd-race-bin/bazel" --version)" = 'bazel 9.3.1'
          docker exec -e USE_BAZEL_VERSION -e WORKER_IMAGE -e PYTHONPATH -e RUNNER_TEMP \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e "GIT_CONFIG_VALUE_0=$PWD" \
            -e "PATH=$RUNNER_TEMP/fd-race-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            fd-race-gnu python3 -B ../carrier/test/rbe/qualify_fd_table.py race "$ARCH" "$SHA" "$rc" "$RUNNER_TEMP/final-race"
      - name: Check bounded public reports
        id: privacy
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          key = os.environ["BUILDBUDDY_API_KEY"]
          assert key
          files = list(Path(os.environ["RUNNER_TEMP"]).glob("final-*/result.json"))
          assert files == [Path(os.environ["RUNNER_TEMP"]) / "final-race/result.json"]
          for p in files:
              assert p.is_file() and not p.is_symlink() and p.stat().st_size < 100000
              b = p.read_bytes()
              json.loads(b)
              assert key.encode() not in b and json.dumps(key)[1:-1].encode() not in b
              assert not re.search(rb"x-buildbuddy-api-key|authorization\s*[:=]|github_pat_|gh[pousr]_", b, re.I)
          PY
      - if: always() && steps.privacy.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: task-foreign-fd-race-gnu
          path: |
            ${{ runner.temp }}/final-race/result.json
          if-no-files-found: error
