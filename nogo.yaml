groups:
  # Checklocks fixtures contain intentional violations. Check their analyzer
  # output without the suppressions used for production code.
  - name: checklocks_tests
    regex: "^tools/checklocks/test/"
    default: false
  # We define three basic groups: generated (all generated files),
  # external (all files outside the repository), and internal (all
  # files within the local repository). We can't enforce many style
  # checks on generated and external code, so enable those cases
  # selectively for analyzers below.
  - name: generated
    regex: "^(bazel-genfiles|bazel-out|bazel-bin)/"
    default: true
  - name: external
    regex: "^external/"
    default: false
  - name: internal
    regex: ".*"
    default: true
global:
  generated:
    suppress:
      # Suppress the basic style checks for
      # generated code, but keep the analysis
      # that are required for quality & security.
      - "should not use ALL_CAPS in Go names"
      - "should not use underscores"
      - "comment on exported"
      - "methods on the same type should have the same receiver name"
      - "at least one file in a package"
      - "package comment should be of the form"
      # Generated code may have dead code paths.
      - "identical build constraints"
      - "no value of type"
      - "is never used"
      # go_embed_data rules generate unicode literals.
      - "string literal contains the Unicode format character"
      - "string literal contains the Unicode control character"
      - "string literal contains Unicode control characters"
      - "string literal contains Unicode format and control characters"
      # Some external code will generate protov1
      # implementations. These should be ignored.
      - "proto.* is deprecated"
      - "xxx_messageInfo_.*"
      - "receiver name should be a reflection of its identity"
      # Generated gRPC code is not compliant either.
      - "error strings should not be capitalized"
      - "grpc.Errorf is deprecated"
      # Generated proto code does not always follow capitalization conventions.
      - "(field|method|struct|type) .* should be .*"
      # Generated proto code sometimes duplicates imports with aliases.
      - "duplicate import"
      # These will never be annotated.
      - "^unexpected call to atomic function"
      - "may require checklocks annotation for"
      # Generated proto code creates declarations like 'var start int = iNdEx'
      - "should omit type .* from declaration; it will be inferred from the right-hand side"
  external:
    suppress:
      # buildssa can't handle certain packages (cmd/...).
      - "panic recovered: interface conversion: types.Type is nil"
      - "panic recovered: runtime error: invalid memory address or nil"
      - "panic recovered: no type for \\*ast.CallExpr"
      - "panic recovered: interface conversion: types.Type is \\*types.Basic"
      - "panic recovered: no type for \\*ast.BinaryExpr"
      - "panic recovered: no type for \\*ast.SelectorExpr"
      - "panic recovered: no types.Object for ast.Ident SetTypeErrors"
      - "panic recovered: unexpected CompositeLit type: invalid type"
      - "panic recovered: interface conversion: ssa.Member is \\*ssa.NamedConst"
    exclude:
      - ".*/vet/testdata/.*"
      - ".*/runtime/testdata/.*"
  internal:
    suppress:
      # We use ALL_CAPS for system definitions,
      # which are common enough in the code base
      # that we shouldn't annotate exceptions.
      #
      # Same story for underscores.
      - "should not use ALL_CAPS in Go names"
      - "should not use underscores in Go names"
      # These need to be annotated.
      - "^unexpected call to atomic function.*"
      - "return with unexpected locks held.*"
      - "incompatible return states.*"
      - "may require checklocks annotation for.*"
      # For some reason, the types package falls down.
      - "panic recovered: .*types/sizes.go:82: assertion failed"
    exclude:
      # Generated: exempt all.
      - pkg/shim/v1/runtimeoptions/runtimeoptions_cri.go
analyzers:
  asmdecl:
    generated: # Enabled.
    external:
      exclude: [".*"] # Disabled.
    internal:
      suppress:
        # Valid reasons to break the rules.
        - "xgetbv: invalid MOVL of ret"
        - "xgetbv: invalid offset ret"
        - "wrmsr: invalid MOVL of value"
        - "wrmsr: invalid offset value"
        - "rdmsr: invalid MOVL of ret"
        - "rdmsr: invalid offset ret"
        # Non-conventional functions.
        - "\\[amd64\\].*sysret: RET without writing to 8-byte"
        - "\\[amd64\\].*iret: RET without writing to 8-byte"
        - "\\[amd64\\].*exception: use of .* points beyond argument frame"
        - "\\[amd64\\].*retjmp: use of .* points beyond argument frame"
        - "\\[arm64\\].*HaltEl1ExceptionAndResume: unknown variable"
        - "\\[arm64\\].*HaltEl1ExceptionAndResume: use of .* points beyond argument frame"
  assign:
    external:
      exclude:
        - gazelle/walk/walk.go
  atomic:
    external: # Enabled.
  bools:
    external: # Enabled.
  buildtag:
    external: # Enabled.
  cgocall:
    external: # Enabled.
  checklocks:
    checklocks_tests: # Enabled.
    internal:
      exclude:
        - "^-$" # b/181776900: analyzer fails on buildkite.
  shadow: # Disable for now.
    generated:
      exclude: [".*"]
    internal:
      exclude: [".*"]
  fieldalignment:
    internal:
      exclude:
        - ".*" # Temporary: migrate fieldalignment.
        # CPU offsets, including self at zero, are fixed by hardware entry assembly.
        - '^pkg/ring0/defs\.go:63:10$'
        # CPUArchState offsets are fixed by entry_amd64.s.
        - '^pkg/ring0/defs_amd64\.go:148:19$'
        # kernelEntry offsets are fixed by entry_amd64.s and bluepill_amd64.s.
        - '^pkg/ring0/defs_amd64\.go:106:18$'
        # Preserve fastPathState's documented hot-field cache-line partitions.
        - '^pkg/sentry/platform/systrap/metrics\.go:197:20$'
        # SIOCETHTOOL requires the ifreq name before its data pointer.
        # https://man7.org/linux/man-pages/man7/netdevice.7.html
        - '^runsc/sandbox/network_unsafe\.go:31:12$'
        # KVM_SET_DEVICE_ATTR requires flags/group/attr/addr at offsets 0/4/8/16.
        # https://docs.kernel.org/virt/kvm/api.html#kvm-set-device-attr-kvm-get-device-attr
        - '^pkg/sentry/platform/kvm/machine_amd64_unsafe\.go:132:8$'
        # eface mirrors the runtime interface layout read by kernelAddr.
        - '^pkg/ring0/kernel_unsafe\.go:22:12$'
        # Keep chunks last to preserve MapInternal's documented cache-line layout.
        - '^pkg/sentry/pgalloc/pgalloc\.go:56:17$'
        # Reader and Writer keep pool at the allocation base for SetFinalizer.
        - '^pkg/compressio/compressio\.go:436:13$'
        - '^pkg/compressio/compressio\.go:735:13$'
        # maptype mirrors Go's internal/abi.MapType prefix used by MapKeyHasher.
        - '^pkg/sync/runtime_unsafe\.go:110:[0-9]+$'
        # These fixtures test declaration-order binary encoding and padding.
        - '^pkg/binary/binary_test\.go:(73|156):[0-9]+$'
        # The trailing zero-size field distinguishes non-direct from direct layout.
        - '^pkg/state/graph_typeinfo_test\.go:173:[0-9]+$'
        # Keep the embedded ring entry at a nonzero container offset in this fixture.
        - '^pkg/ilist/ring_test\.go:21:[0-9]+$'
        # Type1 exercises non-packed multi-field and padding marshal layouts.
        - '^tools/go_marshal/test/test\.go:27:[0-9]+$'
        # The first shared field exercises root aliases at zero byte offset.
        - '^pkg/state/graph_decode_callbacks_test\.go:813:[0-9]+$'
        # These AIO structs separate caller and async-goroutine state by cache line.
        - '^pkg/sentry/pgalloc/save_restore\.go:(647|1339|1444):[0-9]+$'
    generated:
      exclude:
        - ".*" # Temporary: migrate fieldalignment.
        # Shard padding separates mutation and lookup data into cache lines.
        - '^bazel-out/[^/]+/bin/pkg/(sync/locking/atomicptrmap_(ancestors|goroutine)_unsafe|sentry/state/stateipc/(destination|source)file_atomicptrmap_unsafe|sync/atomicptrmap/test_atomicptrmap(_sharded)?_unsafe)\.go:(85|87):[0-9]+$'
        - '^bazel-out/[^/]+/bin/pkg/sentry/state/stateipc/(destination|source)file_atomicptrmap_unsafe\.go:79:[0-9]+$'
        # Segment nodes keep lookup keys and hasChildren in the first cache line.
        - '^bazel-out/[^/]+/bin/pkg/(segment/test/(gap|int)_set|state/addr_set)\.go:992:[0-9]+$'
  bloop:
    internal:
      exclude:
        - ".*" # Temporary: migrate bloop.
        # Measure and StartTimer regions exclude per-iteration setup and cleanup.
        - '^sandboxexec/sandbox/sandbox_bench_test\.go:(74|107|124|146):[0-9]+$'
        - '^test/benchmarks/base/startup_test\.go:(42|170|212):[0-9]+$'
        - '^test/benchmarks/media/ffmpeg_test\.go:42:[0-9]+$'
    generated:
      exclude:
        - ".*" # Temporary: migrate bloop.
  waitgroupgo:
    internal:
      exclude:
        - ".*" # Temporary: migrate waitgroupgo.
        # The pinned compiler keeps an escaping callback plus WaitGroup.Go's wrapper.
        - '^pkg/sentry/kernel/aio\.go:29:2$'
    generated:
      exclude:
        - ".*" # Temporary: migrate waitgroupgo.
  scannererr:
    internal:
      exclude:
        # readUntil treats read errors and EOF as an unsuccessful match.
        - '^pkg/test/testutil/testutil\.go:758:8$'
  slicesbackward:
    internal:
      exclude:
        - ".*" # Temporary: migrate slicesbackward.
        # Reverse indexing keeps mountMu checks in the locked function.
        - '^pkg/sentry/vfs/propagation\.go:530:6$'
    generated:
      exclude:
        - ".*" # Temporary: migrate slicesbackward.
  rangeint:
    internal:
      exclude:
        - ".*" # Temporary: migrate rangeint.
        # Indexed loops preserve checklocks' TryLock path analysis in LockUser.
        - '^pkg/tcpip/transport/tcp/endpoint\.go:(684|704):[0-9]+$'
    generated:
      exclude:
        - ".*" # Temporary: migrate rangeint.
  stditerators:
    internal:
      exclude:
        - ".*" # Temporary: migrate stditerators.
        # Indexing keeps guarded calls in the annotated function for checklocks.
        - '^pkg/state/graph_typeinfo_unsafe\.go:334:[0-9]+$'
        # Indexing keeps Register's guarded accesses in its locked function.
        - '^pkg/urpc/urpc\.go:241:[0-9]+$'
    generated:
      exclude:
        - ".*" # Temporary: migrate stditerators.
  framepointer:
    internal:
      exclude:
        # These hardware entry/return paths construct or restore the vCPU frame.
        - '^pkg/ring0/entry_amd64\.s:(433|523|689):[0-9]+$'
        # retjmp restores the saved frame before the signal-return epilogue.
        - '^pkg/sigframe/sigframe_amd64\.s:85:[0-9]+$'
  directive:
    generated:
      exclude:
        # The NBSP fixture verifies that malformed whitespace does not grant nosplit.
        - '^bazel-out/[^/]+/bin/tools/checkescape/test1/nosplit\.go:'
  reflectvaluecompare:
    internal:
      exclude:
        # An identical reflect.Value descriptor in disjoint ranges means inconsistent
        # address registration; distinct objects may have equal contents.
        - '^pkg/state/encode\.go:896:[0-9]+$'
  errorsas:
    external: # Enabled.
      exclude:
        # Specific broken case.
        - ".*/cmd/go/internal/modload/list.go"
  httpresponse:
    external: # Enabled.
  loopclosure:
    external: # Enabled.
  nilfunc:
    external: # Enabled.
  nilness:
    internal:
      exclude:
        - pkg/sentry/platform/kvm/kvm_test.go # Intentional.
        - tools/bigquery/bigquery.go          # False positive.
        - "-"                                 # No filename.
  printf:
    external: # Enabled.
      suppress:
        - "fmt.Fprintln arg list ends with redundant newline"
        - "non-constant format string in call to .*"
      exclude:
        # Starting in 1.26, printf reports misuse of %q with more types. Many
        # of these are unfixed in upstream projects.
        - codes/codes.go # go.opentelemetry.io/otel
        - yaml.go # github.com/go-openapi/swag/yamlutils
        - staticcheck/sa1030/sa1030.go # staticcheck
        # Starting in 1.27, printf reports misuse of %d with pointers.
        - route.go # github.com/vishvananda/netlink
  shift:
    generated: # Disabled for generated code; these shifts are well-defined.
      exclude: [".*"]
    external:
      exclude:
        - ".*unix/syscall_linux.go" # False positive on line 2002.
  stringintconv:
    external:
      exclude:
        - ".*protobuf/.*.go"              # Bad conversions.
        - ".*flate/huffman_bit_writer.go" # Bad conversion.
        # Runtime internal violations.
        - ".*reflect/value.go"
        - ".*encoding/xml/xml.go"
        - ".*runtime/pprof/internal/profile/proto.go"
        - ".*fmt/scan.go"
        - ".*go/types/conversions.go"
        - ".*golang.org/x/net/dns/dnsmessage/message.go"
  tests:
    external: # Enabled.
  unmarshal:
    external: # Enabled.
  unreachable:
    external: # Enabled.
      exclude:
        - ".*jsonschema/reader.go"
        - ".*protobuf/.*.go"
  unsafeptr:
    internal:
      exclude:
        - ".*_test.go"                                             # Exclude tests.
        - pkg/aio/aio_linux_unsafe.go                              # Special case.
        - pkg/eventfd/eventfd_unsafe.go                            # Special case.
        - "pkg/flipcall/.*_unsafe.go"                              # Special case.
        - pkg/memutil/memutil_unsafe.go                            # Special case.
        - pkg/tcpip/link/sharedmem/sharedmem_unsafe.go             # Special case.
        - pkg/gohacks/noescape_unsafe.go                           # Special case.
        - pkg/ring0/pagetables/allocator_unsafe.go                 # Special case.
        - pkg/sentry/devices/nvproxy/frontend_mmap_unsafe.go       # Special case.
        - pkg/sentry/fsutil/mmap_unsafe.go                         # Special case.
        - pkg/sentry/pgalloc/pgalloc_unsafe.go                     # Special case.
        - pkg/sentry/platform/kvm/bluepill_unsafe.go               # Special case.
        - pkg/sentry/platform/kvm/machine_unsafe.go                # Special case.
        - pkg/sentry/platform/kvm/bluepill_amd64_unsafe.go         # Special case.
        - pkg/sentry/platform/pgalloc/pgalloc_unsafe.go            # Special case.
        - pkg/sentry/platform/ptrace/stub_unsafe.go                # Special case.
        - pkg/sentry/platform/systrap/stub_unsafe.go               # Special case.
        - pkg/sentry/platform/systrap/syscall_thread_unsafe.go     # Special case.
        - pkg/sentry/platform/systrap/sysmsg_thread_unsafe.go      # Special case.
        - pkg/sentry/platform/systrap/subprocess_unsafe.go         # Special case.
        - pkg/sentry/platform/safecopy/safecopy_unsafe.go          # Special case.
        - pkg/sentry/platform/slimvm/bluepill_unsafe.go            # Special case.
        - pkg/sentry/platform/slimvm/machine_unsafe.go             # Special case.
        - pkg/sentry/platform/slimvm/bluepill_amd64_unsafe.go      # Special case.
        - pkg/sentry/state/stateipc/common_unsafe.go               # Special case.
        - pkg/sentry/usage/memory_unsafe.go                        # Special case.
        - pkg/sentry/vfs/mount_unsafe.go                           # Special case.
        - pkg/sigframe/sigframe_amd64_unsafe.go                    # Special case.
        - pkg/state/decode_unsafe.go                               # Special case.
  unusedresult:
    external: # Enabled.
  checkescape:
    external: # Enabled.
      suppress:
        # External libraries may not have binaries (e.g. stdlib testdata, etc.),
        # so these cases can be safely ignored.
        - "no such file or directory"
  checklinkname:
    external: # Enabled.
      suppress:
        # Suppress bad linkname directives in the internals. These will be fixed
        # in the bug: https://github.com/golang/go/issues/58440
        - "symbol \"runtime_pollWaitCanceled\".*"
        - "symbol \"runtime_procPin\".*"
        - "symbol \"registerMetric\".*"
      exclude:
        - ".*/containerd/sys/subprocess_unsafe_linux.go"
    internal:
      suppress:
        # See above.
        - "symbol \"runtime_pollWaitCanceled\".*"
        - "symbol \"runtime_procPin\".*"
    generated:
      suppress:
        # See above.
        - "symbol \"runtime_pollWaitCanceled\".*"
        - "symbol \"runtime_procPin\".*"
  SA1019: # Use of deprecated identifier.
    internal:
      suppress:
        # Nogo's Go 1.27 compiler archives require NewReader before Read.
        # Remove when the export-data producer switches to cmd/export:
        # https://github.com/golang/tools/blob/v0.53.0/go/gcexportdata/gcexportdata.go
        - '^golang\.org/x/tools/go/gcexportdata\.NewReader is deprecated:'
        # OCI prestart hooks remain supported for existing container configurations.
        - '^\(github\.com/opencontainers/runtime-spec/specs-go\.Hooks\)\.Prestart is deprecated:'
        # The cgroup v1 controller still honors this setting on older host kernels.
        - '^\(github\.com/opencontainers/runtime-spec/specs-go\.LinuxMemory\)\.Kernel is deprecated:'
  SA2001: # Empty critical section.
    internal:
      exclude:
        - pkg/sentry/fs/fs.go          # Intentional.
        - pkg/sentry/fs/gofer/inode.go # Intentional.
        - pkg/refs/refcounter_test.go  # Intentional.
        # Lock-order validator tests intentionally have no protected data.
        - '^pkg/sync/locking/lockdep_test\.go:'
  SA4006: # Unused value assigned to variable.
    internal:
      exclude:
        - runsc/boot/network.go # Pattern increments fdOffset after every use.
  SA4016: # Useless bitwise operations.
    internal:
      exclude:
        - pkg/gohacks/noescape_unsafe.go # x ^ 0 always equals x.
  SA4023: # Impossible condition.
    internal:
      exclude:
        - runsc/boot/loader.go     # Intersect in native_arm64.go always returns error on arm64.
        - runsc/sandbox/network.go # Stubs in no_xdp.go always return error when built without XDP.
  ST1019: # Multiple imports of the same package.
    generated:
      exclude:
        # package ".../kubeapi/core/v1/v1" is being imported more than once
        - generated.gen.pb.go
  ST1021: # Doc should start with type name.
    internal:
      exclude:
        - "pkg/abi/nvgpu/.*.go"
      suppress:
        - "comment on exported type Translation" # Intentional.
        - "comment on exported type PinnedRange" # Intentional.

  QF1001: # Apply De Morgan’s law
    # Controversial.
    internal:
      exclude: [".*"]
  QF1008: # Omit embedded fields from selector expression
    # Controversial.
    internal:
      exclude: [".*"]
  stringsseq:
    internal:
      exclude:
        - ".*" # Temporary: migrate stringsseq.
    generated:
      exclude:
        - ".*" # Temporary: migrate stringsseq.
  newexpr:
    internal:
