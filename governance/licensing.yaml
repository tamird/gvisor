  - dependency: nvidia_driver_550_90_12
    license: *nvidia_driver_licenses
    exception_rationale: *nvidia_driver_rationale
  - dependency: nvidia_driver_570_124_06
    license: *nvidia_driver_licenses
    exception_rationale: *nvidia_driver_rationale
  - dependency: nvidia_driver_570_133_20
    license: *nvidia_driver_licenses
