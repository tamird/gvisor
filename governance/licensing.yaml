      - GPL-3.0-or-later
    exception_rationale: *helper_image_resolver
  - dependency: busybox_source
    license: LicenseRef-BusyBox-1.38.0-source-bundle
    exception_rationale: >-
      This exact BusyBox release supplies a standalone shell and selected
      utility applets for the PIDFD test image, not code linked into
      released gVisor binaries. Its aggregate LICENSE specifies GPL-2.0
      only; individual files retain GPL/LGPL, BSD, MIT, ISC, bzip2 and
      public-domain terms. The image keeps the aggregate license and
      supplemental shell and support-source notices. Unused applets and
      build inputs remain distinct from the shipped executable.
      This manual record applies only to the exact URL and archive hash
      and requires renewed review when either changes.
  - dependency: bzip2
    license: bzip2-1.0.6
    exception_rationale: >-
      Supplies the execution-platform compressor used by BusyBox's source
      generators. This build tool is neither linked into gVisor release
      binaries nor installed in the PIDFD test image. The pinned release
      retains its bzip2 license and source notices.
  - dependency: coreutils_source
    license: LicenseRef-Coreutils-9.11-source-bundle
    exception_rationale: >-
      This exact GNU Coreutils release supplies only standalone timeout
      for the PIDFD test image, not code linked into released gVisor
      binaries. Timeout is GPL-3.0-or-later; bundled support and build
      sources retain GPL/LGPL, BSD, ISC, X11, public-domain and GNU
      distribution exceptions, with alternative CC0, OpenSSL or Apache
      terms for unused BLAKE2 sources. Unshipped documentation includes
      GFDL-1.3-or-later without invariant sections or cover texts. The
      image keeps COPYING and supplemental support-source notices.
      This manual record applies only to the exact URL and
      archive hash and requires renewed review when either changes.
  - dependency: gawk
    license: LicenseRef-Gawk-source-bundle
    exception_rationale: >-
      GNU awk is a separate image-assembly build tool, not an image
      payload or a library linked into released gVisor binaries. The
      manually audited archive includes GPL program code, the AGPL
      persistent-memory allocator selected by the default Linux build,
      LGPL and BSD support, X11 and public-domain components, and GNU
      build-script distribution and output exceptions. Its unshipped
      documentation includes GFDL manuals with the GNU General Public
      License, Introduction, and History invariant sections, specified
      cover texts, and separate copying and translation permissions.
      These terms apply only to the exact pinned source bundle and
      require renewed review when its URL or archive hash changes.
  - dependency: google_root_pem
    license: NOASSERTION
    exception_rationale: >-
      Not software: a bundle of CA root certificates from https://pki.goog,
      installed as trust anchors in test images only and never part of
      released gVisor binaries.
  - dependency: gperf
    license: LicenseRef-Gperf-3.1-source-bundle
    exception_rationale: >-
      GNU gperf generates Coreutils headers on the execution platform; it
      is not an image payload or code linked into gVisor release binaries.
      Its program and support sources are GPL-3.0-or-later. The archive
      also retains X11 and public-domain build helpers, GNU distribution
      exceptions and separate manual copying and translation terms.
      This manual record applies only to the exact source URL and archive
      hash and requires renewed review when either changes.
  - dependency: grpc
    license:
      - Apache-2.0
      - BSD-3-Clause
      - MPL-2.0
    exception_rationale: >-
      gRPC is Apache-2.0; its LICENSE file additionally embeds notices for
      bundled components, including the MPL-2.0 text covering Mozilla's CA
      certificate data (etc/roots.pem). Used by Bazel build and test tooling
      only. Released gVisor binaries use the pure-Go google.golang.org/grpc.
  - dependency: kythe_release
    license:
      - Apache-2.0
      - NCSA
    exception_rationale: >-
      Kythe is Apache-2.0; its LICENSE also includes the legacy LLVM
      University of Illinois/NCSA grant for incorporated LLVM code. That
      grant permits redistribution with copyright notices, conditions and
      disclaimers retained, and prohibits using contributors' names for
      endorsement without permission.
  - dependency: linux_pidfd
    license: LicenseRef-Linux-6.8-source-bundle
    exception_rationale: >-
      This exact Linux 6.8 source archive supplies standalone GPL-2.0
      pidfd selftests, their headers and runner scripts. The image does
      not contain a built kernel or the unused drivers and documentation.
      COPYING specifies GPL-2.0 with Linux-syscall-note for the kernel
      aggregate; individual files retain their GPL/LGPL, alternative
      permissive, combined-license and documentation terms. The retained
      primary notices include the full LICENSES directory, GFDL terms,
      and the JFFS2 inline/template exception and FlashPoint alternative.
      The complete member and raw SPDX indexes preserve the scope of
      the review, including files without SPDX annotations; they do not
      establish an exhaustive inventory of embedded grants. This manual
      record applies only to the exact URL and archive hash and requires
      renewed review when either changes.
  - dependency: llvm-raw
    license:
      - Apache-2.0 WITH LLVM-exception
      - NCSA
    exception_rationale: >-
      LLVM is part of the NVIDIA GPU test toolchain only and is not
      distributed with gVisor. The LLVM exception only relaxes
      Apache-2.0's requirements. LICENSE.TXT also includes LLVM's legacy
      University of Illinois/NCSA grant, which permits redistribution with
      copyright notices, conditions and disclaimers retained and prohibits
      using contributors' names for endorsement without permission.
  - dependency: php_test_source
    license: LicenseRef-PHP-8.5.11-source-bundle
    exception_rationale: >-
      Supplies the complete PHP source fixture, PHPT tests and companion
      files for the runtime test image, not code linked into gVisor release
      binaries. The fixture retains the PHP and Zend license texts and
      acknowledgments, bundled-library notices and source-header grants,
      including LGPL components, permissive grants and GNU build-helper
      exceptions. Only two test prerequisite declarations are patched;
      the source and notice files remain available in the image. This
      record covers the exact source URL and archive hash, separately from
      the pinned official interpreter image, and requires renewed review
      when either source pin changes.
  - dependency: qemu_user_amd64
    license: GPL-2.0-only
    exception_rationale: >-
      QEMU user-mode emulators for x86_64 build machines, run as a build tool
      to execute binaries built for the target architecture when
      cross-compiling. QEMU is neither linked into nor distributed with gVisor.
  - dependency: qemu_user_arm64
    license: GPL-2.0-only
    exception_rationale: >-
      QEMU user-mode emulators for arm64 build machines, run as a build tool
      to execute binaries built for the target architecture when
      cross-compiling. QEMU is neither linked into nor distributed with gVisor.
