# Dependency licensing policy, enforced by tools/licensecheck's tests against
# tools/licensecheck/dependencies.yaml.
#
# allowed_licenses lists the license identifiers that dependencies may use.
# exceptions lists dependencies that are allowed to use other licenses; each
# entry must match the dependency's current licenses exactly (string for one
# license, sorted list for several, as in dependencies.yaml) so that license
# changes resurface for review, and must explain why the exception is
# acceptable.
allowed_licenses:
  - Apache-2.0
  - 0BSD
  - BSD-2-Clause
  - BSD-2-Clause-FreeBSD
  - BSD-3-Clause
  - MIT
  - MIT-0
  - ISC
  - OpenSSL
  - OpenSSL-standalone
  - PSF-2.0
  - Python-2.0
  - Python-2.0.1
  - PostgreSQL
  - SSLeay-standalone
  - UPL-1.0
  - X11
  - Zlib
  - Google patent license for Golang
exceptions:
  - dependency: apt/helper_image_packages/amd64/base-files
    license:
      - GPL-2.0-or-later
      - GPL-3.0
      - GPL-3.0-or-later
    exception_rationale: &helper_image_notices >-
      Supplies the common license texts and package notice retained with
      the selected GNU runtime in the profiling helper image. These
      files are image data, not inputs linked into gVisor release
      binaries.
  - dependency: apt/helper_image_packages/amd64/ca-certificates
    license:
      - GPL-2.0
      - GPL-2.0-or-later
      - MPL-2.0
    exception_rationale: &helper_image_ca >-
      Supplies the CA trust bundle shared by both Go helper images. The
      package copyright notice is retained alongside the bundle; its
      maintenance scripts are excluded from the assembled filesystem.
  - dependency: apt/helper_image_packages/amd64/coreutils
    license:
      - BSD-3-Clause
      - GFDL-1.2-no-invariants-or-later
      - GPL-3.0
      - GPL-3.0-or-later
      - ISC
    exception_rationale: &helper_image_commands >-
      Supplies only GNU rm, mkdir, and chmod in the profiling helper
      image used by Kubernetes benchmarks. The package notice and
      matching license texts are retained in the image; these tools are
      separate executables from the Go helper and gVisor release
      binaries.
  - dependency: apt/helper_image_packages/amd64/dpkg
    license:
      - BSD-2-Clause
      - GPL-2.0
      - GPL-2.0-or-later
    exception_rationale: &helper_image_resolver >-
      Resolver dependency of the pinned helper-image packages. Its
      payload is not copied into either helper image: their declared
      layers select the CA bundle, three GNU commands, and the
      explicitly required runtime files.
  - dependency: apt/helper_image_packages/amd64/gcc-12-base
    license:
      - Artistic-1.0-Perl
      - BSD-2-Clause
      - BSD-3-Clause
      - BSD-4-Clause-UC
      - GFDL-1.2
