    license: NOASSERTION
    exception_rationale: >-
      Not software: a bundle of CA root certificates from https://pki.goog,
      installed as trust anchors in test images only and never part of
      released gVisor binaries.
  - dependency: grpc
    license:
      - Apache-2.0
      - BSD-3-Clause
      - MPL-2.0
    exception_rationale: >-
      gRPC is Apache-2.0; its LICENSE file additionally embeds notices for
      bundled components, including the MPL-2.0 text covering Mozilla's CA
      certificate data (etc/roots.pem). Used by Bazel build and test tooling
      only. Released gVisor binaries use the pure-Go google.golang.org/grpc.
  - dependency: iperf
    license:
      - BSD-3-Clause
      - BSD-3-Clause-LBNL
      - HPND
      - MIT
    exception_rationale: >-
      Iperf3 is a standalone network benchmark, not linked into gVisor.
      The image retains its full upstream LICENSE, including the LBNL
      enhancement grant, bundled BSD/MIT/HPND notices and Illinois terms,
      alongside the Apache-2.0 license for its linked OpenSSL dependency.
  - dependency: kythe_release
    license:
      - Apache-2.0
      - NCSA
    exception_rationale: >-
      Kythe is Apache-2.0; its LICENSE also includes the legacy LLVM
      University of Illinois/NCSA grant for incorporated LLVM code. That
      grant permits redistribution with copyright notices, conditions and
      disclaimers retained, and prohibits using contributors' names for
      endorsement without permission.
  - dependency: llvm-raw
    license:
      - Apache-2.0 WITH LLVM-exception
      - NCSA
    exception_rationale: >-
      LLVM is part of the NVIDIA GPU test toolchain only and is not
      distributed with gVisor. The LLVM exception only relaxes
      Apache-2.0's requirements. LICENSE.TXT also includes LLVM's legacy
      University of Illinois/NCSA grant, which permits redistribution with
      copyright notices, conditions and disclaimers retained and prohibits
      using contributors' names for endorsement without permission.
  - dependency: qemu_user_amd64
    license: GPL-2.0-only
    exception_rationale: >-
      QEMU user-mode emulators for x86_64 build machines, run as a build tool
      to execute binaries built for the target architecture when
      cross-compiling. QEMU is neither linked into nor distributed with gVisor.
  - dependency: qemu_user_arm64
    license: GPL-2.0-only
    exception_rationale: >-
      QEMU user-mode emulators for arm64 build machines, run as a build tool
      to execute binaries built for the target architecture when
      cross-compiling. QEMU is neither linked into nor distributed with gVisor.
