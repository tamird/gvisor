      - GPL-2.0
      - GPL-2.0-only
      - HPND
      - ISC
      - LGPL-2.1
      - LGPL-2.1-or-later
      - Spencer-94
    exception_rationale: &helper_image_runtime >-
      Supplies a required dynamic library or loader for the three GNU
      commands in the profiling helper image. Its package notice and
      matching license texts are retained. The Go helpers remain static
      binaries.
  - dependency: apt/helper_image_packages/amd64/libcrypt1
    license: LicenseRef-libxcrypt-4.4.27
    exception_rationale: &helper_image_libcrypt >-
      The exact pinned artifact retains its previously audited per-file
