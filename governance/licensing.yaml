# Dependency licensing policy, enforced by tools/licensecheck's tests against
# tools/licensecheck/dependencies.yaml.
#
# allowed_licenses lists the license identifiers that dependencies may use.
# exceptions lists dependencies that are allowed to use other licenses; each
# entry must match the dependency's current licenses exactly (string for one
# license, sorted list for several, as in dependencies.yaml) so that license
# changes resurface for review, and must explain why the exception is
# acceptable.
allowed_licenses:
  - Apache-2.0
  - 0BSD
  - BSD-2-Clause
  - BSD-2-Clause-FreeBSD
  - BSD-3-Clause
  - MIT
  - MIT-0
  - ISC
  - OpenSSL
  - OpenSSL-standalone
  - PSF-2.0
  - Python-2.0
  - Python-2.0.1
  - PostgreSQL
  - SSLeay-standalone
  - UPL-1.0
  - X11
  - Zlib
  - Google patent license for Golang
exceptions:
  - dependency: gawk
    license: GPL-3.0-or-later
    exception_rationale: >-
      The source-built executable is used by rules_distroless to process
      tar metadata when constructing the release test's tool image. It is
      neither linked into nor included in the gVisor release artifacts.
  - dependency: github.com/opencontainers/go-digest
    license: &module_documentation_licenses
      - Apache-2.0
      - CC-BY-SA-4.0
    exception_rationale: &go_digest_documentation_rationale >-
      The module's code is Apache-2.0. Its LICENSE.docs contains CC-BY-SA-4.0
      for the README and CONTRIBUTING documentation already in the archive.
      Allow this complete bundled-notice set for the existing module inputs;
      the documentation license does not reclassify the Go code. The README's
      Attribution wording differs from the full ShareAlike text in LICENSE.docs,
      so retain the latter identifier without resolving that wording conflict.
  - dependency: google_root_pem
    license: NOASSERTION
    exception_rationale: >-
      Not software: a bundle of CA root certificates from https://pki.goog,
      installed as trust anchors in test images only and never part of
      released gVisor binaries.
  - dependency: grpc
    license:
      - Apache-2.0
      - BSD-3-Clause
      - MPL-2.0
    exception_rationale: >-
      gRPC is Apache-2.0; its LICENSE file additionally embeds notices for
      bundled components, including the MPL-2.0 text covering Mozilla's CA
      certificate data (etc/roots.pem). Used by Bazel build and test tooling
      only. Released gVisor binaries use the pure-Go google.golang.org/grpc.
  - dependency: kythe_release
    license:
      - Apache-2.0
      - NCSA
    exception_rationale: >-
      Kythe is Apache-2.0; its LICENSE also includes the legacy LLVM
      University of Illinois/NCSA grant for incorporated LLVM code. That
      grant permits redistribution with copyright notices, conditions and
      disclaimers retained, and prohibits using contributors' names for
      endorsement without permission.
  - dependency: libpluginstack
    license:
      - Apache-2.0
      - BSD-3-Clause
      - CC0-1.0
    exception_rationale: >-
      The existing TLDK plugin uses Apache-2.0 libraries, the CC0-1.0
      implementation in lib/libtle_l4p/halfsiphash.h, and BSD-3-Clause code
      in its DPDK patch series. This records those existing dependencies
      when replacing the plugin's implicit source downloads with pinned
      Bazel inputs. The optional GPL packetdrill integration is not built.
  - dependency: llvm-raw
    license:
      - Apache-2.0 WITH LLVM-exception
      - NCSA
    exception_rationale: >-
      LLVM is part of the NVIDIA GPU test toolchain only and is not
      distributed with gVisor. The LLVM exception only relaxes
      Apache-2.0's requirements. LICENSE.TXT also includes LLVM's legacy
      University of Illinois/NCSA grant, which permits redistribution with
      copyright notices, conditions and disclaimers retained and prohibits
      using contributors' names for endorsement without permission.
  - dependency: module_proxy/codeql_go_modules/github.com/apache/arrow/go/v15
    license:
      - Apache-2.0
      - BSD-2-Clause
      - BSD-3-Clause
      - BSL-1.0
      - HPND
      - MIT
      - NCSA
      - OpenSSL
      - Zlib
    exception_rationale: >-
      The CodeQL analysis uses the same Arrow archive and complete root-notice
      set already allowed for the Syzkaller proxy. Apply the same exception
      to CodeQL's copy. Retain its Boost, historical c-ares and LLVM NCSA
      notices. Some notices concern C++ sources or binary
      Python distributions; the set does not establish which grants apply to
      the compiled Go packages.
  - dependency: module_proxy/codeql_go_modules/github.com/docker/go-metrics
    license: *module_documentation_licenses
    exception_rationale: &go_metrics_documentation_rationale >-
      The module's code is Apache-2.0. Its LICENSE.docs contains CC-BY-SA-4.0
      for the README and docs directory already in the archive. Allow this
      complete bundled-notice set for the existing module inputs; the
      documentation license does not reclassify the Go code. The README's
      Attribution wording differs from the full ShareAlike text in LICENSE.docs,
      so retain the latter identifier without resolving that wording conflict.
  - dependency: module_proxy/codeql_go_modules/github.com/opencontainers/go-digest
    license: *module_documentation_licenses
    exception_rationale: *go_digest_documentation_rationale
  - dependency: module_proxy/codeql_go_modules/github.com/rcrowley/go-metrics
    license: BSD-2-Clause-Views
    exception_rationale: >-
      The CodeQL analysis uses the same module archive and BSD notice already
      allowed for the exported Go proxy. Apply the same exception to CodeQL's
      copy. Preserve the final views-and-conclusions paragraph alongside the
      two redistribution conditions.
  - dependency: module_proxy/codeql_go_modules/github.com/veraison/go-cose
    license: MPL-2.0
    exception_rationale: >-
      The CodeQL profile supplies the same go-cose archive under MPL-2.0
      already allowed in the exported Go proxy. Apply the same exception to
      CodeQL's copy. The checked Linux AMD64 cgo package inventory loads no
      go-cose packages; recheck use when dependency or build configurations
      change, since this exception does not prevent importing the code.
  - dependency: module_proxy/codeql_go_modules/github.com/zeebo/assert
    license: CC0-1.0
    exception_rationale: >-
      The native Go dependency closure supplies this assertion module to the
      offline CodeQL analysis. The checked Linux AMD64 cgo package inventory
      loads no packages from it. Allow its CC0 dedication and fallback license
      for this declared input, without treating it as a patent or trademark
      grant.
  - dependency: module_proxy/exported_go_modules/github.com/docker/go-metrics
    license: *module_documentation_licenses
    exception_rationale: *go_metrics_documentation_rationale
  - dependency: module_proxy/exported_go_modules/github.com/opencontainers/go-digest
    license: *module_documentation_licenses
    exception_rationale: *go_digest_documentation_rationale
  - dependency: module_proxy/exported_go_modules/github.com/rcrowley/go-metrics
    license: BSD-2-Clause-Views
    exception_rationale: >-
      The module's LICENSE permits source and binary redistribution with
      copyright notices, conditions and disclaimers retained. Its final
      paragraph says the authors' views and conclusions do not represent
      Richard Crowley's official policies.
      This exception allows this module under BSD-2-Clause-Views, preserving
      that paragraph alongside the two redistribution conditions rather than
      reducing the notice to BSD-2-Clause.
  - dependency: module_proxy/exported_go_modules/github.com/veraison/go-cose
    license: MPL-2.0
    exception_rationale: >-
      Go-cose is in the offline Go build's dependency graph through
      containerd, hcsshim and cosesign1go. The checked Linux AMD64 cgo
      package list for gVisor's exported Go source contains no go-cose
      packages. Allow MPL-2.0 for this module. Recheck its use when
      changing dependencies or build configurations: this exception also
      permits later versions of go-cose under MPL-2.0 and does not prevent
      builds from importing the code.
  - dependency: module_proxy/syzkaller_modules/github.com/apache/arrow/go/v15
    license:
      - Apache-2.0
      - BSD-2-Clause
      - BSD-3-Clause
      - BSL-1.0
      - HPND
      - MIT
      - NCSA
      - OpenSSL
      - Zlib
    exception_rationale: >-
      The module's root LICENSE.txt aggregates Apache and third-party notices.
      The Boost, historical c-ares and LLVM NCSA grants permit use and
      redistribution subject to their respective notice, disclaimer and
      name-use conditions. This exception allows the module supplied to the
      Syzkaller build with this complete observed license set. Some notices
      explicitly concern C++ sources or binary Python distributions; the set
      does not establish which grants apply to the compiled Go packages.
  - dependency: nvidia_driver_535_129_03
    license: &nvidia_driver_licenses
      - GPL-2.0
      - MIT
    exception_rationale: &nvidia_driver_rationale >-
      These snapshots supply headers for the existing NVIDIA ABI parity test.
      COPYING licenses individual files under MIT unless otherwise noted and
      describes linked Linux kernel modules as MIT/GPLv2. The build only parses
      headers into ABI JSON; it does not build or distribute an NVIDIA kernel
      module or link driver code into gVisor. The scanner's GPL-2.0 identifier
      describes the included license text; it does not assert a later-version
      grant.
  - dependency: nvidia_driver_535_183_06
    license: *nvidia_driver_licenses
    exception_rationale: *nvidia_driver_rationale
  - dependency: nvidia_driver_535_247_01
    license: *nvidia_driver_licenses
    exception_rationale: *nvidia_driver_rationale
  - dependency: nvidia_driver_535_261_03
    license: *nvidia_driver_licenses
    exception_rationale: *nvidia_driver_rationale
