    exception_rationale: *nvidia_driver_rationale
  - dependency: plugin_dpdk
    license:
      - BSD-3-Clause
      - GPL-2.0-only
    exception_rationale: >-
      The existing plugin links DPDK's BSD-3-Clause user-space libraries
      and drivers. GPL-2.0-only applies to buildtools/pmdinfogen, which
      generates device metadata during the build and is not linked into
      the plugin archive or gVisor executables. Kernel modules are disabled.
  - dependency: pypi/setuptools-84.0.0-py3-none-any.whl
    license:
      - Apache-2.0
      - BSD-2-Clause
      - LGPL-3.0-only
      - MIT
    exception_rationale: >-
      Setuptools is the declared build backend for the Python distribution,
      used only by the Bazel execution tool. Its wheel bundles autocommand
      under LGPLv3 alongside permissively licensed dependencies. These
      tools are not distribution runtime requirements or payload files;
      the artifact verifier checks the source-only wheel payload.
