      - GPL-2.0-or-later
      - GPL-3.0
      - GPL-3.0-or-later
    exception_rationale: &integration_test_runtime >-
      Supplies the declared Ubuntu runtime for the integration test
      image: its shells, GNU tools, network utilities, and package
      dependencies. The package notices and common license texts are
      retained in the image. These executables and libraries are not
      linked into gVisor release binaries.
